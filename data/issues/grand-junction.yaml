- title: Significant Tree Ordinance repealed
  summary: At the request of the Housing Affordability Code Task Force, Council took up removing the significant tree protections (§21.07.040) from the Development Code, and the Forestry Board reported Council voted to remove them. The Forestry Board expressed disappointment, said public support for the ordinance was strong, and noted a consultant may propose an alternative, possibly incentive-based, in the Code review.
