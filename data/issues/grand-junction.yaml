- title: Rural fire and EMS costs and regional fire district
  summary: Staff cited the cost of providing rural fire and EMS service as a major budget pressure and plan to give the Rural Fire District the required two-year notice to renegotiate. The city is pursuing a regional fire district as a long-term funding solution.
