- title: Temporary moratorium on large data centers
  summary: Council discussed a temporary moratorium on large data centers because the code does not address them and they could use large amounts of power and water. No applications are pending. The ordinance was introduced Oct. 7 with a hearing set for Oct. 21. The moratorium would last until data center code amendments are adopted or 365 days pass, whichever is first.
