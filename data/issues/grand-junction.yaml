- title: Lincoln Park Barn and Certified Local Government
  summary: The Historic Preservation Board is weighing whether to pursue Certified Local Government status, which could require design standards in historic districts. Residents asked the board to nominate the Lincoln Park Barn for designation, and members asked staff to schedule a special meeting on it.
