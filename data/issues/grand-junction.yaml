- title: 2027 city budget and structural deficit
  summary: Staff reported a $6 million General Fund structural gap. The recommended 2027 budget is $317.4 million ($120.8 million General Fund), with about $2 million in personnel cuts, reduced Lincoln Park Pool hours, and $2.7 million for public safety including six police officers and three fire battalion chiefs. It also includes utility rate and golf fee increases and a $93.5 million capital program; a regional fire district is being explored. Appropriation hearings are set for November.
