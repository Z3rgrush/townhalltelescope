- title: Housing Affordability Code Task Force and Housing Action Plan
  summary: The task force is working with consultant KLJ to simplify the Development Code and TEDS manual to cut housing costs, with the effort aimed to finish in the first quarter of 2027. Council also reviewed a revised Housing Action Plan, which dropped a proposed Housing Advisory Board and moved exploring new housing revenue to years four to six. It goes to a public hearing for adoption after DOLA review.
