- title: Significant Tree Ordinance removed from development code
  summary: At the Housing Affordability Code Task Force's request, Council considered repealing the significant tree and mature tree protections in the Development Code, and voted to remove them. The Forestry Board expressed disappointment, noting strong public support, and a consultant review may bring an alternative, possibly incentive-based, later. The board is considering focusing on public trees.
