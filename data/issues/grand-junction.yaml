- title: 2027 budget and the $6 million General Fund structural gap
  summary: Staff reported a $6 million structural gap in the General Fund before new requests. The recommended 2027 budget is $317.4 million, with a $120.8 million General Fund. It includes about $2 million in personnel cuts, reduced Lincoln Park Pool hours and Dos Rios staffing, and shifting some housing programs to partners. It also adds six police officers and three fire battalion chiefs. Workshops continued Oct. 26, with formal adoption starting in November.
