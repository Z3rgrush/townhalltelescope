- title: Housing Action Plan and Juniper Grove affordable homes at the Salt Flats
  summary: Council reviewed a revised Housing Action Plan on Aug. 31, dropping a proposed Housing Advisory Board; the plan returns for a public hearing after state review. Council also took up selling about 3.3 acres of the city-owned Salt Flats at 450 28 Road to Grand Junction Homes for 48 for-sale affordable units (under 100% AMI), with the hearing continued to Sept. 16 and a funding agreement including $593,340 in water and sewer fee payments.
