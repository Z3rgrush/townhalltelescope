- title: Temporary moratorium on large data centers
  summary: Staff told Council on Sept. 14 that city code does not address data centers and their heavy power and water demands, with no applications pending. Council introduced a moratorium ordinance on Oct. 7 that would last until data center rules are adopted or 365 days pass, with a hearing set for Oct. 21.
