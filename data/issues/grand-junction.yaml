- title: 2027 budget and $6 million structural gap
  summary: Staff reported a $6 million General Fund structural gap, with pressure from growth, rural fire/EMS costs and health insurance claims. The recommended 2027 budget is $317.4 million ($120.8 million General Fund), with about $2 million in personnel cuts, reduced Lincoln Park Pool hours, some housing programs moving to partners, and $2.7 million for six police officers and three fire battalion chiefs. Council continued review Oct. 26.
