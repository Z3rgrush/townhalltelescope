- title: Temporary moratorium on large data centers
  summary: Staff proposed an ordinance pausing applications for large data centers while the city writes land-use rules, since current code doesn't address them and their electricity and water demands could be large. No applications are pending. Council wanted coordination with Mesa County and utilities and asked about other high-water industries. An ordinance with a 365-day maximum was introduced Oct. 7 for a hearing Oct. 21.
