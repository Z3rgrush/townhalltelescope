- title: 2911 D 1/2 Road annexation, mixed-use rezone and apartments
  summary: Anthony Properties and Davenport and Company seek annexation of 14.88 acres, MU-2 zoning, and a Comprehensive Plan change from Residential Medium to Mixed Use for a potential multi-unit apartment complex. A Circulation Plan amendment to relocate planned roads is expected later. Council set a public hearing for Dec. 16; the Planning Commission was to consider it Nov. 10.
