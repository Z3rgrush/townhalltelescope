- title: Temporary moratorium on large data centers
  summary: Council discussed on Sept. 14 a temporary moratorium on large data centers because the code does not address them and they could use significant power and water; no applications are pending. An ordinance for a moratorium lasting until code amendments or 365 days was introduced Oct. 7 with a hearing set for Oct. 21.
