- title: 2027 city budget and structural deficit
  summary: Staff reported a $6 million General Fund structural gap and presented a $317.4 million 2027 budget ($120.8 million General Fund) with about $2 million in personnel cuts, reduced Lincoln Park Pool hours, and some housing programs moved to community partners. It adds six police officers and three fire battalion chiefs, and utility and golf fee increases were discussed. The first appropriation hearing was set for Nov. 4 with a second on Nov. 18.
