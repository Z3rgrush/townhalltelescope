- title: Water supply plan and turf conversion/water conservation
  summary: Staff presented the state-required Water Supply Element for the Comprehensive Plan, saying current supplies meet current and projected needs. Separately, the Forestry Board discussed turf conversion's effect on mature trees, and Council supported a Bureau of Reclamation grant for piping the Juniata Enlarged Ditch, which loses about 1,400 acre-feet annually.
