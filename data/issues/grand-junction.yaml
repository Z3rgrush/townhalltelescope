  summary: The Historic Preservation Board discussed seeking Certified Local Government status, which could bring design review to historic districts. Members of the public asked the board to nominate the Lincoln Park Barn for designation, and members asked staff to schedule a special meeting on it. The board also commented to CDOT on I-70B impacts on historic resources.
