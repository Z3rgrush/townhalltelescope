- title: Galley Meadows rezone at 2590 Galley Lane and 675 26 Road
  summary: Monument Homes Development and Cuesta Verde asked to rezone about 13.04 acres to RL-4 for future housing. Neighbors raised concerns about traffic, lighting, construction traffic and density, and asked that the entrance be on 26 Road rather than Galley Lane. The Planning Commission recommended approval, and Council passed Ordinance 5341 on Sept. 16 after the first hearing was delayed by a notice error.
