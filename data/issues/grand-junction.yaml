- title: Persigo sewer budget and lift station
  summary: The recommended 2027 Persigo wastewater budget totals $69.9 million, about $49.7 million of it for capital projects, with delayed projects and $4.5 million in unplanned needs. Council also authorized buying property at 354 Bonny Street for a new sewer lift station.
