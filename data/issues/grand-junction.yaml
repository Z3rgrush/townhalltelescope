- title: Significant Tree Ordinance removed from development code
  summary: The Housing Affordability Code Task Force asked to remove the significant tree protections (sections 21.07.040 and 21.09.060(a)(1)) as a housing cost. Council heard the ordinance on Sept. 2 and, per the Forestry Board, voted to remove it, despite strong public support for keeping it. A consultant will look at code changes through December and a replacement may be considered.
