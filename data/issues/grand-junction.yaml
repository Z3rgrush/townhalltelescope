  summary: HomewardBound of the Grand Valley asked Council for $225,000 for operating its 29 Road consolidated shelter, then submitted an updated pay-for-performance proposal including $1,500 per person moved into non-shelter housing. It is not in the recommended budget, and staff want more time to evaluate it.
