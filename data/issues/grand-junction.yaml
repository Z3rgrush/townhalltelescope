- title: Housing Action Plan and Housing Affordability Code Task Force
  summary: Council reviewed a revised Housing Action Plan that drops a proposed Housing Advisory Board and moves exploring new housing revenue to later years. It will return for a public hearing and adoption. Meanwhile the Code Task Force is working with consultant KLJ to simplify the development code and the TEDS manual, with a focus on housing costs, and plans to finish by early 2027.
