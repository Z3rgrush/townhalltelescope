- title: Matchett Park Bike Park and parks capital funding
  summary: A survey showed strong support for keeping the Matchett bike park. Given the city's budget problems, the parks board moved to hold off on further development there. Parks staff also warned that impact-fee revenue will drop from about $1.2 million to $758,000 in 2027.
