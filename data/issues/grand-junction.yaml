- title: Juniper Grove affordable homeownership at the Salt Flats
  summary: Grand Junction Homes would buy about 3.3 acres of the city-owned Salt Flats property at 450 28 Road to build 48 for-sale homes for households under 100% AMI, with no HOA. The city would also cover $593,340 in water and sewer fees. Council continued the sale hearing to Sept. 16; completion is anticipated by Winter 2027.
