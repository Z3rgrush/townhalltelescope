- title: Proposed 2027 county budget
  summary: The commissioners received a presentation of the proposed 2027 Delta County budget at a special meeting on Oct 13. The Assessor also presented the 2026 property assessment study, and the county is updating mileage and per diem rates starting Jan 1, 2027, which had not risen since 2008.
