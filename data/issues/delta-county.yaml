- title: 'Land Use Code update: battery storage, natural medicine businesses and general amendments'
  summary: The county held public hearings on Land Use Code amendments, including rules for Battery Energy Storage Systems (BESS) and natural medicine businesses, plus setbacks, site plan review, temporary special events and intensive agricultural setbacks. The commissioners considered resolutions adopting the BESS and natural medicine rules and repealing the related moratoriums. In October they submitted further amendments to the Planning Commission for a recommendation.
