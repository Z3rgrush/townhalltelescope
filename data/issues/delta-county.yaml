- title: Fire Mountain speed limit and road right-of-way dedications
  summary: The commissioners considered a speed analysis and resolution to change the speed limit on Fire Mountain. They also accepted right-of-way dedications for Fire Mountain Road (2.03 acres), Barrow Mesa Road, H Road, and Surface Creek Road and NE Shady Oak Avenue. A School Bus Ahead sign on G Road west of the railroad tracks was discussed.
