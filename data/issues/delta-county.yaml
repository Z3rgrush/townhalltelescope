- title: Clear Water Enterprises rezone (PLN26-022) for 378.5 acres
  summary: Peter Edwards/Clear Water Enterprises LLC asked to rezone about 378.5 acres from A-35 to RES-1 for future residential subdivision. A water attorney's opinion says the water rights and augmentation plan (Golden Eagle Water Company, Shea Pump and Pipeline, Blue Mesa releases) can supply it. The Planning Commission heard it Aug. 12 and the commissioners held a hearing Sept. 15.
