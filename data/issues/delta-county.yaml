- title: Clear Water Enterprises rezone (PLN26-022) for 378.5 acres of homes
  summary: Peter Edwards/Clear Water Enterprises asked to rezone about 378.5 acres from A-35 to RES-1 for residential lots that would be served by Golden Eagle Water Company taps. The Planning Commission heard it Aug 12, and the commissioners held a public hearing Sept 15. A water attorney's opinion in the packet says the water rights and augmentation plan are adequate.
