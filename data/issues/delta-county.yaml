- title: Proposed 2027 county budget
  summary: The commissioners held a special meeting on Oct. 13 for a presentation of the proposed 2027 Delta County budget. Related items include updated mileage and per diem rates starting Jan. 1, 2027, which had not risen since 2008, and a county property assessment study.
