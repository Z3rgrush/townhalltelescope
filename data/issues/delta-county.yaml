- title: 'Land Use Code amendments: battery storage (BESS), natural medicine businesses and general cleanup'
  summary: The commissioners held a continued public hearing on Land Use Code amendments and on Sept 15 considered resolutions adopting rules for natural medicine businesses and battery energy storage systems, which would repeal earlier moratorium resolutions. The Planning Commission took public comment in October on setbacks, temporary special events, intensive agricultural setbacks and site plan review, and a final adoption hearing was set for Nov 3.
