- title: Clear Water Enterprises rezone (PLN26-022), 378.5 acres from A-35 to RES-1
  summary: Peter Edwards' Clear Water Enterprises LLC asked to rezone about 378.5 acres from A-35 to RES-1 for residential use, with future subdivision. The Planning Commission heard it Aug 12 and the commissioners held a public hearing Sept 15. A water attorney's letter says the water rights and augmentation plan are adequate, citing Golden Eagle Water Company taps and Gunnison River diversions.
