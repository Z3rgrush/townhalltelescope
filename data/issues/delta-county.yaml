- title: 'Land Use Code amendments: battery storage, natural medicine, and general cleanup'
  summary: The county reworked its Land Use Code, with hearings on Sept. 1 and Sept. 15. The changes cover battery energy storage systems (BESS) and natural medicine businesses, ending earlier moratoriums, plus setbacks, site plans, temporary special events and intensive agricultural setbacks. The Planning Commission heard public comment in October, and the commissioners were set to consider adopting a resolution on Nov. 3.
