- title: Fire Mountain speed limit change and road right-of-way dedications
  summary: The commissioners considered a speed analysis and a resolution to change the speed limit on Fire Mountain. They also took dedications of road right-of-way for Fire Mountain Road (2.03 acres), Barrow Mesa Road, H Road and Surface Creek Road, and discussed a School Bus Ahead sign on G Road west of the railroad tracks.
