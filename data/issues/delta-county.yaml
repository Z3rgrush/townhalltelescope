- title: 'Land Use Code amendments: battery storage, natural medicine and general cleanup'
  summary: The county held public hearings on Land Use Code changes, including rules for battery energy storage systems (BESS) and natural medicine businesses. Adopting them would repeal earlier moratorium resolutions. Public comments covered temporary special events, intensive agricultural setbacks and site plan review. The Planning Commission reviewed the amendments and the commissioners moved to submit them on Oct 6.
