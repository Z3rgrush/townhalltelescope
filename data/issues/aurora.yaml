- title: 'Water rules: turf, ornamental features and water agreements'
  summary: Council finalized ordinances on new turf and ornamental water features and a related ordinance prohibiting certain permits. Aurora Water also brought a Lake County water deliveries and storage agreement, a South Adams water rights trade, and several flood and storm drainage agreements (Westerly Creek, Piney Lake Trails, Coal Creek at Picadilly Road).
