- title: Data center moratorium and zoning standards
  summary: Council took up a data center moratorium resolution (R2026-111) that would pause acceptance or processing of development applications with a data center as the primary use, with a waiver of reconsideration requested as time-sensitive. Council also held standards discussions and a public hearing on ordinance 2026-51, a Unified Development Ordinance text amendment to the permitted use table for data centers. An earlier agenda paired this with an evaporative cooling ordinance from Aurora Water.
