- title: Data center moratorium and new data center rules
  summary: Council adopted a moratorium on development applications that include a data center, directed staff to write data center regulations, and worked through development standards and a zoning use table change for data centers, ending in a public hearing in October.
  where: Citywide
  refs: [1, 2, 4, 9]
  tags: [data-center]
  public_comment: true
- title: Water rules on evaporative cooling, turf and water features
  summary: Council passed Aurora Water ordinances on evaporative cooling and limits on new turf and ornamental water features, and set 2027 water rates and fees.
  where: Citywide
  refs: [2, 6, 8]
- title: 2027 budget deliberations
  summary: Council spent a day going department by department through the 2027 budget, service fees, pay tables and improvement district budgets.
  where: Citywide
  refs: [7, 8]
- title: Homeless services funding and the Regional Navigation Campus
  summary: Council funded outdoor renovations at the Aurora Regional Navigation Campus and reviewed a slate of homeless services grant recommendations for emergency shelter, rapid rehousing and rental help.
  where: Aurora Regional Navigation Campus
  refs: [0, 8]
- title: Nine Mile Station redevelopment
  summary: The Aurora Urban Renewal Authority amended the Point Crossing agreement and approved a redevelopment agreement for the Tempo at Nine Mile Station apartments.
