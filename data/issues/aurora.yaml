- title: Homeless services funding awards
  summary: Council reviewed a series of Homeless Services Notice of Funding Opportunity applications and recommendations, including Emergency Solutions Grants for Advance Pathways and the Aurora Housing Authority, HOME tenant-based rental assistance, and marijuana funds. They moved from the Oct. 12 agenda to the Oct. 26 consent calendar.
