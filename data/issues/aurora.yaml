- title: 'Affordable housing: Mercy Housing ground lease and bond allocation'
  summary: Council considered a ground lease with Mercy Housing Mountain Plains for an affordable housing project (R2026-107), with an outside speaker listed. Council also considered assigning the city's 2026 private activity bond allocation to the Aurora Housing Authority.
