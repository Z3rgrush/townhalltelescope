- title: Data center moratorium and zoning standards
  summary: Council took up a resolution (R2026-111) on a moratorium on accepting or processing development applications that include a data center as a primary use, with a waiver of reconsideration requested as time-sensitive. Council also held a Data Center Standards discussion and a public hearing on an ordinance (2026-51) amending the Unified Development Ordinance use table for data centers, which returned for final approval on the Oct. 26 consent calendar.
