- title: Nine Mile Station and urban renewal redevelopment agreements
  summary: The Aurora Urban Renewal Authority board considered amendments and agreements for The Point Crossing and Tempo at Nine Mile Station apartments in the Plaza 3 area, plus a restated finance agreement for Plaza 1. An IGA between the city and the Authority followed to council on Oct. 26.
