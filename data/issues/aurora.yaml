- title: Nine Mile Station and Plaza urban renewal redevelopment agreements
  summary: The Aurora Urban Renewal Authority considered amendments to the Point Crossing at Nine Mile Station agreement, a new agreement for Tempo at Nine Mile Station Apartments, and a restated Plaza 1 finance agreement, all within urban renewal areas. An intergovernmental agreement tied to the authority and a Nine Mile IGA with police also came up.
