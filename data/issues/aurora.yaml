- title: 2027 city budget deliberations, fees and rates
  summary: Council held a full-day budget session on Oct. 3 covering department budgets, the capital projects fund, proposed 2027 service fees, a 2026-2027 pay table, and 2027 budgets for several general improvement districts. On Oct. 12 it considered 2027 proposed rates and fees and a new fund to self-fund United Healthcare employee coverage.
