- title: Homeless services funding awards
  summary: Council considered a series of Homeless Services Notice of Funding Opportunity applications, with recommendations including Advance Pathways and Aurora Housing Authority grants (Emergency Solutions Grant, HOME tenant-based rental assistance, marijuana funds). The items moved from the Oct. 12 study agenda to the Oct. 26 consent calendar.
