- title: 2027 budget, tax levy, fees and rates
  summary: Council held a day of budget deliberations on Oct. 3 covering city departments, the capital fund, proposed 2027 service fees, pay tables and general improvement district budgets. It then took up 2027 proposed rates and fees, a new self-funded health plan fund, and on Nov. 9 introduced the 2027 tax levy ordinance, which includes a temporary property tax credit, and the 2027 appropriations ordinance.
