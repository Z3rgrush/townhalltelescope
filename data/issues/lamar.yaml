- title: Possible SECPA purchase of Lamar Utility
  summary: Council agreed to investigate an offer from SECPA to buy the Lamar Utility. A Utility Board member questioned the decision, and the mayor clarified that council is only investigating and lacks authority to sell a utility. Appointment to the Lamar Utility Board seat is on hold until outside counsel finishes a document and internal review.
