- title: Street repaving budget and 2026 paving list
  summary: Annual asphalt paving was delayed by milling machine availability. Public Works said materials alone are estimated at $380,362 against a $400,000 budget, and urged a larger budget given rising asphalt costs. PMC will pay for materials to repave its parking lot, with the city providing in-kind work. The Willow Valley water line project is nearing completion, after which streets will be repaired.
  where: Citywide, including Grant St. from Main to 6th and Willow Valley
