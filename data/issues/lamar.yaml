- title: Data center moratorium and community standards
  summary: Council discussed data centers in September, including draft Community Benefit & Responsible Data Center Development Standards and interest from parties considering the Lamar area. On Oct. 12 residents voiced concerns, and council debated a proposed 24-month moratorium to give time to write regulations. The mayor said no nondisclosure agreements have been signed and no deals are in the works.
