- title: Main Café Brownfield cleanup
  summary: The city sought bids for EPA Brownfield grant cleanup of the Main Café site, holding a mandatory pre-bid walk-through in August. On Sept. 28 council awarded Bid 46-002 to Rockies Environmental for $483,299. A new assessment grant is also being set up.
