- title: Parks and recreation fields and facilities
  summary: Residents and councilmembers raised concerns about the youth soccer field's grass and divots and the community building's worn carpet. Escondido Field was topsoiled, reseeded and treated for weeds and fungus. The city will look for grants for ADA-accessible playground equipment.
