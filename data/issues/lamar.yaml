- title: 2027 budget preparation and revenue outlook
  summary: The treasurer began budget work, with director meetings starting the week of Aug. 17 and a council work session on revenue projections on Aug. 24. Sales tax is up 5% year to date, and insurance renewals came in lower than feared. A federal funding application through Senator Bennett's office is still pending.
