- title: Data center moratorium and development standards
  summary: Council discussed data centers in September, then heard residents' concerns in October and November. It also debated a proposed 24-month moratorium so the city has time to write community benefit and responsible development standards. The mayor said no agreement or NDA has been signed and that a company contacted the city first.
