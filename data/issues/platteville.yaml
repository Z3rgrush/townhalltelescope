- title: 'Regional water supply: NISP, Windy Gap and Chimney Hollow briefing'
  summary: Before the Oct. 6 meeting, trustees held a study session on water acquisition and got a legal briefing on regional water projects. Topics included the Northern Integrated Supply Project (NISP) status and participant withdrawals, Windy Gap units being sold by Platte River Power Authority at about $5 million each, uranium mitigation at Chimney Hollow Reservoir, and Colorado River and South Platte compact issues.
  where: Townwide
