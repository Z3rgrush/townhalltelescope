  summary: Commissioners heard an appeal of the Lower Blue Planning Commission decision on PLN26-004, a Class 4 conditional use permit for milling and concrete and asphalt batch plant operations on a 151-acre portion of a 605-acre A-1 parcel. Public comments, a stormwater plan, and a landscape plan were in the packet. The documents do not state the outcome.
