  summary: The commissioners held a public hearing on an appeal of the Lower Blue Planning Commission's decision on PLN26-004, a Class 4 conditional use permit for milling and concrete and asphalt batch plant operations. The site is a 151-acre portion of a 605-acre A-1 parcel. The packet includes public comments, a stormwater plan and a landscape plan. The documents do not state the outcome.
