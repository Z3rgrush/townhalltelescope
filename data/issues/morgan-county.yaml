- title: Data center zoning regulations
  summary: The county commissioners have been working on new data center rules for the Zoning Regulations, with a Planning Commission hearing on April 21, 2026 and a commissioner hearing opened May 5 and continued repeatedly through August 4. Drafts define edge, large and accessory data centers, allow only closed-loop cooling, and are still debating setbacks and decommissioning requirements. Zoning amendments were again on the September 15 agenda.
  where: Unincorporated Morgan County
