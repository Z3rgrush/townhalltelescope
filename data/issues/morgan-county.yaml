- title: Junk and rubbish ordinance
  summary: Ordinance No. 2, Series 2026, restricts accumulation of junk and refuse in unincorporated areas, citing rodents, fire hazards and pollution. Existing operating junk yards are exempt. It had first reading on September 15 and second reading on November 5.
