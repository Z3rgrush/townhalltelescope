- title: Data center zoning regulations
  summary: The county commissioners have been working on new data center rules for Chapter 4 of the zoning regulations. The Planning Commission recommended approval in April 2026, and the commissioners' hearing opened May 5 and was continued repeatedly, through August 4, for staff revisions. Open points include new definitions (edge, large and accessory data centers), setbacks, closed-loop cooling only, and decommissioning and emergency plans.
  where: Unincorporated Morgan County
