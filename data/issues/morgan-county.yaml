- title: 'Fortress solar and battery project: road work enforcement hearing'
  summary: The county issued a Notice of Intent to Take Enforcement Action and Order to Show Cause against Fortress over its three-phase solar and battery project. The notice alleges violations of its special use permits and the Public Improvements Agreement for paving County Roads Q and R, including paving before county inspectors could observe roadbed preparation. Fortress responded in writing ahead of the October 23 hearing and said it will crush and rebuild the road.
  where: County Roads Q and R
