- title: Jail expansion and county financial report
  summary: The 2025 Annual Comprehensive Financial Report was presented August 18. It notes that the commissioners are targeting a County Jail expansion funded partly by an Energy Impact Assistance Fund grant and a Jail Capital Improvement Fund set up in 2008. The county may also ask the cities and towns to help pay.
