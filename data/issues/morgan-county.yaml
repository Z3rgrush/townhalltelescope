- title: Fortress solar and battery project road work enforcement
  summary: The county issued a Notice of Intent to Take Enforcement Action and Order to Show Cause against Fortress over road improvements on County Roads Q and R tied to its 2024 solar and battery special use permits. Fortress says paving began without county observation of proof rolling and has chosen to crush and rebuild the road. A hearing was set for October 23, 2026.
