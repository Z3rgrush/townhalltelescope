- title: 2027 preliminary budget and county finances
  summary: The Finance Director presented the proposed preliminary 2027 budget on November 5. The treasurer's report showed tax collections of about $64.97 million, 98.66% of taxes levied. The 2025 annual comprehensive financial report was presented in August.
