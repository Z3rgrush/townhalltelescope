- title: County jail expansion and capital planning
  summary: The 2025 annual financial report notes commissioners are reviewing the capital improvement plan and targeting a County Jail expansion. An Energy Impact Assistance Fund grant helps, and the county may ask other municipalities to help fund it. A security fence project for the Justice Center and East Point Building was also up for bid award on October 20.
  where: Morgan County Jail and Justice Center, Fort Morgan
