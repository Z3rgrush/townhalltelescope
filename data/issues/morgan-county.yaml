- title: Temporary RV housing special use permit near Wiggins
  summary: A special use permit hearing on August 4 concerned temporary residential use of RVs at 18975 County Road 1 while manufactured home placement permits are obtained. Once the homes are in place, the RVs would no longer be allowed as residences. The permit is meant to bring the property into compliance with county zoning.
