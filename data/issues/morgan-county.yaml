- title: Zoning enforcement process amendments and junk ordinance
  summary: On September 29 the commissioners considered Resolution 2026 BCC 42, which cleans up the zoning regulations' enforcement processes and adds continuing county jurisdiction over permits. On September 15 they took up Ordinance No. 2, Series 2026, a first reading on county prohibitions on junk and refuse deposited in unapproved sites in unincorporated areas, with an exemption for operating junk yards.
