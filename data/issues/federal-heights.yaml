- title: Police Department concerns and calls to dismiss the City Manager
  summary: Residents told council that, in their opinion, the Police Department is in disarray, the city has a high crime rate, and the City Manager should be dismissed. These comments came as council also took up police items such as a code enforcement van replacement and a Motorola VESTA NXT project.
  where: Citywide
