- title: Police Advisory Board complaint investigations and process overhaul (Ordinance 1024)
  summary: The Police Advisory Board met in August, September and October to review an investigation into a complaint filed July 28, 2026 and to discuss a proposed ordinance revising its process. Council took up Ordinance 1024, which repeals and reenacts Section 2-75 of the municipal code on the board, on first reading Aug. 24 and set a Sept. 14 public hearing.
