- title: Emergency moratorium on data centers (Ordinance 1023)
  summary: On Aug. 24, 2026 City Council considered Ordinance 1023, an emergency ordinance imposing a temporary moratorium on building permits, special use permits, business licenses and land use applications for any business that includes a data center. The documents do not state the vote.
