  summary: Council discussed the 2027 budget on Oct. 7 and on Oct. 12 acknowledged receipt of the draft 2027 budget and set a public hearing. The Urban Renewal Authority also set its own 2027 budget hearing date. A Sept. 26 council retreat listed budget and capital improvement planning as a topic.
