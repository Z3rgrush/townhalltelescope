- title: City Center Park design and master feasibility plan
  summary: The Urban Renewal Authority received a City Center Park presentation from Wenk Associates and approved a first amendment to Wenk's design services agreement. It also considered hiring Hunden Strategic Partners for a City Center master feasibility plan and implementation strategy, and a third amendment to the reimbursement agreement with the city for capital projects.
