- title: Northern Lot CNS Annexation and zoning
  summary: Council took up the petition to annex the Northern Lot CNS property, finding it eligible and passing annexation Ordinance 1026 and zoning Ordinance 1027 on first reading on Oct. 26, with second reading scheduled for Nov. 9. The Planning and Zoning Commission also considered a site plan and industrial use for Northern Lot CNS.
