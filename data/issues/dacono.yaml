- title: Police Advisory Board complaint and process overhaul (Ordinance 1024)
  summary: The Police Advisory Board reviewed an investigation into a complaint filed July 28, 2026 and discussed a proposed ordinance to revise its process and police policy. Council took up Ordinance 1024, rewriting Municipal Code Section 2-75 on the board, on first reading Aug. 24, with a public hearing set for Sept. 14.
