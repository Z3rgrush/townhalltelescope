- title: Water supply planning, efficiency plan and water dedications
  summary: Council received a Water Supply Master Plan and Water Efficiency Plan presentation Aug. 24 and held a closed session on the city's water supply and a potential land purchase. It then took up Resolution 26-58 adopting the 2026 Water Efficiency Plan on Oct. 12. On Oct. 26 it considered a water dedication agreement for Strata Filing 2, and council toured the United Water and Sanitation District on Oct. 15.
