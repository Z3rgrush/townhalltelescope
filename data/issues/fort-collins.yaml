- title: Housing Action Plan and safe parking pilot
  summary: Council reviewed draft strategies in a new Housing Action Plan that would replace the 2021 Housing Strategic Plan, covering supply, affordability, preservation, stabilization and funding, with a six-year implementation plan. Council also discussed a Safe Parking Pilot Program with mixed input on whether to pursue an ordinance, and a homelessness response system and funding session.
