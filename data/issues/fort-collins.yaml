- title: 'North College Urban Renewal: 1505 N College grant, 1630 N College purchase, Bristlecone housing loan and community charter'
  summary: The Urban Renewal Authority considered a roughly $1 million redevelopment agreement with façade, infrastructure and community food-system improvements at 1505 N College Ave, a $250,000 appropriation to acquire 1630 N College, and a $2 million loan term sheet for Bristlecone Affordable, a 112-unit income-restricted project. It also discussed a draft community Coalition Charter for 1636 N College and the superblock, plus plan finances before TIF ends. Executive sessions covered possible property purchases including eminent domain.
  where: North College Avenue (1505, 1630 and 1636 N College)
