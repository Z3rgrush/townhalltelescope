- title: Real Estate Strategic Framework and Civic Center Master Plan
  summary: Council broadly supported a strategic portfolio approach to managing city-owned property and asked for valuations, zoning, evaluation criteria and disposition information. Members generally backed updating the Civic Center Master Plan but cautioned about scope, timing and budget.
