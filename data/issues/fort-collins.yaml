- title: Montava wholesale water agreement with ELCO
  summary: Council reviewed a wholesale water arrangement with East Larimer County Water District to serve Montava, a 4,000+ unit mixed-use development in northeast Fort Collins. Councilmembers supported advancing it, while asking about development fees, utility revenue, water supply sufficiency under climate change, and the non-potable system. Long-term water planning is to be addressed in an Integrated Water Resources Plan proposed for 2027.
  where: Montava, northeast Fort Collins
