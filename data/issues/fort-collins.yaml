- title: City joins Northern Integrated Supply Project (Glade Reservoir) instead of Halligan expansion
  summary: The Water Utility Enterprise board considered agreements for the city to participate in NISP and store some of its own water rights in Glade Reservoir. The city would notify the Army Corps and withdraw its Clean Water Act permit application for the Halligan Reservoir enlargement, citing permitting uncertainty and lower projected rate increases. The resolution was adopted 6-1, with Nelsen opposed.
