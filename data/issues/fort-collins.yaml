- title: Economic Development Investment Program
  summary: Council gave broad support at a Sept. 8 work session to a new Economic Development Investment Program, suggesting it support community vitality and micro-business proof-of-concept rather than jobs or sales tax. Members discussed after-the-fact review, discomfort with ongoing annual commitments, and whether added staff is needed. The program is to be built into the 2027-28 budget.
  where: Citywide
