- title: 'North College Urban Renewal: property purchases, Bristlecone loan and community coalition'
  summary: The Urban Renewal Authority approved items including a redevelopment agreement for façade and community-use improvements at 1505 North College (about $1 million project), a $250,000 acquisition at 1630 North College, and a proposed $2 million loan for the 112-unit income-restricted Bristlecone Affordable project. It also discussed a community coalition charter for 1636 North College and the remaining TIF funding, and held executive sessions on property purchases including eminent domain.
