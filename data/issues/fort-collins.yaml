- title: Housing Action Plan and affordable housing land and funding
  summary: Council reviewed draft Housing Action Plan strategies on supply, affordability, preservation, stabilization and funding, which would replace the 2021 Housing Strategic Plan. Council also moved to convey city-owned land at 314 North Howes Street for affordable housing (a speaker called it a giveaway) and appropriated leftover CCIP sales tax reserves to the Affordable Housing Capital Program.
