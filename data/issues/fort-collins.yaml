- title: Safe Parking pilot program
  summary: At a Sept. 8 work session, staff outlined a possible Safe Parking program pilot for people living in vehicles. Council gave mixed input on whether to pursue an ordinance to ensure neighbors are heard, and discussed code updates and enforcement. Homelessness response strategy and funding returned in an Oct. 27 work session.
