- title: Montava wholesale water agreement with ELCO
  summary: At an Aug. 25 work session, staff reviewed a wholesale water arrangement with East Larimer County Water District to serve Montava, a 4,000+ unit mixed-use development in northeast Fort Collins. Councilmembers supported advancing it, while asking about fee differences, utility revenue, water supply sufficiency and the non-potable system; a long-term Integrated Water Resources Plan is proposed for 2027.
