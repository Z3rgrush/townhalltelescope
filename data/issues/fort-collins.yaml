- title: Downtown paid parking pilot
  summary: Council discussed a paid-parking pilot at the Oak & Remington surface lot and other options including on-street paid parking, and asked staff to return with revised pilot options and downtown employee parking ideas. A code update is being prepared for an on-street pilot. The College Avenue waterline delay gives more time. Residents have commented on parking messaging and fees.
