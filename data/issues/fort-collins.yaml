- title: Downtown paid-parking pilot at Oak & Remington lot
  summary: At an Aug. 11 work session, staff presented a paid-parking pilot at the Oak & Remington surface lot, and the delay in the College Avenue Waterline gives the City more time to weigh alternatives. Council asked staff to return with revised pilot options, including on-street paid parking, and more downtown employee parking ideas. A Code update is planned ahead of an on-street pilot. A resident also spoke about messaging on downtown parking fees.
  where: Oak & Remington lot, downtown Fort Collins
