- title: Joining the Northern Integrated Supply Project (Glade Reservoir) instead of enlarging Halligan
  summary: The Water Utility Enterprise board adopted 6-1 (Nelsen opposed) a resolution authorizing agreements for the city to become a participant in NISP and store some of its own water rights in Glade Reservoir. Staff cited permitting uncertainty around the Halligan Reservoir enlargement and projected lower rate increases, and plan to notify the Army Corps and withdraw the Halligan Section 404 permit application.
