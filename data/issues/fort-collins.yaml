- title: Affordable housing land and funding decisions (314 N. Howes St., EcoThrift site)
  summary: Council took up an ordinance to convey city-owned property at 314 North Howes Street for affordable housing; a speaker called it a large giveaway. Residents also raised the Housing Catalyst project at the EcoThrift site lacking funding, which Councilmember Nelsen attributed to competitive subsidies. Council also appropriated remaining CCIP sales tax reserves and moved ARPA funds toward the affordable housing program.
