- title: 2027-2028 Biennial Budget
  summary: Council held a series of work sessions in September and October on the City Manager's Recommended 2027-2028 budget, the first under Priority Based Budgeting. Staff found a gap between ongoing revenue and expenses and asked service areas to identify 8% in cost reductions. Council is to give direction on changes before adoption in November; residents raised concerns about higher Lincoln Center rental rates and user fees.
