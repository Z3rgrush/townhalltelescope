- title: ELCO wholesale water agreement for Montava development
  summary: Staff reviewed a proposed wholesale water deal with East Larimer County Water District (ELCO) to supply Montava, a 4,000+ unit mixed-use development in northeast Fort Collins. Councilmembers voiced support, while asking about fee differences, utility revenue, long-term supply under climate change and the non-potable system. A capital project of about $2.5M was mentioned.
  where: Montava, northeast Fort Collins
