- title: Economic Development Investment Program
  summary: Council gave broad support to a new Economic Development Investment Program. Members favored using it for community vitality and micro-business ideas over jobs or sales tax, preferred after-the-fact review, and were uneasy about ongoing annual commitments. Council adopts the 2027/28 budget in November.
