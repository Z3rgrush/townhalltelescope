- title: Conveyance of city-owned land at 314 North Howes Street for affordable housing
  summary: Council took up Ordinance 098 conveying city-owned property at 314 N Howes Street to support affordable housing. A resident called it a large giveaway. Another speaker said Housing Catalyst was given the site though funding for its project at the EcoThrift site is not in place, and a councilmember attributed the delay to competitive housing subsidies.
