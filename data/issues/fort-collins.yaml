- title: 'North College Urban Renewal area: property purchases, Bristlecone Affordable loan and community charter'
  summary: 'The Urban Renewal Authority has been working on North College redevelopment: executive sessions on property acquisition including possible eminent domain, a $250,000 supplemental budget to acquire 1630 North College, and a proposed $2 million loan for Bristlecone Affordable, a 112-unit income-restricted housing project. It also discussed a coalition charter with 15 voting seats for community-led redevelopment starting with 1636 North College, and plan finances before tax increment collection ends. Board approval of the charter is planned for December 2026.'
  where: North College Avenue, 1630 and 1636 North College
