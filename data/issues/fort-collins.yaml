- title: 'Affordable housing: 314 N. Howes land conveyance and housing funds'
  summary: Council took up Ordinance 098 conveying city-owned land at 314 North Howes Street for affordable housing, which a resident called a large giveaway. Other items directed leftover 2016-2025 CCIP sales tax reserves to the Affordable Housing Capital Program, and a Housing Action Plan was discussed in October. A speaker also criticized funding delays for the EcoThrift site project, which a councilmember attributed to competitive subsidies.
