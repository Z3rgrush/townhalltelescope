- title: 2027-2028 biennial budget
  summary: Council held a series of work sessions in September and October on the City Manager's Recommended 2027-2028 Budget, the first under a new Priority Based Budgeting approach. Staff identified a gap between ongoing revenues and expenses and asked service areas to find 8% in cost reductions. Council was to give direction on changes and adopt the budget in November, and residents objected to higher rental rates and user fees at the Lincoln Center and other city facilities.
