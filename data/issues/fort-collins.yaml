- title: 2027-2028 biennial city budget
  summary: Council held a series of work sessions on the City Manager's Recommended 2027-2028 Budget, the first under a new priority-based budgeting approach after a gap between ongoing revenue and expenses and an exercise to identify 8% cost reductions. A third session on Oct. 13 sought direction on additions and offsets, including use of the Parks & Recreation 2050 tax. Residents objected to higher cost recovery and rental rates at the Lincoln Center and other city facilities.
