- title: Joining the Northern Integrated Supply Project (NISP) instead of enlarging Halligan Reservoir
  summary: The Water Utility Enterprise Board is asked to approve agreements for Fort Collins to become a NISP participant and store some of its own water rights in Glade Reservoir. Staff cite permitting uncertainty at Halligan and say NISP is projected to mean lower rate increases. The city would notify the Army Corps and withdraw its Clean Water Act Section 404 permit application for the Halligan Project.
  where: Glade Reservoir / Halligan Reservoir
