- title: ELCO wholesale water agreement for Montava development
  summary: Council reviewed a proposed wholesale water deal with East Larimer County Water District (ELCO) to supply Montava, a 4,000+ unit mixed-use development in northeast Fort Collins. Councilmembers voiced support. Questions covered development fees, utility revenue, long-term supply under climate change and a non-potable system, with a roughly $2.5M capital project noted.
  where: Montava, northeast Fort Collins
