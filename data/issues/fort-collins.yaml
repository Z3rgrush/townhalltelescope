- title: 'North College urban renewal projects: 1505 and 1630 N. College, Bristlecone, community coalition'
  summary: 'The Urban Renewal Authority handled several North College items: grant funding of roughly $1M for façade, infrastructure and community-use improvements at 1505 N. College; a $250,000 appropriation to acquire 1630 N. College; and a $2M loan term sheet for Bristlecone Affordable, a 112-unit income-restricted community. It also discussed a draft community Coalition charter with 15 voting seats for redevelopment starting with 1636 N. College, and the plan''s finances before TIF collection ends. Approval of the full Charter is planned for December 2026, and a closed session on possible property purchase including eminent domain was held.'
  where: North College Avenue (1505, 1630, 1636 N. College)
