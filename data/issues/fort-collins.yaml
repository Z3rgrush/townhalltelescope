- title: Restricted Products Program (tobacco, nicotine, kratom)
  summary: Council discussed a program to regulate age-restricted products beyond tobacco and nicotine, including kratom. Flavored tobacco would be assessed after the initial program, and staff were encouraged to involve the Youth Advisory Board. A draft ordinance will come back.
