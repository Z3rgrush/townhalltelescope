- title: Economic Development Investment Program
  summary: Council gave broad support to a proposed Economic Development Investment Program, favoring community vitality and micro-business support over jobs or sales tax goals. Members were uneasy about ongoing annual commitments and discussed staffing and an after-the-fact review role. Council plans to adopt the 2027/28 budget in November 2026.
