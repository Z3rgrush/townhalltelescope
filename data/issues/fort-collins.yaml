- title: Pedestrian and intersection safety projects (Vision Zero)
  summary: Council appropriated $1,003,544 for the Pedestrian Intersection Improvements project at five locations, for a total of $2,460,856, to improve safety on the High Injury Network. It also funded property acquisition and a replacement signal for the Lemay and Drake intersection ($1,549,760). A resident urged pedestrian safety improvements downtown.
