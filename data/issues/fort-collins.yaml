- title: Downtown paid-parking pilot and Old Town parking fees
  summary: At an Aug. 11 work session, Council discussed piloting paid parking at the Oak & Remington surface lot, possibly with on-street paid parking, and asked staff to return with revised pilot options and downtown employee parking ideas. A code update is planned ahead of an on-street pilot. A resident later spoke on messaging about downtown parking fees.
  where: Downtown / Old Town Fort Collins; Oak & Remington lot
