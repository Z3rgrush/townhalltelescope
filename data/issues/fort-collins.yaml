- title: 2027-2028 biennial budget
  summary: Council held a series of work sessions (Sept. 15, Sept. 22, Oct. 13) on the City Manager's Recommended 2027-2028 Budget, the first under a new Priority Based Budgeting approach. The City faced a gap between ongoing revenue and expenses, and service areas were asked to find 8% in ongoing cost reductions. Council was to give direction on additions and offsets before adoption in November. A Lincoln Center theater group objected to higher rental rates and user fees, and a pause on the new rates was set up.
