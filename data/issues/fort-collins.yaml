- title: Economic Development Investment Program
  summary: Council gave broad support to a proposed Economic Development Investment Program, favoring uses for community vitality and micro-business proof-of-concept over jobs or sales tax. Members discussed an after-the-fact review role, discomfort with ongoing annual commitments, and staffing; the program ties to 2027-28 budget adoption.
