- title: Joining the Northern Integrated Supply Project and dropping Halligan enlargement
  summary: The Water Utility Enterprise board was to consider agreements letting the City join the Northern Integrated Supply Project (NISP) and store some of its own water rights in Glade Reservoir. Staff say NISP looks more certain than enlarging Halligan Reservoir, which has permitting uncertainty, and would likely mean lower rate increases. The City would notify the Army Corps and withdraw its Clean Water Act Section 404 permit application for Halligan.
  where: Glade Reservoir / Halligan Reservoir
