  summary: The Urban Renewal Authority considered a redevelopment and reimbursement agreement and supplemental budget for property improvements at 1505 North College Ave., near the Bike Co-op and Budget Host Motel. The project is about $1 million, with a one-time storefront grant and a performance-based programming grant supporting local food systems, aimed at preventing blight from returning.
