- title: College and Drake urban renewal plan amendment
  summary: The Urban Renewal Authority considered funding an existing conditions study around College and Drake and directing staff to prepare an amendment to the College and Drake Urban Renewal Plan, since changing conditions mean the original intent no longer works. It would evaluate adding more properties. A separate appropriation would satisfy a stipulation so the Authority can take possession of a property for redevelopment.
