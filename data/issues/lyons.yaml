- title: 2nd & 3rd Avenue stormwater project and bond vote
  summary: The $3.8M stormwater and sidewalk project lost its FEMA BRIC grant. The town planned a 20-year loan and found that a bond requires a ballot vote. A ballot measure failed 3–2, and a roughly $4M state-loan version may return in November 2027. The board also moved ahead with a Safe Routes to School sidewalk grant.
