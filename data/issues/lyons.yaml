- title: Planet Bluegrass annexation and zoning at 19617 N St Vrain
  summary: Ordinances 1225 and 1226 would annex and zone the Planet Bluegrass property at 19617 N St Vrain as a PUD. The first reading was continued repeatedly, with a request to continue it to 12/7/26. The Utilities & Engineering Board backed an impact statement, and the Economic Vitality Commission discussed parking, traffic and utilities. Town-owned property leases to Planet Bluegrass (Ordinances 1228 and 1229) were also on the Nov. 16 agenda.
