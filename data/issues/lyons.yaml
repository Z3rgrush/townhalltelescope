- title: 2nd and 3rd Avenue stormwater and sidewalk projects
  summary: After a federal BRIC grant was denied, trustees weighed a $3.8 million loan or bond for the 2nd and 3rd Avenue stormwater and sidewalk work, learned a public vote is needed, and moved ahead with a Safe Routes to School sidewalk grant.
  where: 2nd Ave and 3rd Ave
  refs: [11, 12, 14, 22, 26, 33, 41, 49, 50]
- title: Wildfire mitigation and new fire-resistant roof rules
  summary: Trustees discussed wildfire mitigation strategies and costs, held a town hall on fire risk, and set mid-roof inspection fees as the town moved to the state fire code requiring fire-resistant roofs after a hailstorm.
  where: Townwide, Bohn Park, Synchrony Trail
  refs: [3, 14, 21, 23, 36]
  public_comment: true
- title: Electric rate increase and time-of-use rates
  summary: The utilities board worked out a roughly 9% electric rate increase for 2027 after transmission costs jumped, while local businesses raised concerns that the new time-of-use electricity rates were rolled out without consulting them.
  where: Townwide
  refs: [4, 9, 22, 33, 41, 52]
- title: Strategic growth and water supply element of the comprehensive plan
  summary: Boards and trustees reviewed a new strategic growth and water supply element required by state law SB24-174, which found the town has enough water for the 87 housing units the regional needs assessment suggests.
  where: Townwide
  refs: [0, 5, 6, 22, 32, 33, 37, 49, 50, 51]
