- title: Strategic growth and water supply element of the comprehensive plan (SB24-174)
  summary: The town is drafting a state-required strategic growth and water supply addendum to the comp plan. Staff say the water supply has ample margin, and the regional housing needs figure recommends preparing for 87 more housing units, which is not mandatory. Several boards reviewed it before Trustee review.
