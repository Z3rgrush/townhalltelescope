- title: 2nd & 3rd Avenue stormwater project, bond vote and Safe Routes to School
  summary: The $3.8M 2nd and 3rd Avenue stormwater and sidewalk project lost its FEMA BRIC grant. The town plans a 20-year loan of about $268K/year, offset by $259K/year from the voter-approved half-percent sales tax, and bond lawyers say a ballot vote is needed. The Board of Trustees went ahead with the Safe Routes to School sidewalk grant, but stormwater funding is not secured.
