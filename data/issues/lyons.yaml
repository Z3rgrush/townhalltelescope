- title: Planet Bluegrass annexation on North St. Vrain Drive
  summary: Planet Bluegrass asked the town to annex and give PUD zoning to two parcels at 19617 and 19661 North St. Vrain Drive near Eagle Canyon, and the utilities, economic vitality, parks and trustee boards reviewed the referral ahead of a trustee hearing.
