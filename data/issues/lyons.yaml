- title: Electric rates, time-of-use billing and meter collar policy
  summary: The town is moving to time-of-use electric tiers. Transmission costs from Southwest Power Pool rose 50%, and staff project a 9% rate increase for 2027. Local businesses such as Main Stage raised concerns about too little consultation. A meter collar policy for solar customers, and net-metering billed at nameplate capacity, is still under discussion. Further TOU rate changes are expected in March.
