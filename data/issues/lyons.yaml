- title: Water rights cash-in-lieu and 402 Main Street
  summary: Roots to Revival at 402 Main Street asked to use 1.4 Lake McIntosh shares and pay cash in lieu for additional water rights dedication. The shares were valued at about $12K each, or $16.8K total. The trustees took up a resolution to ratify the shares and accept the cash.
