- title: Time-of-use electric rates and a proposed electric rate increase
  summary: Lyons is moving to time-of-use electric tiers. Business owners on the Economic Vitality Commission said they were not consulted, citing evening businesses like Main Stage. Southwest Power Pool raised transmission rates 50%, and the utility board's analysis projects a 9% shortfall that rates would need to cover in 2027. A meter-collar policy for solar customers and the nameplate billing issue are also under discussion. TOU rate changes are anticipated in March.
