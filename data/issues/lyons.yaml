- title: 2027 budget, supplemental 2026 items and resident survey
  summary: Staff and boards are preparing the 2027 budget. Trustees held budget workshops on Sept. 8 with a public input survey and a 5-year capital plan, and boards submitted requests, with a final budget expected in late October. Priorities cited include wastewater, stormwater and sidewalks.
