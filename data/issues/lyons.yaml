- title: Planet Bluegrass annexation and PUD zoning at 19617 and 19661 N St. Vrain Dr
  summary: Planet Bluegrass asks to annex 19617 N. St. Vrain Dr. and zone it and the adjacent 19661 parcel as a PUD (Ordinances 1225 and 1226). First reading began Aug. 3 and was continued, with a further continuation to Dec. 7 requested. Town boards and commissions (Utilities & Engineering, Sustainable Futures, Economic Vitality, Parks and Recreation, Ecology) reviewed it, raising stormwater, utilities, parking, traffic, a past hazmat cleanup and a new fire hydrant and sidewalk. Parks and Recreation notes community members' concerns.
  where: 19617 and 19661 N. St. Vrain Dr. (Eagle Canyon)
