- title: Wildfire mitigation rules and fire code
  summary: Lyons has used the state fire code since July 1, requiring fire-resistant roofing, and issued permits after the hailstorm. A town hall on fire risk was held and a wildfire mitigation ordinance is being drafted, with historic properties a question. Mitigation work is under way along trail extensions.
