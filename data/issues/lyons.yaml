- title: Sundance Film Festival task force and short-term lodging (SELL)
  summary: Ordinance 1222 created a special event lodging license, with applications open since Aug. 1 and $1M liability insurance required. The task force shifted toward private events and curated visitor experiences. It is also considering moving under a local nonprofit, and the town directed staff to find $5,000 for beautification.
