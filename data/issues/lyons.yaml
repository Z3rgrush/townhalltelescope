- title: Planet Bluegrass annexation and PUD zoning at 19617 and 19661 N. St. Vrain Drive
  summary: Planet Bluegrass has asked to annex two parcels near Eagle Canyon and zone them as a PUD. The Utilities board, Economic Vitality, Sustainable Futures, Ecology and Parks commissions all reviewed the referral. The Utilities board backed an impact statement with notes. Ordinances 1225 and 1226 were continued, with a request to move them to 12/7/26, and the Parks commission recorded community concerns.
