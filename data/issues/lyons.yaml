- title: 2027 town budget, utility rates and electric increase
  summary: The Board of Trustees held budget workshops and a Nov. 16 public hearing to adopt the 2027 budget. The Utilities & Engineering Board recommended rate increases of 6% for stormwater, 2.4% for water/wastewater and 12% for electric. Higher Southwest Power Pool transmission costs drive the electric increase. Time-of-use rates were also discussed.
