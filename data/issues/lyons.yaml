- title: Wildfire mitigation ordinance and fire code
  summary: The town now operates under the state fire code, so new roofs need fire-resistant materials. After a town hall and a survey, the trustees are weighing measures for a draft mandatory wildfire mitigation ordinance. Staff asked whether historic properties should be exempted. The survey showed high awareness of risk but limited support for mandates.
