- title: Sundance Film Festival housing ordinance and task force
  summary: Trustees adopted Ordinance 1222 on June 29 creating a Special Event Lodging License (SELL) for festival housing, requiring $1M liability insurance. The task force shifted toward private events and curated experiences, discussed transitioning under a nonprofit such as the Chamber, and was told to find $5,000 for beautification.
