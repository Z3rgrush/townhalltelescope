  summary: Staff are planning repairs to the historic sandstone box culvert, supported by an approximately $482,000 DOLA grant. The Historic Preservation Commission is reviewing the project and a comments memo for DOLA and History Colorado. A $154K lowest bid for the streetlight project was also discussed.
