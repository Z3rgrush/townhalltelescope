- title: 2nd and 3rd Avenue stormwater project and bond vote
  summary: The $3.8M stormwater and sidewalk project lost a FEMA BRIC grant. A bond election was needed to borrow for it. The Ecology Advisory Board was told the ballot measure failed 3–2 and may return in 2027 as a roughly $4M project with a state loan. The board also chose to go forward with the Safe Routes to School sidewalk grant.
