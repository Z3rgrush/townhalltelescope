- title: Wildfire mitigation, roof permits and fire code
  summary: Trustees discussed wildfire mitigation strategies, a mid-roof inspection and roof permit fee (Resolution 2026-45), and a town hall on fire risk in September. The town now operates under the state fire code, requiring fire-resistant roofing, and about 8 permits were issued after a hailstorm. A wildfire mitigation ordinance is being drafted by the town planner.
