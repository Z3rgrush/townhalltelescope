- title: Strategic growth and water supply element of the comprehensive plan
  summary: The town is adding a state-required (SB24-174) strategic growth and water supply element to the comp plan. Staff say water supply has ample surplus, and state housing projections recommend preparing for 87 more units. The planning, utilities, historic and ecology boards and trustees reviewed it, and historic commissioners asked for stronger infill language.
