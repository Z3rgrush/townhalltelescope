- title: Strategic Growth and Water Supply element of the comprehensive plan
  summary: Staff drafted a state-required addendum to the comp plan. It notes that regional housing needs recommend about 87 more units, and that the town has enough surplus water supply for that. Several boards gave feedback, including the Historic Preservation Commission on infill in historic areas.
