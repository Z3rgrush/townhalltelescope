  summary: Council held a 6-year Capital Improvements Program work session on Sept. 8 and a 2027 budget retreat on Oct. 6 that included general fund operations, the capital projects fund and a public comment slot. On Oct. 20 the 2027 budget ordinance came up for first reading, along with an eighth supplemental appropriation for 2026.
