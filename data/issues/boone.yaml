- title: 'Fire protection: IGA with Edison Fire Protection District'
  summary: Council reviewed an intergovernmental agreement, contract and lease with the Edison fire district. The IGA was accepted in April and a resolution adopting the Edison FPD IGA and contracts passed on May 7.
