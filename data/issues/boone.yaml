- title: Town park, playground equipment and mower
  summary: After sprinkler heads were damaged during mowing, 8 were replaced and council approved buying a new mower. Council discussed that the playground needs new equipment, and the fire chief suggested USDA or GOCO grants. A re-dedication of the park memorial for the 250th anniversary was also on the June agenda.
