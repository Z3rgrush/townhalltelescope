- title: Water/sewer billing procedure ordinance (Section 9, landlord/tenant responsibilities)
  summary: Council is reworking Section 9 of the water/sewer billing procedure ordinance. It was put on hold in August to reword the landlord/tenant responsibilities. In September it was set to be posted for 10 days, with finalization planned for Oct. 14, 2026. The water/sewer tap fee ordinance was signed and posted in July.
