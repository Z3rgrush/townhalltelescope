- title: Fire protection IGA with Edison Fire Protection District
  summary: Council reviewed an intergovernmental agreement, contract and lease agreements with the Edison fire district for the town's fire department. Council voted to accept the IGA on April 15 and adopted a resolution approving the IGA and contracts on May 7.
