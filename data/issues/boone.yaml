- title: Safe water notice and drinking water quality
  summary: The state health department lifted a bottled water advisory, and the town sent copies of the letter to all residents. Residents later questioned the safe water notice, and they were pointed to test results online. Council also discussed the 2025 drinking water quality report and a lead line survey and notices.
