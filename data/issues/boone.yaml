- title: Town administrator appointment and ORC service agreement
  summary: Council ratified a service agreement with Luke James (ORC) and approved a resolution appointing a town administrator in August. In September the appointment resolution was redone as council members resigned and reappointed it, and it was completed. An employee handbook workshop was also set.
