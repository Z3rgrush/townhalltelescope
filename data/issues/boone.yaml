- title: SCBD ordinances and amended IGA for Boone
  summary: The town is reviewing ordinances prepared with the SCBD attorney, tied to the Pueblo regional matter. SCBD was due at the Sept. 16 meeting, copies went to council for review, and the Oct. 14 agenda lists review and finalization of the ordinances and an amended IGA with SCBD.
