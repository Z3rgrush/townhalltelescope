- title: Adopting Southern Colorado Building Department codes and amended IGA
  summary: The town worked with the Southern Colorado Building Department (SCBD/SOCOBD) attorney to update ordinances based on Pueblo regional codes for code enforcement. The ordinances were reviewed, finalized and posted Oct 14, 2026 (one was missed), while the amended IGA was tabled until Nov 18 so Rockvail can be added.
