- title: Water treatment facility project, startup and draws
  summary: The town's new water treatment facility moved from operator training in March to startup in early May, with monthly construction draws and a 2-year warranty. By August, a leak in the GreenSands room and a problem with the chlorine pumps still needed investigation, and a council member asked for an itemized breakdown of the draw.
