- title: Building code enforcement and Southern Colorado Building Department ordinances
  summary: Council discussed adopting Pueblo codes for code enforcement and noted that ordinances tied to the Pueblo regional building department need updating. The department's attorney is working on revisions, and the department was to attend the Sept. 16 meeting. Council planned to review and finalize the ordinances and an amended IGA on Oct. 14.
