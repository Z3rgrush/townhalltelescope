- title: Water/sewer billing procedure and tap fee ordinances
  summary: Council spent most of the year drafting ordinances on water bill dates, late, reconnect and disconnect fees, and water and sewer tap fees. The tap fee ordinance was signed and posted in July. The billing ordinance was held up over landlord/tenant wording in Section 9, then approved and signed on Oct. 14 with 30 days of posting before it takes effect.
