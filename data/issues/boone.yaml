- title: Water/sewer billing procedure ordinance and landlord-tenant section
  summary: The council spent months drafting an ordinance on water bill dates, late, reconnect and disconnect fees. The tenant/landlord responsibility section (Section 9) was repeatedly reworded, and the ordinance was approved and signed on Oct 14, 2026, with 30 days of posting before it takes effect. A new utility billing system with card and ACH payments was also approved.
