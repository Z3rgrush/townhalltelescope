- title: Fire protection IGA with Edison Fire Protection District
  summary: Boone worked out an intergovernmental agreement and lease with the Edison fire district to cover fire service. Council accepted the IGA in April and adopted a resolution approving the IGA and contracts on May 7, 2026.
