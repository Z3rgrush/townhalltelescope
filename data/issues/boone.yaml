- title: New water treatment facility startup, leaks and draws
  summary: Boone's new water treatment plant moved from operator training (March) toward startup in early May 2026, with periodic loan/grant draws and a 2-year warranty. By August the council said a leak in the GreenSands room and chlorine pump problems needed further investigation, and a bottled water advisory was lifted by the state health department in July.
