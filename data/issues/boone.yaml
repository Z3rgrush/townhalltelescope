- title: Water and sewer billing procedure ordinance and tap fee ordinance
  summary: Council has spent months drafting ordinances on water bill dates and on water and sewer tap fees. The tap fee ordinance was accepted in June and signed and posted in July. The billing ordinance is on hold while Section 9 on landlord and tenant responsibilities is reworded; it was to be posted for 10 days and finalized Oct. 14. A late, reconnect and disconnect fee discussion was also on the June agenda.
