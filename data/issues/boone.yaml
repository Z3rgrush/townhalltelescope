- title: 'New water treatment facility: startup, warranty and draws'
  summary: The town's new water treatment plant moved from operator training in March and startup in May to warranty fixes and payment draws. By August there was a leak in the GreenSands room and a problem with chlorine pumps needing further investigation, and council asked for an itemized breakdown of the final draw under the 2-year warranty.
