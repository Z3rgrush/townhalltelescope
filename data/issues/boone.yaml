- title: Building code enforcement and Southern Colorado Building Department ordinances
  summary: The town has been revising its ordinances tied to the Southern Colorado Building Department (SCBD, formerly using Pueblo regional codes) for code enforcement. The department's attorney worked on revisions, and the ordinances were finalized and posted Oct. 14, though one was missed. An amended IGA was tabled to Nov. 18 so SCBD can add Rockvail.
