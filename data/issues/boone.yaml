- title: Refuse rate increase and utility billing changes
  summary: Council approved a refuse rate increase, a 3% trash fee increase under the contract, and signed the resolution in August. It also worked on a new utility billing system with credit card and ACH payments, and discussed switching internet from CenturyLink to Starlink at $280 a month.
