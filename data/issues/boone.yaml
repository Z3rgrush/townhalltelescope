- title: Water treatment facility project, construction draws and boil/bottled water advisory
  summary: The town is tracking the schedule for its new water treatment facility and approving draws on the project. A 2-year warranty applies, and a council member asked for an itemized breakdown of the draw. In August a leak in the GreenSands room and a problem with the chlorine pumps needed more investigation. The state health department lifted the bottled water advisory, and residents were still questioning the safe water notice.
  where: Townwide
