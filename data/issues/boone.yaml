- title: Park playground equipment, mower and sprinklers
  summary: Council discussed the town park needing new playground equipment, and the Edison fire chief suggested USDA and GOCO grants. Eight sprinkler heads were replaced after mowing damage and council approved buying a new mower. A park memorial re-dedication for the 250th anniversary was also on the June agenda.
