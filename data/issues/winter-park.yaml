- title: Town of Winter Park 2027 budget
  summary: Town Council is scheduled to hold a public hearing on Resolution 2355, which would adopt the 2027 budget and make appropriations for the calendar year beginning January 1, 2027. The Transit Advisory Committee is also reviewing the 2027 transit operating budget.
  where: Townwide
