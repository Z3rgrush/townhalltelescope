- title: Planning Commission development reviews
  summary: 'The Planning Commission has several projects on its agendas: a preliminary plat at 47 Village Drive, a master sign program for Arrow at Winter Park on US Highway 40, and site plans at 40 Ski Idlewild Road and 100 Trademark Drive. It will also review a plat exemption at 215 Dreamcatcher South and discuss the ROAM Neighborhood Park. The Board of Adjustment will hear a setback variance request at 23 Maple Road.'
