  - Transit
- title: Housing Authority purchases on Wheeler Road
  summary: Council, acting as the Winter Park Housing Authority, is to consider Resolution 37 authorizing a purchase and sale agreement for 34 Wheeler Road. The packet also lists Resolution 38 and a purchase agreement for 56 Wheeler Road. A closed session on buying or selling Town-owned property is also scheduled.
  where: 34 and 56 Wheeler Road
