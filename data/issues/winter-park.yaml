- title: Urban Renewal Authority tax increment deals (fire district and Cooper Creek Village)
  summary: The Urban Renewal Authority is to consider Resolution 25, a tax increment revenue agreement with the East Grand County Fire Protection District No. 4. It also plans a closed session to set negotiating strategy on a tax increment sharing agreement with the Cooper Creek Village Metro Districts. A separate Resolution 26 would hire Northland Securities for professional services.
