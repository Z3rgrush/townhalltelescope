- title: Wheeler Road housing purchases by Housing Authority
  summary: Council, acting as the Winter Park Housing Authority, considered resolutions authorizing purchase and sale agreements for 34 Wheeler Road and 56 Wheeler Road. A closed session on buying, selling or leasing Town-owned property was also scheduled.
