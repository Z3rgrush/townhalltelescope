  - Land & property
- title: Sojourn development agreement amendment and ADU deed restrictions
  summary: Council is to consider Resolution 2356, a second amendment to the Development Improvement Agreement for the Sojourn development. It would also authorize release of accessory dwelling unit deed restrictions.
