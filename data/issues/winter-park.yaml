- title: Urban Renewal Authority tax increment deals with Fire District and Cooper Creek Village
  summary: The URA board considered a tax increment revenue agreement with the East Grand County Fire Protection District No. 4 (Resolution 25) and a financial services agreement with Northland Securities (Resolution 26). It also planned a closed session on negotiating tax increment sharing with the Cooper Creek Village Metro Districts.
  where: Winter Park downtown
