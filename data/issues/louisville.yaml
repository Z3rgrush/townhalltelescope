- title: 2027-2028 city budget, mill levy and capital plan
  summary: Staff and council worked through a budget with an operating deficit, a General Fund gap and a six-year 2027-2032 capital plan. The City Manager's initial budget came Sept 1, a public hearing on the final budget was set for Oct 20, and adoption with the mill levy was scheduled Nov 2. The northeast water loop was pulled from the budget after rate discussions.
