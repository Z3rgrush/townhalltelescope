- title: Centennial Valley development plan amendment and open space/trails plan
  summary: The Open Space Advisory Board and Parks board held hearings on a Centennial Valley General Development Plan amendment for future residential development and parks. A resident said the housing would grow Louisville's units by 12% and the parks are too small, and the open space group LOSA wrote with critiques of the draft PROS Guidebook and trails plan, including Trail 18 and City Charter references. The draft PROS Guidebook also went to Council.
