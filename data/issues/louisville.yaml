- title: Golf course and recreation center 2027 fees
  summary: The Recreation Advisory Board reviewed golf fee models showing green fee increases alone cannot cover projected deficits, and recommended 2027 golf fees and pass rates to council. It also approved 3% resident and 7% non-resident increases for Rec and Senior Center admission, which went into the City Manager's 2027 fee update.
