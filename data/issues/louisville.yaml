- title: Inclusionary housing ordinance update (Ordinance 1936)
  summary: Council took up Ordinance No. 1936, amending the city's inclusionary housing rules, with a second-reading public hearing on Aug 18 and another hearing on Sept 15. Strong Towns Louisville and residents wrote in, urging zoning reform first, by-right incentives and an exemption for small projects of 10 to 12 units, and warning about costs to builders.
