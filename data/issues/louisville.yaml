- title: Centennial Valley General Development Plan amendment for future housing and parks
  summary: Council took up an amendment to the Centennial Valley GDP for Lot A of Filing No. 8 (Ordinance 1935, second reading with public hearing), and a related Centennial 8 Replat B combining 1006 Honeysuckle Lane. A resident letter says the plan would grow Louisville's housing units by 12% while its parks, trails and open space are inadequate. OSAB approved a resolution with a trail addition and sent it to council, and PPLAB held a hearing on the park components.
  where: Centennial Valley Business Park, Lot A / 1006 Honeysuckle Lane
