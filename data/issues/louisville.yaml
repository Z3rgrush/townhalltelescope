- title: Comprehensive Plan and Development Code update
  summary: The Planning Commission reviewed the updated Comprehensive Plan, with residents voicing concerns about projected growth, traffic, water supply, evacuation routes and wildfire risk. The City accepted a state DOLA grant and awarded a contract for a Development Code update, and Council and Planning Commission discussed the Commission's role in it.
