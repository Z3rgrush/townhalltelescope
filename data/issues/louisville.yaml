- title: Parks, Open Space and Trails (PROS) plan and open space protections
  summary: The draft PROS Guidebook, Long Range Plan and Trails System Plan went through the open space and parks boards and Council, with a resolution adopting the plans on the Nov 2 agenda. Louisville Open Space Advocates sent a long letter asking that the City Charter be followed, Trail 18 removed and buffers added. Residents also opposed development of 8600 Baseline and raised prairie dog concerns.
