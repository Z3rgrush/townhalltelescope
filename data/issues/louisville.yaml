- title: Development Code update and Comprehensive Plan
  summary: The city is moving to a development code update, with a DOLA grant accepted and a contract agreement on Council's Oct 6 agenda. Planning Commission reviewed the Comprehensive Plan on Oct 8; residents raised worries about projected growth, traffic, water, wildfire evacuation routes and community character.
