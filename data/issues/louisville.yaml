- title: 2027-2028 budget, mill levy and fee increases
  summary: Council worked through the 2027-2028 budget from the July retreat through the City Manager's initial presentation (Sept 1), a public hearing on Oct 20 and budget and mill levy adoption set for Nov 2. Discussion covered the General Fund gap, capital plan, 2027 fees, utility rates and a decision to pull the $780,000 northeast water loop from the budget.
