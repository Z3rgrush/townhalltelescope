- title: Sustainability funding, bag tax and climate action
  summary: The Sustainability Advisory Board met with Council Aug 11 on funding ideas, including a possible dedicated tax or fee, expanding the bag tax, renegotiating the Xcel franchise and water conservation. Residents asked for a climate impact fee, urban heat island work and more bag tax transparency. The board is also pursuing electrification rebates and heat pumps.
