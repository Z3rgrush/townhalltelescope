- title: Inclusionary Housing Ordinance update (Ordinance 1936)
  summary: Council moved an amendment to Title 17 on inclusionary housing from first reading (July 28) to second reading and public hearing on Aug 18, with a further public hearing on Sept 15. Strong Towns Louisville urged zoning reform first, by-right incentives and exemptions for small 10-12 unit projects, while another resident worried new market-rate units could raise prices.
