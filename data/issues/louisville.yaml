- title: 2027-2028 budget, mill levy and capital plan
  summary: Following the July 22 budget retreat, staff reported an operating deficit and a General Fund gap. The City Manager gave an initial budget presentation Sept 1, a final one with a public hearing Oct 20, and budget and mill levy adoption was scheduled Nov 2. Capital plan refinements, the Xcel franchise fee and the northeast water loop (pulled from the budget) were among the items discussed.
