- title: Delo Boom mixed-use development at 1390 Cannon Street
  summary: The Planning Commission took up Resolution 10 recommending approval of a final PUD, plat and special review use for a 135-unit mixed-use project (36 townhomes, 99 apartments, small commercial) on about 4.4 acres. The city's Community Development Director wrote in support, while a Delo resident argued the plan has about 161 on-site parking spaces against roughly 270 needed and asked where extra cars would park.
