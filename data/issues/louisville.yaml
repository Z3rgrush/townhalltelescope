- title: Golf course and recreation center fees for 2027
  summary: The Recreation Advisory Board reviewed golf fee modeling showing green fees alone cannot close the golf fund deficit, and recommended 2027 golf fees and passes. It also approved 3% resident and 7% non-resident increases to Recreation and Senior Center admission fees, which went into the 2027 City Manager fee resolution. A Council member asked whether a resident golf membership rate had been considered.
