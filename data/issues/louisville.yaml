- title: Sustainability funding, bag tax and climate action
  summary: At a joint meeting, the Sustainability Advisory Board proposed funding ideas including renegotiating the Xcel franchise agreement, expanding the bag tax, a dedicated tax or fee, and development impact fees. Residents asked about a climate impact fee, urban heat island strategies and bag tax transparency, and others urged electrification. LSAB also worked on electrification rebates and commercial sustainability rebates.
