- title: Inclusionary Housing Ordinance update (Ordinance 1936)
  summary: Council took up Ordinance 1936 amending Title 17 inclusionary housing rules, with a second-reading public hearing on Aug 18 and another hearing Sept 15 with second-reading amendments. Strong Towns Louisville urged zoning reform first, by-right incentives and an exemption for small 10-12 unit projects; a resident also wrote with concerns that new market-rate units could raise prices.
