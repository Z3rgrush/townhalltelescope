- title: Parks, Recreation and Open Space (PROS) plan and Trails Plan
  summary: A draft PROS Guidebook (Long Range Plan and Trails System Plan) went through OSAB, PPLAB and council discussion. Friends of Louisville open space groups asked for Charter-based changes, including removing Trail 18 and larger ecological buffers. Council adopted a PROS-related resolution on Nov 2 agenda. Residents also asked for bocce court investment.
