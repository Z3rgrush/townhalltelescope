  summary: The Sustainability Advisory Board presented to Council on Aug 11 with ideas such as a dedicated sustainability tax, extending the bag tax, a climate impact fee on development and franchise renegotiation, plus water conservation data. Residents wrote in about urban heat, bag tax transparency, and electrification grants. Later LSAB approved electrification rebate reallocation and a resident urged emissions-focused budgeting.
