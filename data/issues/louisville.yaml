- title: 2027-2028 budget, capital plan and deficit
  summary: Staff reported an operating deficit, a General Fund gap and a Capital Fund gap. The City Manager's initial budget came Sept 1 and final budget public hearing Oct 20, with adoption expected at a later meeting, likely in early November. Council cut some items, such as the Community Event Sponsorship Program, and pulled the $780,000 northeast water loop from the budget.
