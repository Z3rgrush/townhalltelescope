- title: Centennial Valley General Development Plan amendment, helipad and Redtail Ridge hospital
  summary: Council considered a PUD with a helicopter pad for an Advent/Avista hospital and the Centennial Valley GDP amendment for residential development and parks (Ordinance 1935). A resident questioned the GDP's treatment of LEED requirements and solar obligations, and another commenter said the parks and open space are inadequate for a development that would grow the city's housing by about 12%. The Open Space board unanimously approved a resolution supporting a trail.
