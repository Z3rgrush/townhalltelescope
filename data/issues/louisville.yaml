- title: Inclusionary Housing Ordinance update (Ordinance 1936)
  summary: Council considered amendments to Title 17 on inclusionary housing, with second reading and public hearing on Aug 18 and a further hearing on Sept 15. Strong Towns Louisville urged by-right incentives, exemptions for small 10-12 unit projects, and zoning reform first; another resident worried new market-rate units could raise prices.
