- title: Centennial Valley GDP amendment and Centennial Drive affordable senior housing
  summary: The Centennial Valley General Development Plan amendment would allow multifamily affordable housing and set building heights; it went to the parks and open space boards and the Planning Commission, which favored the project. A resident letter argued the proposed parks and open space are inadequate for a development that would grow Louisville's housing units by about 12%. A concept plan for affordable senior housing on Centennial Drive was set for Council Oct 6.
