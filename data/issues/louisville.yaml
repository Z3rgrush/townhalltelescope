  summary: The Recreation Advisory Board reviewed golf fee models showing green fees alone cannot close the Golf Fund shortfall, and recommended 2027 golf fees. It also backed 3% resident and 7% non-resident increases for Recreation and Senior Center admission. Fees were set in Council's Nov 2 resolution.
