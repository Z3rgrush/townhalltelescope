- title: Veterinary clinics as a conditional use (Ordinance No. 8)
  summary: Council amended the zoning code to allow veterinary clinics as a conditional use in a district, with a first reading August 11 and a public hearing on second reading September 8. Mayor Fuller said Council discussed the change and chose the conditional use application route.
