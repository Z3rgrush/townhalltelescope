- title: Proposed 1% sales and use tax for street improvements on November 3 ballot
  summary: Council took up a resolution for a November 3, 2026 election on a 1% sales and use tax, which residents call a street improvement tax. Residents John Tyson and Lee Roth spoke, asking for more information, about exceptions to the tax, and that the $400,000 already budgeted for street repair be combined with any new tax funds.
