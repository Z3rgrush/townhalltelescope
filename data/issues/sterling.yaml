- title: Rezoning 917 Hamilton Street from R-3 to Community Business
  summary: J-Tab Rentals, LLC asked to change the zoning at 917 Hamilton Street from High Density Residential (R-3) to Community Business (CB). The Planning Commission reviewed it in August. Council took first reading of Ordinance No. 10 on Aug. 25 and held the second-reading public hearing on Oct. 13, with no public comment.
