- title: Allowing veterinary clinics as a conditional use (Copper Gate Animal Clinic)
  summary: Porche Robison wants to open the Copper Gate Animal Clinic at 625-627 Holly Drive, but veterinary clinics are not permitted in the Medical Services zone. The Planning Commission suggested a map or text amendment. Council took up Ordinance No. 8 to allow veterinary clinics as a conditional use, with first reading Aug. 11 and a second-reading public hearing Sept. 8.
