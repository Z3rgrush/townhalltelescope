- title: Proposed street improvement sales tax for November 3, 2026 ballot
  summary: Council took up a resolution to refer a 1% sales and use tax to voters on November 3, 2026. At the September 8 meeting, residents John Tyson and Lee Roth asked for more information, questions about exemptions, the sunset clause and the time since the last tax increase, and asked that the $400,000 budgeted for street repair be combined with any new tax money.
