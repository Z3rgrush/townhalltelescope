- title: 'Resident concerns: chicken permits, shipping containers, speeding, loud mufflers'
  summary: Lisa LeFevre asked Council to revisit the chicken code and clarify the building permit process. Richard Bedford said the new shipping container rules have unintended problems with community business zoning. Residents also raised loud mufflers at night and speeding near Pioneer Park, and the city manager said he would pass the muffler complaint to police.
