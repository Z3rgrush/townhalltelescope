- title: Veterinary clinics as a conditional use (Ordinance No. 8) and Copper Gate Animal Clinic at 625-627 Holly Drive
  summary: Porche Robison asked to open a small veterinary clinic at 625-627 Holly Drive, but the Planning Commission found a clinic is not permitted in the Medical Services zone and recommended a map or text amendment with fees waived. Council then took Ordinance No. 8 through first reading and a second-reading public hearing to allow veterinary clinics as a conditional use.
