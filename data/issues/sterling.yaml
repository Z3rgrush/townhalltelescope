- title: Proposed street improvement sales tax on the November 3 ballot
  summary: Council took up Resolution 8-2-26 for a November 3, 2026 election on a 1% sales and use tax. Residents John Tyson and Lee Roth asked for more information, a sunset clause, exceptions, and combining the $400,000 already budgeted for street repair with any new tax money.
