- title: Proposed street improvement sales and use tax on the Nov. 3 ballot
  summary: Council considered Resolution 8-2-26 to refer a 1% sales and use tax question to the Nov. 3, 2026 election. Residents John Tyson and Lee Roth spoke about the proposed street improvement tax, asking for more information, raising a sunset clause and exceptions, and asking that the $400,000 already budgeted for street repair be combined with any new tax revenue.
