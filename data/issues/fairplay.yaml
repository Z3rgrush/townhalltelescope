- title: Fairplay Police Station construction and police matters
  summary: The Town paid for a structural assessment of the police station and on Nov. 16 considered Resolution 38 on a spending award for construction of the Fairplay Police Station. Executive sessions also covered legal advice and personnel matters involving Chief Jeff Worley and an officer. The Town is also revising its automated vehicle identification system ordinance (Ordinance 6), which had first reading Nov. 2 and second reading Nov. 16.
