- title: Funding requests from community groups and events
  summary: The Board weighed funding for the Burro Days request from South Park School District RE-2, the Halloween Spooktacular, Rocky Mountain Rural Health and the Park County Senior Coalition. It also considered Boys & Girls Club facility needs, and chose a Mardi Gras fundraiser beneficiary. It donated $1,000 to the South Park High School football car show fundraiser after a resident's request.
