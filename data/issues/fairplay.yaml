- title: Land swap with Park County (Ordinance No. 5)
  summary: On first reading, Ordinance No. 5 would authorize the Town to convey Park County Parcel No. 32670 to Park County in exchange for property from the county. The Board and the county commissioners also held a joint session on Sept. 15.
