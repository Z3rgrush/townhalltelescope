- title: Wastewater lagoon project and water resource planning
  summary: The Town is paying for engineering on a wastewater lagoon liner and new lagoon, plus a new pump and motor for the treatment plant. It held a work session on water rights and the utilities capital plan. Colorado Rural Water presented on the Source Water Protection Plan.
