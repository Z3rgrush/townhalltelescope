- title: 2026 amended and 2027 budget, fee schedule and staffing
  summary: The Town reviewed the 2027 budget through the fall. This included preliminary staffing and salaries, a proposed police department budget, capital projects and the events budget. The amended 2026 and proposed 2027 budgets had a first hearing on Nov. 2 and a second on Nov. 16. The Board also reviewed changes to the 2027 fee schedule and year-end employee bonuses.
