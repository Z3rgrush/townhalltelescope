- title: Gemenskap development sewer dispute and lawsuit
  summary: The Board has repeatedly gone into executive session on the sewer system at the Gemenskap development in Park County, including mediation with the developer on July 27, 2026, a joint session with the Park County commissioners on Sept. 15, and by November a lawsuit the developer filed against the Town. The documents also mention settling Sallie Williard's potential claim; no outcome is stated.
