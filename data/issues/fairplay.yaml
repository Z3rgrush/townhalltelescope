- title: Gemenskap development sewer system negotiations and mediation
  summary: The Board repeatedly went into executive session to discuss negotiation strategy over the sewer system at the Gemenskap development in Park County. The sessions cover a mediation with the developer held July 27, 2026, and related discussions. A joint executive session with the Park County commissioners was set for Sept. 15. The agendas also list settlement of Sallie Williard's potential claim.
