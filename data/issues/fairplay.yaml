- title: Gemenskap development sewer dispute and lawsuit
  summary: The Board has repeatedly gone into executive session, including a joint session with the Park County commissioners on Sept. 15, about the sewer system at the Gemenskap development. The agendas mention mediation with the developer on July 27, a related claim and a lawsuit the developer filed against the Town. The documents do not state any outcome.
