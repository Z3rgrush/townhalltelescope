- title: Exceptions to the STR moratorium and 2027 license processing (Ordinances 2026-10, 2026-11, 2026-12)
  summary: Ordinance 2026-10 would let a limited group of owners, including recent buyers who submitted nearly complete applications, apply for a short-term rental license despite the moratorium, with an application deadline of Nov. 1, 2026. Ordinance 2026-11 sets up processing of renewal applications and licenses effective May 1, 2027, and Ordinance 2026-12 amends the STR code processes. At the Oct. 20 meeting a resident asked for reinstatement of an expired license.
