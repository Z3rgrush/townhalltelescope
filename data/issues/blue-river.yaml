- title: Exceptions to the STR moratorium for new and renewing license applicants
  summary: Ordinances 2026-10, 2026-11, 2026-12 and a draft 2026-13 would let owners who bought property intending to rent, or who nearly completed a license application or renewal, apply despite the moratorium. The 2026-10 exception has a November 1, 2026 application deadline, and the draft 2026-13 offers options for who qualifies for a renewal exception. Affected owners spoke, including one asking for reinstatement of an expired license.
