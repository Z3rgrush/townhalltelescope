- title: Transition Zone District lot size and setback rules (Ordinance 2026-06 and 2026-07)
  summary: The Board held a hearing on Ordinance 2026-06, which sets minimum lot size, lot width and setbacks in the Transition Zone District. Ordinance 2026-07 would put a Development Code in effect Oct. 1, 2026, on the condition that 2026-06 is in effect. Discussion covered consistency with R-1 standards and wetland and topography limits.
