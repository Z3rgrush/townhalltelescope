- title: Sewer, septic and traffic concerns raised by residents
  summary: Residents raised aging septic systems and environmental concerns along Blue River Road and asked the Town to explore grants, financing and partnerships for future sewer infrastructure. Others raised neighboring construction and easements, and speeding on Indiana Creek Road with requests for traffic calming.
