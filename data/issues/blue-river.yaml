- title: Short-term rental caps, zones and new licensing rules
  summary: The Board held repeated work sessions on a revised short-term rental program. Direction covered a six-zone framework, cap percentages by zone, a possible nightly rental limit (about 150 nights per year), enforcement and a hearing officer, with a new ordinance planned for Jan. 1, 2027. Residents urged enforcement against unlicensed operators and consideration for owners hurt by the moratorium.
