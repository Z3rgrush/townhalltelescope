- title: '1253 Indiana Creek Road residence: height, garages and carriage house'
  summary: The Commission held a pre-application session on a proposed home. Topics were the 35-foot height limit, whether recessed garage entrances count as basement entries, the 25% garage area limit, two separate living areas and a carriage house. The applicant was asked for revised exhibits showing existing and proposed grades.
