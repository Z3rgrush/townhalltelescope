- title: Short-term rental moratorium, caps and new STR rules
  summary: The Board has spent several meetings working toward a new short-term rental ordinance, with a six-zone framework, caps by zone, license allocation, enforcement and possible nightly limits, aimed at taking effect in 2027. Residents urged stronger enforcement against unlicensed operators and repeat violators, and raised water and wastewater concerns.
