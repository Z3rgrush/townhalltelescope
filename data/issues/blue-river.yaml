- title: Transition Zone District lot size and setback changes (Ordinances 2026-06 and 2026-07)
  summary: Ordinance 2026-06 sets minimum lot size, lot width and setbacks in the Transition Zone District. Ordinance 2026-07 would make the Development Code effective Oct. 1, 2026, conditioned on 2026-06 being in force. A resident commented on setbacks at the Sept. 15 hearing.
