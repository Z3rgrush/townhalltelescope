- title: Transition Zone District lot size and setback amendments and Development Code
  summary: Ordinance 2026-06 sets minimum lot size, lot width and setbacks in the Transition Zone District, and Ordinance 2026-07 would put a Development Code into effect October 1, 2026 on condition that 2026-06 is in force. A resident commented on setbacks at the hearing, and the Board discussed wetlands and topography constraints.
