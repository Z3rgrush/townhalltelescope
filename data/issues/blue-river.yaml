- title: Short-term rental caps, zones and moratorium exceptions
  summary: 'The Board has been working through a new short-term rental policy: a six-zone framework with license caps by zone, a draft ordinance effective Jan. 1, 2027, and licensing set to begin May 1, 2027. Ordinances 2026-10, 2026-11 and 2026-12 would let some owners hurt by the moratorium (Ordinance 2026-03) apply, with a Nov. 1, 2026 application deadline, and change renewal and enforcement processes. Residents urged enforcement against unlicensed operators and fair treatment for recent buyers.'
