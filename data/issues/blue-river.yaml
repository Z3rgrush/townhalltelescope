- title: Proposed 2027 budget and town finances
  summary: The Board was scheduled to hear a presentation and discuss the proposed 2027 budget on Oct. 20. Financial reports show a 10.459 mill levy after a temporary credit, and 2026 general property tax is projected at about $930,583.
