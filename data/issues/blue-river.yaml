- title: Planning Commission review of 1253 Indiana Creek Road residence and other projects
  summary: The Commission held a work session on a proposed residence at 1253 Indiana Creek Road. It discussed the 35-foot height limit, recessed garage entrances, garage area limits, two separate living areas and possible restrictive covenants. A detached garage and variance at 0809 Blue River Rd, shed provisions in the land use code and wetland protection items are also on the agenda.
