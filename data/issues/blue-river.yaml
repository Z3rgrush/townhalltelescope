- title: Porch, deck and roof project at 6871 Highway 9 and wildfire code review
  summary: The Planning Commission found the application incomplete in August because it lacked wildfire-code measurements, a current survey and parking and second-access information on Highway 9. In September it found the revised materials adequate and approved the application. The Town Attorney advised on how far the Highway 9 Access Control Plan applies to minor projects.
