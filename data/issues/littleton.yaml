- title: 2027 budget and tax levies
  summary: On Nov. 3 council had first reading of ordinances appropriating the 2027 annual budget, adopting enterprise fund budgets and amending the 2026 budget, plus tax levies for the city and the Downtown Development Authority. Council also discussed the 2027 fee schedule on Nov. 10, and approved 2027 operating plans for the Aspen Grove and Mineral business improvement districts.
