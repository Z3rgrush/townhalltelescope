- title: Independent hearing officers for employee grievances
  summary: A virtual special meeting on Oct 29 considered Resolution 2026-08, creating two to three independent hearing officers to hear grievances over discipline and terminations by the Town Manager, and amending personnel rules. The Town Council would no longer sit as the hearing body.
