- title: Bell Street parking and crosswalk safety
  summary: Public works repaired sidewalk on west Bell Street, and a No Parking area by the park will extend 50 feet. A resident thanked the Town for the crosswalk but raised sign placement, and a council member worried about the parking ban during events.
