- title: Water and wastewater plant repairs
  summary: Staff reported the wastewater pond liner needs replacement, with other lagoon liners also needing work and grants being sought. The water plant has structural problems including corrosion, and the middle zone water tank re-coating project was proposed for delay. Repairs to chlorine pumps and the water softener were also reported.
