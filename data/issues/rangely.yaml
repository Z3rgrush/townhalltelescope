- title: Town Manager's outside employment and independent hearing officers
  summary: A resident raised concerns about the Town Manager, and council discussed his employment outside the Town. On Oct. 29 council held a special virtual meeting on Resolution 2026-08, creating two to three independent hearing officers to hear employee grievances over discipline and terminations by the Town Manager.
