- title: Stage 3 water shortage and river supply
  summary: Low river flow put the Town into Stage 3 water restrictions. The Rangely water conservancy district released 10 cfs from Kenney Reservoir, and the Town manager noted senior upriver water rights. Restrictions later eased back toward stage 1, and council discussed the water ordinance and bulk water customers under Emergency Ordinance 707.
