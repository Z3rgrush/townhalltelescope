- title: Stage 3 water restrictions and White River water supply
  summary: Rangely entered Stage 3 water restrictions, and the water conservancy district released 10 cfs from Kenney Reservoir to help; the town later returned to stage 1. Council also considered Resolution 2026-07 declaring a municipal water urgency and authorizing negotiation, but not execution, of a conditional storage agreement for the White River Regional Water Supply Project.
