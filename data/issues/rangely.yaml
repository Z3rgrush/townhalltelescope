- title: White River Regional Water Supply Project storage agreement
  summary: Council considered Resolution 2026-07 declaring a state of municipal water urgency and a finding of municipal water supply need. It would authorize negotiation, but not execution, of a conditional storage agreement for the White River Regional Water Supply Project.
  where: Townwide
  refs:
  - 7
- title: Water and wastewater plant repairs
  summary: Staff reported the wastewater plant pond and lagoon liners need replacement, and the water plant has structural issues, with corrosion and a separate structural inspection of rafters and columns. The middle zone water tank re-coating project was proposed for delay, and grants are being sought for the costs.
