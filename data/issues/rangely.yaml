- title: Geothermal energy campus and proposed data center
  summary: Council took up the Energy Campus Development & Municipal Participation Study (stage 2 of Rangely's geothermal development). Residents including Tanner Nielsen and Camille raised concerns about a possible data center, its water use, noise, jobs and secrecy. Tanner asked for a moratorium on data centers, and an NDA ban for public officials was raised in October.
