- title: Geothermal energy campus and proposed data center
  summary: Council repeatedly took up the Energy Campus Development & Municipal Participation Study (stage 2 of Rangely geothermal development). Residents including Tanner Nielsen and Camille raised concerns about a possible data center, water use, noise, NDAs and transparency, and Nielsen suggested a moratorium and a solar partnership with CNCC. A proposal was raised to bar officials from signing NDAs for economic development.
