- title: Water shortage, Stage 3 restrictions and White River water supply
  summary: The Town went into Stage 3 water restrictions as river flow dropped, with the water conservancy district releasing 10 cfs from Kenney Reservoir; it later returned to Stage 1. Council took up Resolution 2026-07 declaring a municipal water urgency and authorizing negotiation, but not signing, of a conditional storage agreement for the White River Regional Water Supply Project. Council also dealt with bulk water customers under Emergency Ordinance 707.
