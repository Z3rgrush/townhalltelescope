- title: Geothermal energy campus and proposed data center
  summary: Council repeatedly took up the Energy Campus Development & Municipal Participation Study, stage 2 of Rangely's geothermal development. Residents such as Tanner Nielsen and Camille raised concerns about a data center tied to it, including water use, noise, jobs, transparency and NDAs, and one suggested a moratorium. A council member said he spoke with someone at a data center about noise.
