- title: Countywide sales tax on the November ballot for homelessness services
  summary: The Commission put a special-purpose countywide sales tax on the November 3 ballot tied to services for the unhoused population, and discussed creating a citizen oversight board for how the money is spent.
  refs: [17, 20, 35, 56, 62, 69]
- title: 2027 budget and exceeding the revenue-neutral rate
  summary: After weeks of department budget workshops, the UG held a hearing on its amended 2026 and proposed 2027 budgets and its intent to exceed the revenue-neutral rate. Commissioners pushed to drop an extra mill from the proposed levy.
  refs: [12, 13, 15, 16, 21, 24]
- title: Late-August storm recovery and debris cleanup
  summary: The Commission extended the storm emergency declaration, heard updates on state assistance, SBA disaster loans and debris removal, and got regular cleanup reports into October.
  refs: [24, 56, 57, 71]
- title: Midtown Station development and its feasibility study
  summary: The proposed Midtown Station project was sent back to committee, and commissioners required an independent financial feasibility and economic impact study before voting.
  refs: [5, 26]
- title: Short-term rental permits and neighbor complaints
  summary: Many non-owner-occupied short-term rentals came up for special use permits and renewals. Commissioners debated being notified of complaints and police reports, and an appeal tested the renewal rules.
  refs: [1, 10, 36, 38, 49, 60]
- title: State "by-right" housing law and accessory dwelling units
  summary: Planners presented changes required by Kansas's new By-Right Housing Development Act (SB 418), and the Commission advanced an ordinance allowing accessory dwelling units.
  refs: [10, 38, 49]
- title: Demolishing the old downtown library at 625 Minnesota Avenue
  summary: The Landmarks Commission voted down permission to demolish the former library in the Downtown Commercial Historic District, and the decision went on to the Commission.
  where: 625 Minnesota Ave
  refs: [30, 31, 51]
- title: Liquor store proposed near a church at 4732 State Avenue
  summary: An applicant sought a variance and special use permit for a liquor store about 1,180 feet from Grace Temple Baptist Church, inside the 1,300-foot buffer the code requires.
  where: 4732 State Ave
  refs: [37, 38, 59, 60]
- title: Police surveillance technology and new officers
  summary: KCKPD updated commissioners on its real-time crime center, license plate readers and drones, and accepted a federal COPS grant to hire 12 more patrol officers.
  refs: [18, 28, 34]
- title: Restructuring the Wyandotte County Library Board
  summary: A charter resolution abolished and recreated the countywide library board with fewer members, and the new board drafted bylaws for splitting library levy money.
  refs: [7, 17, 42, 70]
- title: Land Bank homes and new housing in northeast KCK
  summary: The Land Bank reported 478 active option agreements, and the CJR project north of Quindaro, expected to bring 400 to 500 homes, has started pulling building permits.
  where: Northeast KCK / Quindaro
  refs: [25, 47]
- title: STAR bonds and the Kaw River bridge financing
  summary: The Commission amended its STAR bond participation ordinance for a major sports project and changed how CID money on the Kaw River bridge development repays costs.
  refs: [26, 41, 56]
- title: Community Benefit Ordinance spending (parks, home child care, housing trust)
  summary: The advisory board reviewed how Village West-area community benefit money funds parks projects, home-based child care grants and a housing trust fund, and recommended 2026 allocations.
  refs: [19, 46, 69]
- title: American Royal fee spending on fiber and a downtown plan
  summary: Leftover American Royal fee money ($1.47 million) was allocated to fiber expansion along Leavenworth Road, Parallel and Fairfax and a mini master plan for downtown KCK.
  refs: [7]
- title: Downtown KCK improvement district renewal
  summary: The downtown self-supported municipal improvement district was found consistent with the comprehensive plan and re-established, funding crosswalks and "KCK Letters" projects.
  where: Downtown KCK
  refs: [6, 10, 69]
- title: Park upgrades for the World Cup and a new golf clubhouse
  summary: The parks capital plan includes paving and lighting at Wyandotte County Park, Kaw Point and other sites ahead of the World Cup, and the park board pushed a $9.5 million golf clubhouse.
  refs: [12, 29]
