- title: Denver Health sales tax spending
  summary: Council reviewed how the 0.34% Denver Health sales tax approved in 2024 is being spent and moved a string of new and amended contracts with Denver Health, including the behavioral health services at 777 Bannock Street.
  where: 777 Bannock St
  refs: [36, 44, 47, 98, 116]
- title: Homeless shelters and rapid rehousing contracts
