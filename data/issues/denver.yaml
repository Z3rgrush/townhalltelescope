- title: Homelessness shelters and rapid rehousing contracts
  summary: Council approved a stream of contracts for rapid resolution and rapid rehousing services, including Salvation Army, Volunteers of America, St. Francis Center, Delores Project and Colorado Coalition for the Homeless. It also approved temporary pallet and micro-community shelter licenses with Colorado Village Collaborative at 3815 N Steele St. and The Gathering Place at 1375 N. Elati St., plus an emergency shelter scope change at the Sand & Sage/Westerner Motel on East Colfax.
