- title: Broadway Station pedestrian bridge and stadium site
  summary: Committee advanced an amended 2025 stadium site intergovernmental agreement with the Broadway Station Metropolitan District and a state grant for a pedestrian bridge over the railroad and RTD tracks. The bridge links the Broadway RTD station to the NWSL soccer stadium and Santa Fe Yards.
