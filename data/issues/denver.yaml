- title: Denver Health sales tax and Caring for Denver spending limits
  summary: Council reviewed spending of the .34% Denver Health sales tax passed in 2024 and amended a contract with Denver Health. Ordinances would bar Caring for Denver, Preschool Program and college affordability tax money from being spent on alcohol and other administrative costs. A Care Over Incarceration grant of $2.7 million for the STAR program was also accepted.
