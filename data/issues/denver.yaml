- title: Downtown Development Authority boundaries and projects
  summary: Council repeatedly expanded the Denver Downtown Development Authority's boundaries and approved DDA funding for the Midland Condominiums, the University Building on 16th Street and 101 W Colfax, where the city is also leasing space.
