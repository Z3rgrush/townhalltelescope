- title: Mayor's proposed 2027 budget and council amendments
  summary: Council received the Mayor's Proposed 2027 Budget on Oct. 19 with a public hearing, then voted on a series of amendments on Nov. 2, some carried and some failed. The 2027 annual appropriation, a $16.1 million rescission of unused capital funds, and several special-fund changes moved through Finance on Nov. 3. The budget is back on the Nov. 9 agenda with a public hearing.
