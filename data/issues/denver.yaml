  refs: [30, 44, 67, 93, 112]
- title: Council votes down Citibot and Slalom tech contracts
  summary: After being called out for debate, resolutions adding $3.9 million to the Citibot chatbot contract and $5 million to the Slalom consulting contract both failed on the council floor.
  where: Citywide
  refs: [78, 91, 102]
