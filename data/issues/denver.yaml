- title: Affordable housing loans and DHA agreement
  summary: Council advanced an amended agreement with the Denver Housing Authority, a loan to 1600 Pearl LLLP for housing in North Capitol Hill, and a loan for a 118-unit income-restricted building. It also approved state funding for middle-income row homes at Loretto Heights and an amended loan involving 3755 Tennyson St.
