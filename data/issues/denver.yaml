- title: Airport use and lease agreements and DEN projects
  summary: Council approved a block of three-year use and lease agreements with airlines at Denver International Airport, including Air Canada, Air France, Alaska, Lufthansa, Turkish and WestJet. One item (COPA) was called out. Council also approved large DEN construction contracts and airport bond note plans.
