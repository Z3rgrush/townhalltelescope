- title: District 6 police facility and Civic Center projects
  summary: Council approved design and construction contracts for a new Denver Police District 6 station and garage at 1566 N. Washington St., and added $1.63 million for Studio Gang on Civic Center Park. It also approved a Cuernavaca Park facility amendment of $8.1 million and an East Colfax CD8 sidewalk land acquisition ordinance.
