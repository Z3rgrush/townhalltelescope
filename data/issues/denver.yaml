- title: Caring for Denver, preschool and college tax spending limits
  summary: A committee advanced ordinances barring Caring for Denver, Denver Preschool Program and college affordability tax revenue from being spent on alcohol and other administrative items, and the Caring for Denver ones also bar spending on staff wellness programs. Council also handled the Denver Health sales tax spending update and contract.
