- title: Flood control and infrastructure projects
  summary: Council approved agreements for the Globeville Levee project, Harvard Gulch and Valverde drainage, Tower Road sanitary interceptor, and Civic Center Park (Studio Gang). Other items include Welton Street, a Broadway Station pedestrian bridge and the East Colfax sidewalk project land acquisition.
