- title: Downtown Development Authority boundaries and funding agreements
  summary: Council approved changes to the Denver Downtown Development Authority boundaries and advanced DDDA funding agreements for the Midland Condominiums unit at 444 17th St., the University Building at 900-918 16th St., and 101 W. Colfax Ave., where the city also approved a lease for about 64,654 square feet.
