- title: NWSL stadium at Santa Fe Yards and the Broadway Station bridge
  summary: Council amended the agreement with the Broadway Station metro district for the women's pro soccer stadium site and took a state grant for a pedestrian bridge over the rail lines linking the Broadway RTD station to the stadium and Santa Fe Yards.
  where: Broadway Station / Santa Fe Yards
  refs: [27, 34, 117]
- title: Mayor's proposed 2027 budget
  summary: The Finance Department walked council through the budget book, council worked through proposed changes to sales tax initiatives, and the mayor's 2027 budget was set for a public hearing on October 26.
