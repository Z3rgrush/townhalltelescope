- title: Homeless shelter, rapid rehousing and housing contracts
  summary: Council approved many contracts for rapid rehousing and rapid resolution services (Salvation Army, Volunteers of America, St. Francis Center, Delores Project, Urban Peak and others). Other items include pallet shelters at 3815 N Steele St, a micro-community shelter at 1375 N. Elati St, emergency shelter at the Sand & Sage/Westerner Motel, and a congregate shelter presentation. The Department of Housing Stability also got a one-year 2027 continuation plan.
