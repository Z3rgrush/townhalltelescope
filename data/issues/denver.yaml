- title: Citibot and Slalom contract amendments fail
  summary: Council called out and voted down amendments to the city's contracts with Citibot ($3.89 million added) and Slalom ($5 million added) on Oct. 13 after they had cleared committee. Council had earlier postponed other contract items, such as a $500,000 addition to the Wheeler Trigg O'Donnell legal contract.
