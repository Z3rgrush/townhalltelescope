- title: Business improvement district budgets and Colfax Mayfair expansion
  summary: Council reviewed 2027 operating plans and budgets for many business and general improvement districts and set a Nov. 9 hearing on adding property to the Colfax Mayfair BID. Annual maintenance cost approvals for streetscapes and pedestrian malls went to a Board of Equalization hearing.
