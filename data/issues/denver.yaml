- title: Parks capital projects and fees
  summary: Council approved Vibrant Denver bond funding for theatre and museum projects, Red Rocks improvements, Boettcher Concert Hall renovation, a new DPR NW facility at Cuernavaca Park, and on-call parks contracts worth up to $20 million each. Golf and Mountain Parks fee schedules were advanced.
