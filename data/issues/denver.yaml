- title: Affordable housing loans and rezonings
  summary: Council took up affordable housing loans, including one creating 118 income-restricted units and a loan for 3755 Tennyson St. It also took up a Loretto Heights middle-income row home contract and rezonings at 3418 W. 14th Ave and 1371 N Julian St, 3343-3351 N Mariposa St, and 76 N Hazel Ct and 4519 area. A regulatory reform and HUD PRO Housing presentation was heard.
