- title: Homelessness shelter and rapid rehousing contracts
  summary: Council approved a stream of contracts for rapid resolution and rapid rehousing (St. Francis Center, Salvation Army, Volunteers of America, Delores Project, Colorado Coalition for the Homeless). It also approved Colorado Village Collaborative licenses for pallet and micro-community shelters, including at 3815 N Steele St, and changed the scope of emergency shelter funding at the Sand & Sage/Westerner Motel on East Colfax.
