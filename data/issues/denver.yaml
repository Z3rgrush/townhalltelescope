- title: Mayor's Proposed 2027 Budget and council amendments
  summary: Council held the public hearing on the Mayor's Proposed 2027 Budget on Oct. 19 and took up a series of council member amendments on Nov. 2 and Nov. 9. The Finance committee also advanced the 2027 appropriation ordinance, a rescission of $16.1 million in unused capital funds, and 2027 plans for business improvement districts.
