- title: New 2% sales tax chapter for capital improvements (Ordinance No. 678)
  summary: The Town Board discussed an ordinance adopting a new Chapter 3.02 of the municipal code covering the town's 2.0% sales tax, to be used for construction and rehabilitation of capital improvements. It was discussed in August and September and Ordinance No. 678 was up for approval on October 8, 2026.
