- title: Outdoor pickleball court and 3rd Street Park
  summary: The Parks & Recreation board discussed building an outdoor pickleball court, possibly splitting the court, with a cost near $260,000. Staff are looking for grants, and a pickleball co-op was suggested. The board also received 3rd Street Park updates at each meeting, and one project has a $5,000 grant.
