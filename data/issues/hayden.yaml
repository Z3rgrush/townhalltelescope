- title: Pickleball court and 3rd Street Park
  summary: Parks and Recreation discussed creating an outdoor pickleball court, possibly split to serve other uses, with a cost estimate of $260,000 and a search for grants. A pickleball co-op was suggested. 3rd Street Park updates remained on agendas through October.
