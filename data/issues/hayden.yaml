- title: 2027-2029 draft budget, COLA and proposed 32-hour work week
  summary: The Town Council, the Northwest Colorado GID and the Housing Authority held their budget discussions in tandem. Staff presented the draft 2027-2029 budget and asked for direction on an additional COLA increase and a proposed 32-hour work week. The property tax sheets show a general fund mill levy of 25.067 and a debt service levy of 3.990, with about $1.54 million in budgeted property tax revenue.
