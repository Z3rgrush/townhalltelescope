- title: Data center moratorium study and citizen advisory committee
  summary: Council is running a study tied to a data center moratorium. A citizen committee was to be announced shortly, and the Data Center Citizen Advisory Committee appointment was on the Nov. 5 agenda. Council also asked staff to draft letters to state and federal representatives about data center bills.
