- title: Council endorsements of 2026 ballot measures (fire district, schools, CMC, regional transit)
  summary: Council considered Resolution 2026-14 endorsing ballot measures 6A (West Routt Fire mill levy override), 4B (Hayden schools joining Colorado Mountain College district), 7A (half-percent sales tax for the Yampa Valley Regional Transportation Authority) and 4A (Hayden RE-1 mill levy override). Councilmember Haight objected to the language on the transportation authority and moved to remove it. Resolution 2026-16 separately endorsed referral of Measure 7A.
