- title: Council endorsement of 2026 ballot measures (fire district, school district, CMC, regional transit)
  summary: Council considered Resolution 2026-14 endorsing Measure 6A (West Routt Fire mill levy override), 4B (annexing Hayden RE-1 into Colorado Mountain College District), 7A (half-percent sales tax for Yampa Valley Regional Transportation Authority) and 4A (Hayden RE-1 mill levy override). Councilmember Haight objected to the transit language and moved to remove it; a separate Resolution 2026-16 on Measure 7A also came up on Oct. 15.
