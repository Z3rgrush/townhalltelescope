- title: 2027-2029 draft budget and property tax
  summary: The Town, its Housing Authority and the Northwest Colorado GID received presentations on the 2027-2029 draft budget. Town documents show operating mill levy of 25.067 and debt service levy of 3.990, with about $1.54 million in budgeted property tax revenue and sales tax projected near $2.35 million.
