- title: Council position on 2026 ballot measures (fire district, school, CMC, RTA)
  summary: Council considered Resolution 2026-14 endorsing Measures 6A (West Routt Fire mill levy override), 4B (annexing Hayden RE-1 into Colorado Mountain College district), 7A (half-percent sales tax for Yampa Valley Regional Transportation Authority) and 4A (Hayden RE-1 mill levy override). Councilmember Haight objected to the RTA language and moved to remove it. A separate Resolution 2026-16 on endorsing 7A also appeared on the Oct. 15 agenda.
  where: Townwide
