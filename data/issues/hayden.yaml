- title: 'Spruce Summit battery storage site: master plan amendment and rezone'
  summary: The Town of Hayden has applied to change the future land use of a 73-acre parcel to Industrial/Business/Light Industrial and rezone it from Commercial to I-2 Industrial. If approved, the site is planned for battery and energy storage systems through a later major site plan application. The Planning Commission was set to review both requests on July 30, 2026.
  where: 73-acre parcel (Spruce Summit), Hayden
