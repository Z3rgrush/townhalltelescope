- title: 2027-2029 draft budget and property tax
  summary: The Town Council, Housing Authority and Northwest Colorado GID were presented the 2027-2029 draft budget in October. Town budget materials show a 25.067 mill operating levy and 3.990 mill debt service levy, about $1.54 million in budgeted property tax revenue, and a forecast of sales tax near $2.35 million.
