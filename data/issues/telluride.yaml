- title: Carhenge Redevelopment Project review
  summary: The Historic & Architectural Review Commission has three Preliminary Large-Scale applications for the Carhenge site (Buildings A–C, D1–D2, E1–E3), after earlier continuances from July and August 2026. Town Council also considered a resolution on a preliminary large-scale subdivision consolidating Lots 34 and 34B, Backman Village Subdivision.
