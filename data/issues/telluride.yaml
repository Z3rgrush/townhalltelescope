- title: Telluride Housing Authority waitlist policy and rental housing rules
  summary: 'The Housing Authority and its subcommittee are reworking the employee rental housing waitlist rules (§105 and 106.1) after a recent suspension of the waitlist. They are also considering bedroom-size exceptions for households, a partial 2027 rental rate increase, and a policy on primary residency for children of multiple custodial parents (adopted with amendments: 20% cutoff, through age 18).'
