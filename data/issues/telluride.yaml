- title: Telluride Housing Authority waitlist and rental policies
  summary: The Housing Authority and its subcommittee are working on waitlist management (§105) and leasing procedures under the Employee Rental Housing Policies, following a recent suspension of the waitlist. They also took up a policy statement on partial 2027 rental rate increases and an interpretation of primary residency for children of multiple custodial parents, adopted with amendments (20% custodial cutoff, age through 18).
