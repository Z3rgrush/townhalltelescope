- title: Deed restriction amendments for Fino affordable units
  summary: The Housing Authority considered a resolution to amend deed restrictions on Town-built affordable units at 215 East Colorado Avenue (Units 1A and others). Staff described it as a last-resort request to amend the contract, not an exception, and the Town Council was also to consider authorizing it.
