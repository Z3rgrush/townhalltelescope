- title: 2027 Town budget workshops
  summary: Town Council held a budget workshop on October 13 covering 12 funds requesting $12.11M in revenue and $16.11M in spending. The Open Space set-aside would be drawn down by $4.25M, the Transportation Fund transfer would grow by $290,000, lodgers' tax is projected to rebound, and a Lodgers Tax position would move to full time. Water and sewer rate and fee schedule drafts were also reviewed, with adoption planned for November 17. The Open Space Commission also planned to discuss the budget with the Town Manager.
  where: Townwide
