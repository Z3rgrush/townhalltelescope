- title: Shandoka Lot Redevelopment PUD and large-scale review
  summary: The preliminary PUD for redeveloping Lot L (about 4.07 acres) in Backman Village seeks larger dimensional limits in return for public benefits. Planning & Zoning continued it without discussion because of staff capacity, and HARC plans to continue its review to November 18, 2026.
