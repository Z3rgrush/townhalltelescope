- title: Pergola built without a permit at Swede Finn Hall
  summary: HARC reviewed a pergola on a rated historic structure at Swede Finn Hall, near West Pacific Avenue and Townsend Street, that was built without permits. Staff found insufficient justification for approval and suggested denial or a temporary-structure permit.
