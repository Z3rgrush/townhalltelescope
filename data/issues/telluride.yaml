- title: Campground and shower fee increases for 2027
  summary: The Parks & Recreation Commission considered 2027 Town Park campground fee increases of $2-$5 per night (about 8% average), projecting $203,304 in revenue versus $192,866 budgeted for 2026. Shower fees would rise to bring in $62,500, up 25% from $50,000. The commission also discussed the 5-year capital fund and Town Park Oval improvements.
