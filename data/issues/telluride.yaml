- title: Carhenge Redevelopment Project review
  summary: HARC has three Preliminary Large-Scale applications for the Carhenge Redevelopment (Buildings A–C, D1–D2, E1–E3) on Lots 34 and 34B, Backman Village. The applications were continued from July and August and were on the Sept. 30 agenda. On Oct. 27 Town Council considered a resolution affirming the July 23 P&Z decision on a preliminary large-scale subdivision consolidating the two lots.
