- title: Affordable housing waitlist and Housing Authority policies
  summary: The Housing Authority and its subcommittee are reworking the employee rental housing waitlist rules in sections 105 and 106.1, after a recent suspension of the waitlist. They also adopted a policy on primary residency for children of multiple custodial parents, are considering a partial 2027 rental rate increase, and are amending deed restrictions on town-built units at 215 E. Colorado Ave. Bedroom size standards and exceptions for households in multi-bed units are also under discussion.
