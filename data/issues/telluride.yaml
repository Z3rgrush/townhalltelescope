- title: 2027 campground and shower fees
  summary: Staff proposed 2027 Town Park campground fee increases of $2 to $5 per night (about 8%), projecting $203,304 in revenue, up 5% from the 2026 budget. Shower fees are projected to raise $62,500, up 25% from $50,000. The commission also discussed the 5-year capital improvement fund.
