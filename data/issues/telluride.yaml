- title: Housing waitlist policies and Telluride Housing Authority actions
  summary: The Housing Authority Subcommittee held worksessions on waitlist management and leasing rules (Sections 105 and 106.1) after the waitlist was suspended, and on bedroom size standards. The full Housing Authority took up the waitlist policies on September 22. It also adopted a policy on primary residency for children of multiple custodial parents, set a 20% custodial cutoff and an age limit through 18, and considered amending deed restrictions for town-built units at 215 East Colorado Avenue. The subcommittee also handled owner exception requests.
