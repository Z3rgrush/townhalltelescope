- title: 2027 town budget, fees and rates
  summary: Council held a budget workshop on Oct. 13 covering enterprise funds, open space, affordable housing and 12 smaller funds requesting $12.11M in revenue and $16.11M in spending. The Open Space set-aside of $4.79M would be drawn down by $4.25M, the Transportation Fund needs a $290,000 larger transfer, and lodgers' tax is budgeted to rebound. A water and sewer rate study and draft 2027 fee schedule were also presented, and adoption is set for Nov. 17. An ordinance to suspend part of the real estate transfer tax for the 2027 budget year had first reading Oct. 27.
