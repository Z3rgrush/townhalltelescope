- title: Carhenge Redevelopment Project design review
  summary: The Historic & Architectural Review Commission has three preliminary large-scale applications for the Carhenge redevelopment (Buildings A-C, D1-D2, E1-E3) on Lots 34 and 34B, Backman Village. They were continued from July and August 2026 without discussion and were on the September 30 agenda.
