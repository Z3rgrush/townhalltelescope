- title: Carhenge and Shandoka redevelopment projects
  summary: The Carhenge Redevelopment Project (Lots 34 and 34B, Backman Village) has three large-scale applications for Buildings A-E before HARC, continued from July and August and back on Sept. 30. The Shandoka Lot Redevelopment (Lot L, Backman Village) has a preliminary PUD before P&Z and a large-scale application before HARC, both continued without discussion, with HARC pushed to Nov. 18. On Oct. 27 Council also considered a resolution on a preliminary subdivision consolidating Lots 34 and 34B.
