- title: Garfield County School of Innovation charter school proposal
  summary: Garfield County School of Innovation presented to Council its plan to open a charter school in New Castle in 2027, following a formal application to the Garfield County Re-2 School Board. The plan would start right after the renovation of Rosie's, and the application is awaiting review and a decision.
