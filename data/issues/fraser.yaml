- title: Mandatory watering restrictions and water supply projects
  summary: The Board voted 7-0 to amend the town's mandatory watering restrictions. It also issued a Water Supply Protection District permit for the public works fuel station at 150 Grand County Road 72, and in October considered a Windy Gap Environmental Fund application and a groundwater study with the Upper Colorado Watershed Environment Team.
