- title: St. Louis Landing workforce housing and new market tax credit financing
  summary: The Board and Fraser Housing Authority approved resolutions authorizing the Town Manager and Housing Authority director to take new market tax credit (NMTC) actions for the St. Louis Landing project. The NMTC financing is to go toward the playground and buildout of the early childhood space. In October the Housing Authority took up housing regulations, community rules, and initial rents and fees for the development.
  where: St. Louis Landing
