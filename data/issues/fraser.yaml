- title: 'Public art: Mural Fest expansion and Fire & Ice 2027'
  summary: The Public Arts Committee reviewed Mural Fest, where all 30 murals sold. It discussed moving toward building wall murals, which would need roughly $50,000 more on top of the ~$91,000 Art in Public Places budget. It is also planning Fire & Ice 2027, including shuttles, EMS and fire staging, fire artists, and a possible sledding hill at Lions Ponds.
