- title: St. Louis Landing workforce housing and NMTC financing
  summary: The Board and Fraser Housing Authority approved resolutions authorizing New Markets Tax Credit (NMTC) actions for the St. Louis Landing project, with financing going toward the playground and buildout of the early childhood space. In October the Housing Authority took up the project's housing regulations, community documents, and initial rents and fees for the workforce housing development.
