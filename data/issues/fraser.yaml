- title: Chapter 18 & 19 code amendments (Ordinance 340)
  summary: The Planning Commission has been workshopping rewrites of Fraser's zoning and subdivision codes, aiming to have them in effect by Jan. 1, 2027 to meet the Proposition 123 fast-track requirement for affordable housing. Changes include plat-before-site-plan sequencing, proof of water and sewer service before building permits, fee waiver criteria, and drought and fire-resilient landscaping standards. Ordinance 340 went to the Planning Commission on Oct. 28 for a recommendation. Annexation policy will be handled separately.
  where: Townwide
