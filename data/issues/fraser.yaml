- title: St. Louis Landing workforce housing and New Markets Tax Credit financing
  summary: Trustees and the Fraser Housing Authority approved resolutions authorizing New Markets Tax Credit actions, with financing going toward a playground and early childhood buildout. The Housing Authority then took up housing regulations, community rules, and initial rents and fees for the St. Louis Landing workforce housing development.
