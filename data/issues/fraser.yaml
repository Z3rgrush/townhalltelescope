- title: Grand Park Overlook Filing 2 final plat and planned development plan
  summary: The Planning Commission held a hearing on a 135.1-acre plan with 104 single-family attached units, 70 multi-family units, 500 lodging units and commercial space, with building heights up to 65 feet. It voted 7-0 to recommend approval of the final plat and plan. Commissioners raised concerns about golf course irrigation on town wells, the lack of public parks and trails, the Leland Creek Trail connection, and 5 acres of public land owed under the annexation agreement. A final condition is the West Mountain Water Master Plan, and no public comment was received.
  where: Grand Park Overlook
  refs:
  - 1
- title: Chapter 18 and 19 land use code amendments
  summary: Planning Commission is workshopping rewrites of Fraser's zoning and subdivision chapters, aiming to have them in effect by January 1, 2027 to meet the Proposition 123 fast-track requirement for affordable housing. Topics include plat and site plan sequencing, permit extensions, special use permits, water and sewer proof of service, fee waivers, and drought and fire-resilient landscaping. A town hall and October hearing are planned, with Board adoption in November or December. Annexation policy will be handled separately.
  where: Townwide
