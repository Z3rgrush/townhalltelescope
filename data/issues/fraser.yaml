- title: 2027 Town budget and priorities
  summary: The Trustees held budget workshops on the 2027 draft budget, presented October 7 by Finance Director Lorraine Waters. Staff expect the Town to be over budget in 2027, with sales tax revenue running about 6-7% below last year and big projects like Clayton Court and a planned public works building. A KFFR radio funding request was also on the agenda.
