- title: Mandatory watering restrictions and water protection permits
  summary: The Board unanimously approved Resolution 2026-09-05 amending the town's mandatory watering restrictions. It also approved a Water Supply Protection District permit for the Public Works fuel station at 150 Grand County Road 72, and in October considered a Windy Gap Environmental Fund application and a Upper Colorado Watershed Environment Team groundwater study.
