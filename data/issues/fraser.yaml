  summary: Trustees amended mandatory watering restrictions, issued a Water Supply Protection District permit for the public works fuel station at 150 County Road 72, and considered Windy Gap Environmental Fund and Upper Colorado Watershed Environment Team groundwater study resolutions. The joint wastewater committee is negotiating with the state over an appeal of the Upper Fraser Valley Wastewater Treatment Facility discharge permit.
