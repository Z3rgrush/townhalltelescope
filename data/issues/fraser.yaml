- title: Mural Fest, public art budget and Fire & Ice 2027
  summary: The Public Arts Committee reported all 30 murals sold and discussed shifting toward building wall murals, which would need a larger budget. The roughly $91,000 art budget is unapproved and the committee agreed to hold off on 2027 sculpture purchases. Planning for the Fire & Ice festival covered logistics, fire safety, vendors and fireworks.
