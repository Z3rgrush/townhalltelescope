- title: Mural Fest and Fire & Ice, and a possible shift to wall murals
  summary: The Public Arts Committee recapped the 2026 Mural Fest, in which all 30 murals sold, and planned Fire & Ice 2027. It discussed moving toward painting building walls in 2027, which would need a bigger budget than the roughly $91,000 Art in Public Places budget, perhaps $50,000 more. Fire & Ice planning covers fire artists, shuttles, emergency vehicle placement and a possible crosswalk.
