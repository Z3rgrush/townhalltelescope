- title: Chapter 18 & 19 land development code rewrite (Ordinance 340/540)
  summary: Planning Commission workshopped sweeping amendments to Fraser's land development and building codes, aiming for adoption by January 1, 2027 to meet the Proposition 123 fast-track requirement for affordable housing. Changes include plat-before-site-plan sequencing, water/sewer proof of service before building permits, fee waiver criteria, and drought/fire-resilient landscaping. The commission recommended adoption of the ordinance and it went to the Trustees in November; annexation policy was split off for separate discussion.
