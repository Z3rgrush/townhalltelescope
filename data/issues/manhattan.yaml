- title: Half-cent street maintenance sales tax on the November ballot
  summary: Manhattan put a half-cent, streets-only sales tax before voters, to be spent pay-as-you-go on street work without bonding. Talk of renewing the quarter-cent quality of life sales tax, which expires at the end of 2027, was pushed until after the election.
  refs: [5, 6, 17, 23, 25]
- title: Edge District 3.0 TIF, STAR bonds and campus sales tax
  summary: The commission discussed TIF, a community improvement district and STAR bonds for K-State's Edge District 3.0, the planning board reviewed whether the plans fit the comprehensive plan, and hearings were set on an extra 1% sales tax on campus retail.
  where: Kansas State University campus
  refs: [21, 24, 25]
- title: Housing incentive policies and bonds
  summary: Commissioners discussed housing policies and then rewrote the rules for workforce housing sales tax, multifamily housing revenue bonds and reinvestment housing incentive districts, and issued housing bonds for a multifamily project at 1000 Moro Street.
  refs: [6, 14, 18]
- title: Rebuilding Taxiway Alpha at the airport
  summary: The commission accepted about $14.9 million in grants and awarded a $12.9 million contract to Clarkson Construction to reconstruct Taxiway Alpha at Manhattan Regional Airport.
  where: Manhattan Regional Airport
  refs: [4, 14]
- title: Yuma Street Cultural Center and the Mt. Zion rezoning
  summary: The city backed bonds and a sales tax exemption for Black Entrepreneurs of the Flint Hills' Yuma Street Cultural Center, which also won a $100,000 state heritage grant, while a rezoning of 813–821 Yuma Street for the Mt. Zion Resource Center was pushed to November.
  where: Yuma St
  refs: [18, 25, 31]
- title: Sunset Zoo lemur and Americas exhibits
  summary: Manhattan hired a construction manager and designers for new lemur and Americas exhibits at Sunset Zoo, paid for by the zoo's trust, and backed a state tourism grant application for the project.
  where: Sunset Zoo
  refs: [3, 17, 18]
- title: Historic designation for Sunset Cemetery
  summary: Parks staff and the City Commission reviewed whether to seek historic designation for Sunset Cemetery.
  where: Sunset Cemetery
  refs: [17, 21]
- title: Development code changes after Senate Bill 418
  summary: The planning board worked through changes to the Manhattan Development Code required by the state's Senate Bill 418, including a streamlined planned unit development process.
  refs: [2, 8, 13]
- title: Seven Dolors Parish project at 624 Pierre Street
  summary: The zoning appeals board heard an exception request for Seven Dolors Parish at 624 Pierre Street, and the Historic Resources Board reviewed the project against federal rehabilitation standards.
  where: 624 Pierre St
  refs: [7, 11]
- title: Driveway and land use rules in rural Riley County
  summary: The planning board held hearings on Riley County amendments to driveway standards and use-specific standards in the unincorporated area.
  refs: [2, 24]
- title: Funding for social service and alcohol programs
  summary: The Community Support Funds Advisory Board reviewed social service and special alcohol fund requests from groups like Pawnee Mental Health, the Boys and Girls Club and the emergency shelter, heard about rising youth substance use and asked the city for more money to keep up with inflation.
  refs: [10, 15, 19]
- title: New playgrounds and courts in city parks
  summary: The city bought new playgrounds for Douglass, Goodnow and Long's parks, opened the CiCo Park tennis courts and planned a discussion of outdoor pickleball courts in City Park.
  refs: [3, 14, 17]
- title: Pedestrian improvements at 5th and Leavenworth
  summary: Manhattan awarded a $1.5 million contract to Ebert Construction for pedestrian and utility improvements at 5th and Leavenworth Streets.
  where: 5th St & Leavenworth St
  refs: [18]
- title: Gas and electric franchise agreements
  summary: Pulled from consent for discussion, new franchise agreements with Kansas Gas Service and Evergy were approved.
  refs: [9]
- title: Annexing land on Excel Road in Pottawatomie County
  summary: The commission considered asking Pottawatomie County to approve annexing a 4.4-acre tract at 3830 Excel Road and a second tract.
  where: 3830 Excel Rd
  refs: [34]
- title: Road salt storage and lane closure rules
  summary: Commissioners discussed a bulk road salt agreement and storage, a right-of-way lane closure policy and an on-call engineering program.
  refs: [30]
