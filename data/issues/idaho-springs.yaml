- title: 'Parking: private paid parking moratorium, library parking and parking study'
  summary: 'Council considered Ordinance #18, a temporary moratorium on permits for private paid parking facilities. A resident asked for free library parking to be restored, and a parking study with results was reviewed by the Planning Commission and Council. Residents also raised parking concerns about new development.'
