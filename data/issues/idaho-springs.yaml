- title: Proposed 2027 city budget
  summary: Staff called the 2027 budget extremely difficult to prepare, with General Fund revenue only about $100,000 above 2024. Measures include moving community promotion costs to the Parking Fund and pausing some employee benefits. City property tax is projected to fall from $282,237 to $267,546 at the same 6.310 mill levy. The Business & Community Promotions Board recommended a $211,109 baseline for its own budget, and council also considered a fee schedule update.
