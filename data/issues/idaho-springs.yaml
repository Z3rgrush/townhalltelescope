- title: Recreational occupation tax on outdoor recreation providers
  summary: Council referred a ballot issue to create a new occupation tax on outdoor recreation providers such as rafting companies, with up to $5 per customer. Revenue would go to impacts on streets, parking, public safety, water and parks. Rafting businesses made requests to council about the tax.
