- title: Recreational occupation tax on outdoor recreation providers
  summary: 'Council considered Ordinance #19 referring a ballot measure to voters for a new occupation tax on outdoor recreation outfitters, with revenue dedicated to impacts such as streets, parking, public safety and water. The tax could be up to $5 per customer and would be paid by the provider. Rafting businesses brought requests about the tax to Council in October.'
