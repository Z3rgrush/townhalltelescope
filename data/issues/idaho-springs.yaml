- title: 'Parking: private paid parking moratorium, parking study and managed parking'
  summary: 'Council considered Ordinance #18, a temporary moratorium on permits and licenses for private paid parking facilities. The city is also reviewing parking study results and parking requirements, and a Libertarian Party representative asked that Disabled Veteran plates get free parking in the managed parking program. Council also took up library parking and renamed and rescoped the parking, transportation and mobility enterprise.'
