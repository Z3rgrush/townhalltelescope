- title: Affordable and senior housing efforts
  summary: 'Council applied to the state Division of Housing for predevelopment funding for the Idaho Springs Affordable Senior Housing Project. It also discussed housing incentives, the Proposition 123 commitment for 2027-2029, and the Clear Creek Regional Housing Authority. A group homes and Fair Housing Act code amendment (Ordinance #17) also advanced.'
