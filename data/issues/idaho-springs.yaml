- title: Golddigger Park and Fieldhouse development park conveyance
  summary: 'Council considered accepting a new park conveyed by the Fieldhouse development, and Resolution #29 accepts Lot 3 of the former Golddigger Field subdivision as a city park named Golddigger Park. A related minor subdivision of Lots 1-12 to create a fourth lot was heard by the Planning Commission and Council. A neighbor also raised concerns about apartments at the Field House.'
