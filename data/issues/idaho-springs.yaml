- title: Recreational occupation tax on outdoor recreation providers
  summary: 'Council referred a ballot issue to create a new occupation tax on outdoor recreation providers such as rafting companies, per Ordinance #19. The measure would allow a per-customer fee of up to $5, with revenue dedicated to the impacts of those activities on streets, parking, public safety, water and parks. Rafting businesses have made requests about the tax.'
