- title: 2027 city budget
  summary: The proposed 2027 budget was described as extremely difficult, with the General Fund tight, community promotion costs shifted to the Parking Fund and some employee benefits paused. City property tax revenue is expected to fall from $282,237 to $267,546 at the same 6.310 mill levy. The promotions board proposed a $211,109 baseline budget.
