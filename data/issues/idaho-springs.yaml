- title: Comprehensive Plan and design and development standards
  summary: 'The Planning Commission and Council worked on the 2026 Comprehensive Plan, with a resolution recommending its adoption on the October 7 agenda. Residents urged stronger design, buffer and parking standards for new development, and a nonconforming buildings amendment (Ordinance #22) was introduced.'
