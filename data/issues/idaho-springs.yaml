- title: 'Roberts Brothers Garage arts center: fee waivers, parking and historic designation at 121 15th Avenue'
  summary: The Clear Creek Center for Arts & Education won a $1.538 million state grant that requires a 1:1 match and asked the city for up to $729,307 in in-kind contributions and fee waivers. Council took up Resolution 27 on fee waivers and contributions with Four Bairs, Inc., Ordinance 20 on designating the property, and a parking fee-in-lieu request. A parking arrangement with the adjacent city-owned property was also discussed.
