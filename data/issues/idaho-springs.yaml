- title: Affordable and senior housing efforts
  summary: 'Council applied to the state Division of Housing for predevelopment funding for the Idaho Springs Affordable Senior Housing Project. It also discussed affordable housing incentives, its Proposition 123 commitment for 2027-2029, and updated Chapter 21 for housing for people with disabilities under the Fair Housing Act (Ordinance #17). The Miner Street Apartments multifamily plan was also in the packet.'
