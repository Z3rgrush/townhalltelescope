- title: Roberts Brothers Garage redevelopment and arts center fee waivers
  summary: 'The Clear Creek Center for Arts & Education won a $1.538 million state grant that needs a 1:1 match and has about $700,000 in hand. It asked the city for in-kind help, fee waivers and other contributions worth up to $729,307 to redevelop the Roberts Brothers Garage at 121 15th Avenue. Council took up Resolution #27 on the fee waivers, Ordinance #20 on designating the property, a parking fee-in-lieu request, and parking arrangements with Four Bairs Inc.'
