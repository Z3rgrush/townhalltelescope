- title: 'Downtown parking: paid-lot moratorium, parking study and library parking'
  summary: Council considered Ordinance 18, a temporary moratorium on permits and licenses for private paid parking facilities. Planning reviewed preliminary parking study results and council received final results, while library parking was also on the agenda. Council amended the name and scope of the parking, transportation and mobility enterprise.
