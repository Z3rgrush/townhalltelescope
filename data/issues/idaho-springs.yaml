- title: 2027 city budget
  summary: The proposed 2027 budget was described as extremely difficult to prepare. It moves community promotion costs to the Parking Fund and pauses some employee benefits, and General Fund revenue is projected to be only about $100,000 above 2024. The city's property tax share falls from $282,237 to $267,546 at the same 6.310 mill rate. The promotions board recommended a $211,109 baseline budget.
