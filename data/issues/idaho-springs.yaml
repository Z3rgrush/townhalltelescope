- title: Lots 1-12, Block 75 minor subdivision and new Golddigger Park
  summary: 'The Planning Commission held a hearing on SUBD26-002, a minor subdivision of Lots 1-12, Block 75 and vacated Sixth Avenue that creates a fourth lot. Council took up the plat approval in September. Council also took up Resolution #29 accepting Lot 3 of the former Golddigger Field subdivision as Golddigger Park, along with a park conveyance by Fieldhouse Development.'
