- title: 'Downtown parking: paid parking moratorium, parking study and library parking'
  summary: 'Council considered Ordinance #18, a temporary moratorium on permits for private paid parking facilities. Planning staff presented preliminary parking study results, and Council had a parking requirements study on its Sept. 28 agenda. Residents asked for free parking to be returned at the Library and for Disabled Veteran plates to get free managed parking. In October the parking enterprise''s name and scope were being amended.'
