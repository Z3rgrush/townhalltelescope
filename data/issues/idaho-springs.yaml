- title: Carlson Elementary / 1300 Colorado Blvd 50-unit affordable housing denial
  summary: 'The Planning Commission held a hearing on a Final Development Plan for a 50-unit affordable apartment project at the old Carlson Elementary site. Residents wrote in against it, citing parking and historic building code concerns. Council then considered Resolution #15 denying the plan at 1300 Colorado Boulevard.'
