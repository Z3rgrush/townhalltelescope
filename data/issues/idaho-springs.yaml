- title: 'Roberts Brothers Garage: Clear Creek Center for Arts & Education fee waivers and contributions'
  summary: 'The arts center has a $1.538 million state grant that needs a 1:1 match and has about $700,000 in hand. It asked the city for in-kind contributions and fee waivers worth up to $729,307. Council took up Resolution #27 granting fee waivers for the 121 15th Avenue redevelopment. Parking arrangements and a parking fee-in-lieu request also came up, and Ordinance #20 would designate the property as historic.'
