- title: 2027 city budget
  summary: The proposed 2027 budget was described as extremely difficult to prepare, with the General Fund tightly constrained. Measures included moving community promotion costs to the Parking Fund and pausing some employee benefits. The city's share of property tax is projected to fall from $282,237 to $267,546 at the same 6.310 mill levy. The Business & Community Promotions Board recommended a $211,109 baseline budget, and council also took up a fee schedule update.
