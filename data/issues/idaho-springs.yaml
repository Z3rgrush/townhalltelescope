- title: Fieldhouse development park and Golddigger Park
  summary: Council considered a new park conveyed by the Fieldhouse development and accepted Lot 3 of the former Golddigger Field subdivision as a city park named Golddigger Park. A minor subdivision of lots in Block 57 was also reviewed.
