- title: Development standards, water use and public concerns at Planning Commission
  summary: Residents asked for clearer zoning rules for new developments, including buffer zones, lot lines and parking, with fines for violations. Another resident asked the city to follow residential water restrictions and use native landscaping, citing the waterfall and sprinklers on city property.
