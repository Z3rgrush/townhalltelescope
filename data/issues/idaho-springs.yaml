- title: 'Affordable and senior housing: incentives, Prop 123 and DOLA application'
  summary: Council authorized a DOLA Division of Housing predevelopment funding application for the Idaho Springs Affordable Senior Housing Project. It also discussed affordable housing incentives and the Proposition 123 commitment for 2027-2029. The Miner Street Apartments multifamily plan and a Fair Housing Act code amendment (Ordinance 17) also came up.
