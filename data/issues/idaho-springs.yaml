- title: 'Roberts Brothers Garage: arts center fee waivers and contributions'
  summary: 'The Clear Creek Center for Arts & Education won a $1.538 million state grant needing a 1:1 match and has about $700,000 on hand. It asked the city for up to $729,307 in in-kind contributions and fee waivers. Council took up Resolution #27 on fee waivers for redevelopment of 121 15th Avenue, along with a historic designation ordinance and a parking fee-in-lieu request.'
