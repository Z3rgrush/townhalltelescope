- title: Affordable and senior housing incentives, Prop 123 and Fair Housing code changes
  summary: 'Council worked on affordable housing incentives, an Affordable Senior Housing Project, and a DOLA predevelopment funding application. It also covered its Proposition 123 commitment for 2027-2029. Ordinance #17 amends the city code on housing for people with disabilities to conform with state and federal Fair Housing law, and a group homes code amendment was also discussed.'
