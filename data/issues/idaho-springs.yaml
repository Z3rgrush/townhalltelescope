- title: Recreational occupation tax ballot measure
  summary: 'Ordinance #19 refers to voters a new occupational tax on outdoor recreation providers, with revenue dedicated to the impacts of those activities. The business promotions board was told it could charge up to $5 per customer, paid by the provider, to fund streets, parking, public safety, water and parks.'
