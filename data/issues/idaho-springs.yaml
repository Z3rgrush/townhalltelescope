- title: Noise ordinance with decibel limits
  summary: Staff proposed adding objective decibel standards, such as 55 dB daytime and 50 dB nighttime in parks and recreation areas, so police can enforce noise rules with a professional dB reader. The current code has no maximum decibel level.
