- title: New development rules and public concerns on buffers and parking
  summary: Residents asked the Planning Commission for clear zoning restrictions, buffer zones, lot-line and parking rules for new developments. The commission heard a minor subdivision of Lots 1-12, Block 57 near vacated Sixth Avenue, which council also approved by plat resolution. Code amendments on nonconforming buildings (Ordinance 22) and exterior lighting were also in progress.
