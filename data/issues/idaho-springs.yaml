- title: Carlson Elementary / 1300 Colorado Blvd 50-unit affordable housing plan denied
  summary: 'The Planning Commission held a public hearing on a Final Development Plan (FDP26-001) for a 50-unit affordable multifamily development at the old Carlson Elementary site. Residents wrote in and spoke about parking, building size and historic design standards. Council''s Aug. 10 agenda included Resolution #15 formally denying the plan.'
