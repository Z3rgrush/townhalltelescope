- title: EPA smelter cleanup in Eilers and Bessemer
  summary: An EPA project manager briefed council on Superfund cleanup of former smelter contamination in the Eilers and Bessemer neighborhoods. The public comment period closed October 15 and EPA is preparing a responsiveness summary, with Benedict Park revitalization also discussed.
