- title: St. Charles Industrial Park and Lime Road improvements
  summary: Council reviewed Lime Road, the only route into the industrial park, a 1.4-mile unreinforced concrete road. Estimated costs are about $20M for reinforced concrete versus $5M for asphalt, and a traffic study is required. $8M was previously transferred for park infrastructure. Closed sessions covered projects in the park, including Project Manta.
