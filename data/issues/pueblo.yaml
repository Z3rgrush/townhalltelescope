- title: Lime Road and St. Charles Industrial Park development
  summary: 'Staff presented options for Lime Road, the only route into St. Charles Industrial Park: about $20M for reinforced concrete or $5M for asphalt, with a traffic study needed. Council earlier moved $8M to infrastructure for the park and discussed a potential economic development project there.'
