  summary: Council reviewed a funding request from the Leonardo da Vinci Museum of North America from the 1/2-cent sales tax fund, which has already approved $14.4 million for the project that replaced the Professional Bull Riders university. Council also followed up on an economic development partner RFP and held closed-door talks on projects including Tortuga, Falcon, Manta and St. Charles Industrial Park.
