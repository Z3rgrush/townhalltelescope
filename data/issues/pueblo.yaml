- title: 2027 city budget, property tax levies and sales tax
  summary: Departments presented 2027 budgets (police, fire, public works, IT, law, finance, parks). The recommended total is $117,785,907, with a 3.7% city sales tax rate. A public hearing was set for Oct. 26, and the mill levies and budget appropriation ordinances came up Nov. 9.
