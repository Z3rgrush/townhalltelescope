- title: 2027 city budget, property tax mill levy and public hearing
  summary: Council heard 2027 budget presentations from IT, Law, Finance and Parks in August and reviewed a recommended 2027 budget of $117,785,907, with sales tax (3.7% rate) making up 66.8% of general taxes. Nine residents spoke at the October 26 public hearing, and on November 9 council took first presentation of ordinances setting the 2027 mill levy and appropriations.
