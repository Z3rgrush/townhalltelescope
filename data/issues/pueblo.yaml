- title: Airport projects and Aviation Asset Defense funding
  summary: Council created a project for Aviation Asset Defense with a $300,000 transfer from the airport grant match project, formed an Airport Policy Advisory board, and approved taxiway/hangar contingencies. The Aviation Asset Defense resolution was then brought back for a motion to reconsider on Oct. 5, and an airline operating agreement was introduced.
