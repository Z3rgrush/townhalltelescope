- title: Lime Road and St. Charles Industrial Park infrastructure
  summary: Staff reviewed the 1.4-mile, two-lane concrete Lime Road, the only route into St. Charles Industrial Park, which needs frequent repairs. Reinforced concrete is estimated at about $20M versus about $5M for asphalt, against $8M already moved to design Lime Road and wastewater improvements. A resident also spoke about capital improvements on Limon Road.
