  summary: Council reviewed Black Hills Colorado Electric's 2026 rate case and took up a resolution opposing the proposed electric rate increase and the cost impacts of its Electric Resource Plan and Clean Energy Plan (Proceeding 26A-0333E). Certified copies would go to the Colorado PUC.
