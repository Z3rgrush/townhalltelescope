- title: Opposition to Black Hills Energy electric rate increase
  summary: Council passed a resolution opposing a proposed Black Hills Colorado Electric rate increase and added ratepayer costs of its 2026 electric resource plan, to be sent to the Colorado Public Utilities Commission (Proceeding No. 26A-0333E). Council also discussed the 2026 rate case in executive session.
