- title: RTA steering committee and housing authority update
  summary: Council reviewed a draft for forming a Regional Transportation Authority steering committee with voting seats for governments, business and community members, plus technical advisors. It also heard the Housing Authority's 2025 annual report, with 715 public housing units and 1,169 vouchers in use.
