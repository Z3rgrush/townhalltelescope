- title: Speed safety camera (automated enforcement) program
  summary: Police Traffic Division presented a plan for speed cameras on residential streets, park frontages and designated traffic safety corridors. Estimates run $302,400 to $504,000 in monthly citations, depending on the pay rate. On Oct. 13 Council took up an ordinance amending the 2026 police staffing ordinance for automated enforcement.
