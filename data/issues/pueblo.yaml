- title: 'Annexations and zoning: Pueblo Masterplan Communities and Jackson Ranch'
  summary: Council found the petition to annex the 89.93-acre Pueblo Masterplan Communities valid and sent it to Planning and Zoning. Ordinances to zone parts of the Jackson Ranch annexation area (250.1, 65.70 and 225.66 acres) came up for first presentation Sept. 14.
