- title: Speed safety camera (automated enforcement) program
  summary: Police Traffic Division presented a plan for photo-radar speed cameras on residential streets, park frontages and designated safety corridors, with projected monthly citation revenue of roughly $302,400 to $504,000 depending on pay rate. A later agenda adds a full-time Automated Enforcement position to Police staffing.
