- title: Automated speed camera enforcement program
  summary: Police Traffic Division presented a plan for speed safety cameras on residential streets, park frontages and designated traffic safety corridors, estimating $302,400 to $504,000 in monthly citations depending on pay rate. On Oct. 13 Council took up a first-reading ordinance on automated enforcement and a staffing ordinance amendment for the Police Department.
