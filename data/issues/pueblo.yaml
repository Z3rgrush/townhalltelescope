- title: 2027 city budget
  summary: Departments presented 2027 budgets to Council in August and October work sessions (Police, Fire, Public Works, IT, Law, Finance, Parks). The Mayor's recommended budget totals $117,785,907, with sales tax (3.7% rate) making up 66.8% of general taxes. A public hearing on the proposed 2027 budget was set for Oct. 26.
