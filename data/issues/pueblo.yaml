  summary: Council found valid the petition to annex the 89.93-acre Pueblo Masterplan Communities Annexation No. 1 and sent it to Planning and Zoning for review. On Sept. 14 it began zoning of Jackson Ranch annexation parcels of 250.1, 65.7 and 225.66 acres, including agricultural zoning.
