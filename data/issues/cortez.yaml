- title: 'Historic designations: Garland Home and 209 West Main'
  summary: Council moved Ordinance 1376 to designate the Garland Home at 120 East North Street for the City Register of Historic Resources (first reading Sept. 8, second reading Sept. 22). Ordinance 1377 does the same for the building at 209 West Main (second reading Oct. 13). A state grant amendment adds $50,000 and the CLG grant was accepted. The Planning Commission also reviewed Land Use Code revisions for historic designation.
