- title: 'Historic designations: Garland Home and 209 West Main'
  summary: Council moved Ordinance 1376 to designate the Garland Home at 120 East North Street, and Ordinance 1377 to designate the building at 209 West Main Street, to the City Register of Historic Resources. It also accepted $50,000 in supplemental state funding on a historic grant agreement, and the Planning Commission reviewed Land Use Code revisions for historic designation.
