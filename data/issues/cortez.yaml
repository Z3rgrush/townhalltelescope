- title: Comprehensive Plan update, water supply and stormwater planning
  summary: Council adopted the 2026 Water System Master Plan (Resolution 16) in September. It considered awarding the Comprehensive Plan Update covering strategic growth and water supply to SE Group in October. It also discussed a Storm Water Master Plan and awarded Phase 2 of the Montezuma-Sligo drainage project to D&L Construction.
