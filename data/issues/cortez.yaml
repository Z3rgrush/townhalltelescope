- title: Lodger's Tax 4% increase on the November ballot
  summary: Council took up Ordinance No. 1375 to set ballot language asking voters to approve a four percent increase in the city's Lodger's Tax at the November 3, 2026 general election. It was on the July 28 agenda and had a public hearing on August 11. Resolution No. 13 also set up the county-run 2026 election.
