- title: 'Historic designations: Garland Home and 209 West Main'
  summary: Council moved to place the Garland Home at 120 East North Street on the City Register of Historic Resources, with second reading on September 22. It also took up the building at 209 West Main Street, with first reading September 22 and second reading October 13. Council also accepted a 2026 Certified Local Government grant and a $50,000 supplemental state grant amendment for historic preservation.
