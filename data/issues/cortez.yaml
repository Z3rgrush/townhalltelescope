- title: Water System Master Plan and Comprehensive Plan water supply update
  summary: Council saw a draft Water System Master Plan in July, toured the water treatment plant in August, and considered adopting Resolution No. 16 approving the 2026 Water System Master Plan on September 22. In October it considered awarding the Comprehensive Plan update on Strategic Growth and Water Supply to SE Group.
