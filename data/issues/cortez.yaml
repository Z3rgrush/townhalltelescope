- title: Park Village on 7th affordable rental development and 7th Street property
  summary: Council got an update on the 7th Street property on Aug. 25. On Oct. 13 it considered authorizing the Mayor to sign CHFA's notification form for Park Village on 7th, a proposed affordable rental development on city-owned land at the former high school property.
