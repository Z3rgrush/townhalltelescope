- title: Park Village on 7th affordable rental housing and 7th Street property
  summary: Council received an update on the city-owned 7th Street property in August. In October it considered authorizing Mayor Spruell to sign CHFA's notification form for Park Village on 7th, a proposed affordable rental development on the former high school property. A Housing Needs Assessment was presented in November.
