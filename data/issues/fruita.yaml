- title: 2027 city budget
  summary: The City Manager presented the recommended 2027 budget, with few surprises and smaller capital projects. The largest item is $2 million for building J Road from Wildcat Avenue to Skiff Road, with grants being sought. Other items include $100,000 for sidewalks, $320,000 for four police trucks and market-rate pay increases. Police budget discussion was tied to the public safety sales tax increase.
