- title: E-bike and e-scooter rules on trails and in parks
  summary: The Parks and Recreation Commission heard a police presentation on classifications and rules for e-bikes on trails and in parks. On-road vehicles need a license and registration, off-road ones are barred from roads and pedestrian areas, and police are educating families. E-scooters have little regulation.
