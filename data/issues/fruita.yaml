- title: Museums of Western Colorado revitalization plan
  summary: The Museums of Western Colorado presented a multi-phase, thirteen-year revitalization plan. Construction is estimated to begin in late 2028 or early 2029, and no capital campaign has been outlined yet. Council also approved a lease for the Old Fruita Museum.
