- title: 2027 City Manager's recommended budget and Fremont Street/18 1/2 Road spending
  summary: City Manager Shannon Vassen presented the 2027 budget on Sept. 29, with few big surprises and fewer, smaller capital projects. The largest is about $2 million to build J Road from Wildcat Avenue to Skiff Road, with grant funding being sought. On Oct. 20 resident Paul Schultz asked Council to halt the roughly $2.2 million Fremont Street to 18 1/2 Road expenditure, citing eminent domain use and cost overruns on 19 Road.
