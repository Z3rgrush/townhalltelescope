- title: Water Supply and Strategic Growth plan required by the state
  summary: Colorado requires cities with a comprehensive plan to adopt a Water Supply Element and a Strategic Growth Element by December 31, 2026. Planning Commission and City Council discussed a community engagement strategy and a draft water survey, and the mayor noted the mandate is unfunded. The City has authorized a grant application and hopes to hire a consultant, and a draft submitted by the deadline counts as 'Compliance in Progress'.
  where: Citywide
