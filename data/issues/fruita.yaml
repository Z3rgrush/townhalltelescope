- title: Metro District policy and model service plan
  summary: Council discussed Fruita's amenity-based metropolitan district policy and model service plan, which let developers form separate districts and seek tax-exempt bonds. Council directed edits so the policy and plan align, including limiting to commercial and industrial uses and requiring council approval of applications and development plans.
