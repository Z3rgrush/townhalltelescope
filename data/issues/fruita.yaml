- title: Park conditions, Farmers Market location and drought watering
  summary: The Parks and Recreation Commission discussed Civic Center Park grass wearing thin from heavy use and whether to move or alternate the Farmers Market with Reed Park, or close part of Aspen Street. Salt Wash soccer fields are turning to dirt as the city cuts water use during drought. Residents also asked for more lap lanes or longer hours at the Community Center.
  where: Civic Center Park, Reed Park, Salt Wash fields
