- title: Public sculpture selections for downtown pedestals
  summary: The Arts and Culture Board reviewed artist applications for sculptures on pedestals including South Mesa Street and near the Bark Park, weighing community identity, durability, safety and accuracy of representation. Members visited the sculptures Aug. 17 and are deciding how to announce selections.
  where: South Mesa Street, Dinosaur Journey parking lot, FARM
