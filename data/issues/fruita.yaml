- title: State-mandated Water Supply and Strategic Growth plan elements
  summary: By Dec. 31, 2026, the state requires Fruita to adopt Water Supply and Strategic Growth elements in its Comprehensive Plan. Planning Commission and Council discussed a community engagement strategy and a draft water survey. The city is seeking a grant to hire a consultant, and the mayor called the requirement an unfunded mandate.
