- title: CDOT US 6 West / SH 139 access control plan amendment
  summary: CDOT presented an amendment to the access control plan for Highway 6 from 18 Road to 22 Road ahead of a future widening project. Concepts include right-in/right-out intersections with U-turns and alternate access for properties. An updated intergovernmental agreement is expected in January 2027.
