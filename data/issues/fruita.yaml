- title: CDOT Highway 6 widening and access control plan amendment
  summary: CDOT presented an amendment to the US 6 West/SH 139 Access Control Plan for a future widening from 18 Road to 22 Road. It includes right-in/right-out intersections with dedicated U-turns and changes to property access. An updated intergovernmental agreement is expected in January 2027.
  where: Highway 6 from 18 Road to 22 Road
