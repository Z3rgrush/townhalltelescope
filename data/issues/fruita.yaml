- title: Park conditions, drought water use and Farmers Market location
  summary: The Parks and Recreation Commission discussed worn grass at Civic Center Park and possibly moving or alternating the Farmers Market with Reed Park. Salt Wash soccer fields are turning to dust as watering is reduced during drought. It also discussed e-scooter and off-road vehicle rules and community requests for more lap lanes at the community center.
