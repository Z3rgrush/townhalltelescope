- title: Park conditions, Farmers Market location and recreation feedback
  summary: The Parks and Recreation Commission discussed worn grass at Civic Center Park and possibly moving the Farmers Market to Reed Park or alternating sites. Salt Wash soccer fields are drying out because of drought water cuts, and residents asked for more lap lanes at the Community Center. The commission also discussed e-scooter and off-road vehicle rules and possible homeless camps near the LAUNCH project.
