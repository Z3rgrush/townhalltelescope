- title: CDOT US 6 West/SH 139 access control plan amendment
  summary: CDOT presented an amendment to the access control plan for Highway 6 from 18 Road to 22 Road ahead of a future widening project. It includes right-in/right-out intersections with dedicated U-turns and alternate access for properties along the highway. An updated intergovernmental agreement is expected in January 2027.
  where: US Highway 6 from 18 Road to 22 Road
