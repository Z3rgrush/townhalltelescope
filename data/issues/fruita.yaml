- title: 2027 City Manager's recommended budget
  summary: City Manager Shannon Vassen presented a 2027 budget with no big surprises and fewer, smaller capital projects. The largest is $2 million to build J Road from Wildcat Avenue to Skiff Road, with grant funding being sought. Other items include $100,000 for sidewalks, $320,000 for four police trucks, and pay increases for some positions such as wastewater plant operators.
