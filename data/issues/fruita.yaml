- title: 2027 city budget and the J Road / Fremont Street to 18½ Road spending
  summary: The City Manager's recommended 2027 budget has fewer, smaller capital projects, with about $2 million for building J Road from Wildcat Avenue to Skiff Road, and the city is seeking grants. Resident Paul Schultz asked Council on Oct. 20 to halt the roughly $2.2 million Fremont Street to 18½ Road expenditure, citing past eminent domain use and cost overruns on 19 Road.
