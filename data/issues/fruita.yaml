- title: Police department strategic plan and speeding concerns on 18 Road
  summary: Chief Krouse presented the 2026-2030 police strategic plan and organizational chart. Council discussed residents' perception of speeding on 18 Road, and the chief said there is no data supporting traffic calming there. Staffing needs are to be reviewed during 2027 budget talks.
  where: 18 Road
