- title: Park wear and water use during drought
  summary: Commissioners discussed worn grass at Civic Center Park, possibly moving or alternating the Farmers Market to Reed Park, and closing part of Aspen Street. Salt Wash soccer fields are turning to dirt because water use is being cut during drought, and the city will try to restore water to them.
  where: Civic Center Park, Reed Park, Salt Wash soccer fields
