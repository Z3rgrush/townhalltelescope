- title: Raptor Crossing PUD amendment
  summary: The Planning Commission considered a major amendment to the Raptor Crossing PUD Guide. Council introduced Ordinance 2026-17 on Aug. 18 to allow certain residential and other uses, with a public hearing set for Sept. 15.
