- title: State-mandated Water Supply and Strategic Growth elements of the comprehensive plan
  summary: Colorado requires cities with comprehensive plans to adopt Water Supply and Strategic Growth Elements by Dec. 31, 2026. Planning Commission and Council discussed a community engagement strategy and a draft water survey. Council noted it is an unfunded mandate and staff is seeking a grant to hire a consultant.
