- title: 1925 J Road annexation, rezone and new housing development
  summary: The Planning Commission was set to hear a request on Aug. 11 to annex about 36.14 acres at 1925 J Road and rezone it to Community Residential. At the Aug. 4 council meeting a resident raised concerns about irrigation water for a proposed development of at least 40 homes, noting the Encanto irrigation system lost water for over 24 hours in late June, and asked for a long-term irrigation plan and recorded workshops.
