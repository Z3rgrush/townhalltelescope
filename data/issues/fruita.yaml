- title: Water supply and strategic growth elements of the comprehensive plan
  summary: State law requires Fruita to adopt Water Supply and Strategic Growth elements in its comprehensive plan. Staff sought Council feedback on community engagement and a water survey. A draft is due Dec. 31, 2026 for the city to be considered 'compliance in progress'. The mayor noted it is an unfunded state mandate, and the city is seeking a grant for a consultant.
