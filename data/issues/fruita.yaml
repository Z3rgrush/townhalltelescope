- title: 1925 J Road annexation and rezone (36.14 acres)
  summary: The Planning Commission heard a request to annex about 36.14 acres at 1925 J Road and rezone it to Community Residential. A resident told Council that the development plan calls for at least 40 homes and raised concerns about irrigation water and the Encanto system, which lost water for over 24 hours in June. The resident asked for a long-term irrigation plan before approvals.
