- title: Filling a vacant City Commission seat
  summary: After Commissioner Ivey resigned, the commission discussed how to fill the seat, then took up the appointment of Gary Norris to the vacancy.
  refs: [0, 3, 4]
- title: 2027 budget above the revenue-neutral rate
  summary: Salina reviewed its 2027 capital plans in a study session, published notice of intent to exceed the revenue-neutral property tax rate, held the budget hearing in September and took up a 2027–2031 capital improvement program.
  refs: [1, 3, 4, 7]
- title: Water main replacements and water rates
  summary: The commission considered awarding 2026 water main replacements and held a study session on the pace of water line replacement and what it means for water rates.
  refs: [3, 6]
- title: Theatre Salina expansion and downtown development deals
  summary: The commission took up an amendment to the downtown master development agreement to help fund a Theatre Salina expansion, and later an amendment to the Salina Destination Development Phase 2 agreement.
  where: Downtown Salina
  refs: [3, 4]
- title: Hotel and new lots at 3135 S. 9th Street
  summary: The commission considered rezoning and a site plan for a hotel at 3135 S. 9th Street and a six-lot replat of the Auburndale District Addition on the 9-acre site north of Avenue A.
  where: 3135 S 9th St
  refs: [7]
- title: Allowing townhomes in multifamily zones
  summary: An ordinance would add single-family attached homes as a permitted use in the R-2.5 and R-3 multifamily districts, with new lot width and side-yard rules.
  refs: [7]
- title: Housing tax credits and moderate-income housing grant
  summary: Salina considered supporting a developer's application for Kansas Housing Investor Tax Credits and amending its moderate-income housing grant from federal pandemic funds with the state housing agency.
  refs: [0]
- title: Annexing land at North Street and Marymount Road
  summary: The commission considered annexing 27 acres at the northwest corner of East North Street and Marymount Road.
  where: E North St & Marymount Rd
  refs: [4]
- title: Cleanup work plan contracts
  summary: Salina considered agreements with environmental consultants and labs for a remedial design and remedial action work plan.
  refs: [2]
- title: Landfill land purchase and county solid waste plan
  summary: The city considered buying property next to the municipal landfill and reaffirming the Saline County Solid Waste Management Plan with updated goals.
  refs: [3, 4]
- title: Animal shelter management and public participation rules
  summary: The commission considered a proposal for animal shelter management services and reviewed its public participation policy for open meetings.
  refs: [5]
- title: Medical clinic rezoning at 605 S. Ohio Street
  summary: A rezoning and site plan with five Planning Commission conditions would allow an ophthalmology clinic at 605 S. Ohio Street.
  where: 605 S Ohio St
  refs: [7]
