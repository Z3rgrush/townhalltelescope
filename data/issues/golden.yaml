- title: City Manager separation and interim appointment
  summary: After an executive session on Charter, Code and the City Manager's contract, Council moved to negotiate a separation agreement and appointed Carly Lorenz as Interim City Manager on Aug. 11. Resolutions on an Acting City Manager agreement and a City Manager Separation Agreement were on the Aug. 25 agenda, and an outside investigation was mentioned. Residents submitted public comment.
