- title: The Junction urban renewal plan and TIF request
  summary: GURA is evaluating a new urban renewal area for The Junction, a 51-acre light industrial business park west of Highway 93. The developer seeks 100% tax increment financing to cover about $59 million in public improvements, including a Highway 93 roundabout and a pedestrian bridge to the North Table Mountain trailhead. Consultant reports found blight factors and low impact on taxing entities, and the Planning Commission also reviewed the boundary.
  where: West side of State Highway 93, North Table Mountain area
