- title: Community Marketing program and Visit Golden strategy
  summary: The Community Marketing Board is working on a 2026-2029 strategy centered on residents first. It includes off-peak visitors, a re-introduced DVA Advertising contract (Resolution 3345), and a 2027 budget with a $715,000 vendor fee line. The program is funded by the sales tax vendor fee credit that businesses would otherwise keep.
