  summary: The Clayworks development asked to amend its Official Development Plan to allow limited natural gas for pool and spa heating, fireplaces and communal grills. The sustainability board heard residents urge the project to keep its all-electric commitments. The request is under staff review and will go to Planning Commission and Council. The mobility board also tracked its parking and travel demand plan.
