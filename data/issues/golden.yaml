- title: 'Historic preservation cases: 2024 Ford St, 612 10th St, 403 18th St'
  summary: The Historic Preservation Board approved a new rear cottage and garage at 2024 Ford Street in the East Street Historic District. It also reviewed demolition requests, including 612 10th Street (the Schall Residence), where a developer weighed relocation or integrating the structure. On 403 18th Street the board must place a demolition stay of up to 190 days.
