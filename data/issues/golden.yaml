- title: Water conservation, drought response and wildfire planning
  summary: Staff gave a year-end report on 2026 drought response and water conservation, with a new weather-normalization model. Council's Oct 27 study session included a drought after-action review and a wildfire management update. Council also considered ordinances on water and wastewater regulations and wastewater pretreatment (Ordinances 2297 and 2298).
