- title: 2027-2028 city budget and revenue outlook
  summary: Staff presented the proposed 2027-28 biennial budget to Council and the Citizens' Budget Advisory Committee, with flat to modest sales tax growth and declines in property tax and building use tax. Revenue constraints are shaping requests from boards such as sustainability and economic development. The committee also recommended more marijuana tax money for rent assistance and food insecurity.
