- title: 'Clayworks development: natural gas amendment, mobility and parking'
  summary: Clayworks developers asked to amend their Official Development Plan to allow limited natural gas for pool and spa heating, fireplaces and communal grills. The Sustainability Board heard residents urge the project to keep its original all-electric commitments. The amendment must go through Planning Commission and City Council. The Mobility Board has also followed its transportation demand plan, traffic memo and parking.
