- title: Fire Department incident, independent investigation and City Manager separation
  summary: Council hired outside counsel to oversee an independent investigation of an incident at the Fire Department, with closed legal sessions and a contract amended on September 15. Council also approved a City Manager separation agreement and an acting city manager agreement in August. The REDI Task Force discussed community concerns about racial profiling and healing.
