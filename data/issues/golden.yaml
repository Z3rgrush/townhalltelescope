- title: 'Clayworks development: natural gas amenity request, parking and mobility'
  summary: Clayworks developers asked to amend their Official Development Plan to allow limited natural gas for pool and spa heating, fireplaces and communal grills, despite earlier all-electric commitments. A Sustainable Golden member urged the project to keep its original sustainability commitments. The amendment is under staff review and will go to Planning Commission and Council. The mobility board is also following the project's transportation demand management plan and parking.
