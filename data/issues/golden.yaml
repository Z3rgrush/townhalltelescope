- title: The Junction urban renewal plan and tax increment financing
  summary: GURA is considering a new urban renewal area for The Junction, a 51.28-acre light industrial business park west of Highway 93. Consultant reports found blight factors. The project has about $59 million in public improvements, and the developer asks for 100% of tax increment financing, saying the project is not feasible without it. Staff supports TIF and revenue-sharing agreements with conditions. The plan is heading to the Planning Commission and City Council.
  where: West side of State Highway 93, near North Table Mountain Park West Trailhead
