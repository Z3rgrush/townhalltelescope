- title: 2122 Jackson Street site plans and alley spur call-up
  summary: Council called up the Director's approval of form zone site plans at 2122 Jackson Street for Planning Commission review, focusing on the alley spur. Neighbors said the alley is narrow and raised concerns about trash, parking, lights and green space. Staff said the site has more parking than required.
