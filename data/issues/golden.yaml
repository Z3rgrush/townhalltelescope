- title: Racist incident in Fire Department and City Manager separation
  summary: After a racist incident in the Golden Fire Department, residents spoke at several meetings. Council formed a temporary subcommittee (Resolution 3344), and on Aug. 11 moved to negotiate a separation agreement with the City Manager and appointed Carly Lorentz as Interim City Manager. Separation and acting manager agreements (Resolutions 3349, 3350) and a third-party investigation contract with Hoffmann Parker Wilson & Carberry (Resolution 3357) followed, with an executive session on the investigation's scope set for Sept. 22.
  where: Citywide
