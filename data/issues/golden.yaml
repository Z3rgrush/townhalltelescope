- title: Flock license plate camera contract
  summary: Police Chief Michelle Wagner is to brief Council on how Flock technology is used by the police. Councilors Knecht and Kurzinski are proposing to reconsider the city's Flock contract, which would come to a vote if three or more councilors support it.
