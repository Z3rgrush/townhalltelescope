- title: 2027-2028 city budget and revenue outlook
  summary: The Citizens Budget Advisory Committee, Council and advisory boards are reviewing the proposed 2027-2028 biennial budget under a more conservative revenue outlook. CBAC recommended more marijuana tax money for rent assistance and food insecurity. Council heard a financial report and revenue trends presentation, and the Sustainability Board sought a larger rebate budget.
