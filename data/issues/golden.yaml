- title: 2027-2028 biennial budget and revenue outlook
  summary: The Citizens' Budget Advisory Committee reviewed the proposed 2027-28 operating and capital budget. Sales tax is projected to grow about 1% a year while property tax and use tax are expected to dip. Council planned final adoption on December 8, 2026. The advisory committee also recommended more marijuana tax money for rent assistance and food insecurity.
