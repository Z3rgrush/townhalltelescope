- title: The Junction urban renewal area and tax increment financing
  summary: GURA is weighing a new urban renewal plan for The Junction, a 51-acre light industrial business park west of Highway 93. The developer seeks 100% tax increment financing to cover about $59 million in public improvements, including a Highway 93 roundabout and a pedestrian bridge to North Table Mountain Park. Staff is negotiating revenue sharing with the county (an 88% proposal) and other taxing entities, and the subcommittee recommended explicitly excluding data centers from the plan.
  where: West side of State Highway 93 near North Table Mountain Park
