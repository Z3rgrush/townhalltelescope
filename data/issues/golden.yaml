- title: Nazarene affordable housing plan area and TIF agreement
  summary: GURA is reviewing a draft tax increment agreement for the Nazarene project at 17455 West 16th Avenue. Changes focus on making affordable housing commitments survive any sale and raising the income cap from 30% to 35% to match state grant definitions. Council also approved Proposition 123 and housing intergovernmental agreements, and heard a Rental Housing Inventory Report.
