- title: Fire Department incident and community response
  summary: Council, the REDI Task Force and the public have been dealing with an incident at the Golden Fire Department. Community members raised concerns about racial profiling, and Council noted an outside investigation and an active legal case. The REDI group discussed how to move forward and hold space for staff and residents.
