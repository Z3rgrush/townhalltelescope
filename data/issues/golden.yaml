- title: The Junction urban renewal plan and TIF request (Highway 93)
  summary: GURA is reviewing a new urban renewal area for The Junction, a 51.28-acre light industrial business park on the west side of Highway 93. A conditions survey found five blight factors. The developer (Evergreen) is asking for 100% of tax increment financing to cover about $59 million in public improvements, including a Highway 93 roundabout and a pedestrian bridge to the North Table Mountain trailhead. The board considered Resolution 172 recommending the plan, and the Planning Commission was to review the boundary.
  where: West side of State Highway 93, near North Table Mountain Park
