- title: Fire Department incident, City Manager separation and interim appointment
  summary: After an incident at the Fire Department, residents spoke at several meetings and Council began an outside investigation. Council created a temporary subcommittee (Resolution 3344), appointed Carly Lorenz as Interim City Manager on Aug 11, and approved a City Manager Separation Agreement and an Acting City Manager Agreement on Aug 25. On Sept 15 Council approved a contract (Resolution 3357) after striking some clauses, and the REDI Task Force discussed racial profiling concerns and how to move forward.
