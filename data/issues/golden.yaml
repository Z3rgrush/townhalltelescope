- title: 'Clayworks development: gas amendment, parking and mobility'
  summary: Clayworks developers asked to amend their Official Development Plan to allow limited natural gas for pool and spa heating, fireplaces and grills. Sustainability advisers and a Sustainable Golden member urged keeping the original all-electric commitments. The Mobility board has repeatedly discussed Clayworks parking, its travel demand plan and a traffic memo. The amendment must still go to Planning Commission and Council.
