- title: Racist incident in Fire Department and City Manager separation
  summary: After a racist incident in the Golden Fire Department, residents spoke at several meetings. Council formed a temporary subcommittee (Resolution 3344), began an outside investigation, and on Aug 11 appointed Carly Lorentz Interim City Manager and moved to negotiate a separation agreement. Resolutions 3349 and 3350 on an acting manager and separation agreement were on the Aug 25 agenda, and a third-party investigator contract (Res. 3357) followed in September.
  where: Citywide
