- title: The Junction urban renewal plan and tax increment financing
  summary: GURA is weighing a new urban renewal area for The Junction, a 51-acre light industrial business park at 5079 State Highway 93. The developer says it is not feasible without tax increment financing. About $59 million in public improvements are needed, including a Highway 93 roundabout and a pedestrian bridge to the North Table Mountain trailhead. Staff proposed revenue-sharing with the county and city, and a subcommittee recommended explicitly excluding data centers from the plan.
  where: 5079 State Highway 93
