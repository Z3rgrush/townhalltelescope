- title: 2027-2028 city budget and revenue outlook
  summary: Council and the Citizens' Budget Advisory Committee are reviewing the proposed 2027-2028 biennial budget under revenue constraints. Sales tax is projected to grow about 1% a year and property tax to fall about 3%. The CBAC recommended more marijuana tax money for rent assistance and food programs. Staff also presented the 2025 financial report and a revenue outlook.
