- title: 2122 Jackson Street development and alley spur
  summary: Council called up the site plans for 2122 Jackson Street so the Planning Commission could review the alley spur and the whole project. Neighbors raised concerns about the narrow alley, parking, trash, lighting and green space. In October a Jackson Street resident objected to the approval, citing snow removal and other concerns.
