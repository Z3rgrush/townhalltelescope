- title: 'Downtown DDA projects: streetscape, trees and emergency repairs'
  summary: The DDA is advancing an 11th Street sidewalk and streetscape project, legacy shade trees, and planting 14 street trees on Arapahoe Street for under $10,000. It is also considering a two-year holiday light contract extension with SavaTree and a grant for emergency repairs at 807 13th Street. Prosper affordable housing is under construction at 817 14th Street.
