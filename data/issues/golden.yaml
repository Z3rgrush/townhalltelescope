- title: 2027-2028 biennial budget and revenue outlook
  summary: The city is drafting its first two-year budget for 2027-28 under revenue constraints. Council reviewed the proposed 2027 budget in October, and a budget appropriation ordinance was set for hearing Nov. 10. The citizens' budget committee also reviewed the proposed budget and discussed shifting marijuana tax money toward rent assistance and food insecurity. Sales tax is up 2.87% year to date but use tax is down.
