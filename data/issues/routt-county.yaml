- title: Yampa Valley Gravel Pit special use permit (PL20260026)
  summary: The Planning Commission took up the Yampa Valley Gravel Pit special use permit to expand the permit boundary of an old pit on the north side of County Road 65. The commissioners considered it on Sept. 29 with written public comment on file, and on Oct. 13 the Chair was asked to sign the permit. In November the county also approved buying a Connex box for the gravel pit.
  where: North side of County Road 65
