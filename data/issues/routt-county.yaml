- title: 2027 county budget and health insurance costs
  summary: Commissioners held a series of 2027 budget presentations from Public Works, Facilities Management and the District Attorney, and reviewed the proposed budget on Sept. 21 and 22. They also reviewed county dues and outside funding requests, the 2027 health and dental insurance plan, the Tri-County District Attorney budget and the 2025 audit.
