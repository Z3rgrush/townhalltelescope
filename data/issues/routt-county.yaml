  summary: The PDR Board recommended $3,000,000 toward a conservation easement on Nottingham Ranch (PDR Project 222), which commissioners considered on Sept 8 after an executive session. Projects 224 and 225 were also under Tier I and II review in October. The PDR Board also met with Planning about how conservation easements affect development and subdivision design under the county's development code.
