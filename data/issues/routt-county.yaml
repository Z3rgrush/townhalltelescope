- title: Yampa Valley Housing Authority board and housing bond volume cap
  summary: The commissioners approved delegation agreements and an inducement resolution (2026-062) that let the Yampa Valley Housing Authority use the county's private activity bond volume cap through CHFA. In November they considered applications from 12 candidates for the YVHA board.
