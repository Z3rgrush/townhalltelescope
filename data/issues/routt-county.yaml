- title: Lodging tax advertising and marketing panel setup
  summary: The new Advertising and Marketing Local Tourism Panel is setting up bylaws, conflict-of-interest rules and a grant program for the 10 percent share of lodging tax. About $141,000 in qualifying revenue has been reported so far, and eligibility, matching funds and application cycles are undecided.
