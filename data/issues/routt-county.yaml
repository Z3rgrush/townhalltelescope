- title: Yampa Valley Gravel Pit special use permit expansion (PL20260026)
  summary: The Planning Commission took up a request to expand the permit boundary of the Yampa Valley Gravel Pit, on the north side of County Road 65. The commissioners considered it on Sept. 29 with a written public comment in the packet, and the Oct. 13 agenda has the chair signing the special use permit.
