- title: Routt County 2027 budget
  summary: Commissioners heard 2027 budget presentations from Public Works, Facilities Management and the District Attorney. They then reviewed the proposed 2027 budget, county dues and outside funding requests, and the 2027 health and dental insurance plan. The Tri-County District Attorney personnel budget and the health insurance pool budget also came up.
