- title: Nottingham Ranch conservation easement and other PDR projects
  summary: The Purchase of Development Rights board reviewed several projects (222, 224, 225), partly in executive session. Commissioners considered the board's recommendation to put $3,000,000 toward the conservation easement on Nottingham Ranch (Project 222). Projects 224 and 225 went to the commissioners for review on Oct. 20. The board also discussed with county planning how conservation easements affect development under the Unified Development Code.
