- title: WaterOne mine remediation at 10401 Renner Boulevard
  summary: WaterOne sought a rezoning and five-year special use permit to run a mining and quarrying operation at 10401 Renner Boulevard to remediate an old mine, with a public hearing at the planning commission before council approval.
  where: 10401 Renner Blvd
  refs: [8, 9, 15]
- title: Tax breaks for Lenexa Logistics Centre North warehouses
  summary: The council moved forward with about $42.5 million and $20 million in industrial revenue bonds and tax abatements for large Lenexa Logistics Centre North Phase II warehouse buildings, plus a special benefit district for Britton Street.
  where: Lenexa Logistics Centre North (Britton St)
  refs: [3, 6, 7, 10, 11]
- title: City Center parking study
  summary: As City Center gets busier, the council hired Kimley-Horn to study parking and curb use and recommend parking management and new parking.
  where: Lenexa City Center (87th St Pkwy & Renner)
  refs: [10, 11, 12]
- title: Seven Hills Lake stormwater project
  summary: The council combined two phases of the Seven Hills Lake stormwater improvements into one capital project.
  where: Seven Hills Lake
  refs: [15]
- title: 83rd Street rebuild from Gleason to Clare Road
  summary: Road widening on 83rd Street requires relocating septic systems for three affected homes.
  where: 83rd St, Gleason Rd to Clare Rd
  refs: [3, 6, 7]
- title: Little Mill Creek Park and Cottonwood Street rebuild
  summary: Final design was approved to rebuild Cottonwood Street in concrete and add parking at Little Mill Creek Park and the Municipal Services Center.
  where: Little Mill Creek Park / Cottonwood St
  refs: [10, 11, 12]
- title: Neighborhood Beautification Grant pilot
  summary: Lenexa created a $20,000 pilot program giving neighborhoods matching grants of up to $2,000 for visible improvements.
  refs: [10, 11, 12]
- title: St. James Academy additions on Prairie Star Parkway
  summary: Planners and the council reviewed about 46,000 square feet of additions and more parking at St. James Academy.
  where: 24505 Prairie Star Pkwy
  refs: [8, 9, 15]
- title: Sikh Gurudwara parking expansion on Marion Street
  summary: A request to expand parking and add a maintenance building at the Midwest Sikh Gurudwara in a single-family district was continued to November.
  where: 10050 Marion St
  refs: [8, 9]
- title: Shops at Vista Village and Westchester Square
  summary: Planners approved new multitenant commercial buildings at Prairie Star Parkway and Ridgeview and on 101st Street, and a facade refresh at Westchester Square at 87th and Pflumm.
  where: Prairie Star Pkwy & Ridgeview Rd; 87th St & Pflumm Rd
  refs: [8, 9]
- title: 99th Street and Woodsonia Drive special assessments
  summary: The council levied special assessments to pay for up to $10.6 million in public improvements in the 99th and Woodsonia benefit district.
  where: 99th St & Woodsonia Dr
  refs: [15]
- title: Strang Line Road streetlights
  summary: Lenexa awarded a $484,000 contract for new streetlights and stormwater work on Strang Line Road south of College Boulevard.
  where: Strang Line Rd south of College Blvd
  refs: [3, 6, 7]
