- title: Homelessness Response Action Plan and car-camping ban
  summary: Council received a briefing on the Homelessness Response Action Plan and heard that 335 vehicles have been addressed since the ban on sleeping in cars took effect. Members asked about the Safe Parking program, housing vouchers, and whether the housing and homelessness officer role should be split in two. Funding requests are expected in budget planning.
