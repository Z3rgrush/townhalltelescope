- title: 2027 budget, tax levy and mid-year finances
  summary: Council reviewed 2026 revenue running over budget and how that shapes the 2027 budget, including police and fire turnover and retail marijuana tax funding. It used the extra revenue to cancel a November furlough day, held 2027 budget work and markup sessions, and scheduled a 2027 tax levy of 3.209 mills and the 2027 salary schedule.
