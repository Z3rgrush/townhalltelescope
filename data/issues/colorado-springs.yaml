- title: 501 N Wahsatch Ave conversion to multifamily
  summary: The Planning Commission considered a development standards adjustment to allow 13.33 dwelling units per acre to convert an existing commercial building to residential. Neighbors raised parking concerns and opposed losing commercial use; staff said the request met all criteria and the site has six parking spaces.
