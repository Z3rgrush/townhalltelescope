- title: Project Taurus data center appeal at 1565 High Tech Way
  summary: Planning Commission held a 15-hour hearing on Project Taurus, a data center on Corporate Ridge Filing No. 1 Lot 4. City Council scheduled a special September 17 appeal hearing at the Pikes Peak Center, limited to 120 public speakers, on the administrative approval of the development plan modification, with noise monitoring and acoustic impacts a focus. Planning staff advised against discussing data centers generally while next steps are uncertain.
