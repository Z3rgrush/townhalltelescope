- title: Business license fee increases and code rewrite
  summary: Council moved ordinances 26-52, 26-53 and 26-54 repealing and reordaining the business licensing, sales of goods and services, and adult use business articles of city code. A 2027 fee schedule for general business licenses would raise fees toward full cost recovery by 2029, bringing in about $81,000 in year one, with CPI adjustments after that.
