- title: Project Taurus data center appeal at 1565 High Tech Way
  summary: City Council held a special hearing on Sept. 17, 2026 on appeals of the administrative approval of the Project Taurus development plan modification at Corporate Ridge Filing No. 1 Lot 4, 1565 High Tech Way, a facility with operational similarities to a data center. Public comment was capped at 120 speakers, and noise impacts and a sound monitoring plan were reviewed. By October the appeal had been postponed at Council's request, with a hearing expected in November, and planning staff are working on data center definitions in the zoning code.
