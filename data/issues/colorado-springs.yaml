- title: Project Taurus data center appeal
  summary: The Planning Commission held a 15-hour hearing on Project Taurus, a data center development at 1565 High Tech Way (Corporate Ridge Filing No. 1, Lot 4). Appellants challenged the administrative approval of its development plan major modification, and City Council set a special meeting for September 17 at the Pikes Peak Center, with public comment capped at 120 speakers. Planning staff advised commissioners not to discuss the project because next steps are uncertain.
