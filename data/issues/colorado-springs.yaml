- title: Banning Lewis Ranch and east-side rezonings
  summary: Council advanced the Banning Lewis Ranch Village B2 rezone near Tamlin Road and Dublin Boulevard and approved a slate of 16 Banning Lewis Ranch items. Related east-side items include rezones for the Cherokee Metro District 3-million-gallon water tank (4.88 acres at Tamlin and Marksheffel), the Creekbend rezone, Wagner Equipment at East Platte Avenue, and a 10.06-acre multifamily rezone at Villages at Waterview North.
