- title: 2027 city budget, tax levy and furlough day cancellation
  summary: Council reviewed mid-year finances showing 2026 revenue running above budget, including strong retail marijuana tax growth, and discussed police and fire turnover and park restroom funding. It took up a supplemental appropriation to eliminate the November furlough day, held budget work and markup sessions, and scheduled a 2027 tax levy of 3.209 mills plus a 2027 salary schedule.
