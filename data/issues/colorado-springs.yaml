- title: Homelessness response and the ban on sleeping in vehicles
  summary: Council heard the Homelessness Response Action Plan and an update on enforcement of the ordinance banning living in cars, including the Safe Parking program model. Councilmember Donelson asked whether the Chief Housing and Homelessness Officer role should be split in two. An earlier briefing covered the Clean and Safe downtown program, which includes a $400,000 Business Improvement District allocation for cleaning and landscaping.
