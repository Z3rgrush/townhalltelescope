- title: Downtown districts, BIDs and special maintenance district levies
  summary: Council reviewed the Downtown Development Authority 5.000-mill levy and 2027 budget, the Briargate GID levy of 4.409 mills, and business improvement district budgets. Mill levies for several special improvement maintenance districts were also set, and dissolution of the Barnes & Powers South BID was on the agenda.
