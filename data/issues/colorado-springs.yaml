- title: Kettle Creek annexation, zoning, metro district and garage setback adjustment
  summary: Council took up annexation of 19.88 acres northeast of Kettle Creek Road and Old Ranch Road, along with its zoning. On August 25 it approved the Kettle Creek Metropolitan District service plan on the consent calendar. A separate adjustment to the street-loaded garage setback for the Unit B product at 2060 Old Ranch Road is moving through the Planning Commission. Public comments were included in the annexation packet.
