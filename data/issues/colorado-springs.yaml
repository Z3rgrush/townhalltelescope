- title: Project Taurus data center appeal at 1565 High Tech Way
  summary: City Council held a special September 17, 2026 hearing on appeals of the administrative approval of a development plan modification for Corporate Ridge Filing No. 1 Lot 4, known as Project Taurus. Staff flagged acoustic (noise) impacts and a sound monitoring plan, and public comment was capped at 120 speakers. Planning staff said the project has operational similarities to a data center.
