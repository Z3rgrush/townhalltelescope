- title: 2027 city budget and revenue outlook
  summary: Council reviewed a financial report showing revenue running above 2026 budget, with discussion of retail marijuana tax funding for police and fire and of employee turnover. A supplemental appropriation would eliminate the November furlough day. Council also held a 2027 Budget Work Session on October 15.
