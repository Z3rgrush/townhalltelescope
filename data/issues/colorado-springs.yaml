- title: Homelessness Response Action Plan and car-camping ban
  summary: Council got an update on the Homelessness Response Action Plan, the Safe Parking program model, and enforcement of the ordinance banning sleeping in vehicles, with 335 vehicles cited or addressed since it took effect. A councilmember asked whether the Chief Housing and Homelessness Officer role should be split in two. Council also heard on the downtown Clean and Safe program.
