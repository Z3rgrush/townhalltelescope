- title: 2027 budgets, mill levies and operating plans for BIDs, DDA and GIDs
  summary: Council scheduled resolutions approving 2027 operating plans for many Business Improvement Districts, the Pikes Peak Regional Building Department budget and general business license fees. It also set mill levies and budgets for the Downtown Development Authority, Briargate GID (4.409 mills) and Marketplace at Austin Bluffs GID (50 mills).
