- title: Kettle Creek Metropolitan District and right-of-way vacation
  summary: Council approved a service plan for the Kettle Creek Metropolitan District north of Old Ranch Road and east of Voyager Parkway. It also approved vacating about 2.42 acres of Kettle Creek Road at 2060 Old Ranch Road, and the Planning Commission reviewed a seven-foot front setback adjustment.
