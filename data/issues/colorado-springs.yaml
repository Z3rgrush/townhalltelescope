- title: 2027 city budget, tax levy and furlough day elimination
  summary: Council reviewed a financial report showing 2026 revenue above projections, including strong retail marijuana tax growth, and discussed police and fire turnover and funding for park restrooms. An ordinance would use extra revenue to eliminate the November furlough day. Budget work and markup sessions were set for October, along with a 2026 tax levy of 3.209 mills payable in 2027 and the 2027 salary schedule.
