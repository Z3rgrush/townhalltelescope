- title: Business license rewrite and 2027 fee schedule
  summary: Council passed ordinances 26-52, 26-53 and 26-54 rewriting the business license, sales of goods and services, and adult use business codes. A resolution sets new 2027 general business license fees to reach full cost recovery by 2029, bringing in about $81,000 in year one.
