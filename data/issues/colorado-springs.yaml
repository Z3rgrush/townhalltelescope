- title: 'Kettle Creek development: metro district, setbacks and road vacation'
  summary: Council approved a service plan for the Kettle Creek Metropolitan District north of Old Ranch Road. The Planning Commission considered a seven-foot street-loaded garage setback adjustment for the Unit B housing product at 2060 Old Ranch Road, and an ordinance to vacate about 2.42 acres of Kettle Creek Road was set for second reading.
