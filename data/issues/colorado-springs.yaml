- title: 501 N Wahsatch Ave residential conversion adjustment
  summary: The owner seeks a Development Standards Adjustment to allow 13.33 dwelling units per acre so an existing commercial building can be converted to residential. Neighbors raised concerns about parking and about losing commercial use. Staff found the request met all criteria. The owner has six parking spaces and said he would join a residential permit-parking program. The item was pulled from the Planning Commission consent calendar for discussion.
