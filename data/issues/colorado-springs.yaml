- title: Homelessness Response Action Plan and car-camping ban
  summary: Council received a briefing on the Homelessness Response Action Plan and the upcoming budget request for it. Police reported 335 vehicles dealt with since the ordinance banning sleeping in cars took effect, and staff described the Safe Parking program. Councilmember Donelson asked whether the Chief Housing and Homelessness Officer role should be split into two positions.
