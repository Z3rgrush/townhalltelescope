- title: 'Rezonings and land use plans: Wagner Equipment, Lowell, Creekbend, Cherokee water tank'
  summary: 'Several rezones moved through Planning Commission and Council: 22.37 acres for Wagner Equipment at East Platte Ave and Wooten Road, the Cherokee Metro District water tank at Tamlin and Marksheffel, Creekbend, and the Lowell site on East Las Animas Street seeking 184 units per acre and 65-foot height. Council set second readings for several in late October.'
