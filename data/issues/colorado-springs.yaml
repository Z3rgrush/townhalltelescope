- title: 501 N Wahsatch Ave residential conversion adjustment
  summary: The Planning Commission heard a Development Standards Adjustment to convert a 9,800 sq ft commercial site with two buildings to residential use. Neighbors raised concerns about limited parking and the owner remodeling before seeking zoning relief, while staff said the request met all criteria and six parking spaces would be provided.
