- title: Business license code rewrite and 2027 fee increases
  summary: Council passed ordinances 26-52, 26-53 and 26-54 repealing and reordaining business licensing, sales of goods and adult use business code. A resolution sets 2027 general business license fees rising toward full cost recovery by 2029, with annual CPI adjustments after, raising about $81,000 in year one.
