  summary: Council reviewed the proposed 2027-2028 budgets in August, heard a 2027 rate and fee proposal in September, then took up adoption of the 2027 budget, a 6.650-mill property tax levy and the 2027 fee schedule on Nov 10. The Q2 2026 financial update and a third 2026 budget amendment were also considered.
