- title: Park shade structures instead of tree planting amid drought
  summary: Because of drought and water shortage concerns, the Council dropped 2026 tree planting. It approved up to $40,000 for shade structures of about $3,000-$4,000 each. Bids for Memorial Park structures were moving forward in August.
  where: Town parks, including Memorial Park
