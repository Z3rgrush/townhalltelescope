- title: Prop 123 affordable housing, Housing Needs Assessment and IGA with Silver Cliff
  summary: The Town considered the final Housing Needs Assessment. It approved an intergovernmental agreement with Silver Cliff on Prop 123 so Westcliffe can count some of Silver Cliff's affordable housing numbers, since it missed the three-year requirement. Residents asked numerous questions about the Prop 123 grant in September, and a Custer County workforce housing report is on the October agenda.
