- title: Emergency moratorium on data centers (Ordinance No. 2-2026)
  summary: After a public hearing with no public comment, the council approved Ordinance No. 2-2026 on August 18, a moratorium on data centers. The town attorney drafted it as an emergency ordinance so it took effect immediately.
  where: Townwide
