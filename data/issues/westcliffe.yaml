- title: 2026 budget and mill levy
  summary: After a public hearing with no comment, the Council approved the 2026 budget, appropriation and mill levy ordinances (5, 6 and 7-2025) in one motion on Dec. 9. A 2027 budget workshop was set for Aug. 28.
