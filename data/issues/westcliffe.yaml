- title: Colorado Wildfire Resiliency Code rejected and wildfire plan adopted
  summary: The Council adopted the Custer County Community Wildfire Protection Plan in January, replacing a 2007 plan. In March it denied Ordinance 1-2026 adopting the state Wildfire Resiliency Code. The Fire Department, Silver Cliff and the County had not adopted it, and the attorney noted possible insurance and permitting risks.
