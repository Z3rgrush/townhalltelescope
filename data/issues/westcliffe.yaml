- title: Main Street parking, safety and crosswalk
  summary: The Mayor raised closing Main Street between 2nd and 3rd in summers because of over-length vehicles and people crossing outside crosswalks. A workshop is planned. The Town bought two signs (up to $1,000) for the Rosita Street lot and approved a temporary painted crosswalk near 104 Main St. A permanent crosswalk is to be budgeted next year. A stop sign at Main and Adams Blvd is also on the October agenda.
  where: Main Street between 2nd and 3rd Streets; Rosita lot; Main St. and Adams Blvd
