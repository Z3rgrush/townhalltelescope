- title: Façade Grant program
  summary: 'The Council approved 2026 Façade Grant awards, cutting the Wildflower Hotel''s award to $3,542. It rewrote application rules: reimbursement only, in-town business license, brick-and-mortar, and signs capped at $1,000. It also let a 2025 recipient finish work past the deadline.'
