- title: Prop 123 affordable housing agreement with Silver Cliff
  summary: The council approved an intergovernmental agreement with Silver Cliff so Westcliffe can count some of Silver Cliff's numbers toward Prop 123 affordable housing requirements, which it did not meet on its own within the three-year period. Residents asked numerous questions about the Prop 123 grant the town received, and the mayor explained it. A workforce housing report was also on the October agenda.
  where: Westcliffe and Silver Cliff
  refs:
