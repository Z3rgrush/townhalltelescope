- title: Water/sewer expansion south of town and reservoir project
  summary: The Council approved a public statement for trustees and staff to use when residents ask about the water/sewer expansion south of town. It says the project improves the chance private lots get built on. In August the reservoir project was awarded to Mountain Valley Excavation, starting in September with completion hoped by May. The wastewater pilot study was 70% complete.
  where: South of town
