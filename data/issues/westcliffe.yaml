- title: Farmer's Market at Jess Price Park and Bluff Park observatory hours
  summary: The Council approved Resolution 4-2025 supporting the Farmer's Market on Town land at Jess Price Park, drafted as a resolution to avoid creating a leasehold. It also approved an MOU for extended Bluff Park hours at the Smokey Jack Observatory.
