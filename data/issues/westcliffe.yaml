- title: 'Tourism funding: Highway 69 welcome signs and holiday decor'
  summary: The Council gave $5,000 for Highway 69 welcome signs to get travelers to stop in town, with Mr. Shy opposed and approval contingent on the auditor. It also gave $3,500 for the holiday wreath contest and business holiday decor. The attorney said a statutory town cannot donate to the Altitude Fitness pool resurfacing and it must go through the grant process.
