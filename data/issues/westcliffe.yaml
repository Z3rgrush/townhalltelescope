  - 1
  - 2
  topics:
  - Housing
  - Government operations
  public_comment: true
- title: Reservoir project and wastewater pilot study
  summary: The reservoir project was awarded to Mountain Valley Excavation, with work starting in September and hoped to finish by May. The wastewater pilot study was reported 70% complete.
