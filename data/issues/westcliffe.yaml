- title: Data center moratorium (Ordinance 2-2026)
  summary: After a June discussion of data centers straining the electrical grid and water supply, the Town drafted a moratorium. First reading was July 21, and the Council approved Ordinance 2-2026 on Aug. 18 as an emergency ordinance, effective immediately. No one spoke at the public hearing.
