- title: Proposed 1/4-cent sales tax for parks (Playbook OP)
  summary: After adopting the Playbook OP parks plan, which has a $248 million funding gap, the Committee of the Whole chose to ask voters for a dedicated 1/4-cent parks and recreation sales tax. Ballot language comes back November 2.
  refs: [2, 21, 38, 42, 44]
- title: Black & Veatch headquarters and Overland Park Plaza II redevelopment
  summary: The council approved TIF and community improvement district financing for Black & Veatch's new 729,000-square-foot headquarters near 112th–115th and Nall, the first phase of a plan that could add 700 apartments, a hotel and more offices.
  where: 112th-115th St, Glenwood to Nall
  refs: [5, 35, 36, 40]
- title: 2027 budget exceeding the revenue-neutral rate
  summary: Overland Park held its hearing and approved a property tax rate above the revenue-neutral rate with the 2027 budget, while promoting a second round of its property tax rebate program.
  refs: [19, 26, 33]
- title: Citywide organized trash and recycling collection
  summary: The council held a public hearing and adopted a resolution of intent to move to an organized, city-contracted collection service for residential trash, recycling and yard waste.
  refs: [3, 33]
- title: Oak Park Mall rezoning to mixed use
  summary: Mall owner CBL Properties asked to rezone parts of Oak Park Mall at 95th and Quivira to general business and mixed use to allow changes to the mall; the planning commission received public comment on the revised plan.
  where: 95th St & Quivira Rd
  refs: [18, 32]
- title: Brookridge redevelopment and I-435 mixed-use rezoning
  summary: The former Brookridge golf course site near 103rd and Antioch is seeking mixed-use rezoning, and its developer gave a project update and assigned TIF/CID proceeds to its lender.
  where: 103rd St & Antioch Rd
  refs: [32, 37, 54, 55]
- title: The Woods mixed-use development at US-69 and I-435
  summary: A rezoning to mixed use was requested for The Woods at the southeast corner of US-69 and I-435.
  where: US-69 & I-435
  refs: [25, 56]
- title: Metcalf corridor TIF districts (8036 and 8201 Metcalf)
  summary: The council approved TIF and CID financing for a redevelopment at 8036 Metcalf (80th Street) after a public hearing, and the planning commission reviewed a TIF plan for 8201 Metcalf.
  where: Metcalf Ave near 80th-83rd St
  refs: [30, 40]
- title: 167th Street and US-69 rezoning for homes, apartments and shops
  summary: A large rezoning at the southwest corner of 167th and US-69 would allow single-family homes, high-rise apartments and commercial uses; it required a public hearing and was continued.
  where: 167th St & US-69
  refs: [30]
- title: Antioch Homes apartments at 7235 Antioch
  summary: Gravel Development asked to rezone 7235 Antioch Road to garden apartments for multifamily housing.
  where: 7235 Antioch Rd
  refs: [1, 11]
- title: Development code rewrite, including rules for new single-family homes
  summary: Staff presented Unified Development Ordinance updates, including new standards for single-family construction, and neighborhood groups were briefed.
  refs: [6, 8, 26]
- title: Police license plate reader cameras
  summary: The police department briefed the public safety committee on its automated license plate readers, including access to cameras run by private businesses.
  refs: [50]
- title: Bike and pedestrian network (Active Mobility Plan) and e-bike safety
  summary: Staff kicked off an Active Mobility Plan to connect trails, sidewalks and bike routes, while the environmental council discussed e-bikes and bike safety.
  refs: [15, 23, 29, 48]
- title: Storm sewer and drainage repairs
  summary: Contracts were approved for 2025–2027 storm drainage and major storm sewer repair projects, including the Bluejacket line.
  refs: [3]
- title: Downtown restorations (Dream Theatre at the Rio, Strang Depot)
  summary: The city moved toward funding the reopening of the Dream Theatre at the Rio and approved more aid for restoring the former Strang Depot at 80th and Santa Fe.
  where: Downtown Overland Park
  refs: [46, 52, 54]
- title: New subdivisions in south Overland Park
  summary: Plats were approved for Sundance Ridge neighborhoods near 175th and State Line, Falls at Wolf Creek, Southern Meadows and Prairie Wolf Flats.
  where: 175th-186th St
  refs: [11, 30, 32]
