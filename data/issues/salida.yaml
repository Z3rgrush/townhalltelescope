- title: Mountain Mail building renovation at 121-129 E. 2nd Street
  summary: The Historic Preservation Commission considered a Major Certificate of Approval for Shavano Holding Co. LLC to renovate the old Mountain Mail building. The plan includes a rooftop patio, two upper-floor residences, ground-floor retail, new egress windows and demolition of a deteriorated rear structure. The upper-story facade and windows are to be retained.
