  summary: Council reviewed preliminary housing needs assessment results in August, and the November 2 agenda lists approval of the regional assessment and final findings. On October 6 Council also approved a Proposition 123 affordable housing MOU with Buena Vista, Poncha Springs, Chaffee County and the Chaffee Housing Authority. Council also approved a Chaffee Housing Trust fee transfer for 8 deed-restricted units in the Two Rivers development.
