- title: Mountain Mail building renovation at 121-129 E. 2nd Street
  summary: The Historic Preservation Commission was to hear a Major Certificate of Approval application from Shavano Holding Co. LLC to renovate the old Mountain Mail building. Plans include a rooftop patio, two upper-floor residences, ground-floor retail, new egress windows and demolition of a deteriorated rear structure. The building is listed as non-contributing in the historic district.
