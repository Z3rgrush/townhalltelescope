  summary: The Board of Trustees took up the 2027 draft budget on Oct. 13 and held budget workshops on Sept. 26 and Oct. 17. On Oct. 27 it discussed 2027 budget modifications, and a public hearing on the proposed 2027 budget was set for Nov. 10 along with the 2026 budget, the town investment policy and FY2027 projects and objectives.
