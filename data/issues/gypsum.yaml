- title: License plate readers and security cameras
  summary: A resident asked for an independent investigation of the Town's license plate reader cameras and potential legal claims. Council heard a staff presentation on the camera technology on Sept. 8 and held a dedicated public comment period on cameras and license plate readers on Sept. 22, including discussion of the contract with the Sheriff's Office.
