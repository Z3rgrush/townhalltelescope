- title: Automated license plate reader cameras and security cameras
  summary: Residents, including Eric Medina, pressed the Council on license plate reader cameras, asking for an independent investigation and raising possible legal claims. Staff presented on the Town's camera technology, the Council held a dedicated public comment period on ALPRs on Sept. 22, and a records request on the cameras came up in October. The contract with the Sheriff's Office was also discussed.
