- title: License plate reader cameras and calls for an investigation
  summary: Residents pressed Council over the Town's automated license plate reader cameras. One resident requested an independent investigation and raised possible legal claims, and a records request was filed. Staff gave presentations on the Town's camera technology and the contract with the Sheriff's Office, and Council held a dedicated public comment period on cameras on Sept. 22.
