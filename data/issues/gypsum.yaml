- title: Lodging tax ballot measure
  summary: Council approved Resolution No. 23 calling a special coordinated election on a Town lodging tax. The Town Manager said it would replace the existing county tax rather than add a new one. Council discussed a resident's letter asking about the measure and the ballot language.
