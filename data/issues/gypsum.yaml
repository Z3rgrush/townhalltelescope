- title: Lodging tax ballot measure
  summary: Council approved Resolution 23 calling a special coordinated election on a town lodging tax that would replace the existing county tax rather than add a new one. Discussion covered a resident's letter about the ballot measure and the ballot language.
  where: Townwide
  refs:
