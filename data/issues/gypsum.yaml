  public_comment: true
- title: State collection of sales tax (Ordinance 11)
  summary: Council passed Ordinance 11, rewriting Chapter 3.02 so the Town's sales tax rules comply with state statutes and allow the state to collect the tax. It was approved on first reading Aug. 11 and on second reading Aug. 25.
