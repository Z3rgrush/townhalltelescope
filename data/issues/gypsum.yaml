- title: Tower Center PUD amendment and Filing No. 2 final plat
  summary: Council amended the Tower Center PUD Guide (Ordinance 10) after a second-reading hearing on Aug. 11. It tabled, then on Aug. 25 approved, Resolution 22 for the Filing No. 2 final plat and subdivision improvement agreements. On Sept. 8 it approved Resolution 25 assigning the improvement agreement.
