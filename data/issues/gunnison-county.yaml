- title: 0.50% countywide sales tax for roads and bridges on the November 2026 ballot
  summary: On August 18 the commissioners approved Resolution 2026-29 referring a 0.50% countywide sales tax for roads, bridges and related transportation infrastructure to the November 3, 2026 ballot, along with an agreement with the Clerk and Recorder to run the question. Commissioners stressed the money would go only to roads and bridges. In October a commissioner continued public outreach on the measure, and a Road and Bridge budget work session was scheduled.
