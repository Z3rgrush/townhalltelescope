- title: 2027 county budget and work sessions
  summary: The commissioners received the first draft of the 2027 budget on October 13 and chose departments for work sessions, including Road & Bridge, Public Health, Human Services, the Housing Authority, Whetstone and the capital improvement plan. A public hearing on the budget is set for December 8 at 5:30 pm. A $10,000 late-night taxi request could be added to a contract for services, and the Board agreed to invite an application.
