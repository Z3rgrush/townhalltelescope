- title: Town of Crested Butte water and sewer extension agreement
  summary: The November 3 consent agenda included a second amended utility extension agreement with the Town of Crested Butte to provide water and sewer service. An executive session was also planned on negotiating over specific parcels and recovery of funds owed to the county under a contract.
