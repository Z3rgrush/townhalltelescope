- title: Lower Verzuh Ranch subdivision sketch plan (LUC-25-00004)
  summary: Commissioners deliberated on a Major Impact sketch plan for the Lower Verzuh Ranch Subdivision. They voted not to hold an additional public hearing. On July 28 they sent the application back to the Planning Commission for a more refined basis and conditions. On August 11 the decision was postponed to a later meeting. Commissioners were split, with some concerned about the north valley and the level of public opposition.
  where: Lower Verzuh Ranch, Gunnison County
