- title: Whetstone housing and Housing Authority budget amendment
  summary: The Housing Authority amended its 2026 budget and appropriation (Resolution 2026-005) for Whetstone because of how the bond documents work. Whetstone is also set to include family childcare units, and its business plan is slated for a budget work session.
