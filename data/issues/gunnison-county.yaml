- title: 2027 county budget draft and work sessions
  summary: On October 13 the chief finance officer presented the first draft of the 2027 budget. Commissioners asked for work sessions on Road & Bridge, Public Health, Human Services, the Housing Authority and Whetstone, and the Capital Improvement Plan. A public hearing was set for December 8 at 5:30 pm, and the board agreed to invite applications for a $10,000 late-night taxi request.
