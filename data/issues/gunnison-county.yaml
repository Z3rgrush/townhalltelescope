- title: Whetstone housing and Housing Authority budget amendment
  summary: The Housing Authority amended its 2026 budget and appropriation (Resolution 2026-005) for Whetstone because of how the bond documents work. Whetstone had permanent water onsite, and three units there are allocated to large family childcare. The Housing Authority and Whetstone business plan was also slated for a 2027 budget work session.
