- title: Lower Verzuh Ranch major impact sketch plan (LUC-25-00004)
  summary: Commissioners deliberated on the Lower Verzuh Ranch Subdivision sketch plan and whether to hold another public hearing. Commissioner Smith opposed a further hearing, while Commissioner Puckett Daniels wanted another hearing or more time; the board voted not to hold an additional hearing, and the decision was postponed to a later meeting.
