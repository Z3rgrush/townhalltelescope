- title: 2027 county budget draft and December 8 public hearing
  summary: The first draft of the 2027 budget was presented October 13. Commissioners asked for work sessions on Road & Bridge, Public Health, Human Services, the Housing Authority and Whetstone, and the Capital Improvement Plan. A $10,000 late-night taxi request may be added to contracts for services, and a public hearing was set for December 8 at 5:30 pm.
