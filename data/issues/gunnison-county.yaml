- title: 0.50% countywide sales tax for roads and bridges on November ballot
  summary: On August 18 commissioners approved Resolution 2026-29 referring a 0.50% countywide sales tax for roads, bridges and related transportation infrastructure to the November 3, 2026 election. They also approved an agreement with the Clerk and Recorder to run the ballot question. Commissioners stressed the money would go only to road and bridge work.
