- title: Whetstone housing budget and Housing Authority finances
  summary: The Housing Authority amended its 2026 budget and appropriation (Resolution 2026-005) for Whetstone because of how the bond documents work. Whetstone, the Housing Authority administration fund and the Whetstone business plan were set for 2027 budget work sessions. Whetstone also includes family childcare units.
