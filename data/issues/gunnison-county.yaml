- title: 'November 2026 ballot: 0.50% countywide sales tax for roads and bridges'
  summary: On August 18 commissioners approved Resolution 2026-29 referring a 0.50% countywide sales tax to the November 3, 2026 ballot to fund roads, bridges and related transportation infrastructure. They also approved an agreement with the Clerk and Recorder for running the ballot question and said the funds would go only to road and bridge. The Road and Bridge budget was set for a work session on October 27.
