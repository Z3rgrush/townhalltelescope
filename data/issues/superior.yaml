- title: 2027 budget, fee schedule and property tax levy
  summary: Council held budget review sessions in Aug-Sept and on Oct 12 adopted the 2027 budget, fee schedule and property tax levy, along with budgets for the SMID, SURA and Metro District No. 1. Mid-year reports showed vehicle use tax down 17.1%, permit revenue down about 31% and sales tax roughly flat.
