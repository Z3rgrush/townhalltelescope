- title: 2027 Town budget, fee schedule and property tax levy
  summary: Council reviewed the 2027 budget and 2027-2031 financial plan in several sessions, then on Oct. 12 adopted the budget, fee schedule and property tax levy. Metro district and urban renewal authority budgets were adopted too. Mid-year figures showed vehicle use tax down 17.1%, permit revenue down and sales tax roughly flat.
