- title: Marshall Fire Remembrance Project and 5-year anniversary event
  summary: The Town is planning a Marshall Fire Remembrance on Town-owned land, with a survey and geotechnical report done and a design team (Davis Partnerships + LandDesign) at work. Colorado Gives will act as fiscal partner, Louisville is committing $25,000, and Council is considering a fundraising advisor agreement. A Resilience Celebration is set for Friday, December 18, 6-8pm at the Community Center.
