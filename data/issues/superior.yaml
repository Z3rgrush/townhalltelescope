- title: Water conservation, turf reduction and water supply
  summary: The Town drafted a water conservation plan with a survey and a turf plan. Council adopted the Waterwise Landscape Transformation Roadmap and turf reduction prioritization tool and approved a Northern Water Southern Water Supply Project allotment amendment. Water use was up 17.4% in 2026 including a 9.5% rate increase.
