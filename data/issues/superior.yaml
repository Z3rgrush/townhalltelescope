  summary: Council approved an intergovernmental agreement with CDOT for the 88th Street Bicycle and Pedestrian Improvements Project. It is also considering a Colorado Parks and Wildlife trail grant submission, and the parks committee is discussing support for the McCaslin multi-use trail grant.
