- title: 2027 Town budget, fee schedule and property tax levy
  summary: Council held budget review sessions in late August and September, then on Oct. 12 held public hearings and approved the 2027 budget, fee schedule and property tax levy. Related budgets for the Superior/McCaslin Interchange Metro District, Urban Renewal Authority and Metro District No. 1 were also approved. The budget adds a full-time Park Ranger.
