- title: 2027 budget and five-year financial plan
  summary: Council held budget review sessions in August and September on the 2027 budget and 2027-2031 financial plan, with adoption hearings set for October 12 covering the fee schedule, property taxes, and budgets for the metro districts and urban renewal authority. Mid-year figures show sales tax up 0.2%, vehicle use tax down 17.1%, and permit revenue down about 31%.
