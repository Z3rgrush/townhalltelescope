- title: Marshall Fire Remembrance and five-year anniversary
  summary: The town is designing a Marshall Fire Remembrance with a gathering place and pet memorial, setting up fundraising through Colorado Gives with $25,000 committed by Louisville, and planning a five-year anniversary resilience celebration on December 18.
  where: Superior Community Center
  refs: [7, 9, 11, 15, 22, 24, 29]
- title: 2027 budget and property tax levy
  summary: Council held a series of budget review sessions on the 2027 budget and five-year plan, with sales tax flat and vehicle use tax down, then set a public hearing to adopt the budget, fees and property tax levy along with the metro district and urban renewal budgets.
  where: Townwide
  refs: [5, 12, 17, 21, 26]
  public_comment: true
- title: Zaharias property development at 7500 S 88th Street
  summary: Garrett Companies sought a 25th amendment to the Rock Creek Ranch planned development for the Zaharias property, with residents speaking at the planning commission hearing before it went to council.
  where: 7500 S 88th St
  refs: [13, 15, 18]
  public_comment: true
- title: Pirate Park playground renovation
  summary: Council approved a design-build contract with Altitude Recreation to rebuild the Pirate Park playground, and the parks committee and council got regular progress updates.
  where: Pirate Park
  refs: [1, 6, 19, 26]
- title: Water conservation and turf reduction
  summary: The town drafted a waterwise landscape roadmap and a tool for ranking non-functional turf to remove, gathered resident input on Shape Superior, and amended its Northern Water supply allotment.
  where: Townwide
  refs: [3, 26]
- title: Prairie dog and wildlife management plans
  summary: The open space committee worked on a prairie dog management plan covering relocation and conflicts, a broader town wildlife plan, and balancing wildfire mitigation with habitat.
  where: Town open space
  refs: [2, 15, 28]
- title: Coyote Ridge trail recommendations
  summary: A consultant presented recommended trail projects for Coyote Ridge open space, to be priced and scheduled once staff sign off.
  where: Coyote Ridge
  refs: [2, 28]
- title: Adopting the 2024 International Fire Code
  summary: Council adopted the 2024 International Fire Code after a hearing continued from August, with the Mountain View Fire Protection District presenting.
  where: Townwide
  refs: [1, 23]
- title: Boulder County early childhood mill levy
  summary: Council passed a resolution supporting the Boulder County ballot measure to raise the property tax for early childhood care and education, after discussing the county's child care investment initiative.
  where: Boulder County
  refs: [10, 18]
- title: 88th Street bike and pedestrian improvements
  summary: Council approved an agreement with CDOT for bicycle and pedestrian improvements along 88th Street.
  where: 88th Street
  refs: [8]
- title: Trash, recycling and electric garbage trucks
  summary: Republic Services briefed council on contamination, blocked containers and its electric collection trucks, as the town looks at a future single-hauler contract and apartment recycling and composting.
  where: Townwide
  refs: [3, 27]
- title: Rock Creek Parkway, Community Center and pool construction
  summary: Council received construction updates on Rock Creek Parkway, the community center and the north and south pools.
  where: Rock Creek Parkway, Superior Community Center
  refs: [26, 30]
