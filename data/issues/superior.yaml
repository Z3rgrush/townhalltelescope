- title: Water conservation and turf reduction plan
  summary: The Town drafted a Waterwise Landscape Transformation Roadmap and a prioritization tool for reducing non-functional turf, with a survey on Shape Superior and an August 31 work session. Council is slated to consider adopting it October 12 along with a Northern Water Southern Water Supply Project allotment amendment.
