- title: Pesticide spraying concerns in park
  summary: Residents raised concerns at the sustainability committee about a spraying event in a park near a pond. They said they were told spraying was limited to 20 feet away, and questioned whether the landscape contract should be competitively bid. Council is slated to consider a landscape agreement with Vargas Property Services on October 26.
