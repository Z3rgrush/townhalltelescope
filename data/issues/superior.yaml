- title: Water conservation, turf reduction and water supply
  summary: A draft water conservation plan was put out for survey, and Council adopted a Waterwise Landscape Transformation Roadmap and a non-functional turf reduction prioritization tool. Council also approved a Northern Water Southern Water Supply Project allotment amendment. Water usage is up 17.4% in 2026, including a 9.5% rate increase.
