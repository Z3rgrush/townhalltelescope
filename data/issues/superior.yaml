- title: Marshall Fire Remembrance Project and 5-year anniversary event
  summary: The Town is designing a Marshall Fire Remembrance (place to gather, pet remembrance, dispersed components) with Davis Partnerships + LandDesign. Council approved an agreement with Colorado Gives Foundation as fiscal partner and a fundraising advisor, Make Philanthropy Work. Louisville is contributing $25,000, and a 5-year anniversary Resilience Celebration is set for Friday, Dec. 18, 6-8pm, to kick off fundraising.
  where: Superior (site coordinated with Boulder County)
