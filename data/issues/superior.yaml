- title: Marshall Fire Remembrance Project and 5-year anniversary event
  summary: The Town is designing a Marshall Fire Remembrance with a place to gather, pet remembrance and dispersed components. Colorado Gives will act as fiscal sponsor, Make Philanthropy Work was hired as fundraising advisor, and Louisville is committing $25,000. A kickoff fundraising and Resilience Celebration is planned for Dec. 18, 6-8pm at the Community Center.
