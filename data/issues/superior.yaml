- title: Coyote Ridge trails, open space, wildfire mitigation and prairie dog plan
  summary: The Open Space committee is reviewing consultant Pointe Strategies' draft trail recommendations for Coyote Ridge, an updated prairie dog management plan, wildfire mitigation work, a wildlife management plan, and the Open Space Master Plan, due for approval in October. Youth Corps crews completed weed, fence and trail work over the summer.
