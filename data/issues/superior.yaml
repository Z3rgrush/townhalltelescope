- title: Marshall Fire Remembrance Project and 5-year anniversary event
  summary: The Town is designing a Marshall Fire memorial with a place to gather, pet remembrance and dispersed elements. Colorado Gives is acting as fiscal sponsor, and Louisville is committing $25,000. On Oct 26 Council took up agreements with Colorado Gives and Make Philanthropy Work as fundraising advisor. A resilience celebration is planned for Dec 18 at the Community Center.
