- title: Housing Helps program and employee housing
  summary: Residents thanked Council for the Housing Helps program, which buys homes from locals and resells them with restrictions, and urged continued robust funding. Council also moved on a first reading to remove employee housing mitigation requirements for exterior food and beverage uses, and a landowner at 10944 Highway 9 asked to partner with the Town on water service for housing units. The Oct. 27 agenda included a housing update and an accessory dwelling unit policy discussion.
