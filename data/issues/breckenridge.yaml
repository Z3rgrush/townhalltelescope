- title: 2027 budget and 5.07-mill levy
  summary: Council took up the 2027 mill levy ordinance (Council Bill 11), the 2027 budget (Resolution 22) and the 2026-2030 Capital Improvement Plan. The levy stays at 5.07 mills, unchanged since 2014, and is projected to generate $5.48 million.
