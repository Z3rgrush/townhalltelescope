- title: Wellington-Oro and French Gulch water treatment plant
  summary: Staff updated the commission on optimizing the French Gulch water treatment plant for cadmium and zinc, including budgeting for engineering consultants and pilot-testing an aeration pond. The Town and County are working toward a critical 2029 Water Quality Control Commission hearing, with specialized legal counsel.
