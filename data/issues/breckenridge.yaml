- title: 'Ballot measures: Summit schools mill levy 4A and Proposition NN'
  summary: Council adopted resolutions supporting Summit County's referred measure 1A (Strong Futures) and the Summit School District Mill Levy Override, added to the Sept. 22 agenda as Resolution 19. Council also took up Resolution 21 supporting statewide Proposition NN, which would increase public education funding 2% per year for 10 years without raising taxes.
