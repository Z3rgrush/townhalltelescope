- title: Mamba Trust retaining wall variance at 219 Glen Eagle Loop
  summary: Planning Commission considered a variance to let part of an unpermitted retaining wall remain outside the platted disturbance envelope; staff said about 75 feet would need removal to comply. The owner's architect argued the wall's setting, and commissioners asked how disturbance envelopes are created.
