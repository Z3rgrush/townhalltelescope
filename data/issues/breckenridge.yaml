- title: Wellington-Oro water treatment and 2029 water quality hearing
  summary: Staff are budgeting for engineers to optimize the French Gulch treatment plant for cadmium and zinc. They are working toward a critical 2029 Water Quality Control Commission hearing, where the Town and County aim to show good-faith progress.
  where: French Gulch / Wellington-Oro
