- title: Town-wide parking study and worker permit parking
  summary: A consultant study concluded Breckenridge has a distribution problem rather than a parking shortage, since demand is concentrated downtown while peripheral lots have room. It proposes 13 management strategies, and Council was asked to set implementation priorities. Residents had earlier complained about limited permit parking for workers and residents and suggested gated permit lots, towing and use of the South Gondola lots.
