  summary: 'The Planning Commission held preliminary hearings on a new City Market #430 fuel center (PL-2026-0171). It includes future demolition and environmental remediation of the existing fuel center, tree removal at Airport Road and Park Avenue, and a mountain-style design with a red sign reviewed separately. Commissioners asked for more evergreen screening, snow storage coordination and a less conspicuous color palette.'
