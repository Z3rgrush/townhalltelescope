- title: City Market fuel center redesign at 430 N. Park Avenue
  summary: Planning Commission held repeated preliminary hearings on a new City Market fuel center, with a redesigned mountain-style look using stone veneer, faux wood shingles and metal roof, plus Park Avenue screening and tree removal at Airport Road. Commissioners praised the redesign and asked for a sample board at the final hearing; future demolition and remediation of the existing fuel center is included. No public comments were made at the hearing.
