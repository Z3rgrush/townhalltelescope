- title: Worker and resident parking permits
  summary: A resident told Council that permitted parking for workers and residents is hard to find despite holding a permit. She suggested gated access for permit lots, towing enforcement, and expanding parking into the South Gondola lots or the parking structure. Council also revised the delivery zone program in Council Bill 9, updating fees and penalties.
