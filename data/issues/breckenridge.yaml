- title: Open space trails workplan, Tiger Road Rec Path and downhill trails
  summary: The Open Space Advisory Commission refined a trails prioritization matrix and scored a proposed Phase 1 of the Tiger Road Rec Path. Residents asked for more hand-built downhill trails, such as near Little Mountain, to ease user conflicts. Commissioners named new trails Bald Barber and Chasing Mystic and kept the Little Daisy access road name McCain Drive.
