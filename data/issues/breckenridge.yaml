- title: Quandary Peak trailhead improvements and Aspen Alley shuttle
  summary: The Town pledged $400,000 in matching funds for a Summit County Outdoor Coalition grant for Quandary Trailhead improvements, with results expected at year-end. Staff also hired SGM for design studies needed for a County PUD parking expansion. A free seasonal shuttle and police parking enforcement manage crowding at Aspen Alley.
