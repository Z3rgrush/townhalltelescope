- title: Quandary trailhead, Aspen Alley shuttle and open space trails
  summary: Open Space commission reviewed the Quandary Peak trailhead design, with the Town pledging $400,000 in matching funds to a coalition grant, and the Aspen Alley seasonal parking and shuttle plan. It also covered the Peak 10 social trail inventory and new trail construction. A resident urged steeper hand-built downhill trails, and the commission recommended 2027 grants including $25,000 to Friends of the Dillon Ranger District.
