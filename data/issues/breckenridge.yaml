- title: Comprehensive Plan underutilized parcels and workforce housing density
  summary: The Planning Commission is reviewing maps of underutilized parcels, including Park Avenue corridor sites, the Breckenridge Elementary parcel and the North Gold Rush lot, as potential housing sites under state comp plan rules. Staff recommended workforce housing densities such as 30 units per acre on the Park Avenue corridor, and commissioners raised concerns about views from Carter Park and historic district limits. Council also toured Riverwalk Center for the plan.
