- title: Flock license plate cameras and the automated license plate reader program
  summary: Residents spoke at the Aug. 25 Council meeting against Flock license plate cameras, citing broad data-use rights, no federal or state oversight, and no opt-out, and asked for better communication on camera placement and contracts. The Flock contract comes up for renewal in March 2027, and an automated license plate reader program presentation was scheduled for the Oct. 13 Council meeting. A later public commenter asked whether police policies and training comply with Colorado law.
