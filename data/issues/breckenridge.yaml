- title: Comprehensive Plan underutilized parcels and workforce housing density
  summary: As required by state comprehensive plan rules, the Planning Commission reviewed maps of underutilized parcels that could be developed or redeveloped for housing, such as the North Gold Rush lot, the Breckenridge Elementary parcel and the Park Avenue corridor. Staff recommended allowed workforce housing densities, including 30 units per acre along Park Avenue. Commissioners worried about views of the Carter Park pavilion and about a parking study being done with Vail.
  where: Townwide, including Carter Park, North Gold Rush lot and the Park Avenue corridor
