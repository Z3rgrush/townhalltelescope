- title: 2027 budget, mill levy and capital improvement plan
  summary: Town Council held a Budget Retreat on Oct. 13 and was scheduled to take up the 2027 mill levy (Council Bill 11), the 2027 budget (Resolution 22) and the 2027-2030 Capital Improvement Plan on Oct. 27. Open space staff described a conservative budget built on flat sales tax projections.
