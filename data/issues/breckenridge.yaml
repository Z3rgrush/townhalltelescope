- title: 2027 budget, mill levy and capital improvement plan
  summary: Council held a budget retreat on Oct. 13 covering the 2027 budget process and strategic goals, including housing and code enforcement. On Oct. 27 it was scheduled to take up the ordinance setting the 2027 mill levy (Council Bill 11) and a resolution adopting the 2027 budget and capital improvement plan. Open Space staff also presented a preliminary budget based on flat sales tax projections.
