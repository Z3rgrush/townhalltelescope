- title: Housing Helps program and workforce housing density
  summary: Residents thanked Council for the Housing Helps program, which buys units and keeps them as local housing, and urged continued robust funding. Planning Commission reviewed the Comprehensive Plan's underutilized parcels analysis and staff's recommended workforce housing densities, including 30 units per acre along Park Avenue. Commissioners worried about density near Carter Park and the Breckenridge Elementary parcel. Council also took up a Proposition 123 agreement with Silverthorne and an ADU policy discussion.
  where: Townwide, including Carter Park and Park Avenue corridor
