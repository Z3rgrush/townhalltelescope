- title: Open space trails, Tiger Road Rec Path and downhill trail demand
  summary: Open Space commission discussed a trails prioritization matrix, with Phase 1 of the Tiger Road Rec Path scoring well, and residents urged more hand-built downhill trails at Little Mountain. It approved trail names and discussed Little Daisy Open Space trail work and Quandary Trailhead improvements, with $400,000 in town matching funds pledged for a grant application.
