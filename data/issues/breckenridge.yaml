- title: Flock license plate cameras and the automated license plate reader program
  summary: Residents told Council on Aug. 25 they are worried about Flock cameras capturing license plates and vehicle signals, with broad data-use rights and little oversight, and asked for better communication on camera placement and the contract renewal due March 2027. Council had an automated license plate reader program presentation on its Oct. 13 agenda.
