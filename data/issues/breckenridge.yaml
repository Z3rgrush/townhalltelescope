  summary: Council met in executive session on water service and legal advice for the Trails at Berlin Placer development and on buying property in the Upper Blue area. The Town Attorney was told to begin negotiating bond money for the development. A resident at 10944 Highway 9 also asked about partnering with the Town for water service to build housing.
