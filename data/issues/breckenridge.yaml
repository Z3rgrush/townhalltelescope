- title: 'City Market #430 fuel center redesign'
  summary: Planning Commission held preliminary hearings on a new City Market fuel center at 430 N. Park Ave. The redesign uses mountain-style materials, adds Park Avenue evergreen screening and removes trees at Airport Road and Park Avenue. Existing fuel center demolition and remediation would come later, and signs will be reviewed separately. Commissioners called the redesign much better and asked for a stone sample board at the final hearing.
