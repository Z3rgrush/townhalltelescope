- title: Support for school funding measures 4A, 1A and Proposition NN
  summary: Council added and passed resolutions supporting Summit County's Strong Futures referred measure and the Summit School District mill levy override (Ballot Measure 4A), which would extend funding without new or increased taxes. It also scheduled a resolution backing statewide Proposition NN, which would raise public education funding 2% a year for 10 years. Council also held executive sessions on negotiations with Summit School District over real property.
