- title: Housing Helps program and workforce housing density
  summary: Residents thanked Council for the Housing Helps program, in which the Town buys homes and keeps them for locals, and urged continued robust funding. Planning Commission reviewed staff recommendations on workforce housing density for underutilized parcels, including 30 units per acre along Park Avenue, with concerns about views from Carter Park. Council also scheduled housing and accessory dwelling unit policy discussions.
