- title: Flock license plate reader cameras and contract renewal
  summary: Residents told Council they are concerned about Flock license plate cameras, citing broad data-use rights, lack of oversight and unclear camera placement, and asked for better communication ahead of the contract renewal in March 2027. Council scheduled an automated license plate reader program presentation for its Oct. 13 budget retreat.
