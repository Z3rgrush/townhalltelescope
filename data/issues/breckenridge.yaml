- title: Mamba Trust retaining wall variance
  summary: Planning Commission considered a variance to let part of an unpermitted retaining wall remain outside the platted disturbance envelope at 219 Glen Eagle Loop. About 75 feet would otherwise need removal, and commissioners questioned how disturbance envelopes work and whether the wall is justified.
