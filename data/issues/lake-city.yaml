- title: 2027 budget, water and sewer rates, and capital projects
  summary: Council worked through the 2027 draft budget in October and November, including 2027 water and sewer rates, capital improvement projects, donations funding, and health insurance plan options. The town manager was appointed budget officer, and a budget workshop was set for Nov. 11.
