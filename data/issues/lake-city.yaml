- title: 2027 budget, water and sewer rates, and capital projects
  summary: Council reviewed the 2027 draft budget, 2027 water and sewer rates, capital improvement projects, alternate health insurance plans versus the current CEBT plan, and limited funds for donations. The Town Manager was appointed budget officer. A 2026 audit RFP and an engagement letter with Green & Associates were also discussed.
