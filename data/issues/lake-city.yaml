- title: Hinsdale County & Lake City Phase 1 housing plan implementation
  summary: Council accepted a Phase 1 Housing Plan Implementation grant agreement and sought proposals for a consultant. It first selected Collegiate Peaks Law & Mediation, but by October 21 it was discussing a notice of award to Western Space(s) LLC, and a professional services agreement with Western Spaces was on the November 4 agenda. The work supports a comprehensive county and town housing plan.
