- title: Phase 1 Hinsdale County/Lake City Comprehensive Housing Plan implementation
  summary: The town received six proposals to carry out Phase 1 of the housing plan and on Aug 19 accepted a Phase 1 implementation grant agreement and selected Collegiate Peaks Law & Mediation LLC. A professional services agreement was approved Sept 2. By Oct 7 and Oct 21 the consultant selection was back on the agenda, with a notice of award to Western Spaces LLC under discussion and action.
