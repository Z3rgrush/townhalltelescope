- title: ADU grant and pre-approved ADU plans
  summary: Council discussed DOLA ADU Supportive Jurisdiction certification and approved a grant application of $107,000 with a 13% match of $13,910. The money would fund pre-approved accessory dwelling unit designs and ADU financial assistance.
