  summary: Six proposals were received for the Phase 1 housing plan work. Council accepted the implementation grant agreement and on August 19 selected Collegiate Peaks Law & Mediation, approving its service agreement September 2. By October the consultant selection was being revisited, and a notice of award to Western Spaces LLC was on the October 21 agenda.
