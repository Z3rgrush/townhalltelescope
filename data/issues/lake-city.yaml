- title: Elk Fire emergency and local disaster declaration
  summary: Town Manager Alexander Mulhall declared a local disaster on August 7, 2026 due to the Elk Fire, and Council ratified it by Resolution 2026-10 on August 12. The town approved an emergency agreement with the USDA Forest Service for potable water and grey water disposal at $0.03 per gallon, and thanked Estes Park and Windsor for lending backup generators. Resolution 2026-13 to terminate the emergency was on the October 21 agenda.
  where: Elk Fire on the Lake City border, unincorporated Hinsdale County
