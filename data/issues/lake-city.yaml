- title: Elk Fire local disaster emergency
  summary: The Town Manager declared a local disaster on August 7, 2026 due to the Elk Fire on the border of Lake City, and Council ratified it on August 12 with Resolution 2026-10. Council approved an emergency agreement with the USDA Forest Service for potable water and grey water disposal at $0.03 per gallon. Backup generators were borrowed from Estes Park and Windsor, and on October 21 Council discussed Resolution 2026-13 terminating the emergency.
  where: Lake City and unincorporated Hinsdale County
