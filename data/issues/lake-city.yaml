- title: DOLA ADU grant and pre-approved accessory dwelling unit designs
  summary: The council discussed a DOLA grant application, a reduced match request and incentive funding for accessory dwelling units. On Oct 21 it considered a $107,000 application with a 13% match of $13,910 for pre-approved ADU designs. The town also discussed ADU Supportive Jurisdiction certification.
