- title: July 24 flash floods, debris flows and stormwater
  summary: Council discussed the July 24, 2026 flash floods and mud and debris flows, then followed up on cleanup and recovery on August 5. A resident raised concerns about loss of containment of stormwater, especially its depth and velocity.
