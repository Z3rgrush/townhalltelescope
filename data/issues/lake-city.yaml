- title: Phase 1 Hinsdale County & Lake City Housing Plan implementation
  summary: In August the council approved the PC-IN-922 Phase 1 Housing Plan Implementation grant agreement and picked a consultant by RFP. The consultant name shifted across documents (Collegiate Peaks Law & Mediation, then Western Space/Spaces LLC). A professional services agreement with Western Spaces LLC was approved on Nov. 4.
