- title: Elk Fire emergency response and disaster declaration
  summary: Town Manager Alexander Mulhall declared a local disaster on Aug 7 because of the Elk Fire on the town's border in unincorporated Hinsdale County, and council ratified it Aug 12. Council approved an emergency facilities and land use agreement with the USDA Forest Service for potable water and grey water disposal at $0.03 per gallon. Resolution 2026-13 to end the emergency was on the Oct 21 agenda, and the council also thanked Estes Park and Windsor for lending backup generators.
  where: Lake City and border with unincorporated Hinsdale County
