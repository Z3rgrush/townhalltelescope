- title: Elk Fire response and emergency water agreement with USDA Forest Service
  summary: Council discussed the Elk Fire on the Lake City border and approved an emergency facilities and land use agreement letting the Forest Service use town potable water and grey water disposal at $0.03 per gallon. On Oct. 21 it considered Resolution 2026-13 ending the local disaster emergency. Backup generators lent by Estes Park and Windsor were also thanked.
  where: Lake City and unincorporated Hinsdale County
