- title: 2027 budget, water and sewer rates, and health insurance
  summary: Council reviewed the 2027 draft budget, 2027 water and sewer rates, capital projects, and available money for donations. It appointed Town Manager Alexander Mulhall as 2027 budget officer and weighed alternate health insurance plans against keeping the current CEBT plan. It also discussed a request for proposals for the 2026 audit.
