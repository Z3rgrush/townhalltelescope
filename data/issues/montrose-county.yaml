- title: Ordinance banning non-native wildlife and wildlife resolutions
  summary: A public hearing was set for Oct. 28 on proposed Ordinance 2026-01, which would prohibit the intentional introduction or release of non-native wildlife species in unincorporated Montrose County. The board also considered resolutions opposing a citizen petition to ban lead ammunition for hunting and opposing proposed Colorado Parks and Wildlife changes on prairie dogs.
  where: Unincorporated Montrose County
