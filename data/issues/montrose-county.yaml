- title: Non-native wildlife ordinance 2026-01
  summary: The commissioners are weighing Ordinance 2026-01, which would prohibit intentionally introducing, releasing, moving or establishing habitat for non-native wildlife species in unincorporated Montrose County. A public hearing on approval or continuance was set for Oct. 28 and came up again Nov. 5. The documents do not state the outcome.
  where: Unincorporated Montrose County
