- title: Wildfire Resiliency Code agreements with fire districts
  summary: The commissioners approved intergovernmental agreements with the Montrose Fire Protection District and the Norwood Fire Protection District. Under them the districts share administration and enforcement of the county's adopted Wildfire Resiliency Code. The Norwood agreement passed on a 2-1 consent vote.
