- title: County acceptance of road maintenance and road projects
  summary: The board was set to accept county maintenance of 0.03 miles of 5465 Court off Banner Road and 0.22 miles of 6785 Lane and Uriah Court in Thornburgh Estates. It also approved a $487,333 B-24 bridge rail replacement contract and agreed to asphalt overlay work with the Town of Olathe. A $142,313 Public Works lot paving contract was on the Oct. 21 agenda, and a County Road Education session was scheduled.
