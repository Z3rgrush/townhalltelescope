- title: Gold Mountain Fire FEMA support and wildfire code agreement
  summary: The chair signed a letter asking for FEMA support after the 2026 Gold Mountain Fire, and the board ratified it on Sept. 2. The board also approved an agreement with Norwood Fire Protection District to share administration and enforcement of the county's Wildfire Resiliency Code. The consent agenda passed 2-1.
