- title: Housing needs assessment grant and private activity bonds
  summary: Planning staff discussed a grant application for a housing needs assessment tied to state law SB24-174. The commissioners also assigned $1,573,936 of the county's 2026 private activity bond allocation to the Colorado Housing and Finance Authority.
