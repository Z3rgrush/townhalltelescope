- title: Gold Mountain Fire FEMA support and Wildfire Resiliency Code
  summary: The commissioners ratified a letter asking for federal FEMA support after the 2026 Gold Mountain Fire. They also approved an agreement with Norwood Fire Protection District to share administration and enforcement of the county's Wildfire Resiliency Code.
  where: Norwood area / west Montrose County
