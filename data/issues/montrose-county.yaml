- title: Road, bridge and paving contracts
  summary: The county approved a $487,333 contract with Precision Dirt Works for B-24 bridge rail replacement. It also approved $142,313.20 for paving the Public Works parking lot and an agreement with Olathe for asphalt overlay on various streets. On-call structural inspection contracts were approved with SGM, HDR, J-U-B and Engineering Operations.
