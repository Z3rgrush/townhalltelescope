- title: County resolutions on Colorado Parks and Wildlife lead ammunition and prairie dog proposals
  summary: A hearing was set for Oct. 28 on a resolution opposing a citizen petition to prohibit lead ammunition for hunting. A second resolution opposes proposed CPW prairie dog regulation changes. Both would be sent to CPW as the county's public comment. A work session also listed proposed CPW changes.
