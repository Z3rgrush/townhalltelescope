- title: Gold Mountain Fire response and FEMA support
  summary: The county activated an Emergency Operations Center for the 2026 Gold Mountain Fire, with Road and Bridge crews supporting the response. The county leased the Wells Basin property to stage fire mitigation crews, and the Chair signed a letter asking the President for FEMA support.
  where: Montrose County
