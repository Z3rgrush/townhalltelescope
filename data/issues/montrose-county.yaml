- title: 2026 Gold Mountain Fire response and FEMA support
  summary: The county opened an Emergency Operations Center for the Gold Mountain Fire, and Road and Bridge crews supported the response. The county leased the Wells Basin property to stage fire mitigation crews, and the Chair signed a letter to President Trump asking for FEMA support.
