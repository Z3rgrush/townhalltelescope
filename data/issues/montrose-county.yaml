- title: Non-native wildlife ordinance and CPW lead ammo and prairie dog resolutions
  summary: On Oct. 28 commissioners were set to hold a public hearing on proposed Ordinance 2026-01, which would prohibit intentionally introducing or releasing non-native wildlife in unincorporated Montrose County. They also were to consider resolutions opposing a citizen petition to ban lead ammunition for hunting and opposing proposed Colorado Parks and Wildlife prairie dog rule changes, to be sent to CPW as county comment. Proposed CPW changes were also a work session topic on Oct. 26.
  where: Unincorporated Montrose County
