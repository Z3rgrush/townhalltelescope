- title: Property tax appeals and write-offs
  summary: The Board of Equalization heard personal, commercial and residential property tax appeals. It supported denial of the High Oasis LLC appeal and temporarily amended the value of one residential property. It denied a senior property tax exemption appeal. Separately, the county wrote off uncollectable property taxes through Resolution 31-2026.
