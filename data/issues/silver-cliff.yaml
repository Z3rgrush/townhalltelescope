- title: Workforce housing and IGA with Westcliffe
  summary: The Board considered a Workforce Housing intergovernmental agreement with Westcliffe in September and October, with the attorney needing an electronic copy of the draft to adjust it. A multijurisdictional housing authority briefing is set for November 3. Planning Commission also reviewed an affordable housing interior lot line request and site plans for multi-building housing.
