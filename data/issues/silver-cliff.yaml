- title: Affordable housing site plan and interior lot line request
  summary: The Planning Commission reviewed an affordable housing proposal with five buildings of 1- to 3-bedroom units and 22 parking stalls. It also took up an interior lot line request. An October agenda item covers vacating lot lines at Silver Cliff Park.
