- title: Park improvements and vacation of streets and alleys at Silver Cliff Community Park
  summary: In June the Board reviewed proposals and moved to award the park improvements project covering dirt work, curb and handicap parking at the playground, and pickleball site preparation. A GOCO grant account and park donations fund the work. The Planning Commission took up vacating lot lines at Silver Cliff Park, and the Board set a public hearing on vacating streets and alleys at the park for Dec 3, 2026.
