- title: Workforce Housing IGA with Westcliffe
  summary: The Board considered an intergovernmental agreement with Westcliffe on workforce housing at its September and October meetings. A draft was presented for approval in October, and the town attorney needed an electronic copy to adjust it. Troy Bomgardner also gave workforce housing information.
