- title: Workforce housing agreement with Westcliffe and affordable housing project
  summary: The Board considered a Workforce Housing intergovernmental agreement (IGA) with Westcliffe in September and October 2026, with a draft going back to the attorney for edits. Trustee Troy Bomgardner gave workforce housing updates, and the Planning Commission took up an affordable housing interior lot line request with site plans for five buildings. The board also acted on Resolution 06-2026 on Prop 123 in June.
