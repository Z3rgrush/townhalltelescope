- title: 'Park improvements: playground, pickleball and Silver Cliff Park lot lines'
  summary: The town sought proposals in June 2026 for park work including dirt work, concrete curb and handicap parking at the playground, and pickleball site preparation, and the board was asked to award the contract. A part-time park employee was proposed, the GOCO grant account is being tracked, and the Planning Commission will look at vacating lot lines in Silver Cliff Park in October. The board also signed a release for the old playground equipment.
