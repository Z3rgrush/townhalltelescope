- title: 'Ballot Issue 2B: ten-year extension of Kersey''s 17.205-mill property tax levy'
  summary: On Oct. 13 the Board was to consider an ordinance referring a ballot issue to voters and a resolution supporting Ballot Issue 2B, which would extend the Town's existing 17.205-mill property tax levy for ten years (2028-2037) without raising the rate. A related ordinance mentions fixing the rate at 12.000 mills.
  where: Townwide
