- title: Adoption of the 2024 International Fire Code
  summary: The Board took up an ordinance adopting the 2024 International Fire Code, first read August 11 and set for a public hearing and second reading September 8. The Platte Valley Fire District currently uses the 2018 code, and adoption would align it with the Town's 2024 building codes and address newer issues like energy storage systems. No public comment was made at the hearing.
