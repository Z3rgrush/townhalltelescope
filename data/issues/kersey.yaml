- title: Water Blueprint Plan and long-term water supply
  summary: The Board began the first of three working sessions with Brendle Group on a $50,000 Water Blueprint, funded by a $37,500 DOLA grant, $10,000 from Northern Water and a $2,500 Town match. Northern Water now requires a native water supply for new development, and buy-and-dry pressure means the Town's Colorado-Big Thompson water may not support future growth.
