- title: 6 P's Annexation at 24822 Highway 34
  summary: The Planning Commission held a public hearing on annexing a 49.5-acre property northeast of the Kuner/Five Rivers feedlot, with I-Industrial zoning and a Comprehensive Plan map change from Agriculture/Tourism to employment-oriented industrial use. Neighbors who want to buy the property raised concerns about industrial use, traffic and operations, and the possible annexation of CR 56 was discussed.
  where: 24822 Highway 34, northeast of Kuner/Five Rivers feedlot
  refs:
  - 1
  public_comment: true
- title: Water Blueprint Plan and long-term water supply
  summary: The Board began the first of three working sessions with Brendle Group on a $50,000 Water Blueprint, funded by a DOLA grant, Northern Water and the Town. It responds to buy-and-dry pressure and Northern Water's native-supply requirement for new development, which may make Colorado-Big Thompson water alone insufficient for growth. A November work session was also rescheduled to Nov. 17 with the water blueprint on the agenda.
  where: Townwide
  refs:
  - 3
  - 4
- title: Clark Street Storm Sewer Project contract
  summary: The Board awarded the construction contract to Mountain Constructors, Inc., the second-lowest of 13 bidders, after staff found concerns with the lowest bidder. The price is held for 180 days while the Town awaits FEMA funding, and the bid came in well below the engineer's estimate.
  where: Clark Street
  refs:
  - 3
- title: Renaming duplicate street names in Berryman Farms
  summary: Staff asked the Board to authorize renaming streets east of 1st Street in Berryman Farms because names duplicate or resemble streets elsewhere in town, which could slow police, fire and EMS response. Residents would need to update addresses, so staff would coordinate with them and agencies before bringing formal action back.
  where: Berryman Farms subdivision, east of 1st Street
  refs:
  - 2
