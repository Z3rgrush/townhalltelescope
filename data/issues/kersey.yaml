- title: Clark Street Storm Sewer Project contract
  summary: The Board awarded the construction contract for the Clark Street Storm Sewer Project to Mountain Constructors, Inc. after 13 bids; staff passed over the lowest bidder over reference and bid-item concerns. The bid came in well below the engineer's estimate, and the price is held for 180 days while the Town awaits FEMA funding.
  where: Clark Street
