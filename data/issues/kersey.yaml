- title: Adoption of the 2024 International Fire Code
  summary: After a public hearing with no comments, the Board considered Ordinance 2026-0010 adopting the 2024 International Fire Code. The Deputy Fire Marshal said it streamlines the Town's fire code requirements and aligns them with earlier adopted codes.
