- title: Kersey Water Blueprint Plan
  summary: The Board began the first of three working sessions with Brendle Group on long-term water supply, growth and funding. Northern Water now requires a native water supply at the tap for new development, and buy-and-dry transfers are accelerating, so Kersey's Colorado-Big Thompson water may not be enough. The $50,000 plan is paid for by a $37,500 DOLA grant, $10,000 from Northern Water and a $2,500 Town match.
