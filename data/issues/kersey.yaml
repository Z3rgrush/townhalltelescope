- title: 'Ballot Issue 2B: ten-year extension of the 17.205-mill property tax levy and 2027 budget'
  summary: The Board is considering a ballot issue to extend the Town's existing 17.205-mill property tax levy for ten years (2028-2037) without raising the rate. An ordinance referring a related ballot question about fixing the rate at 12.000 mills and a resolution of Board support were on the October 13 agenda, alongside the preliminary 2027 budget presentation and a September work session on the budget.
