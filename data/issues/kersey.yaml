- title: Clark Street storm sewer project contract
  summary: The Board awarded the Clark Street Storm Sewer contract to Mountain Constructors, Inc. after receiving 13 bids. Staff recommended the second-lowest bidder because of concerns about the lowest bidder. The bid came in well below the engineer's estimate, and the price is held for 180 days while the Town waits on FEMA funding. Other project costs will be incurred separately.
  where: Clark Street
