- title: Clark Street Storm Sewer Project contract
  summary: The Board awarded the Clark Street Storm Sewer construction contract to Mountain Constructors, Inc., the second-lowest of 13 bidders, after staff raised concerns about the lowest bidder. The bid came in well below the engineer's estimate, and the company agreed to hold its pricing for 180 days while the Town awaits FEMA funding. Other project costs will be incurred separately.
  where: Clark Street
  refs:
  - 2
  topics:
  - Utilities
  - Roads & traffic
- title: Adopting the 2024 International Fire Code
  summary: Ordinance 2026-0010 adopts the 2024 International Fire Code, moving the Platte Valley Fire Protection District from the 2018 code and aligning it with the Town's already adopted 2024 building codes. It had first reading August 11 and a public hearing September 8, where no public comment was recorded. The new code addresses issues like energy storage systems.
