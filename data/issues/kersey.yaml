- title: Adoption of the 2024 International Fire Code
  summary: The Board introduced Ordinance 2026-0010 on August 11 and held the public hearing and second reading on September 8. It adopts the 2024 International Fire Code to match the Town's other 2024 codes. Platte Valley Fire District currently uses the 2018 code, and the new code addresses energy storage systems among other items. No public comment was given at the hearing.
