- title: Property tax ballot issues and 2027 budget
  summary: The Board reviewed a preliminary 2027 budget and took up ballot measures on property tax. One ordinance would refer a measure fixing the rate at 12.000 mills. Ballot Issue 2B would extend the existing 17.205-mill levy for ten years (2028-2037) without raising the rate, and a resolution states the Board's support.
