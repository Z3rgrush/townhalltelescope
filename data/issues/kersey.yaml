- title: 'Property tax ballot issue 2B: ten-year extension of 17.205-mill levy'
  summary: The October 13 agenda includes an ordinance referring a ballot issue to voters and a resolution supporting Ballot Issue 2B, which would extend the Town's existing 17.205-mill property tax levy for ten years (2028 through 2037) without raising the rate. A related ordinance (2026-0012) refers a measure fixing the rate at 12.000 mills. The documents don't state outcomes.
