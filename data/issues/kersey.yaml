- title: Renaming duplicate streets in Berryman Farms
  summary: Staff asked the Board to authorize renaming streets east of 1st Street in the Berryman Farms subdivision because their names duplicate or resemble streets elsewhere, which could confuse emergency responders. Residents and property owners would need to update addresses, and staff would coordinate with Weld County and dispatch.
  where: Berryman Farms subdivision, east of 1st Street
