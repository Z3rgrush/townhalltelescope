- title: Renaming duplicate street names in Berryman Farms
  summary: Staff asked the Board to authorize renaming streets east of 1st Street in the Berryman Farms subdivision because their names duplicate or resemble other Kersey streets, which could confuse police, fire and EMS dispatch. Staff would coordinate with residents, Weld County and emergency agencies and bring formal action back to the Board. Residents would need to update their addresses.
  where: Berryman Farms subdivision, east of 1st Street
