- title: Water Blueprint Plan and long-term water supply
  summary: The Board began the first of three working sessions with Brendle Group on a $50,000 Water Blueprint. Kersey isn't facing an immediate water emergency, but buy-and-dry pressure and Northern Water's native-supply requirement for new development may make its Colorado-Big Thompson water insufficient for growth. The plan is funded by a $37,500 DOLA grant, $10,000 from Northern Water and a $2,500 town match. A November work session is expected to cover it again.
