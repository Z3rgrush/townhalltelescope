- title: Sign removal and code enforcement complaint
  summary: Resident Bill Cannon told the Board that signs had long been allowed in a location despite a Town ordinance. He called their removal discriminatory and questioned how consistently the ordinance is enforced. The October 13 agenda also covered a code compliance approach centered on voluntary compliance.
