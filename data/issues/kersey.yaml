- title: 6 P's annexation, industrial zoning and land-use map change at 24822 Highway 34
  summary: The Planning and Zoning Commission held a public hearing on a request to annex a 49.5-acre property northeast of the Kuner/Five Rivers feedlot. It would be zoned I-Industrial, and the Comprehensive Plan map changed from Agriculture/Tourism to an employment-oriented designation for an oil/gas and agricultural support business. Neighbors who want to buy the property said industrial use is inappropriate and raised traffic concerns, and the Town may also annex adjacent County Road 56.
  where: 24822 Highway 34, northeast of Kuner/Five Rivers feedlot
