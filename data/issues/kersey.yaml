- title: 6 P's annexation, industrial zoning and land-use map change on Highway 34
  summary: The Planning and Zoning Commission held a public hearing on annexing a 49.5-acre property at 24822 Highway 34, zoning it I-Industrial, and changing the Comprehensive Plan map from Agriculture/Tourism to an employment-oriented industrial designation. Neighbors who want to buy the property object to industrial use, and others raised traffic concerns. Annexing County Road 56 next to the site is also in play.
  where: 24822 Highway 34, northeast of Kuner/Five Rivers feedlot
