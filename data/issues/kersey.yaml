- title: Clark Street Storm Sewer Project contract
  summary: The Town got 13 bids and awarded the construction contract to Mountain Constructors, Inc., the second-lowest bidder, after staff raised concerns about the lowest bidder's references and bid items. The bid came in well below the engineer's estimate and is held for 180 days while the Town waits on FEMA funding.
  where: Clark Street, Kersey
