- title: 'Ballot Issue 2B: ten-year extension of the 17.205-mill property tax levy'
  summary: The Board referred Ballot Issue 2B to voters, a ten-year extension (2028 through 2037) of the Town's existing 17.205-mill property tax levy without raising the rate, and passed a resolution of support. A related ordinance (2026-0012) would fix the rate at 12.000 mills. A resident disputed how the Clerk handled a public comment submitted in opposition to 2B.
  where: Townwide
