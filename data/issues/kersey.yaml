- title: Renaming duplicate streets in Berryman Farms
  summary: Several streets east of 1st Street in Berryman Farms share names with other streets, which could slow police, fire and EMS response. Staff asked the Board for authority to start renaming them, working with residents, Weld County and emergency agencies.
  where: Berryman Farms subdivision, east of 1st Street
