- title: Kersey Water Blueprint Plan
  summary: The Town started a $50,000 Water Blueprint planning effort with the Brendle Group to protect long-term water supply amid regional buy-and-dry pressure. Northern Water now requires native supply for new development, so Kersey's Colorado-Big Thompson water alone may not support growth. The project is funded by a $37,500 DOLA grant, $10,000 from Northern Water and a $2,500 Town match; the first of three working sessions was September 22.
  where: Townwide
