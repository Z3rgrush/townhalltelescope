- title: Renaming duplicate streets in Berryman Farms
  summary: Staff asked the Board to authorize renaming streets in Berryman Farms east of 1st Street because their names duplicate or resemble other Kersey streets. The concern is confusion for police, fire and EMS dispatch. Residents would need to update addresses, and staff would coordinate with residents, Weld County and emergency agencies.
  where: Berryman Farms subdivision, east of 1st Street
