- title: Colorado Wildfire Resiliency Code adoption (Ordinance 2026-05)
  summary: The town introduced Ordinance 2026-05 on March 31 to adopt the state-mandated Colorado Wildfire Resiliency Code, which takes effect July 1, 2026. A public hearing was held April 23, the board approved it May 5 with a correction, and on Aug. 4 it approved changes replacing WUI references with the Colorado Wildfire Resiliency Code. A resident questioned the penalties.
