- title: Colorado Wildfire Resiliency Code ordinance (Ordinance 2026-05)
  summary: The town introduced Ordinance 2026-05 to adopt the state-mandated Wildfire Resiliency Code, which must be in effect by July 1, 2026. A public hearing was held April 23, the board approved it May 5 with a correction, and in August it approved changing WUI references to the Colorado Wildfire Resiliency Code. A resident questioned the penalties.
