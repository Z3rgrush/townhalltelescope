- title: Colorado Wildfire Resiliency Code adoption (Ordinance 2026-05)
  summary: The town introduced Ordinance 2026-05 on March 31 to meet a state mandate effective July 1, 2026, held a public hearing April 23, and approved it May 5 with a correction. In August the board approved changes replacing WUI references with the Colorado Wildfire Resiliency Code. A resident objected to the penalties.
