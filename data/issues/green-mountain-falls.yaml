- title: Selling town land, open space rezoning and enclave annexation
  summary: The board has considered selling town properties, and in 2026 weighed rezoning town open space to park, which could make sales harder. The attorney presented a memo on annexing enclaves and the board sent it to the Planning Commission, with an update to the 1997 annexation plan on later agendas. A resident urged rezoning or an ordinance to protect open space.
