- title: Sales tax increase ballot question for capital projects
  summary: Staff presented a "Closing the Gap" plan for a sales tax increase to fund sidewalks, culverts, sewage, and pool and park updates. On April 7 the mayor moved to put a 0.05% sales tax increase for four years on the ballot for the Capital Improvement Fund, and ballot and TABOR resolutions followed in May. The board called the general election in August.
