- title: Sales tax increase ballot question for capital projects
  summary: Staff presented a 'Closing the Gap' plan for sidewalks, culverts, sewage, and pool, park and playground updates. On April 7 the mayor moved to put a 0.05% sales tax for four years on the ballot for the Capital Improvement Fund, with the old Marshal's building as a priority. Ballot and TABOR resolutions followed in May, and the general election was called in August.
