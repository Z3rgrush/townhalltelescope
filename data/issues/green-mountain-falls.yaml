- title: Sale of town land, open space rezoning and annexation of enclaves
  summary: The board has discussed selling town properties, whether rezoning town open space to park would make sales harder, and annexing enclaves. In June it sent annexation of an enclave property back to the Planning Commission and put the open space-to-park rezoning on July's agenda. The 1997 annexation/3-mile plan is being updated. A resident urged an ordinance or rezoning to protect open space.
