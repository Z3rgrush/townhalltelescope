- title: 2026 sales tax increase ballot question and capital projects
  summary: Town Manager Patterson presented a 'Closing the Gap' plan for a sales tax increase to fund sidewalks, culverts, sewage, and pool, park and playground updates. On April 7 the mayor moved to place a 0.05% sales tax for four years on the ballot for the Capital Improvement Fund, with the old Marshal's building a priority. Ballot resolutions followed in May, and a general election call in August.
