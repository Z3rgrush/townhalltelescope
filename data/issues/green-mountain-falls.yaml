- title: 2026 budget, fees, mill levy and 2027 draft budget
  summary: In December 2025 the town adopted the 2026 budget, fee schedule and mill levy certification. A March budget amendment raised Marshal's office wages and a 2026 fee schedule resolution was approved in May. Work sessions for the 2027 draft budget were being set up, with a draft on the October 8 agenda.
