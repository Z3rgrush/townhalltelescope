- title: 'Town-owned open space: land sales, rezoning to park, and enclave annexation'
  summary: The board has debated selling town land, including an appraisal for the El Paso trail property. A resident urged rezoning open space to park, or an ordinance giving sales the same legal requirements as parkland. In June the board sent annexation of enclaves to the Planning Commission and notified owners. Enclave annexation (Resolution 2026-15) and updating the 1997 annexation plan are on fall agendas.
