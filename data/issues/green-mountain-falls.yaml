- title: Downtown parking, paving and drainage
  summary: The town planned a roughly $96,000 paving contract focused on parking near the Blue Moose and Lake Street, and a Maple Street parking survey. By June the new paving was complete, giving 78 downtown parking spots. Trailhead parking and 2026 drainage improvements also came up.
