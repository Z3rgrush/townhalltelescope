- title: Flock license plate reader cameras
  summary: Residents repeatedly urged Council to end the Town's Flock Safety license plate reader contract, citing privacy concerns and petitions of 1,544 to 1,900 signatures. The Town Manager said the agreement had not been renewed and was under review, a discussion was set for October 6, and by October 27 Council voted to retain the cameras while asking Public Works to remove them if Flock's removal was delayed.
