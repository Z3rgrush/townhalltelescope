- title: 'Community housing: fast track scheduling policy and deed restrictions'
  summary: Council considered Resolution 26-07 adopting a fast track priority scheduling policy for community housing projects. A resident supported the deed restriction requirement, and another asked for more neighborhood input on a recent community housing project. The Town Manager said public hearings would offer further comment opportunities.
