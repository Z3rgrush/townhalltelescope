- title: Avon Whitewater Park and Bob the Bridge area improvements
  summary: Residents asked Council to improve the Bob the Bridge area and the Avon Whitewater Park, including adding a standing river wave. Other speakers raised low-water conditions limiting river access and an approved but unfunded skate park.
