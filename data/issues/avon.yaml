- title: Flock license plate reader cameras and petition to end the contract
  summary: Residents repeatedly urged Council to end the Town's contract with Flock Safety's automated license plate reader cameras, citing privacy concerns and a petition that grew from 1,544 to over 1,900 signatures. Town Manager Eric Heil said the agreement has not been renewed and is under review, including contract terms and data security. Council discussion is scheduled for October 6, 2026.
