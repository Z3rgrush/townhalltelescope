- title: Pedestrian crosswalk safety at Avon Road and Highway 6
  summary: A resident asked for flashing pedestrian beacons on both sides of Avon Road near Highway 6, after a near-miss involving his father in the crosswalk. He noted beacons exist on Highway 6 near Avon Road. Earlier, another resident said the Town had quickly made requested crosswalk improvements.
