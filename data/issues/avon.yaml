- title: 2027 budget review
  summary: Council held a work session on the 2027 budget for all funds, with a balanced General Fund and about $64.1 million in projected revenues. Topics included reserves, capital projects, recreation fees, staffing, wildfire mitigation, composting and housing, and Council gave direction to staff.
