- title: Avon Whitewater Park and Bob the Bridge improvements
  summary: Residents asked Council to consider improving the Bob the Bridge area and redeveloping the Avon Whitewater Park, including a standing river wave. Speakers also asked for better river access amid low water this year and for skate park funding.
