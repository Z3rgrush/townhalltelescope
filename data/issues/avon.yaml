- title: Flock license plate reader cameras
  summary: Residents repeatedly urged Council to end the Town's Flock Safety automated license plate reader program, citing privacy concerns and petitions with 1,544 to over 1,900 signatures. Town Manager Eric Heil said the Town has not renewed its Flock agreement and is reviewing contract terms and data security. Council is scheduled to discuss the program on October 6, 2026.
