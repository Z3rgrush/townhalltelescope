- title: Building code and Wildfire Resiliency Code adoption
  summary: The Town adopted Ordinance 329 adopting the 2024 International Building Code in April. The Board has been reviewing the Colorado Wildfire Resiliency Code and plans to adopt it in September, but the fire district must first review specific pages. An October update is on the agenda.
