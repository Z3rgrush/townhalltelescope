- title: Clayton Homes development and Blue Spruce Development
  summary: Clayton Homes wants to move forward with 18 homes. The board said it needs to discuss plant investments, tap fees and future large developments. Permits for lots 2 and 3 of the RLD subdivision were processed in August, and a variance request for 1467 4th Street was on the September agenda. Blue Spruce Development on 4th Street has a development agreement under attorney review, and the developer must provide water shares.
