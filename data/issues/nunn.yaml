- title: North Weld Water Services Agreement and Master Water Plan
  summary: The Town attorney has been reviewing and amending the water services agreement with North Weld County Water District, with a final version to go to the Board before approval. The Town also awarded a Master Water Plan grant, chose an engineer bid in August 2026, and is working on a grant to find water loss.
