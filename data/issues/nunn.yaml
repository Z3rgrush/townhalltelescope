- title: Water taps, excess water use ordinance and 2027 water rates
  summary: In fall 2026 the Board took up water tap approvals with water share and tap fees, an excessive water use ordinance for properties over their water unit, and 2027 water rates and fees. Water loss and added meters were earlier concerns, as were hydrant locks and a bulk fill station.
