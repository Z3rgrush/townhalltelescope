- title: Safer Streets grant, speed study and Master Drainage Plan
  summary: The Town chose an engineering firm for the Safer Streets grant, ran a speed study, and gathered resident input through an interactive map and outreach events. The Safer Streets plan and Master Drainage Plan are to be posted online for 30 days for public comment. Weld County road help on CR 31 is also under discussion.
