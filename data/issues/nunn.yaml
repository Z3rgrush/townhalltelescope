- title: CDBG Senior Center and Community Center grant and Town Hall improvements
  summary: The town submitted a CDBG grant for the Senior Center and later learned it was approved, with a total of $206,739.34. The money covers asbestos abatement (bids ran from $56,000 to $161,000), a $17,500 engineering contract, interior painting and a trophy case. The board voted on allocation to finish the project and on a project manager.
