- title: Master Water Plan grant and water committee work
  summary: Council evaluated a bid recommendation for the engineer on the Master Water Plan grant. In October it planned to discuss water committee updates, an excess water usage ordinance and water tap considerations, and to vote on a tap approval with water share and tap fee. It also planned to vote on Kendra Minch as water committee chair.
