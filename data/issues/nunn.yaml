- title: Clayton Homes development and 1467 4th Street variance
  summary: Clayton Homes wants to build 18 homes. The Board said it needs to discuss plant investments, tap fees and future large developments. Permits for lots 2 and 3 of the RLD subdivision were processed in August. A September public hearing covered a variance at 1467 4th Street, where a lot line adjustment would give 13 feet to 1457 4th Street, whose home was placed too close to the line.
