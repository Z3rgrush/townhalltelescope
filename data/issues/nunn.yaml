- title: CDBG Senior Center/Community Center grant and Town Hall improvements
  summary: The Town got a CDBG grant of $206,739.34 for the senior and community center, and asbestos abatement bids ranged from $56,000 to $161,000. The Board voted on how to complete the work, including interior painting and a trophy case, and on a project manager.
