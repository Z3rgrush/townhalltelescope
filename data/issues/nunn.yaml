- title: Sunrise Solar Project permit at CR 29.5
  summary: The Board reviewed a permit application for a 20-acre solar project at 49600 CR 29.5, with a 10-foot fence with aluminum slats. The Town wants written commitments on dust mitigation, truck routes during construction, an eco plan and contingencies. A 50% plan is expected in mid-August.
