- title: Safer Streets grant and speed study
  summary: The town hired an engineering firm for its Safer Streets grant and comprehensive plan. It collected resident input through an interactive map with a gift card giveaway, plus senior, first responder and youth outreach. The draft safety plan is to be posted online for 30 days for public comment.
