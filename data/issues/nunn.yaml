- title: North Weld Water Services Agreement and water system planning
  summary: The Town attorney has been reviewing and amending a water services agreement with North Weld County Water, with several areas still needing clarification as of April. Water loss remains a problem, the Board is looking at more meters, and it picked a bid for a Master Water Plan in August. In October the Board is to discuss a water committee, an excess water usage ordinance and tap approvals.
