- title: 2024 building code and Wildfire Resiliency Code
  summary: The board adopted Ordinance 329 adopting the 2024 International Building Code at a public hearing in April, with no public comment. The Colorado Wildfire Resiliency Code was split into a separate ordinance and is slated for adoption, with updates in October.
