- title: Clayton Homes and Blue Spruce developments, 4th Street lot line variance
  summary: Clayton Homes wants to build 18 homes. The Board has discussed plant investments and tap fees for large developments, approved permits for lots 2 and 3 of the RLD subdivision, and held a September 2026 hearing on a variance at 1467 4th Street after a house at 1457 4th Street was placed too close to the lot line. A development agreement with Blue Spruce Development on 4th Street is under review, and they must provide water shares.
