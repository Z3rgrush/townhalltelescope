- title: 2027 budget, mill levy and police funding
  summary: The 2026 mill levy and budget were adopted in December 2025. The 2027 budget draft was reviewed in October 2026. The police department sought less-lethal pepper ball guns at $969 each, tasers, vehicle upgrades or lease, and a Byrne JAG grant with a match of up to $5,000.
