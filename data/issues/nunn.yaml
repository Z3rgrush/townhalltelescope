- title: Sunrise Solar Project at CR 29.5
  summary: The board reviewed a permit application for a 20-acre solar project at 49600 CR 29.5. It has a 10-foot fence with aluminum slats, and the town wants written plans for dust mitigation, a truck route and contingencies. A 50% plan is expected in mid-August.
