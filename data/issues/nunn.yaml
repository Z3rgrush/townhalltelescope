- title: CDBG grants for Senior Center and Community Center/Town Hall improvements
  summary: The Town pursued a CDBG grant for the Senior Center, with asbestos abatement bids ranging from $56,000 to $161,000 against $56,000 budgeted in the grant. In June the Board reviewed the $206,739 approved grant total, which includes a $17,500 engineering contract and contractor bids for painting and a trophy case. A project manager for the grant was approved in August, and a second CDBG project manager vote is on the October 15 agenda.
