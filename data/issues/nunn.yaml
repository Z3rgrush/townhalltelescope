- title: North Weld Water Services Agreement and town water loss
  summary: The town attorney has been reviewing and amending a water services agreement with North Weld County Water, with several areas still needing clarification as of April. Water loss remains a problem, so the town is looking at more meters and a grant to help find leaks. By October the board was discussing a water committee, an excess water usage ordinance and tap approvals.
