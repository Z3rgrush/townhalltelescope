- title: Sunrise Solar project at CR 29.5
  summary: The Board reviewed a permit application for a 20-acre solar project at 49600 CR 29.5, with a 10-foot fence. It asked for written plans on dust mitigation, construction truck routes and an eco plan, and expects 50% plans in mid-August. Chalk Bluffs Energy Project also presented in January 2026.
