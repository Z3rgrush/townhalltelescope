- title: Clayton Home permits and variance at 1467 4th Street
  summary: Council reviewed Clayton Home building permits for lots 2 and 3 of the RLD subdivision in August and voted to allow permit processing on both lots. A Clayton Homes variance request for 1467 4th Street, tied to a proposed lot line adjustment, was set for review on Sept. 17.
