- title: Water and sewer plant investment (tap) fee increases
  summary: Council approved a resolution revising the water and sewer infrastructure investment fee schedule effective Dec. 1, 2026, after staff surveyed regional tap fees. Fees are tied to upgrades at the water and wastewater treatment plants, and METRO Water Recovery is raising its own tap fee to $6,290. 2027 plant investment fee changes were also on the Sept. 8 agenda.
