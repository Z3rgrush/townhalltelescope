- title: Comprehensive Plan update, Housing Action Plan and Strategic Growth Element
  summary: The city is updating its Comprehensive Plan with consultant Ayres Associates, including a new Water Supply Element added by contract amendment on Sept 1. In late October the Planning Commission and Council reviewed the draft Housing Action Plan, Strategic Growth Element and proposed Future Land Use Categories. The city also backed a DOLA Local Planning Capacity Grant application.
