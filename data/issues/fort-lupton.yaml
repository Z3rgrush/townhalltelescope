- title: Western Midstream buried gas gathering pipeline special use permit
  summary: The Planning Commission considered a Western Midstream request for a special use permit for a buried gas gathering pipeline crossing I-2 industrial and agricultural parcels. Nearby property owners, including Joseph and Sue Hubert and Leeroy Sack, asked about pipe size, property access and impacts; Western Midstream said it would be the responsible party.
