  summary: Council awarded design work for 5th Street and Broadway Avenue to JVA (up to $143,095), for Homestead Drive and Columbine Avenue to IMEG, and the 3rd and 5th Street project to HKS. A JVA amendment of up to $16,585 followed in October. The work is paid from CR 12 UPRR project funds.
