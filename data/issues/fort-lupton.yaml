- title: Comprehensive Plan update, Housing Action Plan and Strategic Growth Element
  summary: The city is updating its Comprehensive Plan with consultant Ayres Associates, whose scope was amended to add a water supply element. The Planning Commission (Oct. 22) and City Council (Oct. 27) reviewed the draft Housing Action Plan, Strategic Growth Element and proposed future land use categories. The city also backed a DOLA Local Planning Capacity Grant application.
