- title: Temporary pause on data center applications (5 MW or more)
  summary: On the Oct. 20 agenda, Council considered an ordinance (AM 2026-158) temporarily suspending submission, acceptance, processing and approval of applications to establish or expand data center facilities with a demand of 5 megawatts or more. The documents do not state the outcome.
