  - 19
  public_comment: true
- title: Water and sewer plant investment (tap) fee changes
  summary: Council approved a revised Water and Sewer Infrastructure Investment Fee Schedule effective December 1, 2026. Staff surveyed regional tap fees, noted METRO Water Recovery is raising its fee to $6,290, and cited ongoing upgrades to the water and wastewater treatment plants and distribution system. Further 2027 fee changes were on the Sept. 8 agenda.
  where: Citywide
