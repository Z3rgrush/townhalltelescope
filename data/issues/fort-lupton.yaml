- title: Western Midstream buried gas pipeline special use permit
  summary: The Planning Commission heard Western Midstream's request for a special use permit for buried gas gathering pipelines through I-2 industrial parcels near the Basalite plant, mining and agricultural land. Nearby property owners, including residents of S Denver Ave and County Road 10, asked about pipe size, property access and effects. The commission's recommendation goes to City Council.
