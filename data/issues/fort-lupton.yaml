- title: Western Midstream Parsnip Pipeline special use permit
  summary: Western Midstream is seeking a special use permit for two buried gas gathering pipelines through I-2 industrial, mining and agricultural parcels in the city. At the Planning Commission hearing, neighbors including Joseph and Sue Hubert and Leeroy Sack of County Road 10 asked about pipe size and whether their land would be accessed. The permit went to City Council for a public hearing.
  where: Pipeline route through I-2 parcels near County Road 10 and S. Denver Ave.
  refs:
