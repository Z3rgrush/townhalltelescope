- title: Water and sewer plant investment fee changes and water system projects
  summary: Council approved a resolution revising the water and sewer infrastructure investment (tap) fee schedule effective December 1, 2026, after staff surveyed regional tap fees; METRO Water Recovery is raising its fee to $6,290 per single family home. Council also took up 2027 plant investment fee changes, the 2027 Colorado-Big Thompson assessment (up to $191,000.70), and ongoing water tower construction with a Murray Farms easement and change orders.
