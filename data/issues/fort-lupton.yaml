- title: Water and sewer plant investment (tap) fee changes
  summary: Council approved a resolution revising the water and sewer infrastructure investment fee schedule effective Dec. 1, 2026, after staff surveyed regional tap fees. METRO Water Recovery is raising its tap fee to $6,290, up $220 per single-family home, and the city has several water and wastewater plant upgrades underway.
