- title: Temporary moratorium on data center applications (5 MW or more)
  summary: On Oct. 20 the City Council took up an ordinance (AM 2026-158) imposing a temporary suspension on submitting, accepting, processing and approving applications to establish or expand data center facilities with a demand of 5 megawatts or more. The documents do not state the final vote.
