- title: Data center moratorium and land use rules
  summary: After trustees asked on Aug. 25 for a possible moratorium, the Board adopted Ordinance 1391 on Sept. 22, an emergency measure temporarily suspending applications for large data centers. Discussion focused on the size threshold for a large data center. A Sept. 29 work session looked at a technical criteria guide and code amendments covering noise, heat and water, and staff plan to budget for a noise consultant in 2027. A study session summary was on the Oct. 27 agenda.
