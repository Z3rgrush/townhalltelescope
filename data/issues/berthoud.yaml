- title: Berthoud Arboretum design reductions
  summary: Trustees discussed reductions to the Arboretum park project, asking about lighting, utilities, trees, trails, sponsorship and grants. The Berthoud Historical Society spoke in support of the project. Staff were authorized to finalize a revised construction contract, and an Arboretum Design Reduction Contract came back on Aug 25.
