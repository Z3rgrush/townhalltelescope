- title: Data center moratorium and land use rules
  summary: After trustees asked on Aug 25 for a discussion of a data center moratorium, the Board on Sept 22 approved Emergency Ordinance 1391 temporarily suspending acceptance, processing and approval of large data center applications. Discussion focused on the size threshold for a "large" facility. A Sept 29 work session was set to develop a technical memo and possible code amendments covering noise, heat and water, with noise consulting budgeted for 2027.
