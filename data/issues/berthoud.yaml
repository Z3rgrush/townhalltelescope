- title: Data center moratorium and land use rules
  summary: On Aug. 25 trustees asked for an agenda item on a possible moratorium on data center applications. On Sept. 22 they approved Emergency Ordinance 1391 temporarily suspending acceptance, processing and approval of large data center applications, with discussion of what size counts as large. A Sept. 29 work session began a Technical Criteria Guide and possible code amendments covering noise, heat and water, and a study session summary was set for Oct. 27.
