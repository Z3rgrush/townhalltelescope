- title: Wildfire Resiliency Code and wildland-urban interface
  summary: The Board adopted Ordinance 1389 on Oct. 13, adopting the 2025 Colorado Wildfire Resiliency Code and defining the wildland-urban interface boundary after the hearing was continued from September. A cooperative agreement with the Berthoud Fire Protection District covers code administration.
