- title: Legacy Park development agreement and final plat
  summary: The Board held a public hearing on Sept. 8 on revised vesting and improvement-guarantee language in the Legacy Park Development Agreement. Planning Commission considered the Final Plat on Sept. 10 and a motion to approve was made. HPAC was told the silos on the site will come down because of asbestos.
