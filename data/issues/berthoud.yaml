- title: Legacy Park final plat, development agreement and water dedication
  summary: The Planning Commission approved the Legacy Park Final Plat on Sept 10, and the Board held a hearing on Sept 8 on the development agreement and revised vesting, including phasing and improvement guarantees. A water dedication agreement with Legacy Park Inc. was on the Oct 13 agenda. The silos on the site will be removed because of asbestos.
