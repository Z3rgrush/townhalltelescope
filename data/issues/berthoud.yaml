- title: Chapter 30 land use code rewrite
  summary: Staff proposed amendments to Chapter 30 of the municipal code covering impact fees, annexation, zoning, flood mitigation and other sections. Planning Commission was to consider a repeal and replacement Oct. 22, with trustees hearing it Nov. 10. Also on the agenda was a discussion of Ordinance 1355 and a possible expansion of affordable housing.
