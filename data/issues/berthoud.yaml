- title: Wildfire Resiliency Code and wildland-urban interface
  summary: The Town Board continued a hearing in September and on Oct. 13 approved Ordinance 1389 adopting the 2025 Colorado Wildfire Resiliency Code, with a mapped wildland-urban interface boundary. A cooperative agreement with the Berthoud Fire Protection District for code administration was also considered.
