- title: Mountain Vista Park cost reduction and bond financing
  summary: The Board reviewed cost reductions and financing for Mountain Vista Park on July 28, and a resident spoke in favor of a bond to finance it on Aug 11. A park design change order was on the Sept 8 consent agenda, and the Board has been drafting ballot language for the Nov 3, 2026 election, with concern that it clearly say taxes would not increase.
