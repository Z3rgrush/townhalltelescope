  summary: The Board adopted Ordinance 1388 on Aug 11, consolidating rules for town boards and commissions into new Municipal Code Section 4.9. Trustee Murphy's amendment requires each board to review it in October and update its bylaws. Advisory committees have since been discussing it and recruiting members.
