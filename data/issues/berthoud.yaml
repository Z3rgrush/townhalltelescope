- title: Wildfire Resiliency Code and wildland-urban interface
  summary: After a continuance in September, the Board held a hearing and approved Ordinance 1389 adopting the 2025 Colorado Wildfire Resiliency Code. A cooperative agreement with the Berthoud Fire Protection District for administering the code was also considered. Trustees asked for a map of the wildland-urban interface boundary.
