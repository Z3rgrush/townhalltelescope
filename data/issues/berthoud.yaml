- title: Boards and commissions ordinance 1388
  summary: The Board adopted Ordinance 1388 consolidating rules for town boards and commissions into a new Section 4.9, with term limits and appointment procedures. Trustees added a requirement that each board review it in October and update bylaws. Committees such as Tree, Parks and Historic Preservation discussed the change and recruitment.
