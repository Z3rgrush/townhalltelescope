- title: Rewrite of Chapter 30 land use code
  summary: Staff proposed repealing and replacing Chapter 30 of the municipal code, covering impact fees, annexation, zoning, overlay districts, short-term rentals, oil and gas and more. It went to a Board work session Oct. 20, Planning Commission Oct. 22, and Board hearings Nov. 10 on Ordinances 1394 and 1395.
