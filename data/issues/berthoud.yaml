- title: Data center moratorium and land use rules
  summary: After trustees asked in August for a possible moratorium, the Board took up Emergency Ordinance 1391 on Sept. 22 to temporarily suspend applications for large data centers. Discussion focused on what size counts as large. Staff then held a Sept. 29 work session on land use concerns, which could lead to a Technical Memo and code amendments, with possible noise-consultant funding in 2027. A summary and next steps were set for Oct. 27.
