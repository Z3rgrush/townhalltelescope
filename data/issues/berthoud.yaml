- title: Legacy Park final plat and development agreement
  summary: Planning Commission held a hearing Sept. 10 on the Legacy Park final plat south of Mountain Avenue, and approved it. The Town Board held a hearing Sept. 8 on revised vesting and improvement guarantees in the development agreement. The silos on the site will be removed because of asbestos.
