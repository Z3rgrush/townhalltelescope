- title: Legacy Park final plat and development agreement
  summary: The Planning Commission held a hearing on the Legacy Park final plat (south of Mountain Ave, east of Meadowlark Dr, west of S. Berthoud Pkwy) and moved to approve it. The Town Board held a hearing on Sept. 8 on the development agreement with revised vesting and phase-by-phase improvement guarantees. The silos on the site are to be removed because of asbestos.
