- title: November 3 ballot measure and bond financing
  summary: The Board approved intergovernmental agreements with Larimer County for the Nov. 3, 2026 coordinated election and reviewed ballot language in Ordinance 1390. Trustees worried the language did not clearly say taxes would not increase, and bond counsel suggested adding wording to that effect. A resident spoke in favor of a bond to finance Mountain Vista Park.
