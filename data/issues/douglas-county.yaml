- title: Ballot measure to expand the Board of County Commissioners from 3 to 5
  summary: The commissioners fixed a ballot title for expanding the board from 3 to 5 members and debated a resolution referring the measure to voters. On Aug. 31 about two dozen residents spoke, and an amended referral resolution (R-026-062) was moved. A ballot title protest administrative hearing was set for Sept. 3 and 4.
