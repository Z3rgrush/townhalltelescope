- title: Ballot measure to expand the Board of County Commissioners from 3 to 5
  summary: In late August the commissioners fixed the ballot title for a measure expanding the BOCC from 3 to 5 members and approved an amended resolution referring it to voters on Aug 31 after a continuance. A ballot title protest administrative hearing was scheduled for Sept 3 and 4. Dozens of residents spoke on Aug 31.
