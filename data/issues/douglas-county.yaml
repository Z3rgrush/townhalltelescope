- title: Road and bridge projects
  summary: The county approved several road contracts. These include Woodmoor drainage and road repair ($106,463), the Dakan Road bridge replacement, a University Blvd and Post Office traffic signal, Waterton Road improvements ($2.15 million) and a transportation safety action plan. It is also pursuing $2.875 million in district funding for the County Line Road and Inverness Parkway intersection.
