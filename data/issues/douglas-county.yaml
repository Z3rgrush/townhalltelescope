- title: Flexential business personal property tax incentive agreement
  summary: The board took up a business personal property tax incentive agreement between Douglas County and Flexential Corp (project ED2025-002). The item was pulled from the consent agenda, five residents spoke, and Vice Chair Van Winkle moved approval on Aug. 11. Flexential is a data center operator, but the documents don't describe the facility.
