- title: Ballot measure to expand the Board of County Commissioners from 3 to 5
  summary: The commissioners wrote and refereed a ballot measure on expanding the board from three to five members, fixing the ballot title on Aug 28 and approving an amended referral resolution (R-026-062) on Aug 31 after dozens of residents spoke. A ballot title protest administrative hearing was scheduled for Sept 3 and 4.
