- title: Regional parks, open space and Rueter-Hess
  summary: The county approved a Mark Weston Open Space Memorial renaming with up to $30k in open space funds. It also backed a GOCO grant for Wildcat Regional Park and approved a Macanta Regional Park pedestrian bridge contract. The Rueter-Hess Advisory Board discussed budget updates and Incline Trailhead improvements.
