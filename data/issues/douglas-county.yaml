- title: Private activity bonds for Ponderosa Pines
  summary: A $50 million private activity bond authorization for Ponderosa Pines was continued in August. A $37 million bond authorizing resolution (R-026-070) was approved on Sept. 22 on the consent agenda; the documents don't confirm it is the same project.
