- title: Homelessness and older adult grants and human services funding
  summary: The county applied for a $125,000 Homelessness Resolution Program grant, gave Older Adult Initiative grant checks, and amended TANF and Colorado Works contracts ($2.4 million). The Homeless Initiative and Board of Health also met, with a 2027 health department budget on the Board of Health agenda.
