- title: Road projects and transportation planning
  summary: The county approved easements and contracts for the Highlands Ranch Parkway reconstruction, Pine Drive and Pine Lane improvements, and the Dakan Road bridge replacement. It also funded a University Blvd and Post Office traffic signal, a Waterton Road design contract of $2.15 million, and a $279,320 Transportation Safety Action Plan. The commissioners vacated Pine View Circle on Aug 25.
