- title: Eudora TIF district for a 133-acre business park
  summary: Eudora's city manager briefed the county on a proposed tax increment financing district for Main Street Development Group's 133-acre mixed commercial and industrial project at K-10 and E 2300 Road, with about $31 million in infrastructure costs. Commissioners asked about industrial outdoor storage and why the developer wants 100% TIF.
  where: K-10 & E 2300 Rd, Eudora
  refs: [0]
- title: Property taxes and the county's cash reserves
  summary: Residents urged the commission to give back some of its reserves, citing reports that the county ended 2025 with uncommitted cash equal to 52% of spending against a 25% guideline, and seniors described rising property taxes. The board also moved $421,621 in reserves to the general fund to back a future $500,000 Baldwin child care center request.
  refs: [1, 2]
  public_comment: true
- title: Mental health care, overdoses and supportive housing
  summary: Heartland and county behavioral health staff reported rising demand for psychiatric care funded by the mental health sales tax, while a resident repeatedly pressed the county on fentanyl overdoses, homelessness and federal housing funding changes. The county marked Supportive Housing Week.
  refs: [0, 2, 3]
  public_comment: true
- title: Wakarusa River Valley plan and open space
  summary: A resident asked for a firm date on the Wakarusa open space plan and for county money to buy environmentally sensitive land, and the commission later received a presentation on the Wakarusa River Valley Vision Plan.
  refs: [0, 6]
  public_comment: true
- title: Overhauling county zoning rules
  summary: After a diagnostic review by Clarion Associates, commissioners backed staff-led fixes to the zoning code now and a second phase that could restructure zoning districts, add adequate public facilities rules and create a countywide future land use map.
  refs: [4]
- title: Sheriff's five-year Axon camera and Taser contract
  summary: The commission considered waiving its finance policy for a sole-source contract with Axon for body cameras, software, cloud storage and Tasers from 2027 through 2031.
  refs: [7, 8, 9, 10]
- title: Rural land use permits
  summary: The county handled a temporary permit for a landscaping business at "Kasold Curve" ahead of a planned affordable housing annexation into Lawrence, brush burning on E 1750 Road, renewal of Midnight Farm's permit, a commercial dog kennel, an electrical substation expansion at 1645 E 400 Road and a contractor yard on US-40.
  refs: [3, 4, 6, 7, 8, 9, 10]
- title: Douglas and Jefferson County solid waste plan
  summary: The commission set a September 9 public hearing on the 2026 Douglas and Jefferson County solid waste management plan.
  refs: [0]
- title: 2027 community partner funding
  summary: The county took up its 2027 community partner and service agreements, which set the terms for county money given to outside agencies.
  refs: [7, 8]
