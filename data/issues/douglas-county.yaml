- title: Flexential tax incentive agreement
  summary: The commissioners approved a Business Personal Property Tax Incentive Agreement between Douglas County and Flexential Corp (ED2025-002) on Aug 11 after pulling it from the consent agenda. Several residents from Parker, Highlands Ranch and Castle Rock spoke on it. The documents do not describe the facility.
