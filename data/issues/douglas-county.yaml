- title: Ballot measure to expand the Board of County Commissioners from 3 to 5
  summary: In late August the commissioners fixed the ballot title for expanding the board from three to five members and then referred a measure to preserve voters' rights to vote on it. About 26 residents spoke on Aug. 31, and the board approved an amended referral resolution (R-026-062). Ballot title protest administrative hearings were scheduled for Sept. 3 and 4.
