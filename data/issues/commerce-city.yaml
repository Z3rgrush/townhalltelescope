- title: 2027 city budget, fees and mill levies
  summary: Council held a 2027 budget workshop on Sept. 14 and a public hearing on adopting the 2027 city budget and tax levy on Nov. 2. Golf and recreation fee increases for 2027 were reviewed by the Parks commission and Council. Several improvement districts (E-470 Commercial, E-470 Residential, Northern Infrastructure) and the Urban Renewal Authority took up their 2027 budgets and mill levies, with hearings continued to Nov. 2.
