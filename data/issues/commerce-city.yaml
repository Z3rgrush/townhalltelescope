  summary: Planning Commission and Council reviewed the legislative rezoning of the city under the 2025 Land Development Code, with proposed zoning maps and public comment. Ordinance 2811 would repeal and reenact the official zoning map, with a hearing Nov. 3. Tier 2 code amendments and other code ordinances (2795, 2803) were also taken up.
