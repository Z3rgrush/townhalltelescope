- title: Colorado Blvd. and Chambers Road traffic, truck and road conditions
  summary: Residents told Council on Oct. 19 about truck traffic, speeding, drainage and poor road conditions on Colorado Blvd. Council directed work on prohibiting jake brakes by Q1 2027 and on restoring two travel lanes each way on 120th Avenue between Sable and Chambers Road before winter. A Chambers Road widening update and a 120th/Buckley cost-sharing agreement also came before Council.
