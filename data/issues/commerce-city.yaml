- title: Data center moratorium and study
  summary: Council took up a request for a data center moratorium ordinance and a motion to schedule a data center study session. A resident later asked Council to extend the Data Center Moratorium and spoke on water restrictions. The Environmental Policy and Innovation Commission has been researching data centers and was set to make a recommendation in October.
