- title: Colorado Blvd traffic, jake brakes and Chambers Road/120th Ave road work
  summary: Residents complained about truck traffic, speeding, drainage and poor road conditions on Colorado Blvd. Council directed the City Manager to find a way to prohibit jake brakes by ordinance by the end of Q1 2027, and moved to improve 120th Avenue between Sable Boulevard and Chambers Road, including the I-76 bridge, before winter. Council also awarded a Chambers Road and Heartland Drive contract and received a Chambers Road widening update.
  where: Colorado Blvd, 120th Avenue, Chambers Road
