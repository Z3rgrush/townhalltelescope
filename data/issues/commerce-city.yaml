- title: 2027 city budget, tax levy and district mill levies
  summary: Council held a 2027 budget workshop in September and a public hearing on November 2 on adopting the 2027 city budget and the tax levy. The Northern Infrastructure, E-470 Commercial and E-470 Residential general improvement districts and the Urban Renewal Authority each continued their budget and mill levy hearings to November 2. Parks and recreation fee increases for 2027 were also reviewed.
