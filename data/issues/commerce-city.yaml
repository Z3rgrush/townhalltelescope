- title: 'Annexations: Third Creek East, South Platte Crossing Phase 2, and surrounded enclaves'
  summary: Council found the Third Creek East annexation petition (AN26-0002) in substantial compliance and set an eligibility hearing. It did the same for South Platte Crossing Phase 2 (AN26-0004, 0.61 acres at 7110 Colorado Blvd), which went to Planning Commission with a zoning request. Council also discussed annexing surrounded enclaves.
