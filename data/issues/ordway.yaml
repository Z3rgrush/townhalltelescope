  topics:
  - Lawsuits & legal
  - Water
- title: Historic preservation, Certified Local Government status and cemetery board
  summary: Council advanced ordinances to establish a Certified Local Government and a Historic Preservation Advisory Authority, and created a cemetery board. A further historic preservation ordinance (#675) had a first reading in October, and a cemetery grant is moving forward.
  where: Townwide, Ordway Cemetery
