- title: Water moratorium, restrictions and water supply
  summary: Council denied a water restrictions resolution (2026-06) in April, then approved Resolution 2026-07 in June, a moratorium on additional water services. Water reports and a town resident water restructuring discussion also came up, along with the SE Colorado Water Conservancy allocation of 64.75 AF.
