  topics:
  - Annexation
  - Zoning & development
- title: Water moratorium and water restrictions
  summary: Council denied a water restrictions resolution in April, then approved Resolution 2026-07 in June placing a moratorium on additional water services. Water reports, well output and a town water restructuring were also discussed.
