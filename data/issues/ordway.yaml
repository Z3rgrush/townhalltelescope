- title: Tax certificates, demolition and property requests on Arkansas, Idaho and E. 3rd
  summary: In October the board approved negotiating tax certificates for 305, 317 and 319 Arkansas and 326 Idaho. It approved a demolition application at 318 E 3rd and an extension request for 215 E 4th Street. Discussion of 629 Idaho was postponed. An agreement on future affordable housing development was also on the agenda.
