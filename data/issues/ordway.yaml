- title: Addies Restaurant annexation at 17484 Highway 96
  summary: Trustees took up an annexation petition filed by Toni Evans (Addies Restaurant) in August, and Planning and Zoning recommended annexation. Ordinances 673 and 674 on annexation and zoning had a second reading on Oct. 5, but were repealed Oct. 21. Council then set a Nov. 30, 2026 public hearing on the annexation.
