- title: Toni Evans annexation and zoning
  summary: 'The Planning Commission held a hearing on Aug. 10, 2026 on a petition by Toni Evans to annex land into Ordway, and the trustees adopted resolutions on eligibility and the petition. A second reading of the annexation and zoning ordinances (#673 and #674) followed on Oct. 5. A separate ''Addies'' annexation was also recommended and approved to move forward.'
  where: Ordway town limits
