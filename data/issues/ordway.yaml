- title: CIRSA coverage and settlement over former town attorney's contract change
  summary: Documents in August include a CIRSA coverage letter and a settlement agreement, release and assignment. They concern losses the Town says began in 2022 after the former town attorney amended a water-rate contract and allegedly failed to advise the Town correctly. A malpractice lawsuit and a receivership are mentioned.
  where: 311 Main Street
