- title: Roads & Routes transportation tax and debt ballot measures
  summary: The Board of Trustees took up a Roads & Routes Taskforce update and ordinances setting ballot language for a 1% sales and use tax for transportation infrastructure (Ord. 1422) and for issuing debt for transportation projects (Ord. 1423). A Resolution 26-R-46 in support of the road tax followed on Oct. 7, and staff produced video, FAQ and signage for the campaign.
