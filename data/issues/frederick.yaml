- title: Engineering Building mural and public art
  summary: The Arts Committee wrote an RFP with a $19,000 budget and chose Laurie Cullum as the artist for the Engineering Building mural, with payment of 50% at signing, 25% at install start and 25% at completion. It also approved wood carvings in Crist Park and discussed hiring balloon artists for Frights on Fifth.
