- title: Water rights, leases and reservoir treatment
  summary: Water staff arranged a water lease with Wyndham Hill Metropolitan District, filed a Statement of Opposition in water court case 2026CW3081, and worked on Lower Boulder change-of-use. The town received a discharge permit effective Sept. 1, 2026 for phosphorus treatment to reduce algae in a reservoir. Large payments went to Central Weld County Water District for tap fees and to Northern Water for assessments.
