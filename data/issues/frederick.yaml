- title: Land Use Code bi-annual amendments (Ordinance 1425)
  summary: The Planning Commission recommended amendments to the Land Use Code covering zoning, signs, parking, annexation, oil and gas and definitions. They include creating a marijuana retail use that is prohibited in all zoning districts and changing the permitted animals list. The Board scheduled a public hearing on Ordinance 1425 on Oct. 21.
