- title: Roads & Routes transportation sales tax and debt ballot measures
  summary: The Board set ballot language for a sales and use tax for transportation infrastructure (Ordinance 1422) and for issuing debt for transportation projects (Ordinance 1423), and took up a Resolution 26-R-46 in support of a road tax. Staff and a Roads & Routes Taskforce ran a communications campaign with a potential 1% transportation tax, including videos, FAQs and signage.
