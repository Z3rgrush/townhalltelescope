- title: Land Use Code bi-annual amendments (Ordinance 1425), including marijuana retail ban
  summary: The Planning Commission recommended amendments to Articles 2, 3, 4, 5, 6, 7, 9 and 13 of the Land Use Code. The package creates a marijuana retail sales use and prohibits it in all zoning districts, changes the permitted animals list, and clarifies parking and loading language. The Board of Trustees scheduled a public hearing on Ordinance 1425 for Oct. 21.
