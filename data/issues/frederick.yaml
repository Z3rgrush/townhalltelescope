- title: Water rights, leases and water costs
  summary: Water staff arranged a water lease with the Wyndham Hill Metropolitan District, filed a Statement of Opposition in water court case 2026CW3081, and submitted the annual water audit. Bills include $198,000 and $132,000 to Central Weld County Water District for tap fees and a $278,640.88 Northern Water Class B assessment, plus Lower Boulder change-of-use consulting.
