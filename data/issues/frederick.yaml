- title: Town water rights, leases and reservoir treatment
  summary: Water Resources staff made a water lease agreement with the Wyndham Hill Metropolitan District, filed a Statement of Opposition in water court case 2026CW3081, and submitted the annual water audit. The Town also received a discharge permit (effective Sept. 1, 2026) to treat a reservoir with phosphorus inactivation to curb algae blooms. Payments included $198,000 in Central Weld County Water District tap fees and $25,314 for Lower Boulder change-of-use work.
