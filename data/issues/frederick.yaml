- title: 2027 budget process and 2026 budget amendment
  summary: The Board held a budget introduction and workshops, adopted a budget amendment (Ordinance 1424), and held the first budget public hearing on Nov. 4. Action on the budget is expected after a second public hearing on Dec. 2, 2026.
