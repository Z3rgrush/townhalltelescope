- title: Land Use Code bi-annual amendments (Ordinance 1425)
  summary: The Planning Commission reviewed Resolution PCR 2026-08 recommending amendments to Articles 2, 3, 4, 5, 6, 7, 9 and 13 of the Land Use Code. Changes include creating a marijuana retail sales use and prohibiting it in all zoning districts, changing permitted animals in A and AOS zones, and clarifying parking and loading rules. The Board of Trustees scheduled a public hearing on Ordinance 1425 for Oct. 21.
