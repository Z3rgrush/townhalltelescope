- title: Roads & Routes 1% transportation sales tax and debt ballot measures
  summary: The Board scheduled ballot language for a sales and use tax for transportation infrastructure (Ordinance 1422) and authorization to issue debt for transportation projects (Ordinance 1423). A Roads and Routes Taskforce update was on the Sept. 2 agenda, staff ran a communications campaign with video and FAQs, and Resolution 26-R-46 in support of the road tax was on the Oct. 7 agenda.
