- title: Data center regulations and failed moratorium
  summary: The Planning & Zoning Commission is writing data center rules for Moffat County. Residents, Yampa Valley Electric and Pure-Green Colorado spoke on a possible moratorium, and a panel discussion was held Oct. 6. On Oct. 13 Commissioner Bohrer called for a motion to adopt the Planning & Zoning Commission's recommended moratorium (Resolution 2026-103), no one responded, and the motion died.
