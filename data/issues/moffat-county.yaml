- title: Data center moratorium and regulations
  summary: Residents, Yampa Valley Electric and Pure-Green Colorado spoke on a possible data center moratorium (Resolution 2026-103) tied to the Trapper Reborn project. The Planning & Zoning Commission took up rule-making and held public and expert panel meetings in early October. On Oct 13 the commissioners called for a motion to adopt the moratorium, got no response, and the motion died.
