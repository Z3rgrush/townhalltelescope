- title: Data center regulations and possible moratorium
  summary: The Planning & Zoning Commission began a formal review of the county zoning resolution and data center rules at its August 5 meeting, covering water and cooling, electric demand and ratepayer impacts, wildfire and emergency risk, and taxation. A moratorium was proposed but not acted on August 25; on September 8 speakers split on whether a short moratorium is needed, and an October 6 expert panel was announced.
