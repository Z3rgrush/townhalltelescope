- title: Data center moratorium and regulations
  summary: Residents, Pure-Green Colorado (Trapper Reborn project) and Yampa Valley Electric spoke on a proposed data center moratorium (Resolution 2026-103) on Sept 8, mostly opposing it. The Planning & Zoning Commission took up rulemaking and public panel meetings were held in early October. On Oct 13 Commissioner Bohrer called for a motion to adopt the moratorium and got no response, so it died.
