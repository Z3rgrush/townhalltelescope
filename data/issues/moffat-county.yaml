- title: Trapper Reborn project and moratorium concerns
  summary: Pure-Green Colorado's CEO and other speakers urged commissioners not to pass a data center moratorium that could affect the Trapper Reborn project, citing jobs and tax base. Yampa Valley Electric asked to be part of the energy discussion.
