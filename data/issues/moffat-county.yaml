- title: Echo Park Road closure
  summary: The commissioners approved Resolution 2026-120 temporarily closing County Road 156 (Echo Park Road) in Dinosaur National Monument. Flash flood erosion left it unsafe, and the Park Service wants archaeological concerns investigated before repairs.
  where: County Road 156, Echo Park Road, Dinosaur National Monument
