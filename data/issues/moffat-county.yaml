- title: Craig skatepark funding and design
  summary: The Craig Skatepark Alliance and county staff won approval to apply for $25,000 grants each from the Laura Jane Musser Fund and El Pomar Foundation. The group plans a GOCO application in January. A services agreement with Grindline Skateparks was approved Oct 13.
