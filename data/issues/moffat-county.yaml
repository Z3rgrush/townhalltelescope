- title: Echo Park Road (CR 156) closure
  summary: Commissioners approved Resolution 2026-120 temporarily closing County Road 156 in Dinosaur National Monument because flash-flood erosion made it unsafe. The Park Service must investigate archaeological concerns before repairs.
  where: County Road 156 (Echo Park Road), Dinosaur National Monument
