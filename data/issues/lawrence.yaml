- title: Requiring a special use permit for data centers
  summary: The Planning Commission took up a text amendment (AMDT-26-0015) that would make data centers get a special use permit in Lawrence's light industrial, general industrial and industrial business park districts. A resident had raised data centers during City Commission public comment in August.
  refs: [5, 23]
  public_comment: true
  tags: [data-center]
- title: 2026 Lawrence Bikes Plan
  summary: A new bike plan aiming for a low-stress bikeway network that is safe for all riders moved through the parks, Connected City and MPO boards to replace the 2019 plan, alongside a five-year plan for $4.3 million in sidewalk, bike and pedestrian projects.
  refs: [4, 7, 11, 19, 24, 49, 51]
- title: 2027 Affordable Housing Trust Fund awards
  summary: The Affordable Housing Advisory Board set aside $760,000 for 2027 grants and heard pitches from housing stabilization, home repair and new development applicants, including East Heights, Hope Project 2 and New Hampshire St. Lofts II, ahead of recommendations in November.
  refs: [18, 29]
- title: Redeveloping the city lot at 711 New Hampshire
  summary: Cohen-Esrey Development Group applied for housing trust funds for 711 New Hampshire, and the City Commission considered a fourth extension of its exclusivity agreement to redevelop the city-owned property.
  where: 711 New Hampshire St
  refs: [29, 52]
- title: Taller, denser affordable housing at 8th and Pennsylvania
  summary: The commission adopted a code change loosening height and density limits in the 8th and Penn redevelopment zone's design guidelines to make room for an affordable housing project.
  where: 8th St & Pennsylvania St
  refs: [9, 15]
- title: Homeless camps and park cleanup
  summary: Residents raised chronic homelessness, overdoses and unsanctioned camps during City Commission public comment, and a parks board member asked for more staff to clean up parks dealing with illegal camping and trash.
  refs: [5, 31]
  public_comment: true
- title: Annexing and rezoning land along K-10 at Bob Billings and 6th Street
  summary: The Planning Commission considered annexing about 137 acres for KU Endowment at 1593 N 1900 Road and annexing and rezoning more than 100 acres near K-10's interchanges with W. 6th Street and Bob Billings Parkway, while the Bob Billings extension went through a complete streets review.
  where: K-10 at W 6th St and Bob Billings Pkwy
  refs: [7, 12, 24]
- title: Fire Medical Station No. 6
  summary: The commission weighed a $951,502 contract with SFS Architecture to design an expanded Fire Medical Station No. 6 (pulled from consent for a separate vote) and a construction manager agreement with McCownGordon.
  refs: [1, 15]
- title: Eminent domain for Safe Routes to School and K-10 utility work
  summary: The commission authorized condemning property for the 2025 Safe Routes to School project and, on first reading, for utility relocation on the K-10 West Leg expansion.
  refs: [9, 15, 27]
- title: Speed cushions near KU on Harvard Road and George Williams Way
  summary: Staff shared plans for speed cushions and humps on Harvard Road, George Williams Way, Kanza Drive and other streets near campus through the KU Gateway project and asked residents for feedback.
  where: Harvard Rd & George Williams Way
  refs: [24, 51]
- title: Demolition moratorium in University Place
  summary: The commission held a hearing on whether to exempt 1827 Indiana Street from the demolition permit moratorium in the University Place neighborhood, and residents later asked for a pause on historic landmark nominations.
  where: University Place neighborhood
  refs: [1, 32]
  public_comment: true
- title: Attorney General's push to repeal the conversion therapy ban
  summary: The Human Relations Commission discussed a request from the Kansas Attorney General to repeal Lawrence's conversion therapy ban, along with next steps on a Housing Bill of Rights.
  refs: [8]
- title: Battery storage rules for rural Douglas County
  summary: The Planning Commission discussed how Douglas County should regulate battery energy storage systems in the unincorporated area, including permit tiers, fire risk, setbacks and a 60-decibel noise limit.
  refs: [16]
- title: Tax-exempt bonds for senior housing and DCCCA
  summary: The commission approved up to $10.4 million in industrial revenue bonds for The Peaks of Lawrence mixed-income senior housing and started bonds of up to $4.2 million for DCCCA's project at 3015 W. 31st Street.
  refs: [15, 27]
- title: Water and wastewater plant upgrades
  summary: Contracts covered roadwork at the Kansas River wastewater plant, a pump station repair, a $503,130 pipe gallery replacement at the Kaw water plant, biosolids hauling and a master plan for the Kaw and Clinton water plants.
  refs: [5, 9, 15, 32, 52]
- title: Street maintenance contracts
  summary: Lawrence awarded a $2 million 2026 Phase 4 street maintenance contract, added $175,000 to 2025 Phase 1 and hired engineers for 2027 street work.
  refs: [1, 27, 32]
- title: Solid Waste Master Plan
  summary: Staff updated the Connected City board on the Solid Waste Master Plan's goals, including multifamily and commercial recycling, contamination rates and fees for trash left outside containers.
  refs: [24]
- title: City Band stage in South Park
  summary: The parks board backed a City Band proposal to build a small, accessible concrete stage by the South Park gazebo with donated money, while noting drainage problems in the area.
  where: South Park
  refs: [19, 31]
- title: Airport fees for rideshare, taxis and rental cars
  summary: The Aviation Advisory Board reviewed new permit rules and 2027 rates for ground transportation at Lawrence Regional Airport, including a share of rental car revenue and a $3 daily customer facility charge.
  refs: [28]
