- title: Data center zoning standards
  summary: The Planning Commission held work sessions on August 19 and September 16 on draft use-specific standards for data centers under the Unified Development Code. The drafts address noise and cooling, and staff added requirements that developers show how they will pay for their share of utility infrastructure improvements. They also cover decommissioning timelines and road use agreements. The goal is a code amendment for Planning Commission and county commissioner action.
