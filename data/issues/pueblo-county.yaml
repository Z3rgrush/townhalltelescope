- title: Certificates of participation, lease-purchase financing and TABOR reserve
  summary: The county worked on lease-purchase financing involving certificates of participation, including collateral questions and amendments to Resolution 26-188. It also redesignated county-owned property (DHS building at 2631 E. Fourth St. and 414 W. Ninth St.) for its TABOR emergency reserve. The Capital Construction Corporation board was changed, and property at West 11th Street was deeded to the county.
