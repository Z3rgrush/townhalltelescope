- title: Draft zoning standards for data centers
  summary: The Planning Commission held work sessions on Aug 19 and Sept 16 on draft use-specific standards for data centers, which are currently a special use in the county code. The draft adds requirements for decommissioning within 12 months, road use agreements, and developers showing they will pay their fair share of utility infrastructure. Staff aim to send a code amendment to the Planning Commission and then the commissioners.
