- title: 2027 budget cuts, layoffs and hiring freeze
  summary: The county is dealing with a budget shortfall, with a 2027 budget process, a financial outlook presentation, and repeated closed sessions on personnel and operating cuts across the Assessor, DA, Treasurer, Sheriff and Clerk offices. The board adopted a resolution eliminating BOCC staff positions (effective date later moved to December 19, 2026), formally declared no outside funding requests for 2027, and approved a 2027 pay plan and benefits. It also put the budget department under temporary oversight and amended the 2026 budget.
