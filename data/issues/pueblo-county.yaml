- title: Aspen Acres Fire disaster emergency, recovery and flood mitigation
  summary: The commissioners have repeatedly renewed the local disaster declaration for the Aspen Acres Fire, which began around June 29, 2026. It has affected over 101,965 acres and destroyed about 240 homes and 9 businesses. The county has applied for federal watershed protection aid, accepted a grant for flooding and debris-flow measures, and approved an MOU for fire mitigation projects. A Stage-2 open fire ban was also continued.
  where: Southwest Pueblo County
