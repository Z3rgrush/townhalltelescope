- title: 2026-2027 county budget cuts and layoffs
  summary: The county is dealing with a budget shortfall. Executive sessions covered personnel and operating cuts affecting the Assessor, District Attorney, Treasurer, Sheriff and Clerk offices. The Board eliminated BOCC receptionist positions, with the effective date later moved to Dec. 19, 2026. A 2026 budget amendment hearing was held and the 2027 proposed budget was presented. The county also adopted a 2027 pay plan and employee benefits, redesignated TABOR reserve property, and discussed certificates of participation and a revitalization authority.
