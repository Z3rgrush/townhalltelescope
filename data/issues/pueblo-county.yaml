- title: Aspen Acres Fire disaster declaration and flood recovery
  summary: The commissioners renewed the local disaster emergency for the Aspen Acres Fire (started June 29, 2026; over 101,965 acres affected) at nearly every meeting. They accepted a USDA watershed grant for flood and debris-flow recovery (project total $18,336,812) and hired Wilson and Company ($300,000 design) and RockSol and Phoenix Eye Consulting for engineering and oversight. They also approved a $500,000 MOU for mitigation projects and a FEMA lease at 201 W. 8th Street.
  where: Countywide (Aspen Acres Fire burn scar)
