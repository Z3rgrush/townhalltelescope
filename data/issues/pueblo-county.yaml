- title: Data center zoning standards
  summary: The Planning Commission held work sessions on August 19 and September 16 on draft use-specific standards for data centers, which are a special use in the county code. Staff added requirements for infrastructure cost-sharing, road use agreements and decommissioning within 12 months. The goal is a code amendment for Planning Commission and Commissioner review.
