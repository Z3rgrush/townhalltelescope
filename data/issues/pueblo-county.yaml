- title: Aspen Acres Fire disaster emergency and flood recovery
  summary: The Board renewed its local disaster emergency declaration week after week for the Aspen Acres fire, which began June 29, 2026. The fire affected over 101,965 acres and destroyed about 240 homes and 9 businesses. The county has moved to burn-scar flooding and debris-flow recovery, including an $18.3 million USDA watershed grant, engineering contracts with Wilson and Company ($300,000) and Rocksol, a $500,000 mitigation MOU, federal assistance applications and a FEMA office lease.
  where: Southwest Pueblo County
