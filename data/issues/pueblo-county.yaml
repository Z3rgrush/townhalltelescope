- title: Aspen Acres Fire disaster declaration and flood recovery
  summary: The commissioners renewed the local disaster emergency for the Aspen Acres Fire almost every week. The fire began June 29, 2026 and affected over 101,965 acres. The county took a USDA watershed grant (about $18.3 million) for burn-scar flood protection, hired Wilson and Company ($300,000) and Rocksol for engineering design, and approved a $500,000 mitigation agreement. FEMA also leased office space at 201 W. 8th Street.
  where: Countywide (burn scar and flood areas)
