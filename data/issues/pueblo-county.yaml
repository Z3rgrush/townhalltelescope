- title: Stage-2 open fire ban in unincorporated Pueblo County
  summary: The Board adopted a Stage-2 open fire ban for unincorporated areas due to high fire danger and the active wildfire. It bans campfires, fireworks, explosives, off-road vehicle use and chainsaws without spark arresters.
