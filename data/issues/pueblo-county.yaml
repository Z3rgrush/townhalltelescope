- title: 'Land use cases: rezonings, permit rescissions and zoning violations'
  summary: Land use hearings covered a 0.55-acre rezoning, a 0.53-acre rezoning to SR2 to vacate interior lot lines, rescission of a cell tower permit at 4800 North Creek Road in Beulah, abandonment of three special use permits, and a vehicle sales special use permit for Toby and Rose Miller. The county also pursued legal action over zoning violations, including one at 46911 Fields Road, Avondale. The Planning Commission reviewed the Fremont Paving gravel and asphalt permit on 1,030 acres.
