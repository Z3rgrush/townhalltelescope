- title: County budget cuts, layoffs and 2027 budget
  summary: The county is in a budget squeeze, and executive sessions repeatedly cover personnel and operating cuts for 2026 and 2027, including the Assessor, DA, Treasurer, Sheriff and Clerk offices. A resolution eliminates the BOCC receptionist positions, with the separation date moved to Dec 19, 2026. The commissioners also heard 2027 budget presentations, declared no outside funding requests will be accepted for 2027, and amended the 2026 budget.
