- title: 647 apartments at Foxridge and Broadmoor
  summary: Block Real Estate proposed three apartment buildings totaling 647 units at 5665 Foxridge and 5700 Broadmoor, including converting an office building; the council voted 9-0 to send it back to the planning commission over traffic, exterior materials and feasibility, and it returned in October.
  where: 5665 Foxridge Dr & 5700 Broadmoor St
  refs: [4, 5, 6, 7]
- title: 2027 budget and exceeding the revenue-neutral property tax rate
  summary: Mission held hearings on its 2027 budget and the Rock Creek drainage district budgets, with resolutions to levy above the revenue-neutral rate.
  refs: [4, 5]
- title: 2027 trash and stormwater utility fees
  summary: The council set 2027 solid waste and stormwater utility rates, with stormwater at $28 per residential unit per month, billed on property tax statements.
  refs: [0, 1]
- title: Rock Creek and neighborhood stormwater projects
  summary: The city approved Evergy utility relocation for the Rock Creek project, changed the scope of localized stormwater design, and ordered design of 2027 street and stormwater projects.
  where: Rock Creek
  refs: [0, 1, 4, 5]
- title: Complete Streets policy
  summary: Staff presented a draft Complete Streets policy so future street projects serve people walking, biking and riding transit as well as drivers.
  refs: [2, 3]
