- title: Waste hauler licensing rewrite (Chapter 5.29)
  summary: Ordinance O-2026-30 would repeal and replace the hauler licensing chapter, adding definitions, a license review and approval process, and an enforcement framework that includes a hearing. License fees would move into rules and regulations. It aims to track tonnage and bring unlicensed haulers in, supporting the city's Zero Waste goal. It was on first reading August 10 and second reading August 24.
