- title: Revised 2026 and proposed 2027 city and LRA budgets
  summary: Council held a Sept. 14 study session on the revised 2026 and proposed 2027 city budget. The Lakewood Reinvestment Authority also received its proposed 2027 budget, with approval sought Oct. 19. Council also approved 2027 budgets for the Alameda Corridor and West Colfax business improvement districts, and a $225,000 amendment to the 2026 budget was moved forward in August.
