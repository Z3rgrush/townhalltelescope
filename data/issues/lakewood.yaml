- title: 2027 city and LRA budgets
  summary: Council saw the revised 2026 and proposed 2027 city budget in a September study session. The Lakewood Reinvestment Authority reviewed its revised 2026 and proposed 2027 budget, with approval sought Oct. 19. Council also approved 2027 budgets for the Alameda Corridor and West Colfax business improvement districts.
