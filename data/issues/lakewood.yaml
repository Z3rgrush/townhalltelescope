- title: 'Ballot Issue 2G: 0.5% sales tax increase for public safety'
  summary: Council adopted Resolution R-2026-58 on Aug. 24 to put a one-half percent sales and use tax increase on the Nov. 3, 2026 ballot as Ballot Issue 2G. Revenue would be dedicated to public safety and traffic safety improvements, including crime prevention and homelessness response. On Oct. 12 council considered a resolution supporting the measure.
