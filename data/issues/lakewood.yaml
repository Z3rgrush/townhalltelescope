- title: Public benefit agreement to keep Natural Grocers headquarters in Lakewood
  summary: Council considered a performance-based incentive agreement to keep Natural Grocers' national headquarters in Lakewood, with 50 new jobs and repayment if it moves. It follows a 2023 agreement for up to $500,000 that did not proceed because required public improvements grew beyond its scope.
  where: Natural Grocers headquarters, 12612 W. Alameda Parkway
