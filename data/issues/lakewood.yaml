- title: 'Ballot Issue 2G: half-cent sales tax for public and traffic safety'
  summary: Council adopted Resolution 2026-58 on August 24 to put Ballot Issue 2G before voters on November 3, 2026. It would raise the sales and use tax rate by one-half of one percent, with all revenue dedicated to public safety and traffic safety improvements. On October 12 council considered a resolution formally supporting the measure.
