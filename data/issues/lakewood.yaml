- title: Affordable Housing Fund study session
  summary: On Nov. 16 council reviewed the Housing Policy Commission's 2026 discussions on creating a local Affordable Housing Fund, including housing need data and homelessness trends, and the steps toward an ordinance establishing the fund. A separate item sets 2026 neighborhood and affordable housing preservation funding, including a 3% increase to affordable housing stock.
