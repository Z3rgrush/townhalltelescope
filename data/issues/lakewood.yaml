- title: Automated license plate readers and proposed AVIS
  summary: Police presented Lakewood's use of 17 fixed Flock Safety license plate cameras, in use in various forms since 2010 and originally funded by a federal JAG grant. Council is reviewing whether more safeguards are needed and how the city's proposed Automated Vehicle Identification System relates to the existing cameras.
