- title: Neighborhood Participation Program and capital project funding
  summary: Council considered setting 2026 capital improvement project funding levels, including projects recommended under the Neighborhood Participation Program, which funds small neighborhood-proposed projects such as playgrounds, public art and community gardens. A related item concerned increasing the city's affordable housing stock by 3%.
