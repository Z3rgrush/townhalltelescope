- title: Neighborhood Participation Program project funding
  summary: Staff asked council to approve recommended projects for the 2026 Neighborhood Participation Program, which funds small neighborhood-proposed projects such as playgrounds, public art and community gardens. 176 projects have been funded since the program began in 1992.
