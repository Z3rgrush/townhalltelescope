- title: Revised 2026 and proposed 2027 city and LRA budgets
  summary: Council and the Lakewood Reinvestment Authority heard presentations of the revised 2026 and proposed 2027 budgets on Sept. 14. Staff plans to seek approval of the LRA budget at the Oct. 19 meeting. Council also approved 2027 budgets for the Alameda Corridor and West Colfax business improvement districts.
