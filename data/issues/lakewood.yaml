- title: Automated license plate readers and proposed AVIS
  summary: Police briefed council on the 17 fixed Flock Safety license plate cameras in use, which were first funded by a federal JAG grant and are now paid from the police budget. Council was to consider whether more safeguards are needed and how the proposed Automated Vehicle Identification System relates to the existing cameras.
