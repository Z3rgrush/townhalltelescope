- title: Waste hauler licensing rewrite (Chapter 5.29)
  summary: Ordinance O-2026-30 would repeal and replace the city's hauler licensing chapter, adding definitions, an application review process, enforcement with hearings, and moving license fees into rules and regulations. Staff say it helps track recycling and compost tonnage toward the city's Zero Waste goal. It was on first reading Aug. 10 and second reading Aug. 24.
