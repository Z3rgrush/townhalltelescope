- title: Automated license plate readers and proposed AVIS cameras
  summary: Police presented Lakewood's use of 17 fixed Flock Safety license plate cameras, in use in various forms since 2010. Council was asked to consider added safeguards and how the proposed Automated Vehicle Identification System relates to the existing readers. Policy PP-9126 bars a traffic stop based solely on an ALPR alert.
