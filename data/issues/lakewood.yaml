- title: West Colfax LRA investment strategy
  summary: Staff presented an updated strategy for spending West Colfax urban renewal tax increment funds, which expire in 2030. Ten potential projects were scored, including the Quail Street Center, and the Colfax transportation safety project would narrow Colfax from three lanes to two each direction.
  where: West Colfax corridor, Pierce Street to Simms Street
