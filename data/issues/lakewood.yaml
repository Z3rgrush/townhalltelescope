- title: Neighborhood traffic-calming and speed hump policy changes
  summary: Public Works proposed changes to the traffic-calming policy, including shortening speed hump spacing from 700 feet to about 400 feet, raising the volume threshold on local streets, and moving to an allocated budget instead of a fixed 25 humps a year. Staff are also planning speed cushions and crossings on Mississippi east of Pierce and on Harlan near Deane Elementary and Ray Ross Park, working with West Metro Fire District.
  where: Mississippi Ave. east of Pierce; Harlan St. near Deane Elementary
