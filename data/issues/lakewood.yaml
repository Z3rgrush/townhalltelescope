- title: Natural Grocers headquarters public benefit agreement
  summary: Council considered a performance-based incentive agreement to keep Natural Grocers' national headquarters in Lakewood, tied to a building remodel, 50 new jobs and average wages at or above the Jefferson County average. The company must repay the incentive if it moves its headquarters out during the retention period. A 2023 agreement for a larger project at 12612 W. Alameda Parkway never moved forward.
