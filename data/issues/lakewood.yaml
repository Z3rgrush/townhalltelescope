- title: 'Ballot Issue 2G: 0.5% sales tax increase for public safety'
  summary: Council referred Ballot Issue 2G to the November 3, 2026 ballot (Resolution 2026-58, Aug. 24) and then passed a resolution of support on Oct. 12. It would raise the sales and use tax rate by one-half percent, with revenue dedicated to public safety and traffic safety improvements, including crime prevention and homelessness response.
