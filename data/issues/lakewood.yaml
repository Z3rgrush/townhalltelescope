- title: 'Ballot Issue 2G: half-cent sales tax for public and traffic safety'
  summary: Council adopted Resolution 2026-58 on Aug. 24 to put Ballot Issue 2G on the Nov. 3, 2026 ballot. It would raise the sales and use tax rate by one-half percent, with revenue dedicated to public safety and traffic safety. On Oct. 12 council considered a resolution formally supporting the measure.
