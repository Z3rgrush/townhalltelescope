- title: Automated license plate readers and red-light/speed camera vendor safeguards
  summary: Police presented on the 17 fixed Flock Safety license plate cameras the city has run, and council discussed safeguards and how they relate to the proposed automated vehicle identification system for red-light and speed enforcement. In November staff brought draft accountability language to guide contracts as the city seeks a new vendor for both technologies.
