- title: Rock quarry permits near 151st Street and Old 56 Highway
  summary: Aggregate companies asked to rezone about 109 acres and get special use permits for new and expanded rock quarries southeast of 151st and Old 56 Highway/Clare Road. The council also met in closed session about the pending quarry applications.
  where: 151st St & Old 56 Hwy / Clare Rd
  refs: [1, 4, 7]
- title: 2027 budget and exceeding the revenue-neutral property tax rate
  summary: Olathe held a public hearing on its FY2027 budget and its intent to exceed the revenue-neutral rate. Residents spoke about rising taxes and household costs, and the council discussed growth-driven service needs and a $300,000 property-tax rebate program.
  refs: [6]
  public_comment: true
- title: FTI manufacturing campus and tax breaks at 167th and Lone Elm
  summary: Faith Technologies' 120-plus acre manufacturing campus got site plans and plats approved, along with industrial revenue bonds and property-tax phase-ins for about 1.5 million square feet of buildings.
  where: 167th St & Lone Elm Rd
  refs: [0, 3, 7, 12]
- title: New logistics warehouses along 167th to 175th Streets
  summary: Developers sought rezonings for the 167th Street Logistics Centre (51 acres) and Frontier Trails Logistics (70 acres of general industrial near 175th), and revised plans for Great Plains Commerce Center buildings.
  where: 167th-175th St corridor
  refs: [2, 4, 7, 9]
- title: College and Sunnybrook apartments and shopping
  summary: The council rezoned business-park land at College Boulevard and Sunnybrook for a commercial center and 333 rental apartments, debating whether it delivers the mixed use the comprehensive plan calls for.
  where: College Blvd & Sunnybrook / Valley Rd
  refs: [4, 8]
- title: Residences at Heritage Park apartments near 151st/159th and Pflumm
  summary: Rodrock Development asked to rezone about 25 acres to medium-density multifamily for the Residences at Heritage Park; the hearing was continued once before returning in October.
  where: 151st-159th St & Pflumm Rd
  refs: [4, 11]
- title: Rewrite of Olathe's development code and housing affordability
  summary: Council debated a contract to rewrite the Unified Development Ordinance over 18 months, discussing housing affordability and a wider variety of housing types.
  refs: [10]
- title: Fire station replacement and repairs
  summary: Olathe approved construction of the Fire Station No. 4 replacement on Mur-Len Road and a critical remediation project at Fire Station No. 1.
  where: 13301 S Mur-Len Rd
  refs: [0, 1, 3, 12]
- title: Santa Fe Street widening from Ridgeview to Mur-Len
  summary: Council reviewed the Santa Fe Street improvements project and related utility agreements, plus a K-10 and Lone Elm bypass design contract.
  where: Santa Fe St, Ridgeview to Mur-Len
  refs: [5]
- title: Parkside Reserve and other new subdivisions in south Olathe
  summary: Final plats added nearly 90 new lots at Parkside Reserve near 167th and Black Bob, plus Stonebridge Manor and Woodland Hills phases.
  where: 167th St & Black Bob Rd
  refs: [0, 1, 2, 3, 9, 10]
