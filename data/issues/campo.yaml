- title: Bonus allocation projects and TIP amendments (NC 540, RDU interchange)
  summary: 'The board selected 16 NC 540 bonus allocation projects, including a new two-lane Neuse River bridge and the Benson Road and Poole Road work, and added them in TIP Amendment #3. The amendment also added an RDU-funded interchange at Aviation Boulevard and National Park, and removed a Cary trails project. Amendment #4 had a hearing in August 2026.'
  where: Johnston and Wake counties; Aviation Blvd at National Park Drive, RDU
