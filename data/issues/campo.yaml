- title: NC 540 bonus allocation projects and TIP amendments
  summary: 'CAMPO worked with NCDOT Division 5 to refine costs for 16 projects selected for the NC 540 bonus allocation, including a Neuse River bridge and Benson Road widening. They were included in TIP Amendment #3, approved after a May public hearing with no public comments received. The amendment also added an RDU interchange project at Aviation Boulevard and removed a Cary trail project. Amendment #4 is up for a public hearing in August.'
  where: Johnston and Wake Counties; Aviation Blvd, RDU
