- title: FFY 2027 LAPP projects and Crabtree Creek Greenway funding
  summary: CAMPO reviewed 19 submitted projects for FFY 2027 Locally Administered Projects Program funding and recommended the top roadway projects, including Rolesville at Riley Hill and Holly Springs Road. Raleigh also requested additional funding for the Crabtree Creek Greenway at Lassiter Mill, which requires a 50/50 match. The FFY 2028 target modal mix and call for projects are coming in August 2026.
