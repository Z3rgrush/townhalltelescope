- title: Triangle Bikeway East design alignment
  summary: The TCC and Executive Board were asked to endorse a technical alignment for the Triangle Bikeway East to carry forward to 30% design. A resident spoke against the project in November, citing mining regulations, zoning and active lawsuits on the property.
