- title: NCDOT cost estimate requirement and project delivery deadline
  summary: NCDOT is requiring cost estimates (CSCE) for prioritized projects, with all to be completed by September 30, 2027. CAMPO has 27 projects programmed that need plans to meet the deadline. TCC members questioned the status of projects such as the Western Boulevard Tunnel, and the Chair asked for more frequent updates.
