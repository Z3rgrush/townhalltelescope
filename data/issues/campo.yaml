- title: NCDOT resurfacing and safety improvements in Johnston County
  summary: NCDOT Division 5 briefed the TCC on resurfacing, bridge replacements and the Angier Bypass (scheduled April 2028). CAMPO staff asked whether local funds could widen FY 2028 resurfacing projects to add intersection improvements, and were told it was possible but timing was unclear.
  where: Johnston County
