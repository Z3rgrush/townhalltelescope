- title: 2055 Metropolitan Transportation Plan adoption
  summary: The Executive Board approved the draft 2055 MTP/CTP project list in November 2025 and held public hearings, with final adoption planned for February 2026. A resident at the January hearing called the plan good and asked that safety be emphasized.
