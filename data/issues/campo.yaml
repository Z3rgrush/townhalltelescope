- title: FFY 2028 LAPP program and annual call for projects
  summary: The CAMPO Executive Board will hold a public hearing on the FFY 2028 Locally Administered Projects Program (LAPP) and its target modal mix. It is asked to approve the program and open the annual One-Call-for-All for LAPP and UPWP projects.
