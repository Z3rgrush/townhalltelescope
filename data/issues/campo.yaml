- title: Triangle Mobility Hub locally preferred alternative
  summary: GoTriangle sought approval of the Locally Preferred Alternative for the Triangle Mobility Hub. After a public hearing in June, where comments generally supported the project, the Executive Board moved to approve it. The Triangle West board approved it the day before.
