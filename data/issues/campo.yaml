- title: Regional Transit Technology Plan
  summary: The TCC and Executive Board approved the Regional Transit Technology Plan as a guiding document for future transit technology investment. It covers real-time passenger information, integrated payments, data standards and an open data portal, and an extra 30-day comment period drew no comments.
