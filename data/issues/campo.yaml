- title: Project cost estimates and delivery deadline for NCDOT-funded projects
  summary: NCDOT now requires a certified cost estimate (CSCE) for prioritized projects, with a September 30, 2027 target for all projects. CAMPO has 27 projects needing plans, and officials tracked Division 4 and 5 projects such as the Western Boulevard tunnel and NC 42. The chair asked for more frequent updates.
