- title: Capital Boulevard/US 1 North (U-5307) project and tolling
  summary: The board discussed accelerating the Capital Blvd./US 1 North project, including its earlier action authorizing tolling. The 2055 transportation plan was recommended for approval subject to removing U-5307 as a tolled project. An outside speaker praised NCDOT and CAMPO for speeding it up.
