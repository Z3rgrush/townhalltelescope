- title: 2055 Metropolitan Transportation Plan and Capital Blvd/US 1 North tolling
  summary: CAMPO held public hearings on the 2055 Metropolitan Transportation Plan, with the Board approving the draft in November 2025 and final adoption set for February. Staff recommended removing the U-5307 Capital Blvd/US 1 North project as a tolled project, reversing the Board's earlier action authorizing tolling to speed it up.
  where: Capital Boulevard / US 1 North, Wake County
