- title: Local roads and greenways funding (LAPP) including Crabtree Creek Greenway
  summary: Raleigh requested additional funding for the Crabtree Creek Greenway at Lassiter Mill, requiring a 50/50 match, with bids due February 10, 2026. The FFY 2027 LAPP funded 19 submitted projects, including Rolesville, Holly Springs Road and Smith Creek Greenway, and planning began for the FFY 2028 call for projects in August 2026.
  where: Crabtree Creek Greenway at Lassiter Mill, Raleigh; other Wake County sites
