- title: Triangle Bikeway East Design alignment and opposition
  summary: The TCC and Executive Board were asked to endorse a technical alignment for the Triangle Bikeway East Design Project to carry forward to 30% design. At the November 2025 board meeting, a resident spoke against the project, citing mining regulations, zoning and active lawsuits on the property.
  where: Triangle Bikeway East corridor, Wake County
