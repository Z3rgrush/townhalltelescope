- title: Triangle Mobility Hub preferred alternative
  summary: GoTriangle sought approval of the Locally Preferred Alternative for the Triangle Mobility Hub. After a public hearing where comments generally supported the project, the Executive Board moved to approve it in June 2026. The Triangle West board approved it the day before.
