- title: Wake Transit Plan 2035, Bus Plan and annual work plans
  summary: CAMPO committees reviewed the Recommended 2035 Wake Transit Plan, which aims for routes running 365 days a year, plus quarterly amendments and the FY 2027 Wake Transit Work Plan. The board approved a Wake Bus Plan 2035 contract with Nelson\Nygaard, and a public hearing on the FY 2027 work plan was held in May 2026. A vehicle rental tax revenue footnote was debated.
