- title: County Road 39 paving project
  summary: Contractor Simon Construction is paving County Road 39. Paving is complete from County Road G to County Road M, and crews will grind from Highway 59 to County Road G and inspect the subgrade before paving there. The road will be striped when work is finished.
  where: County Road 39, from Highway 59 to County Road M
