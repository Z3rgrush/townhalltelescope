- title: South Spur Solar Project and utility permits
  summary: The South Spur Solar Project is expected to begin in early 2027, and the Road and Bridge supervisor plans to work with the company so county roads are restored afterward. A Viaero underground utility permit was moved to the south side of County Road 38, and exposed fiber on County Road 18 needed a utility locate.
  where: County Roads 38 and 18; South Spur Solar site
