- title: County Road M railroad approach and asphalt repairs
  summary: Repairs on County Road M near the BNSF railroad crossing were delayed while the county sorted out flagger costs and permits, and were tied to the County Road 39 work to avoid doing it twice. In August the commissioners approved a $410,050 Simon Construction estimate to remove and replace asphalt on County Road M.
