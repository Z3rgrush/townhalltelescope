- title: December 2025 windstorm and wildfires
  summary: After a severe windstorm with 60-70 mph gusts and fires that burned over 14,000 acres, the commissioners declared a local disaster emergency on Dec. 19, 2025. Road crews logged overtime fighting the fires, DOLA matching grants for Eckley's generator were discussed, and crews have been clearing blown sand from roads in the burn scar.
