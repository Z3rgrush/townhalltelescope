  - 1
- title: County Road M asphalt repair bid ($410,050)
  summary: Commissioners approved an estimate from Simon Construction for removing and replacing asphalt on County Road M at a cost of $410,050.
  where: County Road M
  refs:
  - 1
- title: Road and Bridge staffing shortage and blade coverage
  summary: With the department short-staffed, each blade operator covers a larger area, so roads may be bladed more slowly. Officials discussed keeping more spare blades available and adding blade operator positions to the 2027 budget. The county is still recruiting a blade operator and maintenance staff. Commissioners approved salary authorizations for several positions, including blade operators at $21.00 and $20.04 an hour and a truck supervisor at $25.84 an hour.
  where: Countywide
  refs:
  - 0
  - 1
- title: South Spur Solar Project and road repair
  summary: The Road and Bridge supervisor said the South Spur Solar Project will start in early 2027. He plans to work with the company so county roads are restored to their original quality afterward.
  where: Countywide
  refs:
  - 0
- title: Wildfire, drought and fire safety response
  summary: Officials discussed fire safety concerns, weather and drought conditions. Crews are removing sand that blew onto County Road 29 after the wildfires. The county is building a fire map and is waiting on FEMA approval of its Hazard Mitigation Plan.
  where: Countywide, including County Road 29
  refs:
  - 1
- title: Rain damage repairs in southern county
  summary: Crews are continuing to repair roads damaged by rainstorms in the southern part of the county. Other work includes topcoating roads, pulling ditches, and rebuilding County Road 52 between County Roads J and K.
  where: Southern Yuma County; County Road 52
  refs:
  - 0
  - 1
- title: Utility permits and exposed fiber on county roads
  summary: A Viaero underground utility permit had to be moved to the south side of County Road 38. Crews found exposed fiber along County Road 18 and requested a utility locate so they can cover it safely.
  where: County Roads 38 and 18
  refs:
  - 0
  - 1
- title: Delinquent tax liens and tax collection
  summary: The county has collected 95% of its tax revenue. Of 348 tax liens, 140 are eligible for deed applications, and another 59 mineral liens become eligible this year and must be researched back to original land patents.
  where: Countywide
