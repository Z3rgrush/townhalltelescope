- title: Road and Bridge staffing, supervisor hire and blade coverage
  summary: The county interviewed for a new Road and Bridge Supervisor and offered the job to David Lee at $76,000 a year. The department is short-staffed, so blade operators cover larger areas and roads may be bladed more slowly. Commissioners discussed adding blade operator positions to the 2027 budget and approved several salary authorizations.
