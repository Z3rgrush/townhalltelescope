- title: 2026 budget hearing and revised mill levy certification
  summary: The commissioners held a public hearing in December 2025 on 2026 budgets for the county, landfill and Water Authority. After the Assessor's Office notified local governments of a required change in January, the board approved a revised Certification of Mill Levies and Revenue for tax year 2025 and budget year 2026.
