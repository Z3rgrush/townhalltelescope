- title: Beaver Creek Diversion Restoration and infiltration gallery
  summary: The Town amended its RESPEC engineering contract to $657,312 in January 2026 to redesign the infiltration gallery. The project is funded by NRCS grants and a CWCB loan of up to $8,080,000, with total cost near $4 million. In June 2026 Council awarded the gallery work to Meridian Contracting for no more than $641,386.
