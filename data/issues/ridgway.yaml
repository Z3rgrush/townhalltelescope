- title: Wastewater Treatment Plant renovation and siting
  summary: Council reviewed the needs assessment for renovating the wastewater treatment plant in May 2026. Siting and treatment options were slated for discussion at the September agenda and the October 31 budget retreat. A resident asked that the new plant be built to last 50 to 60 years.
