- title: Beaver Creek Diversion Restoration and infiltration gallery
  summary: The town's water diversion project on Beaver Creek ran into design and cost problems. Council raised the RESPEC engineering contract to $657,312 in January and in June awarded the redesigned infiltration gallery to Meridian Contracting for up to $641,386. The project is funded by NRCS and other grants plus a Colorado Water Conservation Board loan, with total cost near $4 million.
