- title: Water supply planning and water restrictions
  summary: A resident asked how planning accounts for water as the town grows, and staff pointed to a public process on future supply. The town is drafting a Water Supply Element of the Master Plan and modifying its Water Conservation and Management Plan. Council is considering rescinding Stage 2 mandatory water restrictions.
