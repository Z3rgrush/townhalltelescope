- title: Wastewater treatment plant renovation and siting
  summary: Town engineer presented a needs assessment for renovating the wastewater treatment plant in May 2026, and a resident urged building the new plant for a 50-60 year life. In September 2026 Council was to discuss and give direction on plant siting options.
