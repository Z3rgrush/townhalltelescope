- title: Wildfire code, fire restrictions and Gold Mountain Fire
  summary: Council introduced an ordinance adopting the 2025 Colorado Wildfire Resiliency Code and other building codes. In summer 2026 it managed Stage 1 and 2 fire restrictions, and a resident thanked the Town for support during the Gold Mountain Fire. The Mayor signed a letter supporting the Governor's disaster declaration request.
