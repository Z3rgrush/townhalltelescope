- title: Housing Action Plan and regional affordable housing services
  summary: The Town is preparing a Housing Action Plan required under state law (SB 24-174) with five goal areas, including ADUs, land banking and workforce housing. A resolution adopting it was on the October 14 agenda, along with Proposition 123 participation and the Home Trust of Ouray County's housing services work. The Home Trust also gave the Council a right-of-first-refusal decision on a home at 683 Frederick St.
