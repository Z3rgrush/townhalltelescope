- title: Beaver Creek Diversion Restoration and infiltration gallery
  summary: The Town amended its RESPEC engineering contract to $657,312 to redesign the infiltration gallery after the original contractor left it out of scope. In June 2026 Council awarded the gallery work to Meridian Contracting for up to $641,386. The project is funded by NRCS grants and a CWCB loan of up to $8.08 million, with total cost near $4 million.
