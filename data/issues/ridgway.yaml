- title: Water supply, conservation and drought restrictions
  summary: Residents asked how planning accounts for water as the town grows. Staff pointed to a draft Water Supply Element of the Master Plan amendment. Council also took up lifting Stage 2 mandatory water restrictions and a resolution modifying the Water Conservation and Management Plan.
