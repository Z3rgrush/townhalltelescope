- title: Wastewater Treatment Plant renovation and siting
  summary: Council reviewed the needs assessment for renovating the wastewater plant, with a pre-public hearing in May. Siting and treatment options are being discussed in September and at the October budget retreat. A resident urged building the new plant for a 50 to 60 year life.
