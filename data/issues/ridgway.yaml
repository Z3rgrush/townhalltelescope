- title: 2026 and 2027 town budgets
  summary: Council adopted the 2026 budget and property tax levies in December after workshops, which included a citizen proposal called Keep Ridgway Creative and community grants totaling $98,205. Work on the 2027 budget began with a draft in October and a budget retreat on Oct 31 covering pay, capital projects and nonprofit funding requests.
