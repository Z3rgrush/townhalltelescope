- title: 2026 budget and 2027 budget process
  summary: Council reviewed the draft 2026 budget amid a 22.64% drop in sales tax receipts from 2024, with 2.4% pay movements, and adopted the budget and property tax levies in December 2025. A draft 2027 budget and a schedule for preparing it came up in fall 2026, along with community grant awards of about $98,205 recommended from $117,385 requested.
