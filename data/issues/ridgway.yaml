- title: Housing Action Plan, workforce housing and Proposition 123
  summary: The town drafted a Housing Action Plan required by state law, with goals on workforce housing, ADUs, infill and land banking. The plan is slated for adoption by resolution in October. Council also reviewed regional housing services run by Home Trust of Ouray County, a down payment assistance MOU with the Telluride Foundation, and a Proposition 123 commitment.
