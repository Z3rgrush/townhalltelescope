- title: 2026 and 2027 budgets, sales tax decline and capital plans
  summary: The 2026 budget was adopted in December 2025 after workshops. Staff noted sales tax receipts were down 22.64% from 2024, with 2.4% pay movements proposed. The draft 2027 budget was presented in October with a budget retreat on October 31 covering pay, capital projects and funding requests from the Home Trust and EcoAction Partners.
