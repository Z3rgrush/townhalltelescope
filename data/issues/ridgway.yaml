- title: Tourism strategy and lodging revenue loss
  summary: A Destination Development Mentor Program report said the lodge's conversion to workforce housing reduced lodging tax revenue by about $40,000 and cut sales tax revenue. Council heard a draft destination marketing plan and approved an agreement for visitor and business engagement services.
