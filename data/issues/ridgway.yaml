- title: Housing Action Plan, Proposition 123 and workforce housing
  summary: The Town drafted a Housing Action Plan with five goal areas under state law (SB 24-174), reviewed it with the Planning Commission in August 2026, and scheduled a resolution to adopt it in October. The Home Trust of Ouray County runs regional housing services, and the Town is considering joining Prop 123 for 2027 and exercising a right of first refusal on 683 Frederick St. Council also backed a down payment assistance MOU with the Telluride Foundation and noted the Town's earlier shift of the lodge to workforce housing.
