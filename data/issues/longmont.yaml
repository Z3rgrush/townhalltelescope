- title: Inclusionary housing fee-in-lieu and human services funding
  summary: The Housing and Human Services Advisory Board heard an update on the inclusionary housing ordinance, which requires 12% affordable units or a fee, and set a two-tier scoring system for funding. It then held agency funding hearings through October.
