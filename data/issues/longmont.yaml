- title: Platte River Power Authority noncarbon energy plan
  summary: Platte River staff briefed the Sustainability Advisory Board on its noncarbon goals and the next Integrated Resource Plan, due January 2028. It cannot reach 100% noncarbon by 2030, and a federal emergency order kept Craig Unit 1 from retiring. Council also appointed Longmont's electric services director to the Platte River board.
