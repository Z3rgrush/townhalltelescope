- title: 1st and Main urban renewal area, transit center and parking garage
  summary: The Urban Renewal Authority took up tax increment revenue agreements with the City, Boulder County, Northern Water, St. Vrain Valley School District and the Downtown Development Authority for the 1st and Main plan area. Council considered the urban renewal plan, lease-purchase financing for a parking garage, and a development agreement with Main Street Tebo, LLC for the 1st and Main Transit Center and transit-oriented project.
