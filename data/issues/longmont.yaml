- title: 'November 2026 ballot: public safety tax increase'
  summary: Council considered ballot language for increases in sales and use tax and property tax (up to 4.06, 3.25 and 2.44 mills in the optional ordinances) to fund police, dispatch, fire and emergency services. Council also drafted a resolution urging a yes vote and called the special election.
