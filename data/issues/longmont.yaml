  summary: Council moved through several annexations. Dry Creek (Airport Road and Clover Basin Drive) and 8513 St. Vrain Road were to be zoned Residential Mixed Neighborhood. The Longmont Gateway Northwest annexation at U.S. 287 and Park Ridge Avenue includes a comprehensive plan amendment. A neighborhood meeting notice covered a proposed annexation of a 0.88-acre church parcel at 8979 Nelson Road.
