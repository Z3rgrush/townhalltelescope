- title: Composting subsidy and sanitation rate structure
  summary: Council discussed a possible subsidy for composting services and compost rate proposals, and asked the Sustainability Advisory Board for feedback on the sanitation rate structure. Council members also wanted rates aligned with policy goals ahead of a waste rates conversation, and staff reported on solid waste collection issues in alleys.
