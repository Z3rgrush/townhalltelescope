- title: 'November 2026 ballot: public safety tax increase and charter amendments'
  summary: Council worked on ballot language for a city sales/use tax increase and property tax increases (up to 4.06, 3.25 and 2.44 mills options) for public safety, including police, dispatchers and firefighters. Charter amendments would require voter approval to sell open space, and would also cover ranked choice voting and council elections. Council also considered resolutions urging voters to vote yes on several of these measures and on a Boulder County property tax question, and called the special election.
