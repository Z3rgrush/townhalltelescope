- title: Water exchange with St. Vrain & Left Hand Water Conservancy District and drought conditions
  summary: The Water Board reviewed a one-year exchange of 148.8 acre-feet of the district's Colorado-Big Thompson water for Longmont water, helping keep more storage in Ralph Price Reservoir; the district's supply could run out by 2028 if drought continues. The board also reviewed Ralph Price Reservoir water rights management and the Dry Creek Fire near Button Rock.
  where: Ralph Price Reservoir (Button Rock Preserve)
