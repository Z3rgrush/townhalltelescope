- title: 1st and Main urban renewal plan, transit center and parking garage financing
  summary: The Longmont Urban Renewal Authority took up tax increment revenue agreements for the 1st and Main plan area with the city, Boulder County, Northern Water, the St. Vrain Valley School District and the Downtown Development Authority. City Council also considered the urban renewal plan, a lease-purchase financing of a parking garage, and a development agreement with Main Street Tebo, LLC for the 1st and Main Transit Center and a transit-oriented project.
