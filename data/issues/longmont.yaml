  summary: The Housing Authority discussed Briarwood Apartments, resigned as property manager at Zinnia, and considered multifamily housing revenue bonds and a private activity bond allocation. It also took up the voucher program plan, payment standards, 2027 budgets and a review of the countywide affordable housing tax.
