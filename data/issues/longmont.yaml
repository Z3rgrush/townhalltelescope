- title: 1st and Main urban renewal plan, transit center and parking garage financing
  summary: Council took up the 1st and Main Urban Renewal Plan, a blight finding, lease-purchase financing for a parking garage, and a development agreement with Main Street Tebo, LLC for the transit center and a transit-oriented project. The Urban Renewal Authority approved tax increment agreements with the city, Boulder County, Northern Water, the St. Vrain Valley School District and the Downtown Development Authority.
