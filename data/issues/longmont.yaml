  summary: 'Council moved through several annexations: Dry Creek (Airport Road and Clover Basin Drive, zoned R-MN), 8513 St. Vrain Road (east of Airport Road), and Longmont Gateway Northwest (Hwy 287 and Park Ridge Avenue). A neighborhood meeting was noticed for annexing a 0.88-acre church parcel at 8979 Nelson Road, and another for 10930 Airport Road amendments for new single-family homes.'
