- title: Water supply, drought and extraterritorial service
  summary: The Water Board reviewed a one-year exchange of 148.8 acre-feet with the St. Vrain and Left Hand Water Conservancy District amid limited 2026 supplies. It also reviewed Ralph Price Reservoir water rights and conveyance plats. Council considered extraterritorial water taps for Hygiene Fire Protection District's fire house and fire suppression system, and the Water Board planned a Dry Creek Fire presentation.
