- title: Water exchange with St. Vrain and Left Hand Water Conservancy District, and drought
  summary: The Water Board considered a one-year exchange of 148.8 acre-feet of Colorado-Big Thompson water so the district could cover its depletions. The district's supply could run out by 2028 if drought continues, and the exchange would let the city keep more storage in Ralph Price Reservoir. The board also reviewed Ralph Price Reservoir water rights and Dry Creek Fire impacts near Button Rock.
