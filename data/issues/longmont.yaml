- title: Longmont Housing Authority and affordable housing
  summary: The Housing Authority board discussed Briarwood Apartments, resignation of the property manager at Zinnia, multifamily revenue bonds and the 2026 voucher administrative plan. Council also assigned the city's 2026 private activity bond allocation to the authority. Boards reviewed the inclusionary housing fee-in-lieu (12% affordable units or a fee) and the countywide affordable-attainable housing tax review.
