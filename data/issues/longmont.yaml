- title: Public safety tax increase on the November ballot
  summary: Council chose between several versions of a sales and property tax increase to hire more police officers, dispatchers and firefighters, referred it to the November 3 ballot and urged voters to approve it.
  where: Citywide
  refs: [5, 18, 20]
- title: Charter amendments on ranked choice voting and open space sales
  summary: Council referred charter amendments to the November ballot to adopt ranked choice voting, change how council members are elected, and require voter approval to sell or convey open space.
