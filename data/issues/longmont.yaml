- title: Vance Brand Airport noise and future
  summary: The city held a town hall on what it can legally do about airport noise, council heard a baseline report on voluntary noise abatement and options for airport noise monitoring, and held a vision session on the airport's future, governance and rebuilding trust with neighbors.
  where: Vance Brand Municipal Airport, 229 Airport Rd
