- title: 1st and Main urban renewal plan, transit center and parking garage
  summary: Council took up an ordinance approving the 1st and Main Urban Renewal Plan and finding the area blighted, plus lease-purchase financing for a parking garage. The Urban Renewal Authority took up tax increment revenue agreements with the city, Boulder County, Northern Water, St. Vrain Valley School District and the Downtown Development Authority. Council also considered a development agreement with Main Street Tebo, LLC for the 1st and Main Transit Center and a transit-oriented project.
