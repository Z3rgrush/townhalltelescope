- title: Public safety tax increase and charter amendments on the November 3 ballot
  summary: Council referred a city sales/use tax and property tax increase for public safety (police, dispatchers, firefighters) to voters, along with Home Rule Charter amendments on ranked choice voting and requiring voter approval to sell open space. Council also considered resolutions urging 'Yes' votes on the public safety tax and open space measures, and on a Boulder County property tax ballot issue.
