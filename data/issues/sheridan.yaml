- title: Bear Creek Trailhead rezoning at 3600 S. Federal Blvd.
  summary: Council held a public hearing Aug. 10 on rezoning 3600 S. Federal Blvd. to Parks and Recreation District to allow a public trailhead and park. The city acquired the property in 2024 in partnership with the Mile High Flood District. Planning Commission unanimously recommended approval, and no members of the public came forward to testify.
