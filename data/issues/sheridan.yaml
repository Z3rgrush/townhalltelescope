- title: Subdivision plats at 2200 W. Radcliff Ave. and 2500 W. Hampden Ave.
  summary: 'Planning Commission held hearings Sept. 2 on preliminary and final plats for both properties. Council heard the 2200 W. Radcliff case Sept. 28: four industrial parcels never legally subdivided, platting is needed before permits, no development is proposed, and the applicant would dedicate 19 more feet of right-of-way.'
