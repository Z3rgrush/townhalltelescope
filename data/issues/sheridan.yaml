- title: 2027 budget and 2026 budget amendment
  summary: Council reviewed the 2027 proposed budget in work sessions (revenues, capital, open spaces, stormwater, general fund) and held a Sept. 28 public hearing where no one spoke. Ordinances 14-2026 (2026 amended budget) and 15-2026 (2027 budget) were up for second reading Oct. 12. The Redevelopment Agency also held hearings on its amended 2026 and 2027 budgets (Resolutions 4 and 5-2026).
