- title: 2026 budget, property tax levy and attorney contract
  summary: At the December 3, 2025 meeting the Town held a public hearing on the 2026 budget. Trustees were also set to consider Resolutions 6, 7 and 8-2025 to adopt the budget, levy property taxes and appropriate funds. The agenda also listed an attorney contract rate increase and a legal services contract (Resolution 5-2025).
  where: Townwide
