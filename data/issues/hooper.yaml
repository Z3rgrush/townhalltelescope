- title: Town park safety concerns and 2026 park improvements
  summary: Ramona Smith presented park safety concerns in December 2025. In March 2026 the Board planned to discuss a 2026 park grant led by Trustee Mimi Dolan, hiring a park and town maintenance employee, and placing a library box in the town park.
  where: Hooper Town Park
