- title: Temporary use permits (Ordinance 893)
  summary: Draft Ordinance 893 would create administratively reviewed temporary-use permits, generally limited to 90 days, that staff could suspend or revoke. A fee would be set by resolution, and staff could require neighbor notification case by case. A resident submitted public comment.
