- title: Outdoor sales, eating and drinking use group amendment (Ordinance 894)
  summary: The Planning Commission reviewed changes to the Use Group Table to allow outdoor sales, eating and drinking, with safety standards for activities near roadways. A resident spoke in support, and the commission moved to recommend approval of Ordinance 894.
