- title: Rezoning 242 & 252 E 5th St from General Commercial to Medium Density Residential
  summary: LandShark Investments LLC wants to rezone two sloped lots from General Commercial to Medium Density Residential to build two roughly 2,100 sq ft A-frame homes. At its Oct. 21 hearing the Planning Commission found the application met code criteria and recommended approval of Ordinance 895. Neighbors raised concerns about losing commercial flexibility and spot zoning, while another resident supported it.
