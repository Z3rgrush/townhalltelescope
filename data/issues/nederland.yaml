- title: Temporary use permits (Ordinance 893)
  summary: The Planning Commission reviewed a draft ordinance creating staff-reviewed temporary use permits, generally limited to 90 days and revocable if a use creates health or safety problems. A processing fee would be set by resolution, and staff could require neighbor notification when a use might significantly affect neighbors. A resident submitted public comment.
