- title: Rezoning 242 & 252 E 5th St from General Commercial to Medium Density Residential
  summary: LandShark Investments LLC asked to rezone two vacant lots on E. 5th Street so it can build two roughly 2,100 sq ft A-frame single-family homes, arguing the slope and site make commercial use impractical. After a public hearing on Oct. 21, the Planning Commission found the application met the code criteria and moved to recommend approval of Ordinance 895. A neighbor raised concern about losing GC flexibility in the area, and another resident spoke in support.
  where: 242 and 252 E 5th Street
