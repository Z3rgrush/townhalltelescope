- title: Moving Board of Zoning Adjustment duties to the Planning Commission (Ordinance 896)
  summary: Ordinance 896 would dissolve the separate Board of Zoning Adjustment and give its function to the Planning Commission. Discussion cited few variance applications and difficulty keeping a separate volunteer board, and noted Colorado law allows this for a statutory town.
