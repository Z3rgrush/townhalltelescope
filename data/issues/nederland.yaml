- title: Moving Board of Zoning Adjustment duties to the Planning Commission (Ordinance 896)
  summary: Ordinance 896 would dissolve the separate Board of Zoning Adjustment and give its variance functions to the Planning Commission. Commissioners cited the low number of variance applications and the difficulty of keeping a separate volunteer board filled.
