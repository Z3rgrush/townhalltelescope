- title: Flex zoning for housing and redevelopment
  summary: The Planning Commission began discussing 'flex zoning,' a concept in the Comprehensive Plan and Downtown Subarea Plan, to allow more housing types, mixed uses and affordable-housing incentives. The industrial Wolf Tongue area and General Commercial properties near East Street Garage and Mountain Auto were discussed as possible candidates, with limited infrastructure noted as a challenge.
  where: Wolf Tongue industrial area; East Street Garage and Mountain Auto area
