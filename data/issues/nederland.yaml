- title: Flex zoning for housing and redevelopment
  summary: The Planning Commission began discussing flex zoning, a concept named in the Comprehensive Plan and Downtown Subarea Plan. Options include more housing types, mixed uses, affordable housing incentives, and an overlay. The Wolf Tongue industrial area and General Commercial properties near East Street Garage and Mountain Auto were identified as candidates.
  where: Wolf Tongue industrial area and East Street Garage area
