- title: Flex zoning for housing and redevelopment
  summary: The Planning Commission began discussing a 'flex zoning' concept from the Comprehensive Plan that could broaden housing types and mixed uses and add affordable-housing incentives. The Wolf Tongue industrial area and General Commercial parcels near East Street Garage and Mountain Auto were discussed as candidates.
  where: Wolf Tongue industrial area; East Street Garage and Mountain Auto area
