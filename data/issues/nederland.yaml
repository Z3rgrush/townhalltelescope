- title: Outdoor sales, eating and drinking use table amendment (Ordinance 894)
  summary: The Planning Commission considered changes to the use group table to allow outdoor sales, eating and drinking, including safety standards for outdoor commercial activities near roadways. A commissioner moved to recommend approval of Ordinance 894 after a resident spoke in support.
