- title: Rezoning 242 & 252 E 5th St from General Commercial to Medium Density Residential
  summary: LandShark Investments LLC wants to rezone two vacant lots from General Commercial to Medium Density Residential to build two roughly 2,100 sq ft A-frame homes. The Planning Commission held a hearing on Oct 21; a neighbor worried about losing GC flexibility and spot zoning, while another resident supported it. The commission recommended approval of Ordinance 895.
