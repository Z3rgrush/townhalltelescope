- title: Allowing outdoor sales, eating and drinking (Ordinance 894)
  summary: The Planning Commission considered amending the use group table to allow outdoor sales, eating and drinking and other outdoor commercial activities, with safety standards near roadways. A commissioner moved to recommend approval of Ordinance 894, and a resident spoke in support at the Oct. 21 meeting.
