- title: Moving Board of Zoning Adjustment duties to Planning Commission (Ordinance 896)
  summary: Ordinance 896 would dissolve the Board of Zoning Adjustment and shift its functions to the Planning Commission. The commission discussed the low number of variance applications and difficulty maintaining a separate volunteer board.
