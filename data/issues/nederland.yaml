- title: Rezoning 242 and 252 E 5th Street for A-frame homes
  summary: The planning commission recommended rezoning two steep commercial lots on East 5th Street to medium density residential for two A-frame homes, after a neighbor worried about losing commercial zoning flexibility and another resident spoke in support.
  where: 242 & 252 E 5th St
  refs: [4, 9]
  public_comment: true
- title: Outdoor dining and sales rules
  summary: The town moved to allow outdoor sales, eating and drinking in its zoning use table, with safety standards near roadways.
  where: Downtown Nederland
  refs: [1, 4, 9]
  public_comment: true
- title: Temporary use permits
  summary: The planning commission and trustees worked on Ordinance 893 for staff-approved temporary use permits of up to 90 days that staff can revoke over safety problems.
  where: Townwide
  refs: [1, 6]
  public_comment: true
- title: Flex zoning for housing and redevelopment
  summary: The planning commission began discussing flex zoning to allow more housing types and mixed uses, including in the Wolf Tongue industrial area and near East Street Garage.
  where: Wolf Tongue area, East Street
  refs: [1]
- title: Parks, open space and trails master plan
  summary: The parks board finished revisions to the parks, recreation, open space and trails plan for trustees to review, and kept planning a replacement for the Chipeta Park playground.
  where: Chipeta Park
  refs: [0, 6]
- title: Merging the zoning adjustment board into the planning commission
  summary: The town moved an ordinance to dissolve its Board of Zoning Adjustment and hand its variance work to the planning commission, citing few applications and trouble filling the volunteer board.
  where: Townwide
  refs: [4, 9]
- title: Safer Main Streets crosswalk and sidewalk project
  summary: Trustees approved an engineering agreement for crosswalk and sidewalk improvements under the Safer Main Streets program, and backed the fire district's wildfire mitigation grant.
  where: Main Street
  refs: [6]
