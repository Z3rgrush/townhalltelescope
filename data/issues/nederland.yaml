- title: Temporary use permit rules (Ordinance 893)
  summary: The Planning Commission reviewed a draft ordinance creating staff-reviewed temporary use permits, generally limited to 90 days, revocable for health or safety problems, with a processing fee to be set by resolution. Neighbor notification would not be automatic but staff could require it. A resident submitted public comment.
