- title: Midland Avenue streetlights and Southside traffic concerns
  summary: Residents complained that the new catenary streetlights on Midland are not bright enough. Staff said the lights are at maximum output and they are working with the contractor. Residents also raised the single egress from Southside, a stop sign at Alexander and Fiou Lane, and a roundabout on Willits Lane for access to Crown Mountain Park.
