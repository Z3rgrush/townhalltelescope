- title: 2027 budget and town finances
  summary: Staff reported sales tax is tracking above budget, with year-to-date sales tax through May at $4.22 million. Cash generated in the first six months was about $450,000, versus $2.2 million a year earlier, and lower tap fees hit the Water Fund. A Two Rivers Road CDOT grant was deferred to 2027. Council held a budget work session on September 17 and the proposed 2027 budget was presented on September 22.
