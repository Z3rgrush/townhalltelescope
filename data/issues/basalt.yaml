- title: 'Town-owned affordable housing: BCC units, COP financing and Parcel 9'
  summary: The Town closed on six deed-restricted units in the BCC project on August 5, 2026, for $2.38 million. Council considered Ordinance 21 to finance them with Certificates of Participation, and BACH is setting rents. The Finance Committee also reviewed the pro-forma for the Parcel 9 housing project, with a funding stack of about $5 million identified.
