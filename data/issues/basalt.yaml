- title: Public Works/Police facility and 0.5% sales tax ballot measure
  summary: The Town plans a shared Public Works and Police facility on the town-owned lot at the end of East Valley Road by Highway 82, estimated at $25-26 million. Voters will see a 0.5% sales tax with a 20-year sunset on the November ballot (Ballot Issue 3A), and the Town has applied for a USDA loan. Staff say the police department is cramped, with one bathroom and no secure parking, and Council considered a resolution supporting the measure.
  where: East Valley Road at Highway 82
