- title: Shared Public Works and Police facility and 0.5% sales tax on November ballot
  summary: The Town plans a roughly $25 million shared Public Works and Police facility on the town-owned lot at the end of East Valley Road by Highway 82, recently annexed. Voters will be asked in November for a 0.5% sales tax with a 20-year sunset; the Town has also applied for a USDA loan and is considering selling the current police condo and the Annex site to offset costs.
  where: East Valley Road at Highway 82
