- title: Public Works/Police facility and 0.5% sales tax on the November ballot
  summary: The Town plans a shared Public Works and Police facility on the town-owned lot at the end of East Valley Road by Highway 82, budgeted at about $25 million. Voters will be asked in November for a 0.5% sales tax with a 20-year sunset, and the Town has applied for a USDA loan. Staff say police now work out of a cramped condo with one bathroom and Public Works operates from five sites; boards and the public have been briefed through open houses.
  where: End of East Valley Road, adjacent to Highway 82
