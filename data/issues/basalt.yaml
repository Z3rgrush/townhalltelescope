- title: 'Affordable housing financing: six condo units, Parcel 9 (Pitchview) and BACH decisions'
  summary: The Town is buying six housing units at Basalt Center Circle for $2.38 million and is moving a Certificates of Participation financing ordinance, with second reading set for August 25. Finance staff are also working through the pro forma for the Sopris Parcel 9 (Pitchview) project. BACH ruled on tenant requalification at Block 9 in Willits Town Center, letting the current tenant stay, and discussed leasing of Town-owned units.
