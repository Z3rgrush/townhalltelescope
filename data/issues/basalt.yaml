- title: 'Town-owned affordable housing: BCC units, Certificates of Participation and Parcel 9'
  summary: The Town closed on six deed-restricted units in the BCC project on Aug. 5 (contracted at $2.38 million) and is setting rents for them. Ordinance 21 would finance the purchase through Certificates of Participation. The Finance Committee is also reviewing the pro-forma for the Parcel 9 (Pitchview, rugby field) project.
