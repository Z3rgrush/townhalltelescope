- title: 2027 budget and town finances
  summary: Finance staff reported sales tax up 2.43% through May ($4.22 million) and cash generation of about $450,000 in the first half of 2026 versus $2.2 million a year earlier, with lower tap fees. A budget work session was held Sept. 17 and the proposed 2027 budget was presented Sept. 22. A COOT grant for Two Rivers Road work slipped to 2027.
