- title: 2027 budget and sales tax trends
  summary: Staff reported sales tax through May at $4.22 million, up 2.43% year over year, with cash generation in the first half of 2026 well below last year. A Two Rivers Road CDOT grant was deferred to 2027. Council held budget work sessions and heard the proposed 2027 budget on September 22.
