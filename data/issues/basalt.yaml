- title: 218 E. Valley Road (Movieland) Residence Inn hotel proposal
  summary: A revised proposal for a 93-key Residence Inn by Marriott with three deed-restricted rental affordable units on the former Movieland site, which requires PUD and annexation agreement amendments. Planning and Zoning held repeated hearings, and staff added conditions limiting use to the approved hotel. Council scheduled a site visit.
