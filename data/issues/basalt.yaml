- title: 2027 budget and town finances
  summary: Council held a budget work session Sept. 17 and received the proposed 2027 budget Sept. 22. Mid-year results show revenue tracking well, but cash generated in the first half of 2026 was about $450,000 versus $2.2 million a year earlier, and a state grant for Two Rivers Road was deferred to 2027.
