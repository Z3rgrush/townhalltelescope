- title: Public Works/Police facility and 0.5% sales tax ballot measure (Ballot Issue 3A)
  summary: The Town plans a shared Public Works and Police facility at the end of East Valley Road, estimated at about $25 million. It is asking voters in November for a 0.5% sales tax with a 20-year sunset, and Council adopted a resolution supporting Ballot Issue 3A. Staff say the police department is spread across inadequate space, and have applied for a USDA loan and are considering selling some Town properties.
  where: End of East Valley Road, adjacent to Highway 82
