- title: Electric rates and power supply
  summary: Council received notice of an electric rate increase in January and held a public hearing in March before approving Resolution 15-2026 establishing electric rates. In April it approved a contract amendment with Western Area Power Administration so MEAN can keep handling power purchases, and in February it signed a consent related to the Sandhills Energy solar project.
