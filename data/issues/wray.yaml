- title: Zoning and subdivision code rewrite (Ordinances 656 and 657)
  summary: Council gave first reading in May to Ordinances 656 and 657, which amend and repeal parts of the zoning code (Title 18) and subdivision regulations (Title 16). The Planning Commission recommended both, and they grew out of the Innovative Housing Strategies Grant project. A public hearing on the amendments was held April 21, and second readings were on the June 9 agenda.
