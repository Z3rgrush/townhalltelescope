- title: Affordable housing planning and DOLA grant for the southern district
  summary: 'Council approved a request to amend DOLA Local Planning Capacity Grant #25-085, adding $50,000 to focus on affordable housing plans for the Wray southern area. Council also appointed two members to the Wray Housing Authority Board in February.'
