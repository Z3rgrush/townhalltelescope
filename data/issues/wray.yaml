- title: Wray Civic Center construction contract
  summary: The June 9 agenda included a draft construction contract (guaranteed price) and possible award of RFP 139-2025 for Wray Civic Center construction. Council was also updated in May on a $2.1 million Congressional Directed Spending request tied to the project.
