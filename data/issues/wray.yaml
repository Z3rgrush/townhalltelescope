- title: Traffic code adoption, e-bike enforcement and traffic safety grant
  summary: Council adopted the 2024 Model Traffic Code through Ordinance 659, with second reading and a public hearing on June 9. Council approved applying for a $9,038 CDOT safety grant for the Power to Be Safe program with local schools, and discussed police enforcement of electric bikes and scooters and possible changes to the UTV ordinance.
