  summary: In January Council approved Ordinance 655 selling Lot 10 of the Wray East Industrial Park to PR Transportation, LLC. In June it considered exclusive right-to-sell listing contracts for Lots 2 and 3 of the East Industrial Park and Lots 1-6, Block 1 of the Golf Course Commercial Addition.
