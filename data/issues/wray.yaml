- title: Amphitheater revitalization
  summary: The Amphitheater Advisory Board presented a strategic plan for revitalizing the amphitheater, which Council adopted by resolution in January. In April Council approved a memorandum with the University of Colorado Denver and the Colorado Center for Community Development to help design improvements.
