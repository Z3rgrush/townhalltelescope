- title: Industrial park lot sales and listings
  summary: Council approved Ordinance 655 in January to sell Lot 10 in the Wray East Industrial Park to PR Transportation, LLC. By June it was considering exclusive right-to-sell listing contracts for Lots 2 and 3 there and for Lots 1-6 of the Golf Course Commercial Addition.
