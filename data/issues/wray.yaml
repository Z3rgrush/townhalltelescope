- title: Traffic code adoption and road safety enforcement
  summary: Council passed Ordinance 659 on first reading in May, adopting the 2024 Model Traffic Code for Colorado, with second reading and a public hearing on June 9. Council also approved a CDOT traffic safety grant application of $9,038 for a police and school partnership. Police e-bike and scooter enforcement and possible changes to the UTV ordinance were discussed.
