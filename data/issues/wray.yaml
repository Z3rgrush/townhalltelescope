- title: Electric rates and power supply
  summary: Council received notice of an electric rate increase in January and held a public hearing before approving Resolution 15-2026 setting electric rates in March. In April it amended its Western Area Power Administration scheduling contract so MEAN can keep handling power purchases. In February it also approved a consent and agreement for the Sandhills Energy solar project.
