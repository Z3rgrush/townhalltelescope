- title: Regional Housing Needs Assessment and Proposition 123 commitments
  summary: Buena Vista is part of a regional Housing Needs Assessment with Chaffee County, Salida and Poncha Springs, due to the state by the end of 2026. Trustees held work sessions and a public review on Nov. 10. Trustees also considered a Prop 123 regional affordable housing MOU and the town's 2027-2029 housing commitment.
