- title: Boys & Girls Club new facility at 710 Cedar Street
  summary: The Planning and Zoning Commission held a public hearing on the major site plan for a new Boys & Girls Club facility on a 0.729-acre town-owned lot at 710 Cedar Street. A neighbor wrote in support and asked about on-street parking. The Board of Trustees also considered a second amendment to the ground lease and assignment of the lease to Great Futures BV, Inc.
