- title: Pearl building stabilization and historic roof at St. Rose of Lima
  summary: The Town is shoring up the historic Pearl building, with the expectation of stepping away by year end. The Historic Preservation Commission also approved a roof replacement at the former St. Rose of Lima church, home to Shining Mountains Montessori, with recommendations for a closer shingle match and a State Historical Fund grant.
