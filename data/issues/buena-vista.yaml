- title: Rustic Haven cohousing site plan
  summary: The Planning and Zoning Commission held a public hearing on the Rustic Haven major site plan, a cohousing community on 2.2 acres that keeps 9 existing cabin structures (11 units). Staff recommended a water audit to confirm infrastructure can support the plan. Residents spoke in support, and a neighbor raised fence and livestock concerns.
