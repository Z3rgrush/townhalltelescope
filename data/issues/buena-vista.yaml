- title: R-2 OT zoning change for two-family and small multifamily housing
  summary: Developers from The Crossing and a resident asked the Planning and Zoning Commission to amend the R-2 OT zone to allow small multifamily and attached townhome/duplex projects, citing demand for lower price points and rents. The Commission discussed party wall standards, 3-foot side setbacks, articulation, and whether to require a special use permit for larger lots. Staff were to bring formal code amendments back, with consideration set for Nov. 4, and the Historic Preservation Commission was asked for feedback on over/under duplexes.
  where: R-2 OT zone district, including The Crossing
