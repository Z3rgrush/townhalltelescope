- title: R-2 OT duplex and small multifamily code amendment
  summary: Residents including a developer at The Crossing asked the Commission to allow two-family and small multifamily housing, including over/under duplexes across lot lines, in the R-2 OT zone. The Commission discussed party walls, 3-foot side setbacks, and special use permits for larger lots. The Historic Preservation Commission gave feedback and a public hearing on the amendment was set for Nov. 4.
