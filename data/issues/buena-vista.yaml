- title: 'Airport projects: AWOS, safety plan and hangars'
  summary: AWOS weather system bids came in high, but state funding was increased and contractors cut prices to fit available funds. The board is drafting a safety plan, tracking prairie dogs as a hazard, and planning for the 2027 Aspen airport closure. Trustees also considered a hangar improvement agreement with PCS Hangar LLC.
