- title: R-2 OT zone change to allow duplexes and small multifamily (The Crossing)
  summary: A developer at The Crossing and a resident asked the Planning & Zoning Commission to amend the R-2 OT zone to allow small multifamily and attached duplexes. The commission discussed party walls, a 3-foot side setback, articulation and possibly requiring a special use permit for larger lots, and planned a formal code amendment for consideration on 11/4/26. The Historic Preservation Commission was also asked for feedback on over/under duplexes.
  where: R-2 OT zone district, including The Crossing
