- title: 'R-2 OT zone: allowing duplexes and small multifamily (The Crossing)'
  summary: Residents including The Crossing developer Paul Andrews asked the Planning & Zoning Commission to amend R-2 OT zoning to allow small multifamily and attached townhomes for lower-priced housing. On Aug 19 commissioners discussed party walls, 3-foot side setbacks, articulation, and possibly requiring a special use permit for larger lots. Staff were to bring code amendments back, with a formal amendment on the Nov 4 agenda and Historic Preservation Commission feedback on over/under duplexes requested.
