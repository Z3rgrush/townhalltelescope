- title: 2027 town budget and fee schedule
  summary: Trustees held multiple hearings on the 2027 budget, including a $400,000 General Fund transfer to capital improvements, advisory board budget requests and public-support funding for community groups. The Water Fund keeps its current rate structure pending the rate study. The 2027 fee schedule and budget resolutions were set for adoption Oct. 27.
