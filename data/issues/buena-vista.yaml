- title: Data center moratorium and proposed prohibition
  summary: Planning staff updated the Planning and Zoning Commission on the town's data center moratorium. Code amendments must be adopted by mid-December. Staff recommends prohibiting data centers, noting the County code already prohibits them, with room to revisit once the State acts.
