- title: Short-term rental cap and Ordinance 2026-14/2026-16
  summary: The Board of Trustees held a July 28 work session on a cap for short-term rentals, then took up Ordinance 2026-14 on Aug 11 and Aug 25 and a follow-on Ordinance 2026-16 on Sept 22 amending Article VII of Chapter 6. A letter from "The Alliance" was included on the July 28 agenda. The documents do not state the final outcome.
