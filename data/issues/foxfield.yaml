  summary: Trustees followed several broken streetlights and tunnel lights, including on S Lewiston Way and Parker Road. They approved a CLI Services proposal to replace three roadway light fixtures and a fuse kit at Lewiston Way and Parker Road, with not-to-exceed pricing.
