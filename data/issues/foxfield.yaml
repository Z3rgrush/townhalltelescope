- title: '2026 road maintenance: pavement repair and additional crack sealing'
  summary: The Board discussed the 2026 Pavement Repair and Surface Treatment Program (Resolution 2026-07), including sealant quantities, budget and contingency. In October it considered an extra $6,300 for Vance Brothers crack seal (total bid $11,800) to finish all roads, leaving about $19,047 in the $46,312 road maintenance budget before the added cost.
