- title: 2026 town budget and finances
  summary: The Board held a study session and a public hearing on the 2026 budget, then adopted it. General Fund spending rose about 25%, largely for speed and traffic work. The mill levy stayed at 4.982 and the property tax levy was approved. Trustees later noted sales tax had dropped over four years and discussed vacancies at Foxfield Village Center.
