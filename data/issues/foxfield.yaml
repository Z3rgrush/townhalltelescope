- title: Street light repairs at Lewiston Way and Parker Road
  summary: The Board reviewed a CLI Services proposal to replace three roadway light fixtures and a fuse kit, with not-to-exceed pricing and deposits for projects over $5,000. Staff found it reasonable and Resolution 2026-05 was moved for approval.
