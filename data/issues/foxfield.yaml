- title: Wildfire Resiliency Code adoption and fire prevention
  summary: Trustees considered Ordinance 2026-03, which adopts the state-recommended Wildfire Resiliency Code by reference. After public hearings with no public comments, the Board approved it on August 6. Trustees also worked with South Metro Fire on outreach, a wildfire prevention training and a fire prevention meeting, and discussed the 6-inch versus 12-inch grass rule and evacuation planning.
