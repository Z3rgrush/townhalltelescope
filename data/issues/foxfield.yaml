- title: 'Road maintenance: crack seal and pavement program'
  summary: The town approved the SEH engineering fee estimate for the 2026 pavement repair and surface treatment program. Terracare asked to bid on the work, and Vance Brothers was the bidder in the earlier rounds. In October staff asked to approve an extra $6,300 for 2 more tons of crack seal, bringing the Vance Brothers bid to $11,800. Roads Maintenance Fund money remaining for 2026 is $19,047.
