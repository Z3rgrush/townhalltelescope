- title: 'Speeding and traffic calming: radar speed signs and traffic study'
  summary: The town has reviewed speed data from engineer SEH, looked at options such as radar feedback signs, speed humps and enforcement, and put $120,000 toward traffic work in the 2026 budget. In July trustees moved to buy four solar radar signs for Hindsdale and Waco, with a total cost of about $22,373. In September trustees questioned the purchase and favored a resident speeding-report tool on the town website, and Trustee Pakanati asked to revisit it with all trustees present.
  where: Townwide, including Hindsdale and Waco streets
