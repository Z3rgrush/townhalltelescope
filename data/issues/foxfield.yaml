- title: Home Rule exploration and charter timeline
  summary: The town attorney presented on becoming a home rule town. Trustees debated next steps, with one saying the process was being rushed. A timeline was laid out for an ordinance initiating the process and special elections that could put a charter before voters in 2027. The Board also discussed home rule authority and land use regulation in July.
