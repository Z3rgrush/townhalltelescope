- title: Waco Street drainage, erosion and culvert repairs
  summary: Staff presented engineering recommendations on erosion and roadway deterioration near Waco Street and Arapahoe Road. The Board debated riprap versus seeding. In September it approved a revised Terracare quote that dropped the culvert cleanout, with work scheduled for fall.
