- title: Home rule charter process
  summary: After a presentation from Town Attorney Corey Hoffmann, Trustees debated whether to start the home rule process, with some feeling it was being rushed. Staff laid out a timeline with a possible special election to form a charter commission in 2026 and a charter vote in 2027. Home rule authority and land use also came up in July.
