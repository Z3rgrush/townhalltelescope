- title: Solar radar speed signs and traffic calming
  summary: Resolution 2026-08 proposed buying solar-powered radar speed signs for about $22,373 including installation. Trustees questioned their effectiveness and chose to skip the purchase and pursue a resident speeding-report tool on the town website instead. Trustee Pakanati urged bringing it back when all trustees could be present.
