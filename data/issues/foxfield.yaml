- title: Wildfire Resiliency Code adoption (Ordinance 2026-03)
  summary: The Board worked through the State-required Wildfire Resiliency Code from spring to summer 2026, with insurance implications and enforcement through building and fire officials discussed. Ordinance 2026-03 was approved after an Aug. 6 public hearing with no public comments. Trustees also pushed wildfire education with South Metro Fire, including grass height rules and a fire prevention meeting.
