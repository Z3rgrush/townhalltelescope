- title: Waco Street drainage and culvert repair
  summary: Engineering recommendations described erosion and roadway deterioration near Waco Street and Arapahoe Road. Trustees weighed seeding versus riprap rock. In September they approved a revised Terracare quote that dropped the culvert cleanout but kept seeding and watering, with work to be scheduled for fall.
  where: Waco Street near Arapahoe Road
