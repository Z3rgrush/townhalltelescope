- title: Waco Street drainage and culvert repair
  summary: Staff presented engineering recommendations on erosion and roadway deterioration near Waco Street. On Aug 6 trustees discussed swapping seeding for riprap rock; by Sept 17 a revised Terracare quote (Resolution 2026-06) dropped the culvert cleanout, and the Board agreed to restore the area and evaluate drainage before further work, with fall scheduling.
