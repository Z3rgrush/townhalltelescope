- title: 2026 and 2027 budgets, taxes and falling sales tax
  summary: The 2026 budget, with general fund spending up about 25% mainly for speed-related items, was adopted after a hearing with no public attendance, and the property tax levy was approved (mill levy 4.982). Trustee Hodge noted sales tax has dropped significantly over four years and vacancies at Foxfield Village Center. A 2027 budget study session was set for November.
