- title: Land Use Code update (Ordinance 2026-02)
  summary: The Board held a public hearing on rewriting Articles 1-6 of Chapter 16, continued it several times and postponed it, partly using an AI (Copilot) review of the code. It passed unanimously on Aug. 6, 2026 after a hearing with no public comments.
