- title: Speeding data and radar speed signs
  summary: Trustees debated speed data, monitor placement and traffic calming after resident concerns. In July they moved to buy four solar radar signs with tracking software for Hindsdale and Waco. The roughly $22,373 purchase (Resolution 2026-08) was reconsidered in September, with a majority favoring a resident speeding-report tool on the website instead. Trustee Pakanati asked to bring it back when all Trustees could attend.
