- title: Foxfield Trustee vacancy and canceled April 2026 election
  summary: The Board canceled the April 2026 election and declared candidates elected. A trustee vacancy was expected and applicants were interviewed, with Trustee Hodge applying. Doug Hodge was sworn in as an appointed trustee in May, and trustee compensation and rules of procedure were revised.
