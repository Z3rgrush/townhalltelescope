- title: Land Use Code rewrite (Ordinance 2026-02)
  summary: Ordinance 2026-02 amends Articles 1-6 of Chapter 16 of the municipal code, the Land Use Code. The public hearing was continued several times and trustees reviewed the draft, including with an AI review. The Board approved the ordinance unanimously on August 6, 2026.
