- title: Wildfire Resiliency Code (Ordinance 2026-03) and wildfire prevention outreach
  summary: Following a public hearing with no comments, the Board moved to adopt Ordinance 2026-03, the Wildfire Resiliency Code, in line with the State's recommendation that municipalities adopt such standards. South Metro Fire Rescue also gave a wildfire prevention training presentation, and the town publicized a wildfire prevention meeting.
