- title: Fall River Village II PUD and subdivision plats
  summary: Resolutions 87-26, 88-26 and 89-26 on the Fall River Village II PUD and plats were continued from July 28. The hearing was re-opened Aug 11, with staff noting code and state statute deadlines that would deem the application approved if no action was taken.
