- title: Visit Estes Park 2027 operating plan
  summary: VEP presented its 2027 operating plan with proposed revenues of $11.68 million, $6.45 million of it 6E funds passed to the Town. The Town Board and County Commissioners commended it; the Town Board is to act on November 10.
