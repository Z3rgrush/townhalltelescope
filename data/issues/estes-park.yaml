  - Ethics & transparency
- title: Parks and Open Space Master Plan
  summary: The final draft plan covers 11 parks, 2 natural areas and 2 town parcels, and found 76% of households are within a 15-minute walk of a park. About 890 people gave feedback, including students. Board members asked for an urban forestry element and more dog parks, and staff said implementation depends on funding.
  where: Townwide
  refs:
