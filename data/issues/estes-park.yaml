- title: Feather flag temporary sign rules
  summary: The Board reviewed Ordinance 15-25, which temporarily allowed feather flags without permit or fee, limited to one per lot up to 12 feet tall, and not in residential zones or downtown. Members were split on whether to charge a fee and require a permit or make the rules permanent.
