- title: 'Development Code rewrite: housing density bonuses and rezoning criteria'
  summary: The 50% draft Development Code would set housing definitions, density and height bonuses, and lower parking minimums for qualifying projects; EPHA said 1.2 to 1.4 spaces per unit suffices for its properties, while some board members worried about fewer than two per unit. The Board also reviewed new rezoning criteria tied to the Estes Forward Future Land Use Plan. The rewrite continues into 2027.
