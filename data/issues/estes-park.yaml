- title: Annexation of Fawn Valley and Highway 7 enclaves
  summary: Staff reviewed costs and benefits of annexing two enclaves. Estimates were $50,000 for a consultant to prepare maps and legal descriptions, about $12,750 a year in sales tax and $1,900 in property tax, and $2,400 a year for 25 years for road work on Chalet Ridge Court. Highway 7 area surveys drew four responses opposed and one in favor, and staff will research who owns an unannexed gap parcel.
