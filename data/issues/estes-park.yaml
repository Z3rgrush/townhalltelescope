- title: Dark Sky certification and draft lighting ordinance
  summary: Visit Estes Park pitched International DarkSky Community certification as a tourism draw. Board members raised concerns about a draft lighting ordinance requiring residential properties to switch to compliant fixtures within ten years. Members asked for examples from other certified communities.
