- title: Parks and Open Space Master Plan
  summary: The final draft plan covers 11 parks, two natural areas and two town parcels, drew feedback from about 890 people, and found 76% of households are within a 15-minute walk of a park. Board members asked for an urban forestry element, dog parks and ongoing updates; implementation depends on funding.
