- title: 2027 Town budget and 2027–2031 Community Improvement Plan
  summary: Budget study sessions in October reviewed the 2027 budget, which plans to use $1.775 million of fund balance for capital items and projects revenue 5% over 2025 actuals. The CIP holds $37.66 million in projects, including Events Center lighting, Wonderview Avenue trail extension, Children's Park remodel and stormwater work. Staff pay raises and a 15% health insurance increase were also covered.
