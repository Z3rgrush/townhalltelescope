- title: 'Water: Windy Gap units, administrative penalties and Colorado-Big Thompson subcontract'
  summary: The Board declined to buy Windy Gap water units from Platte River Power Authority, since the Town doesn't need them and would have had to buy two units for nearly $10 million. Staff proposed administrative fines to enforce repair of surface water lines, and set dates for water rate hearings. The Board also pulled for discussion the C-BT subcontract extension with YMCA of the Rockies and the effort to include Town water customers in the Northern Water district.
