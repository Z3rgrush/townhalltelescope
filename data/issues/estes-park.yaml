- title: Parking license plate recognition policy
  summary: Staff presented a draft policy for license plate recognition at Town-owned paid parking, with data kept one day unless tied to a citation. Prohibited uses include enforcing federal immigration law and monitoring First Amendment activity. The Board asked for the policy to come back for consideration and discussed limiting private LPR use.
  where: Town-owned paid parking areas
