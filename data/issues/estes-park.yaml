- title: Water administrative penalties, Windy Gap units and Colorado-Big Thompson subcontract
  summary: Water staff proposed administrative fines to enforce repair of leaking surface lines. The Board declined its right of first refusal to buy Windy Gap water units from Platte River Power Authority, which would have cost nearly $10 million for two units. A Colorado-Big Thompson subcontract extension with the YMCA of the Rockies and Northern Water was pulled for discussion of incorporating Town water customers into the district.
