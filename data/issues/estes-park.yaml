  topics:
  - Parks & open space
  - Recreation & trails
  public_comment: true
- title: Dark Sky lighting ordinance and certification
  summary: Visit Estes Park presented on pursuing International DarkSky Community Certification and a draft Lighting Ordinance. Board members questioned requiring residential properties to comply with Dark Sky fixtures within ten years and how Rocky Mountain National Park's status affects certification.
