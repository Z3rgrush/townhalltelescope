- title: 'Water: administrative penalties, Colorado-Big Thompson subcontract and NCWCD incorporation'
  summary: The Board reviewed an administrative fine policy to enforce repair of leaking surface water lines. It also pulled the Colorado-Big Thompson subcontract extension with YMCA of the Rockies for discussion, along with the plan to incorporate Water Division customers into the Northern Colorado Water Conservancy District. Water rate hearing dates were set and a Trout Haven water lease approved.
