- title: Fire district funding and Town budget
  summary: A resident raised Estes Valley Fire Protection District funding, and the Town Administrator clarified the Board had not discussed cutting current funding. The Board also heard Larimer County budget shortfalls and prepared for a joint study session with the county commissioners.
