- title: Feather flag sign rules
  summary: The Board discussed whether to extend or make permanent the temporary allowance for feather flags under Ordinance 15-25, with one flag per lot, 12-foot height limit, and a ban in residential zones and downtown. Members were split on whether to require a fee and permit.
