- title: Rezoning review criteria amendments
  summary: Staff proposed amending Development Code Section 3.3 so rezonings must be consistent with the Future Land Use Plan of the Estes Forward Comprehensive Plan, replacing the 'change in conditions' criterion, along with a second new criterion.
