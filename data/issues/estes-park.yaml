- title: Housing needs, Housing Action Plan and Housing Authority
  summary: Residents urged the Board to address workforce housing, including a list of people in immediate need. The Housing Authority is struggling with recruitment, drew 14 applicants for three board seats, and is working on its funding plan and 2027 budget. A Housing Assessment Addendum and Housing Action Plan came before the Board Sept 22.
