- title: Annexation of Fawn Valley and Highway 7 enclaves
  summary: Staff reported costs and benefits of annexing two enclaves, including a $50,000 consultant cost for the map and legal description, about $12,750 a year in added sales tax and $1,900 in property tax. Neighbors surveyed on Highway 7 responded four against and one in favor. Staff will research who owns an unannexed gap parcel that would first need to be annexed.
  where: Fawn Valley and Highway 7 enclaves, including Chalet Ridge Court
