- title: Fall River Trail final segment construction
  summary: The Board approved a $3,553,992.20 construction contract with FNF Construction and $114,500 for construction management. A trustee questioned the wide range of bids, and the engineer said the Town's estimate was conservative and half the bids exceeded it.
