- title: Parking license plate recognition policy
  summary: Staff presented a draft policy for license plate readers in paid parking, with data kept one day unless tied to a citation. It bars use for immigration enforcement, First Amendment monitoring or data sales. The Board asked for the policy to return and discussed limiting private LPR use.
