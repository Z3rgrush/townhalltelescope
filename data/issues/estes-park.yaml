- title: Workforce housing, Housing Action Plan and 6E funding
  summary: The Board heard public concern about housing and seasonal workforce needs, received the Housing Assessment Addendum and Housing Action Plan, and approved Resolution 105-26, the 2027 Workforce Housing and Childcare Funding Plan for 6E lodging tax funds. The Estes Park Housing Authority is also gathering data on seasonal housing and has board vacancies being filled.
