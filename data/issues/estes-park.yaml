- title: Annexation of Fawn Valley and Highway 7 enclaves
  summary: 'Staff reported costs and benefits of annexing two enclaves: about $50,000 for a consultant map, plus $12,750 per year in sales tax and $1,900 in property tax revenue, and $2,400 a year for 25 years to bring Chalet Ridge Court up to Town standard. Four responses opposed and one favored annexation of the Highway 7 enclave; staff will research an unowned gap parcel. Olympus Lodge annexation and water access also came up in budget talks.'
