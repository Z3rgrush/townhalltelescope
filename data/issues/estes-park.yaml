- title: Parks and Open Space Master Plan
  summary: Staff presented the final draft plan covering 11 parks, two natural areas and two town parcels; 76% of households are within a 15-minute walk of a park. Board members asked for an urban forestry program, more dog parks and wildlife conflict reduction, and staff said implementation depends on funding. The draft was available for public comment.
