- title: Housing definitions, density bonuses and parking in the draft Development Code
  summary: The Town Board reviewed the 50% draft Development Code's housing definitions, base densities, density and height bonuses, and lower parking minimums for qualifying projects. The Estes Park Housing Authority said 1.2 to 1.4 spaces per unit would work for its properties, while some board members worried about going below two cars per unit. Related housing needs were also raised in public comment and the Housing Assessment and Action Plan.
