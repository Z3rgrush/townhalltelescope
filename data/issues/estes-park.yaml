- title: Fall River Village II PUD and subdivision plats
  summary: Resolutions 87-26, 88-26 and 89-26 on the Fall River Village II PUD and subdivision plats were continued from July 28, and the public hearing was re-opened on August 11. Staff noted the Development Code and state statute require action within 30 days or the application is deemed approved.
