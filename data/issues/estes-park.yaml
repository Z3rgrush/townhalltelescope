- title: 'Development Code update: 50% draft, new zoning districts and housing density bonuses'
  summary: Headwaters Planning presented the 50% draft of the Development Code update, which adds Mixed-Use and Open Space districts, more housing types in multi-family and mixed-use zones, and density and height bonuses for workforce housing. Staff noted a split between affordable-housing advocates and residents wanting to keep current densities. The Board also discussed lower parking minimums (EPHA said 1.2 to 1.4 cars per unit would suffice) and, on Sept 8, new rezoning review criteria in Section 3.3.
