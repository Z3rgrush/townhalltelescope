- title: Micromobility devices and feather flag sign rules
  summary: Police proposed four changes to Municipal Code Chapter 9 to clarify rules for micromobility devices such as e-bikes and scooters. The Board also weighed whether to make temporary feather flags permanent, with a one-per-lot limit, 12-foot height cap and setbacks, and was split on requiring a fee and permit.
