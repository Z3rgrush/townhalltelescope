- title: Rifle Business Incubator Center branch and 2027 budget
  summary: The City asked the Grand Junction Business Incubator Center to price creating and running a Rifle branch focused on downtown startups. The current budget has $100k for it, and the finalized proposal raises the request to $137k, with a USDA grant request mentioned. It was to feed into the Council budget workshop on October 21, 2026.
