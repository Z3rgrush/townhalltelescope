- title: 'Municipal code text amendments: warehouses, ADUs, site plans, variances'
  summary: Staff proposed splitting the warehouse definition into Local and Regional types allowed in light industrial and industrial zones, plus changes to ADU size, height, lot line and variance application rules. The ADU ordinance (No. 20) was on the Nov. 4 Council agenda, and the Planning Commission also took up site plan requirements.
