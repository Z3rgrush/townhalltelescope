- title: Centennial Park riparian restoration and RESTORE grant
  summary: The city is partnering with the Middle Colorado Watershed Council on a $130,000 federal RESTORE grant application toward construction documents for Centennial Park improvements. The Parks board gave a unanimous letter of support, and Council was to consider applying on Nov. 4. The Parks board also heard about Rifle Creek watershed habitat restoration and Raynard Ditch invasive removal and fire mitigation.
