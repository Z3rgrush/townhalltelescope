- title: Draft 2026 Comprehensive Plan update
  summary: Planning Commission reviewed a partial draft of the first comprehensive plan update since 2019, which will guide development for the next 5-10 years. The state-required strategic growth and water supply elements are still being prepared, and staff asked for feedback on direction.
