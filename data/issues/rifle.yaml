- title: Parks and Recreation plans, budget and park projects
  summary: The Parks board took up the 2027-2028 Strategic Plan, the 2027 budget request, a Metro Pool weather closure policy, and letters of support for grants for the Centennial Park riparian restoration and a CPW outdoor equity program. A skate park comment was on the October agenda, and a bike rack for Rifle Mountain Park was on the list.
