- title: Rifle Community Foundation restructuring
  summary: After the president's resignation, the foundation discussed simplifying operations to focus on grant review and awards, and recommended to Council a possible move under city administration. It also reviewed a dozen grant requests, including $30,000 from Discovery Cafe, and planned to fill a board vacancy.
