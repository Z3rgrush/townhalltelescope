- title: 'Rifle Municipal Code text amendments: ADUs, warehouses, site plans'
  summary: Staff proposed multiple Chapter 16 code changes, including ADU size requirements, height, lot line amendments and variance application rules. They would split warehouse into Local and Regional categories for industrial zones. The ADU ordinance (No. 20) was on the Nov. 4 Council agenda.
