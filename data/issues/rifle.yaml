- title: 'Municipal code amendments: ADUs, warehouses, site plans and variances'
  summary: Staff proposed multiple text amendments to the Rifle Municipal Code, including ADU size requirements, splitting warehouses into Local and Regional categories (with size limits and zones), height requirements, lot line rules, site plan requirements and variance applications. An ADU ordinance had a public hearing before City Council Oct. 21.
