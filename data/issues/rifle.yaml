- title: GRIT downtown grants, façade improvements and wayfinding
  summary: The GRIT board funded four grant applications totaling $22,200 and considered façade improvement grants for 126 W. 4th Street and ProMex at 233 Railroad Ave. It also discussed downtown wayfinding consultant selection, a proposed Third Street shade structure (about $20,000-$30,000 for roughly 400 sq ft), the 2027 GRIT budget, and a lodging-tax-funded participatory budgeting pilot.
