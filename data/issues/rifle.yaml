- title: Data center / Bulk Resource Consumer permit rules (Ordinance No. 21)
  summary: Rifle is drafting a conditional use permit pathway for data centers and other 'bulk resource consumers' limited to industrial districts, requiring utility, water, noise, fiscal and decommissioning analyses and allowing denial if there is no net public benefit. Planning Commission discussed it in August and September, Council discussed it Oct. 14, and Ordinance No. 21 (Chapter 16 standards) was set for first reading Nov. 4.
