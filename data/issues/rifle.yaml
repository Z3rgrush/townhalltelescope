- title: GRIT downtown grants, facade improvements and wayfinding
  summary: The GRIT board approved four grants totaling $22,200 for local events, and considered facade grants for 126 W. 4th Street and ProMex at 233 Railroad Ave. It also reviewed the 2027 GRIT budget, a downtown wayfinding consultant, a Third Street shade structure (about $20,000-$30,000 for ~400 sq ft) and a participatory budgeting pilot funded by lodging tax.
