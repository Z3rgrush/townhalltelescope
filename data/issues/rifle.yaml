- title: GRIT façade grants and downtown improvements funded by lodging tax
  summary: The GRIT board approved four grants totaling $22,200 and considered façade grants for 126 W. 4th Street, ProMex Bakery (233 Railroad Ave) and the Rifle CoWork. Council took up the ProMex and CoWork awards on Nov. 4. The board also reviewed the 2027 GRIT budget, a participatory budgeting pilot, wayfinding consultant selection, and a Third Street shade structure estimated at $20,000 to $30,000.
  where: Downtown Rifle, 233 Railroad Ave and 126 W. 4th St
