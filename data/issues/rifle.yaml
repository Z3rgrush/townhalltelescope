- title: Rifle Community Foundation restructuring under the city
  summary: After the resignation of board president Kasey Nipsel, the foundation discussed becoming a city board rather than a separate 501(c)(3), focused on grant decisions. It reviewed about a dozen grant requests, including $30,000 for Discovery Cafe, and a new online application and city webpage.
