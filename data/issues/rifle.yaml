- title: Warehouse definitions and other Municipal Code text amendments
  summary: Staff proposed splitting the 'warehouse' definition into Local and Regional types (20,000 sq ft threshold) allowed in light industrial and industrial zones, after inquiries about where large warehouses can locate. The package also covers ADU size, height, lot line and variance application requirements and site plan rules. The ADU ordinance was set for a City Council public hearing October 21.
