- title: 2026 Comprehensive Plan update
  summary: A draft update of the 2019 comprehensive plan was reviewed by the Planning Commission on Oct. 27 and by City Council on Nov. 4. It projects demand for roughly 1,800 to 2,200 more housing units over 20 years. The state-required strategic growth and water supply elements are still being prepared.
