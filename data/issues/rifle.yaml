- title: Rifle Community Foundation restructuring and grant awards
  summary: After the board president's resignation, the Foundation recommended becoming a board under the City instead of a separate 501(c)(3), focused on grant decisions. It reviewed about a dozen grant requests, including $30,000 from Discovery Cafe and $6,250 from Health Solutions West.
