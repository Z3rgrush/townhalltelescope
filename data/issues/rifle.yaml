- title: Data center / bulk resource consumer permit rules
  summary: Community Development drafted a Conditional Use Permit framework for data centers and other bulk resource consumers, limited to industrial districts. It would require utility, water, noise, fiscal, emergency response, thermal, housing and decommissioning analyses, and let the city deny projects that can't show net public benefit. Planning Commission and Council discussed it, and Ordinance No. 21 was set for first reading on Nov. 4.
