- title: Draft 2026 Comprehensive Plan
  summary: Staff presented a draft update of the 2019 comprehensive plan to the Planning Commission (Oct. 27) and City Council (Nov. 4). The draft projects a need for roughly 1,800 to 2,200 additional housing units over 20 years, and still needs the state-required water supply and strategic growth elements.
