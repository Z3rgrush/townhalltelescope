- title: Data center and Bulk Resource Consumer permit rules
  summary: Staff began getting inquiries about data centers in Rifle and brought forward a draft Conditional Use Permit pathway for data centers and other 'bulk resource consumers' that use large amounts of electricity and water. The draft would limit them to industrial districts and require utility, water, noise, fiscal and decommissioning analyses, with discretion to deny projects that show no net public benefit. The Planning Commission discussed it in July, August and September, and City Council took it up October 14.
