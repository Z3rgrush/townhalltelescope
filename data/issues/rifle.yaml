- title: GRIT downtown grants, façade program and wayfinding
  summary: The GRIT board handled façade grants funded by lodging tax for ProMex Bakery (233 Railroad Ave) and the Rifle CoWork. The $40,000 program had $18,043.75 left, so the two requests would exceed it by $1,329.88, and members discussed covering the gap from beautification savings. The board also discussed a $40,000 downtown wayfinding contract, a Third Street shade structure estimated at $20,000-$30,000, a participatory budgeting pilot, and the 2027 GRIT budget.
  where: Downtown Rifle, Railroad Ave and Third Street
