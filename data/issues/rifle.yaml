- title: Data center / Bulk Resource Consumer conditional use permit rules
  summary: Community Development drafted a conditional use permit framework for data centers and other "bulk resource consumers" limited to industrial districts. It would require utility, water, noise, fiscal, emergency response, thermal, housing and decommissioning analyses and let the city deny projects that can't show net public benefit. The Planning Commission discussed it Aug. 25 and Sept. 29, and City Council took it up Oct. 14.
