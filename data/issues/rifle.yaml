- title: Centennial Park riparian restoration and RESTORE grant
  summary: The city is partnering with the Middle Colorado Watershed Council on a federal, no-match RESTORE grant request of $130,000 for construction documents for Centennial Park creek restoration. The Parks board gave unanimous support, and Council considered applying on Nov. 4. The parks board also heard about Rifle Creek habitat restoration and Raynard Ditch invasive removal and fire mitigation.
