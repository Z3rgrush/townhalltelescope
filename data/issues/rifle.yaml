- title: Rifle Community Foundation restructuring and grants
  summary: After the resignation of board president Kasey Nipsel, the foundation discussed simplifying operations to focus on grant review and recommended that Council restructure it under City administration. It also reviewed about a dozen grant requests, including $30,000 for Discovery Cafe, and a new electronic grant application.
