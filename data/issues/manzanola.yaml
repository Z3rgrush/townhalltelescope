- title: 'Water plant storage study, Well #2 testing and water system mapping'
  summary: 'Engineers GMS (Tom McClernan) have been working on a water plant storage study, which moved to a PER with flow and chemical tests on Well #2. The town is also considering a $15/month Diamond Maps system from Colorado Rural Water to map valves, meters and hydrants. A report noted 84% water loss in April 2026.'
  where: Manzanola water plant
