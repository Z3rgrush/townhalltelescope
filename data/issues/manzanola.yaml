- title: 112 S. Canal brownfield cleanup and demolition
  summary: CDPHE awarded a Targeted Brownfields Assessment for 112 S. Canal, and the town later applied for grants. By spring 2026 the demolition was out for bid, and Earth Services & Abatement was named contractor, with the grant contract still to be awarded.
