- title: 112 S. Canal brownfield cleanup and demolition
  summary: CDPHE awarded a Targeted Brownfields Assessment with a consultant and abatement contractor for 112 S. Canal. The town sought grants, put demolition out for bids, and picked Earth Services & Abatement as contractor; the grant contract was still pending in the fall.
