- title: 'Water plant storage study, Well #2 testing and water loss'
  summary: 'Council has followed a GMS water plant storage study, which moved to a preliminary engineering report with flow and chemical tests on Well #2. Staff reported 84% water loss in April, and drought water restrictions were adopted by Resolution 2026-02.'
