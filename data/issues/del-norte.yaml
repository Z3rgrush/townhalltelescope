- title: Outdoor Entertainment Overlay District (Ordinance 789)
  summary: The town held public hearings, first in September and again on October 14 at the Rio Grande Hospital Wellness Center, on creating an Outdoor Entertainment Overlay District. The ordinance would set the district boundaries and amend the use chart (Table 16-4A) of the municipal code. It was on the October 14 agenda for action.
