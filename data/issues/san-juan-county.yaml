- title: 2027 Town-County law enforcement contract with the Sheriff
  summary: The agenda includes the 2027 contract under which the San Juan County Sheriff patrols the Town of Silverton, enforces town code and investigates traffic accidents, running January 1 to December 31, 2027. The Town's budgeted payment was $340,000 in 2025 (about $31,516 a month) and $31,993 a month in 2026; the contract is dated December 15, 2026.
