- title: Red Lady Avenue and Sixth Street roundabout
  summary: The town is designing a roundabout at Red Lady Avenue and Sixth Street on Highway 135, where the intersection operates at LOS E in peak hours, below CDOT standards. In June 2026 Council considered a cost-sharing request from the Gunnison Watershed School District, a partner in design cost sharing.
