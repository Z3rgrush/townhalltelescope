- title: Gunnison to Mt. Crested Butte Corridor Plan with Gunnison County
  summary: Council held a work session on Aug. 4 to hear from Gunnison County on the Gunnison to Mt. Crested Butte Corridor Plan and Transportation Strategy. Council has been working since April on the Town's key values and priorities for the plan and on its requests for the county agreement (MOU).
  where: Gunnison to Mt. Crested Butte corridor
