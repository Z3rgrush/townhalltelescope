- title: Affordable housing strategy and town home purchases
  summary: 'Council reviewed the town''s affordable housing portfolio and adopted a 5-year Housing Strategy, with amended 2026 housing guidelines. The town authorized purchases of homes on Gothic Avenue (816, 818, 810, 806 #5A) and 16 Ninth Street, and moved to sell a unit at 16 Ninth Street. It also handled the Whetstone and Paradise Park housing projects.'
