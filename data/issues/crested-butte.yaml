- title: Non-primary home excise tax ballot question
  summary: Council reviewed draft ballot language and a resolution for a Non-Primary Home Excise Tax on Aug. 4. On Aug. 17 it took up a resolution calling a Nov. 3, 2026 election and an intergovernmental agreement with the Gunnison County Clerk and Recorder on running it.
