- title: Non-primary home excise tax and long-range financial planning
  summary: Facing structural budget pressures that rely heavily on sales tax, Council worked through 2026 financial planning sessions on new revenue, including an excise tax on vacant or underused homes and a longevity-based property tax rebate at $1.0M-$1.5M revenue levels. Draft ballot language was reviewed August 4, and a resolution calling a November 3, 2026 election was on the August 17 agenda. A 2027 Budget Advisory Committee was also discussed.
