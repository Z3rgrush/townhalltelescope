- title: Zoning and land-use code rewrite (Ordinances 12-16)
  summary: Council heard Ordinances 12 through 16 on first reading Aug. 4 and on second reading Aug. 17. They repeal Appendix A and amend Chapter 18, amend Chapter 16, and repeal and replace the official Town zoning map. A related resolution (No. 21) updates the fee schedule to match the revised code, and a joint work session was held with the Board of Zoning and Architectural Review.
  where: Townwide
