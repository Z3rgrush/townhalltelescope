- title: Red Lady Avenue and Sixth Street roundabout
  summary: The town is designing a roundabout at Highway 135/Sixth Street and Red Lady Avenue, where the intersection runs at level of service E at peak hours. In June the Gunnison Watershed School District asked for a cost-sharing discussion on the project.
