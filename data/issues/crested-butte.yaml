- title: Zoning and subdivision code rewrite (Chapter 16) with affordable housing incentives
  summary: Council and the Board of Zoning and Architectural Review worked through a full rewrite of the town's zoning and subdivision code from Nov 2025 to Aug 2026. The work covered residential and commercial districts, Belleview Avenue and Sixth Street incentives tied to deed-restricted space, and the Resident Occupied Affordable Housing (ROAH) program. A final draft was reviewed June 15, with a proposed effective date of September 1, 2026. Ordinances 12-16, including a new official zoning map, went to first reading Aug 4 and second reading Aug 17.
