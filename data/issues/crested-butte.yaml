- title: Zoning code rewrite and new Chapter 16 land development code
  summary: Council and BOZAR held joint work sessions from February to June 2026 on a full zoning and subdivision update covering residential, commercial and mixed-use districts, incentives, and PUDs. Ordinances 12-16 of 2026, including a new zoning map and Chapter 16 amendments, had second readings August 17; staff had proposed a September 1, 2026 effective date.
