- title: Elk Avenue street closures for special events
  summary: Council reviewed special event applications that close Elk Avenue and nearby streets, including the People's Fair on Sept. 5-6 and a championship event with a liquor permit. It also reviewed Crested Butte Bazaar closures of the Four-Way parking lot on Aug. 29 and Oct. 3.
  where: Elk Avenue, 2nd to 5th Street; Four-Way parking lot
