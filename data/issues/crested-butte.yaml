- title: Five-year Housing Strategy and town housing purchases
  summary: 'Council reviewed the town''s affordable housing portfolio, then took up adoption of the 5-year Housing Strategy in May. The town also approved purchases of units and properties on Gothic Avenue (816, 818, 810, 806 #5A), 16 Ninth Street, sale of 16 Ninth Street #3A, and amended affordable housing guidelines.'
