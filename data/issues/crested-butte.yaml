- title: Non-primary home excise tax and long-range financial planning
  summary: Staff described structural budget pressures from heavy reliance on sales tax and asked Council about an excise tax on vacant or underused homes and a resident property tax rebate. Council reviewed revenue options of $1.0M and $1.5M. Draft ballot language was discussed Aug 4, and a resolution calling a November 3, 2026 election was on the Aug 17 agenda along with a 2027 Budget Advisory Committee.
