- title: Code enforcement, trash and property ordinance updates
  summary: Hugo adopted ordinances on penalties for violations and code enforcement authority, and contracted Willdan for code enforcement services. A trash ordinance revision is coming in August and staff are applying for a DOLA Local Planning Capacity Grant for an abandoned and dilapidated property ordinance. The Board also approved an automated vehicle identification system ordinance.
