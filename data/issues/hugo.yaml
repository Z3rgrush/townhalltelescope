  - 1
  - 3
  public_comment: true
- title: Water and sewer rate and fee changes for 2027
  summary: The October 13 agenda includes Resolution 2026-13 amending water, wastewater and refuse rates beginning January 1, 2027, and Resolution 2026-14 adopting a fee schedule effective that date.
  where: Townwide
  refs:
  - 3
- title: Well pump replacements and GMS water and sewer projects
  summary: Council approved the Water Technology Group submittal for well pump replacements in September. It also continues to approve monthly GMS draws for sanitary sewer and water projects, including a CDBG item in August, with an all-projects update on the October agenda.
  where: Hugo water and sewer system
  refs:
  - 0
  - 1
