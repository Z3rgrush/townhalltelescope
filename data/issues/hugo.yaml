- title: Water restrictions and CRWA water rate study
  summary: Town water restrictions were in place over the summer and lifted automatically October 1. Colorado Rural Water Association is preparing a rate study, with a presentation planned for September and then on the October 13 agenda. Residents asked about watering times, such as earlier hours to reduce evaporation.
  where: Townwide
