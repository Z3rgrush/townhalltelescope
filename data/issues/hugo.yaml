- title: 'Ordinance updates: trash, wildfire code, abandoned buildings and code enforcement'
  summary: Council tabled the 2025 Wildfire Resiliency Code (Ordinance 295), raised maximum code-violation penalties, authorized a code enforcement officer, and worked on a revised trash ordinance due in August. It approved a Willdan agreement for code enforcement services and applied for a DOLA Local Planning Capacity Grant to update the abandoned and deteriorated property ordinance.
