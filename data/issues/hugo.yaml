- title: Water and sewer system improvements, loans and grants
  summary: Hugo is financing water system work with a Colorado Water Resources and Power Development Authority loan of up to $5,395,767, plus a CDBG grant and WPCRF projects handled by GMS. Water tank repair and well pump replacements moved ahead. Sewer loans, including one up to $1,559,900 and a principal forgiveness loan, were on the November agenda.
