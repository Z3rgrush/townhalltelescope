- title: Water and sewer rate study and 2027 fee schedule
  summary: Colorado Rural Water Association is preparing a rate study, and the council is considering resolutions to change water, wastewater and refuse rates and the fee schedule effective January 1, 2027. A backflow prevention program review found many businesses were not inventoried.
