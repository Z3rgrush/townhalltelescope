- title: Roundhouse Estates infrastructure and impact fees
  summary: GMS was approved to study Roundhouse Estates and a tap fee study. The infrastructure was reported as improperly built, mostly sewer, roads and drainage, and a lift station was ordered. Impact fees per lot were suggested for new development.
