- title: 'Water and sewer rate study: 40% water and 28% sewer increases proposed'
  summary: Colorado Rural Water Association's rate study found Hugo is spending savings to service debt in both enterprises. It estimates a 40% water rate increase and 28% sewer rate increase, plus annual inflation increases, to cover operations and debt. The council also adopted a resolution amending water, wastewater and refuse rates in October and reviewed a rate study timeline in August.
