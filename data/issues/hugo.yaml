- title: New Hugo firehouse and Fire Protection District land
  summary: A plan for a new firehouse was presented in March. Council denied adding the fire department driveway to the CDOT sidewalk project, then approved Ordinance 301 disconnecting Fire Protection District land from the town and waived one water and one sewer tap at the district's property at 5th Street and 9th Avenue.
