- title: New firehouse and Fire Protection District land
  summary: A new firehouse plan was presented in March. The Board disconnected tracts owned by the Hugo Fire Protection District via Ordinance 301 and waived one water and one sewer tap at 5th Street and 9th Avenue. Earlier the Board declined to add the fire department driveway to the CDOT sidewalk project.
