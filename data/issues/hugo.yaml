- title: Backflow prevention program
  summary: Colorado Rural Water Association reviewed the state backflow program, which has been in effect since 2016. They found many businesses were not inventoried. A resident raised concern about the cost and difficulty of installing a device at the RV Park.
  where: Townwide, including the RV Park
  refs:
  - 0
  public_comment: true
- title: Hugo Main Street designation
  summary: Council passed a resolution supporting Hugo becoming an official Colorado Main Street Community. A steering committee is working on bylaws, board roles and strategic priorities. A Main Street Live project has geotech and survey work in progress.
  where: Downtown Hugo
  refs:
  - 1
  - 3
- title: Abandoned and dilapidated building ordinance update
  summary: The town is applying for a DOLA Division of Housing Local Planning Capacity Grant to hire a consultant to update its abandoned and deteriorated property ordinance. Staff will work with Willdan on other ordinance updates, and Willdan was approved for code enforcement services.
  where: Townwide
  refs:
  - 1
  - 3
- title: 2027 budget workshop and strategic plan
  summary: Council holds a 2027 budget review and workshop on October 19. The draft strategic plan will be reviewed there.
