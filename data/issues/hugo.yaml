- title: Water, sewer and trash rates and 2027 fee schedule
  summary: The Town is working with Colorado Rural Water Association on a rate study. Resolutions 2026-13 and 2026-14 would set water, wastewater and refuse rates and a fee schedule effective January 1, 2027. GMS also was approved to do a tap fee study and impact fees were discussed for new development.
