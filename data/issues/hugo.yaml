  - 4
- title: Hugo Housing Authority compliance and new housing
  summary: The Housing Authority chair reported hiring staff to train a new business manager to bring it into compliance. It must be fully compliant before asking the town for a grant partnership. Economic development is also waiting on contractor numbers for possible new housing, with new DOLA Housing funding for demolition.
