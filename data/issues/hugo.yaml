- title: Water system improvements, loans and grants
  summary: The Town approved a Colorado Water Resources and Power Development Authority loan of up to $5,395,767 for water facilities. It also held CDBG and WPCRF hearings on the Water System Improvements Project, with design underway for water tank repairs, well pump replacements and other GMS-managed work. Board also approved a sewer lift station purchase for Roundhouse Estates and project draws.
