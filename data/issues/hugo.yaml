- title: Affordable housing, daycare and Housing Authority
  summary: Council adopted Resolution 2026-07 on expedited review for affordable housing projects. County economic development reported on possible new housing and a child care mini-center, and a land donation for daycare was discussed. The Hugo Housing Authority sought help with plumbing repairs and is working toward compliance before asking for a grant partnership with the town.
