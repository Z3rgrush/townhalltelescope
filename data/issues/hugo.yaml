- title: Water restrictions and water share shortage
  summary: Hugo went to Level One water restrictions to stay within its state water allocations, after LAWMA explained the Town owns only common shares. The Town leased two preferred shares, replaced the restriction ordinance (Ordinance 300), and passed emergency Ordinance 302 on watering hours and days after a resident objected to three-days-in-a-row watering. Restrictions lifted October 1.
