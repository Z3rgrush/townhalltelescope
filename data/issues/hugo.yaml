- title: Water restrictions and water share limits
  summary: With LAWMA explaining that Hugo owns only common (not preferred) shares, the town imposed Level One watering restrictions, leased two preferred shares, and replaced the restriction ordinance (Ordinance 300). In July council adopted emergency Ordinance 302 changing permitted watering days and hours after residents such as Tom Lee objected to watering three days in a row. Restrictions lift automatically October 1, and staff report the town is on track to stay under its allotment.
