- title: Water system improvements, CDBG and state loans for water and sewer
  summary: The town held public hearings on a CDBG grant and a Water Pollution Control Revolving Fund project, took on a water loan of up to $5,395,767, and is moving a Water System Improvements Project toward bidding in December. Water tank repair, well pump replacement and sewer loans (including one up to $1,559,900 and a principal forgiveness loan) are also in progress.
