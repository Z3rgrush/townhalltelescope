- title: Solomon Addition / Roundhouse Estates infrastructure problems and impact fees
  summary: Staff and engineers reported that infrastructure in the Solomon Addition/Roundhouse Estates was improperly constructed, mostly sewer, roads and drainage, and presented repair options in October. The town also discussed charging system impact fees per lot on new development, and ordered a lift station for Roundhouse Estates.
