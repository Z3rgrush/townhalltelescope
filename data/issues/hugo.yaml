- title: Water restrictions and water supply shortfall
  summary: Hugo went under Level One water restrictions to stay within its water allocations after LAWMA explained the town owns only common shares. Council replaced the restrictions ordinance (Ordinance 300) and passed emergency Ordinance 302 changing watering days and hours after a resident objected to watering three days in a row. The town leased two preferred shares, and restrictions lifted October 1.
