- title: Broomfield Town Square site plan revocation
  summary: Councilmembers Twiss and Peterson asked in September to consider starting a revocation hearing for the Broomfield Town Square Site Development Plan. The Land Use Review Commission held a hearing on Oct. 26 with public speakers; its recommendation vote was 5 to 2 (the minutes show motions both for and against revocation). Council took up a Notice to Show Cause (Resolution 2026-133) on Oct. 13.
  where: Broomfield Town Square
