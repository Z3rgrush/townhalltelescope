- title: Broomfield Town Square site plan revocation / Notice to Show Cause
  summary: On Sept. 22 Councilmembers Twiss and Peterson asked Council to consider starting a revocation hearing for the Broomfield Town Square Site Development Plan. On Oct. 13 Council took up a Notice to Show Cause (Resolution 2026-133). The documents do not state an outcome.
