- title: 'November 3 ballot: lodging tax and Xcel franchise agreement'
  summary: Council referred a lodging tax question to the Nov. 3, 2026 election and later considered resolutions supporting Ballot Item 1A (lodging tax) and 1B (Broomfield-Xcel franchise agreement). Council also approved election IGAs and heard an update on 2026 ballot measures, including a proposed DA term-limits question.
