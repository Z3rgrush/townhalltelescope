- title: 2026 revised and 2027 city budget
  summary: Council reviewed the proposed revised 2026 and 2027 budgets through department presentations in study sessions, a public hearing on Oct. 13, and budget resolutions on Oct. 27. Budgets for the Urban Renewal Authority, Arista Local Improvement District and Flatiron Improvement District were also up. The library board noted the 2027 budget is flat and worried about longer-term erosion.
