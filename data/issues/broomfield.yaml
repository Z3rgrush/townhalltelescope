- title: 2026 revised and 2027 City and County budgets
  summary: Council reviewed the draft 2026 revised and 2027 operating and capital budgets, the long range financial plan and department budget presentations. A public hearing was set for Oct. 13 and budget resolutions for the City and County, BURA, Arista Local Improvement District and Flatiron Improvement District were scheduled for Oct. 27. The library was told its 2027 budget is flat.
