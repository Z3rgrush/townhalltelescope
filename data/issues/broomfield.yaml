- title: Hospital developments in North Park and Northlands (AdventHealth and UCHealth)
  summary: The Land Use Review Commission recommended approval, 6-0, of the North Park Filing No. 8 Replat A final plat and site plans, including the AdventHealth hospital. It also recommended the UCHealth hospital site plan in Northlands Filing No. 1 Replat C, with an added condition. An Anthem Ranch resident spoke at the hearing.
