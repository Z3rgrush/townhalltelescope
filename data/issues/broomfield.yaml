- title: 2026 revised and 2027 operating and capital budgets
  summary: Council reviewed the economic and fiscal update, draft budgets and long range financial plan, held department budget presentations in September, and scheduled an Oct. 13 public hearing on the 2027 budgets. The Library Advisory Board was told the 2027 library budget is flat, with concern that it could erode over the longer term.
