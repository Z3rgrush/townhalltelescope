- title: 'Affordable housing: Prop 123 opt-in, expedited review and inclusionary housing'
  summary: Council discussed opting in to the next Proposition 123 cycle with DOLA and creating an expedited review process for affordable housing, then took up the Cycle 2 opt-in resolution on Sept. 22. Staff also updated Council on the housing needs assessment and the status of an inclusionary housing ordinance, and the Housing Alliance gave its annual update.
