- title: AdventHealth and UCHealth hospital developments
  summary: The Land Use Review Commission recommended approval 6 to 0 of final plats and site development plans for an AdventHealth hospital in North Park Filing No. 8 and a UCHealth hospital in Northlands Filing No. 1. A resident from Anthem Ranch spoke on the AdventHealth request. A commissioner asked for an added condition on the UCHealth plan. City Council and the urban renewal authority were scheduled to consider the plans on Nov. 10.
  where: North Park Filing No. 8 and Northlands Filing No. 1
