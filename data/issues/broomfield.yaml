- title: Broomfield Town Square revocation hearing
  summary: Two council members asked council to start a revocation hearing for the Broomfield Town Square site development plan, and council took up a notice to show cause in October.
  where: Broomfield Town Square
  refs: [26, 32]
- title: 2027 operating and capital budgets
  summary: Council heard economic and fiscal updates, the long-range financial plan and department budget presentations, then held a public hearing on the 2027 operating and capital budgets.
  where: Citywide
  refs: [9, 18, 25, 27, 32]
- title: Lodging tax and Xcel franchise on the November ballot
  summary: Council referred a lodging tax question to the November 3 ballot and passed resolutions supporting it and the Broomfield-Xcel franchise agreement.
  where: Citywide
  refs: [7, 26]
- title: Affordable housing, Prop 123 and inclusionary housing
  summary: Council discussed opting into the next Prop 123 cycle with an expedited review for affordable housing, opted in, and heard a housing needs assessment update and the status of an inclusionary housing ordinance.
  where: Citywide
  refs: [3, 18, 21, 26]
- title: Transit-oriented density rules and Front Range Passenger Rail
  summary: Council weighed how to comply with the state transit-oriented communities law requiring more density near transit and considered a rail station plan for Front Range Passenger Rail.
  where: Areas near transit stations
  refs: [3, 7]
- title: Public hearings before cutting outdoor recreation facilities
  summary: Council passed a code change requiring a public hearing before a site plan amendment can reduce or eliminate outdoor recreation facilities.
