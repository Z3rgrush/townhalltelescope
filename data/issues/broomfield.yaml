- title: 'Housing: needs assessment, inclusionary housing and Proposition 123'
  summary: Council heard the Broomfield Housing Alliance annual update and a youth housing presentation. A study session covered the 2026 Housing Needs Assessment and inclusionary housing ordinance status. Council also considered opting in to Proposition 123 Cycle 2 and a Prop 123 fast-track review ordinance (first reading Oct. 27).
