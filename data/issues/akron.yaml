- title: Water system improvements project, DWRF loan and DOLA grant
  summary: A hearing reviewed the town's water system, which has arsenic, nitrate and uranium issues requiring treatment upgrades. Rates would need to rise an estimated $13 to $18 per month. Council also considered a new DOLA-EIAF grant application of up to $1,000,000.
