- title: Washington County Housing Authority housing project, water review and MOU
  summary: The Council reviewed a County Housing Authority request for a water review of a Title 13 subdivision, held special housing meetings in August and September, and discussed a proposed MOU with the Washington County Housing Authority (drafts dated 9/8 and 11/6). It was on the agenda again for negotiation on Nov. 2 and for possible action on the MOU on Nov. 9.
