- title: Water system improvements and DWRF loan, DOLA grant application
  summary: A Drinking Water Revolving Fund public hearing covered the aging cast iron, PVC and asbestos cement distribution system and problems with arsenic, nitrate and uranium in well water. The estimated rate increase is $13 to $18 per month. Council also considered a new DOLA Energy Impact grant application of up to $1,000,000 recommended by GMS.
