- title: Sanitary sewer collection system replacement and WPCRF loan
  summary: A public hearing described replacing failing sewer lines, including a severely corroded cast iron line under the railroad that would get a new crossing. A DOLA CDBG grant of about $700,000 is already awarded, with more from principal forgiveness and a CDPHE loan. The average monthly sewer bill would need to be about $55, a $13 increase.
  where: Townwide, sewer line under the railroad
