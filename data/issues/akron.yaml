- title: Sanitary sewer collection system replacement and WPCRF loan
  summary: A public hearing covered replacing aging sewer lines, including a badly deteriorated cast iron line under the railroad. A DOLA CDBG grant of about $700,000 is already awarded, with principal forgiveness and a CDPHE loan to follow. The average sewer bill would need to reach about $55, a $13 increase.
  where: Townwide, sewer line under the railroad
