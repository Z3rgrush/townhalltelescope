- title: Washington County Housing Authority housing project and Proposition 123 expedited review
  summary: Council took up a Washington County Housing Authority housing project over several meetings, including special housing meetings in August and September, a water review request under the subdivision title, and a proposed MOU with the Housing Authority dated 9/8/26. On Aug. 10 it considered Resolution 26.09 to create an expedited review process for qualified affordable housing projects under Proposition 123.
