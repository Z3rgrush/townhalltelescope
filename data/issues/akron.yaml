- title: Town Manager settlement and DOLA-funded position succession plan
  summary: Council took up a possible settlement with the Town Manager in executive session on Aug. 18. In November, DOLA told the Council that Energy Impact grant no. 9540, which funds the town manager position, steps down from 75% to 50% to 25% and requires a plan to keep funding the job. Mayor Bowin said Council needs more time to review the contract and plan.
