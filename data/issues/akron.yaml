- title: Town manager settlement and funding of the position
  summary: Council considered a settlement with the Town Manager in executive session and possible action in August, and appointed a successor to a vacated trustee seat. In November DOLA said the Energy Impact grant funding the manager position phases down from 75% to 25% and expires in June, and asked for a plan to sustain it. The mayor said the council needs more time to address a succession plan.
  where: Town Hall
