- title: 2026 budget and mill levy adoption
  summary: After a public hearing with no public comment, council adopted the 2026 budget and appropriations (Resolutions 2025-9 and 2025-10), including a general property tax levy and funds for water and sewer. Discussion touched on a crack-fill machine for streets and a supplemental fund to be handled once the generator project price is complete.
