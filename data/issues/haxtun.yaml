- title: 2026 town budget adopted
  summary: After a public hearing on Dec. 1, 2025 with no public comment, the Council adopted the 2026 budget and appropriation resolutions (2025-9 and 2025-10). The general property tax levy brings in $189,144, and the final property assessment set the mill levy slightly above the estimate. Staff also raised a crack-filling machine for streets and a supplemental fund tied to the generator project.
