- title: Regional Housing Needs Assessment and affordable housing efforts
  summary: Commissioners reviewed the final 2026 Regional Housing Needs Assessment, done with Buena Vista, Poncha Springs and Salida, and the Planning Commission held an affordable housing work session. The county also agreed to be fiscal host for a state asbestos-removal grant for River Village Mobile Home Park with Chaffee Housing Trust, and approved a $25,000 lodging-tax-funded fee reimbursement for the park.
