- title: Airport land lease, new development area and 2027 projects
  summary: The airport board discussed a new land lease at length, with members of the public commenting. The 2027 budget requests include removing the old fuel farm (about $48,000 eligible), a well for the new development area, a master drainage plan and Taxiway A rehabilitation design. The terminal roof has been leaking during rainstorms.
