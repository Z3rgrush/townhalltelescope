- title: Water court opposition and Monarch Mountain Lodge water
  summary: The county ratified a statement opposing water court case 2026CW3107, a change of water rights application by Colorado Parks and Wildlife and the Wildlife Commission. Commissioners also said they would help people relying on water at Monarch Mountain Lodge get their water turned back on. Closed-door legal discussion covered Monarch Mountain Lodge, Forest Service Road 295 litigation and 7856 County Road 152.
