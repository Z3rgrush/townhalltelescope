- title: Housing needs assessment, River Village Mobile Home Park and affordable housing funding
  summary: Commissioners reviewed the final 2026 Regional Housing Needs Assessment done with Buena Vista, Poncha Springs and Salida. They agreed to serve as applicant and fiscal sponsor for a DOLA asbestos-removal grant for River Village Mobile Home Park, with Chaffee Housing Trust. A $25,000 lodging-tax reimbursement for the park's planning and building fees was also on the agenda. The Planning Commission scheduled an affordable housing work session.
