- title: 2027 tourism marketing budget and Destination Management Council
  summary: The Destination Management Council worked on the 2027 tourism budget, marketing plan, a five-year strategic plan and a response memo to the Colorado Tourism Office about a perceived conflict of interest. Lodging tax revenue was reported up 18% in unincorporated areas, and commissioners were to discuss a recommendation on website and AI enhancements funding.
