- title: Airport land lease, development area and 2027 budget
  summary: The Airport Advisory Board discussed a new land lease at length, plans for a new development area, and the 2027 airport budget. Budget items include old fuel farm removal (about $48,000 eligible for reimbursement), a well for the development area, a master drainage plan and Taxiway A rehabilitation design. Residents Ray and Ann Plumb and Barry Cole commented.
