- title: River Village Mobile Home Park rehabilitation and housing grants
  summary: The County agreed to act as applicant and fiscal sponsor for a DOLA Division of Housing asbestos-removal grant, with Chaffee Housing Trust implementing rehabilitation of units at River Village Mobile Home Park. Commissioners also took up a $25,000 reimbursement to the Housing Trust from the lodging tax reallocation fund for planning and building fees at the park.
