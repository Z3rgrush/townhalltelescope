- title: Corrigan Rezone in Garfield (Hwy 50)
  summary: A rezone of several parcels at 22420 and 22435 Hwy 50 in historic Garfield from Residential Rural to Mixed Use Rural would make them eligible for commercial lodging. The Planning Commission heard from neighbors who raised spot zoning, noise, unpermitted structures, fire and septic concerns, and the application went to the County Commissioners for a public hearing on Oct 20. The rezone is described as a remediation of a land use code violation.
  where: 22420 and 22435 Hwy 50, Garfield
