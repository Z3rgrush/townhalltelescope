- title: Corrigan Rezone near Hwy 50 in Garfield
  summary: The Planning Commission heard an application to rezone Corrigan properties so they could apply for commercial lodging zoning. Staff described it as remediation of a land use code violation; neighbors raised spot zoning, noise, septic, driveway safety and unpermitted structures. Commissioners discussed spot zoning, and the County Commissioners' Nov. 10 agenda lists Resolution 2026-37 granting the rezone.
  where: Garfield, W Hwy 50 area
