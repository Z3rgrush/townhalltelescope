- title: Wildfire response, forest health and Common Ground grants
  summary: The Common Ground advisory committee reviewed grants including year 3 of 4 for the National Forest Foundation's Sawatch Range Restoration Project, Hands for Lands, and a no-cost extension to 2027 for the Williams and Hamm Ditch project. The county also supported local fire districts' state wildfire mitigation grant applications and updated its community wildfire protection plan, while the Willow Fire burned nearby in Lake County.
