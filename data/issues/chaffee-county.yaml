- title: Corrigan Rezone in Garfield (22420 and 22435 Hwy 50)
  summary: The Planning Commission heard a request to rezone several parcels in the historic Garfield townsite from Residential Rural to Mixed Use Rural so the properties could apply for commercial lodging. Staff said the rezone would remedy a land use code violation. Neighbors raised spot zoning, noise, unpermitted structures, wastewater and fire-safety concerns, and the owner spoke in support. A public hearing was on the Commissioners' October 20 agenda.
  where: 22420 and 22435 Hwy 50, Garfield
