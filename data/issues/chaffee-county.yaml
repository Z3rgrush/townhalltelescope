- title: Housing needs assessment, Housing Trust and River Village grant
  summary: Commissioners reviewed the final 2026 Regional Housing Needs Assessment done with Buena Vista, Poncha Springs and Salida. They agreed to serve as applicant and fiscal sponsor with the Chaffee Housing Trust for a DOLA asbestos removal grant to rehabilitate units at River Village Mobile Home Park, and a 2027-2028 Chaffee Housing Authority funding agreement was on the Nov. 10 agenda. The Planning Commission scheduled an affordable housing work session.
