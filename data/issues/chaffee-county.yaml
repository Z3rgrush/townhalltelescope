- title: Corrigan Rezone in Garfield (Hwy 50)
  summary: The Planning Commission heard a request to rezone several parcels at 22420 and 22435 Hwy 50 in the historic Garfield townsite from Residential Rural to Mixed Use Rural so they can apply for commercial lodging. Staff described it as remediation of a land use code violation; neighbors raised spot zoning, noise, unpermitted structures, septic and fire concerns, while the owner said he wants to help with housing. The matter went to a Commissioners public hearing on October 20.
  where: 22420 and 22435 Hwy 50, Garfield
