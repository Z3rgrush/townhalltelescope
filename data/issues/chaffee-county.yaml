- title: Airport land lease, 2027 budget and projects
  summary: The airport advisory board discussed a new land lease at length, with members of the Plumb family commenting. The 2027 airport budget includes old fuel farm removal (about $48,000 eligible for grant funding), a well, a master drainage plan and Taxiway A rehabilitation design; the new fuel farm and Taxiway A extension projects are nearly closed out.
