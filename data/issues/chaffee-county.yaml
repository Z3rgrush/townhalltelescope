- title: Tourism marketing budget and Colorado Tourism Office conflict-of-interest memo
  summary: The tourism board worked on the 2027 tourism budget, a five-year strategic plan and a memo responding to the Colorado Tourism Office's "perceived conflict of interest." Lodging tax is up 18% in unincorporated Chaffee County for January to July. Commissioners were to discuss the Destination Management Council's recommendation for website and AI enhancements.
