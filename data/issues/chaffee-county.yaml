- title: Wildfire response and forest health grants
  summary: Chaffee County helped Lake County with the Willow Fire and the emergency council reported dry conditions. Commissioners wrote support letters for Forest Restoration and Wildfire Risk Mitigation grant applications from Chateau Chaparral, Colorado Firecamp, Chaffee County Fire Protection District and Salida Fire Department. A work session item covered a letter to the Public Utilities Commission on Xcel and Black Hills wildfire mitigation.
