- title: Town Center Plaza redevelopment and a 1-cent shopping district sales tax
  summary: Federal Realty presented a $59.8 million makeover of Leawood Town Center Plaza and Town Center Crossing and asked for a Community Improvement District adding a one-cent sales tax for up to 22 years to raise about $35.6 million.
  where: 119th St & Nall Ave (Town Center)
  refs: [9]
- title: March 2027 mail-ballot vote on a street and stormwater sales tax
  summary: The council called a mail ballot election for March 2, 2027 on a new 1/8-cent city sales tax for ten years to fund streets, stormwater and public safety.
  refs: [6]
- title: 2027 budget, capital plan and exceeding the revenue-neutral rate
  summary: Leawood held public hearings on its 2027 budget, a 2027-2031 capital improvement program and a property tax rate above the revenue-neutral rate, and also revised council pay.
  refs: [6]
- title: State Line Road access changes at 85th Terrace to 86th Terrace
  summary: A study of cut-through traffic and crashes near State Line Road weighed turn restrictions and a median closure; residents on 85th Terrace, 86th Street and 86th Terrace split in a survey and spoke at committee.
  where: State Line Rd, 85th Ter to 86th Ter
  refs: [4]
  public_comment: true
- title: Indian Creek floodplain plan and a berm near Leawood City Park
  summary: The stormwater committee reviewed an Indian Creek floodplain master plan from Mission Road to State Line, including a berm near Mission Road and I-435 and fill around City Park; possible buyouts are unfunded.
  where: Indian Creek, Mission Rd to State Line Rd
  refs: [2, 12, 16]
- title: Rooted and Reaching comprehensive plan and the future of 135th Street
  summary: Leaders worked through the draft comprehensive plan's open questions, including redevelopment, housing choice and the long-term vision for the 135th Street corridor; planners also discussed loosening mixed-use ratios.
  where: 135th St corridor
  refs: [11, 15]
- title: Safe Streets Leawood (Vision Zero) plan
  summary: A federally funded safety plan presented crash data, resident requests for traffic calming and speed enforcement, and proposed fixes like protected left turns and curb extensions.
  refs: [5]
- title: New townhomes and brownstones near 133rd-135th Streets
  summary: The council approved plans for Leawood Market Center Townhomes and Village East Brownstones near 135th Street.
  where: 133rd-135th St & Kenneth Rd / Pawnee Ln
  refs: [16, 8]
- title: Sidewalks in the 2027 residential street rebuilds
  summary: Staff presented plans to add sidewalks as part of the 2027 residential reconstruction program.
  refs: [8]
- title: Sign rules for construction and temporary signs
  summary: The planning commission held hearings on development ordinance amendments for temporary signs and signs during construction, later adopted by the council.
  refs: [1, 8]
- title: Public art along Tomahawk Creek Parkway (Art Line Leawood)
  summary: The public art committee named the Tomahawk Creek Parkway collection Art Line Leawood and revised sites in the public art master plan.
  where: Tomahawk Creek Pkwy
  refs: [0]
