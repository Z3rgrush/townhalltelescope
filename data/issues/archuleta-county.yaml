- title: Archuleta County Comprehensive Plan update
  summary: Consultant HRGreen is updating the county Comprehensive Plan, including the Strategic Growth and Water Supply chapters. At the Oct. 22 Planning Commission meeting, members asked about outreach (only one public meeting planned before the draft) and state deadlines, and a resident urged the plan to focus on growth and housing costs.
