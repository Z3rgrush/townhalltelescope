- title: LPEA transmission line to Trujillo Substation
  summary: La Plata Electric Association applied for a Board Conditional Use Permit for about 2,700 feet of 115 kV double-circuit line (initially run at 69 kV) with seven poles up to 75 feet tall, to power the approved Trujillo Substation. The land is zoned Agricultural Ranching and the commissioners held a public hearing.
  where: 2140 County Road 500
