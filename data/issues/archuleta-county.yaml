- title: LPEA transmission line to Trujillo Substation (PLN-26-028)
  summary: La Plata Electric Association applied for a Board Conditional Use Permit for about 2,700 feet of 115 kV double-circuit transmission line (initially operated at 69 kV) with seven poles up to 75 feet tall. It would serve the approved Trujillo Substation, on Agricultural Ranching parcels at 2140 County Road 500. A public hearing was set for the Oct. 27 commissioners meeting.
  where: 2140 County Road 500
