- title: Archuleta County Comprehensive Plan update
  summary: Consultant HRGreen briefed the Planning Commission on the purpose, timeline and status of the County's Comprehensive Plan update. Commissioners asked about having only one public outreach meeting and about meeting state deadlines for water supply and strategic growth elements. Resident David Laufer urged that the plan focus on strategizing for growth rather than preservation, citing low incomes compared to housing costs.
  where: Countywide
  refs:
  - 5
  topics:
  - Zoning & development
  - Housing
  - Government operations
  public_comment: true
