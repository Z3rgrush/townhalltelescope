- title: County fair and rodeo planning
  summary: A planning committee approved entertainment bookings and accepted an LPEA STEM program, though LPEA cannot give a cash sponsorship this year because of wildfire mitigation. It also worked on a rodeo contractor RFP, beer garden applications with Rotary, and sponsorships, with about $57.1k of a $58.5k contractual services budget estimated.
