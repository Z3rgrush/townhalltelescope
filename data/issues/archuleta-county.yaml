- title: Comprehensive Plan Update
  summary: Consultant HRGreen presented the purpose, timeline and status of the county's Comprehensive Plan update to the Planning Commission. Commissioners asked about outreach (only one public meeting is scoped) and state deadlines for water supply and growth elements, and the plan can be adopted in pieces. A resident argued the plan should focus on growth and affordability.
