- title: Comprehensive Plan Update with HRGreen
  summary: Consultant HRGreen presented the purpose, timeline and status of the county's Comprehensive Plan update to the Planning Commission. Commissioners asked about having only one public outreach meeting and about state deadlines for water supply and growth elements; the plan can be adopted in pieces. Resident David Laufer urged that the plan focus on growth rather than preservation, citing low incomes compared with housing costs.
  where: Countywide
