- title: 2027 city budget and labor contract adjustments
  summary: Council has been reviewing 2027 department budgets since August. After Cargill and the Teamsters agreed on a labor contract, the city changed its budget timeline to give departments time to adjust. Police are seeking a records technician, and the Oct. 20 agenda covers the capital improvement, conservation trust and perpetual care funds plus the schedule of fees.
