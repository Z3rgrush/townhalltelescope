- title: Special use permit for upstairs living space at 305-307 Main St.
  summary: The Planning Commission took up a special use permit for a new residence above a tattoo shop in the downtown overlay district. Council approved it Sept 15; the state health department requires a separate outdoor entrance to the living space. No public comments were received.
