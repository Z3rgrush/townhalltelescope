- title: Electric rate increase (Ordinance No. 1338)
  summary: Following a rate study presented in May, council passed first reading on Aug. 18 and held a public hearing Sept. 1. Resident Cynthia Ruppel opposed the increase, and council approved second reading of Ordinance No. 1338, saying the city passes on its power purchase costs.
