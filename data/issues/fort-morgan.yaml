- title: Police chief departure and interim chief appointment
  summary: Several residents told Council on Oct 6 they were upset by the former chief's departure and the private way it was handled, and urged hiring a new chief. The Oct 20 agenda includes appointing Steve Brown as Interim Police Chief.
