- title: 2027 budget process
  summary: Council has been reviewing 2027 department expense budgets over several meetings. The city manager said the direction would be adjusted after Cargill and the Teamsters agreed on a labor contract. The police department asked for a records technician. The Oct. 20 agenda covers the capital improvement, conservation trust and perpetual care funds and the fee schedule.
