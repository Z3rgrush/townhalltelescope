- title: Electric rate increase (Ordinance No. 1338)
  summary: Utilities Director Doug Linton presented a rate study and an ordinance raising electric rates. Notices went out July 31 and the first reading was approved Aug. 18. After a Sept. 1 public hearing where resident Cynthia Ruppel opposed the increase, council approved the second reading. The city said it buys power and passes the cost on to customers.
