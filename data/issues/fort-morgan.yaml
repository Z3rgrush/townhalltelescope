- title: Police chief departure and interim chief appointment
  summary: At the Oct. 6 meeting, many residents criticized the council over the former police chief's departure and urged a quick hire of a new chief. The Oct. 20 agenda includes appointing Steve Brown as Interim Police Chief and a personnel executive session with a check-in with the interim chief.
