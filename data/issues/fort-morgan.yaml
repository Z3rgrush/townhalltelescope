- title: Ordinance No. 1338 electric rate increase
  summary: Council reviewed a rate study and passed the first reading of an electric rate increase on Aug 18, with notices mailed to customers July 31. After a Sept 1 public hearing where resident Cynthia Ruppel opposed it, Council approved the second reading of Ordinance 1338. The utility says it passes along the cost of purchased power.
