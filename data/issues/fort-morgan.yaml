- title: Main Street historic landmarks at 325, 327 and 329 Main St.
  summary: Council designated three downtown buildings as local historic landmarks on Aug 4, with the 329 Main building becoming the 33rd landmark. The Historic Preservation Board also gained appointees and will discuss a state historic preservation residential tax credit rule change.
