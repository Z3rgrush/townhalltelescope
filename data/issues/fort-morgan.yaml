- title: 2027 city budget
  summary: Council has been hearing 2027 department budgets through August to October, including Community Services, General Fund, Fire, and the Capital Improvement, Conservation Trust and Perpetual Care funds plus the fee schedule. The manager said the schedule was adjusted after Cargill and the Teamsters agreed on a labor contract. The Police Department asked for a records technician.
