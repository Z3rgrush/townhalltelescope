- title: Historic landmark designations on Main Street
  summary: Council approved local historic landmark designations for 325, 327 and 329 Main Street, the 329 building being the 33rd local landmark. The former Fort Morgan Times building was among those designated. The Historic Preservation Board also filled seats and is tracking changes to federal Section 106 rules and the state residential tax credit program.
