- title: Electric rate increase (Ordinance No. 1338)
  summary: Following a rate study presented in May, council passed first reading on Aug. 18 and held a Sept. 1 public hearing. Resident Cynthia Ruppel opposed the increase. Council approved second reading, with the city saying it passes on its power purchase costs.
