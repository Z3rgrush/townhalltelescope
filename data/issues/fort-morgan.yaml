  summary: Council was told the aquatic facility design, budget and timeline are unchanged, with excavation set to begin this fall. An ordinance authorizing Certificates of Participation to fund it had first reading Oct 6, and Ordinance 1339 was set for second reading and a public hearing Oct 20.
