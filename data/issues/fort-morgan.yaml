- title: Police chief departure and interim chief appointment
  summary: At the Oct. 6 meeting, many residents criticized how the former police chief left and the council's handling of it. Some praised the police department and urged hiring a new chief. The Oct. 20 agenda includes appointing Steve Brown as Interim Police Chief and an executive session personnel check-in with him.
