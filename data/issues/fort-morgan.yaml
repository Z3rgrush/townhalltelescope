- title: Police Chief Loren Sharp's departure and interim chief
  summary: Residents packed public comment on Oct. 6 and Oct. 20 to criticize how former Chief Loren Sharp left and to ask that he be rehired or a new chief be hired promptly. Council unanimously appointed Deputy Chief Steve Brown as Interim Chief on Oct. 20. One speaker urged revisiting the 2019 2E initiative on police oversight.
