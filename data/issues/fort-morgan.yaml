- title: Aquatic facility design and certificates of participation financing
  summary: Council received an update on the aquatic facility design, with budget and timeline unchanged and excavation set to begin this fall. An ordinance authorizing certificates of participation to fund it had its first reading Oct. 6. The second reading and public hearing on Ordinance 1339 are set for Oct. 20.
