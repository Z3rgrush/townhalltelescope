- title: Main Street historic landmark designations
  summary: Council approved local historic landmark status for 325, 327 and 329 Main Street, the 33rd local landmark. The buildings are being remodeled with the Main Street Advisory Board. The Historic Preservation Board is tracking federal Section 106 changes and a state tax credit rule change.
