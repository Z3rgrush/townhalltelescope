- title: 2027 budget, mill levy and fee schedule
  summary: Council reviewed department expense budgets in August and September, with the City Manager adjusting direction after Cargill and Teamsters agreed on a labor contract. The Nov. 3 agenda includes the 2027 fee schedule and first reading of the budget and mill levy ordinance, with a public hearing set for Nov. 17.
