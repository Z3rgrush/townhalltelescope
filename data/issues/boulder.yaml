- title: November 2026 city ballot measures (bonds, vacancy tax, firefighter bargaining, downtown authority)
  summary: Council gave second reading to ordinances sending several questions to the November 3, 2026 ballot. They cover general obligation bonds for recreation and safety infrastructure, a Vacancy Excise Tax on homes occupied 183 days or less, a charter amendment for firefighter collective bargaining, and formation of a Boulder Downtown Development Authority with tax increment financing. Council later set the order of the ballot measures and discussed supporting a county ballot measure.
  where: Citywide
