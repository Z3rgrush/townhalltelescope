- title: Annexation of 1275 Cherryvale Rd. and 5995 McSorley Ln.
  summary: A petition would annex about 5.43 acres at these two properties with initial RR-2 residential-rural zoning. The item was removed from the August 20 agenda and came back October 1 for first reading, with a public hearing set for November 12, 2026.
