- title: Affordable housing financing for Harvest34 and Boulder Housing Partners
  summary: Council considered assigning $7,333,256 of 2026 private activity bonds to Boulder Housing Partners for permanently affordable rental housing. It also considered approving a public approval certificate for BHP to issue multifamily housing revenue bonds for the Harvest34 project.
