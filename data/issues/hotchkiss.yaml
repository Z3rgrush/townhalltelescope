- title: Master Plan, housing and accessory dwelling units
  summary: The Planning Commission approved the final Master Plan in April. Trustees discussed the difficulty of finding housing, and the Planning Commission is drafting possible accessory dwelling unit requirements for R-1 zoning, expected after the new year.
