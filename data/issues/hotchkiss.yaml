- title: Drought restrictions, water moratorium and bulk water standpipe
  summary: In February the board passed an emergency ordinance (2026-01) pausing new out-of-town water taps and limiting sales from the town standpipe. In April and May it discussed drought restrictions, Resolution 2026-04, and raising bulk water rates to $12 per thousand gallons outside the 81419 ZIP code. Water rates and the standpipe were sent to a separate work session.
