- title: Hiring a Town Administrator and Town Attorney
  summary: After months of interim leadership, the Town used a search firm (KRW Associates) and executive sessions to recruit an administrator. Kimberly States was appointed on June 25, 2026 and her appointment was ratified in October. The Town also sought proposals for and appointed a new Town Attorney (Sarah Ross), and passed Ordinance 2026-04 defining the administrator's powers.
