- title: Ordinance 2026-07 on demonstrations and special events in public rights-of-way
  summary: The board took up an ordinance setting content-neutral safety, access and permit requirements for demonstrations and special events on public rights-of-way. Residents commented, and the board approved it on August 27. In September the parade permit process had to change, and the board waived the permit for the North Fork Miners homecoming parade.
