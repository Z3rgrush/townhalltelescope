- title: Piñon Road alley dispute and unplatted property claim
  summary: A resident said property near 4th Street and Lorah Lane is in the Dukes Unplatted area with no legal plat or title, and had filed a complaint with the police chief. In October the Board considered executive session on the Piñon Road alley dispute, involving threatened litigation and settlement negotiations.
