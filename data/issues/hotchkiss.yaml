  public_comment: true
- title: Proposed town park on Bridge Street
  summary: Council discussed forming a committee or task force to research whether a town park on Bridge Street is viable and feasible. The Town Attorney said no resolution is needed to form it. A resident wrote and spoke against it, saying the town has enough parks and the property should host a revenue-generating business.
  where: Bridge Street
  refs:
  - 0
  public_comment: true
- title: Police vehicle transfer to Technical College of the Rockies
  summary: Council discussed transferring low-mileage police vehicles that the Chief called untrustworthy to TCR in exchange for training, raising concerns about backup vehicles and taxpayer-funded assets. The Board told the Chief to go back to TCR to ask for an amended agreement without increased tuition fees that the Town would have to pay.
  where: Hotchkiss Police Department
  refs:
  - 1
- title: Regional water supply, grants and wildfire vulnerability
  summary: Staff reported talks with Cedaredge and Upper Surface Creek water users about a possible three-party agreement, and meetings with Tri County Water. The Town received a $10,000 Water Smart Grant for education with the Water Now Alliance. Staff and the engineer are also seeking funding for a study because a fire at the water source could cut off supply.
  where: Townwide
  refs:
  - 1
- title: Skate park request
  summary: Resident Tanner Wilson asked the Board to consider a skate park in Hotchkiss and said he has volunteers lined up. He has met with the North Fork Pool, Park and Recreation District. The Town offered a letter of support when the project reaches that point, and upkeep remains an open question.
  where: Hotchkiss
  refs:
  - 0
  public_comment: true
- title: 2026 updated budget adoption
  summary: Council held a public hearing and a motion was made to approve Resolution 2026-09 amending the 2026 budget with revised and supplemental appropriations. Members asked why a grant included in 2025 was absent in 2026; the clerk said the funds were fully spent in 2025.
  where: Townwide
  refs:
  - 2
- title: Police Department vehicle use policy revisions and North Fork Senior Connections donation
  summary: Council moved to approve revisions to the Police Department vehicle use policy, which do not affect Public Works. It also moved to approve a donation to North Fork Senior Connections, which plans further improvements to its building and property.
  where: Hotchkiss
