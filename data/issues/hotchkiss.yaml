- title: Wildland-Urban Interface Code and wildfire planning
  summary: The Western Slope Conservation Center presented a Wildfire Ready Action Plan in December. Ordinance 2026-03 adopting a Wildland-Urban Interface Code was heard in July, with a fire-risk map covering the whole Town and no public comments. In August the Town also discussed the risk that a fire at its water source would cut off water, and funding for a study.
