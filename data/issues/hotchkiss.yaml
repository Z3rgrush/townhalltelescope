- title: Ordinance 2026-07 on demonstrations and special events in public rights-of-way
  summary: Council took up Ordinance 2026-07, which sets content-neutral safety, access and permit rules for demonstrations and special events. The Town Attorney said the rules are neutral, and on Aug. 27 a motion was made to approve it. A resident asked whether it can override state statute. The new permit process led to a parade permit waiver for the North Fork Miners homecoming parade in September.
  where: Townwide
