- title: Proposed park on Bridge Street lots and skate park request
  summary: Don Foster proposed a park on the empty lots at 171 and 191 E Bridge Street, and the board agreed to form a working group in August. Resident Larry Wilkening opposed it and said the land should host a revenue-generating business. Tanner Wilson asked the town to consider a skate park, and the town offered a letter of support.
