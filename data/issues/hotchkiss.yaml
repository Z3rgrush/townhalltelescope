- title: Police vehicle transfer and training tuition agreement
  summary: The Board debated transferring decommissioned Police Department vehicles in exchange for a training arrangement. Chief Green said the vehicles were untrustworthy. The Board directed him to ask Technical College of the Rockies to amend the contract so the Town avoids extra tuition fees. Vehicle use policy revisions for the Police Department were later approved.
