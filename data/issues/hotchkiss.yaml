- title: Wage study, benefits and budgets
  summary: The Board heard Graves Consulting's wage compensation study in April, with raises proposed to start June 1, 2026, plus increased vacation and insurance benefits. Trustee Edstrom had budget concerns. The updated 2026 budget was adopted in September and ratified in October after staff corrected errors, and the first draft of the 2027 budget was presented with a work session on October 22.
