- title: 'Variance requests: drive-thru lot and parking, sheds and fences'
  summary: In November the board tabled a variance for a nonconforming lot at 6th Street for a drive-thru, sending the applicant back for a documented parking agreement with City Market. Neighbors raised parking concerns. In June it considered variances for a shed at 159 E Orchard, an 8-foot fence at 791 Barrow Mesa Road, and a 6-foot fence at 319 Knob Hill Circle Drive.
