- title: Drought restrictions, water rates and the bulk water standpipe
  summary: Council passed an emergency moratorium on new out-of-town water taps and limits on standpipe sales in February 2026, then discussed drought restrictions and Resolution 2026-04 in April and May. Trustees noted Hotchkiss water rates are among the lowest around and set the standpipe and rates for a separate work session. In August the Town reported a $10,000 WaterSmart grant and talks with neighboring water users about a regional agreement.
