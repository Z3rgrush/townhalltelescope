- title: Wildland-Urban Interface Code and wildfire planning
  summary: Ordinance 2026-03 adopting a Wildland-Urban Interface Code came to a public hearing in July, with a fire-risk map covering the whole town. The Western Slope Conservation Center presented a Wildfire Ready Action Plan in December. Staff also noted a wildfire near the town's water source could cut off supply, and talks are underway to fund a study.
