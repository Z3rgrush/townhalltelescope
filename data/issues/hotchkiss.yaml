- title: Staff wage study and benefits
  summary: Graves Consulting presented a wage compensation study, with implementation proposed for June 1, 2026 and no increase to the 2026 budget. Staff also proposed more vacation time and insurance improvements costing $3,000 to $5,000. Trustee Sven Edstrom said there was too much information to decide on that night.
