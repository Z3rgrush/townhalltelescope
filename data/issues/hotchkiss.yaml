- title: Ordinance 2026-07 on demonstrations and special events in public rights-of-way
  summary: The Town considered and later approved an ordinance setting content-neutral safety, access and permit rules for demonstrations and special events. Residents spoke on it, and one asked whether it could override state statute. The new permit process later required a waiver for the homecoming parade while procedures were set up.
