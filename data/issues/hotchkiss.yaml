- title: Variance requests for sheds and fences
  summary: In June the Board heard variances for a shed replacement setback at 159 E. Orchard, an 8-foot fence at 791 Barrow Mesa Road, and a 6-foot fence at 319 Knob Hill Circle Drive. The Planning Commission recommended approval of the shed with conditions for a metal, fire-resistant structure on skids.
