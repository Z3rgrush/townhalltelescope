- title: Police vehicles and Police Department policies
  summary: The board discussed transferring police vehicles in exchange for tuition at Technical College of the Rockies. It directed the chief to seek a contract amendment so the town avoids extra tuition costs. In September the board approved revisions to the Police Department vehicle use policy.
