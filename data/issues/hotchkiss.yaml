- title: Hiring a permanent Town Administrator and new Town Attorney
  summary: The board worked with KRW Associates on a search for a permanent Town Administrator, with executive sessions in May and June. Kimberly States was in the job by July, and Ordinance 2026-04 set out the office's powers. The board also sought proposals for a new town attorney and had the contract reviewed. Sarah Ross was serving as attorney by July.
