- title: Proposed park on Bridge Street lots and skate park request
  summary: Don Foster proposed a park on the empty lots at 171 and 191 E Bridge Street, possibly run with a non-profit, and the Board agreed to form a research committee. One resident opposed it, preferring a revenue-generating business. Separately, Tanner Wilson asked for a skate park, and the Town offered a letter of support. In October a resident proposed a Train Station Pocket Park.
