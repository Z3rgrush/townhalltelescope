- title: Red Rocks transportation hub and Planning Commission land-use cases
  summary: The Planning Commission scheduled hearings on a transportation hub with 397 parking spaces serving Red Rocks Amphitheatre (Jurassic Road and Trading Post Rd). It also had rezonings and plats at 22339 S Platte River Road in Sedalia, 33871 Golden Gate Canyon Road, and 10446 Ammons Street in Westminster. The Board approved a preliminary and final plat (Resolution CC26-266) after public testimony.
