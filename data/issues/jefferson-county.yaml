- title: Parks and Open Space projects
  summary: The Board approved the Meyer Ranch Park forestry contract. It approved a $3.22 million North Table Mountain Park improvements contract with American West Construction and a Lakewood Bear Creek Greenbelt easement subordination. It also approved a bus stop agreement and trails funding at West 32nd Avenue and Kipling, utility easements at Pleasant View Community Park, and agreements for Long Lake and Van Bibber parks.
