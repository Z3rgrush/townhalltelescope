- title: Water bills, tiered rates and new smart meters
  summary: Residents told the Board that water bills jumped after the Metron smart meter rollout and tiered rates; staff said rates rose about 35% on average with the base rate up about 14%. The roughly $1.25 million meter replacement project is near completion, and residents also raised records requests about the meter bid. A town-wide rate and fee study with Willdan Financial was on the Nov. 9 agenda, and 2027 rates are generally adopted in December.
