- title: Water Supply Element of the Comprehensive Plan (SB 24-174)
  summary: The Board considered a contract with Ayres Associates of up to $17,500 to prepare the Water Supply Element required by state Senate Bill 24-174. Staff reported in September that work on the update had kicked off. The Board also scheduled a joint meeting with the Northern Colorado Water Conservancy District.
