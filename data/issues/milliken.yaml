- title: Water bills, new smart meters and rate increases
  summary: Residents told the Board in September and October that new meters, tiered rates and a roughly 30-35% rate increase have produced high water bills. One resident at 1064 Sunrise Cr reported being billed over 30,000 gallons. Staff said rates come from a five-year cost-of-service study, and 2027 rates are normally adopted in December. Residents also filed open-records requests for rate history.
