- title: Town Hall rental program fees
  summary: The Board discussed the long-term sustainability of Town Hall rentals and directed staff to develop a hybrid model. Staff proposed higher hourly rates, a tiered structure with reduced rates for residents and nonprofits, higher non-resident rates, a funeral/memorial class, and clearer rental agreement rules. The goal is to reduce taxpayer subsidy of private use.
  where: Town Hall, 1201 Broad Street
