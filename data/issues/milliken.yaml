- title: Proposed paving of County Road 44 in the 2027 budget
  summary: Residents on Weld County Road 44 spoke both for and against paving the road, citing dust, ruts and safety versus cost, traffic and rural character. Some asked that paving be removed from the 2027 budget; others pointed to an earlier IGA and service plan for Meadow Farms Filing 1 about paving responsibility.
