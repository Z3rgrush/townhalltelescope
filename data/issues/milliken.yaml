- title: Water bills, new smart meters and rate increases
  summary: Residents told the Board that water bills jumped after the Metron smart meter replacement (about a $1.25 million project) and tiered rates; one resident cited a 30,000-gallon bill and another asked for 2024 vs 2025 rate comparisons. The interim administrator said rate adjustments averaged about 35% with the baseline up about 14%, and that next year's rates come from a five-year cost-of-service study, with rates usually adopted in December.
