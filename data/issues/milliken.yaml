- title: Town Hall rental program fees
  summary: Staff proposed a hybrid rental model with higher hourly rates, a tiered fee structure with reduced rates for residents and nonprofits, higher non-resident rates, and a funeral/memorial category. The goal is to recover costs so taxpayers do not subsidize private use.
