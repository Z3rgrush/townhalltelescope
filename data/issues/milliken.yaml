- title: Water bills, new smart meters and rate increases
  summary: Residents complained at several meetings about high water bills, a roughly 30-35% rate increase, tiered rates, and the new Metron smart meters (about $1.25 million project). Some questioned the meter bid and asked for records via CORA requests. Staff said 2027 rates come from a five-year cost-of-service study and are usually adopted in December.
