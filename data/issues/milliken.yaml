- title: New Town Administrator hire
  summary: After interviews and negotiations, the Board approved an employment agreement offering the Town Administrator job to Greg Brinck. A resolution appointing him was on the September 9 agenda, and he was giving updates to the Board by October. Steven Krolczyk had been serving as interim administrator.
