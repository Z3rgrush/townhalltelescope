- title: 2027 county budget
  summary: County Administrator Carl Young presented a preliminary balanced 2027 budget that includes a 3.6% cost-of-living raise and extra pay increases for Human Services and Road and Bridge. It warns County General will need cost cuts amid fuel and jail housing costs. Department budget workshops were set for Nov. 10.
