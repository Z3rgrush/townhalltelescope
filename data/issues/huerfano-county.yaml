- title: 'Housing programs: pre-approved home plans, Prop 123 down payment help, revolving loan fund'
  summary: The county adopted pre-approved home designs, including tiny home and barndominium plans, codified a Housing Authority dormant since 2021, and adopted a land banking and donation policy. It also took up Prop 123 down payment assistance and an affordable housing revolving loan fund, with Impact Development Fund presenting and a resident asking how the program works.
