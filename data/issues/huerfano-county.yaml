- title: GroAway LLC conditional use permit (LU-26-000154)
  summary: The Planning Commission held a hearing Sept. 10, continued it twice to Oct. 8 and Oct. 22, and weighed late public comment and a Colorado Parks and Wildlife letter. On Nov. 3 the commissioners moved to deny the conditional use permit after residents voiced concerns, including about a proposed cat sanctuary.
