- title: 'Affordable housing: pre-approved home plans, Prop 123 down payment aid and revolving loan fund'
  summary: The county is building housing tools. These include pre-approved single-family house plans (tiny home, barndominium, ranch and traditional), a Prop 123 Down Payment Assistance Program, an Affordable Housing Revolving Loan Fund with Impact Development Fund, and a resolution codifying the Housing Authority, which had been dormant since 2021. Commissioners approved Resolutions 26-43 and 26-44, and a land banking, acquisition and donation policy (26-45). A resident asked how the loan program and applications would work.
