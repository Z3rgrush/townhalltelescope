- title: Wildfire protection, fire restrictions and forest grants
  summary: The county moved from Stage 2 to Stage 1 fire restrictions in August and lifted Stage 1 in October. Commissioners approved the 2026 Community Wildfire Protection Plan, an amended Community Wildfire Defense Grant subaward, and letters of support for forest restoration and wildfire risk mitigation grants, including Blackhawk Ranch and the Huerfano Ember Shield Coalition.
