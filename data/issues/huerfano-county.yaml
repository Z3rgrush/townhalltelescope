- title: Housing programs and pre-approved home plans
  summary: 'The county is building housing tools: pre-approved house plans (Resolution 26-43), codifying a Housing Authority (26-44), a Prop 123 down payment assistance program, and an affordable housing revolving loan fund. Impact Development presented loan program details, a land banking and donation policy (26-45) was adopted, and the building authority looked at tiny home, barndominium and other floor plans.'
