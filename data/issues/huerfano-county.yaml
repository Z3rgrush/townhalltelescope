  summary: The Planning Commission held a public hearing on Sept. 10 on a conditional use permit for GroAway, LLC, then continued it twice to Oct. 8 and Oct. 22 while it weighed new materials, public comments received after the hearing and a Colorado Parks and Wildlife letter. The permit went to the county commissioners' Oct. 27 agenda; the documents do not state the outcome.
