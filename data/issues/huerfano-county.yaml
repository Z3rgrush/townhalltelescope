- title: GroAway, LLC conditional use permit hearings (LU-26-000154)
  summary: The Planning Commission held a public hearing on the GroAway, LLC conditional use application on Sept. 10, 2026, then voted to continue discussion. On Oct. 8 and Oct. 22 it weighed whether to reopen the hearing and admit new material received afterward, including public comment and a letter from Colorado Parks and Wildlife. It could also recommend that the commissioners hold a separate hearing.
