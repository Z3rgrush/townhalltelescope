- title: GroAway LLC conditional use permit (LU-26-000154)
  summary: The Planning Commission held a public hearing on the GroAway, LLC conditional use permit on Sept. 10, continued it twice to Oct. 8 and Oct. 22, and weighed Colorado Parks and Wildlife input and late public comments. On Nov. 3 the commissioners voted to deny the permit after residents raised concerns about the project, including its "cat sanctuary" aspect.
  where: Huerfano County
