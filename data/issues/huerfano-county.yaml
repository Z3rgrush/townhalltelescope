- title: 2027 county budget
  summary: County Administrator Carl Young presented a preliminary 2027 budget with a 3.6% cost of living raise for all employees and market adjustments capped at $4,000 in Human Services and Road and Bridge. He warned that inflation, fuel prices and jail costs for housing prisoners elsewhere are straining County General and Road and Bridge. A balanced budget presentation was held Oct. 15.
