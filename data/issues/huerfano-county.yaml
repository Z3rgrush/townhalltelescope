- title: Preliminary 2027 county budget
  summary: County Administrator Carl Young presented a preliminary balanced 2027 budget on Oct. 15. It includes a 3.6% cost-of-living raise, extra pay increases in Human Services and Road and Bridge capped at $4,000 combined, and a warning that County General must cut costs amid fuel and jail-housing costs. Fund balances are not shown yet and will appear in the final budget.
