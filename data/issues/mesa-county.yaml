- title: 32 1/2 Road Phase II roadway improvement project
  summary: The county moved on the 32 1/2 Road project through a property purchase and deed in August. In September it took up a new agreement with Housing Resources of Western Colorado for a regional stormwater detention facility, replacing a 2008 agreement, and a memorandum of understanding with Clifton Water District. It also considered a $4,606,193.95 construction contract with Mountain Valley Contracting.
