- title: Grand Junction Regional Airport FAA grants
  summary: The county accepted or ratified several FAA Airport Improvement Program grants as co-sponsor with the Airport Authority. They cover terminal improvements and the runway replacement program, including a $13,265,445 grant for runway transition and taxiway conversion.
