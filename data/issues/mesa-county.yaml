- title: Grand Junction Regional Airport FAA grants and runway replacement
  summary: The county accepted and ratified several FAA Airport Improvement Program grants as co-sponsor with the Airport Authority. They cover terminal improvements and the runway replacement program, including a $13,265,445 grant for runway transition and taxiway conversion.
