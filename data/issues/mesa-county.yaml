- title: 'Land use hearings: rezones, vacation of rights-of-way and PUD extension'
  summary: The commissioners heard the Serrano Estates rezone of 4.1 acres at 825 26 Road, the Bailey rezone of 7 acres at 1083 20 Road near Fruita, and a five-year extension of the Experius Community PUD plan to Dec. 17, 2031. They also heard the Smith vacation of Patterson and Burbank Street rights-of-way in Loma and an easement extinguishment at 223 Elberta Drive.
