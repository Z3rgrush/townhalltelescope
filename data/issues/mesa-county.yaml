- title: Federal land and legislative support letters
  summary: The commissioners approved letters to the Bureau of Land Management on wilderness characteristics in land use planning. In October they considered letters supporting federal bills on forest health, geothermal energy and snow water forecasting, and a Waters of the United States definition update. They also considered a resolution supporting Grand Junction as the western terminus of new state rail service.
