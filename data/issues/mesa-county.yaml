- title: Temporary moratorium on data center applications in unincorporated Mesa County
  summary: On Sept. 29 the commissioners were to consider a temporary moratorium on accepting, processing and approving land use applications for data center facilities in unincorporated Mesa County. It would also suspend negotiation of county inducements for such facilities. The documents do not state the outcome.
  where: Unincorporated Mesa County
