- title: 32 1/2 Road Phase II roadway project
  summary: 'The county moved the 32 1/2 Road improvement forward: a land purchase and deed in August, a stormwater detention agreement with Housing Resources of Western Colorado (superseding a 2008 agreement), and a memorandum of understanding with Clifton Water District. A $4,606,193.95 construction contract with Mountain Valley Contracting was on the Sept. 15 agenda.'
