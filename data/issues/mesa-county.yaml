- title: Appeal of short-term rental approval at 123 Mesa Vista Road
  summary: The commissioners were to hear the Parentice appeal of an administrative approval (RES2026-0224, Beatrice Estate) that would allow a short-term rental at 123 Mesa Vista Road, owned by Passion Project, LLC, in an RSF-4 zone. The hearing was set for Sept. 15.
  where: 123 Mesa Vista Road, south of South Broadway, Grand Junction
