- title: Wildfire mitigation and trails grant applications
  summary: The county considered an $840,000 Forest Restoration and Wildfire Risk Mitigation grant application for the Mesa Creek Cross-Boundary Wildfire Mitigation Project. It also considered a Colorado Parks and Wildlife Trails Stewardship Grant application. In October it supported a federal Forest Health and Wildfire Risk Reduction Act.
