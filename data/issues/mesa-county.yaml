- title: 32 1/2 Road Phase II roadway improvement project
  summary: The county is moving ahead on the 32 1/2 Road Phase II project. Items include a $4,606,193.95 construction contract with Mountain Valley Contracting, an MOU with Clifton Water District, a regional stormwater detention facility agreement with Housing Resources of Western Colorado that supersedes a 2008 agreement, and a real property purchase for the project.
