- title: 2027 county budget and special district budgets
  summary: Staff briefed the commissioners on Mesa County's proposed 2027 budget on Oct. 6. They also briefed on the proposed budgets for the Mesa Community Center, Lower Valley, Whitewater and Upper Grand Valley Pest districts. A supplemental 2026 budget resolution was also considered Sept. 22.
