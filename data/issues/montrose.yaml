- title: City Charter amendments for the November ballot (Ordinances 2727-2730)
  summary: 'Council worked through four charter amendments: moving municipal elections to November, 8-year lifetime term limits, and council approval over appointing and removing the police chief and the city clerk. Ranked-choice and gendered-language amendments were dropped from the November ballot. Many residents spoke for and against, and Ordinances 2727 and 2728 were heard on second reading Sept. 1.'
