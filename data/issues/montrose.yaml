- title: Comprehensive plan update and growth concerns
  summary: Staff are doing a five-year update of the Envision 2040 comprehensive plan and land development code, including state-mandated housing, water supply and strategic growth planning, with approval targeted by year's end. Residents urged council to make growth pay its own way and stick to the plan on subdivisions.
