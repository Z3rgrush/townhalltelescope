- title: City manager separation, interim manager and council vacancies
  summary: After an August executive session on a confidential memo and possible independent counsel, Council approved a separation agreement with City Manager Bill Bell, ratified September 15. Ann Morgenthaler was appointed interim city manager and MURA executive director. Council also worked through the District IV and At-Large vacancies, appointing Adam Woodden to District IV and taking applications from John Brown, Danielle Godt and Cindee Williams for the At-Large seat.
