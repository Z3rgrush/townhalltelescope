- title: City manager separation and interim manager
  summary: Council went into executive session about a confidential memo and possible independent counsel, then approved a mutual separation agreement with City Manager Bill Bell. On Sept. 15 it ratified that agreement, appointed Ann Morgenthaler interim city manager under an open-ended agreement during recruitment, and named her executive director of the Montrose Urban Renewal Authority.
  where: City Hall
