- title: Charter amendments for the November ballot (election date, term limits, council oversight of police chief and city clerk)
  summary: 'Council took up Ordinances 2727-2730 to put charter changes on the ballot: moving municipal elections to November, an 8-year lifetime term limit for the at-large seat, and council approval rights over appointing and discharging the police chief and the city clerk. Earlier proposed amendments (he/she language, ranked choice) were dropped, and residents spoke both for and against the remaining measures.'
  where: Citywide
