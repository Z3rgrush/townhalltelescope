- title: Rotary Park pump house replacement
  summary: Council considered a $514,011 contract with FCI Constructors of Grand Junction to replace the park's irrigation pump house, built in the 1980s. The amount is $14,011 over the $500,000 budget, to be covered by savings from other 2026 Public Works capital projects.
