- title: 'Council vacancies: District IV and At-Large seats'
  summary: The District IV seat was vacated Sept. 7, and the charter requires an appointment within 30 days. Council agreed to appoint Adam Woodden to District IV, which opened the At-Large seat, with applications due Oct. 21. John Brown, Danielle Godt and Cindee Williams were slated for the At-Large appointment on Nov. 2.
