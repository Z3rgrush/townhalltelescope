- title: 'Council vacancies: District IV and At-Large seats'
  summary: The District IV seat was vacated Sept 7 and the charter requires an appointment within 30 days. Council appointed Adam Woodden to District IV on Oct 6, which opened the At-Large seat; applications ran Oct 7-21, and John Brown, Danielle Godt and Cindee Williams were up for appointment Nov 2.
