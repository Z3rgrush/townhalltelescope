- title: Annexations and new subdivisions (Locust Road, Chipeta Lake 2, Spruce Point, El Chapin)
  summary: Council took up the 4.2-acre Locust Road Addition annexation on second reading (Ordinance 2731). The Planning Commission heard initial zoning for the 1.14-acre Chipeta Lake 2 Addition and the Spruce Point amended preliminary plat, and reviewed a sketch plan for a 45-lot El Chapin subdivision on 6600 Road. One resident asked that Spruce Point respect established boundaries.
