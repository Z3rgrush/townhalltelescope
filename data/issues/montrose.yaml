- title: Proposition 123 affordable housing opt-in and Shepherd's Hand shelter funding
  summary: Council considered Resolution 2026-16 committing to increase affordable housing units under Proposition 123, and a $28,597 expenditure tied to the housing effort. It also reviewed a funding request for The Shepherd's Hand shelter. The state also requires a housing needs assessment and housing action plan as part of the comprehensive plan update.
