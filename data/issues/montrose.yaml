- title: City manager separation and interim manager
  summary: After closed-door sessions about a confidential memo and possible independent counsel, Council approved a mutual separation agreement with City Manager Bill Bell. It then appointed Ann Morgenthaler as interim city manager and Montrose Urban Renewal Authority executive director, and ratified those decisions on Sept. 15 to cure notice problems. The interim agreement is open-ended during recruitment of a new manager.
