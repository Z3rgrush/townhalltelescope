- title: Network Operation Center fire suppression system
  summary: Council authorized $75,000 for a waterless clean-agent fire suppression system at the city's Network Operation Center, including a $69,987 sole-source contract with Pye Barker. The work was not formally bid; staff cited standardizing vendors for fire and security systems.
