- title: Proposition 123 affordable housing opt-in and Shepherd's Hand shelter funding
  summary: Council's Oct. 20 agenda includes Resolution 2026-16 committing to increase affordable housing units under Proposition 123. It also includes a $28,597 expenditure request tied to The Shepherd's Hand shelter.
