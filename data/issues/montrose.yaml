- title: City Council District IV vacancy and Adam Woodden appointment
  summary: The District IV seat was vacated Sept. 7 and the charter requires an appointment within 30 days. Council agreed to appoint Adam Woodden to District IV, which opens the At-Large seat. Applications for the At-Large seat were set to run Oct. 7-21, with an appointment planned for Nov. 2.
  where: Citywide
