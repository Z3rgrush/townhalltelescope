- title: Charter amendments for the November ballot (Ordinances 2727-2730)
  summary: 'Council took up four proposed charter amendments: moving municipal elections to November (2727), an 8-year lifetime term limit for the at-large seat (2728), and council approval over hiring and firing the police chief (2729) and city clerk (2730). Residents spoke both for and against, and Ordinances 2727 and 2728 were heard on second reading Sept. 1.'
  where: Citywide
