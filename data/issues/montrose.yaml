- title: Comprehensive plan update and growth policy
  summary: Staff is preparing a five-year technical update of the Envision 2040 plan and land development code, including state-mandated housing needs assessment, housing action plan and water supply planning. The goal is approval by year's end. Residents urged that growth pay its own way and that the plan's standards be followed.
