- title: Locust Road Addition annexation (1815 Locust Road)
  summary: A 4.2-acre annexation at 1815 Locust Road, including part of the road right of way, with requested R-2 low-density zoning. Planning Commission recommended approval of the zoning and discussed improving pedestrian infrastructure and eventually rebuilding Locust Road. Council set a Sept 15 hearing and took Ordinance 2731 on second reading Oct 6.
