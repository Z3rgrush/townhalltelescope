- title: Comprehensive plan update and state growth mandates
  summary: Staff and consultants are doing a five-year update of the Envision 2040 plan, adding state-required housing needs assessment, housing action plan, water supply and growth elements. The goal is approval by year end. Residents asked that growth pay its own way and that plan standards be upheld.
