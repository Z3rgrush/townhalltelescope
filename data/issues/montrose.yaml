- title: City Charter amendments on elections, term limits and appointments
  summary: 'Council took up ballot language for Charter amendments: Ordinance 2727 would move municipal elections to November, 2728 sets an 8-year lifetime term limit for the at-large seat, and 2729 and 2730 give Council approval over hiring and firing the police chief and city clerk. Residents spoke both for and against at the August and September meetings.'
  where: Citywide
