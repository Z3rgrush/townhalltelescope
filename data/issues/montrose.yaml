- title: Affordable housing commitment and homeless shelter funding
  summary: Council considered a Proposition 123 affordable housing commitment; the city approved 221 units against a requirement of 162. It also weighed $28,597 in lodging-tax funds for startup costs of The Shepherd's Hand seasonal homeless shelter.
