- title: Affordable housing commitment and seasonal homeless shelter funding
  summary: Council considered a Proposition 123 affordable housing commitment. The city approved 221 units in the current cycle against a requirement of 162. Council also considered $28,597 in lodging tax funds for start-up costs for The Shepherd's Hand seasonal homeless shelter.
