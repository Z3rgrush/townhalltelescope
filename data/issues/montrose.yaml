- title: 2027 fee schedule revisions
  summary: Proposed fees effective Jan 1, 2027 include higher cemetery lot and open/close fees, a higher school land dedication fee-in-lieu, a higher memorial bench fee, a $75 park shelter electricity fee, and a $50 building reinspection fee. Resolution 2026-18 to adopt the schedule was set for Nov 2.
