- title: Comprehensive plan update and growth policies
  summary: Staff is preparing a five-year update to the Envision 2040 comprehensive plan, including state-required housing needs assessment, housing action plan, water supply and strategic growth elements, with approval targeted by year's end. Residents urged that growth pay its own way and that the plan's standards be upheld.
