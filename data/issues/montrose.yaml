- title: Locust Road Addition annexation and zoning
  summary: A 4.2-acre annexation at 1815 Locust Road, plus part of the road right of way, was requested by Gustavo Martinez. The Planning Commission unanimously recommended R-2 low-density zoning, with discussion of pedestrian infrastructure and rebuilding Locust Road. Council set a Sept. 15 hearing and heard Ordinance 2731 on second reading Oct. 6.
