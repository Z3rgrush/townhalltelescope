- title: City manager separation and interim city manager
  summary: Council went into executive session about a confidential memo and possible independent counsel, then approved a mutual separation agreement with City Manager Bill Bell on Sept 1. On Sept 15 it ratified the agreement, appointed Ann Morgenthaler as interim city manager under an open-ended agreement during recruitment, and named her Montrose Urban Renewal Authority executive director. Council had to ratify the decisions because the original action was not specifically noticed.
