- title: 'Groundwater wells and water supply concerns (Four Mile Gulch Well #6, Resolution 55)'
  summary: 'Residents of unincorporated Gilpin County (Aspen Springs, Chalet Park, Dory Hill Road) spoke on Sept. 9 against the city''s plan to drill more wells, including Four Mile Gulch Well #6 (1,000 feet deep, up to 161 acre-feet a year). They fear harm to their own water supply as the city''s resort plan could raise maximum annual flow from 482 to 3,070 acre-feet, and asked the council to pause further drilling.'
  where: Four Mile Gulch / Dory Hill Road, Aspen Springs and Chalet Park
