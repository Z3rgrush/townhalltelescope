- title: Army Corps of Engineers reservoir permit reimbursement agreement (CB12)
  summary: The council held a public hearing on Ordinance CB12 approving a reimbursement agreement tied to the city's Army Corps of Engineers permit application for a reservoir. The applicant covers the cost of the review, which the Corps will subcontract to Wright Water Engineers. The minutes show a motion to approve CB12.
