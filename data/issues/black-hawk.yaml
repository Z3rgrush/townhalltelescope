- title: City-owned land purchases and sales, including Resolution 48-2026
  summary: Council approved a contract to buy land on Gregory Hill in June and accepted a property conveyance in July. A vacant land sale agreement (Resolution 48-2026) was repeatedly continued from August into September, with discussion of Central City's roadway permitting and traffic study.
