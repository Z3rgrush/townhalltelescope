- title: 'Capital projects: Bobtail Mine, Highway 119 culverts, Red Dolly electrical, Ballard House'
  summary: Council approved a $949,307 change order for Bobtail Mine Improvements Phase 2 and a $160,400 Bobtail wall excavation contract. It also approved relining two storm culverts under Highway 119 after a failure at Gregory Street, the Red Dolly Casino electrical relocation, storage sheds, and Ballard House renovation with a barn shed addition (Roche Constructors). Also streamlined the capital project approval process (CB10).
