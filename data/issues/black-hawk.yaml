  public_comment: true
- title: Education Enhancement Tax and possible Gilpin County sales tax
  summary: Black Hawk's 1.5% Education Enhancement Tax, which has raised over $10 million for the Gilpin school since 2009, would automatically end if county voters approve a countywide sales tax. The county is considering such a tax for the November 2026 ballot. Council discussed it in February and March and adopted Resolution 17-2026 reaffirming the tax's self-terminating conditions.
  where: Countywide (Gilpin County)
