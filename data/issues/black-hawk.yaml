- title: Wildfire Resiliency Code adoption and fire restrictions
  summary: Council adopted the 2025 Wildfire Resiliency Code into the municipal code on March 25 by a 5-1 vote. In July the city manager issued an administrative order imposing fire restrictions. The city also contracted Good People Tree Service for fire mitigation work.
