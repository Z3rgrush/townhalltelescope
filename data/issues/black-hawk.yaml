- title: Education Enhancement Tax and the proposed Gilpin County sales tax
  summary: Black Hawk's 1.5% Education Enhancement Tax for the Gilpin school has raised about $16.9 million since 2009 and ends automatically if a countywide sales tax is adopted. Council discussed the County Commissioners' possible November 2026 sales tax and passed Resolution 17-2026 on March 25 reaffirming that the tax would terminate.
