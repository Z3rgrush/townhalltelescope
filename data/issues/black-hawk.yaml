- title: Wildfire Resiliency Code adopted
  summary: Council adopted the 2025 Wildfire Resiliency Code by reference into the municipal code (CB3) after a March 25 public hearing, passing 5-1. In July the city manager also issued an administrative order imposing fire restrictions.
