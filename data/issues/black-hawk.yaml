- title: 'Leadership turnover: new City Manager and Police Chief'
  summary: Police Chief Moriarty announced her retirement after 31 years, and the council met in executive session on City Manager matters. Lance Hillis's employment agreement as City Manager took effect May 2 (Resolution 22-2026), and Ely Reyes was introduced as the new Police Chief in July.
