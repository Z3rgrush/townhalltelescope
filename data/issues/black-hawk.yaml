- title: Historic preservation and Lace House designation
  summary: The Historic Preservation Commission is working on the Lace House designation, a phased reconnaissance survey and an intensive survey property list. Council accepted the reconnaissance survey and the Five-Year HPC Work Plan in August to meet Certified Local Government requirements.
