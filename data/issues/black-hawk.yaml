- title: 'Water supply: Four Mile Gulch Well #6 and Army Corps reservoir permit'
  summary: 'The city is pursuing an Army Corps of Engineers permit for a reservoir and approved a reimbursement agreement (CB12) covering review costs. Residents of unincorporated Aspen Springs and Chalet Park spoke on Sept. 9 against drilling Well #6 near Dory Hill Road, saying it could harm neighbors'' water, and asked the council to pause additional wells.'
