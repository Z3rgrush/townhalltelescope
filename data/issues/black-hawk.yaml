- title: 'City capital projects: Bobtail Mine, Ballard House, Red Dolly electrical, storage sheds'
  summary: Council approved a $949,307 change order for Bobtail Mine Improvements Phase 2. It also awarded bids for the Red Dolly Casino electrical service relocation, storage sheds, and the Ballard House renovation with Barn Shed addition (Roche Constructors). An ordinance (CB10) changed the approval process for city capital projects.
