- title: Comprehensive Plan and resort growth questions
  summary: A resident from Dory Hill Road spoke on the city's 2024 Comprehensive Plan, asking about its future vision, enforcement needs and water impacts of the growth it envisions. He asked the council to pause additional wells until impacts are studied.
