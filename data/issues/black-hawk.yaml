- title: Sanitation district agreement and ballot measure positions
  summary: Council approved an amended and restated service agreement with the Black Hawk/Central City Sanitation District. The mayor also spoke against a County Commissioners property-tax measure (Initiative 1A) and proposed a resolution supporting Initiative 177 on natural gas purchases.
