- title: 'Water supply expansion: Four Mile Gulch Well #6 and residents'' water concerns'
  summary: 'Council approved a contract in May for Four Mile Gulch Well #6 near Dory Hill Road, to be drilled 1,000 feet deep. At the Sept. 9 meeting, residents of unincorporated Black Hawk (including Aspen Springs and Chalet Park) asked the city to pause additional wells and study harm to neighbors'' water. The city is also pursuing an Army Corps of Engineers permit for a reservoir, and approved a reimbursement agreement (CB12) for the permit review costs.'
  where: Four Mile Gulch / Dory Hill Road
