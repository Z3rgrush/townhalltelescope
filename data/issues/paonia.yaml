  summary: Staff found an inconsistency in the estate zoning table (Table 16-2) and recommended allowing 1.5 to two acres per dwelling to support Comprehensive Plan housing-density goals. The Board sent the matter to a work session and a revised ordinance. A re-zoning application from David Warren also had a public hearing continued from Aug. 25.
