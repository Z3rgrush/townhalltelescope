- title: Recyclops free recycling service and Colorado EPR
  summary: 'The Board heard from Recyclops about the state''s Extended Producer Responsibility program and a proposal for free recycling service. Trustees approved the proposal on Nov. 10 on conditions: a state contract, liability insurance, and an agreement with the local recycler Cory''s. A new solid waste disposal ordinance was also on the Sept. 8 agenda.'
