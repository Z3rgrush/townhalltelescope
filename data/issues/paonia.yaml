- title: Stage 2 water restrictions and water supply concerns
  summary: After unusually high water use drained the treated-water storage tank, the Board adopted Stage 2 restrictions in Resolution 19-26 on Aug. 18, allowing hand or drip watering of gardens. Residents commented on fire risk from dried lawns, alternating schedules and penalties. The Board asked for regular updates on tank levels and production, and later rescinded the restrictions with Resolution 22-26. A water attorney briefed the Board in executive session on water rights, and the Planning Commission is looking at water moratorium and tap availability processes.
