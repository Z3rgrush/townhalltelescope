- title: Raw Water Monitoring Project engineering amendment
  summary: 'The Board considered Amendment #2 to the RESPEC agreement for pre-construction award and construction engineering services on the Raw Water Monitoring Project. It covers verifying plans and meeting state and federal funding requirements, including installing meters to better track water production. It is funded within the project budget, and a resident asked for clarification.'
