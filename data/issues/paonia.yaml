- title: Stage 2 water restrictions and water supply
  summary: After unusually high water use drained the treated-water storage tank, the Board adopted Stage 2 restrictions through Resolution 19-26 on Aug 18. The adopted version allows hand or drip watering of gardens. Staff said the stored supply would last only about eight days without conservation. Residents spoke about watering methods, fire hazards from dried lawns and penalties. Resolution 22-26 to rescind the restrictions was on the Oct 13 agenda.
