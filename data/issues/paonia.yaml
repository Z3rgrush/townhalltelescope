- title: Stage 2 water restrictions and water supply concerns
  summary: On Aug. 18 the Board adopted Stage 2 water restrictions (Resolution 19-26) after high water use dropped tank levels about four feet over a weekend, allowing limited hand or drip watering. Later meetings tracked tank levels and production, and the Board took up Resolution 22-26 rescinding the restrictions on Oct. 27. Planning staff are also preparing for possible water moratorium and tap availability processes, and the Board met with the water attorney in executive session on water rights.
