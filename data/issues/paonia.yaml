- title: Water plant, sewer and street infrastructure projects
  summary: The Board approved a RESPEC amendment for the Raw Water Monitoring Project, a $188,502.58 purchase of electric water plant valves and a sewer pipe CCTV scoping bid. It also considered a county agreement for a West Fourth Street overlay and a storm and sanitary sewer repair project. Sewer tap fee waiver ordinances and a Consor safety action plan covering roads like Samuel Wade Road were also on the agenda.
