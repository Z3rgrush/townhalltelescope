- title: Estate zoning density and Table 16-2 changes
  summary: Staff found an inconsistency in the estate zoning table and recommended allowing 1.5 to two acres per dwelling to support the Comprehensive Plan's housing-density goals. The Board discussed water and access limits and sent the item for a work session and a revised ordinance. A rezoning application from David Warren also had a continued public hearing.
