- title: Short-term rental rules and the Common Ground Ordinance
  summary: An ad hoc committee has met repeatedly since August to edit the proposed Common Ground Ordinance on short-term rentals. It has leaned toward registration with no numerical cap at first, three-year registrations, self-certified safety, a local contact, liability insurance and tax compliance, and it is still debating an 8% saturation threshold for whole-home rentals. Public survey responses and written comments have been mixed, citing housing, noise, parking and tax fairness.
