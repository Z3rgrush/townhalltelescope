- title: 'New town ordinances: tobacco sales, solid waste, animals and meeting procedures'
  summary: The Board considered Ordinance 01-26 on solid waste disposal rules, Ordinance 03-26 repealing sidewalk for business use, and Ordinance 04-26 amending the animal code. It adopted Ordinance 06-26 on cigarette and tobacco sales and Ordinance 07-26 on meeting procedures, and moved the regular meeting start time to 5:30. Staff also proposed combining the juvenile loitering and curfew rules and creating a single nuisance ordinance.
