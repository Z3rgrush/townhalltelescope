- title: Stage 2 water restrictions and water supply concerns
  summary: After unusually high water use dropped the tank level about four feet over a weekend, the Board considered Resolution 19-26 for Stage 2 restrictions. Edits allowed hand or drip watering of gardens, and residents commented on fire risk from dried lawns and on watering schedules. Staff reported the stored supply would last about eight days without production, and the Board asked for regular tank-level updates. Resolution 22-26 rescinding the restrictions was later on the October 27 agenda. The Planning Commission is also discussing water moratorium planning and tap availability, and the Board went into executive session on water rights.
