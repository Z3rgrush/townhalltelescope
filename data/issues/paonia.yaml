- title: 'Water projects: Raw Water Monitoring, Western Loop, trailer court'
  summary: The Board approved Amendment 2 to the RESPEC agreement for construction engineering on the Raw Water Monitoring Project, which includes meters to track water production. Staff also reported on the Western Loop water line easements and routes, water improvements at Lee's Trailer Court, and grants to protect Town springs from wildfire. A closed session on October 26 was set to discuss the Town's water rights.
