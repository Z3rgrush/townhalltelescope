- title: Code rewrite and new ordinances
  summary: The Town is recodifying its code with Sustainable Futures LLC, and the Board considered renewing the contract on Oct 13. Proposed ordinances include a single nuisance ordinance, combined juvenile loitering and curfew rules, solid waste rules, repeal of the sidewalk-for-business-use ordinance, animal code changes and tobacco sales. The Board also reviewed ordinances from rejected citizen initiative petitions.
