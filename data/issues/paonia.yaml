- title: Short-term rental rules and the Common Ground Ordinance
  summary: An ad hoc committee is going through the proposed Common Ground short-term rental ordinance section by section. It is working on registration with no numerical cap, a fee set by the Board and limited to administrative cost, owner-occupancy verification, tax compliance, self-certified safety, a local contact and liability insurance. Survey comments leaned cautious, with concerns about housing, noise, parking and water. The Board has extended the facilitator's contract through 2026 and the committee's scope has been expanded.
