- title: Town Administrator search and Board vacancy
  summary: The Town is searching for a permanent Town Administrator, with an executive search firm profile up for approval Sept. 30 while Greg Sund serves as interim. The Board also appointed a trustee after hearing from two candidates and declared another vacancy by Resolution 24-26.
