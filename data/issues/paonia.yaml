- title: Accessory dwelling units, sidewalks and subdivision rules
  summary: The Planning Commission is discussing adding ADU rules to Chapter 16 because the 2025 Comprehensive Plan lists ADUs as a key way to create housing. Questions include where ADUs are allowed, utilities, parking, owner occupancy, fees and separate sale. It is also discussing sidewalk requirements in new subdivisions by lot size.
