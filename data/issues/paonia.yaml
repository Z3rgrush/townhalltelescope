- title: Short-term rental regulation (Common Ground Ordinance)
  summary: An ad hoc committee has met repeatedly since August to review a draft Common Ground Ordinance for registering short-term rentals. It has discussed registration fees, no numerical cap, three-year registrations, owner-occupancy verification, self-certification of safety, tax compliance, liability insurance, neighbor notification and complaint-based enforcement. Survey responses and written comments were mixed, and the Board of Trustees will set final requirements and fees.
