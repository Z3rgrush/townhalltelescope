- title: Accessory dwelling unit (ADU) rules and new subdivision sidewalks
  summary: The Planning Commission is discussing adding ADU provisions to Chapter 16, since the 2025 Comprehensive Plan lists ADUs as a key housing strategy. Questions include where ADUs are allowed, utilities, parking, owner occupancy, fees and separate sale. It will also discuss sidewalk requirements in new subdivisions based on lot size.
