  summary: 'The Board considered Amendment #2 to the RESPEC agreement for pre-construction award and construction engineering services on the Raw Water Monitoring Project. It is funded within the project budget and includes meters to better track water production. A resident commented asking for clarification, and Trustee Hunter moved approval.'
