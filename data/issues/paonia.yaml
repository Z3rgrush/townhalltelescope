- title: Stage 2 water restrictions and water supply
  summary: After unusually high water use, the Board considered Stage 2 restrictions under Resolution 19-26 on August 18. The reported treated-water storage would last about eight days without restrictions. Hand and drip watering of gardens was allowed. Residents spoke about watering methods, fire hazards from dried lawns and penalties. On August 25 the Board asked for regular updates on tank levels and production, and on October 13 it was to consider Resolution 22-26 rescinding the restrictions.
