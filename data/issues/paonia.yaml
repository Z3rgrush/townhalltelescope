  summary: Staff found an inconsistency in Estate Zoning Table 16-2 and recommended considering 1.5 to two acres per dwelling to support the Comprehensive Plan's housing-density goals. The Planning Commission and Town Board have been considering the tables. The Board sent the matter to a work session and then a revised ordinance. It was again on the Sept 1 agenda.
