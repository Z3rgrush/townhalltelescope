- title: Short-term rental rules and the draft Common Ground Ordinance
  summary: An ad hoc committee has met repeatedly since August to go through the proposed Common Ground Ordinance on short-term rentals, line by line. It has leaned toward registration with no fee for owner-occupied rentals, a fee limited to administrative cost for whole-home rentals, self-certified safety, tax compliance, and a saturation threshold (the draft says 8% of housing stock) that would pause new registrations. The Board of Trustees would set final fees and requirements. Survey respondents mostly raised housing, noise, parking and tax concerns.
