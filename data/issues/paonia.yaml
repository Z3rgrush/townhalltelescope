- title: 2027 budget work sessions
  summary: The 2027 budget was presented Oct. 27 and the Board asked for weekly budget work sessions separate from other meetings. Sessions were held in October and November, including a discussion of a solid waste enterprise. Staff also suggested creating a Community Development position.
