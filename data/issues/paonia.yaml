- title: Town code rewrite and new ordinances
  summary: The Town is rewriting its code through a recodification project, and the Board considered renewing the Sustainable Futures contract. It is reviewing consolidated ordinances, including a single nuisance ordinance, combined juvenile loitering and curfew rules, and solid waste rules (Ordinance 01-26). It is also considering repealing the business sidewalk-use ordinance, amending the animal code, and a tobacco sales ordinance (06-26). Ordinances from rejected citizen initiative petitions were also on the agenda.
