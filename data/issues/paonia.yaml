- title: Zoning code rewrite, estate zoning density, ADUs and subdivision rules
  summary: The Town is rewriting its zoning, subdivision and related codes to carry out the 2025 Comprehensive Plan, with smaller lots, ADUs by right, infill, impact fees and streamlined review. Staff also proposed fixing an inconsistency in Estate Zoning Table 16-2 and allowing 1.5 to two acres per dwelling. The Planning Commission is looking at ADU rules and sidewalks in new subdivisions, and a rezoning application from David Warren went to public hearing.
