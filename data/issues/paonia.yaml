- title: Short-term rental regulation and the Common Ground Ordinance
  summary: An ad hoc committee is going through the proposed Common Ground Ordinance section by section. Topics so far include registration with no numerical cap, a fee only for non-owner-occupied rentals, self-certified safety measures, tax compliance, liability insurance, a local contact, and neighbor notification. Residents have sent written comments and survey responses, many raising housing, noise, parking and water concerns. The committee has not reached final consensus on every point, and the Board of Trustees would set final requirements and fees.
