  - Environment & climate
- title: Yurt limits and Colona zone changes in the zoning draft
  summary: Staff suggested the Planning Commission and county commissioners consider limiting yurts to one per parcel in the Alpine zone or all zones, to prevent multiple yurts claiming building code exemptions. The draft also adds a 'Commercial Storefront' special use to the Colona Zone.
  where: Alpine zone and Colona zone
