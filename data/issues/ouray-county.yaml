- title: 'Land Use Code rewrite: zoning section and definitions'
  summary: The Planning Commission is working through a revised county Land Use Code under Resolution 2024-029, with Section 2 drafts followed by Section 3 (Zoning) and Section 13, and a public hearing planned once drafts are done. Proposed changes include new definitions and limits for accessory dwelling units, yurts, campgrounds, commercial outdoor recreation, short-term rentals and agricultural structures, and a possible 'Commercial Storefront' use in the Colona Zone.
  where: Countywide
  refs:
  - 2
  - 4
  topics:
  - Zoning & development
  - Housing
  - Short-term rentals
- title: Water-wise landscaping requirements in the Land Use Code
  summary: Draft Section 3.11 would add state-driven water-wise landscaping rules for new development, with a broad definition of invasive plants and exceptions such as artificial turf on athletic fields of play that still need clarification.
  where: Countywide
  refs:
  - 4
  topics:
  - Water
  - Zoning & development
  - Environment & climate
- title: Tribal consultation for renewable energy projects in zoning code
  summary: Staff say they reached out to Tribes about state-law consultation requirements for renewable energy projects and will discuss scope and proposed code language if the Tribes reply.
