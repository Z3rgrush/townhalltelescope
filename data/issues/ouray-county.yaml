- title: 'Land Use Code rewrite: definitions, ADUs and special use permits'
  summary: The Planning Commission is working through a multi-section rewrite of the county Land Use Code under Resolution 2024-029. Drafts address accessory dwelling unit size and distance limits (including a 'bonus ADU' concept), agricultural structures needing building permits, and new or revised Special Use Permits for guest lodges, guest ranches, event venues, campgrounds and commercial outdoor recreation. Staff plan to finish Section 2, move to Section 3 (Zoning), and hold a public hearing after revised drafts of Sections 3 and 13.
  where: Countywide
