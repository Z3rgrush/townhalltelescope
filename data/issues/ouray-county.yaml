- title: Fire flow and water supply definitions for subdivisions and PUDs
  summary: Staff proposed a broader definition of 'water supply' for PUDs and subdivisions, with minimum fire flow as a narrower requirement. Tri-County Water has said its existing hydrants may not meet minimum fire flow pressure and flow recommendations.
  where: Countywide (Tri-County Water service area)
  refs:
  - 0
  topics:
  - Water
  - Fire & emergencies
  - Zoning & development
- title: Water-wise landscaping and artificial turf rules in Zoning Section 3.11
  summary: Draft Section 3.11 adds state-driven 'water-wise' landscaping requirements for new development, including a broad invasive plant species definition and limits on artificial turf with an exception for athletic fields of play. Staff say the field-of-play wording needs further clarification.
  where: Countywide
