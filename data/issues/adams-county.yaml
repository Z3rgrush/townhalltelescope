- title: Strategic Growth Element and Water Master Plan
  summary: The county is updating its Comprehensive Plan with a 2026 Strategic Growth Element and compliance work. It is also adding a Water Master Plan and Statutory Water Supply Element. These went through study sessions and Planning Commission hearings from September to November.
