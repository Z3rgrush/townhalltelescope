- title: 2027 county budget
  summary: Commissioners heard 2027 budget presentations from nearly every county department in late August and early September. The County Manager's 2027 Proposed Budget came to the Oct. 13 hearing, with ongoing and one-time budget work and a third amendment to the 2026 budget in study sessions through Oct. 28.
