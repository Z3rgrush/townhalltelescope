- title: North Broadway County Revitalization Plan
  summary: The commissioners voted on Sept 29 to send the proposed North Broadway County Revitalization Plan to the Planning Commission. The Planning Commission took it up on Oct 8 and again on Oct 22, when it considered the Revitalization Authority covering about 263 acres.
  where: North Broadway area, unincorporated Adams County (about 263 acres, W 52nd Ave on the south)
