- title: Development Standards Overhaul
  summary: Staff are rewriting the county's Development Standards and Regulations, with text amendments and zoning map changes to match. The overhaul went through commissioner study sessions in August and September and a Planning Commission hearing on Oct. 22. The county also adopted its 2025 Official Zoning Maps on Oct. 6.
