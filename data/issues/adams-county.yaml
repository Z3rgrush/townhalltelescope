- title: Development Standards Overhaul
  summary: Staff briefed the commissioners in August and September on a comprehensive rewrite of the county's Development Standards and Regulations. The Planning Commission was scheduled to hear a text amendment plus zoning map amendments to align the map with the new standards on Oct 22.
