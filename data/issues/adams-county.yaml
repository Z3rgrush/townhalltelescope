- title: Battery storage, substation and solar facility permits
  summary: The Planning Commission heard conditional use permits for a battery energy storage facility and utility substation near 12500 Cavanaugh Road. It also heard permits for a major energy facility, utility transmission line and large-scale solar facility at 6301 Manilla Road.
