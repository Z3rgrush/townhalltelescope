- title: Affordable housing, Balanced Housing Plan and homelessness response
  summary: The county is working on a Balanced Housing Plan, rebated building permit fees for affordable housing, and a $95,000 Brothers Redevelopment neighborhood stability agreement. It also funded Village Exchange Center's homelessness response and assigned its 2026 private activity bond cap to Maiker Housing Partners. Bonds for the Overlook at Thornton apartments were also up for refinancing.
