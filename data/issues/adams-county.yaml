- title: Balanced Housing Plan and affordable housing support
  summary: The county discussed its Balanced Housing Plan in a commissioner study session and a Planning Commission session. The county amended its 2026 fee schedule to rebate building permit fees for affordable housing, and assigned its 2026 private activity bond allocation to Maiker Housing Partners. Housing counseling and bond refinancing for Overlook at Thornton also came up.
