- title: North Broadway County Revitalization Plan and Authority
  summary: The commissioners sent the proposed North Broadway County Revitalization Plan to the Planning Commission on September 29. The Planning Commission took it up in October. A hearing covers about 263 acres in unincorporated Adams County, between Broadway and Bannock Streets and the Union Pacific tracks. A County Revitalization Authority Fund was also on the November 10 consent agenda.
  where: North Broadway area, about 263 acres, unincorporated Adams County (W 52nd Ave south boundary)
