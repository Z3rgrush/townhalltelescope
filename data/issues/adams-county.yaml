- title: Balanced Housing Plan and affordable housing support
  summary: The county is developing a Balanced Housing Plan as a Comprehensive Plan amendment. It was reviewed in study sessions and Planning Commission sessions in October and November. The commissioners also approved rebating building permit fees for affordable housing and assigned the county's 2026 private activity bond cap to Maiker Housing Partners.
