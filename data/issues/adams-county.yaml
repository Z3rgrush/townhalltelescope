- title: North Broadway County Revitalization Plan
  summary: Commissioners sent the proposed North Broadway County Revitalization Plan to the Planning Commission on Sept. 29. The Planning Commission took it up in October for the roughly 263-acre area bounded by West 52nd Avenue on the south and the Union Pacific tracks on the west.
  where: North Broadway area, unincorporated Adams County (about 263 acres, north of West 52nd Avenue)
