- title: North Broadway County Revitalization Plan
  summary: The county proposed a revitalization plan and authority for about 263 acres of unincorporated land around Broadway, bounded by West 52nd Avenue and the Union Pacific tracks. Commissioners sent the plan to the Planning Commission on Sept. 29, and the commission took it up in October.
