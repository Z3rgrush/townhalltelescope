- title: 2027 county budget development
  summary: Commissioners heard 2027 budget presentations from nearly every department in study sessions from late August into September. The County Manager's 2027 Proposed Budget came to the Oct. 13 hearing, followed by sessions on one-time budget items, sponsorships and changes from proposed to adopted budget. A third amendment to the 2026 budget was also on the agenda.
