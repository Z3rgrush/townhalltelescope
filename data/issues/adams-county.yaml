  summary: Commissioners heard 2027 budget presentations from nearly every department and office in late August and early September, including Public Works, Human Services, the Sheriff, Public Health and the Air & Space Port. The County Manager's 2027 Proposed Budget was on the Oct 13 hearing agenda, and budget development continued Oct 14.
