- title: Homelessness response funding and Irondale Mobile Home Park acquisition
  summary: The county approved $95,000 for Brothers Redevelopment's Neighborhood Stability Project and agreements with Village Exchange Center for transformational homelessness response. Commissioners also scheduled study sessions on a possible acquisition of the Irondale Mobile Home Park.
