- title: Battery storage, substation and solar facility proposals
  summary: The Planning Commission heard conditional use permit requests for a battery energy facility and utility substation at 12500 Cavanaugh Road. It also heard requests for a major energy facility, transmission line and large-scale solar facility at 6301 Manilla Road.
