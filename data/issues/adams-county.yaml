- title: Balanced Housing Plan and affordable housing support
  summary: Commissioners and the Planning Commission reviewed the Adams County Balanced Housing Plan. The board also amended the 2026 fee schedule to rebate building permit fees for affordable housing. It assigned the county's 2026 private activity bond volume cap to Maiker Housing Partners and acknowledged a public hearing on refunding bonds for the Overlook at Thornton apartments.
