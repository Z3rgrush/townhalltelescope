- title: 2027 county budget
  summary: Commissioners held department-by-department 2027 budget presentations in study sessions from late August into early September. The County Manager's 2027 Proposed Budget came to the public hearing on October 13. Study sessions in October and November covered one-time budget items, changes from proposed to adopted budget, and a third amendment and supplemental appropriation to the 2026 budget.
