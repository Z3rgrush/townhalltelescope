- title: Battery storage, substation and solar energy facility permits
  summary: The Planning Commission was set to hear conditional use permit requests for a battery energy storage facility and utility substation near 12500 Cavanaugh Road. It was also to hear a request at 6301 Manilla Road for a major energy facility, a utility transmission line and a large-scale solar facility.
