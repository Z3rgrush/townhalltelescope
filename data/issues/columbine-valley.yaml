- title: Recreational lighting rules and moratorium at Columbine Country Club
  summary: A resident at 8 Driver Lane raised concerns about Planning and Zoning lighting regulations and asked for a moratorium and a clear process for sharing plans. Trustees approved first reading of zoning code amendments, including the Country Club (CC) District lighting section, in October. In November a study session on recreational, sports and parking lighting led to a directive to draft a moratorium ordinance.
