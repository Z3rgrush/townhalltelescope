- title: Royal Gorge Lease Agreement termination and Royal Gorge Mountain Park
  summary: Council held closed-session discussions on negotiation strategy about terminating the Royal Gorge Lease Agreement with Royal Gorge Company of Colorado. Council also took up a grant application for Royal Gorge Mountain Park (Resolution 13, removed from the Oct. 5 agenda), and a trails committee discussed the South Rim Trail.
