- title: 2027 city budget and budget workshops
  summary: Staff planned the 2027 budget through committee workshops covering police, parks improvement, stormwater and raw water, and discussed using 2026 underspending for critical needs. A public hearing on the 2027 budget was held Oct. 21, showing taxes of about $18.5 million and funds for streets, water, stormwater, the 3rd Street Connector and the pool tax.
