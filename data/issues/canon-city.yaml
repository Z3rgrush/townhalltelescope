- title: Royal Gorge lease termination and Royal Gorge Mountain Park trails
  summary: Council held closed sessions on negotiation strategy for terminating the Royal Gorge lease agreement with Royal Gorge Company of Colorado. Council also considered a state grant resolution for Royal Gorge Mountain Park, which was removed from the October 5 agenda. The Trails Committee planned to walk the contemplated South Rim Trail.
