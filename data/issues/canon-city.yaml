- title: Water supply, drought response, rates and bulk water policy
  summary: Council and the Water Committee discussed water quality, water bills and availability during the drought, including which tier of the shortage response plan to adopt. The committee also reviewed a bulk water kiosk policy and a proposed 7% water rate increase, and a special July 9 meeting dealt with water restrictions.
