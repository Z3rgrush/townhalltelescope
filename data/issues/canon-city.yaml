- title: 2027 city budget
  summary: Council held budget hearings on Oct 21 and Nov 2-4 and moved to adopt the 2027 budget by resolution and ordinance in mid-November. Committees held budget workshops on police, parks, stormwater and raw water, and discussed 2026 underspending. The budget covers street projects funded by the 2A tax, water and stormwater funds, parks and the pool tax fund.
