- title: 2027 city budget and budget workshops
  summary: Staff began 2027 budget planning in August and held committee workshops on police, the Parks Improvement Fund, stormwater and raw water. Council held the 2027 budget public hearing on October 21 and continued it on November 2. The budget includes street, water, stormwater and park projects. The committee also discussed 2026 underspending and a compensation study.
