- title: Ditch and culvert maintenance rules
  summary: Council and the Water Committee reviewed proposed code language defining culverts, ditches and obstructions. Property owners would maintain private culverts and stormwater-only ditches, and ditch companies would maintain irrigation ditches. The Water Committee also took up Title 19.
