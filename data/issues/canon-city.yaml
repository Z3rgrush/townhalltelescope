- title: Centennial Park plaza and parking design options
  summary: Council weighed two design options for a public plaza and about 17 parking spaces. The first uses bids from April 2026 of $939,559.78 and $971,290.03, with Gordon Construction asking a $10,000 adjustment. The second is a basic plaza with the stage, restroom and electrical removed, needing $57-94K to design and possibly stormwater work. Funding is 100% city dollars.
