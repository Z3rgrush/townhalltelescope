- title: 2A street program and pavement management
  summary: Staff reported 40 roadway projects completed under the 1% 2A street sales tax, which was renewed through 2036. Projects include N 9th Street segments and a Griffin Avenue design slated to bid in October 2026. Staff recommended delivery methods for 2027 projects, updating the pavement plan in 2028, and continued magnesium chloride on gravel roads. Ordinance 14 amends code on the 2A tax.
