- title: Community pool ballot question and sales tax IGA with the Recreation and Park District
  summary: Council and the Cañon City Area Recreation and Park District worked on ballot language and a revised pool project, including Resolution 12 asking voters to let the city retain previously collected 0.30% pool sales and use tax and continue collecting it. An intergovernmental agreement caps bonds at $18 million and says that if the 2026 question fails, collection of the tax ends.
