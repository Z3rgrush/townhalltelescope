- title: Community pool sales tax and agreement with the Recreation and Park District
  summary: Council took up an intergovernmental agreement with the Cañon City Area Metropolitan Recreation and Park District and Resolution 12 on keeping the 0.3% pool sales and use tax and collected revenue. The draft agreement caps bonds at $18 million for a community pool facility, to be operated as an extended seasonal pool, and says the tax would end if the 2026 ballot question fails.
