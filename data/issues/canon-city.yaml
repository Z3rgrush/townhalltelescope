- title: Ditch and culvert maintenance rules
  summary: Draft code language defines culverts, ditches and obstructions and puts maintenance of private culverts and stormwater ditches on property owners. It was before Council on October 7 and the Water Committee on October 28 under a Title 19 discussion.
