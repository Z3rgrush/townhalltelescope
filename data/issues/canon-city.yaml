- title: Pool ballot question and sales tax agreement with the Recreation and Park District
  summary: Council met jointly with the Cañon City Area Recreation and Park District on ballot language and a revised pool project. Resolution 12, Series 2026 asks voters to let the city keep previously collected tax and continue the temporary 0.30% sales and use tax for the community pool. The related intergovernmental agreement with the District caps bonds at $18 million and would end collection if the question fails.
