- title: City compensation and classification study, including police pay
  summary: Staff presented a compensation and classification plan that moves many positions up pay grades, such as parks and streets crew leaders, water plant operators and police records technicians. Council was asked whether to fund phase 1 for police officers or the full plan in the 2027 budget. A committee also reviewed compensation and retention for police.
