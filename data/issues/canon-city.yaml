- title: Water quality, drought, bills and rate increases
  summary: Council and the Water Committee discussed water quality, water bills, drought availability and which tier of shortage response plan to adopt. The committee reviewed a 7% water rate increase and a 3.9% stormwater rate increase. Ordinances 19 and 20 on water and stormwater rates were on the November 2 agenda.
