- title: Public plaza and parking design options with bids near $940K–$971K
  summary: 'Council weighed two design options for a public parking and plaza site: the bid design, with low bids of $939,559.78 (Gordon Construction) and $971,290.03 (IS West), or a cheaper concept without stage and restrooms that needs $57–94K more design work and likely stormwater features. Funds are 100% city dollars budgeted in 2026 and proposed for 2027.'
