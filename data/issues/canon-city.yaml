- title: 2A streets program and pavement plans
  summary: Staff reported 40 road projects completed under the voter-approved 1% 2A sales tax, which now runs through 2036. Contracts were awarded for N 9th Street segments ($2.14M and $4.83M), and 2027 projects include S 12th, College Ave and Harding Ave. Staff also recommended continuing magnesium chloride on gravel roads and updating the Pavement Management Plan in 2028. Council also took up an ordinance amending 2A tax code sections.
