- title: Sale and lease of Town mineral rights near the Draco drilling pad (SM Energy)
  summary: Council approved Ordinance 26-028 on June 23 to sell Town-owned mineral rights to SM Energy. SM Energy terminated the contract Aug. 19 and Council repealed the ordinance Aug. 25. On Sept. 1 staff asked for direction on a lease offer (a $12,000 per net mineral acre bonus, about $1.36M) and on the state ECMC drilling and spacing process.
