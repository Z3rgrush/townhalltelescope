- title: 2027 budget and revenue slowdown
  summary: Staff told Council that sales tax growth is under 2% and use tax and building permits are down over 40%, so the 2027 budget limits new staff to health-and-safety needs. Study sessions ran Aug. 18 and Oct. 6, with first reading of the proposed 2027 budget set for Oct. 27; advisory boards such as Tree and Sustainability saw their budgets cut.
