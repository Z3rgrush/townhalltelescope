  summary: The Urban Renewal Authority and Council approved an amendment with Weld County removing the requirement that tax increment between $10M and $14M go to Weld County Road 5, and adding parks and recreation facilities as eligible improvements. The URA also adopted its 2027 budget ($5.75M revenue) with Briggs Alleyway stormwater as the main capital project.
