- title: Page property rezoning and open space protection
  summary: The Open Space and Trails board recommended rezoning Page property land west of the Cottonwood Extension Irrigation Ditch as Reserved Open Space. Council discussion of the property is set for Nov. 10. A rezoning at 1025 Weld County Road 1 1/2 was also on the board's agenda, and a joint session with Planning Commission on Oct. 21 covered how to protect open space, which needs voter approval to sell or rezone.
