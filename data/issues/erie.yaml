- title: Page property rezoning and open space protection
  summary: The Open Space and Trails board recommended rezoning land west of the Cottonwood Extension Irrigation Ditch on the Page property as Reserved Open Space. Council discussion is set for Nov. 10, and a rezoning application for 1025 Weld County Road 1½ was on a Sept. 14 agenda. The Planning Commission and the board are planning a joint study session on Oct. 21 about open space zoning and protection.
