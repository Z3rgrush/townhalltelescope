- title: Town mineral rights, SM Energy Draco pad and lease offer
  summary: Council approved Ordinance 26-028 on June 23 to sell Town-owned minerals to SM Energy. SM Energy terminated the contract on Aug. 19 and Council repealed the ordinance on Aug. 25. On Sept. 1 staff sought direction on leasing the minerals (an offer of $12,000 per net mineral acre, about $1.36M) and on the state ECMC process for the Draco drilling and spacing unit.
