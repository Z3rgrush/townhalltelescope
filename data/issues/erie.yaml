- title: 2027 Town budget and revenue slowdown
  summary: Staff say sales tax growth is below 2% and use tax and building permits are down over 40%, so the 2027 budget limits new staff to health-and-safety needs. Council held study sessions Aug. 18 and Oct. 6, with public hearings Oct. 27 and Nov. 10. Advisory boards were asked to cut budgets, such as Tree Board to $4,750 and Sustainability to $9,928.
