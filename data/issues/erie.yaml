  summary: Residents spoke against any changes to the Comp Plan on Sept. 8, citing water shortage and traffic on Alpine and Primrose. The Planning Commission discussed Prop 123 resolutions; staff said Erie is asking to reduce its Prop 123 unit requirement to 30 units. A comp plan amendment creating a medium-low density designation was reported approved in early November.
