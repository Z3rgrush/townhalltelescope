- title: Erie airport fees, hangar leases and noise complaints
  summary: A resident asked for more regulation of early-morning touch-and-go flights. The board discussed residential through-the-fence fees (a council proposal in December), commercial fees, and a possible ballot question allowing land leases longer than 20 years for hangar development. A hangar presentation to Council is set for Oct. 13.
