- title: Sale vs. lease of Town mineral rights to SM Energy (Draco pad)
  summary: Council approved Ordinance 26-028 on June 23 to sell Town-owned minerals to SM Energy, but SM terminated the contract Aug. 19 and Council repealed the ordinance Aug. 25. On Sept. 1 Council discussed leasing the minerals instead (an offer at $12,000 per net mineral acre, about $1.36M bonus) and how the Town should take part in the state ECMC drilling and spacing process for the Draco pad.
