- title: 2027 Town budget and revenue shortfall
  summary: Staff said sales tax growth is below 2% and use tax and building permits are down over 40%, so the 2027 budget limits new staff to health and safety needs. Council held study sessions Aug. 18 and Oct. 6 and saw the proposed budget on first reading Oct. 27. Advisory boards were asked to trim their own 2027 budgets, for example the Tree board from $5,000 to $4,750 and Sustainability to $9,928.
