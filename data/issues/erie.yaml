- title: Town mineral rights and the Draco oil and gas pad
  summary: After SM Energy backed out of buying town-owned mineral rights for its Draco drilling project, council repealed the sale ordinance and discussed whether to lease the minerals instead and what role the town should play in the state drilling permit process.
  where: Draco Pad
  refs: [12, 14, 15]
- title: New oil and gas rules and fees
  summary: The planning commission reviewed a rewrite of the town's oil and gas regulations covering per-well fees, legacy wells, noise, air quality, inspections and notification, with a resident urging higher inspection fees.
  where: Townwide
  refs: [16, 24]
  public_comment: true
- title: 2027 budget cuts amid falling revenue
  summary: With sales tax growth under 2% and use tax and building permits down more than 40%, staff built a leaner 2027 budget with few new positions; advisory boards were told to cut their budgets, and hearings were set for October 27 and November 10.
  where: Townwide
  refs: [0, 3, 5, 6, 17, 19, 34, 35]
- title: Page property open space rezoning
  summary: The open space board recommended rezoning land on the Page property west of the Cottonwood Extension Ditch as Reserved Open Space, which needs voter approval to ever sell or rezone, ahead of a council discussion set for November 10.
  where: Page property, near Reliance Park and CR 1.5
  refs: [1, 4, 44]
- title: Protecting open space through zoning
  summary: The planning commission and open space board held a joint session on how open space is zoned, the Reserved Open Space district, the land acquisition strategy and how the open space board reviews development.
  where: Townwide
  refs: [1, 4, 44]
- title: Vista Ridge golf course and Vista Reserve development
  summary: The planning commission and council took up two amendments to the Vista Ridge planned development, including changes for the golf course and the Vista Reserve preliminary plat.
  where: Vista Ridge
  refs: [7, 18, 38]
  public_comment: true
- title: Short-term rental rules
  summary: The planning commission and council held hearings on adding a short-term rental chapter to the town's development code.
  where: Townwide
  refs: [36, 37, 38]
  public_comment: true
- title: Erie Municipal Airport noise, hangars and fees
  summary: Residents complained about early-morning touch-and-go flights, while the airport board worked on hangar development, through-the-fence fees and a possible charter change to allow longer land leases, and council got a hangar development update.
  where: Erie Municipal Airport
  refs: [8, 25, 38, 40]
  public_comment: true
- title: Hiring a new town manager
  summary: After 60 applications and interviews, council appointed Kelli Johnson as town manager starting January 4, 2027.
  where: Townwide
  refs: [32, 33, 41, 42]
- title: Colliers Hill urban renewal tax increment
  summary: The urban renewal authority and council approved tax increment agreements for the Colliers Hill area, including a Weld County amendment that drops a requirement to spend some revenue on Weld County Road 5 and allows parks and recreation projects.
  where: Colliers Hill
  refs: [10, 11, 12, 27, 28]
- title: Downtown Briggs Street redevelopment
  summary: The urban renewal authority paid for downtown infrastructure and design work and took up a development agreement for 150 Briggs Street, while council approved sidewalk patio licenses for businesses on Briggs Street.
  where: Briggs Street, downtown Erie
  refs: [11, 27, 29]
- title: Erie Lake Dam seepage repairs
  summary: Council amended the design and construction contracts for the project to fix seepage at the Erie Lake dam.
  where: Erie Lake
  refs: [18]
- title: Proposition 123 affordable housing commitment
  summary: The town is asking the state to cut its Proposition 123 affordable housing requirement to 30 units, and planners discussed how the commitment will shape the development code update.
  where: Townwide
  refs: [37]
- title: Lodging tax and sales tax ballot measures
  summary: Two ballot measures are coming, a proposed 3.5% lodging tax tied to the Sundance Film Festival and a proposed sales tax increase.
  where: Townwide
  refs: [4]
- title: Coal Creek rezoning and stream restoration
  summary: The planning commission heard a rezoning of the Coal Creek property, and council authorized buying land for the County Line Road and Coal Creek stream restoration project.
  where: Coal Creek, County Line Road
  refs: [18, 36]
- title: Water purchases and conservation
  summary: Council approved buying Colorado-Big Thompson water units, a home water audit program with Boulder County, and heard a presentation on Northern Water's NISP reservoir project.
  where: Townwide
  refs: [12, 29]
- title: Flock cameras and security
  summary: Council met in executive session on security arrangements and Flock Safety license plate camera technology.
  where: Townwide
  refs: [21, 22]
