- title: Town mineral rights sale to SM Energy repealed; lease talks for the Draco drilling project
  summary: Council approved Ordinance 26-028 on June 23 to sell Town mineral rights to SM Energy. SM Energy terminated the contract Aug. 19 and Council repealed the ordinance Aug. 25. On Sept. 1 Council was asked for direction on a possible lease (an offer of $12,000 per net mineral acre, about $1.36M bonus) and on the state ECMC process for the Draco pad.
