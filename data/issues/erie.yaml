- title: Airport noise, hangar leases and through-the-fence fees
  summary: A resident asked for more regulation of early-morning touch-and-go flights. The airport board discussed residential through-the-fence fees (a staff proposal goes to Council in December), a hangar presentation to Council on Oct. 13, and a charter change to allow land leases longer than 20 years. It is also looking at modernizing the airport fund code.
