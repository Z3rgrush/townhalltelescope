- title: 2027 Town budget and work plan
  summary: Council held budget study sessions on Aug. 18 and Oct. 6 on forecast assumptions. Sales tax growth is below 2% and use tax and building permits are down over 40%, so staff are minimizing new positions. The first reading of the 2027 proposed budget was set for Oct. 27. Advisory boards, including Sustainability (reduced to $9,928) and Tree (reduced to $4,750), are working with trimmed budgets.
