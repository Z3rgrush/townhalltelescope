- title: 'Urban Renewal: Colliers Hill tax increment and downtown projects'
  summary: The Urban Renewal Authority amended the tax increment agreement with Weld County for the Colliers Hill plan area. The amendment removes the requirement that revenue between $10M and $14M go to Weld County Road 5 and adds parks and recreation facilities. The Authority also approved $30K more for FHU design work on a bridge project and took up a disposition agreement for 150 Briggs. Council approved a related agreement with the URA.
