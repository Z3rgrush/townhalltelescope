- title: Whether to block De Soto's TIF for a senior care project
  summary: A commissioner asked the board to declare De Soto's proposed TIF district for an assisted living and memory care project harmful to the county and block it, citing ambulance service costs. Competing motions failed, and the board asked for county-wide incentive guidance to come back to a committee of the whole.
  where: De Soto
  refs: [2]
- title: 2027 county, park and library budgets
  summary: Johnson County adopted its 2027 budget with about $1.13 billion in spending and $309 million in property tax, along with a $549 million wastewater budget, park and library district budgets and a 2027–2031 capital plan. Consolidated Fire District No. 1 held a hearing on exceeding its revenue-neutral rate, and the three fire districts' budgets were approved.
  refs: [3, 6, 8]
- title: Wastewater plant upgrades
  summary: The county approved about $20.5 million for treatment upgrades at the New Century Air Center plant, $9.9 million for Tomahawk Creek plant improvements, bonds for wastewater work and a bigger sludge hauling contract, and held a hearing on using construction manager at risk for future wastewater projects.
  refs: [0, 1, 7, 15]
- title: Stormwater and green infrastructure money for cities
  summary: Johnson County awarded nearly $1.2 million in green infrastructure grants to Bridging the Gap, Ducks Unlimited and the park district, funded stormwater studies and repairs with Olathe, Merriam, Spring Hill and Lenexa, and discussed a community-based partnership model for watershed work.
  refs: [0, 2, 4, 8, 15, 17]
- title: Bipartisan appointments to county boards
  summary: The board adopted a process where the chair nominates and the board appoints a bipartisan slate to county boards and commissions, then worked through appointments to zoning, housing and fire district boards.
  refs: [0, 4, 10, 12, 16]
- title: Rewriting county zoning and subdivision rules
  summary: Commissioners held a study session on the second module of the county's zoning and subdivision regulations update, while approving rural permits such as an accessory dwelling near Mission Road and a subdivision at 127th Street and Moonlight Road.
  refs: [10, 14, 15]
- title: Ambulance coordination and De Soto police costs
  summary: The county moved to full cost recovery on its police services contract with De Soto and took up a coordinated emergency medical services agreement with Overland Park, Shawnee and the three consolidated fire districts.
  refs: [11, 19]
- title: Sheriff parking structure and facility projects
  summary: The board hired Icon Structures for a sheriff's parking structure and site security project at New Century, replaced the administration building's underground fuel tanks and financed Health Services Building work through Public Building Commission bonds.
  refs: [1, 7, 10]
- title: Roads, bridges and transit vehicles
  summary: The county joined KDOT and Gardner on replacing the Moonlight Road bridge over I-35, added design money for Mission Road reconstruction, partnered with Leawood on Roe Avenue and moved $400,000 into transit vehicle replacement.
  refs: [11]
- title: Habitat for Humanity homes at Heritage Park
  summary: The county amended Habitat for Humanity Kansas City's federal HOME funding contracts for the Pathway at Heritage Park project.
  refs: [11]
- title: Closed-door talks on an economic development project
  summary: Commissioners went into executive session to discuss confidential financial information for an unnamed economic development project, "County Project 1."
  refs: [16]
