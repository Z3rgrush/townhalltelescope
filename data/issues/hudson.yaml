- title: Prestige Builder Group settlement for Canterbury Meadows development
  summary: Council held a public hearing on Resolution 26-118, which would settle litigation and a multi-million dollar claim by approving a 32-lot conservation development on about 94.56 acres at Ravenna Street and Stow Road. Neighbors raised concerns about water runoff, the high water table, and Council overriding the Planning Commission and Land Development Code. The Planning Commission has also asked for separate legal counsel on the agreement.
  where: Ravenna Street and Stow Road
