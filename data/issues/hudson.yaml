- title: Clinton Crossing downtown development
  summary: Staff and Council reviewed the Clinton Crossing concept plan, including housing unit counts, a market hall, railroad proximity, parking studies and public finance tools such as TIF and new community authorities. Residents worry about traffic at Owen Brown Street and Morse Road and the one-lane railroad underpass, and about consistency with the Comprehensive Plan. A concept site plan hearing was set before the Planning Commission on Nov. 9.
  where: Clinton Street, Owen Brown Street and Morse Road area
