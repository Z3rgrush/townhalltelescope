- title: Prestige Builder Group settlement for Canterbury Meadows development
  summary: Council held a public hearing on Resolution 26-118, a settlement of litigation and a multi-million-dollar claim with Prestige Builder Group over about 94.56 acres on Ravenna Street and Stow Road, to be developed as a 32-lot conservation subdivision. Neighbors and an attorney objected, citing water runoff, a high water table, and bypassing the Planning Commission. The Planning Commission has separately discussed the agreement and asked for its own legal counsel.
  where: Ravenna Street and Stow Road
