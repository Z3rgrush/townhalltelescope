- title: Prestige Builder Group settlement over Canterbury Meadows (Ravenna St & Stow Rd)
  summary: Council held a public hearing on Resolution 26-118, settling litigation and a multi-million-dollar takings claim with Prestige Builder Group for a 32-lot conservation development on about 94.56 acres. Neighbors say it bypasses the Planning Commission and the Land Development Code and worry about water runoff and a high water table. The Planning Commission has discussed the agreement and asked for separate legal counsel.
