  summary: Council reviewed the five-year capital plan, including streets, storm water, sidewalks, trails, Fiber-to-the-Home broadband and debt service. Discussion included whether to fund the Barlow Road sidewalk and reduce storm water allocations. A resolution adopting the plan in concept was on the Nov. 10 agenda, along with a GAI contract for the Barlow Road sidewalk re-design.
