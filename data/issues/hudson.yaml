- title: Canterbury Meadows settlement with Prestige Builder Group
  summary: Council considered Resolution 26-118, a settlement of litigation and a multi-million-dollar hardship takings claim over a 32-lot conservation subdivision on about 94.56 acres at Ravenna Street and Stow Road. Residents objected that it bypasses the Planning Commission and the Land Development Code and raised water run-off and high water table concerns. The Planning Commission also discussed the settlement and asked for separate legal counsel; the documents do not state a final vote.
