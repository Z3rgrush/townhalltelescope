- title: 2027 budget and 2027-2031 five-year capital plan
  summary: Council reviewed the 2027-2031 capital plan and the 2027 capital budget, covering streets, stormwater, sidewalks, trails, debt service and many funds. Council also discussed which unfunded projects to prioritize, including Fiber-to-the-Home, stormwater and the Barlow Road sidewalk, as income tax revenue shifted after a business departure. Council also accepted the county Budget Commission's property tax rates.
