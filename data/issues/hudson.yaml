- title: Low-speed vehicle rules (Ordinance 26-113, Chapter 478)
  summary: Council is amending Chapter 478 of the codified ordinances on low-speed vehicles such as golf carts. Residents objected that the draft bans travel on 35 MPH roads and questioned the rules on lights and equipment. The ordinance had its first reading on Aug. 11 and a second on Aug. 18, with further amendments proposed.
