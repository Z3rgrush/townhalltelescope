- title: Prestige Builder Group settlement for Canterbury Meadows (Ravenna Street and Stow Road)
  summary: Council held a public hearing on Resolution 26-118, settling litigation and a multi-million-dollar takings claim with Prestige Builder Group over a 32-lot development on about 94.56 acres. Neighbors raised drainage, high water table and precedent concerns and questioned why Council, not the Planning Commission, is deciding. The Planning Commission also discussed the agreement and asked for separate legal counsel.
  where: Ravenna Street and Stow Road
