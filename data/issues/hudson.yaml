- title: Clinton Crossing downtown site plan
  summary: The city is refining concept plans for the Clinton Crossing site, which would have single-family homes, townhomes, duplexes, a market hall, community center and possibly a boutique hotel. Council and staff discussed apartments, whether to use a Concept or Planned Development review, a single or multiple developers, parking studies and public finance tools like a TIF. A resident objected to the residential component.
