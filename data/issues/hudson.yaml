- title: Clinton Crossing downtown site plan and financing
  summary: Council and staff are reviewing three refined site plans for Clinton Crossing, with residents preferring single-family homes, townhomes and duplexes plus a market hall, community center and boutique hotel. Staff are weighing a Planned Development review and public finance tools such as TIF and special districts. A resident objected to the residential component.
