- title: Clinton Crossing downtown redevelopment
  summary: Council and the Planning Commission reviewed the Clinton Crossing concept site plan, including a market hall, a residential component, parking studies and the nearby railroad tracks. Council heard about public finance tools such as TIF, new community authorities and special improvement districts. A Planning Commission concept plan hearing was set for Nov. 9.
