- title: Clinton Crossing downtown redevelopment plan
  summary: Council and staff are working toward a concept site plan for Clinton Crossing, with three refined plans, a market hall, and possible single-family, townhome and duplex housing. Some council members and residents oppose apartments. In October, council heard about financing tools including a TIF, New Community Authority, special or business improvement district and a downtown redevelopment district. The Planning Commission was to get an introduction to the concept plan.
  where: Clinton Crossing, downtown Hudson
