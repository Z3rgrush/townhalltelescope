- title: Capital plan, unfunded projects and 2027 budget
  summary: Council discussed how to spend excess carryover on unfunded projects such as Fiber-to-the-Home broadband, stormwater work and the Barlow Road sidewalk, after income tax losses from the departure of a major employer. Staff presented the 2027-2031 Five-Year Capital Plan, with street, stormwater, sidewalk and trail projects and debt service. The 2026-2030 Walk and Bike Plan ranking of sidewalks was also reviewed.
