- title: Low-speed vehicle (golf cart) rules, Ordinance 26-113
  summary: Council is amending Chapter 478 on low-speed vehicles, with licensing, insurance, speed limits and bans on state routes and some 35 MPH roads. Residents asked Council to allow travel on 35 MPH roads and to focus on required equipment instead. The ordinance has had at least two readings with amendments.
