- title: Low-speed vehicle (golf cart) rules, Ordinance 26-113
  summary: Council is amending Chapter 478 on low-speed vehicles, with requirements for licensing, insurance, speed limits and a ban on state routes and 35 mph roads. Residents asked that short crossings be allowed and questioned equipment rules. The ordinance had second reading Aug 18 with amendments pending.
