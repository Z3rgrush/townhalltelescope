- title: FY 2026-27 city budget, 34-mill tax rate and new police positions
  summary: 'The Board approved the proposed 2027 budget items at an Aug. 25 special meeting, including a resolution setting the millage rate at 34 mills, pay adjustments for general fund employees, and Park and Recreation fee increases. It also funded police fleet additions and new positions: a sergeant, a code enforcement officer, an additional officer and a part-time parking enforcement officer. Contributions to the library, JL King Center, community theater, SMART system and animal shelter spay/neuter vouchers were also approved.'
  where: Citywide
