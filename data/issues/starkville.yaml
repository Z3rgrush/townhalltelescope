- title: Airport runway extension and hangar grants
  summary: 'The Board accepted MDOT matching offers of 2.5% on FAA grants for runway, taxiway and lighting extension work. It later took up change orders and new FAA grant applications for Corporate Hangar #3 and Phase III of the runway and taxiway extension plus overlay.'
