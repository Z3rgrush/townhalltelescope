- title: 2027 city budget, 34-mill rate and pay and staffing changes
  summary: At a special meeting on Aug. 25 the Board of Aldermen approved a resolution setting the FY2027 millage rate at 34 mills. It also approved general fund pay adjustments, Parks and Recreation non-utility increases, police fleet additions, and new police positions (a sergeant, code enforcement, an additional officer and part-time parking enforcement). Contributions to the SMART system, library, JL King Center, community theater and the humane society spay/neuter vouchers were also approved. Budgets for outside agencies were on the Aug. 18 agenda.
  where: Citywide
