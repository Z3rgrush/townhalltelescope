- title: Electric Department 2% rate increase and pole replacement plan
  summary: Staff presented a proposed 2% rate increase across all rate classes starting November 2026, the first since October 2016. It would raise about $650,000 a year and help fund a capital plan including replacing 856 wood poles, LED street lighting, and a grid resiliency grant project, with the proposed FY26-27 budget showing a $375,000 shortfall.
  where: Citywide (Starkville Utilities)
