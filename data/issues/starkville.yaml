  topics:
  - Budget & taxes
  - Policing & public safety
  - Fees & rates
- title: Electric rate increase and capital plan
  summary: Starkville Utilities proposed a 2% electric rate increase across all rate classes, starting November 2026 and continuing in later years. It would raise about $650,000 a year and is the first increase since October 2016. The plan funds replacement of 856 wood poles, LED street lighting, and a grid resiliency grant project with a $454,000 match. The proposed FY26-27 budget has a $375,000 shortfall.
  where: Citywide
