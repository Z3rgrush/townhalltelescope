- title: Amicus brief supporting Cook County assault-weapon ban
  summary: The county asked commissioners to ratify its participation with other jurisdictions in a U.S. Supreme Court amicus brief in Viramontes v. Cook County. The brief supports Cook County's ban on certain semiautomatic firearms, including AR-15-style rifles.
