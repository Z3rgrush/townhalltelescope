- title: Ballot measure to expand the Board of Commissioners from 3 to 5
  summary: On Aug. 25 the county fixed ballot titles for an initiative petition to increase the Board of County Commissioners from 3 to 5 members on the Nov. 3, 2026 ballot. The clerk confirmed the petition was sufficient. Commissioners also considered taking positions on other 2026 ballot measures.
