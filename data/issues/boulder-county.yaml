- title: County joins amicus brief backing Cook County assault weapons ban
  summary: Commissioners were asked to ratify Boulder County's participation in an amicus brief in Viramontes v. Cook County at the U.S. Supreme Court. The brief supports Cook County, Illinois's ban on certain semiautomatic firearms, including AR-15-style rifles.
