- title: Ballot measure to expand the Board of Commissioners from 3 to 5
  summary: The commissioners fixed the ballot title for a citizen initiative petition to increase the Board of County Commissioners from 3 to 5 members. The question goes on the Nov. 3, 2026 ballot after the Clerk confirmed the petition was sufficient. The board also considered taking positions on other 2026 ballot measures.
