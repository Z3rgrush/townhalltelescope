- title: Affordable housing funding and Housing Authority actions
  summary: The county reviewed its Affordable and Attainable Housing Tax Innovation Fund and awarded $1,084,000 for Willoughby Corner Phases II and III in Lafayette. It assigned private activity bond volume cap to the Housing Authority and renewed a $956,189 rapid re-housing grant. The Housing Authority's 2027 Annual Plan and Moving to Work supplement were approved after a public hearing.
