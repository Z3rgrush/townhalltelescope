- title: 2027 Boulder County budget and general fund reductions
  summary: Commissioners discussed efficiencies and general fund budget reduction recommendations in August, held a town hall in Superior on the 2027 budget, and heard department presentations on Oct. 13, 15 and 22. Public testimony was taken at the Oct. 22 hearing, with a work session Nov. 5 and adoption set for Dec. 8.
