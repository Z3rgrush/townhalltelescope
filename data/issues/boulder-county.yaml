- title: 2027 Boulder County budget
  summary: Commissioners held a town hall on the 2027 budget (Aug. 18), department presentations (Oct. 13-22), a public hearing on the recommended budget on Oct. 22, and a Nov. 5 work session. Adoption is scheduled for Dec. 8. Budgets for five county public improvement districts were also reviewed.
