- title: 2027 Boulder County budget
  summary: The commissioners held town halls, department budget presentations (Oct. 13, 15 and 22), a public hearing on the 2027 recommended budget on Oct. 22 and a Nov. 5 work session. Adoption is scheduled for Dec. 8. Allenspark resident Edward Yagi spoke at the hearing.
