- title: Amicus brief supporting Cook County's ban on semiautomatic firearms
  summary: The County Attorney asked commissioners to ratify Boulder County's participation with other jurisdictions in a U.S. Supreme Court amicus brief in Viramontes v. Cook County. The brief supports Cook County's ban on certain semiautomatic firearms, including AR-15-style rifles.
