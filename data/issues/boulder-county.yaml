- title: Proposed data center and detention center land use rules
  summary: The Planning Commission was scheduled to take up Land Use Code amendments that would define data centers as a specific use and set where and at what scale they may be permitted in unincorporated Boulder County (Docket DC-26-0003). A companion amendment (DC-26-0004) does the same for detention centers, with a recommendation going to the commissioners.
