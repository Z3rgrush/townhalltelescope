- title: 2027 Boulder County budget
  summary: The county presented the 2027 recommended budget in departmental sessions in October, held a Superior town hall on it Aug. 18, and took public testimony at an Oct. 22 hearing. Budget adoption is set for Dec. 8. Work sessions also covered general fund reduction recommendations and an efficiencies project.
