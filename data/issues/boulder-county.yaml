- title: County rules for data centers and detention centers
  summary: The Planning Commission was scheduled on Oct. 21 to consider Land Use Code text amendments (DC-26-0003 and DC-26-0004) that would define data centers and detention centers as specific uses and set where and at what scale they could be permitted in unincorporated Boulder County. The data center item and the detention center item each go to the commissioners as a recommendation.
