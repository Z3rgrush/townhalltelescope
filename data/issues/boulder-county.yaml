- title: Wildfire mitigation grants and fire restrictions
  summary: The commissioners approved strategic fuels mitigation funding of $191,350 for Superior's grazing program and a $990,262.88 grant for Conifer Hill work by The Watershed Center. Stage 1 fire restrictions in the mountain area were rescinded effective Oct. 15.
