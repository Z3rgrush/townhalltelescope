- title: Energy Impact Offset Fund sunset and marijuana rules
  summary: The commissioners held a hearing and approved Resolution 2026-0070. It sunsets the Energy Impact Offset Fund, which charged cultivators quarterly fees based on energy use, and amends marijuana regulations, including extending license terms from one to two years.
