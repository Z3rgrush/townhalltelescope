- title: Housing authority funding, grants and annual plan
  summary: The county pursued homelessness and housing money, including a $300,000 youth housing grant application, a $571,307 application, reallocation of state funds to Family Bridge Housing and a $1.08M grant for Willoughby Corner Phases II and III at 928 Canterbury Drive, Lafayette. Commissioners also approved the Housing Authority's 2027 Annual Plan and Moving to Work Supplement after a public hearing, and assigned private activity bond cap. A work session covered the Affordable and Attainable Housing Tax Innovation Fund.
