- title: Appeal of short-term rental permit denial at 319 Park Drive
  summary: The owner of 319 Park Drive appealed the denial of her STR permit renewal, which was denied because the unit had not been rented or paid lodging taxes. She argued the ordinance requires only that taxes be paid, and the city says renting is required. The appeal was on the Council agenda Aug 6 and was heard again by Planning and Zoning.
