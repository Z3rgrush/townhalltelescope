- title: JG Housing Solutions enforcement at 100 Midland Avenue
  summary: Council received an update on the special use permit that Planning & Zoning revoked for 100 Midland Avenue, Units 110 and 210, and discussed legal enforcement and injunctive relief against JG Housing Solutions for code, zoning and land use violations. A resident raised a complaint to Planning and Zoning on Aug. 20, and council held an executive session on the lawsuit in October.
