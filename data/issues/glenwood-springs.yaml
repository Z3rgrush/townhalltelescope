- title: Canyon Vista affordable housing at 51993 Hwy 6 & 24
  summary: The 80-unit affordable multifamily project on about 4 acres between Highway 6 and Donegan Road needed a preliminary plat to merge three parcels into one lot. Planning and Zoning reviewed it with six recommended conditions, then Council took up the plat and a right-of-way encroachment license on Oct. 15. Revised water service agreements followed on Nov. 5.
