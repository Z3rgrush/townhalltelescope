- title: 2027 city budget and fees
  summary: Council received the 2027 budget presentation on Oct. 1, held a public budget hearing on Oct. 15, and had a resolution approving the 2027 budget on the Nov. 5 agenda. Related items included a 2026 appropriation amendment, the 2027 Tourism Promotion Fund budget, 2027 landfill fees and the 2027 parks and recreation fee schedule.
