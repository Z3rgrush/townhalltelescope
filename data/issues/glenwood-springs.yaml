- title: Fire department funding and November 2026 property tax ballot question
  summary: Council considered raising property taxes to fund the fire department on the November 2026 ballot. On Aug. 20 it took up a resolution certifying the ballot issue, setting the ballot title and content, and the mayor spoke in support of a resolution backing the fire tax.
