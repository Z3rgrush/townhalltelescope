- title: Xcel transmission line rebuild (6584 line)
  summary: Xcel Energy is replacing aging wood poles on the 6584 transmission line with steel monopoles and widening easements to reduce wildfire risk. Planning and Zoning considered the Location and Extent permit and a 1041 recommendation, and the 1041 application went to City Council on Nov. 5.
