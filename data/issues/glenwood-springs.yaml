- title: Short-term and accessory tourist rental rules
  summary: Planning and Zoning reviewed a code amendment requiring permit holders to actually rent and remit lodging tax in order to renew short-term rental and accessory tourist rental permits. Council took up Ordinance 2026-22 on Sept. 17, with an amendment to a minimum of 20 nights and $150 in sales tax remitted over two years, and it returned on the Oct. 1 consent agenda.
