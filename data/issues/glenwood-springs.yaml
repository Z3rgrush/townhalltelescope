- title: Short-term rental renewal rules (Ordinance 2026-22)
  summary: The city is amending its code so short-term and accessory tourist rental permit holders must actually rent and remit lodging tax to renew. Planning and Zoning reviewed data on STR activity and permit counts, and Council took up the ordinance in September, with an amendment to a minimum of 20 nights and $150 in sales tax over two years. It returned on the Oct 1 consent agenda.
