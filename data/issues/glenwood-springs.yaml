- title: Short-term rental and accessory tourist rental permit renewal rules
  summary: The Planning & Zoning Commission reviewed a code amendment (CDA-000049-2026) requiring STR and accessory tourist rental permit holders to actually rent and remit lodging tax to renew. Council took up Ordinance 2026-22 on Sept. 17, and the amendment was changed to require a minimum of 20 nights and $150 in sales tax remitted over a two-year period. The ordinance was on the Oct. 1 consent agenda. Council also heard an appeal on a short-term rental at 319 Park Drive.
