- title: Minturn shooting range grant and USFS special use permit
  summary: The Town was awarded a $225,000 Colorado Parks and Wildlife grant to improve its shooting range and address long-standing issues. It is seeking in-kind help from Eagle County and a Forest Service special use permit, targeted for Spring 2027. A council item on the range was pulled and continued on Oct. 7, and a status update was on the Oct. 21 agenda.
