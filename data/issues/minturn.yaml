- title: Speed bumps and traffic calming on Main Street and neighborhood streets
  summary: Residents in the Boulder and Pine Street area asked for traffic calming, and residents spoke about speeding and missing speed bumps. Staff is studying a Main Street speed camera and evaluating speed bumps, speed tables and radar feedback signs for the FY 2027 budget.
