- title: Water moratorium and downtown water improvements
  summary: Council took up the second reading of Ordinance No. 11 amending the town's water moratorium. It also considered Resolution No. 50 repurposing CDS funds for downtown water improvements. Water Treatment Plant work and line relocation are ongoing.
