- title: Minturn shooting range grant and USFS special use permit
  summary: Minturn was awarded a $225,000 grant from Colorado Parks and Wildlife to improve the shooting range and address long-standing issues. The town is seeking possible in-kind help from Eagle County, such as road grading, and council is discussing a USFS special use permit application, with a status update on Oct. 21.
