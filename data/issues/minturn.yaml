- title: Minturn shooting range grant and Forest Service permit
  summary: Minturn won a $225,000 Colorado Parks and Wildlife grant to improve the town shooting range and address long-standing issues. The town is seeking in-kind help from Eagle County, such as road grading, and aims to have a USFS special use permit by spring 2027. A status update was on the Oct. 21 agenda, and a councilmember asked to continue the related item on Oct. 7.
