- title: Water moratorium amendment (Ordinance 11) and downtown water improvements
  summary: Council took up Ordinance 11 - Series 2026 amending the town's water moratorium on Oct. 7, with second reading on Oct. 21. Council also considered Resolution 50 to repurpose CDS funds for downtown water improvements, and in September updated outdoor emergency watering restrictions (Resolution 44). Outcomes are not stated in the documents.
