- title: Police services contract with Eagle County Sheriff's Office
  summary: Council is negotiating a police services contract with the Eagle County Sheriff's Office beginning in 2027. Talks cover service levels, costs, contract terms and community concerns about automated license plate readers. Proposed terms will return to the full Council for approval.
