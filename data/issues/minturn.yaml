  summary: At a joint meeting, Minturn and the County discussed a Regional Housing Authority, with concerns about unoccupied homes, business costs and employee housing, and the need for a clear plan after past ballot measures. They also discussed e-bike rules, confusion over e-bike classes and youth riders.
