- title: Historic Preservation Plan update
  summary: The Historic Preservation Commission finalized the 2026 Historic Preservation Plan, with amendments to goals on objects and cultural resources. Members discussed asking Council about a historic district and a budget line item for preservation. They also elected Ken Halliday chair and Dan Brown vice chair, and gave an update on the Meyer's Barn project.
