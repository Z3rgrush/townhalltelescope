- title: Police services contract with Eagle County Sheriff's Office
  summary: Council appointed an ad-hoc committee to negotiate a Sheriff's Office police services contract starting in 2027, covering service levels, costs, terms and community concerns about automated license plate readers. The proposed terms will return to the full Council; the contract was on the Oct. 21 and Nov. 4 agendas.
