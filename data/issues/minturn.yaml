- title: 2026 Historic Preservation Plan
  summary: The Historic Preservation Commission reviewed and amended the final 2026 plan in September, discussing a possible historic district and budget funds for preservation. Council was set to vote on adopting it via Resolution 45 on Oct. 7. The plan is described as an educational guide, not a regulation. The commission also chose Ken Halliday as chair and Dan Brown as vice chair.
