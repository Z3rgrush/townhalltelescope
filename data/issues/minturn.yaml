  summary: The Historic Preservation Commission worked on the final 2026 Historic Preservation Plan, with amendments to goals on objects and cultural resources. Members discussed asking Council about a historic district and a budget line item, and elected Ken Halliday chair and Dan Brown vice chair. The Meyer's Barn project was also updated.
