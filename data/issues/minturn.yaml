- title: 2027 budget, staffing and compensation
  summary: Staff and council began 2027 budget talks in August, set a budget schedule in September, and on Oct. 7 had the 2027 budget acceptance and a discussion of staffing, compensation and benefits. Sales tax was about $10K down year to date as of August. Traffic-calming items such as speed bumps are being weighed for the FY 2027 budget.
