- title: Main Street parking study and speed camera study
  summary: A planning intern presented parking study findings in August. Commissioners suggested a winter study and later-evening counts, plus marking parking spaces on Main St. Staff will proceed with a Main Street speed camera study and options for neighborhood traffic calming.
