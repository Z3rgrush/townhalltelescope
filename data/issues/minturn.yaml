  summary: Residents in the Boulder and Pine Street area asked for more speed bumps and tables, and at the Oct. 7 meeting a resident raised a 2023 petition and speed concerns. Staff is studying a Main Street speed camera and evaluating FY 2027 funding for speed bumps and radar feedback signs.
