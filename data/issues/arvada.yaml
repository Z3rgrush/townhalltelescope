- title: Data center moratorium
  summary: Council discussed a temporary moratorium on new data center applications, citing water, energy and land use concerns and moratoriums in neighboring jurisdictions. A first reading of CB26-029, a moratorium on applications for primary-use data centers, was scheduled with a public hearing set for October 6, 2026.
