- title: Data center moratorium
  summary: Council discussed on Aug 11 a temporary moratorium on new data center applications, citing water, energy and land-use concerns and moratoriums adopted by neighboring jurisdictions. On Sept 15 an ordinance (CB26-029) authorizing a moratorium on primary-use data center applications was introduced, with a public hearing set for Oct 6.
