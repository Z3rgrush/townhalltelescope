- title: Data center moratorium
  summary: Council discussed a temporary moratorium on data center applications at an Aug 11 study session, citing water, energy and land-use questions and moratoriums in neighboring jurisdictions. On Sept 15 it saw first reading of CB26-029, a moratorium on primary-use data center applications, with a public hearing set for Oct 6, 2026.
