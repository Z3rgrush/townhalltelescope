- title: Hibernia Gold Strike Apartments, 240 units
  summary: A conditional use permit is proposed for a five-story, 240-unit apartment building with about 1,000 sq ft of retail on 3.47 acres at 4800 W 60th Ave. The Planning Commission considered it, and about 20 residents attended the neighborhood meeting. Council first reading came October 20, with a hearing set for November 17.
