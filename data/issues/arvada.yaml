- title: Drought and dropped water surcharge ordinance
  summary: Council declared a drought on March 24, 2026, and water use restrictions followed. Staff pulled ordinance CB26-018 on water surcharges and plan to bring surcharges back in spring 2027, possibly alongside a drought declaration extension.
