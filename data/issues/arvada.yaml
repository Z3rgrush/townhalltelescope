- title: 2027-2028 budget, mill levy and utility rates
  summary: The City Manager proposed a 2027-2028 budget with a 2027 appropriation of $412,447,446, including a pay plan and 32 requested new positions. Council scheduled adoption of the 2027 budget, the 2026 mill levy certification, and new water, wastewater and stormwater rates for October 20.
