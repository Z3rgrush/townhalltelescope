- title: Proposition 123 zoning changes and housing strategy
  summary: The Planning Commission held a hearing on Land Development Code text amendments related to Proposition 123. Council was asked to commit to Prop 123 obligations for the 2027-2029 cycle, and a residential land use table ordinance (CB26-028) was introduced. The Housing Advisory Committee also worked on the city's housing strategic plan.
