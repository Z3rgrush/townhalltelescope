- title: City water treatment plant annexation at 6809 SH 93
  summary: The city is annexing and rezoning a 25.257-acre site at 6809 SH 93 (two parcels, 17.885 and 9.016 acres) from Jefferson County PD to Arvada Open Space for a new water treatment plant. It also needs a comprehensive plan amendment and exceptions on fencing, roofline and windows. Planning Commission heard it Aug 5, Council accepted petitions Aug 18, and the Council hearing was set for Oct 6, 2026.
