- title: Olde Town paid parking
  summary: Council held a study session on parking pressures in Olde Town, where studies since 2010 show demand outpacing supply. Staff reviewed options for a paid parking program called for in the Olde Town Strategic Reinvestment Plan, plus stakeholder feedback.
