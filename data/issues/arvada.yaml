- title: City water treatment plant annexation and rezoning at 6809 SH 93
  summary: The city is annexing two parcels (17.885 and 9.016 acres) at 6809 SH 93 for its water treatment plant. The land would be rezoned from Jefferson County PUD to city Open Space and the Comprehensive Plan amended. The Planning Commission heard the case, and Council set an October 6 public hearing after first reading.
