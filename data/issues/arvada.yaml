- title: Proposition 123 zoning changes and affordable housing
  summary: Planning Commission considered Land Development Code text amendments related to Proposition 123, and Council's Sept 15 agenda included an ordinance repealing and reenacting the residential land use table. Council also took up a resolution committing to Prop 123 obligations for 2027-2029, plus private activity bond assignment for Maiker Housing Partners.
