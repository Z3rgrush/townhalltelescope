- title: Use tax increase ballot issue
  summary: The Town is referring a ballot issue to raise its use tax on construction and building materials (Ordinance 19-2026), with potential construction use tax revenue of about $2.2M. Raising the motor vehicle use tax to 3.5 would add about $500K. Council considered Resolution 77-2026 expressing support, and the advisory committee questioned the earlier lack of attention to motor vehicle use tax.
