- title: Monument 2040 Comprehensive Plan and Downtown Master Plan
  summary: The Planning Commission took up the draft 2040 Comprehensive Plan Update and Downtown Master Plan after nearly two years of outreach, with a hearing on Sept. 9 continued to Oct. 14. Residents raised concerns that conceptual downtown redevelopment renderings don't fit Monument's historic small-town character and asked about how many people took part in outreach.
