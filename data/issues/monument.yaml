- title: Traffic, growth and Jackson Creek Parkway
  summary: The advisory committee discussed traffic impact fees, which may fund Jackson Creek Parkway, and expected pressure from a Target, new apartments, and a possible Costco. Members also raised traffic on Old Denver Highway.
