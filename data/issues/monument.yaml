- title: Jackson Creek Parkway growth and traffic
  summary: Advisory committee members raised concerns about traffic from growth, including a Target (completion October 2028), apartments near Walmart, and a possible Costco, and whether widening Jackson Creek Parkway to four lanes is enough. Traffic impact fees can be used on the parkway. Council was to get an improvements update Nov. 2, and a resident raised traffic on Old Denver Road.
