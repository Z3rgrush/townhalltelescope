- title: Monument 2040 Comprehensive Plan and Downtown Master Plan
  summary: The Planning Commission held a public hearing on the draft Monument 2040 Comprehensive Plan and Downtown Master Plan, the product of nearly two years of outreach. Residents worried that conceptual downtown redevelopment renderings don't fit Monument's historic small-town character, and asked about participation levels. The Town Council was scheduled to hold a public hearing on adopting it (Resolution 78-2026) on Nov. 2.
  where: Townwide / Downtown Monument
