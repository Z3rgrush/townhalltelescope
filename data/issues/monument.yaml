- title: Native Sun Construction PUD amendment at 15010 Woodcarver Road
  summary: Planning Commission recommended approval of a major amendment to relocate the shop building, add a deceleration lane on Wood Carver Road, and add parking and landscaping (21 trees preserved, 66 planted). Council took up Ordinance 24-2026 on Sept 8. Commissioners asked about equipment heights, outdoor storage screening, water capacity, and stormwater from the wash bay.
