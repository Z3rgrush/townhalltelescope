- title: Monument 2040 Comprehensive Plan and Downtown Master Plan
  summary: The Planning Commission heard the draft 2040 Comprehensive Plan and Downtown Master Plan, built on nearly two years of outreach. Residents worried that conceptual downtown redevelopment renderings clash with Monument's historic small-town character and asked for stronger architectural guidance. Town Council then held a public hearing on Resolution 78-2026 to adopt the plan, with the consultant (The Lakota Group) presenting.
  where: Downtown Monument / Townwide
