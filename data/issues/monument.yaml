- title: 2027 town budget
  summary: The finance director presented the preliminary and draft 2027 budget to the Citizens Service Levels Advisory Committee and Town Council. Topics included the Traffic Impact Fee and Park Fee funds, four new police positions funded by police impact fees, stormwater impact fee study, park vandalism, a pavilion at Monument Lake and water system cybersecurity. Council asked for more information on the 2F and Police Department funds.
