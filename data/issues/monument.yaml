- title: 'Commercial PUD approvals: 7 Brew, Native Sun, Karl Malone Powersports, Conexus'
  summary: The Planning Commission reviewed several development plans. These include 7 Brew Drive Thru Coffee at 15822 Jackson Creek Parkway, a Native Sun Construction amendment at 15010 Woodcarver Road with a deceleration lane and 66 new trees, and a 30,000 sq ft Karl Malone Powersports RV sales and service site. Council took up ordinances for 7 Brew and Native Sun on Sept. 8. Conexus Lot 1 Filing 2 (312 apartments) was also reviewed, and Council later acted on a Conexus property transfer and temporary easement.
  where: 15822 Jackson Creek Pkwy; 15010 Woodcarver Rd; Conexus
