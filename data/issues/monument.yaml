- title: 2027 budget and use tax ballot proposals
  summary: The Citizens Service Levels Advisory Committee reviewed the preliminary 2027 budget, including impact fee funds, new police positions and park funding. The committee also discussed use tax ballot measures, including a possible $2.2M construction use tax gain and raising the motor vehicle use tax to 3.5 for about $500K more. Council was to see the proposed 2027 draft budget Nov. 2.
