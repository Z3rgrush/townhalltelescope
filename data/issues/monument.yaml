- title: Monument 2040 Comprehensive Plan and Downtown Master Plan
  summary: The Planning Commission heard the draft 2040 Comprehensive Plan and Downtown Master Plan on Sept. 9 and again Oct. 14, after nearly two years of outreach. Residents worried that conceptual downtown redevelopment renderings don't fit Monument's historic small-town character. Town Council was scheduled to hold a public hearing on Resolution 78-2026 adopting the plan on Nov. 2.
