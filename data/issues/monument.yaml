- title: Use tax ballot measure and 2027 budget
  summary: The Citizens Service Levels Advisory Committee reviewed the preliminary 2027 budget and a use tax ballot initiative. Increasing the motor vehicle use tax to 3.5 would raise about $500K more, and construction use tax could add about $2.2M. Council was asked to refer ballot measures, and on Oct. 19 considered a resolution supporting the construction use tax increase (Ordinance 19-2026). Council also reviewed the draft 2027 budget and capital plan.
