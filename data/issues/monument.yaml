- title: Native Sun Construction PUD amendment at 15010 Woodcarver Road
  summary: The Planning Commission recommended approval of a major amendment that relocates the shop building, adds a deceleration lane on Wood Carver Road, and preserves 21 trees while planting 66. Council scheduled Ordinance 24-2026 for a hearing on Sept. 8.
