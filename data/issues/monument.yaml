- title: Conexus Lot 1 Filing 2 and Tract E land transfer
  summary: The Planning Commission reviewed the final PUD for Conexus Lot 1 Filing 2, which includes 312 apartment units. Council later considered Ordinance 26-2026, a real property transfer, and Resolution 74-2026, a temporary construction easement in Tract E. No public comments were received at the hearing.
