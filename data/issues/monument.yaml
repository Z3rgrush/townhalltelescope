- title: 2027 draft budget and use tax ballot initiative
  summary: The Citizens Service Levels Advisory Committee reviewed the preliminary 2027 budget, including stormwater impact fee needs, park security and a Monument Lake pavilion. Staff discussed use tax ballot options, including a possible $2.2M in construction use tax and about $500K more if the motor vehicle use tax rises to 3.5. Council directed staff to move ahead with the 2027 draft budget as presented.
