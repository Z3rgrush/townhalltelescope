- title: Jackson Creek Parkway and traffic concerns
  summary: Committee members asked about Jackson Creek Parkway expansion, and whether traffic impact fees could fund it, as new development like Target and apartments near Walmart arrives. Council was to get a Jackson Creek Parkway improvements update Nov. 2, and a resident raised traffic concerns on Old Denver Road.
