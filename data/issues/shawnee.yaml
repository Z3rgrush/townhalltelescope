- title: Fireworks rules after the Fourth of July
  summary: After a committee discussion of complaints about fireworks, a vendor and residents spoke at council asking for changes such as stronger enforcement instead of new limits on Fourth of July fireworks use.
  refs: [3]
  public_comment: true
- title: Midland Entertainment District TIF and area plan
  summary: With a tax increment financing district already in place near I-435 and Midland Drive, staff proposed a $150,000 area plan to guide redevelopment of stalled parcels and direct TIF money.
  where: I-435 & Midland Dr
  refs: [5]
- title: Overlook at Midland apartments
  summary: The planning commission held a public hearing on a planned unit development for multifamily housing just south of Shawnee Mission Parkway near Midland Drive.
  where: Shawnee Mission Pkwy & Midland Dr
  refs: [4]
- title: $18 million police Justice Center expansion
  summary: The council considered an $18 million budget and design-build contracts to expand the Shawnee Police Department's Justice Center.
  refs: [6]
- title: Johnson Drive intersection rebuilds at Barker, Quivira and I-435
  summary: Shawnee awarded a $1.75 million contract for the Johnson Drive and Barker Road intersection with added federal safety money, replaced the old Johnson Drive and Quivira signal, and hired engineers for the I-435 interchange.
  where: Johnson Dr at Barker Rd, Quivira Rd and I-435
  refs: [1, 6, 8]
- title: Hands-free driving ordinance
  summary: Police and the city attorney proposed widening the ban on using phones while driving to cover apps, video, social media and browsing.
  refs: [9]
- title: Annual offense code update, license plate covers and animal cruelty
  summary: The council adopted the 2026 Uniform Public Offense Code with local amendments on license plate covers, animal cruelty rules for community cats, and keeping distance from officers.
  refs: [0, 2]
- title: 57th and Barton townhomes downtown
  summary: Planners reviewed a 10-unit townhome building at 57th Street and Barton Drive in the downtown mixed-use area.
  where: 57th St & Barton Dr
  refs: [4, 7]
- title: Sewer extensions and new subdivisions in western Shawnee
  summary: The council expanded the county sewer district for Heartland Logistics Park, Mill Creek Road, Mize Road and Woodland Drive sites and approved plats like Canyon Lakes Eighth and Good Deeds Ranch.
  where: Western Shawnee (Clare Rd, Mize Rd, 63rd St)
  refs: [2, 3, 6]
- title: Community Development Block Grant 2027 plan
  summary: Public hearings were held on how Shawnee will spend its 2027 federal CDBG money.
  refs: [8]
