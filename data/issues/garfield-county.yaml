- title: 'Affordable housing: USDA programs, Housing Authority funding and Cavern Springs'
  summary: Commissioners heard from USDA Rural Development on affordable housing programs and from the Garfield County Housing Authority, which asked for $90,000 in 2027 funding. They were also asked for a letter of support for the Cavern Springs Mobile Home Park request, and to sign an amendment to the Oak Meadows Ranch Filing 4B affordable housing plan involving Habitat for Humanity.
