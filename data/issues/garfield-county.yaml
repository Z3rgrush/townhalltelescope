- title: 'Parachute funding requests: 1st Street/US 6 reconstruction and PATS transit'
  summary: The Town of Parachute asked for $600,000 toward the Parachute MOVES 1st Street/US 6 reconstruction. It also asked for disbursement of $200,000 in 2026 funding and a 2027 funding request for the Parachute Area Transit System.
