- title: McClure River Ranch PUD amendment and 12-lot preliminary plan
  summary: Commissioners were asked to sign resolutions approving a substantial amendment to the 98-acre McClure River Ranch PUD and a preliminary plan dividing 48.96 acres into 12 lots and 2 tracts, about 4 miles east of Carbondale. The applicant is Aspen Polo Partners. A resolution for the Hogback View Estates major subdivision preliminary plan east of New Castle was also up for signature.
