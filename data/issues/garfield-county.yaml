- title: 'Affordable housing: USDA programs, Housing Authority and Cavern Springs Mobile Home Park'
  summary: Commissioners heard from USDA Rural Development's state director on affordable housing programs and from the Garfield County Housing Authority, which presented its annual report and a $90,000 funding request for 2027. They were also asked for a letter of support for the Cavern Springs Mobile Home Park partnership request.
