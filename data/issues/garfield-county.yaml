- title: 'Affordable housing: USDA programs, Housing Authority, Cavern Springs and Oak Meadows'
  summary: The board heard USDA Rural Development on affordable housing, a Housing Authority update and annual report with a $90,000 2027 request. A letter of support was requested for the Cavern Springs Mobile Home Park partnership, the Oak Meadows Ranch Filing 4B affordable housing plan amendment was signed, and a Glenwood Springs Association housing summit whitepaper was presented.
