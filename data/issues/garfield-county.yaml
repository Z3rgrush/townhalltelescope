- title: Jail standards, overtime and Sheriff's Office funding
  summary: The Sheriff presented on new jail standards, and a $267,000 supplemental request was made to cover jail overtime. The Sheriff's Office also sought grants for opioid treatment medication for inmates ($39,903) and bulletproof vests ($12,100), and renewed body camera contracts.
