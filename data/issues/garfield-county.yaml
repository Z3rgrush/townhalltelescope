- title: Slaughterhouse Gulch mudslide landfill fee waiver and LoVa Trail support
  summary: A request asked commissioners to waive landfill tipping fees after the Slaughterhouse Gulch mudslide. Glenwood Springs also sought a letter of support for a federal grant to advance the LoVa Trail through South Canyon.
