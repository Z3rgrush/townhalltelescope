- title: '2027 county budget hearings and Budget Supplement #4'
  summary: 'Commissioners held 2027 budget hearings in October, with department and elected office presentations, and a public hearing on 2026 Budget Supplement #4. A workforce analysis from MGT and requests from outside groups, such as the Early Childhood District and Forest Improvement District, were part of the budget talks.'
