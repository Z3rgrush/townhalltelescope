- title: 'Senior transportation and meals: Traveler, RFTA IGA, congregate meals'
  summary: Commissioners discussed the Traveler transit service, reviewed a draft RFTA-Traveler agreement and a seven-party senior programs MOU. They also considered a sole-source contract with the City of Rifle for congregate meals in western Garfield County.
