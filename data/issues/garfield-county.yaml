- title: 'Development proposals: Mitchell Creek PUD, Lake Springs Ranch PUD, McClure River Ranch, Hogback View Estates'
  summary: The Planning Commission scheduled hearings on rezoning Mitchell Creek Community PUD at 50235 Highway 6/24 and on the Lake Springs Ranch PUD amendment near 4001 County Road 114. Commissioners signed resolutions approving McClure River Ranch amendments (12 lots on 48.96 acres) east of Carbondale and the Hogback View Estates preliminary plan at 24 County Road 138.
