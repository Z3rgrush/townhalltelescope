- title: 2027 county budget hearings and supplemental appropriations
  summary: 'Commissioners held 2027 proposed budget hearings in October, heard an MGT workforce analysis, and took up 2026 Budget Supplement #4 and a $234,039 supplement in November. Requests included $150,000 for Garfield Clean Energy, a $90,000 Housing Authority request and Human Services Commission grants.'
