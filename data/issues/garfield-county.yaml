- title: 2027 county budget hearings and workforce analysis
  summary: 'The commissioners held 2027 budget hearings in October, with department and elected office presentations, plus Budget Supplement #4 and a $234,039 supplemental request. They also heard an MGT workforce analysis, and the Early Childhood District and Forest Improvement District presented. Unfreezing two Human Services positions and a sheriff''s office early retirement plan were also on the agendas.'
