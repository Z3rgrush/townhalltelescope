- title: 2027 county budget hearings
  summary: 'The Board of County Commissioners held Budget Hearing #1 on Sept. 29 for the preliminary balanced 2027 budget and Hearing #3 on Oct. 27 for department and office critical needs presentations. The Regional Building Department''s 2027 budget was also taken up Oct. 13.'
