- title: 'Road and bridge projects: Mesa Ridge Parkway condemnation, US-24 and Commerce Road'
  summary: The county considered condemning property for the Mesa Ridge Parkway Improvements Project between Powers Blvd and Marksheffel Rd. It also took up an agreement with CDOT on maintenance after the US-24 & Judge Orr Road intersection work and easements for the Commerce Road Bridge Replacement. Design work on North Calhan Highway and a multi-year paving contract of up to $948,543 also came up.
  where: Mesa Ridge Parkway; US-24 & Judge Orr Road; Commerce Road; North Calhan Highway
