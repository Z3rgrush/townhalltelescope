- title: Road and pedestrian safety projects
  summary: The county approved contract changes for pedestrian crossing improvement packages, multi-year paving (about $948,543 to Martin Marietta), and North Calhan Highway design. It also advanced the CDOT agreement for Woodmoor Dr/Lake Woodmoor Dr intersection improvements and easements for Misty Acres Boulevard pedestrian improvements.
