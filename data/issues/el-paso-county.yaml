- title: Triple H Ranch preliminary plan and other land use plats
  summary: The commissioners were set to consider a 752.68-acre Triple H Ranch Preliminary Plan from P760 Land, LLC creating 244 single-family lots in the RR-2.5 zone. They also had a Final Plat for Hardy Road Properties, a 19.34-acre site that would create two lots, and set a Nov. 17 hearing on the Bent Grass Commercial Metropolitan District Service Plan.
  where: Triple H Ranch site; 1054 Hardy Road area; Bent Grass Commercial district
