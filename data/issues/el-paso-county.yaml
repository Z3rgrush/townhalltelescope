- title: 2027 county budget hearings
  summary: The commissioners held budget hearings on the 2027 budget, including department critical-needs presentations on Oct. 27 and final direction on the original adopted budget on Nov. 10. A third-quarter 2026 budget report was also on the Nov. 3 agenda.
