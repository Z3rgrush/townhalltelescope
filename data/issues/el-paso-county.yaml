- title: Weeds, rubbish and unsafe structures ordinances (HB 26-1239)
  summary: The county took up Ordinances 26-02, 26-03 and 26-04 on weed and brush removal, rubbish accumulation and unsafe structures. They update enforcement procedures and legal remedies to comply with state House Bill 26-1239. First reading was Oct. 22 and second reading was Nov. 12, along with a related Land Development Code amendment on enforcement procedures.
