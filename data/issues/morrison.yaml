- title: Lodging tax changes and November ballot questions
  summary: 'Ordinance 562 aligned the lodging tax exemption with the 2012 voter-approved ballot language, and the Board set its effective date to October 1, 2026. Voters will also see two ballot questions: removing the exemption for small lodging facilities (about $125,000 a year) and raising the lodging tax rate from 6% to 8% (about $500,000 a year).'
