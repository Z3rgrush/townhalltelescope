- title: 'Municipal code updates: garden sheds, motels, floodplain and nuisance abatement'
  summary: Ordinance 566 allows garden sheds up to 120 sq ft as an accessory use in residential zones, permits motels in the HD district, and changes floodplain elevation rules and the definition of substantial improvement. Ordinance 567, adopted October 6, speeds up abatement of nuisances on public property.
