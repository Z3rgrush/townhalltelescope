- title: Lodging tax changes and ballot questions
  summary: Ordinance 562 aligns the lodging tax exemption with the 2012 voter-approved ballot language, effective Oct. 1, 2026. Two ballot issues would raise taxes by $125,000 by removing the exemption for small lodging and by $500,000 by raising the lodging tax from 6% to 8%. The Board ratified Ordinance 564 on ballot questions.
