- title: Mandatory drought watering restrictions
  summary: Because of drought, all Morrison water customers have been under mandatory outdoor watering limits since April 2, 2026. Watering is allowed no more than two days a week and not between 10 AM and 6 PM, and wasting water is prohibited.
