- title: Green Tree Metro District extraterritorial sewer service
  summary: The Board approved a term sheet for extraterritorial sewer service with Green Tree Metro District after executive sessions on negotiation strategy. A Green Tree Metro District sewer service agreement was then on the October 20 agenda.
  where: Green Tree Metro District
