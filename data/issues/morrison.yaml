- title: 2027 draft budget and personnel costs
  summary: The draft 2027 budget shows a 15.85% health insurance increase, a 3.6% cost-of-living raise, and lodging tax expected to become the second-largest tax source, ahead of property tax. A new hotel will add lodging and sales tax, and it uses the town's Enhanced Sales Tax Incentive Program. Budget hearings are set to start Nov. 4, and a new full-time position and a museum budget memo were also on the agenda.
