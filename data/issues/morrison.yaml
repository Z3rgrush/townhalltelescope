- title: 2027 draft budget
  summary: The draft 2027 budget includes a 15.85% health insurance renewal increase, a 3.6% cost-of-living raise, and a new full-time position under consideration. Lodging tax is expected to become the second-largest tax revenue source, and a hotel uses the sales tax incentive program (ESTIP). The first of two hearings was set for November 4.
