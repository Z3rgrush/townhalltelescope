- title: Downtown and interstate parking
  summary: Residents told the Board that new businesses should not be allowed in downtown Morrison without adequate parking. The Board took up overnight parking as a discussion item in September and interstate parking in October, and sought community direction on the parking issues.
  where: Downtown Morrison
