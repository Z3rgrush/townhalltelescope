- title: Raw water diversion and utility agreements
  summary: The Board went into executive session on raw water diversion negotiations with its water engineer. The 2027 budget includes about $296,213 for the overall raw water project in the Utility Fund. The Board also had a Green Tree Metro District sewer service agreement on its October 20 agenda. A resident thanked the Utility Director for his response to water concerns.
