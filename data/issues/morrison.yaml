- title: The Fort / Farm at the Fort annexation, zoning and extraterritorial water and sewer agreement
  summary: The Board considered a water and sewer service agreement with Morrison RE Development, LP for The Fort allowing up to 75 EQRs (50 residential), with $2.5 million in one-time impact fees and a public improvement fee on restaurant sales. Public hearings on annexation of about 59.36 acres (Farm at the Fort) and initial zoning to Residential Estate and Mixed-Use Neighborhood were noticed for August 18, and a resident asked for an update on the hearing.
  where: The Fort / Farm at the Fort, unincorporated Jefferson County
