- title: The Fort / Farm at the Fort annexation, zoning and extraterritorial water-sewer deal
  summary: The Board considered an extraterritorial water and sewer agreement with Morrison RE Development, LP for The Fort, allowing up to 75 EQRs (50 residential) with $2.5 million in one-time impact fees and a public improvement fee on restaurant sales. Public hearings were noticed for Aug. 18 on annexing about 59.36 acres known as the Farm at the Fort and on initial zoning (Residential Estate and Mixed-Use Neighborhood). A resident asked for an update on the hearing.
  where: The Fort / Farm at the Fort, unincorporated Jefferson County near Morrison
