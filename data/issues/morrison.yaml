- title: 2027 budget, health insurance and lodging tax
  summary: The draft 2027 budget has a 15.85% health insurance renewal increase, a 3.6% COLA and 2% longevity pay. Lodging tax is expected to become the second-highest tax source, passing property tax, once the new hotel opens, and the hotel uses the town's sales tax incentive program (ESTIP). The first of two budget hearings is set for November 4, and a museum budget memo and a possible new full-time position were also on the agenda.
  where: Townwide
  refs:
  - 9
  - 12
- title: Water conservation rules and rewrite of the water and sewer code
  summary: 'Mandatory drought watering restrictions took effect April 2, 2026: outdoor watering at most two days a week and none between 10 AM and 6 PM. The Board adopted Ordinance 565, which repeals and replaces Title 8 of the municipal code on water and sewer, including backflow rules. Executive sessions also covered water infrastructure and a raw water diversion.'
