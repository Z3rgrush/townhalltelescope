- title: Water and sewer code rewrite and drought watering restrictions
  summary: Ordinance 565 repealed and replaced Title 8 of the municipal code to clarify water and sewer requirements, including backflow rules. Mandatory outdoor watering restrictions (two days per week, none 10am-6pm) have applied since April 2, 2026 because of drought.
