- title: Lodging tax changes and November ballot questions
  summary: Ordinance 562 aligns the lodging tax exemption with the 2012 voter-approved ballot language, effective October 1, 2026. Two ballot questions would remove the small-lodging exemption (+$125,000) and raise the rate from 6% to 8% (+$500,000), starting January 1, 2027.
