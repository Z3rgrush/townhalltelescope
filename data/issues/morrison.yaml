- title: Mandatory watering restrictions and rewrite of the water and sewer code
  summary: Due to drought, mandatory watering restrictions limit outdoor watering to two days a week and ban watering from 10 a.m. to 6 p.m. The Board adopted Ordinance 565 repealing and reenacting Title 8 on water and sewer regulations, including backflow prevention. The Board also discussed raw water diversion in executive session.
