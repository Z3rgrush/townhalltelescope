- title: The Fort extraterritorial water and sewer agreement and Farm at the Fort annexation
  summary: The Board considered an agreement to provide water and sewer service to The Fort and an adjacent parcel for Morrison RE Development, LP. It would allow up to 75 EQRs (50 residential), $2.5 million in impact fees and a public improvement fee on restaurant sales. Separate notices set August 18 public hearings on annexing about 59.36 acres known as the Farm at the Fort and on initial zoning (RE and MX-N). The agreement notes the developer intends to withdraw its annexation and zoning applications.
  where: The Fort / Farm at the Fort, unincorporated Jefferson County near Morrison
