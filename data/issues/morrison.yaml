- title: Farm at the Fort annexation and initial zoning
  summary: The Town set an August 18, 2026 public hearing on annexing about 59.36 acres in unincorporated Jefferson County known as the Farm at the Fort. A separate hearing covered initial zoning to Residential Estate (RE) and Mixed-Use Neighborhood (MX-N), on applications by Morrison Redevelopment, LP and Revesco Properties. Residents were invited to speak at both hearings.
  where: Farm at the Fort, unincorporated Jefferson County
