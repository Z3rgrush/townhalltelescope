- title: Town Manager employment, new staff position and personnel rules
  summary: The Board held executive sessions on the Town Manager employment agreement and a special meeting requested by the Town Manager was noticed for October 7. Agenda items on October 20 included the agreement, a new full-time position, amended Board rules of procedure, and Ordinance 568 repealing the code chapter on town employee plans.
