- title: 2027 town budget and Capital Improvement Plan
  summary: The draft 2027 budget includes a 15.85% health insurance renewal increase, a proposed 3.6% cost-of-living raise, and lodging tax revenue expected to pass property tax. Hearings on the budget and the 2027 Capital Improvement Plan are set for November 4 and November 17, 2026, when adoption is expected. A hotel sales-tax incentive (ESTIP) and a change to who pays online bill-pay fees are also in the draft.
