- title: Engineering help to review proposed data centers
  summary: The county commission considered awarding a contract to CFS Engineers for engineering services on proposed data centers, as a hyperscale campus was being pitched just south of Topeka.
  refs: [21, 22]
  tags: [data-center]
- title: 2027 budget above the revenue-neutral rate
  summary: Shawnee County held hearings on a 2027 property tax levy above its revenue-neutral rate of 46.861 mills and on the proposed budget, after weeks of budget talks and a review of $192 million in capital project requests. Adoption of the budget and capital plan was then taken up in September.
  refs: [3, 4, 5, 18, 19, 21, 24]
- title: Rewriting the industrial revenue bond policy
  summary: Commissioners studied how 12 other Kansas cities and counties handle industrial revenue bonds and property tax exemptions, including which industries qualify, payments in lieu of taxes and clawbacks, as they weigh changes to the county's own policy.
  refs: [16, 17]
- title: Bonds for a hotel and a Topeka apartment project
  summary: The county considered about $7 million in taxable hospitality revenue bonds for a YBR Properties hotel project and $15 million in multifamily housing revenue bonds for the Topeka SV project, which was deferred a week.
  refs: [5, 24, 36, 39]
- title: Behavioral health unit and jail mental health care
  summary: The commission toured behavioral health housing units, sought a $1.3 million federal opioid and substance use grant, accepted a $750,000 grant for a behavioral health unit and considered a mental health contract with Astra for the detention center.
  where: 501 SE 8th St
  refs: [13, 21, 36]
- title: Subsidizing the Stormont Vail Events Center
  summary: The county considered a $163,981 allocation to cover an operating budget overage at the Stormont Vail Events Center, along with a revised license agreement there.
  where: Stormont Vail Events Center
  refs: [39]
- title: Gage Park and Lake Shawnee projects
  summary: Gage Park sales tax money went to a new Playland shelter, path lights, road repairs, Rose Garden and Snyder Cabin work, while the county sought a federal grant to replace a shelter at Lake Shawnee and signed a sponsor for the Lake Shawnee dog park.
  where: Gage Park
  refs: [1, 4, 11, 14, 27]
- title: Bridge and road projects
  summary: The county moved ahead on bridge replacements on NW 78th Street over Halfday Creek and NW Maple Hill Road over the Kansas River, and on SE Croco Road pavement replacement north of the I-70 turnpike bridge.
  refs: [8, 22, 36, 39]
- title: Conditional use permits in Mission and Tecumseh townships
  summary: Hearings were held on expanding a conditional use permit for a warehouse, office and gravel storage yard at 1100 SW Auburn Road and on changing an older permit at 4144 SE 45th Street.
  refs: [8, 21]
- title: Street assessments in rural subdivisions
  summary: Hearings were held on special assessments to pay for street improvements in the Timber Ridge, Sterling Chase and another county subdivision benefit district.
  refs: [24]
