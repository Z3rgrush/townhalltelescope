- title: Rules for data centers and battery storage
  summary: Riley County's planning director led work sessions on data centers and battery energy storage systems, with commissioners asking about facility noise and the county counselor discussing a possible referendum on a data center. Evergy was scheduled to talk with the commission about data centers in late October.
  refs: [2, 3, 10, 24]
  tags: [data-center]
- title: Opposition to the police department's $31 million federal grant
  summary: Residents, including DeFlock Riley County, a Unitarian Universalist fellowship and a local priest, packed public comment for weeks urging the county not to accept a $31.1 million federal grant sought by the Riley County Police Department, citing surveillance cameras, cost and ties to ICE and a 287(g) agreement. Some suggested a local sales tax instead, and the board set time limits on public comment.
  refs: [12, 13, 14, 15, 16, 17]
  public_comment: true
- title: 2027 budget and the 38-mill levy
  summary: The commission held budget work sessions, published notice of its September 10 revenue-neutral rate and budget hearings and heard a resident question the 38.012-mill levy's burden on middle-class households. It also split opioid settlement money between Community Corrections and the Health Department.
  refs: [2, 4, 7, 11, 18]
  public_comment: true
- title: Hiring the first county administrator
  summary: Commissioners set first-year goals for a new county administrator, including a structurally balanced 2028 budget, discussed a benefits package and a $160,000 salary that a resident questioned, and approved a recruitment plan.
  refs: [7, 9, 18, 20]
  public_comment: true
- title: Road and bridge sales tax vote put off to 2027
  summary: The board considered asking voters for a 0.20% countywide sales tax for roads and bridges and agreed to wait until November 2027.
  refs: [2]
- title: Keats and University Park sewer projects
  summary: After more than a decade of planning, the county broke ground on the Keats sanitary sewer and lagoon west of Keats Park, approved change orders there and on the University Park wastewater lagoon, and paid Evergy for Keats work.
  where: Keats Park
  refs: [0, 5, 6, 16, 19, 22]
- title: Health department reorganization and remodel
  summary: The health department stopped pursuing reaccreditation, and after questions about funding the board approved a remodel of part of the department and activated the project.
  refs: [11, 15, 20, 21]
- title: Planning fees, land rules and housing grants
  summary: The county adopted a new planning fee schedule including private well fees, amended its land development regulations and driveway standards, approved rural plats and applied for Home in the Heartland housing grants.
  refs: [0, 8, 11, 12, 24]
- title: County motor vehicle fee increase
  summary: The treasurer reviewed the history of motor vehicle transaction fees and the board raised the fee for 2027 after a resident objected.
  refs: [13]
  public_comment: true
- title: Selling the county's Tatarrax lot
  summary: The county discussed a public sale of a vacant county-owned lot at Tatarrax, and the Tatarrax Association asked for time to plan for it.
  where: Tatarrax
  refs: [17, 19]
  public_comment: true
- title: Culvert and bridge work on rural roads
  summary: Public Works closed rural roads for culvert replacements on W. 62nd Avenue, Kitten Creek, Crooked Creek and Swede Creek roads, chip sealed several roads and won KDOT cost-share money to replace the Winkler Mills Road bridge.
  refs: [6, 10, 13, 17, 21]
