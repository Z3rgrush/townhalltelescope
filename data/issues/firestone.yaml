- title: Barefoot Lakes Filing 5, 2nd Amendment preliminary plat
  summary: At its July 16, 2026 hearing, the Planning and Zoning Commission considered Resolution PC-26-02 recommending approval of the Barefoot Lakes Filing 5, 2nd Amendment preliminary plat. Resident Steve Trunk raised concerns about impacts on neighboring properties, including views and buffering.
