- title: Parks and trails priorities and 2027 budget recommendations
  summary: The Parks, Trails, Recreation and Open Space Commission discussed priorities and 2027 budget recommendations. Ideas included trail connections to St. Vrain Park via the Legacy trail, improvements at Birch and Firestone Blvd. and Cotton Hollow and Sable, and repairing rotting bridge boards south of Gateway Park. Members also suggested looking into adding pickleball courts, and a proposed PTROC projects list is on the October 7 agenda.
  where: Townwide, including Gateway Park and St. Vrain Park
  refs:
