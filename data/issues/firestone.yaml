- title: Barefoot Lakes Filing 5, 2nd Amendment preliminary plat
  summary: The Planning and Zoning Commission held a hearing on July 16, 2026 on Resolution PC-26-02, recommending approval of the Barefoot Lakes Filing 5, 2nd Amendment preliminary plat. Resident Steve Trunk raised concerns about impacts on neighboring properties, including views and buffering.
