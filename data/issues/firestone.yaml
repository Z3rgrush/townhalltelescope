- title: Parks, trails and 2027 budget recommendations
  summary: The Parks, Trails, Recreation and Open Space Commission is reviewing a proposed projects list and making 2027 budget recommendations. Ideas raised include trail connections to St. Vrain Park via the Legacy trail, trail work at Birch and Firestone Blvd., Cotton Hollow and Sable, and Pinecone and Frontier, repairs to rotting bridge boards south of Gateway Park, and possibly adding pickleball courts. The commission also discussed Arts in Public Places.
  where: Townwide, including Gateway Park and St. Vrain Park
