  - 16
  topics:
  - Parks & open space
  - Recreation & trails
  - Budget & taxes
- title: Arts in Public Places program discussion
  summary: The Parks, Trails, Recreation and Open Space Commission discussed the Colorado Arts in Public Places (AIPP) program on July 1, 2026, and staff were asked to collect further input.
