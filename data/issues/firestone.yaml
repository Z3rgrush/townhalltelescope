- title: Parks and trails priorities and 2027 budget recommendations
  summary: The Parks, Trails, Recreation and Open Space Commission discussed trail connections to St. Vrain Park via the Legacy trail and trail improvements at Birch and Firestone Blvd, Cotton Hollow and Sable, and Pinecone and Frontier. It also noted rotting bridge boards south of Gateway Park and looked into adding pickleball courts, as input to the 2027 budget. A proposed PTROC projects list is on the October 7 agenda.
  where: Trails and parks townwide, including Gateway Park and St. Vrain Park
