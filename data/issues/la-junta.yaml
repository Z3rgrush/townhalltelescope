- title: 2027 city budget, mill levy and utility rate changes
  summary: Finance Director Aliza Libby presented the 2027 budget on Sept. 8, and a public budget hearing was set. In October the Board of Utilities took up 2027 electric, water, wastewater and sanitation rate resolutions and its fund budgets. City Council then took up the budget resolution, the mill levy and the appropriation ordinance, with second readings set for Nov. 2. Mayor Ayala noted people say La Junta has the highest utility rates in Colorado.
