- title: New Economic Development Board
  summary: Council passed an ordinance creating an Economic Development Board as an arm of the city, rather than a nonprofit, after IRS-related problems with the earlier structure. The ordinance passed on first and second readings, and the City Clerk will call for letters of interest for board vacancies.
