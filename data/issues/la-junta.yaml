- title: 2027 city budget, mill levy and utility rates
  summary: Finance Director Aliza Libby presented the 2027 budget on Sept. 8, and a public budget hearing was set. On Oct. 19 council adopted Resolution R-14-2026 approving the proposed budget and passed the mill levy and annual appropriation ordinances on first reading, with second readings on the Nov. 2 agenda. The Board of Utilities was also set to consider 2027 electric, water, wastewater and sanitation rate resolutions on Oct. 13. The mayor noted that people say La Junta has the highest utility rates in Colorado.
