- title: Low-speed vehicles allowed during temporary events
  summary: Council passed on first and second reading a temporary event ordinance allowing side-by-sides and other low-speed vehicles during events. It grew out of a tour with Main Street and Urban Renewal and the electric department, with Tarantula Fest and Early Settlers Day mentioned.
