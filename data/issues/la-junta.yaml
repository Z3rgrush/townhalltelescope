  summary: Council took up an ordinance authorizing a loan from the state water authority to pay for water distribution system improvements, along with a supplemental appropriation to the Water Fund. First reading was Nov. 2 and second reading on Nov. 16. Utility crews are also continuing a system expansion on 24th Street.
