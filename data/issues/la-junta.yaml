- title: Pueblo sewage spill and Arkansas River safety
  summary: After a major raw sewage spill in Pueblo reached the river near Confluence Park, the Water Director told Council not to use untreated river water for food preparation or cooking. Local drinking water was reported safe and the treatment plant working properly, with reservoir releases raised to 60 cfs to help flush the river.
  where: Arkansas River / Citywide
