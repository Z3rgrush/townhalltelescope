- title: Urban Renewal Authority Spark Grants and Chestnut Apartments project
  summary: The URA tabled a Spark Grant request from Sangre de Cristo Community Care for its storefront at 207 Colorado Ave. because the work was done before approval. The Chestnut Apartments project is about 52 days past its 180-day contract term, with fire suppression, HVAC, plumbing and doors outstanding. The URA is also reviewing blight and life-safety applications from Arkansas Valley CASA and La Junta Associated Charities.
