- title: Urban Renewal Authority grants and Chestnut Apartments
  summary: The URA tabled a Spark Grant request from Sangre de Cristo Community Care for a storefront sign at 207 Colorado Ave because the work was done before approval; it was later denied for that reason. It approved a roof-repair application from Arkansas Valley CASA and has another application from La Junta Associated Charities pending. The Chestnut Apartments project by Rikhof ran about 52 days past its 180-day contract.
