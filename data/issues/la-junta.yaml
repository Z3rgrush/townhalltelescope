- title: Pueblo sewage spill and Arkansas River safety
  summary: Water Director Tom Seaba reported on a major raw sewage spill in Pueblo that reached the Arkansas River. Residents were told not to use untreated river water for food preparation or bathing, while local drinking water is safe and the treatment plant is working properly. Reservoir releases were increased to help flush the river.
  where: Arkansas River
