- title: Urban Renewal Authority grants and Chestnut Apartments
  summary: The URA tabled the Sangre de Cristo Community Care Spark Grant for a sign at 207 Colorado Ave. because the work was done before approval, and later said it would not be awarded. It approved a roof grant for Arkansas Valley CASA, and La Junta Associated Charities has an application on the Oct. 22 agenda. The Chestnut Apartments project is behind its 180-day contract, and the board tabled the 2027 URA budget for a work session. A resident asked whether the TIF district would expand.
