  public_comment: true
- title: Pueblo sewage spill and Arkansas River safety
  summary: Water Utilities Director Tom Seaba briefed council and the Utilities Board on a major raw sewage spill in Pueblo that reached the river. Residents were told not to use river water or untreated shallow well water for cooking or bathing. Local drinking water was stated to be safe, and reservoir releases were increased to help flush the river.
