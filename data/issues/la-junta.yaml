- title: Residents' complaints over handling of an assault case
  summary: Residents told Council that an assault case was dismissed without notifying the family, and cited confusion over city versus county jurisdiction. A family member alleged unprofessionalism within the police department and questioned the Mayor's endorsement of a sheriff candidate.
