- title: Residents' complaints over police handling of a assault case
  summary: On Oct. 19 family members spoke at council about an assault case that was reportedly dismissed without notifying the family. They described a city/county jurisdiction disconnect, unanswered requests for updates, and alleged unprofessionalism and a double standard in the police department. They also raised the mayor's endorsement of a sheriff candidate. Earlier council notes referenced transparency and accountability with the police department.
  where: 13 West 3rd Street / 22nd Street
