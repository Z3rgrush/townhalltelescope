- title: New Economic Development Board ordinance
  summary: Council passed an ordinance on first reading on Sept. 21 and second reading on Oct. 5 creating a city Economic Development Board. It would be an arm of the city rather than a nonprofit, partly because of an IRS issue. The clerk will call for letters of interest for board vacancies.
