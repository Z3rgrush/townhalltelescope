- title: Economic Development Board ordinance
  summary: Council passed an ordinance creating a city Economic Development Board on first reading Sept. 21 and on second reading Oct. 19. It is meant to restart economic development as an arm of the city, like tourism, with its budget under the city, instead of a nonprofit with IRS problems. The City Clerk will call for letters of interest for board vacancies.
