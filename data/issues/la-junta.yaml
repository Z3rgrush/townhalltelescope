- title: Urban Renewal Authority Spark grants and blight funding
  summary: The URA tabled Sangre de Cristo Community Care's Spark Grant request for a storefront sign at 207 Colorado Ave. because the work was done before approval, and later told the applicant it would not be awarded. The URA approved a blight and safety grant for Arkansas Valley CASA's roof, and La Junta Associated Charities has an application pending. The URA also tabled its 2027 budget for a work session.
