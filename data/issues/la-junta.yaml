  summary: The Board of Utilities agenda for Oct. 13 lists resolutions changing 2027 prices for electric, water, wastewater and sanitation, plus a recommendation on the 2027 utility fund budgets. Mayor Ayala noted in August that people say La Junta has the highest utility rates in Colorado.
