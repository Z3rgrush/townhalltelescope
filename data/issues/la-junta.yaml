- title: Water system improvements and state loan
  summary: The utilities department is extending the water system on 24th Street between Carson and Belleview to improve flow and fire protection. A Nov. 2 first-reading ordinance would authorize a loan from the Colorado Water Resources and Power Development Authority for distribution system improvements. Water grant applications for new meters and storage tank rehabilitation are also underway.
