- title: Pueblo sewage spill and Arkansas River safety
  summary: Water Director Tom Seaba briefed Council on a major raw sewage spill in Pueblo that reached the river near Confluence Park. Residents were told not to use untreated river or shallow well water for cooking or bathing. Local drinking water was reported safe, and reservoir releases were increased to help flush the river.
