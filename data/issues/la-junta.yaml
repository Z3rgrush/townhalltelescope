- title: Temporary event ordinance for side-by-sides and low-speed vehicles
  summary: Council passed on first reading (Sept. 8) and second reading (Sept. 21) a temporary event ordinance allowing side-by-sides and other approved low-speed vehicles during events. It grew out of Main Street and Urban Renewal discussions and committee needs for events like Tarantula Fest and Early Settlers Day.
