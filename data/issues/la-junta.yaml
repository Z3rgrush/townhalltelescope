- title: Water loan and system extension on 24th Street
  summary: The city is extending its water system on 24th Street between Carson and Belleview to improve volume, flow and fire protection. An ordinance on first reading Nov. 2 would authorize a loan from the Colorado Water Resources and Power Development Authority for water distribution improvements. A water fund supplemental appropriation was also scheduled.
  where: 24th Street between Carson and Belleview
