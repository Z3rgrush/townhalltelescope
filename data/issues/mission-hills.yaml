- title: Cell tower leases and a possible new tower at City Hall
  summary: After T-Mobile sent notice cancelling its lease at 6400 State Line Road and asked for a 130-150 foot monopole, the council began weighing options, including a site in the trees on the City Hall grounds along Tomahawk Road, ahead of a February 2027 AT&T lease deadline.
  where: 6400 State Line Rd / City Hall
  refs: [11, 15]
- title: Speeding on 67th Street and golf carts on city streets
  summary: A resident reported drivers going about 70 mph on 67th Street west of Belinder; police described enforcement details and discussed residents driving golf carts that may not be street legal.
  where: 67th St west of Belinder Ave
  refs: [2]
  public_comment: true
- title: License plate reader cameras and data retention
  summary: Prairie Village police, who patrol Mission Hills, answered resident questions about license plate readers, including the 90-day retention period, who can search the data and audits.
  refs: [9]
- title: 2027 budget and rising property taxes
  summary: At the budget hearing a resident said his property taxes have grown more than 6% a year since 2020, and officials explained the county appraiser's role and rising costs.
  refs: [9]
  public_comment: true
- title: Eisenhower Pond watershed and 2027-2028 street and stormwater work
  summary: The council adopted a 2027-2031 capital plan and reviewed a concept study for street and stormwater projects in the Eisenhower Pond watershed, plus work on Belinder south of 69th and 70th Terrace.
  where: Belinder Ave south of 69th St; 70th Ter
  refs: [15]
- title: Fireworks ordinance
  summary: A city committee took up possible changes to the fireworks ordinance.
  refs: [17]
- title: Pet license rules
  summary: The council discussed changes to the pet license ordinance and tagging process.
  refs: [15]
- title: Indian Hills Country Club driving range net along 69th Street
  summary: The architectural review board considered a protective net fence with seventeen tall poles along the 69th Street side of the club's driving range.
  where: 69th St at Indian Hills Country Club
  refs: [7]
