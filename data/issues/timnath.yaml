- title: Peanut Park (Timnath Ranch North Park) master plan
  summary: The PROST Committee reviewed the master planning process for Peanut Park, including a resident poll on amenities, drainage challenges and the park's size. The five-year capital plan includes $6 million for the park next year, but funding is not guaranteed until the budget is approved, so improvements will likely be phased.
