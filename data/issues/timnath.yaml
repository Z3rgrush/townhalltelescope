- title: Recreation Center design and Community Park projects
  summary: The Rec Center project finished schematic design and is being reviewed with Adolfson & Peterson Construction and a third-party architect before moving into design development. The Community Park entrance project is nearly complete, with flood irrigation removed to save water, and a kayak kiosk was installed in April.
