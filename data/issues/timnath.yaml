- title: Land Use Code amendments and Comprehensive Plan draft
  summary: The Planning Commission reviewed Council's decisions on code changes covering a wastewater and graywater prohibition, Larimer County flood insurance rate maps, neighborhood meeting notices, subdivision procedures, administrative plats and fencing materials. It also looked at the working draft of the Comprehensive Plan.
