- title: 2027 Town budget and 2026 budget amendment
  summary: Council held 2027 budget work sessions on Oct. 13 and 27, reviewing the draft budget, five-year capital plan and strategic plan allocations. On Nov. 10 it held first reading of the 2027 budget ordinance (No. 19) and a 2026 budget amendment (No. 20), with public hearings set for Dec. 8, 2026.
