- title: Town purchase of 4809 S. County Road 3F and 4104 Main Street
  summary: Council is considering resolutions approving contracts to buy a residential property at 4809 S. County Road 3F, with a post-closing occupancy agreement, and a commercial property at 4104 Main Street. The Council also scheduled closed-door talks on real estate purchases or sales.
