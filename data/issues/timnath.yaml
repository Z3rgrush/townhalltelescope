- title: 2027 budget and five-year capital improvement plan
  summary: The Town Council held a work session on the 2027 draft budget, which includes a five-year capital plan, cash flow projections and allocations tied to the Strategic Plan. Capital projects listed include a parks maintenance facility, police department parking lot and network upgrades, and security cameras at Timnath Community Park.
  where: Townwide
