- title: Peanut Park (Timnath Ranch North Park) master plan and $6 million funding
  summary: The PROST Committee reviewed master planning for Peanut Park, including a poll of resident interest in amenities and challenges such as drainage and the park's size. The five-year capital plan includes $6 million for the park next year, but funding is not guaranteed until the budget is approved, so the work will be phased. Ayres and Associates presented a draft master plan in October.
  where: Peanut Park / Timnath Ranch North Park
