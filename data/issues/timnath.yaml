- title: Rec Center design and park projects
  summary: The Rec Center project has finished schematic design, and the Town is working with Adolfson & Peterson Construction and a third-party architect to confirm costs before moving into design development. The Timnath Community Park entrance project is nearly complete, with flood irrigation removed to save water.
  where: Timnath Community Park, 4800 Goodman Street
