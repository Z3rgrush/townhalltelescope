- title: 2027 Town budget and five-year capital plan
  summary: Town Council held budget work sessions on the 2027 draft budget, which includes a five-year capital improvement plan and cash-flow projections. Budget allocations are tied to the Strategic Plan, and capital projects include a parks maintenance facility, police department upgrades and security cameras at Timnath Community Park. A compensation study is also to be folded into the budget.
