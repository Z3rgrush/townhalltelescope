- title: Timnath Landing GID bond issuance
  summary: The Timnath Landing General Improvement District board took first reading of an ordinance authorizing Series 2026A and subordinate 2026B limited tax general obligation bonds to fund public improvements and reimburse the developer and Town. The ordinance re-authorizes one approved in December 2025; the public hearing was set for Oct. 27, 2026. The board also accepted the 2025 audit.
