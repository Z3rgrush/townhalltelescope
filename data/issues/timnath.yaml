- title: Timnath Landing GID bond issuance (Series 2026A and 2026B)
  summary: The Timnath Landing General Improvement District Board took up an ordinance authorizing Limited Tax General Obligation Bonds, Series 2026A and subordinate Series 2026B. The bonds would fund public improvements approved by district voters, reimburse the developer and the Town, and cover issuance costs. The ordinance is being re-authorized because the board approved it in December 2025 and the timeline has since been extended. First reading was October 13 and the public hearing was set for October 27.
