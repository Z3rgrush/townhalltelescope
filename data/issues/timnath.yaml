- title: Draft Comprehensive Plan and Land Use Code amendments
  summary: The Planning Commission reviewed the working draft of the Timnath Comprehensive Plan. It was also updated on Council decisions on Land Use Code changes covering wastewater and graywater, Larimer County flood maps, neighborhood meeting notices, subdivision procedures, plats and fencing materials.
