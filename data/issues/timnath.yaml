- title: Recreation Center design and construction manager contract
  summary: The Rec Center project has finished schematic design, and the Town is working with Adolfson & Peterson Construction and a third-party architect to confirm it is within the expected cost range before moving into design development. Council also considered Amendment 1 to the construction manager/general contractor agreement with AP Mountain States LLC.
  where: Timnath Recreation Center
