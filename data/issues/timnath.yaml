- title: Ban on new on-site wastewater and graywater systems
  summary: Council held first reading of Ordinance 16, which would amend the municipal code to prohibit new on-site wastewater treatment systems and graywater treatment works. A public hearing is set for Oct. 27, 2026 at 6:00 p.m.
  where: Townwide
  refs:
  - 7
- title: Land Use Code amendments 25 and 26, including flood maps
  summary: Council took first reading of Ordinances 17 and 18 adopting Amendments 25 and 26 to the Land Use Code. Amendment 25 relates to the updated Larimer County Flood Insurance Rate Maps and Flood Insurance Study. Public hearings are set for Oct. 27, 2026.
  where: Townwide
