- title: Timnath Landing GID bond issuance (Series 2026A and 2026B)
  summary: The Timnath Landing General Improvement District is authorizing Limited Tax General Obligation Bonds (2026A) and Subordinate bonds (2026B) to fund public improvements, reimburse the developer and cover issuance costs. A December 2025 ordinance is being re-authorized because of the extended timeframe, with first reading on Oct. 13 and a public hearing set for Oct. 27, 2026 at 6:00 p.m. The GID also approved an advance and reimbursement agreement with CAC Timnath, LLC and accepted its 2025 audit.
  where: Timnath Landing GID
