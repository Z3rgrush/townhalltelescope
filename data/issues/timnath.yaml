- title: 2027 Town budget and five-year capital plan
  summary: Town Council held work sessions on the 2027 draft budget, which includes a five-year capital improvement plan and cash flow projections tied to the Strategic Plan. Projects listed include a parking lot reconfiguration at the police department, a parks maintenance facility, and security cameras at Timnath Community Park. The August compensation study findings are also expected to feed into the budget.
