- title: Peanut Park (Timnath Ranch North Park) master plan and $6 million funding
  summary: The PROST Committee reviewed the master planning process for Peanut Park, including a resident poll on amenities and challenges such as drainage and the park's size. By October the draft master plan from Ayres and Associates was on the agenda, and the five-year Capital Improvement Plan includes $6 million for next year, which is not guaranteed until the budget is approved. The park will need to be built in phases.
  where: Peanut Park (Timnath Ranch North Park)
