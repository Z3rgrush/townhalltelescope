- title: Costco fuel facility expansion
  summary: The Planning Commission reviewed a site plan to expand the Costco fuel canopy at 4665 Weitzel Street from about 3,884 to 10,216 square feet and double fueling positions from 16 to 32. Discussion focused on traffic circulation and a median extension to remove unsafe southbound movements; staff recommended approval with standard conditions.
