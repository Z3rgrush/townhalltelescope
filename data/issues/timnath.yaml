- title: Timnath Landing GID bond issuance (Series 2026A and 2026B)
  summary: The Timnath Landing General Improvement District Board took up an ordinance authorizing limited tax general obligation bonds, Series 2026A and subordinate Series 2026B. The bonds would fund public improvements approved by district voters, reimburse the developer and the Town, and cover issuance costs. The ordinance was re-authorized because the earlier December 2025 approval was delayed; first reading was Oct. 13 with a public hearing Oct. 27.
  where: Timnath Landing GID
