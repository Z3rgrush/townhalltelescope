- title: Electric vehicle charging station regulations
  summary: Staff asked Council whether to add EV charging rules to the Land Development Code, which currently has none. Options include screening of equipment and allowing chargers by right in most districts, and the discussion references state law HB24-1173. A proposal for four EV chargers at 7600 E. Orchard Road came before Planning and Zoning on September 15.
