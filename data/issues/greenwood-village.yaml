- title: Green Oaks and Orchard Road bridge repairs over budget
  summary: Bids to replace rails on the Green Oaks Drive Bridge over the Highline Canal and the Orchard Road Bridge, and to repair failing asphalt on the Orchard bridge, all exceeded the budget. Staff needs a $387,996 supplemental appropriation and is asking Council whether it supports the amendment.
