- title: Side-yard setback variances at Monaco Heights and other homes
  summary: The Board of Adjustments and Appeals heard a variance to build a garage addition 15 feet from the side lot line in the 20-foot Monaco Heights PUD setback; staff said hardship criteria were not met. Another side-yard variance heard Sept. 24 drew an opposed neighbor, and a Radcliff Ave fence variance was approved Oct. 22.
