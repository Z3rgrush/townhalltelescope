- title: Carson Park public art installation
  summary: The Arts and Humanities Council asked Council to approve fabrication and installation of three sculptures by Kevin Shaffer in Carson Park, tied to the park improvement project and the city's 75th anniversary. A public input meeting was held August 26, 2026, and the project was also on the October 15 Arts and Humanities Council agenda.
