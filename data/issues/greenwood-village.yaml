- title: 2027 city budget and mill levy
  summary: Council held the first-reading hearing on the 2027 budget, Capital Improvement Program and mill levy ordinances (12-26 and 13-26) on Oct. 19, following a Sept. 28 budget workshop. An amended budget added $164,000 for a citywide access control system, and the second reading was placed on the Nov. 2 consent agenda.
