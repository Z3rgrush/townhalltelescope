- title: 2027 budget and mill levy
  summary: Council held the first-reading public hearing on the 2027 budget and Capital Improvement Program (Ordinances 12-26 and 13-26, setting mill levies) and then put second reading on the Nov. 2 consent agenda. The amended budget added $164,000 for a citywide access control system after the budget workshop.
