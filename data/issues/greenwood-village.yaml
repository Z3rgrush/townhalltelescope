- title: Grace Chapel special use permit at 8500 E. Orchard Road
  summary: Grace Chapel asked for a Special Use Permit and Site Development Plan to turn an existing building and parking lot into a place of worship, with 250 parking spaces and new LED lighting. The Planning and Zoning Commission recommended approval, staff found the criteria met, and Council held a quasi-judicial hearing on August 17.
