- title: Emergency permit parking districts near Cherry Creek High School
  summary: On Aug. 3, 2026 Council passed emergency ordinances 08-26 and 09-26 expanding the Cherry Creek Village North permit district and creating one in Village on the Lake, ahead of a student parking shortage from the Cherry Creek High School rebuild. By the Oct. 5 study session, police reported 88 warnings, 18 citations and permits issued to about 125 households; temporary permits were mailed to 208 households.
  where: Cherry Creek Village North and Village on the Lake neighborhoods
