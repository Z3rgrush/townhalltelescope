- title: Drone delivery regulations
  summary: Council was scheduled to discuss how to regulate commercial drone delivery on Nov. 2. Staff compared approaches of other Colorado cities, including moratoriums in Castle Rock and Parker and special use permits in Northglenn, and looked at buffers around schools and parks.
