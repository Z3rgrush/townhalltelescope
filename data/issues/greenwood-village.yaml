- title: High Line Canal irrigation phase two
  summary: Council considered a license agreement with Arapahoe County to install the second phase of well-water irrigation along the High Line Canal, running from Long Rd to Steele to Garden Ln. Work would continue through winter. Council also discussed Curtis Park, which stays on Denver Water because it would need a large booster pump.
