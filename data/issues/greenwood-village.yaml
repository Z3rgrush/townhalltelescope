- title: Side yard setback variances before the Board of Adjustments and Appeals
  summary: The board heard variance requests on side yard setbacks. One was a garage addition at a Monaco Heights PUD lot, where staff said the 20-foot setback applied and the request was not justified. Another was a north side yard addition on a 1959 home. A fence variance at 9150 E. Radcliff Ave was approved after a neighbor objected to a separate request.
