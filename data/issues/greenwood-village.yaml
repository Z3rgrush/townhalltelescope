- title: Drone delivery regulations
  summary: Council was scheduled to discuss how to regulate commercial drone delivery on November 2. Staff surveyed other cities, including moratoriums in Castle Rock and Parker and special use permit rules in Northglenn, and options such as limits on parks and buffers around schools.
