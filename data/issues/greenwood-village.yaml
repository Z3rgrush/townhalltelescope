- title: Emergency permit parking districts near Cherry Creek High School
  summary: On Aug. 3, 2026 Council passed emergency ordinances 08-26 and 09-26 expanding the permit district in Cherry Creek Village North and creating one in Village on the Lake, ahead of a student parking shortage from the Cherry Creek High School rebuild. By October police reported 88 warnings, 18 citations and permits for about 125 households, and Council held a study session on the districts Oct. 5.
  where: Cherry Creek Village North and Village on the Lake neighborhoods
