- title: Belleview Avenue and Franklin Street safety improvements
  summary: CDOT, which controls Belleview Avenue as a state highway, will present its recommended alternative for safety improvements at the Franklin Street intersection to Council on Nov. 16. The recommendation came out of a joint effort and scoring of several alternatives.
