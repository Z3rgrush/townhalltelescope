- title: 2027 budget and mill levy
  summary: Council held a public hearing on the 2027 budget and Capital Improvement Program, with Ordinances 12-26 (budget) and 13-26 (mill levy). First reading was October 19 and second reading was on the November 2 consent agenda. Staff presented an amended budget after the budget workshop, including $164,000 more for a citywide access control system.
