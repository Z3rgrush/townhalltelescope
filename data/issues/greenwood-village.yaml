- title: Recreation use with pickleball courts and new plat
  summary: Council held a quasi-judicial hearing on a site plan amendment, special use permit and final plat for a recreation use in the Mixed Commercial district. The plan removes a parking lot, adds open space and builds four pickleball courts. Public comments asked for a noise study.
