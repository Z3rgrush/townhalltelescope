- title: Drone delivery regulations
  summary: Staff briefed Council on how cities can regulate commercial drone delivery, citing moratoria and permit rules in Castle Rock, Parker, Northglenn and others. Greenwood Village is considering how drone hubs, landings and use of parks might be handled.
