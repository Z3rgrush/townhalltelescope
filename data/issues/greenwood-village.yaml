- title: High Line Canal irrigation phase two
  summary: Council considered a license agreement with Arapahoe County, which owns the land, for the second phase of irrigation along the High Line Canal, connecting to well water from Long Road to Steele to Garden Lane. Councilmembers asked about irrigating Curtis Park, which uses Denver Water and would need a large booster pump.
