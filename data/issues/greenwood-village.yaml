- title: Side-yard setback variances before the Board of Adjustments
  summary: The Board heard a variance to the Monaco Heights PUD for a garage addition encroaching about 48 sq ft into the 20-foot side setback; staff found no hardship. A separate variance for a north side yard addition was also heard, and a neighbor spoke against one request on Oct. 22. Fence variances at 9150 E Radcliff Ave were also voted on.
