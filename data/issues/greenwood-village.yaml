- title: Electric vehicle charging station rules
  summary: Staff presented options for adding EV charging standards to the Land Development Code, including screening of equipment, citing the lack of current code language and state law deadlines under House Bill 24-1173. A separate Planning Commission item concerned expanding EV chargers from two to four at 7600 E Orchard Road.
