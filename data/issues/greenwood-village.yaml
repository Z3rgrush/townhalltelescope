- title: Emergency permit parking districts near Cherry Creek High School
  summary: On August 3, 2026 Council passed emergency ordinances 08-26 and 09-26 expanding the Cherry Creek Village North permit parking district and creating one in Village on the Lake, ahead of a student parking shortage from the Cherry Creek High School rebuild. By October 5, police reported 88 warnings, 18 citations and about 125 households with permits, and Council discussed the districts again on October 19.
  where: Cherry Creek Village North and Village on the Lake neighborhoods
