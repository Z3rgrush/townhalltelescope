- title: EV charging station rules
  summary: Staff briefed Council on adding Land Development Code standards for commercial EV chargers, including screening of equipment, since the code is silent on them. This follows state law (HB 24-1173) requiring permitting standards, and the charger installation at 7600 E. Orchard Road. Staff is not recommending changes to approval processes, and an ordinance would come back later if Council directs.
