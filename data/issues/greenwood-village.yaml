- title: Electric vehicle charging station rules
  summary: The Land Development Code has no specific EV charging language, and staff asked Council whether to add standards such as equipment screening for commercial chargers, in light of state law (HB 24-1173). Staff did not recommend changing approval processes. The Planning Commission also considered a 4-charger amendment at 7600 E Orchard Road, where two were previously approved.
