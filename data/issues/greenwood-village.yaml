- title: Grace Chapel place of worship at 8500 E. Orchard Road
  summary: Grace Chapel asked for a Special Use Permit and Site Development Plan to repurpose an existing building and parking lot at 8500 E. Orchard Road as a place of worship, with 250 parking spaces and new LED lighting. Planning and Zoning recommended approval, and Council held the quasi-judicial hearing Aug. 17; staff found the approval criteria met.
