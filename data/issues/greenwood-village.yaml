- title: Grace Chapel reuse of building and parking lot at 8500 E Orchard Road
  summary: Council held a quasi-judicial hearing on a Special Use Permit and Site Development Plan to repurpose an existing building and parking lot for Grace Chapel, with 250 parking spaces proposed. Staff found all approval criteria met and the Planning and Zoning Commission recommended approval.
