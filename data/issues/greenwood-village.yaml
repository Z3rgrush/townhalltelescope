- title: Emergency permit parking districts near Cherry Creek High School
  summary: On Aug. 3 Council passed emergency ordinances 08-26 and 09-26 expanding the Cherry Creek Village North permit parking district and creating one in Village on the Lake, ahead of a student parking shortage caused by the Cherry Creek High School rebuild. By October, police reported 88 warnings, 18 citations and permits issued to about 125 households, and Council held a study session on the districts.
  where: Cherry Creek Village North and Village on the Lake neighborhoods
