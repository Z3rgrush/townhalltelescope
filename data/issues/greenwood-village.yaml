- title: High Line Canal irrigation phase two and park water use
  summary: Council considered a license agreement with Arapahoe County for the second phase of High Line Canal irrigation, running from Long Rd to Steele to Garden Ln to connect to well water. Councilmembers asked about switching Curtis Park, which uses Denver Water, to well water, which would need a large booster pump.
