- title: High Line Canal irrigation phase two
  summary: Council considered a license agreement with Arapahoe County for the second phase of High Line Canal irrigation using well water, with work through the winter. Council discussed whether Curtis Park, on Denver Water, could be added, which would need a large booster pump.
