- title: Short-term rental rules
  summary: The council worked on zoning rules for short-term rentals, settling on a 1,000-foot spacing requirement and a cap of six in the central area; a modified ordinance needs a two-thirds vote.
  refs: [1, 7, 8]
- title: Water and sewer rate increases
  summary: A utility rate study recommended raising the water service charge 14.1% to $28.46 a month and the usage rate 10.9% to $10.28 per 1,000 gallons, with wastewater changes too.
  refs: [6, 7, 8]
- title: Lynn Valley housing incentive district and subdivision
  summary: Bonner Springs set up a Reinvestment Housing Incentive District to pay infrastructure for the Lynn Valley subdivision at 13852 Kansas Avenue, rezoned it 7-1 and approved the first plat, with a hearing set for November 9.
  where: 13852 Kansas Ave
  refs: [0, 1, 6, 7, 8]
- title: New subdivisions on the west side (Mission Prairie Farms, Bungalows, Tiner Acres)
  summary: The city approved plats and rezonings for Mission Prairie Farms on 118th Street, the Bungalows on 130th Street, Tiner Acres on 134th Street and Carter Acres on 122nd.
  where: S 118th-134th St
  refs: [1, 2, 5, 7, 8]
- title: 2027 budget and exceeding the revenue-neutral rate
  summary: The council adopted a resolution to exceed the revenue-neutral rate and a $37.6 million 2027 budget, with changes to library funding.
  refs: [0, 4, 5]
- title: RV park on North 134th Street
  summary: A special use permit for The Springs RV Park in a rural residential district was continued to November.
  where: 501 N 134th St
  refs: [9]
- title: Downtown Oak Street housing and walkability plan
  summary: The city adopted a Connectivity and Walkability Plan, adjusted a state housing grant for 120 on Oak, approved a below-grade apartment at 125 Oak and replats on Oak and Front Streets, as downtown storefronts hit full occupancy.
  where: Oak St / downtown
  refs: [0, 1, 5, 6, 7, 9]
- title: Senior Villas bonds
  summary: The council authorized industrial revenue bonds for Bonner Springs Senior Villas.
  refs: [5]
- title: E-bikes and e-scooters
  summary: The police chief presented options for regulating e-mobility devices for safety.
  refs: [0, 5]
- title: Centennial Park extension and Center Park shelter
  summary: The city approved buying land to extend Centennial Park and an $88,000 shelter at Center Park.
  refs: [3]
