- title: Public health agreements and Jefferson County partnerships
  summary: The board rescinded and replaced earlier agreements with Jefferson County Public Health for referral clinical services and with Arapahoe County Public Health for clinician preceptor services. It also approved state public health contract amendments for emergency preparedness and Vaccines for Children.
