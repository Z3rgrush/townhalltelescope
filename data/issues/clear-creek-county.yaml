- title: Lodging tax increase ballot question (R-26-55)
  summary: The commissioners considered Resolution R-26-55 to put a question to voters in unincorporated Clear Creek County and its municipalities, except Georgetown, on raising the county's lodging tax. Proceeds would go toward road maintenance or improvements, public safety, childcare and housing tied to tourism. Lodging tax was also on an August intergovernmental agenda, and a tourism bureau website and messaging presentation was scheduled.
  where: Countywide (excluding Georgetown)
