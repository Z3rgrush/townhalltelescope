- title: 2027 county budget and 2026 budget check-in
  summary: The board held a 2026 budget check-in and 2027 budget process work session, followed by a 2027 proposed budget workshop on Oct. 20. A public hearing on the 2027 budget for the county, Emergency Services GID and Housing Authority was set for Nov. 3, along with a 2026 supplemental budget appropriation (R-26-61).
