- title: Lodging tax increase ballot question (Resolution R-26-55)
  summary: The commissioners considered Resolution R-26-55 to send voters a question on raising the county's lodging tax. The funds would go to road maintenance, public safety, childcare and housing for the tourism sector. The question would go to unincorporated areas and the municipalities except Georgetown. The Sept. 1 agenda also lists a work session on the Tourism Bureau website and messaging.
  where: Countywide (excluding Georgetown)
