- title: Strong Start Scholarship administrative rate
  summary: The Clear Creek Schools Foundation asked to adjust the administrative cost rate for the Strong Start Scholarship Program. The board asked for full financials in a few weeks before amending the agreement. The board also considered support for a school district ballot measure in October.
