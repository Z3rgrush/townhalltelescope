- title: Short-term rental ordinance No. 21 replacing Ordinance 19
  summary: On Nov. 3 the commissioners held a public hearing and first reading of Ordinance No. 21, a rewrite of the county's short-term rental rules (Ordinance 19). The packet includes a summary of October community feedback, written public comments, and a list of substantive changes.
