- title: Short-term rental ordinance (Ordinance No. 21)
  summary: Commissioners took up first reading of Ordinance No. 21, which would replace Ordinance 19 on short-term rentals. Community feedback was gathered in October 2026, and written public comments and a summary of changes were in the packet.
