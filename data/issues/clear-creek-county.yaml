- title: Open fire ban ordinance No. 20
  summary: The commissioners held a second-reading public hearing on Ordinance No. 20, which repeals and replaces Ordinance 16 and sets the county's regulations for banning open fires. A related work session covered Public Safety Power Shutoffs and the 2026 wildfire mitigation plan.
  where: Countywide
  refs:
  - 0
  topics:
  - Fire & emergencies
  - Environment & climate
- title: 2027 county budget
  summary: The commissioners took up 2027 budget requests in September, held a proposed budget workshop on Oct. 20, and discussed capital requests on Nov. 10. A public hearing on the 2027 budget for the county, the Emergency Services General Improvement District and the Housing Authority was held Nov. 3, along with a supplemental 2026 budget appropriation (R-26-61).
