- title: Open fire ban ordinance (Ordinance No. 20) and wildfire preparedness
  summary: The board held a second reading and public hearing on Ordinance No. 20, which repeals and replaces Ordinance No. 16 and sets regulations for banning open fires. It also heard a Public Safety Power Shutoff presentation, and reviewed the county's 2026 wildfire mitigation plan. A Wildfire Preparedness Workshop was announced for August 26 at Dumont Fire Station.
