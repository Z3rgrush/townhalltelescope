- title: Georgetown purchase of Waldorf inholding parcel
  summary: The Open Space Commission and commissioners discussed a possible purchase, lease or sale involving Parcel No. 2091-034-00-645 in unincorporated Clear Creek County, with the Town of Georgetown seeking to buy. The matter was handled partly in executive session.
