- title: 2026 budget check-in and 2027 proposed budget
  summary: 'The board held work sessions on the 2026 budget and the 2027 budget process in August, then took up 2027 budget requests in September. A 2027 proposed budget workshop was set for October 20. Also on the agenda: restoring a Deputy Clerk position as permanent full-time, and a Sheriff''s Office staffing and compensation matter.'
