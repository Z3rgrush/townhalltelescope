  - 10
  topics:
  - Budget & taxes
  - Tourism & events
  - Elections
- title: Open fire ban ordinance (Ordinance No. 20) and wildfire preparedness
  summary: The board held a second-reading public hearing on Ordinance No. 20, which would repeal and replace Ordinance No. 16 and set new rules for banning open fires. A Public Safety Power Shutoff presentation and the 2026 wildfire mitigation plan were also on the Aug. 18 agenda. A Wildfire Preparedness Workshop is set for Aug. 26 at the Dumont Fire Station.
