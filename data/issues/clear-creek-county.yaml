- title: 'Housing: Prop 123 credits and regional housing action plan'
  summary: The county committed to join the Clear Creek Regional Housing Authority's Housing Action Plan and considered an intergovernmental agreement on sharing Proposition 123 affordable housing credits. It also amended an agreement in support of childcare in the county.
