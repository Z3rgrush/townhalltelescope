- title: Alvarado Open Space Park, Glass Memorial and open space rules
  summary: The Open Space Commission followed up on the Glass Memorial at Alvarado Open Space Park and reviewed a concept for it. It also began a discussion of updating its rules and regulations using Jefferson County's park rules as a model. Other items included a legal question on adding a gate to an access road, grant projects, and parking on county roads to reach open space.
