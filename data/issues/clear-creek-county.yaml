- title: Lodging tax increase ballot question (Resolution R-26-55)
  summary: Commissioners considered Resolution R-26-55 to send voters in unincorporated Clear Creek County and its towns (except Georgetown) a question to increase the county lodging tax. Proceeds would go to tourism-related road maintenance, public safety, childcare and housing. A tourism bureau website and messaging presentation was also on the agenda.
  where: Countywide (except Georgetown)
