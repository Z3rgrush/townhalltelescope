- title: Lodging tax increase ballot question
  summary: The board considered Resolution R-26-55 to send voters a question on raising the county's lodging tax. Proceeds would go to tourism-related road maintenance, public safety, childcare and housing. The question covers unincorporated areas and the municipalities except Georgetown.
  where: Countywide (except Georgetown)
