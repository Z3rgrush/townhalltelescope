- title: Open fire ban ordinance (Ordinance No. 20) and wildfire preparedness
  summary: The board held a public hearing on second reading of Ordinance No. 20, which repeals and replaces Ordinance 16 on regulations for banning open fires. It also heard a Public Safety Power Shutoff presentation and reviewed the 2026 wildfire mitigation plan. A resolution rescinding R-01-83 had a hearing the same day.
