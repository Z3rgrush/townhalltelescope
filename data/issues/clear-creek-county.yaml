- title: CDOT I-70 Floyd Hill reporting and Condition 9 requirements
  summary: The board held work sessions on CDOT reporting on the I-70 Floyd Hill project and on CDOT requirements for Condition 9. It also accepted Forest Service public road easements for several county roads, including Little Bear Creek Road and Sinton Road.
