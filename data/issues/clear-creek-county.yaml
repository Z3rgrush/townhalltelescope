- title: Alvarado Open Space Park and open space rules
  summary: Staff gave an update on the Alvarado Open Space Park concept, and the Open Space Commission discussed a memorial concept for the park. The commission also began updating its rules and regulations, using Jeffco's park rules as a model, and the board discussed parking on county roads to reach open space.
