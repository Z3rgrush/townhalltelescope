- title: 2026 budget, property tax levy and appropriations
  summary: Council held a budget workshop on Nov. 18, 2025, then a public hearing on Dec. 10 to adopt the 2026 budget (Resolution 25-12-20), set the property tax levy (25-12-21) and appropriate funds (Ordinance 648). A 2025 budget supplement and supplemental appropriations were heard Dec. 29.
