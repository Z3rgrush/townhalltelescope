- title: Main Street programs, grants and Oktoberfest
  summary: The Main Street board is planning Oktoberfest volunteer coordination and hoping for a $2,500 AARP grant. It could be matched with DOLA mini-grant funds; Main Street already received $5,000 from DOLA. Council also scheduled a State of Main Street presentation on November 5.
