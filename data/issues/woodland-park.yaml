- title: Eagle Fire Lodge rezoning and apartment conversion at 777 E. US Highway 24
  summary: Applicant Rick Dilsavor of Cedarwood Development seeks to rezone the former Eagle Fire Lodge motel from PUD to Multi Dwelling Urban Residential and get a conditional use permit to turn its 25 lodging units into 25 market-rate long-term rentals. The rezone would require 25 additional multifamily water taps under the City's Water Tap Management Plan. Planning Commission heard it October 8; Council took ordinances 1539 and 1540 on initial posting November 5 with a hearing set for November 19.
