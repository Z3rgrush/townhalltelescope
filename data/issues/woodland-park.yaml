- title: 209 E. Midland (Vos Building) dangerous-building appeal and historic landmark designation
  summary: Owner Andrew Nguyen appealed a Dangerous Building Notice and Notice to Vacate (issued May 28, 2026) on the vacant building at 209 E. Midland. His representative said the 60-day permit deadline is not feasible and repairs could take up to a year. Separately, the Historical Preservation Committee considered recommending the building as a Local Historic Landmark, with four letters of support and one comment received.
