- title: Proposed temporary moratorium on residential development applications
  summary: City Council took Ordinance 1541 on initial posting on November 5. It would temporarily halt submission, acceptance, processing and approval of development, zoning and land use applications for residential development in the city. A public hearing is set for November 19, 2026.
