- title: 209 E. Midland (Vos Building) historic landmark designation and dangerous-building appeal
  summary: The Historical Preservation Committee considered recommending that City Council designate the Vos Building at 209 E. Midland a Local Historic Landmark, with four letters of support and one public comment received. Separately, owner Andrew Nguyen appealed a Dangerous Building Notice and Notice to Vacate issued May 28, 2026 to the Board of Review. His representative said the building has been vacant since 2019 and the 60-day permit deadline is not feasible, and the Historical Preservation Committee later discussed the appeal.
  where: 209 E. Midland Avenue
