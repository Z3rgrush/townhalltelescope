- title: New 'Public Safety Facilities' use in the Unified Development Code (Ordinance 1536)
  summary: The city is amending the Unified Development Code to add Public Safety Facilities as a defined use allowed through the Special Use Permit process. The Planning Commission discussed it, and Council was to consider Ordinance No. 1536 on initial posting on October 15, 2026.
