- title: DDA micro-grants for downtown businesses
  summary: The DDA reviewed final reports and approved reimbursements for 2026 micro-grant recipients including High Folks ($4,731), Mountain View Studio ($5,000), Woodland Capital ($4,785) and Aspen Leaf Enterprises ($5,000). Board members also discussed a TIF reimbursement for Taylor Mountain Enterprises.
