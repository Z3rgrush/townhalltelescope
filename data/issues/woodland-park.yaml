- title: Main Street programs and AARP/DOLA grants
  summary: Main Street is applying for a $2,500 AARP livability grant (deadline Aug 28), with Antler Alley as a proposed project, and may use DOLA matching mini-grants. It is also planning a Shop & Dine Passport starting Sept 1 and Oktoberfest participation, and will ask to present to City Council on November 5.
