- title: Downtown Development Authority 2027 budget and micro-grants
  summary: The DDA reviewed its 2026 micro-grant program (about $197,517 total, with final reports approved for several businesses) and discussed its 2027 budget. The flower budget line may drop from $250,000 to $50,000, and a downtown walkability study, holiday promotion and 2027 grants were discussed. The board will see the budget in October, and a member noted City Council may dissolve the DDA.
