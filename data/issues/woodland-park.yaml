- title: Downtown Development Authority 2027 budget and micro-grants
  summary: 'The DDA reviewed its 2027 budget, including $275,000 for TIF agreements (increased for the TAVA TIF agreement), $200,000 for micro-grants and $50,000 for beautification. It also reviewed micro-grant final reports: about $48,337 paid so far, $175,000 expected by year-end, and a move to one grant per applicant going forward.'
  where: Downtown Woodland Park
