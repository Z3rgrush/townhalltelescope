- title: DDA micro-grant program for downtown businesses
  summary: DDA staff reported about $48,337 in micro-grants paid out so far, with $30,000 more up for approval and about $175,000 expected by year-end. Two recipients withdrew. One applicant received two grants this year, but going forward the limit will be one grant per applicant.
