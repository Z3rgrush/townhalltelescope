- title: '"Public Safety Facilities" added to the Unified Development Code'
  summary: The city is amending the Unified Development Code to create a new use type, "Public Safety Facilities," to be handled under the Special Use Permit process and defined in the code. The Planning Commission discussed it in September and October, and Council held a hearing on Ordinance 1536 on November 5.
