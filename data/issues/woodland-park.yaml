- title: 2027 budget and DDA spending plans
  summary: The Downtown Development Authority discussed its 2027 budget, including cutting the flower budget line from $250,000 to about $50,000, a downtown walkability study, and the Baggage building in Bergstrom Park. The 2026 micro-grant program has approved about 40 applications, up from 30 in 2025, with $197,516.87 in total grants. The City Council also had a 2027 budget presentation scheduled for October 15.
