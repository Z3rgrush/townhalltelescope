- title: Eagle Fire Lodge rezoning and multi-family conditional use permit
  summary: Cedarwood Development, for owner Woodland Capital, asks to rezone 777 E. US Highway 24 from Planned Unit Development to Multi Dwelling Urban Residential and to get a Conditional Use Permit for multi-dwelling housing. The Planning Commission hearing is Oct. 8, with a City Council hearing to follow.
