- title: Unified Development Code change for Public Safety Facilities
  summary: The city is amending the Unified Development Code to add Public Safety Facilities as a use under the Special Use Permit process and define the term. The Planning Commission considered it in September and October, and Council had Ordinance No. 1536 up for a public hearing on Nov. 5.
