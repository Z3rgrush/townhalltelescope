- title: 'Historic preservation projects: Junction House, Templeton Cemetery and Bergstrom Park'
  summary: The Historical Preservation Committee tracks active projects including the Junction House/Roberts House grant, where city staff said Brownfields grants can fund planning services, the Templeton Cemetery restoration plan, a preservation plan, and Bergstrom Park Reimagined. Council said the Bergstrom design is already agreed. The committee is also preparing its 2027 work plan and budget.
