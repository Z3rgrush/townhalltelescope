  summary: 'Cedarwood Development requested rezoning of Lot 3R, Block 3, C.D. Weaver #1A Subdivision from PUD to Multiple Dwelling Urban Residential, plus a conditional use permit for multi-household attached dwellings. The Planning Commission held a hearing on Oct. 8, and Council saw Ordinances 1539 and 1540 on initial posting with hearings set for Nov. 19, 2026.'
