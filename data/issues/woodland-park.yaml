- title: Appeal of dangerous building order at 209 E. Midland Avenue
  summary: Owner Andrew Nguyen appealed a Notice and Order and Notice to Vacate for the long-vacant building. His representatives said the 60-day permit deadline is unworkable, citing a contractor bankruptcy and plan review and construction timelines. The building has also been recommended for Local Historic Landmark designation.
