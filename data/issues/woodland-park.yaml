- title: 2027 budget for the city and the Downtown Development Authority
  summary: The DDA board reviewed its 2027 budget, with projected 2027 expenditures of about $1.74 million against $1.19 million in revenue. Line items include $50,000 for beautification, $275,000 for TIF agreements (raised for the TAVA agreement) and $200,000 for micro-grants. The DDA resolution recommends approval to City Council, and the city's 2027 budget was on the November 5 Council agenda with public comment allowed.
