- title: Temporary moratorium on residential development applications
  summary: City Council took up Ordinance No. 1541 on initial posting, which would temporarily halt submission, acceptance, processing and approval of development, zoning and land use applications for residential development in the city. A public hearing was set for November 19, 2026.
