- title: New 'Public Safety Facilities' use in the Unified Development Code
  summary: The city is amending the Unified Development Code to add and define 'Public Safety Facilities' as a use allowed through the Special Use Permit process. The Planning Commission discussed it in September and October, and Council was to consider Ordinance No. 1536 on initial posting Oct. 15.
