- title: Calls for police accountability after DeAndre Hill's death
  summary: Family members and supporters of DeAndre Hill, who was killed by Wichita police in January, returned to the council in August and October asking for accountability and changes to police use of force. The city attorney said a claim over the case is pending.
  refs: [2, 3, 19, 20]
  public_comment: true
- title: Homelessness, camping rules and cooling centers
  summary: Unhoused residents and advocates spoke week after week about criminalizing camping, housing and the Chapin Park encampment. During a heat wave the council pressed staff to put outreach workers at cooling stations, and the city later took up a federal grant for youth street outreach and housing navigation and $1.6 million from its Affordable Housing Fund.
  refs: [3, 5, 7, 10, 11, 13, 16, 19]
  public_comment: true
- title: 2027 budget above the revenue-neutral rate
  summary: Wichita took public comment on its proposed 2027 budget and 2027–2036 capital plan through August, then held hearings on exceeding the revenue-neutral property tax rate for the city and the downtown improvement district. Residents objected to spending such as a $12 million bike bridge while employee benefits were trimmed.
  refs: [2, 6, 8, 9, 11]
  public_comment: true
- title: Downtown Wichita Action Plan 2035
  summary: The council considered adopting the Downtown Wichita Action Plan 2035 as part of the Wichita–Sedgwick County comprehensive plan, along with extending interim controls for Crown Uptown.
  where: Downtown Wichita
  refs: [6]
- title: Event permits and street closures downtown
  summary: Owners of businesses on North St. Francis and the Wichita Chinese Association objected to how the city permits festivals and street closures, saying events like Somewhere Fest hurt their businesses. The city manager said an appeal was underway.
  where: 221 N St Francis St
  refs: [7, 13]
  public_comment: true
- title: USD 259 school bond proposal
  summary: Wichita Public Schools' superintendent briefed the council on a new school bond proposal after the February 2025 bond and a March city sales tax both failed, and residents spoke for and against it.
  refs: [17, 18]
  public_comment: true
- title: Ending the Kansas Sports Hall of Fame lease
  summary: The council considered terminating the lease at 515 S. Wichita, where the Kansas Sports Hall of Fame struggled with revenue, while letting already scheduled events go on.
  where: 515 S Wichita St
  refs: [12, 13]
- title: Business park TIF district on Kellogg
  summary: The council took up setting a December 1 hearing on a tax increment financing district and redevelopment plan for a business park on Kellogg.
  refs: [17]
- title: Bonds for Wesley Medical Center, the African American Museum and others
  summary: Wichita held hearings on letters of intent for industrial revenue bonds for Wesley Medical Center, MTW Properties and the Kansas African American Museum, and on economic development tax exemptions.
  refs: [2, 14, 15, 17]
- title: Rebuilding the Access Advisory Board
  summary: An ordinance to reestablish the Access Advisory Board on disability access came before the council in August and again in October.
  refs: [4, 15]
- title: Airport flooding after record rain
  summary: After about 10 inches of overnight rain flooded an underground electrical vault at Eisenhower National Airport, the council ratified an emergency purchase of replacement airfield equipment.
  where: Wichita Dwight D. Eisenhower National Airport
  refs: [1]
- title: Stormwater, water mains and new subdivision improvements
  summary: A resident warned that aging storm drains are causing street flooding, and the council took up funding for 2027 water and sewer main work, a concrete water pipe agreement and many petitions for water, sewer, drainage and paving in new additions such as Rivington, Greenwich Heights and Kabbaz.
  refs: [9, 10, 14, 15, 17, 19, 20]
  public_comment: true
- title: Redbud Trail and 21st Street projects
  summary: Wichita considered funding and a donation for phase 2 of the Redbud Trail from Woodlawn to K-96 and traffic signal technology along 21st Street North.
  refs: [10, 12]
- title: Rezonings and Delano design reviews
  summary: The council handled rezonings including 6801 E. Kellogg and appeals of Delano Neighborhood Overlay design review decisions.
  refs: [2, 6, 8, 10, 20]
