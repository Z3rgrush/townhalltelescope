- title: Downtown Master Plan, Turkey Creek flooding and building scale
  summary: Merriam's downtown plan weighed three visions for how much to build, with a 471-response survey showing 49% support for downtown housing; the Turkey Creek floodplain, creek ownership and costly flood control dominate the debate, and a resident criticized the cost estimates.
  where: Downtown Merriam / Merriam Dr & Turkey Creek
  refs: [3, 5, 6, 7, 9]
  public_comment: true
- title: Possible downtown sales tax ballot question
  summary: After survey respondents favored a quarter-cent sales tax for downtown improvements, the council discussed putting a downtown sales tax on the ballot.
  where: Downtown Merriam
  refs: [5, 7, 9]
- title: 1% for Art ordinance on new development
  summary: Council worked on an ordinance requiring commercial and apartment projects over $1 million to install public art or pay into a public art fund, with affordable housing exempt.
  refs: [1, 8]
- title: New public art at the Butterfly Garden
  summary: The public art committee picked finalists and heard artist presentations for a new piece near the Butterfly Garden, and discussed future sites like Brown Park and a long-sought bridge over Shawnee Mission Parkway.
  refs: [2, 8]
- title: IKEA parking garage removal
  summary: Planners reviewed IKEA's request to tear down its aging 65,000 square foot parking structure at 6000 IKEA Way.
  where: 6000 IKEA Way
  refs: [0]
- title: Massage therapy licensing rules
  summary: The council amended city rules on massage therapy businesses over two readings.
  refs: [6, 9]
- title: Shawnee Creek channel work and capital plan
  summary: Merriam hired Olsson to design the Shawnee Creek channel project, and planners found the 2026-2031 capital improvement plan consistent with the comprehensive plan.
  refs: [4, 9]
- title: Adopting 2024 fire and building codes
  summary: The council considered ordinances adopting the 2024 international fire and building codes.
