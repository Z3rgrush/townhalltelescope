  public_comment: true
- title: Cemetery forms, expansion and cleanup
  summary: The Town reviewed new cemetery forms, including a contract replacing the old deed, an open/close request, a monument application and a transfer request. Officials discussed opening a new section for plot sales, possibly a non-resident section at market value, extending the access road, cleanup logistics and the cemetery gate.
  where: Silver Plume cemetery
