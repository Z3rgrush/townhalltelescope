- title: Camping ordinance for Silver Plume town limits
  summary: Camping within town limits is not defined in the Land Use Code (Ordinance 340) as allowed or prohibited. A resident asked for an ordinance after reports of overnight activity near an apartment building, with people looking for bathrooms and residents feeling unsafe. Staff will gather model ordinances, and a public hearing on a camping ordinance is on the Sept. 14 agenda.
  where: Townwide
  refs:
