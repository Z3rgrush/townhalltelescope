  - 3
  public_comment: true
- title: 2027 budget and water and sewer rate increases
  summary: The Budget Committee began 2027 budget work in August, with work sessions on Sept. 5 and Oct. 3 and a proposed budget on the table. The preliminary budget is due to the Board by October and the final by Dec. 31, 2026. Staff say water and sewer rates will need to rise because those fees have not increased in many years.
  where: Townwide
