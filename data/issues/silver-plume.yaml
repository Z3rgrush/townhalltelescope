- title: Main Street sidewalk concerns
  summary: A resident raised problems with the sidewalks on Main Street between Jefferson and Silver Street, including a dumpster along the sidewalk. Sidewalk work is on the Town's priority list but comes after a water treatment tank repair, and the Road and Bridge committee is to discuss it.
  where: Main Street between Jefferson and Silver Street
