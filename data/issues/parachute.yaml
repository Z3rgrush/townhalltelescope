- title: Highway 6 and 1st Street "Parachute Moves" reconstruction project
  summary: Council backed multiple grant applications for the Highway 6 and 1st Street mobility, revitalization, reconstruction and safety project, including a USDOT BUILD grant, congressionally directed spending, and HUD funding. The town was later noted as recipient of a $600,000 CDBG grant for the 1st Street project, and committed local match dollars to a federal grant in October.
