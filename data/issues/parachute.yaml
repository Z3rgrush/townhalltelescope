- title: Data center regulations (Ordinance 838-2026)
  summary: The Town Council has a public hearing on Ordinance No. 838-2026 on Oct. 15, 2026. It would amend Title 15 of the municipal code to regulate data centers and technology uses. The agenda lists a cover memo but the documents give no outcome.
