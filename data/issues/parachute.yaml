- title: Prop 123 expedited review for affordable housing (Ordinance 837-2026)
  summary: Council is considering Ordinance 837-2026, which adds Section 15.02.214 to the municipal code for expedited review of affordable housing under Prop 123. It also updates the land use review procedures chart, and the Planning Commission recommended approval.
