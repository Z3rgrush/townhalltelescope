- title: 1st Street / Highway 6 'Parachute Moves' reconstruction and grants
  summary: The town has applied for federal funds (USDOT BUILD, HUD, congressionally directed spending) for the Highway 6 and 1st Street mobility and safety project. It did not get the $6.4 million BUILD grant in 2026 but received a $600,000 DOLA CDBG grant, and plans to try again next year.
