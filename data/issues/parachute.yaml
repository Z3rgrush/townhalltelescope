- title: 2027 budget and new revenue ideas
  summary: Staff presented the 2027 draft budget in a September workshop and a public hearing on the budget is set for Oct. 15. The town needs more money for transit (PATS), wages and streets and is considering options such as a lodging fee, a tobacco tax, or sales tax ballot measures, some of which would need voter approval.
