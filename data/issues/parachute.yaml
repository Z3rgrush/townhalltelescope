- title: 'Water system: raw water tank, loan refinance and Stage 2 restrictions'
  summary: Council supported a DOLA grant for the raw water tank replacement and approved a loan amendment on the water enterprise loan with Alpine Bank (Ordinance 833-2026). Stage 2 water restrictions remained in place in May 2026. Council also celebrated the Shoshone instream flow agreement and later considered a resolution on the Glenwood Hot Springs Protection Act with a water consultant report.
