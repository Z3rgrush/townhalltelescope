- title: Prop 123 expedited review for affordable housing (Ordinance 837-2026)
  summary: The Council is considering a Title 15 amendment adding Section 15.02.214 to create expedited review for affordable housing under Prop 123 and updating the land use review procedures chart. The Planning Commission recommended approval. In July the council also heard a regional housing needs assessment from an Aspen analyst.
