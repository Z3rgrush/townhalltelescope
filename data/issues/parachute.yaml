- title: Parachute Area Transit System (PATS) funding
  summary: The town approved a service agreement with Glenwood Downtowner for transit operations, supported transit grant applications and approved a Flix Bus license agreement for a bus stop. The mayor and town manager planned to discuss PATS funding with the county commissioners on Oct. 5.
