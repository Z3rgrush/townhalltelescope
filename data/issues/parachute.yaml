- title: Data center regulations (Ordinance 838-2026)
  summary: Town Council is set to consider Ordinance No. 838-2026, which would amend Title 15 of the municipal code to regulate data centers and technology facilities. It was on the October 15, 2026 agenda with a cover memo; the documents do not state an outcome.
