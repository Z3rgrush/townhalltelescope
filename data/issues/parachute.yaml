- title: Parachute Area Transit System and bus service
  summary: Council approved a services agreement with Glenwood Downtowner for public transit operations and a license agreement with Flix Bus for a bus stop. It also supported a state transit grant application and a regional transit planning grant in June 2026. Riders can use the ridepats.com app.
