- title: 2026 and 2027 town budget
  summary: Council held a 2026 budget workshop in late 2025, including an employee benefits package assessment. A 2027 budget kickoff took place in September 2026, and the draft 2027 budget with a 2027-2031 capital improvement plan was presented October 15. Council also discussed sales tax ballot initiative options in February.
