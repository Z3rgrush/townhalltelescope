- title: 'Water system: raw water tank, loan refinance and Stage 2 restrictions'
  summary: Council backed a DOLA grant for the raw water tank replacement and approved an ordinance amending the water enterprise loan with Alpine Bank. Stage 2 water restrictions remained in place into summer, and public works began the Revelle Springs raw water line replacement.
