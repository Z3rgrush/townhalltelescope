- title: Florence Pioneer Museum trust termination and property conveyance at 100 East Front Street
  summary: Council passed Ordinance 11-2026 on first reading, authorizing the end of a 1964 trust agreement and conveyance of the property at 100 East Front Street, home of the Florence Pioneer Museum. The City Manager described the museum's history.
