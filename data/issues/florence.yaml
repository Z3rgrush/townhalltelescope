- title: Transfer of 100 East Front Street museum property and end of 1964 trust
  summary: Council held a public hearing and second reading of Ordinance 11-2026 to end a 1964 trust agreement and convey the property at 100 East Front Street to the museum that operates it. The museum would take on all maintenance, insurance, utilities, structural repairs and capital improvements. The property was originally conveyed to the City by the Fraternal Order of Eagles.
  where: 100 East Front Street
