- title: Volunteer firefighter personnel policy
  summary: Council considered Resolution 12-2026 establishing a volunteer firefighter personnel policy. The city recently hired several Florence Fire Protection District volunteers, and staff want their rights and responsibilities as firefighters respected while they work for the city.
