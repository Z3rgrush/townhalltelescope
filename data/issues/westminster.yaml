- title: Affordable housing definition, density bonus and down payment assistance
  summary: Council moved ordinances amending the 2040 Comprehensive Plan to add an affordable housing density bonus, a revised definition and parking provisions (Councillor's Bills 39 and 36). Staff also presented a proposed Down Payment Assistance Program offering up to 20 percent of the purchase price, with an RFP that closed Sept. 3. Other items included Housing LIFT agreements, right-of-first-refusal agreements for multifamily housing, and Proposition 123 expedited review policies.
