- title: 2027-2028 water, sewer and stormwater rates
  summary: Council reviewed rate recommendations built on the WATER Task Force report, with a follow-up on single-family residential water rates. A public hearing on 2027-2028 stormwater fee changes was set for September 14. Ordinances implementing water, sewer and reclaimed water rates (Bill 40) and stormwater fees (Bill 43) moved through readings from September to October.
