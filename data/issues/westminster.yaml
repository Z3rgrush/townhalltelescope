- title: Automated license plate readers (Flock cameras) discontinuation
  summary: Police presented on automated license plate readers at an October 5 study session. On October 26 Council considered Resolution No. 46 discontinuing the technology, and residents including Jessica Johnson spoke against Flock cameras, citing data retention, cybersecurity and privacy.
