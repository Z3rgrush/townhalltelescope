- title: Business tax modernization and online filing
  summary: Staff proposed requiring online filing and payment of business tax returns starting Jan. 1, 2027, with exceptions for taxpayers without internet. About 94 percent of 77,424 returns in 2025 were filed online. An ordinance moved through readings in September.
