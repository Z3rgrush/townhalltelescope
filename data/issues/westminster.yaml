- title: Data center zoning and neighboring-jurisdiction data centers
  summary: After Resolution No. 20 (July 27, 2026) backed an interpretation that data centers are a prohibited use in Westminster, Council held an Oct. 19 study session on writing stronger data center language into the Unified Development Code. Council also discussed concerns about water use and utility service for data centers proposed just outside city limits.
