- title: Event center moratorium and ordinance
  summary: Council enacted a six-month moratorium on new event centers in multi-tenant commercial developments or within 300 feet of residential areas due to impacts on public safety, water and sewer, parking and neighboring uses. Staff presented revised recommendations for Councillor's Bill No. 19 on October 5 after engaging operators.
  where: Citywide, commercial areas near residential
