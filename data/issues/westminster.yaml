- title: Data center regulation and neighboring-jurisdiction proposals
  summary: After Council adopted Resolution No. 20 on July 27, 2026 supporting a zoning interpretation that data centers are a prohibited land use, it held an October 19 study session on strengthening Unified Development Code language. Council also discussed concerns about data centers proposed just outside city limits, including water use and extraterritorial utility service.
  where: Citywide and adjacent jurisdictions
