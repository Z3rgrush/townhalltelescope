- title: Affordable housing definition, density bonus and down payment assistance
  summary: Council took up bills to amend the 2040 Comprehensive Plan with a density bonus and a new affordable housing definition, plus a parking change, passing second reading September 28. Staff also presented a proposed Down Payment Assistance program offering up to 20 percent of the purchase price, with a contractor being selected after the RFP closed September 3. Housing LIFT agreements with Maiker Housing Partners and Foothills Regional Housing were also updated.
