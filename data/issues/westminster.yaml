- title: 2027 city budget
  summary: Council reviewed the proposed 2027 budget, held a public hearing Sept. 14 and took second reading of the budget on Oct. 26. The charter requires adoption by Oct. 26. Related hearings covered the Westminster Economic Development Authority budget and the General Improvement District budgets and mill levies.
