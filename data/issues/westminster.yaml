- title: Automated license plate readers (Flock cameras) discontinued
  summary: Police presented on automated license plate readers at an Oct. 5 study session. On Oct. 26 Council took up Resolution No. 46 on discontinuing the technology, and residents spoke against Flock cameras citing data retention, cybersecurity and privacy.
