- title: Event center moratorium and new ordinance
  summary: Council enacted a six-month moratorium on new event centers in multi-tenant commercial developments or within 300 feet of residential areas, citing impacts on public safety, water and sewer, parking and traffic. Staff presented revised recommendations for Councillor's Bill No. 19 on Oct. 5 after meeting with operators.
