- title: Data center land use and neighboring-jurisdiction proposals
  summary: After Resolution No. 20 (July 27, 2026) supported a zoning interpretation treating data centers as a prohibited use in Westminster, Council asked for a study session on data centers proposed just outside city limits, with concerns about water use and extraterritorial utility service. Staff also plans stronger data center language in the Unified Development Code.
