- title: Automated license plate readers (Flock cameras) discontinued
  summary: Police presented on automated license plate readers on Oct. 5, and the Oct. 26 agenda includes Resolution No. 46 on discontinuing the technology. Residents spoke against Flock cameras, raising data retention, cybersecurity and privacy concerns.
