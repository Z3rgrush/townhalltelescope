- title: 'Economic development deals: Mi Pueblo, Digantara, Scratch Kitchen'
  summary: Council approved an economic development agreement with Mi Pueblo Market for adaptive reuse and one with Digantara U.S. over its location in the city. Council also considered an intergovernmental agreement supporting a Scratch Kitchen and food warehouse at 12450 Delaware Street. An executive session covered incentives for a restaurant prospect.
