- title: Event center moratorium and new ordinance
  summary: Council enacted a six-month moratorium on new event centers in multi-tenant commercial developments or within 300 feet of residential areas, citing impacts on public safety, water and sewer, parking, and neighboring businesses. Staff returned October 5 with a revised version of Councillor's Bill No. 19 after talking with operators.
