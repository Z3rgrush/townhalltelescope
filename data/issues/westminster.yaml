- title: Proposed 2027 budget
  summary: Staff presented the proposed 2027 budget, held a public hearing on September 14, and Council gave feedback at a September 21 study session. Charter requires adoption by October 26, and second readings were scheduled for that date. Related 2027 budgets for the Economic Development Authority and General Improvement Districts were heard October 12.
