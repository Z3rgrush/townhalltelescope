- title: Business tax filing moves online
  summary: Staff proposed an ordinance requiring online filing and payment of business tax returns starting Jan. 1, 2027, with an exception for those without internet. About 94 percent of the 77,424 returns filed in 2025 were already online. It does not affect resident taxpayers or tax revenue.
