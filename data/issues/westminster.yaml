- title: Event center moratorium and new regulations
  summary: Council imposed a six-month moratorium on new event centers in multi-tenant commercial areas or within 300 feet of residential uses, citing impacts on public safety, utilities, parking and neighboring businesses. Staff presented revised recommendations for Councillor's Bill No. 19 on Oct. 5.
  where: Commercial areas near residential districts
