- title: Affordable housing definition, density bonus and down payment assistance
  summary: Council took up bills amending the 2040 Comprehensive Plan and code to redefine affordable housing, add a density bonus and set a parking provision (first reading Sept. 14, second Sept. 28). Staff is also finalizing a contractor for a Down Payment Assistance program that would cover up to 20 percent of purchase price. Council adopted Proposition 123 expedited review policies for affordable projects (Resolution No. 45) and got updates on Housing LIFT agreements and right-of-first-refusal agreements with regional housing authorities.
