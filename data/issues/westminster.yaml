- title: Water, sewer and stormwater rates and fees
  summary: Council considered 2027 and 2028 single-family water rates, water, sewer and reclaimed water rates and fees (Councillor's Bill 40), and stormwater fee changes (Bills 43). It also revisited the non-residential roadway improvement fee.
