- title: Affordable housing density bonus, down payment assistance and Prop 123
  summary: Council took up a density bonus and revised affordable housing definition with a parking provision (Councillor's Bills 39 and 36), a proposed Down Payment Assistance Program offering up to 20 percent of purchase price, Housing LIFT agreements, and Proposition 123 expedited review policies. Rights of first refusal for multifamily housing were also assigned to regional housing partners.
