- title: Proposed 2027 budget
  summary: The proposed 2027 budget was presented August 24, had a public hearing September 14, and was reviewed by Council September 21. Council must adopt it by October 26, 2026. Related 2027 budgets for the Westminster Economic Development Authority (about $14.4 million in expenditures) and the city's general improvement districts had hearings October 12.
