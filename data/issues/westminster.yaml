- title: Business tax administration modernization
  summary: Staff proposed requiring online filing and payment of business tax returns starting January 1, 2027, letting the Finance Director set filing methods and allowing electronic notices. About 94 percent of the 77,424 returns filed in 2025 were already online. Resident taxpayers are not affected, and the ordinance moved through readings in September.
