- title: 2027 budget adoption
  summary: The proposed 2027 budget went through a Sept. 14 public hearing, a Sept. 21 study session for Council feedback, and second reading on Oct. 26. The charter requires adoption by Oct. 26. Related WEDA and General Improvement District 2027 budgets were heard Oct. 12.
