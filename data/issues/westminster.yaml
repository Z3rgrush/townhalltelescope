- title: Data center land use and water service to neighboring jurisdictions
  summary: After adopting Resolution No. 20 on July 27, 2026 supporting an interpretation that data centers are a prohibited use in Westminster, Council asked for a study session on the October 19 agenda. It covers data centers proposed just outside city limits, concerns about water use and extraterritorial utility service, and new data center language for the Unified Development Code.
