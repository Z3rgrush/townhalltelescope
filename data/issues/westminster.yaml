- title: Regional homelessness agreements and Navigation Center
  summary: Council considered intergovernmental agreements with Jefferson County and the cities of Arvada, Edgewater, Golden, Lakewood and Wheat Ridge on homelessness, including a Navigation Center in Lakewood. A resident urged Council to consider a navigation center closer to Westminster. Staff also gave a homelessness prevention and response update.
