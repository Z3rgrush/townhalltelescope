- title: Restricting city utility hookups for data centers
  summary: The Governing Body waived its four-month wait rule to take up an ordinance restricting city utility connections for data centers both inside and outside city limits, closing a path for staff to extend service to a data center by administrative exception.
  refs: [2]
  tags: [data-center]
- title: Compass Datacenters campus south of Topeka
  summary: Compass Datacenters and Evergy answered questions at a work session about a proposed hyperscale data center in Shawnee County just south of the city, covering water use and cooling, tax abatements, utility rate impacts and the need for public input sessions. No public comment was taken.
  where: Shawnee County, south of Topeka city limits
  refs: [5, 6]
  tags: [data-center]
- title: Airport authority's planned data center
  summary: The Metropolitan Topeka Airport Authority briefed the Governing Body on a data center it is planning, at the same meeting as an overview of island annexation.
  refs: [15]
  tags: [data-center]
- title: 2027 budget and exceeding the revenue-neutral tax rate
  summary: Topeka held hearings on a 2027 budget with a 37.126 mill levy, above its revenue-neutral rate, and on keeping the Topeka Metro transit levy at 4.2 mills. Residents spoke against raising taxes, and council members questioned the transit authority about electric buses, ridership and fares.
  refs: [7, 8, 11, 13]
  public_comment: true
- title: Utility rate increases for 2027 to 2030
  summary: After months of discussion the council took up an ordinance setting utility rates for 2027 through 2030 to fund operations and capital work. Residents objected, including one who asked that households and industrial customers pay the same rate.
  refs: [10, 11, 12]
  public_comment: true
- title: March 2027 vote on a sales tax for affordable housing and homelessness
  summary: After a housing study update and talks on future sales taxes, the council considered calling a March 2, 2027 special election on a 0.1% sales tax for an affordable housing trust fund and evidence-based homeless programs.
  refs: [11, 12, 13, 15, 16]
- title: Letting a city auditor report to the Governing Body
  summary: The council discussed a charter amendment, and a March 2027 mail ballot on it, that would let a city auditor report directly to the Governing Body instead of through the mayor and city manager.
  refs: [15, 16]
- title: Fire station relocation plan
  summary: The fire department presented a 2026 plan to relocate fire stations to cut response times and expand four-minute coverage across the city.
  refs: [11]
- title: Strings attached to economic development incentives
  summary: The economic development director presented community impact measures for city incentives, and council members asked to add local hiring and contractors, utility fee waivers for tax-credit housing and developers' track records.
  refs: [3, 4]
- title: Street and sidewalk projects
  summary: Topeka approved a Lyman Road sidewalk from Vail to Lane and 2027 pavement work on 6th/Fairlawn and Cypress/Sycamore/Rice, and took up design contracts for S. Kansas Avenue from 10th to 17th, SW 37th Street storm sewers and the Menninger Road realignment at Topeka Boulevard.
  refs: [1, 2, 9, 10, 14]
- title: 2027 social service and alcohol program grants
  summary: The council approved about $492,000 in 2027 social service grants after a senior center questioned its score, and took up $865,924 in special alcohol and drug program funding.
  refs: [9, 10, 15]
- title: Bonds for capital projects
  summary: Topeka issued $8.2 million in general obligation bonds and $5.3 million in temporary notes for capital and improvement district projects while keeping the debt service levy flat.
  refs: [3, 4]
