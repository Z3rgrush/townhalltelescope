- title: Data center moratorium (Ordinance 1037)
  summary: Council passed a 6-month moratorium on accepting or processing permit and land development applications that include a data center. The Land Use Development Code has no data center use class, and staff want time to watch development in Colorado and write rules. The moratorium would need renewal every 6 months to reach the two years Council asked for.
