- title: Traffic, parking and truck complaints near San Juan Alley and the library
  summary: A resident repeatedly told Council that truckers park overnight in the library lot, that the jake brake ordinance is not enforced, and that San Juan Alley is heavily used. Staff reviewed a speed dip on San Juan Alley between 8th and 10th streets and found it not recommended based on residential feedback. A traffic calming policy and ordinance is being drafted.
  where: San Juan Alley (8th to 10th Streets) and library parking lot
