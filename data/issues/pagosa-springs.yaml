- title: 'Parks: San Juan River Park, master plan and Yamaguchi bike park'
  summary: Council named the town-owned former Bob's LP/Basin Coop property at 1040 E US 160 "San Juan River Park." The parks master plan survey and facility inventory continue, Yamaguchi South Bike Park is under construction, and an astronomy shed proposal is under review. Staff also reported a Forest Legacy Program application.
