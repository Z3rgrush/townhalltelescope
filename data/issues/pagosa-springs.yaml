- title: Data center moratorium (Ordinance 1037)
  summary: Town Council held the second reading of Ordinance 1037, which pauses acceptance and processing of permit and land development applications that include a data center. Staff said the Land Use Development Code has no data center use classification and the pause lets them monitor development nationally and in Colorado while codifying one.
