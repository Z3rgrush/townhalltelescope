- title: San Juan Alley traffic calming and truck parking complaints
  summary: Staff said a speed dip on San Juan Alley between South 8th and 10th Streets was not recommended based on residential feedback, and a town-wide traffic calming policy is being drafted. Resident Eddie Archuleta repeatedly told Council about truckers parking in the library lot, heavy alley traffic and unenforced jake brake rules.
