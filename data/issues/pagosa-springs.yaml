- title: Ponderosa Mountain planned development (Ordinance 1042)
  summary: Modern Community Builders LLC seeks a planned development overlay, agreement and zoning change for a 70-acre project near Hwy 160 and Goldmine Drive, with commercial lodging, housing and deed-restricted workforce housing (90%-130% AMI) in three phases. It was continued from October 6 to a first reading on October 20, with a second reading as amended on the November 3 agenda; a resident asked for a development moratorium over infrastructure needs.
