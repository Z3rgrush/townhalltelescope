- title: Traffic, truck parking and calming on San Juan Alley
  summary: Resident Eddie Archuleta repeatedly told Council that truckers park overnight in the library lot, the jake brake ordinance is not enforced, and San Juan Alley sees heavy speeding traffic. Staff recommended against a speed dip on San Juan Alley between 8th and 10th Streets based on neighbor feedback and are drafting a traffic calming policy.
  where: San Juan Alley, library parking lot
