- title: Data center moratorium (Ordinance 1037)
  summary: Council took up Ordinance 1037 on second reading, a moratorium on accepting or processing permit and land development applications that include a data center. The Land Use Development Code has no data center use classification, and staff want time to codify one while watching data center development in Colorado and nationally.
