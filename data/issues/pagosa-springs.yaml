- title: Sanitation district sewer repairs and new wastewater treatment plant
  summary: The McCabe Creek sewer replacement on Florida Street is complete, and crews moved to Rosita Street manhole replacements. The district approved surge tank and pump purchases and applied for a $900,000 grant for the 1st Street lift station. It is also seeking an Owner's Advisor for the new wastewater treatment facility, with proposals due October 19 and an award slated for Nov. 3.
  where: McCabe Creek, Florida Street, Rosita Street, 1st Street lift station
