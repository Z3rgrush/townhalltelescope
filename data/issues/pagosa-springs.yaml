- title: 2027 budget, fee schedule and capital plan
  summary: Council adopted the 2027 budget with expenditures of $24,536,628 across seven funds, plus a fee schedule and a 5-year capital plan. The capital plan includes the community center roof, vehicles and park improvements. The property tax mill levy of 1.561 would generate $173,145. The sanitation district budget was presented separately.
