- title: Project 64 workforce housing and housing planning
  summary: Staff prepared talking points for Project 64 (formerly Project 102), where the Town won a bid to buy and renovate the property using grants and certificates of participation (COPs). Grants could lower the rents needed to cover the COP payment. The Town and County are also holding joint sessions on a Housing Action Plan, and Council considered an IGA on Proposition 123 shared affordable housing credits.
