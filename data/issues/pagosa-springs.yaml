- title: Main Street, highway reconstruction and downtown planning
  summary: With highway reconstruction nearing completion, Main Street is planning to update its Transformation Strategies, with possible DOLA funding, and to expand its board from 10 to 11 members. It also continues the Business Assistance Grant Fund closeout and a possible downtown coordinated hours pilot.
