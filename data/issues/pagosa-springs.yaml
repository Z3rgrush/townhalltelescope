- title: Dark sky Lighting Management Plan
  summary: The Dark Sky Steering Committee is drafting a Lighting Management Plan that is stricter than the current land use code. It would limit light post height and brightness at property lines and require lights out by 11 p.m., with no lighting on trails. Work sessions were scheduled in October, and a Lights Out Pagosa event was planned for August 12.
