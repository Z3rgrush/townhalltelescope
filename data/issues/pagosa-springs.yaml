- title: 2027 budget, fee schedule and capital plan
  summary: Council held a public hearing and adopted Resolution 2026-21 on Oct. 6, setting the 2027 budget across seven funds, with a mill levy of 1.561 expected to raise $173,145. The fee schedule has changes, and the 5-year capital plan includes the community center roof, vehicles and park improvements. The Sanitation district also took up its own 2027 budget and fee schedule.
