- title: Data center moratorium (Ordinance 1037)
  summary: Council passed a 6-month moratorium on accepting or processing permit and land development applications that include a data center, because the Land Use Development Code has no data center use classification. It must be extended every 6 months to reach the two years Council asked for, giving staff time to watch development statewide and codify rules. First reading was Aug 4 and second reading Aug 18.
