- title: Sewer system repairs, McCabe Creek project and new wastewater treatment plant
  summary: The Sanitation GID finished the McCabe Creek sewer replacement (Florida Street) and moved crews to Rosita Street manhole and line replacement. The district bought surge tanks and pumps, applied for a $900,000 grant for the 1st Street lift station, and is seeking an owner's advisor for the new Wastewater Treatment Facility, with an award expected Nov. 3, 2026. It follows the voter-approved sewer sales tax.
