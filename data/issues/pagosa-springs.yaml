- title: Dark sky Lighting Management Plan
  summary: The Dark Sky Steering Committee held a work session and review of a Lighting Management Plan that would exceed current Land Use Development Code lighting standards, with rules on light height, shielding, curfews and no flashing lights. Related events include reduced downtown lights for the Perseid meteor shower watch night and an astronomy shed proposal.
