- title: Talisman Drive area rezoning to Multi-unit Town Center (Ordinance 1040)
  summary: Council rezoned properties including Cornerstone Lofts Lot 6CX and Talisman Pointe units on Talisman, Eaton and Village Drives to Multi-unit Town Center. The Planning Commission recommended approval on August 25, and Council passed the second reading September 15.
