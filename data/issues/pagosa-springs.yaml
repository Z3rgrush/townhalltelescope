  summary: Modern Community Builders LLC applied for a 70-acre, three-phase planned development with commercial lodging, housing and deed-restricted workforce housing (90%-130% AMI). The Planning Commission reviewed the sketch plan in September, Council took first reading on Oct. 20 after continuing it from Oct. 6, and second reading, as amended, was scheduled for Nov. 3.
