- title: Sanitation district sewer and wastewater plant projects
  summary: The Sanitation General Improvement District is replacing broken sewer lines (McCabe Creek, Rosita Street), buying pumps and surge tanks, and moving ahead with a new wastewater treatment facility, with interviews of firms Oct 28-29. A $3 million loan for the 1st Street lift station was approved and a $900,000 grant was sought. Evolve Infrastructure Group was the only bidder for pump and surge tank installation.
  where: Townwide sewer system, 1st Street lift station
