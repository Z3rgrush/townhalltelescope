- title: 2027 budget, fee schedule and capital plan
  summary: Council and the Sanitation GID reviewed the FY27 budget in September and Council adopted Resolution 2026-21 on Oct 6 with a public hearing. It sets expenditures of $24,536,628 and expenses of $30,594,569 across seven funds, a 1.561 mill levy raising $173,145, fee schedule changes, and a 5-year capital plan including the community center roof, vehicles and park improvements. The GID budget and fee schedule (Resolution 2026-02) were also up for adoption.
