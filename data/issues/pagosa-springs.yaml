- title: Sewer system repairs and new wastewater treatment plant
  summary: The Sanitation district is finishing the McCabe Creek sewer replacement on Florida Street and moving to Rosita Street. It approved surge tank and pump purchases, applied for a $900,000 grant for the 1st Street lift station, and is seeking an owner's advisor for the new wastewater treatment facility, with an award expected Nov. 3. Sewer line replacements reduced infiltration by about 15%.
