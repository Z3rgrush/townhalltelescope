- title: Project 64 workforce housing and housing plans
  summary: Staff prepared talking points for Project 64 (formerly Project 102), where the Town won a grant-backed bid to buy and renovate the property and will use COPs financing. Grants could lower the rents needed to cover the payments. A Housing Action Plan was also on a joint Town/County agenda, and Council took up a Proposition 123 affordable housing credits agreement.
