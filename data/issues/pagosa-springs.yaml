- title: 2027 town and sanitation district budgets
  summary: Council adopted a 2027 budget with a 1.561 mill levy raising $173,145, a fee schedule and a 5-year capital plan including the community center roof, vehicles and park improvements. The sanitation district adopted a $6.06M budget with higher commercial sewer and connection fees and a .904 mill levy. Town sales tax receipts have come in below projections.
