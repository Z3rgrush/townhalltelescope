- title: G&I Sanitation trash franchise and rates
  summary: Council approved a five-year franchise for G&I Sanitation Services to run refuse collection using town streets and alleys, on first reading Sept 15 and second reading Oct 6. A public hearing on the company's proposed rates was also held, as the charter requires.
