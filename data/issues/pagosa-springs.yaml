- title: Cancelled July 4 fireworks rescheduled
  summary: The July 4 show was cancelled for extreme fire risk, but the Acme contract means the town forfeits $32,000 unless it holds a show in 2026. Council voted to shoot the fireworks during Old Fashion Christmas.
