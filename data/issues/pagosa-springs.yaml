- title: Data center moratorium (Ordinance 1037)
  summary: Town Council passed a 6-month moratorium on accepting or processing permit and land development applications that include a data center. The Land Use Development Code has no data center use classification, so staff will monitor development nationally and in Colorado. The moratorium would need renewal every 6 months, up to two years.
  where: Townwide
