- title: G&I Sanitation trash collection franchise (Ordinance 1039)
  summary: Council approved a five-year franchise for G&I Sanitation Services to run refuse collection in town, with performance standards and a possible future franchise fee. A public hearing on the company's proposed rates was also held. The second reading passed October 6.
