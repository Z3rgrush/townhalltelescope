- title: Kids Camp ending and parks plans
  summary: The Town will stop operating Kids Camp, which carried an annual subsidy of about $40,000, while talks continue with PCI about a summer program; families were notified. Parks staff are also working on the Parks and Recreation Master Plan, Yamaguchi South Bike Park, and tree planting grants.
