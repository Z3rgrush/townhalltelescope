- title: Data center discussions with Weld County
  summary: Town and recreation boards discussed a joint work session on a proposed data center in unincorporated Weld County, outside Windsor and Greeley. Concerns included electricity and water use, written comments were being accepted, and a public hearing was expected in a couple of months unless annexation came up first; the Town Board later described the discussion as productive and cordial.
  where: Unincorporated Weld County near Windsor
