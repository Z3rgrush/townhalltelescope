- title: 2027 water, sewer and stormwater rates and NISP costs
  summary: The Water and Sewer Board reviewed the Stantec 2027 rate study and forwarded a recommendation of approval of proposed utility rates to the Town Board. A member raised concerns about rising NISP costs, debt coverage and interest rates. The Town's share of the Glade Inlet Canal Diversion project is about 15%, and a $3M federal grant application could save Windsor roughly $450,000.
