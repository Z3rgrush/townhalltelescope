- title: 2027 budget, revenue shortfall and staffing requests
  summary: Staff presented 2027 revenue estimates, staffing requests and operations budget worksessions. Property tax declines mean general fund positions got heavy scrutiny; a Deputy Chief of Police, Deputy Town Attorney and Transportation Planner/Engineer are not recommended. Sales tax is split 67% general fund and 33% capital projects.
