- title: Proposed police shooting range
  summary: Budget follow-up documents discuss a police firearms range, with the Board limiting funding to $37,000 in 2027. Staff plan a first-quarter 2027 work session on location and design; the consultant noted the floodplain location limits building and the range could meet nearly all local firearms training needs.
