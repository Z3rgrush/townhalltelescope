- title: Crossroads/Colorado Blvd roundabout construction phasing
  summary: Contractor AB Underground asked to fully close Crossroads Boulevard east of Colorado Boulevard during Phase 2, saying the original plan to keep two-way traffic is too constrained and unsafe. The closure could speed the project and allow the NISP water casing to be installed in one operation; the Town Board reviewed it on Sept. 21.
