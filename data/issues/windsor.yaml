- title: Data center regulation and Weld County data center concerns
  summary: No data center is proposed in Windsor, but activity in unincorporated Weld County prompted a Town Board work session on August 3 about land use rules. Concerns are water and power use, noise and utility rates; Weld County requires closed-loop cooling. Written comments were being accepted and a Weld County hearing was expected in a couple of months.
