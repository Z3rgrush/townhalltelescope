- title: 2027 town budget and staffing requests
  summary: Staff are preparing a balanced 2027 budget with property tax, oil and gas revenues projected to decline. Requests for a Deputy Police Chief, Deputy Town Attorney and Transportation Planner/Engineer were not recommended, while two Police Lieutenants were requested. Board follow-up included $1.2M for LaBue Park design and $60,000 for a community project.
