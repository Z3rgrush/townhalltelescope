- title: 2027 utility rate increases for water, sewer and stormwater
  summary: Stantec's 2027 rate study was presented to the Water and Sewer Board (Oct 14) for a recommendation to the Town Board, then to the Town Board on Oct 26. The proposed plan includes a 20% sewer rate increase in 2027 and water increases of 12.5% annually through 2028, driven by the new wastewater treatment plant (about $154M Windsor share) and NISP costs.
