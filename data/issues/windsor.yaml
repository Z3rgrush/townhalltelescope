- title: Crossroads/Colorado Blvd. roundabout construction closure request
  summary: Contractor AB Underground asked the Town to fully close Crossroads Boulevard east of Colorado Boulevard during Phase 2, saying two-way traffic is too constrained in the work area. It says the change could speed the project and allow the NISP water casing to be installed in one operation. The Town Board took up the phasing plan at a Sept. 21 work session.
