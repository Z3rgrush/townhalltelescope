- title: 2027 water, sewer and stormwater rate increases
  summary: A Stantec rate study proposes a 20% sewer rate increase in 2027 and steep water increases through 2028. Drivers are the new wastewater treatment plant (about $154M Windsor share) and NISP water project debt. The Water and Sewer Board and Town Board reviewed it in October.
