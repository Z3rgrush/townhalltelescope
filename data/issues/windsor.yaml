- title: 2027 water, sewer and stormwater rate increases
  summary: Stantec's 2027 rate study proposes a 20% sewer increase in 2027 and 12.5% annual water increases through 2028, driven by the NISP water project and the new wastewater treatment plant (about $154M Windsor share). The Water and Sewer Board was asked to recommend the rates to the Town Board, which took them up Oct. 26.
