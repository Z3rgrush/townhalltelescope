- title: Crossroads/Colorado Blvd roundabout construction phasing
  summary: Contractor AB Underground asked to fully close Crossroads Boulevard east of Colorado Boulevard during Phase 2, saying two-way traffic is too constrained to build safely. The change could speed the project and allow NISP water casing installation in one operation, but it requires a detour. The Town Board reviewed it September 21.
