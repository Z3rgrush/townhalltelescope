- title: Open space purchase near the wastewater plant and Kodak
  summary: The Town bought roughly 70 acres (the Herman property) as open space, and another purchase of land with ditch water and four historic structures was under contract at a total of $6.2M ($3M water, $3.2M land). Funding comes from the Park Improvement Fund, to be reimbursed from the open space sales tax.
