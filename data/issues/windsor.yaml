- title: 2027 budget, staffing and revenue decline
  summary: Staff are preparing the 2027 budget with falling property tax and oil and gas revenue. Several positions, including Deputy Police Chief, Deputy Town Attorney and Transportation Planner/Engineer, are not recommended. Work sessions covered revenue estimates, staffing, capital projects and operations, with the general fund getting 67% of sales tax and capital 33%.
