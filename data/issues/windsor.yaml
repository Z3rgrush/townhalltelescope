- title: 2027 budget, staffing and shrinking property tax revenue
  summary: Staff are building the 2027 budget with lower projected revenue, including falling property taxes, and have not recommended positions such as a Deputy Police Chief, Deputy Town Attorney and Transportation Planner/Engineer. The Board reviewed staffing requests, capital projects and the operating budget, with sales tax split 67% general fund and 33% capital. The Board backed $1.2M for LaBue Park design and a wrap-up of revisions in November.
