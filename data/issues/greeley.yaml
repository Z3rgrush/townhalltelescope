- title: 2027 city budget, cuts and the budget retreat
  summary: The City Manager's recommended 2027 budget was released Sept. 4, discussed at a Sept. 11 council retreat, and had first reading Oct. 20. It rests on reductions, voluntary separations (67.75 FTE), a lagging sales tax and a temporary 25 percent cut to capital maintenance. The Citizen Budget Advisory Committee backed staff's work.
