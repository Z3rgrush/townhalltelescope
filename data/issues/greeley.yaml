- title: Flock Safety license plate readers and police drones
  summary: Residents repeatedly urged Council to end the Flock Safety ALPR contract, citing privacy, Fourth Amendment concerns, costs and no public vote. Council asked for a presentation, and a Sept 8 work session covered the police use of 17 Flock cameras with 30-day retention and the drones-as-first-responder program.
