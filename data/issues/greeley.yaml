- title: Sales tax ballot question 2F for West Greeley and Civic Campus projects
  summary: Council moved to put a 0.60% sales and use tax increase (Jan 1, 2027 through Dec 31, 2067) to fund capital projects on the Nov. 3, 2026 ballot as Question 2F, and later passed a resolution of support. Dozens of residents spoke Aug. 18 against combining the contentious Catalyst/West Greeley project with the civic campus, or against new taxes; a few supported a sales tax. Council also took legal advice in executive session and held first and second readings of Certificates of Participation financing for the Civic Campus.
  where: Citywide
