- title: Stormwater and water/sewer rates for 2027
  summary: The Stormwater Board recommended a 10% increase for 2027 after staff showed 20% and 4.5% scenarios, amid downtown and 12th Street outfall work. The Water and Sewer Board reviewed a budget supporting a 4.5% water and 3.0% sewer increase, with the F Street facility delayed to limit rate impacts.
