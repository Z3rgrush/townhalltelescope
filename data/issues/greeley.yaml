- title: MERGE highway project and transportation updates
  summary: The MERGE project (underpasses at 35th and 47th Avenues, roundabouts, property impacts) has over $50 million in federal grants plus state funds but still needs a substantial local share. Advisory boards also discussed US 34/WCR 17 crashes, 16th Street safety, the Safe Streets for All plan and a 13th Street quiet zone with eminent domain acquisitions; the Art Commission weighed up to $400,000 for MERGE public art.
