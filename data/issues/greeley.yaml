- title: MERGE highway project and 2027 capital plan
  summary: The roughly $204 million 2027 Capital Improvement Plan includes MERGE, backed by over $50 million in federal grants, state funds and anticipated TIFIA financing, but a substantial local share is still needed. The project proposes underpasses at 35th and 47th Avenues, roundabouts and property impacts, and the Art Commission is weighing up to $400,000 for public art. The plan also includes a temporary 25% cut in annual facility maintenance funding.
