- title: 2027 city budget, reductions and museum/culture cuts
  summary: The City Manager's recommended 2027 budget was released Sept. 4, reviewed at a Sept. 11 council retreat, and brought to first reading Oct. 20. Sales tax is down, reserves are tight, 67.75 positions were cut through voluntary separations, and departments face reduction targets. The Museum Board, Historic Preservation Commission and residents objected to museum cuts, and CPRD identified $2.9 million in reductions including UCCC fee increases.
