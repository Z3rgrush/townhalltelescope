- title: Flock license plate readers and police drones
  summary: Residents urged Council to end the Flock Safety contract for automated license plate readers, citing costs, lack of a public vote, Fourth Amendment concerns and misuse. Council held a Sept. 8 work session on ALPRs and Drones as First Responder; police use 17 Flock cameras with 30-day data retention.
