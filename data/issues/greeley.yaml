- title: 2027 budget cuts and the September 11 budget retreat
  summary: The City Manager's recommended 2027 budget came out September 4 and Council held a budget retreat September 11. It follows tiered department cuts and 67.75 FTE lost through voluntary separations. First reading of the budget was set for October 20. Culture, Parks and Recreation identified $2.9 million in reductions, leaving an $800,000 gap. Residents and advisory boards objected to cuts affecting museums and parks.
