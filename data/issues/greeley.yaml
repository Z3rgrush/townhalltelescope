- title: Civic Campus and Judicial Center redevelopment
  summary: Council took up lease-purchase Certificates of Participation to finance the Civic Campus, a metropolitan district for West Greeley Commons, and a vacation of a public alley near 10th Ave, 11th Ave, 9th St and 10th St. Planning Commission reviewed subdivisions for the Judicial Center and Civic Campus, with a temporary juror lot and a new City Hall planned.
