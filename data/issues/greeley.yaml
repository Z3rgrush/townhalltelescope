- title: Water and sewer rates, master plans and water supply
  summary: Staff proposed 4.5% water and 3.0% sewer rate increases for 2027, delaying the F Street Operations Facility to limit impacts. The board reviewed treatment plant and solids master plans and leases, and Council authorized legal action over the Halligan Water Supply Project Clean Water Act 401 certification. Parks cut watering at 13 sites after the Greeley-Loveland Ditch shut off early.
