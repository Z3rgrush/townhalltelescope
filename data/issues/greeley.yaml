- title: GlobalAI data center campus pre-annexation and interim water service
  summary: Global AI (Colorado) LLC bought about 438 acres east of Highway 257 (former Kodak/Carestream campus) and is evaluating a data center. Council considered a pre-annexation agreement requiring annexation by March 31, 2028, and the Water and Sewer Board approved an interim water service agreement tied to it. Water service under the current agreement expires March 31, 2027.
