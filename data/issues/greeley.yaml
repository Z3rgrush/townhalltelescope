- title: 'Global AI data center campus: pre-annexation agreement and interim water service'
  summary: Global AI (Colorado) LLC bought about 438.58 acres east of Highway 257 (the former Kodak/Carestream campus) and is evaluating a data center campus. Council agendas show a pre-annexation agreement requiring annexation by March 31, 2028. The Water and Sewer Board took up an interim water service agreement tied to it, replacing the existing water contract that expires March 31, 2027. Residents spoke against a data center over water contamination fears.
  where: East of State Highway 257, south of Eastman Park Drive
