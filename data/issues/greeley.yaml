- title: Downtown stormwater and 2027 water, sewer and stormwater rates
  summary: The Stormwater Board recommended an 8% rate increase for 2027 (options were 6%, 8% and 10%), prioritizing the Downtown Revitalization and 12th Street Outfall to reduce flooding. The Water and Sewer budget proposes a 4.5% water and 3.0% sewer rate increase, with the F Street Operations Facility delayed.
