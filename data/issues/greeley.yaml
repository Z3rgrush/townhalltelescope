- title: MERGE highway project and transportation projects
  summary: The MERGE project, with over $50 million in federal grants plus state funds, would build underpasses at 35th and 47th Avenues, with significant property impacts. Staff also updated on the Keep Greeley Moving tax, US 34 safety, 16th Street, 13th Street quiet zone (eminent domain) and the Sheep Draw Trail underpass.
