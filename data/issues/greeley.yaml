- title: Sales tax ballot question 2F and the Catalyst/Cascadia project debt
  summary: Council backed Ballot Question 2F, a 0.60% sales and use tax increase for capital projects on the Nov. 3 ballot. Many residents objected to the tax, to tying it to the Catalyst project and the Civic Campus, and to debt tied to earlier projects. Council also held executive sessions on the tax and on economic development including Catalyst.
