- title: West Greeley / Catalyst (Cascadia) project
  summary: Residents criticized the Catalyst/Cascadia project debt, called for a public vote, and questioned the timing of financial decisions. The West Greeley Citizen Oversight Committee was to discuss whether Greeley should keep pursuing the project without a known financial partner. The first West Greeley debt payment appears in the 2027 capital plan, and a Metropolitan District service plan for West Greeley Commons was on a council agenda.
