- title: Civic Campus financing and development
  summary: Council considered certificates of participation to finance the Civic Campus with its amenities and public improvements. The Planning Commission reviewed preliminary subdivisions for the Judicial Center and the 4-lot Civic Campus downtown. Redevelopment begins with a temporary juror parking lot while the new City Hall is built. The Judicial Center alley vacation was also on council agendas.
