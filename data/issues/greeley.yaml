- title: Artificial turf and front-yard landscaping rules
  summary: Council considered letting residents install artificial turf in single-family front yards by permit with licensed installers. Members split on stormwater, heat and water conservation. Staff were to refine the draft, and a resident spoke on the issue. Staff also discussed landscaping code compliance, with 66 cases opened through June.
