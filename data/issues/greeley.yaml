- title: MERGE highway project and transportation safety
  summary: The MERGE project (underpasses at 35th and 47th Avenues, roundabouts, over $50 million in federal grants) continues in design with significant property impacts, and a public art budget of up to $400,000 was proposed. The transportation committee also raised 16th Street speed transitions, crashes at US 34 and County Road 17, and the Safe Streets for All plan.
