- title: 2027 city budget, cuts and museum funding
  summary: The City Manager's recommended 2027 budget (released Sept 4) followed a Sept 11 council retreat, with first reading Oct 20. It includes cuts, vacant positions eliminated and voluntary separations (67.75 FTE), a 25% reduction in capital maintenance, and proposed reductions to museum and Civic Center budgets. The Museum Board and Historic Preservation Commission objected to museum cuts, and residents raised budget concerns. A later note says $150,000 extra was added for CPRD museum funding.
