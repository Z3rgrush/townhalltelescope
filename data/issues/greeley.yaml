- title: 'Housing: federal funding cycle, Prop 123 and needs assessment'
  summary: The Housing for All Advisory Board reviewed the first CDBG and HOME funding cycle, with Council making no changes to the 2026 Annual Action Plan. Staff warned that unspent HUD funds hurt the city's entitlement award. Council was asked to approve a Housing Needs Assessment contract and a Proposition 123 affordable housing commitment.
