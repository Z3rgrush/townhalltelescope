- title: 'Ballot Question 2F: sales tax increase for West Greeley and Civic Campus'
  summary: Council moved to put a 0.60% sales and use tax increase (2027 through 2067) to fund capital projects on the November 3, 2026 ballot, and later passed a resolution supporting Question 2F. It was discussed in executive session for legal advice. The tax is tied to the West Greeley and Civic Campus projects. Many residents spoke against combining the tax with contested projects, while some supported a dedicated sales tax.
