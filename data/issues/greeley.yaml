- title: 'Water supply: Upper Laramie groundwater application and Halligan 401 lawsuit'
  summary: The Water and Sewer Board approved filing a Water Court application with the State Land Board for nontributary Upper Laramie groundwater in Weld County, about 1.1 million acre-feet. Council also authorized legal action over the Halligan Water Supply Project Clean Water Act Section 401 certification. Parks are cutting watering at 13 sites after the Greeley-Loveland ditch shut off early.
