- title: Flock license plate readers and police drones
  summary: Residents asked Council to end the Flock Safety contract for license plate readers, citing no public vote, cost, misuse and Fourth Amendment concerns. A Sept. 8 work session covered the police use of ALPRs (17 Flock cameras with 30-day retention) and drones as first responders.
