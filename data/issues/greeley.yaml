- title: Arroyos del Sol annexation and zoning
  summary: The Planning Commission heard the roughly 999.72-acre annexation northwest of Highway 257 Spur, west of Weld County Road 19 and south of the Cache la Poudre River, and recommended approval to Council. Zoning was set to the conservation district, with much of the land under a conservation easement and a master plan focused on public recreation.
