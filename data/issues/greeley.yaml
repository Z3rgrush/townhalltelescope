- title: Greeley History Museum cuts and staffing
  summary: Proposed museum budget cuts would leave services staffed minimally, with the research assistant role at risk and possible closure to the public or appointment-only access. The Museum Advisory Board and the Historic Preservation Commission wrote to Council, and a former employee cited open-records requests. The recommended budget later added $150,000 for CPRD for museum funding.
