- title: Water supply, rate increases and park watering cutbacks
  summary: Staff proposed 4.5% water and 3.0% sewer rate increases for 2027 and delayed the F Street facility to limit rate impacts. The Greeley-Loveland ditch shut off early, so parks cut watering at passive sites and golf expects tough restrictions. Council also authorized legal action over the Halligan Water Supply Project Clean Water Act certification.
