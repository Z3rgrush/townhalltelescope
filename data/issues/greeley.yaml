- title: 'Global AI data center campus: pre-annexation agreement and interim water service'
  summary: Global AI (Colorado) LLC bought about 438 acres east of Highway 257 (the former Kodak/Carestream campus) and is evaluating a data center there. Council's Sept. 8 agenda had a Pre-Annexation Agreement requiring annexation by March 31, 2028, and the Water & Sewer Board took up a bridging interim water service agreement. Residents spoke against the AI data center and asked for a moratorium.
  where: East of State Highway 257, south of Eastman Park Drive, Weld County
