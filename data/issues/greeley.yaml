- title: Museum and cultural budget cuts
  summary: Proposed cuts to the Culture, Parks and Recreation Department would reduce museum staffing and research access. The Museum Advisory Board, which passed a resolution, and the Historic Preservation Commission, drafting a letter to Council, objected. The budget later includes $150,000 added for museum part-time staff. Residents also objected to cuts to natural areas and the Union Colony Civic Center.
