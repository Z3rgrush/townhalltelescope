- title: GlobalAI pre-annexation agreement and interim water service for data center campus
  summary: Global AI (Colorado) LLC bought about 438 acres near Highway 257 and Eastman Park Drive (former Kodak/Carestream campus) and is evaluating a data center campus. A pre-annexation agreement requires annexation by March 31, 2028, and the Water and Sewer Board considered an interim water service agreement tied to it, bridging the existing agreement that expires March 31, 2027.
