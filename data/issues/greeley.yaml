- title: Ballot measure for 0.60% sales tax for West Greeley and Civic Campus (Question 2F)
  summary: Council moved to send voters a 0.60% sales and use tax increase (Jan 2027 through 2067) to fund capital projects tied to the West Greeley (Catalyst/Cascadia) and Civic Campus projects. Dozens of residents spoke against combining the projects with a tax, others supported a dedicated sales tax. Council reviewed legal advice in executive session and on Oct 6 considered a resolution supporting Question 2F on the Nov 3 ballot.
