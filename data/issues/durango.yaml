- title: 2027 city budget and appropriations
  summary: Council is taking up the City Manager's proposed 2027 budget, with a public hearing and introduction of the operating and capital appropriation ordinances. It also considers amending the 2026 capital budget and the city's investment policy, and a budget reconciliation session is scheduled.
