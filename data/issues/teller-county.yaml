- title: Road funding and Victor water pipe leak
  summary: Commissioners discussed state Initiative 175 and House Bill 260, which would require highway funds to go to roads, and the effect of state budget cuts. They also reported on the Victor water pipe leak that left the city without water, which has been fixed while Victor seeks grants.
