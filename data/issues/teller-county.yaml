- title: Stage II to Stage I fire ban
  summary: With fire season ongoing, the Board considered a resolution moving the county from a Stage II fire ban to a Stage I ban, and ratified it on Sept. 10. Earlier discussion noted Stage II remained in effect and water rights were being called due to low river flows.
