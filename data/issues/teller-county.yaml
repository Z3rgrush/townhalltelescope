- title: Lot line adjustments in Ranch Resorts and Highland Meadows
  summary: Staff recommended approval of two amended final plats. One adjusts the lot line between Lots 21 and 22 of Ranch Resorts of Colorado Subdivision No. 2 and creates a utility easement for power. The other adjusts the line between Lots 3 and 4 of Highland Meadows Filing 1, on Floresta Drive and Floresta Place, to resolve encroachments.
