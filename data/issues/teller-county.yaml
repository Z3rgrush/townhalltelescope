- title: Cripple Creek & Victor Gold Mine Development Plan Amendment 14
  summary: Staff recommended approval with conditions of Amendment 14 to the Cresson Project mine plan, which covers an employee parking lot along County Road 821 and a temporary access road in Grassy Valley. The state DRMS conditionally approved it Oct. 1, 2025, and county approval is still required. Commissioners discussed it in a work session Oct. 27 and a resolution was on the Nov. 12 agenda; public comment is included in the packet.
