- title: Quantum Tech compliance agreement over revoked permit at 10180 West
  summary: The Planning Commission revoked a 1995 conditional use permit for a construction storage yard on Quantum Tech's property on May 12, 2026, and the Board of Adjustment took up the matter on July 9. A compliance agreement gives Quantum 90 days to remove the non-permitted operations while office use continues, and any future permit would need a new application. The commissioners were asked to approve it Sept. 2 and ratify it Sept. 10.
  where: 10180 West (Quantum Tech property)
