- title: Building code and contractor licensing changes
  summary: A work session on Aug. 25 covered proposed changes to the Teller County building code and contractor licensing. Proposals include license categories and fees for septic (OWTS) installers, cleaners and maintenance contractors, with annual fees of $50 to $150.
