- title: 'Lot line adjustments: Moore/Corporate Wellness and Pollock-Kenyon'
  summary: Commissioners reviewed two amended final plats with staff recommending approval. One adjusts the line between Lots 21 and 22 in Ranch Resorts of Colorado Subdivision No. 2 to extend power. The other adjusts the line between Lots 3 and 4 in Highland Meadows Filing 1, where a residence encroached.
