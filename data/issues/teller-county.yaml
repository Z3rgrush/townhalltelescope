- title: 2027 county budget and 2026 budget amendments
  summary: Commissioners held budget work sessions, including capital plan and financial strategic planning, and received the 2027 proposed budget presentation on Oct. 8. They also amended the 2026 General, Jail, Road and Bridge, and Social Services fund budgets, including monthly moves from holding departments as personnel needs change.
