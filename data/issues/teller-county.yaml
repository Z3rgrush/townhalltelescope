- title: Cripple Creek & Victor mine Amendment 14
  summary: Commissioners were to discuss on Oct. 27 a Mining Development Plan modification, Amendment 14, for the CC&V gold mine. It includes a proposed employee parking lot along County Road 821 and a temporary access road in Grassy Valley. Staff recommends approval with conditions. The state approved it Oct. 1, 2025 with a condition tied to a process water event investigation. County approval is still required and public comments are in the packet.
  where: Cripple Creek Mining Overlay District, County Road 821 and Grassy Valley
