- title: Ordinance 23 regulating short-term rentals in unincorporated Teller County
  summary: The commissioners held a first reading of Ordinance 23 on Aug 6 and scheduled a second reading on Sept 10. On Sept 24 they were to ratify an agreement with Neumo Group, LLC to administer short-term rental taxes and licenses. Residents raised concerns about STRs in the Four Mile area, including STR owners joining HOA boards.
