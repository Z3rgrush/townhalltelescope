- title: Victor water pipe leak and road funding (Initiative 175)
  summary: A water pipe leak left the City of Victor without water. It has been fixed and the city is looking for grants. Commissioners also discussed Initiative 175 and House Bill 260, which would require highway funds to go to roads and bridges, and a possible state ballot measure on TABOR surplus.
