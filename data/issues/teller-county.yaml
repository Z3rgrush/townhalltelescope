- title: Changes to Teller County building code and contractor licensing
  summary: A work session on Aug 25 covered proposed changes to the county building code. These include contractor license categories and annual fees, such as $50 for some licenses and $150 for OWTS cleaner and NAWT contractors. Rules for septic (OWTS) contractors are included.
