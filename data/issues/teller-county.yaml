- title: Quantum Tech compliance agreement for 10180 West property
  summary: The Planning Commission revoked a 1995 conditional use permit for a construction storage yard on May 12, 2026, and the Board of Adjustment took up the matter on July 9. Under a compliance agreement, Quantum Tech has 90 days to remove the non-permitted operations while keeping office use, and any future permit would need a new application. The commissioners were to approve it on Sept 2 and ratify it on Sept 10.
