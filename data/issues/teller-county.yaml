- title: Cripple Creek & Victor Gold Mining Amendment 14
  summary: Commissioners held a work session on Oct. 27 about the mine's Mining Development Plan Amendment 14. It covers a proposed employee parking lot along County Road 821 and a temporary unpaved access road built in Grassy Valley. State regulators conditionally approved it on Oct. 1, 2025, and county staff recommend approval with conditions. Public comments are included in the packet.
