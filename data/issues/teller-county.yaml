- title: Rosemont Reservoir variance and public health programs
  summary: A board meeting included a discussion of a variance for Rosemont Reservoir. Public health staff reported on a rise in suicides among men aged 45-65, the rural health grant, an emergency oxygen program, and reflective address signs for emergency response. The board also discussed the new Tamale Act and childcare facilities needing special use permits.
  where: Rosemont Reservoir; Countywide
