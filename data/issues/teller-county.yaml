- title: 2026 budget amendments and 2027 proposed budget
  summary: Commissioners held budget work sessions in August, September and November, including capital planning and strategic planning. They were to hear the 2027 proposed budget on Oct. 8. They also moved to amend the 2026 General, Jail, Road and Bridge, and Social Services fund budgets, including on Oct. 22.
