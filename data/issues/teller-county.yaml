- title: Quantum Tech compliance agreement for 10180 West property
  summary: The county Planning Commission revoked a 1995 conditional use permit for a construction storage yard on May 12, 2026, and the Board of Adjustment took up the matter July 9. A compliance agreement gives Quantum Tech, LLC 90 days to remove non-permitted operations while keeping office use. Any future permit would require a new application. Commissioners were to ratify the agreement Sept. 10.
