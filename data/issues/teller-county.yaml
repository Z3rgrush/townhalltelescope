- title: Public health, childcare facility rules and emergency programs
  summary: Public health staff reported a rise in suicides among men ages 45 to 64 and updates on the Rural Health Transformation Grant and a non-emergent oxygen program. Reflective address signs were funded by grant. The board also discussed childcare facilities and Special Use Permits, and said some recent public information on the regulations was inaccurate.
