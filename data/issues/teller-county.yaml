- title: Quantum Tech compliance agreement for revoked permit at 10180 West
  summary: After the Planning Commission revoked Quantum Tech's 1995 conditional use permit for a construction storage yard on May 12, and the Board of Adjustment acted July 9, the county reached a compliance agreement. It gives Quantum 90 days to remove non-permitted operations while keeping office use, and any future use would need a new CUP application. Commissioners ratified it on Sept. 10 agenda.
  where: 10180 West (Teller County)
