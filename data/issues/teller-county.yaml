- title: 2026 budget amendments and 2027 proposed budget
  summary: Commissioners held budget work sessions in August and September, covering the capital plan. They presented the 2027 proposed budget on Oct. 8, and passed resolutions amending the 2026 General, Jail, Social Services and Road and Bridge budgets. Another amendment was on the Oct. 22 agenda, and the 2027 insurance renewal was discussed Oct. 27.
