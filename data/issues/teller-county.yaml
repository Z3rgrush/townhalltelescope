- title: Stage II fire ban eased to Stage I
  summary: Teller County remained under a Stage II fire ban during fire season. On Sept. 2 the commissioners considered a resolution to move to Stage I, and the Sept. 10 agenda included ratifying it. The Forest Service has lifted its recreational shooting restriction.
