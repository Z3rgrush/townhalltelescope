- title: Fire ban lowered from Stage II to Stage I
  summary: Commissioners considered a resolution on Sept. 2 to move from a Stage II to a Stage I fire ban. It was up for ratification Sept. 10. Earlier notes said the Stage II ban remained needed amid dry conditions and low river flows.
