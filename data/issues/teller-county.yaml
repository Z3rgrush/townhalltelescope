- title: 'Ordinance 23: short-term rental regulation and tax administration'
  summary: The commissioners took up Ordinance 23 on regulating short-term rentals in unincorporated Teller County, with first reading on Aug. 6 and second reading scheduled Sept. 10. On Sept. 24 they were to ratify an agreement with Neumo Group, LLC for short-term rental tax and license administration. Residents have raised STR concerns in Four Mile, including STR owners taking seats on HOA boards.
