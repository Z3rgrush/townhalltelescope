- title: 'Short-term rental regulation (Ordinance #23) and tax administration'
  summary: 'The commissioners were set to hold a second reading of Ordinance #23 on Sept. 10, regulating short-term rentals in unincorporated Teller County. On Sept. 24 they were to ratify an agreement with Neumo Group, LLC for short-term rental tax and license administration.'
