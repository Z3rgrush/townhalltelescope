- title: Ordinance 2026-7 banning short-term rentals (Land Use Code 303.1)
  summary: Ophir is drafting an ordinance that repeals and re-enacts Section 303.1 of the Land Use Code to prohibit leasing or advertising homes as short-term rentals, citing noise, traffic, parking and the town's limited housing stock. Planning and Zoning recommended approval of Ordinance 2026-7 as written, 3-0, and had earlier discussed how long a rental must be to count, with one member suggesting anything under 63 days.
  where: Townwide
