- title: Revegetation ordinance and parking plan
  summary: P&Z reviewed the Ophir Environmental Commission's proposed revegetation ordinance, including an approved seed list and a parking plan that would limit parking to Ophir rights of way. P&Z recommended approving the revegetation code 5-0, with the construction fencing requirement removed.
