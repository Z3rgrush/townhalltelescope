- title: Wildfire-resilient exterior material requirements
  summary: The Planning and Zoning Commission is considering new exterior material rules that comply with the Colorado Wildfire Resiliency Code. Draft language covers siding, garage doors, decking and fences, and lets the commission approve additional materials after a public hearing.
  where: Townwide
