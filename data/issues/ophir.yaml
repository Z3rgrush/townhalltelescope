- title: Variance for 2/12 roof pitch and reduced side setbacks on Aurum Street
  summary: 'An applicant (Slator) requested variances for Lots 1 and 2, Block 2 on Aurum Street: side yard setbacks reduced from 15 ft to 10 ft and a 2/12 roof pitch, to help reduce building height. P&Z reviewed the request in March 2026, and the minutes mention approval of the variance by the General Assembly.'
