- title: Variance for side setbacks and 2/12 roof pitch on Aurum Street
  summary: An applicant requested a variance to cut required side yard setbacks from 15 feet to 10 feet and to allow a 2/12 roof pitch for new construction on Lots 1 and 2, Block 2 on Aurum Street. The applicant presented the request to P&Z in March 2026, and approval would also involve the General Assembly.
