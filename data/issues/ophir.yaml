- title: Ban on short-term rentals (Ordinance 2026-7)
  summary: The Planning and Zoning Commission took up an ordinance amending Section 303.1 of the Land Use Code to prohibit leasing homes as short-term rentals, citing town services, neighbors and limited housing stock. P&Z discussed how long a rental period should count, with one member suggesting anything under 63 days, and recommended the ordinance 3-0 as written in October.
