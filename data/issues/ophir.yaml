- title: Ban on short-term rentals (Ordinance 2026-7)
  summary: The Planning and Zoning Commission recommended 3-0 an ordinance amending Section 303.1 of the Land Use Code to make leasing short-term rentals unlawful, citing impacts on town services, neighbors and the town's limited housing stock. P&Z also discussed what minimum rental length should count, with one member suggesting anything under 63 days, and was to review a full draft from the Town.
  where: Townwide
