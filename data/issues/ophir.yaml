- title: Revegetation ordinance for soil disturbance
  summary: A draft ordinance would require a revegetation plan before any soil disturbance, including construction, septic, utility and road work, to protect native plants and pollinators, with penalties for non-compliance. P&Z recommended approval 5-0 in March, with the construction fencing requirement removed, after discussing an approved seed list.
