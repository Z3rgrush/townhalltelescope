- title: Fence on Lots 5 and 6, Block 4 and fencing at 112 Bobtail Street
  summary: Planning and Zoning decided that a new fence on Lots 5 and 6, Block 4 did not need a variance or Special Use Permit, and so could be allowed as an accessory use to the residence on Lots 7 and 8. In October the commission also took up fencing materials for a new fence at 112 Bobtail Street.
