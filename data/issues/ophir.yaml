- title: Wildfire Resiliency Code and new exterior material rules
  summary: Ophir adopted the 2025 Colorado Wildfire Resiliency Code, which state law required by May. P&Z reviewed wildfire-resistant siding, such as wood-styled cement board, and in October considered new exterior material requirements for siding, garage doors, decking and fences that comply with the code.
