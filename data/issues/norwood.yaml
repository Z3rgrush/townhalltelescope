- title: Moratorium on medium and large-scale development and land use code rewrite
  summary: The board considered extending the emergency temporary moratorium on medium and large-scale development (Ordinance 0813, 2025). It also contracted KLJ for a land use code update and a master plan, and a Land Use Code amendment ordinance was scheduled for October. A joint work session covered the master plan and annexation.
