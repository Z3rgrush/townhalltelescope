- title: Removal-for-cause hearing under Resolution 2026-0812
  summary: In August the council took up Resolution 2026-0812 to set a public hearing on removing a town official for cause, with notice of the grounds and hearing procedures. The resolution was back for amendment in September, and an October 15 notice cancels the public hearing. The documents do not name the person or say why it was cancelled.
  where: Townwide
