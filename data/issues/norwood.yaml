- title: Town-wide 15 mph speed limit
  summary: The board discussed lowering the speed limit in the spring and summer, then considered an ordinance in July setting a 15 mph limit on all town streets unless otherwise posted. A further ordinance was on the August 12 agenda, but the documents do not state the outcome.
