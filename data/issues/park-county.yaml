- title: County manager termination
  summary: After an executive session on a personnel matter, commissioners ratified Resolution 2026-47 terminating the county manager. On Sept. 8 they approved Resolution 2026-48 amending it solely to correct statutory citations. A work session also took up delegation of duties for administration.
