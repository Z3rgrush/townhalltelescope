- title: Environmental blight ordinance (Ordinance 6, 2026)
  summary: The county moved through readings of a new Ordinance 6 prohibiting accumulation of environmental blight in unincorporated areas. It replaces the 1991 ordinance, and commissioners approved the final reading Sept. 1.
