- title: Fairplay landfill financial assurance and Land and Water Trust Fund contingency
  summary: Commissioners adopted Resolution 2026-40 directing the county to identify a qualifying financial assurance mechanism for the Fairplay landfill, with conditions before any dedicated sales tax revenue is used. On Aug. 18 they approved Resolution 2026-44 raising the Landfill Contingency from $1,750,000. The Land and Water Trust Fund Board also reviewed a county landfill application and new application rules.
