- title: 634 County Road 62 agrotourism camping permit (Bez CUP A26-0021)
  summary: The Advisory Board on the Environment raised wildlife, wetland, water-supply and flood concerns about a regenerative agrotourism business with cabins and bell tent sites on a 161-acre parcel. Setback variances were also requested. Commissioners backed conditional approval with seven conditions, added septic review and a flood evacuation plan, and approved Resolution 2026-50 on Oct. 6.
