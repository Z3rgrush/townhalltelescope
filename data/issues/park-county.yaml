- title: Regenerative agrotourism camp at 634 County Road 62, Grant
  summary: A conditional use permit (A26-0021) for an agrotourism business with commercial camping, cabins and bell tents drew environmental concerns about wildlife, wetlands, water rights and Geneva Creek flooding. Commissioners recommended conditional approval with conditions including water rights, a septic review and a flood evacuation plan, and adopted Resolution 2026-50 on Oct. 6. Related setback variances and a minor subdivision (Down to Earth, 1525 Venture Road) were also handled.
