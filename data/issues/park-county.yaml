- title: County manager terminated; resolution ratified and corrected
  summary: After an executive session on a personnel matter, commissioners ratified Resolution 2026-47 terminating the county manager on Sept. 1. On Sept. 8 they passed Resolution 2026-48 to correct statutory citations. A discussion of delegating duties between administration and the commissioners was also on the Sept. 8 work session.
