- title: Lostfork PUD amendment at 49355 Hwy 285 and 373 County Road 62
  summary: The applicant sought to merge its PUD lot with an adjacent lot at 373 County Rd 62. Commissioners approved adding the second parcel on Oct. 20 with conditions including a Geneva Creek review, no buildings on wetlands, a CDOT road evaluation and a septic permit. A resolution was scheduled for Oct. 27.
