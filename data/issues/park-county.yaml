- title: 2027 county budget
  summary: Commissioners held work sessions on the 2026 budget and the proposed 2027 budget, with department presentations in October. The 2027 proposed budget was adopted on Oct. 15 by a 2-0 vote. The Land and Water Trust Fund board also reviewed its own 2027 budget for recommendation.
