- title: Lostfork PUD amendment at Hwy 285 and County Road 62
  summary: The applicant asked to fold an adjacent lot at 373 County Rd 62 into its PUD at 49355 Hwy 285, Grant. Commissioners approved it Oct. 20 with conditions including a look at Geneva Creek waterways, no buildings on wetlands, a CDOT road evaluation and septic and building permits. Resolution 2026-53 followed on Oct. 27.
