- title: Camp Sycamore conference and retreat center permit (PZ-2026-0198)
  summary: An applicant sought a conditional use permit for a conference and retreat center in a residential zone, with church camps, weddings, corporate retreats and camping for up to 250 people. The Advisory Board on the Environment raised wildlife, wetland erosion and Ranger Station Rd. traffic and parking concerns. After public comment from several residents, the Planning Commission moved on Oct. 28 to recommend denial.
