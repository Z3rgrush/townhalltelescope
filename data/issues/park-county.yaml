- title: Regenerative agrotourism camping at 634 County Road 62, Grant
  summary: A conditional use permit (A26-0021) for a regenerative agrotourism business with commercial camping, plus a related minor subdivision, was reviewed from August through October. Commissioners asked for conditions including proof of water rights, a drainage and erosion plan, review of septic under CR 62 and a flood evacuation plan. Resolutions 2026-50 and 2026-51 were approved Oct. 6.
