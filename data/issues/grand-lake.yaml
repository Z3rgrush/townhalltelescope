- title: 2027 town budget and public hearing
  summary: The Board held workshops on Sept. 28 and Oct. 8 and reviewed the draft 2027 budget on Oct. 12 and 26, including wages and benefits compared with other municipalities. The preliminary budget shows $7.51M of General Fund revenue, of which $2.87M is grant money tied to four specific projects. A public hearing on the FY 2027 budget was set for Nov. 9, with final approval planned for Nov. 23.
