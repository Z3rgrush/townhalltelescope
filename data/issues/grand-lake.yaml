- title: 'Land Use Code overhaul: definitions, shoreline rules and development review (Ordinances 13-2026 to 27-2026)'
  summary: The Planning Commission reviewed amendments (Resolutions 08-2026 and 10-2026) to Chapter 12 of the town code. They move definitions out of several sections, drop the certified-mail notice requirement, create a new Certifications section and clarify development review thresholds and procedures. The Board of Trustees scheduled a public hearing and first reading of Ordinances 13-2026 through 27-2026 for Nov. 9.
