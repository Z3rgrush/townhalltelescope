- title: Major subdivision at 120 County Road 663
  summary: The Planning Commission held a public hearing on the final development application and final plat for a major subdivision on property annexed in 2025. Staff flagged concerns about fire and emergency access, the road improvements needed, protecting the water main under County Road 663 that supplies all of Grand Lake, and stormwater and flood risk after the post-fire flooding.
