- title: Boots, Bass & Big Air downtown winter event
  summary: Trustees discussed a proposed downtown winter event on Saturday, January 30, 2027, with a working budget of $40,000 and a snowmobile jump on a closed Grand Avenue. Staff raised concerns about public safety and liability, street closures, parking and staff time on the same weekend as skijoring. No action was requested, only Board direction.
