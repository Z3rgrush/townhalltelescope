- title: 2027 Town budget and grant-funded contracts
  summary: Trustees held a series of workshops on a preliminary 2027 budget built from the 2025 audit. It shows a General Fund deficit of about $589,184 after the Town's share of four grant contracts, with $2.87M of the $7.51M in General Fund revenue coming from grants. A public hearing is set for November 9 and final approval for November 23, 2026, with discussion of wages, benefits and a budget officer appointment.
