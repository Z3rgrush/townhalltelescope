- title: Shoreline and side/front yard setback variances
  summary: The Board of Adjustment heard variance requests for 536 Cairns Avenue, including a side yard setback for a separate staircase, which neighbors spoke in support of, and a front yard setback for an elevator. A shoreline setback variance (Resolution 08-2026) had a notice error naming the wrong hearing body, since shoreline variances go to the Planning Commission. The Trustees were set to hear a shoreline variance (Resolution 87-2026) for a property on Mad.
