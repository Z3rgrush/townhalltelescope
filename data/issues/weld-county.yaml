- title: 'Road projects: High Plains Boulevard, roundabout, and bridge replacements'
  summary: The board approved gas pipeline agreements with Xcel for the High Plains Boulevard (CR 9.5) project and the SH 392/CR 37 intersection. It approved street lights for a County Road 31 and 74 roundabout and a traffic signal at SH 52 and CR 37. It also awarded bridge replacement construction, including Bridge 19/46.5A.
