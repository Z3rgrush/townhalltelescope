- title: Voluntary transfer of Housing Choice Voucher program to Greeley Housing Authority
  summary: The board considered and approved transferring the county's Housing Choice Voucher program to the Housing Authority of the City of Greeley under PIH Notice 2018-12. Related items include a private activity bond declaration for residential facilities and bond volume cap assignments for the Prairie Rose Rehab and University Plaza projects.
