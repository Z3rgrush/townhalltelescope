- title: 'Road and intersection projects: roundabouts, signals and bridges'
  summary: The county moved on roundabouts at County Roads 31/74 and 13/50, a traffic signal at State Highway 52 and CR 37, improvements at SH 392 and CR 35, and bridge replacements (19/46.5A and 76.5/21A). It also approved easement purchases, utility relocations, street lights and an Xcel Energy gas pipeline agreement for High Plains Boulevard, along with many temporary road closures.
