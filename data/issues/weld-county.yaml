- title: 2027 county budget and annual fee changes
  summary: 'On November 9 the board held first reading of Ordinance #263 adopting the county budget. It also read Code Ordinance #2026-09 on annual fees, and an emergency ordinance (#264) authorizing a ground lease and lease-purchase financing. Liquor code, dance license and fee updates (#2026-19) moved through readings as well.'
