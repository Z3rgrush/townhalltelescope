- title: Weld County Justice Center project and jail upgrades
  summary: The county is building a new Justice Center on Block 66. It approved a construction manager/general contractor bid in September, signed an agreement with J.E. Dunn Construction Group in October, and handled a stormwater agreement, parking garage plan review, and a temporary parking lot. Separate bids cover jail pod renovations, lighting, and shower replacements.
  where: Justice Center, Block 66, Greeley
