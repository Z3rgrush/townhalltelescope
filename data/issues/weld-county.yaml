- title: Justice Center project (Block 66) construction and parking garage
  summary: 'The county picked a construction manager/general contractor (Bid #B2600077) for the Weld County Justice Center and later approved a contract with J.E. Dunn Construction Group for Block 66. Related items include an interim stormwater agreement with the City, third-party plan review for the parking garage, and a temporary parking lot on Trophy Block North.'
