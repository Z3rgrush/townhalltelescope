- title: Oil and gas leases, 1041 permits and dissolution of the Department of Oil and Gas
  summary: The board held oral auctions for large-tract oil and gas leases, approved a lease of 40.685 acres, and extended other leases. It approved road maintenance agreements for Noble Energy 1041 WOGLA permits and named a backup hearing officer. On September 30 it considered dissolving the county Department of Oil and Gas.
