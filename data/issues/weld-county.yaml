- title: Weld County Justice Center construction and financing
  summary: 'The county approved a construction manager/general contractor bid for the Weld County Justice Center (Block 66), then signed a contract with J.E. Dunn Construction Group. It also handled stormwater responsibility, a temporary parking lot, parking garage plan review and Emergency Ordinance #264 on a ground lease and lease-purchase financing.'
