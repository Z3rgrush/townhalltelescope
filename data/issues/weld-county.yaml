- title: Oil and gas leases, 1041 permits and the Oil and Gas Department
  summary: The county auctioned and approved a large-tract oil and gas lease of 40.685 acres in August. It extended three more leases in September and signed road maintenance agreements for two Noble Energy 1041 WOGLA permits. On Sept. 30 it considered dissolving the Weld County Department of Oil and Gas Energy, and on Nov. 2 it hired a backup hearing officer for 1041 permits.
