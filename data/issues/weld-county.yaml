- title: 'Road projects: roundabouts, signals and bridges'
  summary: The county is buying right-of-way and easements for roundabouts at County Roads 74/31 and 13/50. It is installing streetlights, a traffic signal at State Highway 52 and CR 37, and improvements at SH 392 and CR 35. It also applied for a bridge replacement grant and awarded a Bridge 19/46.5A contract, and approved many temporary road closures.
