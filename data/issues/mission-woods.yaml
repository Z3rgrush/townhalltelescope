- title: Tree ordinance, tree removal costs and a city Tree Board
  summary: A resident asked to be reimbursed for removing a large tree limb, leading the council to pay her $300, debate how the new tree ordinance and budget handle tree problems, and move to make the council the city's Tree Board.
  where: 5314 Mission Woods Terr, citywide
