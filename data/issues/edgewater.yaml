- title: 2026 budget, 2025 tax levy and audit findings
  summary: Council set the 2025 tax levy and adopted the annual budget in December. The city manager called the 2026 budget very tight. The 2024 audit prompted talk of water, sewer and trash losses, possible rate increases, and segregation of duties.
