- title: Proposition 123 affordable housing fast-track review policy
  summary: Staff proposed a resolution adopting an expedited review policy for qualifying affordable housing, with a 90-day review period after a complete application. Adopting it by June 30, 2026 would make Edgewater eligible for about $45,000 in state incentive funding, to be used in the zoning code update.
