- title: Zoning Code Update and rewrite (RLI, RMLI, RMHI districts)
  summary: The city is rewriting its zoning code with a Technical Focus Group. The group's June 8, 2026 meeting reviewed proposed residential districts (RLI, RMLI, RMHI), rear-lot intensification, building heights and floor area limits, balancing more housing against Edgewater's cottage-scale character. The code update is also tied to HB24 state housing requirements and the Edgewater 2040 Comprehensive Plan.
