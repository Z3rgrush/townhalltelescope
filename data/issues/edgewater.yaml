- title: Proposition 123 affordable housing fast-track review policy
  summary: Staff proposed a resolution adopting an expedited review policy for qualifying affordable housing, with a 90-day review period. Adopting it by June 30, 2026 makes Edgewater eligible for about $45,000 in state incentive funding, which staff would use for affordable housing tools in the zoning code update.
