- title: Transit-Oriented Communities housing study (HB 24-1313)
  summary: A consultant, Matrix Design Group, is running a Transit-Oriented Communities planning project to shape Edgewater's response to state law HB 24-1313. In August 2026 it presented existing conditions, housing market and economic feasibility findings to the Planning and Zoning Commission as it moves toward housing, land use and transportation strategies.
