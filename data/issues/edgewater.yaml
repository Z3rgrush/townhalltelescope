- title: Height and parking variances at Board of Adjustment
  summary: In November 2025 the Board approved a variance allowing rear-lot parking access closer than five feet to the side lot line. It also considered a separate variance for an accessory structure 20 feet 2 inches tall, 5 feet 2 inches over the 15-foot limit.
