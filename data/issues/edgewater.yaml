- title: Sheridan Boulevard safety improvements with CDOT
  summary: The Planning and Zoning Commission was briefed on the updated Sheridan Corridor Multimodal Plan between 17th and 26th Avenues, a high-injury corridor. The city and CDOT are working on safety and ADA improvements, and construction is expected to begin in late 2026.
