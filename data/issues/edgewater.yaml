- title: Right-of-Way Funding Sales Tax Ballot Measure
  summary: A proposed sales tax ballot measure to fund the city's rights-of-way is on the Board of Adjustment and Appeals agenda for September 16, 2026. The documents give no details on the amount or the outcome.
