- title: 2026 budget, tax levy and audit findings
  summary: Council reviewed department budget presentations, set the 2025 tax levy, and scheduled adoption of the annual budget in December. The City Manager called next year's budget very tight. The 2024 audit presentation prompted talk of water, sewer and trash losses, segregation of duties and rate increases.
