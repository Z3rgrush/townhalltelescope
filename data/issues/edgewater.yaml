- title: Zoning code rewrite and new residential districts
  summary: The city is rewriting its zoning code with a Technical Focus Group. Its June 8, 2026 meeting reviewed proposed RLI, RMLI and RMHI residential districts, rear-lot intensification, and duplexes and cottage clusters, aiming to add housing while keeping Edgewater's cottage-scale character. The Planning and Zoning Commission and Board of Adjustment have both had it on their agendas.
