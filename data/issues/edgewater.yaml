- title: Transit-Oriented Communities housing study (HB 24-1313)
  summary: Consultant Matrix Design Group is running a Transit-Oriented Communities planning project and presented existing conditions, housing market and economic feasibility findings to Planning and Zoning on Aug. 12, 2026. The work is meant to shape Edgewater's response to HB 24-1313 housing capacity requirements and to guide housing, land use and transportation strategies.
