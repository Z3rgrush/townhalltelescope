- title: Transit-Oriented Communities housing study and HB 24-1313 compliance
  summary: Consultant Matrix Design Group presented a project update to the Planning and Zoning Commission on August 12, 2026, covering existing conditions, housing market and economic feasibility findings. The study is meant to guide Edgewater's response to state law HB 24-1313 on housing capacity near transit, and will move next into housing, land use, transportation and implementation strategies.
