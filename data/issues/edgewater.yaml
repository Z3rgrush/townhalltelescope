- title: Sheridan Boulevard safety improvements with CDOT
  summary: Planning and Zoning was briefed on the updated Sheridan Corridor Multimodal Plan, coordinated with CDOT, for Sheridan Boulevard between 17th and 26th Avenues, a high-injury corridor. The design adds ADA improvements and signal timing changes, and construction is expected to begin in late 2026.
