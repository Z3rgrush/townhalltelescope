- title: Citizen-initiated charter amendment on annexation votes and the city's Annexation Policy
  summary: On Aug. 25 the council adopted an Annexation Policy (Resolution 26-49, with a minor three-word addition moved by Council Member Mulvey) and passed Resolution 26-53 opposing a citizen-initiated ballot measure that would amend the Home Rule Charter to require voter approval for certain large annexations. Resolutions 26-50 and 26-51 also dealt with placing the citizen-initiated amendment on the ballot. The Chamber of Commerce spoke in favor of the policy and the opposition resolution.
  where: Citywide
