- title: Happy Canyon Road/I-25 interchange project agreements
  summary: Council approved several intergovernmental agreements and contracts for the Happy Canyon Road/I-25 interchange, including an amendment to the state IGA (Resolution 26-57), an agreement with the Board of Construction, Maintenance and Operations (26-58), and estimating services (26-61). Further IGAs on bridge enterprise funds (26-72) and CDOT maintenance and operations (26-73) were on the Oct. 27 agenda. A design contract for an interchange monument at I-25 (26-69) was also scheduled.
  where: Happy Canyon Road at I-25
