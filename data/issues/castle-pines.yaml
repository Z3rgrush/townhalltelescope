  summary: 'Council took up several agreements for the Happy Canyon interchange project: an amendment to the CDOT design-phase funding IGA, an IGA with Douglas County, a first amendment to the Alfred Benesch engineering agreement, a Benesch construction-management agreement for Phase 1, and a Stanton constructability and cost-estimating amendment.'
