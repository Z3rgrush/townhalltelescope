- title: Site Improvement Plan zoning amendment (Ordinance 26-06)
  summary: Council amended Section 27 (Site Improvement Plan) of the zoning ordinance, with first reading Aug. 11 and a public hearing and second reading Aug. 25. A speaker asked that comprehensive plan elements be left out of the process and for a more holistic review and an amendment, while another said it provides a clear and predictable process. A motion to adopt was made.
