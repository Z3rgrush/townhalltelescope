- title: Development notification and resident participation in planning
  summary: At the Sept. 22 meeting, residents asked for adjacent-property-owner notification, a central online source for development information, and longer than three minutes of public comment. A Castle Rock resident asked that The Village at Castle Pines HOA be included in the city's referral process.
