- title: Site Improvement Plan zoning amendment (Ordinance 26-06)
  summary: Council took up Ordinance 26-06, which amends Section 27 (Site Improvement Plan) of the zoning ordinance, on first reading Aug. 11 and held a public hearing Aug. 25. A speaker wanted comprehensive plan elements left in and a holistic review; another said it gives a clear, predictable process. Council moved to adopt it after the hearing.
