- title: Proposed 2027 budget and strategic projects 2027-2029
  summary: Council discussed 2027 budget policy and a 2027-2029 strategic project list, then the City Manager presented the proposed 2027 budget on Oct. 20. Projections include 104 new home permits, a 3% property tax increase, a 36% drop in construction use tax after a 26% rise in 2026, and a 28% decrease in development-related permit revenue. Priorities include the Road Solutions Plan, Spring Tributary at Lagae Road, a second Parks foreman, the Trails Master Plan and lodging/admissions tax research.
