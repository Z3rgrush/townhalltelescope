- title: Site Improvement Plan zoning amendment (Ordinance 26-06)
  summary: Council amended Section 27 (Site Improvement Plan) of the zoning ordinance, with first reading Aug. 11 and a public hearing and second reading Aug. 25. Speakers asked for a holistic review and an amendment, while another said it gives a clear and predictable process. Later commenters asked for adjacent-owner notification, a central online page for development information, and HOA inclusion in referrals.
