- title: 2027 city budget and strategic projects
  summary: Council discussed 2027-2029 strategic projects in August, and the City Manager presented the proposed 2027 budget on Oct. 20. It includes a Road Solutions Plan, Spring Tributary stormwater work at Lagae Road, an open-air pavilion, a second parks foreman, a Trails Master Plan update, and lodging and admissions tax research. Projections assume 104 new home permits, a 36% drop in construction use tax in 2027, and a 28% decrease in some development revenue from 2026.
