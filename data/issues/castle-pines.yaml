- title: Annexation Policy and charter ballot measure requiring voter approval for annexations
  summary: Council adopted an Annexation Policy (Resolution 26-49, with a minor three-word addition) after continuing it on Aug. 11. It also passed Resolution 26-53 opposing a citizen-initiated charter amendment that would require voter approval for certain large annexations, and set ballot title for that measure. The Chamber of Commerce spoke on the issue, and a resident asked for a public meeting timeline.
