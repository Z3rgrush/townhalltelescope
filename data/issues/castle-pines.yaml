  summary: The Parks and Recreation Advisory Board discussed Soaring Hawk Park Phase 1 and its phasing from August through October, plus a Coyote Ridge Park renovation update. Staff also proposed trail signage across 35 trail segments, including kiosks, directional signs and mile markers, with three options weighing budget and look and feel.
