- title: Annexation Policy and charter amendment requiring voter approval for annexations
  summary: Council adopted an Annexation Policy (Resolution 26-49) on Aug. 25 after continuing it from Aug. 11, with a minor wording addition. It also passed Resolution 26-53 opposing a citizen-initiated charter amendment on the ballot that would require voter approval for certain large annexations. The Chamber of Commerce spoke against the ballot measure, and a resident asked for a timeline of public meetings in the annexation process.
