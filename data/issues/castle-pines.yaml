- title: Transfer of recreation properties and tracts from Castle Pines North district
  summary: Ordinances 26-08 and 26-09 convey recreation properties and tracts of land under an intergovernmental agreement with the Castle Pines North district. They were introduced Sept. 22 and had a combined public hearing Oct. 13, after which motions were made to adopt both.
