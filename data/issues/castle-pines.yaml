- title: Canyonside Preliminary Plan and replat approvals
  summary: The Planning Commission held a hearing Sept. 24 and recommended approval of the Canyonside Preliminary Plan No. 1, 2nd Amendment (PFP-2026-001), presented by North Canyons Development. Council held a hearing Oct. 13 and moved to approve it (Resolution 26-62) with a condition on the Subdivision Improvement Agreement. A Filing No. 1, 3rd Amendment replat (Resolution 26-65) was on the Oct. 27 agenda.
