- title: Trail signage, Coyote Ridge Park and Soaring Hawk Park
  summary: The Parks board discussed signage for 35 trail segments (kiosks, directional signs and mile markers) with options at different costs and looks. It also reviewed the Coyote Ridge Park renovation and Soaring Hawk Park phasing, continued into October.
