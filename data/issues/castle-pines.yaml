- title: City Annexation Policy (Resolution 26-49)
  summary: Council took up a new Annexation Policy on Aug. 11, continued it, then moved to approve it on Aug. 25 with a minor three-word addition. A speaker asked for a timeline of public meetings in the annexation process.
