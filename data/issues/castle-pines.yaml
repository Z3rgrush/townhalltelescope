- title: Citizen-initiated charter amendment requiring voter approval of annexations
  summary: A citizen-initiated amendment to the Home Rule Charter would require voter approval for certain large annexations. Council set the ballot title and placed it on the ballot (Resolution 26-50 and 26-51), and on Aug. 25 considered Resolution 26-53 expressing the city's opposition to the measure. The Chamber of Commerce also spoke against the measure.
  where: Citywide
