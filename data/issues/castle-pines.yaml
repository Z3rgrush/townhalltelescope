- title: Proposed 2027 city budget
  summary: The City Manager presented the proposed 2027 budget on Oct. 20, with conservative revenue projections and 104 projected new home permits. Construction use tax is projected to fall 36% in 2027 and building permit and planning revenue to decline. Priorities include the Road Solutions Plan, a second Parks foreman, a Trails Master Plan update and research on lodging and admissions taxes.
