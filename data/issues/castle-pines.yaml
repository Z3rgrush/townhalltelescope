- title: Happy Canyon Road/I-25 interchange agreements
  summary: Council approved a series of agreements with the State and CDOT for the Happy Canyon Road/I-25 Interchange Project, including IGA amendments and an agreement on construction, maintenance and operations. A first amendment to estimating services was approved Oct. 13. The Oct. 27 agenda included further IGAs on BTE funds and CDOT maintenance and operations.
