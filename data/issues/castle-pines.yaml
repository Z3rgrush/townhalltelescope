- title: Site Improvement Plan zoning amendment (Ordinance 26-06)
  summary: Council amended Section 27 (Site Improvement Plan) of the zoning ordinance, with first reading Aug. 11 and a public hearing and second reading Aug. 25. A speaker said comprehensive plan elements should be left in and asked for a holistic review and an amendment, while another supported the ordinance as clear and predictable.
