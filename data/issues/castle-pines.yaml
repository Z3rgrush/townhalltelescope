- title: 'Canyonside development: preliminary plan, replat and South Havana Street vacation'
  summary: The Planning Commission recommended approval of the Canyonside Preliminary Plan No. 1, 2nd Amendment (PFP-2026-001) on Sept. 24, and Council approved it Oct. 13 as Resolution 26-62 with a condition on the Subdivision Improvement Agreement. Follow-on items include a replat (Canyonside Filing No. 1, 3rd Amendment, Resolution 26-65) and Ordinance 26-11 vacating part of South Havana Street, set for Oct. 27 and a Nov. 10 hearing. Related ordinances 26-12 and 26-13 accept deeds and easements for Canyons tracts.
