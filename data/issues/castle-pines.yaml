- title: Happy Canyon Road/I-25 interchange project agreements
  summary: Council approved a series of intergovernmental agreements with the State and CDOT, professional services amendments, and funding (BTE) and maintenance agreements for the Happy Canyon Road/I-25 interchange. It also considered construction management with Alfred Benesch and constructability services with Stanton.
