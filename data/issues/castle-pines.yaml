- title: Site improvement plan zoning amendment (Ordinance 26-06)
  summary: After a public hearing on Aug. 25, Council considered adopting Ordinance 26-06 amending Section 27 (Site Improvement Plan) of the zoning ordinance. Speakers said comprehensive plan elements should stay in the process and asked for a holistic review and an amendment; another speaker said it provides a clear, predictable process.
