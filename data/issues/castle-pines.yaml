- title: South Havana Street right-of-way vacation and council redistricting
  summary: Ordinance 26-11 would vacate part of South Havana Street within a final plat. Ordinance 26-10, redrawing the boundaries of the city's three districts, passed first reading Oct. 13 and was set for second reading Oct. 27.
