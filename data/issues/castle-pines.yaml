- title: Proposed 2027 city budget
  summary: The City Manager presented the proposed 2027 budget on Oct. 20, with a plan to adopt the budget and mill levies later. Projections include 104 new home permits, sales tax up 5%, and construction use tax down 36% after a 26% bump in 2026. Priorities include the Road Solutions Plan, a second Parks foreman, a Trails Master Plan update, a pavilion, and research on lodging and admissions taxes.
  where: Citywide
