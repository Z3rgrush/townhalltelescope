- title: Annexation Policy and citizen-initiated charter amendment requiring voter approval of annexations
  summary: Council adopted an Annexation Policy (Resolution 26-49) with a minor wording addition after continuing it from Aug. 11, and placed a citizen-initiated charter amendment on the ballot. It also passed Resolution 26-53 opposing the measure, which would require voter approval for certain large annexations. The Chamber of Commerce spoke against the ballot measure and a resident asked for a public-meeting timeline.
