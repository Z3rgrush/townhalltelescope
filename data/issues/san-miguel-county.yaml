- title: Bridal Veil Falls water flow and black swifts
  summary: Residents raised concerns that the town's diversion dropped Bridal Veil Falls flow to about 1 CFS versus a required 6.5 CFS, threatening nesting black swifts. No formal minimums exist; the Forest Service and US Fish & Wildlife were named as leads, and the issue was considered resolved for now as birds migrate.
