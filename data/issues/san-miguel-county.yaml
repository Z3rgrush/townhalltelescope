- title: Housing Code Update and affordable housing land use amendments
  summary: The county is rewriting parts of its Land Use Code to make affordable and workforce housing easier to build, funded by a Proposition 123 grant. Stakeholder roundtables discussed density bonuses tied to deed-restricted housing, ADUs and streamlined review, and the Planning Commission also reviewed an Affordable Housing Qualified Developer amendment. The commissioners were asked to approve a grant amendment letter after the county's expedited adoption.
