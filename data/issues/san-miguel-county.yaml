- title: 'Natural resources Land Use Code rewrite: forestry, oil & gas, deep geothermal'
  summary: The Planning Commission reviewed new Land Use Code sections on forestry practices (including logging thresholds and streamlining wildfire mitigation), oil and gas operations, and deep geothermal. The Commissioners scheduled public hearings on Resolutions 2026-40 through 2026-43 for Oct 21 to add Article 6 Natural Resources sections and related amendments. Sheep Mountain Alliance commented on the forestry item.
