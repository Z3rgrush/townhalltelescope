- title: County parks and open space projects and new manager
  summary: The Open Space Commission followed Galloping Goose Park (target completion around Oct. 29), Mill Creek Park, Placerville schoolhouse masonry work and the Down Valley park properties, where fire mitigation and a management plan are priorities. New Parks and Open Space Manager J.D. Wise was introduced, and the commission is preparing 2027 priorities and budget cuts.
