- title: Low water flow at Bridal Veil Falls and nesting black swifts
  summary: Citizens raised concern that water diversion dropped flow to about 1 CFS versus a needed 6.5 CFS, affecting nesting black swifts. The Open Space Commission noted no management prescriptions exist, pointed to the Forest Service and US Fish & Wildlife as leads, and considered it resolved for now as the birds migrate.
  where: Bridal Veil Falls
