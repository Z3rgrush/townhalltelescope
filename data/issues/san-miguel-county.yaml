- title: Employee Housing Impact Mitigation Fee
  summary: Commissioners discussed the county's Employee Housing Impact Mitigation Fee, which applies to new construction and additions in the unincorporated Telluride R-1 school district area. The fee was adopted in 2022 and amended in 2023, and funds housing purchases and community housing projects such as Sunnyside. Materials compare it with the Town of Telluride's gap fee.
