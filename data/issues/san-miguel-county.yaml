- title: Housing Code Update and affordable housing code changes
  summary: Funded by a Proposition 123 planning grant, the county is reworking its Land Use Code to make affordable and workforce housing easier to build in unincorporated areas. Stakeholder roundtables have discussed a community housing zone, density bonuses tied to deed-restricted workforce housing, ADU barriers and streamlined review, and the Planning Commission held a work session on October 8. A shared inter-jurisdictional Prop 123 housing presentation was set for November 9.
