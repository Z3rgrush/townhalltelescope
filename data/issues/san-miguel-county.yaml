- title: Housing Code Update and affordable housing land use amendments
  summary: The county is using a Proposition 123 capacity grant to remove barriers to workforce and affordable housing in unincorporated areas, with stakeholder roundtables on community housing zones, density bonuses tied to deed restrictions, and ADUs. The Planning Commission also reviewed a Qualified Developer amendment for affordable housing, and commissioners were asked to amend the Local Planning Capacity grant after adopting an expedited review.
