- title: 'Natural Resources land use code overhaul: forestry, oil and gas, deep geothermal'
  summary: The Planning Commission took up draft Land Use Code amendments for forestry practices (including streamlined review of wildfire mitigation logging), oil and gas operations and deep geothermal operations, with recommendations on Oct 8. The County Commissioners were scheduled to hold public hearings on Resolutions 2026-40 through 2026-43 on Oct 21. Sheep Mountain Alliance commented on the forestry rules.
