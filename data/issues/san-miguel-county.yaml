- title: Employee Housing Impact Mitigation Fee
  summary: The commissioners discussed the county's Employee Housing Impact Mitigation Fee on new construction and additions in the Telluride R-1 school district area. Background materials compare the county's graduated rates with Telluride's gap fee of $902 per square foot and the county's use of payments to buy housing and support projects like Sunnyside.
  where: Unincorporated county in the Telluride R-1 school district
