- title: Bridal Veil Falls water flow and black swifts
  summary: Citizens raised concerns that water diversion dropped flow at Bridal Veil Falls to about 1 CFS versus the 6.5 CFS required, threatening nesting black swifts. The commission noted no formal management prescriptions exist, pointed to the Forest Service and US Fish & Wildlife, and considered it resolved for now as birds migrate.
