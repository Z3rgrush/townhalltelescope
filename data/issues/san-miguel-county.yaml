- title: Employee Housing Impact Mitigation Fee review
  summary: Commissioners discussed the county's Employee Housing Impact Mitigation Fee, adopted in 2022 and amended in 2023, which applies to new construction and additions in the unincorporated Telluride R-1 school district area. The county uses the payments to buy housing units, partner on community housing like Sunnyside, and purchase land. Staff compared it with Telluride's and Mountain Village's fees.
