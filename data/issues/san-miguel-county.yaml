- title: Housing Code Update and affordable housing land use changes
  summary: The county is rewriting its land use code to make affordable and workforce housing easier to build, funded by a Proposition 123 planning capacity grant. Stakeholder roundtables discussed density bonuses tied to deed-restricted workforce housing, ADUs, and streamlined review, and the county sought an amendment to its Local Planning Capacity grant after expedited review approval from DOLA. The Planning Commission also took up a Qualified Developer amendment to the affordable housing rules.
