- title: San Miguel Basin Fair Board budget shortfall and possible separation from the county
  summary: The Fair Board reported a $13,000 unfavorable budget position, pursued grants, and deferred equipment purchases until the budget is balanced. The county manager floated separating the Fair Board from the county as a nonprofit, with updated bylaws and a dissolution agreement, and the board discussed 2027 livestock sale rule changes.
