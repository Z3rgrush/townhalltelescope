- title: Bridal Veil Falls low water flow and black swifts
  summary: Citizens raised concern that Town diversions dropped flow at Bridal Veil Falls to about 1 CFS versus the 6.5 CFS required, threatening nesting black swifts. The Open Space Commission noted no management prescriptions for minimum flows exist, pointed to the Forest Service and US Fish & Wildlife, and considered it resolved for now as the birds migrate.
