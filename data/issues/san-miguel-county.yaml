- title: Affordable housing code update and employee housing impact fee
  summary: The county is rewriting its Land Use Code to make affordable and workforce housing easier to build, funded by a Prop 123 grant, with stakeholder roundtables on density bonuses, ADUs and a Community Housing Zone. Planning Commission work sessions also looked at the Employee Housing Impact Mitigation Fee, which applies to new construction in the Telluride R-1 school district area.
