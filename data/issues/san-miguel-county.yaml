- title: Bridal Veil Falls water flow and nesting black swifts
  summary: Residents raised concern that diversion by the town dropped flow at Bridal Veil Falls to about 1 cfs versus the 6.5 cfs required, threatening nesting black swifts. The Open Space Commission noted no management prescriptions exist for minimum water, that the Forest Service and US Fish & Wildlife are the appropriate leads, and considered the matter resolved for now as the birds migrate.
