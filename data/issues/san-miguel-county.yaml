- title: 'Natural Resources code rewrite: forestry, oil & gas, and deep geothermal'
  summary: The county is adding a new Article 6 on Natural Resources to the Land Use Code, covering forestry practices (including streamlined review of wildfire mitigation logging), oil and gas operations, and deep geothermal. The Planning Commission took these up in September and October, and the Commissioners scheduled public hearings on Resolutions 2026-40 through 2026-43 for October 21.
