- title: 'Mountain Village affordable housing project: fee waiver and setback variance'
  summary: The Commissioners held a public hearing on waiving county land use fees for the Town of Mountain Village's affordable housing project. The Board of Adjustment considered a variance cutting the setback from County Road 63L from 20 feet to 7 feet on a 56.34-acre parcel to keep housing away from the riparian corridor and wetlands. Staff recommended a five-year approval.
