- title: Noxious weed grant funds and enforcement
  summary: The Noxious Weed Advisory Board discussed how to allocate a $5,800 Colorado Department of Agriculture Noxious Weed Fund grant, with Julie Kolb to draft allocation options. It also discussed enforcement against landowners and 2027 grant outlook, while commissioners set the 2027 Vegetation Control and Management fee schedule.
