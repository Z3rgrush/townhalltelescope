- title: Mountain Village Ilium affordable housing setback variance
  summary: The Town of Mountain Village asked the Board of Adjustment to cut the setback from County Road 63L from 20 feet to 7 feet on a 56.34-acre Community Housing parcel. The town says this keeps homes farther from the riparian corridor and wetlands, and staff recommended a five-year approval.
