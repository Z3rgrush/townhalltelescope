- title: 'Natural resources Land Use Code rewrite: forestry, oil & gas, geothermal'
  summary: The Planning Commission reviewed new Land Use Code sections on forestry practices (including streamlining wildfire mitigation), oil and gas operations, and deep geothermal operations, with Sheep Mountain Alliance commenting on forestry. The commissioners then scheduled Resolutions 2026-40 through 2026-43 for public hearings on Oct. 21 to adopt the amendments.
