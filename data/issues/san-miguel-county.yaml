- title: San Miguel Basin Fair Board budget shortfall and possible separation from county
  summary: The Fair Board reported a $13,000 budget shortfall due to low livestock sale revenue and deferred equipment purchases until the budget balances. County Manager Mike Bordogna raised separating the Fair Board as a nonprofit, and the board discussed 2027 junior livestock sale rule changes.
