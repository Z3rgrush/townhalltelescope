- title: Noxious weed program, grants and enforcement
  summary: The Noxious Weed Advisory Board is weighing how to allocate a $5,800 state Noxious Weed Fund grant and whether to enforce weed rules on landowners. The county also set the 2027 Vegetation Control and Management fee schedule (Resolution 2026-44), and a tamarisk removal project in Dry Creek Basin covered about 3 miles.
