- title: Open Space Commission work plan, new Parks and Open Space manager, and park projects
  summary: J.D. Wise was introduced as the new Parks and Open Space Manager, and commissioners are choosing 3-5 priority projects and cuts ahead of the November 9 budget deadline. Galloping Goose Park is targeted for completion by October 29, and the commission wants Gunnison sage-grouse work kept on the plan, plus a short management plan and fire mitigation for an under-used property.
