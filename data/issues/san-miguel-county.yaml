- title: 'Land Use Code amendments: affordable housing qualified developer, nonconforming lots, natural medicine'
  summary: The Planning Commission reviewed amendments to let the county define a qualified affordable housing developer, to allow uses and special use permits on nonconforming lots, and to set rules (including a 1,000-foot buffer from daycares) for where natural medicine businesses can operate. Attorneys and consultants spoke on the nonconforming lots item; no one commented on natural medicine.
