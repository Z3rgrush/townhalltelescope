- title: 'Mountain Village affordable housing project: fee waiver and setback variance'
  summary: The Town of Mountain Village is developing affordable housing on a 56.34-acre parcel in the Community Housing zone. It asked the county to waive land use application fees and for a variance cutting the setback from County Road 63L from 20 feet to 7 feet to keep housing away from the riparian corridor and wetlands. Staff recommended a five-year approval.
  where: 'Parcel #456536200023, County Road 63L (Ilium property)'
