- title: 'Natural resources land use code rewrite: forestry, oil & gas, deep geothermal'
  summary: The Planning Commission reviewed new Land Use Code rules for forestry practices (logging tiers by board feet, streamlined wildfire mitigation review), oil and gas operations, and deep geothermal, with Sheep Mountain Alliance commenting on forestry. The county commissioners scheduled public hearings on Resolutions 2026-40 through 2026-43 for October 21 to adopt the new Article 6 sections and related amendments.
