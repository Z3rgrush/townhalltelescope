- title: Employee Housing Impact Mitigation Fee
  summary: Commissioners discussed the county's Employee Housing Impact Mitigation Fee, which applies to new construction and additions in the unincorporated Telluride R-1 school district area and funds housing purchases and projects like Sunnyside. Materials compare it with the Town of Telluride's gap fee of $902 per square foot.
