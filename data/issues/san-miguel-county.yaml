- title: 'Mountain Village affordable housing project: fee waiver and setback variance'
  summary: The commissioners held a hearing on waiving land use application fees for the Town of Mountain Village affordable housing project. The Board of Adjustment considered reducing the setback from County Road 63L from 20 feet to 7 feet on a 56.34-acre parcel, to keep homes away from the riparian corridor and wetlands. Staff recommended a five-year approval.
