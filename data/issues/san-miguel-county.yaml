  public_comment: true
- title: Open Space Commission work plan, new manager and park projects
  summary: The commission is hiring a new Parks and Open Space Manager and must pick 3 to 5 priority projects and cut the work plan ahead of the Nov. 9 budget deadline. Galloping Goose Park targets completion by Oct 29, and the commission wants fire mitigation and a management plan for a site seen as inaccessible.
