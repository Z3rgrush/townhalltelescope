- title: Natural medicine and nonconforming lots code amendments
  summary: The Planning Commission reviewed a new Section 5-31 setting where and how natural medicine businesses may operate, including distance from daycares. It also reviewed amendments allowing certain uses on nonconforming lots, on which an attorney and Alpine representatives spoke.
