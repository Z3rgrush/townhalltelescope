- title: Placerville Park rezoning around the fire station
  summary: San Miguel County asked the Planning Commission to recommend rezoning part of Placerville Park around the fire station from Forestry, Agriculture and Open to a Public zone. Telluride Fire Protection District is also giving a project update on Placerville Station 3.
