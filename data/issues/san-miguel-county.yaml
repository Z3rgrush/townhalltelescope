- title: 'Open Space and parks projects: Galloping Goose Park, new manager, Gunnison sage grouse'
  summary: Galloping Goose Park is targeted for completion by an October 29 deadline, with a governor's visit possibly tied to a sculpture unveiling. The commission is hiring a Parks and Open Space Manager (J.D. Wise introduced later), wants Gunnison sage grouse on the work plan, and discussed a management plan and fire mitigation for a county property.
