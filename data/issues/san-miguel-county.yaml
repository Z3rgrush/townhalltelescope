- title: 'Open Space Commission: Galloping Goose Park, new manager and property plans'
  summary: Galloping Goose Park is targeted for completion by an Oct 29 deadline, with a governor's visit for a sculpture unveiling. The commission is hiring a new Parks and Open Space Manager, and wants a short management plan, fire mitigation for dead trees, and a survey for a county property seen as inaccessible. Gunnison sage grouse work stays on the work plan.
