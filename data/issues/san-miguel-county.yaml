- title: Mountain Village affordable housing setback variance on County Road 63L
  summary: The Board of Adjustment considered a request from the Town of Mountain Village to cut the setback from the County Road 63L right-of-way from 20 feet to 7 feet on a 56.34-acre Community Housing zoned parcel. The town says this keeps housing farther from the riparian corridor and wetlands, and staff recommended a five-year approval.
