- title: Variance and appeal rules in the Land Use Code
  summary: Council amended Ordinance 13, Series 2026 on variances (Chapters 4.17 and 4.20), deleting the subsection that prohibited the call-up procedure. Council directed staff to draft language letting neighbors who took part in hearings submit call-ups, and letting the Community Development Director refer administrative decisions to Planning and Zoning. The commission was to review the appeal, referral and call-up changes October 20.
