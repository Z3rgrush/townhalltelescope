  summary: The Eagle River Park Coalition asked Council to fund maintenance and an engineering project for the river park in the 2027 budget. Residents asked that the Coalition rather than a third-party contractor be involved and asked about the rapid blocks. Council scheduled a site visit to the river park at 200 Fairgrounds Rd.
