- title: Parking in the public right-of-way
  summary: Police Chief Buhlman told Council that Town Code does not specifically prohibit parking in the right-of-way, though vehicles left 24 hours or more can be tagged as abandoned and other violations apply. Council held work sessions on code and enforcement options. A resident also asked for a flashing sign at a crosswalk near Eagle Ranch Road.
