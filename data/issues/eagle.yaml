- title: 2026 supplemental and 2027 town budget and capital priorities
  summary: Staff presented a draft 2027 budget with a General Fund operating surplus of $466,340 before transfers and $350,000 in assumed vacancy savings. Council work sessions on September 1, 15 and 29 set capital priorities (Nogal Park, Brush Creek Road extension right-of-way, Grand Ave. Grill demolition/parking) and MEAC and community grant funding. A public hearing on the budget was set for October 21.
