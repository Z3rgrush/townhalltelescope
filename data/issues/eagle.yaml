- title: Proposed pickleball courts at Town Park
  summary: Neighbors near Town Park, including residents 68 feet from the proposed courts, spoke against new pickleball courts over noise, park space, cost and upkeep. Council held an August 25 open house and online survey and heard the results September 8. At the September 22 meeting residents asked that courts not go within 500 feet of homes, while others backed amenities that draw visitors.
