- title: 'Land use code amendments: variances, appeals and mixed-use step-backs'
  summary: The Planning & Zoning Commission reviewed code changes that would remove financial hardship as a basis for variances and create a two-tier review. It also reviewed changes to mixed-use step-back standards (Section 4.10.050) and to appeals, referrals and call-ups of land use decisions. Council directed that parties who participated could appeal and that the director may refer administrative decisions to the Commission.
