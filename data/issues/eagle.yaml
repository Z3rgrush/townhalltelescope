- title: Proposed pickleball courts at Town Park
  summary: Neighbors near Town Park, including residents of Washington Street and south of the park, oppose the proposed pickleball courts. They cite noise (courts 68-78 feet from homes), cost and maintenance, and loss of park space. The Town held an August 25 open house and online survey. Some residents elsewhere in town support the courts.
