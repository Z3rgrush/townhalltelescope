- title: 'Downtown projects: Capitol Street, 215 Capitol purchase, St. Mary''s Church and alley vacation'
  summary: Council took up Ordinance 14 to purchase real property at 215 Capitol Street and Ordinance 10 to vacate an alley in the block bounded by Capitol, Grand, Howard and East Second in exchange for three easements. The town is under contract to buy St. Mary's Church, which may operate there until January 2028, and a property is to be demolished for the Grand Avenue corridor and Brush Creek Road extension.
