- title: 2026 supplemental and 2027 budget, capital priorities and grants
  summary: Council work sessions reviewed the 2026 supplemental and proposed 2027 budget. The draft shows a $466,340 General Fund operating surplus before transfers and includes $350,000 in assumed vacancy savings. Council was also asked to set top capital priorities (Nogal Park, Brush Creek Road extension right-of-way, Grand Avenue Grill demolition and parking) and to guide MEAC and Community Grant funding. A public hearing on the budget is on the October 21 agenda.
