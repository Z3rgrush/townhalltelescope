- title: Eagle River Park funding and Coalition requests
  summary: The Eagle River Park Coalition asked Council to fund ongoing maintenance and a river park engineering project in the 2027 budget. Residents urged more pathways and asked Council to work with the Coalition rather than a third-party contractor. Council planned a site visit to the park at 200 Fairgrounds Rd.
