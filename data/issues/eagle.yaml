- title: 2026 supplemental and 2027 town budget
  summary: Council worked through the 2026 supplemental and 2027 budgets, with a draft General Fund operating surplus of $466,340 and $350,000 in assumed vacancy savings. A capital work session was held Sept. 29 and a public hearing Oct. 27 drew no comment and no revisions. Budget resolutions 66-68 were set for adoption Nov. 10.
