- title: Right-of-way parking rules
  summary: Council asked about parking in the public right-of-way. Police reported Town Code does not specifically prohibit parking there, though vehicles left 24 hours or more can be treated as abandoned and the Model Traffic Code bans parking near hydrants and crosswalks. A work session on ordinances and opportunities is set for October 6.
