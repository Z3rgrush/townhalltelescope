- title: Eagle Bike Park maintenance funding
  summary: Council reviewed who pays for Bike Park upkeep. The Town owns the land and Vail Valley Mountain Trails Alliance runs it under a 2023 license that sets no Town contribution. The Town approved $44,500 for 2026 from the Sales Tax Capital Improvement Fund, and VVMTA submitted a similar 2027 request.
