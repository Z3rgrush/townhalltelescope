- title: Proposed pickleball courts at Town Park
  summary: Neighbors near Town Park, including residents 68 feet from the proposed site, spoke against new pickleball courts at Council meetings, citing noise, park space, cost and maintenance. Staff presented feedback from an August 25 open house and online survey. Residents asked Council to move the money elsewhere and keep courts at least 500 feet from homes, while others supported pickleball as an attraction.
