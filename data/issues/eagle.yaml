- title: Proposed pickleball courts at Town Park
  summary: Residents near Town Park spoke at several Council meetings against proposed pickleball courts, citing noise (courts as close as 68-78 feet from homes), cost and park character. Council heard results of an August 25 open house and online survey on September 8, and residents asked it to redirect the money elsewhere.
