- title: 2026 supplemental and 2027 town budget and capital plan
  summary: Staff presented a 2027 draft with a General Fund operating surplus of $466,340 before transfers and $350,000 in assumed vacancy savings. Council held work sessions on operating and capital priorities (Sept 15 and 29), and a public hearing on the 2026/2027 budget was set for October 27. Capital projects include Nogal Park updates, Brush Creek Road extension right-of-way purchases and Grand Ave. Grill demolition and parking.
