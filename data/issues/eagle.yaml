- title: Bike Park maintenance funding for 2027
  summary: The Town owns the Eagle Bike Park, which the Vail Valley Mountain Trails Alliance operates under a 2023 license that sets no Town cash contribution. Council approved $44,500 for 2026 maintenance from the Sales Tax Capital Improvement Fund. Council asked how much the Town and the Alliance should each pay in 2027.
