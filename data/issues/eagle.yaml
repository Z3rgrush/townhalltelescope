- title: Right-of-way parking rules and enforcement
  summary: Council asked how town code handles parking in the public right-of-way. Police found the code does not specifically prohibit it, though vehicles left 24 hours or more can be treated as abandoned and the Model Traffic Code bars parking near driveways, hydrants and crosswalks. A work session on October 6 covered it with a Grand Avenue map.
