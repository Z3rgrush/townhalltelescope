- title: Eagle River Park funding and engineering
  summary: The Eagle River Park Coalition asked Council to include funding in the 2027 budget for river park maintenance, development and an engineering project to improve safety. Residents spoke in favor and asked Council to work with the Coalition rather than a third-party contractor. Council scheduled a site visit to the park at 200 Fairgrounds Rd.
