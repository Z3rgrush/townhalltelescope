- title: Downtown Development Authority expansion and Capitol Street area
  summary: The DDA approved Resolution 05 to include 212 E. Third Street in the district and discussed outreach to owners of 214 Capitol Street and the Big Bear building. Council also took up Ordinance 16 adding a vacated alley in Block 13, and Council had earlier considered buying 215 Capitol Street. The DDA reviewed its 2027 budget draft, including a commercial activation rebate program and a downtown parking assessment.
