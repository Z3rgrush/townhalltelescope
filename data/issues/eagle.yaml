- title: Variance and appeal/call-up changes to the land use code
  summary: Council amended and approved Ordinance 13, which overhauls variance rules in Chapters 4.17 and 4.20, eliminating financial hardship as a basis and creating a two-tier review. Council removed the subsection prohibiting call-up. Later direction would allow the Community Development Director to refer administrative decisions to Planning & Zoning and let participating neighbors appeal. P&Z was to review Chapter 4.17 appeal amendments on October 20.
