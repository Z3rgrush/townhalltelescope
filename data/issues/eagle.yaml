- title: Variance and appeal/call-up rules in the Land Use Code
  summary: Council approved Ordinance 13, amending variance rules in Chapters 4.17 and 4.20, but deleted the subsection prohibiting call-up and directed staff to draft language on appeals and referrals. Planning & Zoning reviewed the variance changes, which end financial hardship as a basis for approval, and was to consider a follow-up resolution on appeal, referral and call-up of land use applications on October 20.
