- title: Data center moratorium and Ordinance 1121 reconsideration
  summary: The Board adopted a twelve-month moratorium on data centers on August 31. Planning staff said the town had received no data center proposals. A special October 29 Board meeting listed options to reconsider Ordinance 1121 (Public Facilities zoning) or take up a conditional use permit application; the documents do not state the outcome.
