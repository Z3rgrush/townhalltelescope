- title: Waterfront Filing No. 2 preliminary plat
  summary: The Planning Commission held a public hearing on a proposed mixed-use development and recommended conditional approval. Commissioners focused on traffic capacity, road improvements and trail connections. They also called for broader coordination of transportation improvements across nearby developments.
