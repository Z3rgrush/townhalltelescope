- title: 'New Mead Police Facility: site plan, DOLA grant and financing'
  summary: The town is building a new police facility in the Liberty Ranch subdivision on Chaparral Street. The Board is approving the site plan (Ordinance 1118) and easement vacations (Ordinance 1119), and a groundbreaking ceremony was scheduled. The Urban Renewal Authority heard a DOLA grant presentation, a financing briefing from Piper Sandler on interest rates and schedule, and a cooperation agreement with the Town for construction.
  where: Liberty Ranch Subdivision, Chaparral Street
