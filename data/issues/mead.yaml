- title: High Plains Boulevard road completion
  summary: Construction of two miles of High Plains Blvd between WCR 32 and WCR 36 is almost complete. It includes two travel lanes, bike lanes, roundabouts at CR 32 and CR 34, and a detached sidewalk. A celebration with the High Plains Boulevard Coalition and developers was scheduled.
  where: High Plains Blvd (WCR 9.5), WCR 32 to WCR 36
