- title: High Plains Boulevard road project
  summary: Construction of two miles of High Plains Boulevard (WCR 9.5) between WCR 32 and WCR 36 is nearly complete. It includes two travel lanes, bike lanes, roundabouts at CR 32 and CR 34, and a ten-foot detached sidewalk. A celebration was planned in October.
  where: High Plains Blvd between WCR 32 and WCR 36
