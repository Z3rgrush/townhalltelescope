- title: Urban Renewal Authority tax increment incentive policy
  summary: The Mead Urban Renewal Authority considered a formal policy for evaluating requests for tax increment financing reimbursement of public improvement costs. It sets eligibility thresholds, three evaluation criteria and a small project track, and keeps the board's full discretion. The board took up the policy as Resolution 03-URA-2026 on Oct. 26.
