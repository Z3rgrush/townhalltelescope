- title: Mead Urban Renewal Authority tax-increment incentive policy
  summary: Contract counsel presented a policy for evaluating developer requests for tax-increment reimbursement of public improvements. It sets eligibility thresholds, three evaluation criteria and a small-project track, and keeps the Board's discretion. A resolution approving the policy (03-URA-2026) was on the October 26 agenda.
