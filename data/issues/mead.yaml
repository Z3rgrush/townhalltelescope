- title: 2027 budget and mill levies
  summary: The Town presented its proposed 2027 budget on Sept. 28 and set public hearings for Oct. 26 on the town budget (Resolution 71-R-2026). The Urban Renewal Authority and the Highway 66/I-25 and Elevation 25 General Improvement Districts held hearings the same day on their own 2027 budgets and mill levies. The town also amended the 2026 Municipal Facilities Impact Fee Fund budget.
