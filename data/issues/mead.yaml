- title: I-25 sewer relocation and Safe Routes to School construction contracts
  summary: The Board considered awarding the I-25 Sewer Relocation Project bid to SMH West LLC and the Mead Safe Routes to School bid to Colorado Paving. It also considered a common use agreement with CDOT for the sewer relocation.
