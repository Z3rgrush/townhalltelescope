- title: Public Facilities zoning and the Ordinance 1121 reconsideration
  summary: The Planning Commission recommended Public Facilities (PF) zoning for the town-owned Valdez annexation property and other town-owned properties. The Board took up the zoning map amendment (Ordinance 1121) on Oct. 26. An Oct. 29 agenda lists options to reconsider Ordinance 1121 or pursue a conditional use permit.
