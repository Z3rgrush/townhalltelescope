- title: Mead Urban Renewal Authority tax increment incentive policy
  summary: Counsel proposed a formal policy for evaluating developer requests for tax increment financing reimbursement of public improvements. It sets threshold eligibility, evaluation criteria and a small project track, while leaving the Board discretion. Resolution 03-URA-2026 to approve it was on the October 26 agenda.
