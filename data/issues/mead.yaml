- title: 2027 budget and mill levies
  summary: The proposed 2027 budget was presented September 28 and public hearings were set for October 26. These covered the town budget, the Urban Renewal Authority, and the Hwy 66/I-25 and Elevation 25 General Improvement Districts, which also set their mill levies.
