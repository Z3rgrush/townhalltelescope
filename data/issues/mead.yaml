- title: 2027 town budget and GID budgets
  summary: The 2027 proposed budget was presented on Sept. 28, with questions taken on Oct. 12 and a public hearing and adoption resolution on Oct. 26. The Urban Renewal Authority and the Highway 66/I-25 and Elevation 25 General Improvement Districts also held 2027 budget presentations and hearings that set mill levies. The Board also amended the 2026 Municipal Facilities Impact Fee Fund budget.
