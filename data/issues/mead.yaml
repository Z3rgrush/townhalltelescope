- title: 2027 town budget
  summary: The 2027 proposed budget was presented September 28. A public hearing and adoption (Resolution 71-R-2026) were scheduled for October 26, with a budget amendment to the Municipal Facilities Impact Fee Fund. The town's two general improvement districts also held 2027 budget presentations and hearings with mill levies.
