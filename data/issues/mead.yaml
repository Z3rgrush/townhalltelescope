- title: New Mead library and Parks, Recreation, Open Space and Trails Master Plan
  summary: The town celebrated the new High Plains Library District Mead Library on Chaparral Street and gave conditional acceptance of its public improvements. The Board also adopted the Parks, Recreation, Open Space, and Trails Master Plan.
