- title: Waterfront Filing No. 2 preliminary plat
  summary: The Planning Commission recommended conditional approval of the preliminary plat for Waterfront Filing No. 2, a proposed mixed-use development. Commissioners focused on traffic capacity, road improvements and trail connections. They also called for broader coordination of transportation improvements across nearby developments.
