- title: New Mead Police Facility, financing and site approval
  summary: The town broke ground on a new police facility on Chaparral Street in the Liberty Ranch subdivision. The Urban Renewal Authority heard a DOLA grant presentation and Piper Sandler financing options, and approved a cooperation agreement. Trustees took up the police site plan (Ordinance 1118) and a Municipal Facilities Impact Fee Fund budget amendment. A police station recap was set for November 9.
