- title: 'New Mead Police Facility: site plan, financing and groundbreaking'
  summary: The town is building a 19,000 sq ft police facility at the Municipal campus in Liberty Ranch on Chaparral Street. The Urban Renewal Authority heard a DOLA grant presentation and financing options from Piper Sandler and reviewed a cooperation agreement with the Town. The Board approved the site plan by Ordinance 1118, held a special meeting on Oct. 29 on construction and funding, and a groundbreaking was scheduled for Oct. 19.
  where: Chaparral Street, Liberty Ranch Subdivision
