- title: Annexations and Public Facilities zoning of town-owned land
  summary: The Planning Commission recommended Public Facilities initial zoning for the town-owned Valdez Annexation and recommended initial zoning for the 1785 Weld County Road 32 annexation. It also recommended Public Facilities zoning for certain town-owned properties, which Trustees took up as Ordinance 1121 on October 26.
