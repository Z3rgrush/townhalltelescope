- title: 'Mead Police Facility: site plan, groundbreaking and financing'
  summary: The town approved the Mead Police Department site plan (Ordinance 1118) and held a groundbreaking for the new facility in the Liberty Ranch subdivision on Chaparral Street. Urban Renewal Authority commissioners heard about a DOLA grant and Piper Sandler's financing plan, and discussed a cooperation agreement with the town for the project.
  where: Chaparral Street, Liberty Ranch Subdivision
