- title: High Plains Boulevard road project
  summary: Construction of two miles of High Plains Boulevard between WCR 32 and WCR 36 is nearly complete. It includes two travel lanes, bike lanes, roundabouts at CR 32 and CR 34, and a detached sidewalk. A celebration with the coalition and developers was scheduled.
