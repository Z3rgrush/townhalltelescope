  summary: The Planning Commission recommended Public Facilities initial zoning for the town-owned Valdez annexation and for the 1785 Weld County Road 32 annexation. A zoning map amendment (Ordinance 1121) putting Public Facilities zoning on certain town-owned properties went to the Board October 26.
