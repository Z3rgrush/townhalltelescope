- title: Reconsideration of Ordinance 1121 (Public Facilities zoning) and possible CUP
  summary: The Board approved a zoning map amendment placing Public Facilities (PF) zoning on certain town-owned properties, including the Valdez annexation property, after Planning Commission review. A special meeting on Oct. 29 listed options to reconsider Ordinance 1121 or pursue a conditional use permit application.
