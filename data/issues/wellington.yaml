- title: Cleveland Avenue downtown construction project
  summary: The signature downtown project adds street and sidewalk lighting, more on-street parking and a new storm drain in Cleveland Avenue and 5th Street. It relies on grants including $1.8 million Revitalizing Main Street and $1.35 million MMOF money that must be spent by 12/31/2026. Coulson Excavating is the contractor, and crews have dealt with waterline and sewer service conflicts.
