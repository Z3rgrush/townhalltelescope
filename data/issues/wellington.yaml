- title: Flock license plate reader cameras and Sheriff's Office contract
  summary: Larimer County Sheriff's Office presented on Flock automated license plate readers at five Wellington locations, including Highway 1/County Road 9 and 6th Street/Cleveland Avenue. The Town set aside $17,000 after a grant was not awarded. By October 13 the Board had asked to remove ALPRs from the 2027 LCSO budget, and a resident thanked them for it.
