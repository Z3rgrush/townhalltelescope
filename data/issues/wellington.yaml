- title: Floodplain code amendments
  summary: The Planning Commission recommended and the Board adopted Ordinance 13-2026 updating the floodplain rules in Chapter 15 to align with FEMA model standards. The changes affect properties newly mapped into the floodplain and the flood insurance program.
