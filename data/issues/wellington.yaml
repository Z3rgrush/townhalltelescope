- title: FY2027 budget, property tax levy and sewer fund loan
  summary: Staff presented the 2027 budget with department cuts, delayed capital projects and a proposed $2,000,000 loan from the General Fund to the Sewer Fund to delay a sewer rate adjustment. A budget workday was held Oct 2, and a hearing on the budget, 2026 property tax levy and appropriations was set for Nov 10.
