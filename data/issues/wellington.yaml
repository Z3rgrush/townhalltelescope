- title: Cleveland Avenue downtown construction project
  summary: The Board got an update on the Cleveland Avenue project, aimed at better lighting, more on-street parking and new storm drainage on Cleveland Avenue and 5th Street. Coulson Excavating is the contractor; $1.8M and $1.35M grants must be spent by 12/31/2026. Crews have dealt with waterline lowerings and sewer service conflicts.
