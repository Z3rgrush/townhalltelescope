- title: FY2027 town budget
  summary: The Board held a Budget Workday on Oct. 2 and a public Budget Boo-nanza, with the draft 2027 budget presented Oct. 13 for public comment. Plans include capital projects across funds, a proposed delay in a sewer rate adjustment and a $2,000,000 General Fund loan to the Sewer Fund. Adoption is expected Nov. 10.
