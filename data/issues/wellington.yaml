- title: FY2027 budget and sewer fund interfund loan
  summary: The Board worked through the 2027 budget in a workday on October 2 and a public presentation on October 13, including department reductions and delayed capital projects. A $2,000,000 loan from the General Fund to the Sewer Fund, through 2040, would delay a sewer rate adjustment and was set for a resolution vote on October 27.
