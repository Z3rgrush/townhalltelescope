- title: Cleveland Avenue downtown reconstruction project
  summary: The Town is rebuilding Cleveland Avenue and 5th Street downtown with new lighting, more on-street parking and a new storm drain system. Coulson Excavating was awarded the contract; state and federal grants including $1.8M Revitalizing Main Street and $1.35M MMOF must be spent by 12/31/2026. Staff reported on waterline work and sewer service conflicts at a Sept. 15 work session.
  where: Cleveland Avenue and 5th Street, downtown Wellington
