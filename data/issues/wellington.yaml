- title: Economic development incentive policy
  summary: The Board gave direction on a draft incentive framework focused on commercial development and adopted Resolution 36-2026 on Aug. 25. Tap fee incentives would need significant justification and performance metrics, and a Downtown Development Authority was requested for inclusion.
