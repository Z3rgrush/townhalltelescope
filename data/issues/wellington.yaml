- title: 2024 building and fire code adoption
  summary: Ordinance 11-2026 updates the Town's building, residential and fire codes, with local amendments to align with the Wellington Fire Protection District's 2024 Fire Code. It includes electric-ready and solar-ready provisions, which prepare buildings for future solar rather than requiring panels.
