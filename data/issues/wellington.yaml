- title: Building, fire code and floodplain code updates
  summary: The Board adopted Ordinance 11-2026 updating building and fire codes to align with the Wellington Fire Protection District's 2024 fire code, including solar-ready requirements. Floodplain amendments to the Land Use Code (Ordinance 13-2026) were recommended by the Planning Commission to align with FEMA's model ordinance.
