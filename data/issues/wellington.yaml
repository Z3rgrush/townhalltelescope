- title: North Poudre Irrigation Company water agreements and water master plan
  summary: The Board approved a new water supply agreement with North Poudre Irrigation Company replacing the 1983 agreement, with step-down payments in the first four years and the ability to store or convey future water. It also approved a storage and carriage operations agreement and adopted the 2025-2026 Water Distribution System Master Plan.
