- title: Flock license plate cameras and Sheriff contract
  summary: The Larimer County Sheriff's Office presented on Flock automated license plate reader cameras at locations including Highway 1/CR 9, I-25 Frontage Road/Jefferson and 6th Street/Cleveland. The Town budgeted $17,000 after a grant to offset costs was not awarded, and the Sheriff contract was on the Oct. 2 budget agenda.
