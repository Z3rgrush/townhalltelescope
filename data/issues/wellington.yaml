- title: Water supply agreements, water master plan and utility fees
  summary: On October 27 the Board was to consider a water supply agreement with North Poudre, a storage and carriage operations agreement, and the 2025-2026 Water Distribution System Master Plan. It also had new town fees and capital investment (tap) fees for water and wastewater connections on the agenda. A resident asked the Board in August to look at water options beyond reliance on Lake 3.
