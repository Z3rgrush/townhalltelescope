- title: Economic development incentive policy
  summary: The Board gave direction in August on a framework for incentives aimed at commercial development, with public benefit matching the incentive and caution about waiving tap fees. Resolution 36-2026 adopting the policy was considered August 25 and discussed affordable housing gains.
