- title: Flock license plate reader cameras and the Larimer County Sheriff's contract
  summary: The Larimer County Sheriff presented on Flock automated license plate reader cameras at five Wellington locations, including Highway 1/CR 9 and 6th Street/Cleveland Avenue. The Sheriff's Office did not win the grant it sought, and $17,000 was set aside in the 2026 budget. A resident thanked the Board for asking to remove ALPR items from the 2027 budget, which was reviewed with dispatch services.
