- title: Metropolitan district model service plan and review policy
  summary: The Board is developing a model service plan and review criteria for metro district proposals, including what public benefit justifies special district financing and possible mill levy limits (a 60 mill combined total was discussed). Work sessions were held Sept. 22 and Oct. 20.
