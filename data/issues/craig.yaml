  - Economic development
- title: Local Marketing District dissolution fund grants
  summary: Council approved the Economic Development Advisory Committee's recommendations for grants from the Local Marketing District dissolution fund. Awards included $15,000 for the Moffat County Balloon Festival, $4,000 for the Bear River Young Life car show, $15,000 for Powder Mountain Ventures/Powderbound Adventure, and $3,500 for another request. The Downtown Business Association Rock Fest also had a request approved.
  where: Citywide
