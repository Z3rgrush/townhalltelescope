- title: Craig Business and Industrial Park sketch plan
  summary: Planning and Zoning reviewed a major subdivision sketch plan for the business park. Commissioners raised concerns about vagueness, infrastructure capacity and missing sidewalks. The recommendation to Council was conditioned on adding sidewalks to comply with the Land Use Code or obtaining a variance. Staff also said a site plan and two annexations may come forward.
