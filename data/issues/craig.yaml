- title: Local Marketing District fund awards and Business Plan Competition
  summary: Council approved Economic Development Advisory Committee recommendations for Local Marketing District dissolution funds, including $15,000 for the Moffat County Balloon Festival, $4,000 for a Young Life car show and $15,000 for Powderbound Adventure. Winners of the 2026 Business Plan Competition were announced Oct. 13, with prizes up to $12,000.
