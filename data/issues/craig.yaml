- title: 2027 city budget and property tax levies (Ordinance 1186)
  summary: Council gave first reading to Ordinance No. 1186 on Oct. 27, adopting the 2027 budget, appropriations and property tax levies. A public hearing was scheduled for Nov. 10, with a second reading to follow. The Craig Urban Renewal Authority also set a hearing to adopt its own 2027 budget on Nov. 10.
