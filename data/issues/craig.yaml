- title: Craig Business and Industrial Park sketch plan
  summary: The Planning and Zoning Commission reviewed a major subdivision sketch plan for the Craig Business and Industrial Park at TBD West 1st Street. Commissioners raised concerns about how vague the plan is, building sizing and infrastructure capacity. The recommendation to Council was to approve it on condition that sidewalks are added or the plan is otherwise brought into compliance with the Land Use Code.
  where: 'TBD West 1st Street (Parcel #085501200008)'
