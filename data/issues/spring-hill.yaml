- title: New wastewater treatment plant and sewer rates
  summary: With the current plant expected to hit capacity in three years, Spring Hill held a public hearing on a facilities plan for a new plant near Ten Mile and Sweetwater Creeks and its impact on ratepayers, then moved ahead with design and bonds.
  where: Ten Mile & Sweetwater Creeks
  refs: [11, 16, 17]
  public_comment: true
- title: Storm shelter requirement for new homes
  summary: The city considered requiring storm protection in new houses and townhomes; a resident supported it and a homebuilder spoke against it.
  refs: [2]
  public_comment: true
- title: 2027 budget and exceeding the revenue-neutral rate
  summary: Spring Hill held two hearings and adopted a 2027 mill levy above the revenue-neutral rate.
  refs: [4, 9, 17]
- title: Comprehensive plan update and future land use near 191st-199th Streets
  summary: The city kicked off a comprehensive plan update with open houses and pop-ups; a resident asked that land around homes near Renner and Lackman along 191st and 199th Streets be planned to protect them.
  where: 191st-199th St near Renner & Lackman
  refs: [1, 6, 7, 9, 13]
  public_comment: true
- title: Making development review more open to the public
  summary: Council discussed better access to records and development applications, notifying nearby owners before hearings and more ways for residents to weigh in.
  refs: [9]
- title: Rezonings at 183rd and Woodland and on Madison Street
  summary: Neighbors raised environmental and site concerns about a rezoning to single-family lots at 183rd Street and Woodland Road, approved alongside a commercial-to-industrial rezoning at 19072 Madison (Bucyrus Auto).
  where: 183rd St & Woodland Rd; 19072 Madison St
  refs: [1, 4, 8, 14, 17]
  public_comment: true
- title: Ozark Ready Mix plant on Webster Street
  summary: Planners held hearings on rezoning and a conditional use permit amendment for Ozark Ready Mix at 18430 Webster Street.
  where: 18430 Webster St
  refs: [14, 17]
- title: Flooding and stormwater runoff complaints
  summary: Residents on 207th Street and Parker Street described flooding and runoff from nearby development and asked for a review of the site's stormwater plan, as the city adopted a state-required stormwater program.
  where: 207th St & Parker St
  refs: [2, 17]
  public_comment: true
- title: Fireworks and door-to-door solicitors
  summary: Residents asked to limit fireworks dates and locations and raised concerns about solicitors; free "No Soliciting" stickers were offered at City Hall.
  refs: [2, 9, 11]
  public_comment: true
- title: Road grants and Vision Zero
  summary: The city sought KDOT grants for K-7/US-169 signal timing, a 223rd Street roundabout, a 183rd Street signal and South Street sidewalks, and adopted a Vision Zero safety policy.
  where: K-7/US-169; 223rd St; 183rd St; South St
  refs: [4, 9, 11]
- title: Planning commission membership rules
  summary: Amendments to planning commission and zoning appeals rules covered attendance-based removal and appointing non-residents.
  refs: [8, 14]
