- title: Sterling sales tax ballot question for road repair
  summary: The City of Sterling is asking voters to raise its sales tax from 3% to 4% for five years, with all money dedicated to city road maintenance. A similar measure failed last year. The commissioners can't spend public money on it but discussed passing a resolution encouraging a vote and asked about sewer drainage study questions.
