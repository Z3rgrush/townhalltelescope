- title: Permit Gateway for oversize and overweight transport permits
  summary: Road and Bridge staff described how manual oversize/overweight permits are slow, especially for weekend requests. The Board supported moving to Permit Gateway, which is free to the county, with carriers paying a service fee, and provides road maps and restrictions.
