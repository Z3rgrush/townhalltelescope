- title: CR 26 bridge and county bridge grants
  summary: The Road and Bridge department weighed applying for a bridge planning and engineering grant for the CR 26 bridge but decided not to pursue it, since the board didn't want the bridge closed for a 2-3 year project. The board decided to hold a public meeting on the bridge's future, and discussed other narrow bridges and an engineer for a cheaper design.
