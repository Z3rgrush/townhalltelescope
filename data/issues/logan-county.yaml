- title: CR 26 bridge and off-system bridge grants
  summary: The board decided not to pursue a bridge planning grant for the CR 26 bridge and instead keep it open, and agreed to hold a public meeting on the bridge's future. They also discussed hiring an engineer experienced with diversion structures and a narrow old bridge near Proctor/Crook.
