- title: Rural Health Transformation grant and ambulance funding for Logan County Ambulance
  summary: Sterling Fire and county EMS leaders discussed applying for the Rural Health Transfer/Transformation grant (deadline Aug. 3) to fund whole blood, a community paramedic program and interfacility transports. They also looked at replacing ambulances (a $337,000 quote) using a CDPHE grant with a 10% match waiver. By Sept. 29 they reported the group was approved for something under the grant.
