- title: Rural Health Transformation grant for EMS interfacility transports
  summary: Sterling Fire and county EMS leaders pursued a Rural Health Transformation Program grant contract to fund interfacility ambulance transports. The signing deadline moved to Oct 28, requiring a special meeting. Gaps in wellness funding and audit requirements were being reviewed by the county attorney and city.
