- title: EMS and ambulance budget for 2027
  summary: The Sterling Fire Department EMS battalion chief asked for guidance on moving a $14,000 RETAC training grant into 2027 and pursuing a CDPHE ambulance grant (about $40,000 match on a $337,000 ambulance). The city and county are also sorting out how to split costs, and the city wants a 3% cost-of-living raise included.
