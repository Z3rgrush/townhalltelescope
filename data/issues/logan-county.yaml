- title: Prairie dog proposal before Colorado Parks and Wildlife
  summary: The Commissioners discussed a petition and proposed rules on prairie dogs before the Colorado Parks and Wildlife Commission. Speakers questioned whether local voices would be heard and said the proposal lacks compensation for landowners, and people were urged to submit written comments.
