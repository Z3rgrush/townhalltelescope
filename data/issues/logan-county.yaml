- title: CR 26 bridge closure and county bridge grants
  summary: The Board weighed applying for a bridge planning and engineering grant for the CR 26 bridge, but decided not to pursue it and not to close the bridge for a multi-year project. They planned a public meeting, and a public hearing on a bridge closure near CR 26 and CR 29 was set on the Oct. 20 agenda.
