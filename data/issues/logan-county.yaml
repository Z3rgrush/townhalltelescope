- title: 2027 EMS and county budget planning
  summary: Sterling Fire EMS staff sought guidance on the 2027 budget, including moving a $14,000 RETAC training grant, building up capital funds for an ambulance grant (a CDPHE grant needing about $40,000 match on a $337,000 ambulance), and how to split costs with the City, which wants a 3% cost-of-living raise. Sheriff vehicle replacement and $233,000 in hail-damage proceeds for Road and Bridge vehicles also feed into next year's budget.
