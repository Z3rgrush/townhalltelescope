  summary: DOLA's regional manager said state grant money is tight but CDBG and REDI funds remain, and a possible $50,000 housing planning award for a joint Sterling and county comprehensive plan would require a county match. The county plan dates to 2013 or earlier and predates data centers and battery storage.
