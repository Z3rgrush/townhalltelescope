- title: Prairie dog rules and Parks and Wildlife Commission petition
  summary: Commissioners discussed a petition before the Colorado Parks and Wildlife Commission about prairie dogs, with the topic on the November CPW agenda. Commissioners urged residents with prairie dog problems to submit written comments through Engagecpw.com. Speakers raised concerns about compensation for landowners and local voices being heard.
