- title: Underground fire-suppression water tank at CR 70 and CR 11
  summary: The Centennial Soil Conservation District won a $30,000 state resiliency grant to bury a 10,000-gallon water tank for wildfire fighting in the northwest corner of the county, where hauling water is a long trip. The Board agreed to maintain County Road 11, including snow removal, and help as much as possible.
