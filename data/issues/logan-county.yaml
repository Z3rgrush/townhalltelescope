- title: Sterling road-maintenance sales tax ballot question
  summary: Sterling plans a ballot question to raise its sales tax from 3% to 4% for five years, with the money dedicated to city road maintenance. A similar measure failed last year. The Commissioners can't spend public money on it but the county attorney will draft a resolution they could pass encouraging a vote.
  where: City of Sterling
  refs:
