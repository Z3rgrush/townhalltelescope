- title: Sterling sales tax increase for road repair
  summary: A City of Sterling representative briefed commissioners on a ballot question raising the city sales tax from 3% to 4% for five years, dedicated to road maintenance. A similar measure failed last year. The county attorney will draft a resolution, since the Board can encourage but not spend public money on the vote.
