- title: Permit Gateway online oversize/overweight permits
  summary: Road and Bridge staff proposed adopting Permit Gateway, a free system where carriers pay a service fee, to automate oversize and overweight permits and route trucks away from restricted roads and bridges. The Board indicated support for moving forward.
