- title: South Platte Metropolitan District wastewater violations and rental treatment unit
  summary: The district serving an HOA community has about 170 discharge violations to groundwater and a cease-and-desist order. It is paying roughly $28,000 to $78,000 a month for a rental temporary treatment unit, is raising rates, and is struggling to get loans or grants. The Commissioners reviewed its finances and plan on Oct. 27.
  where: South Platte Metropolitan District (Logan County)
