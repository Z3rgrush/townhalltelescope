- title: 2027 EMS and ambulance budget
  summary: EMS leaders sought guidance on the 2027 budget, including moving a $14,000 RETAC training grant into 2027 and a capital fund for ambulance grants. They plan to pursue a CDPHE grant with a roughly $40,000 county match on a $337,000 ambulance, and are splitting shared costs between county and city budgets. The city also wants a 3% cost-of-living raise included.
