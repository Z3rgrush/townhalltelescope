- title: Underground fire water tank at County Roads 70 and 11
  summary: The Centennial Soil Conservation District won a $30,000 state resiliency grant to bury a 10,000-gallon fire suppression tank in the northwest part of the county, where water hauls are long. The board agreed to maintain and plow the section of County Road 11 to the site.
