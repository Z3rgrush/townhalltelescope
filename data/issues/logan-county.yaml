- title: County Road 26 bridge and bridge grants
  summary: The Board weighed applying for a bridge planning and engineering grant for the CR 26 bridge, but decided against pursuing the grant and not to close the bridge for a multi-year project. It decided to hold a public meeting about the bridge's future and discussed other narrow, old bridges near Proctor/Crook. Off-system bridge grants also came up earlier.
