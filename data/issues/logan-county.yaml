- title: County employee health pool rates
  summary: County Health Pool rates dropped this year, with the employee-only plan down $11 and the family plan down $26, and dental moves to Ameritas at the same rates. Staff asked about separate tier rates and a stipend for older employees; the county pays 65% of family premiums.
