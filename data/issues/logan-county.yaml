- title: Sage Pointe wastewater plant violations and rental unit costs
  summary: The Sage Pointe metropolitan district reported about 170 violations for discharging to groundwater, a cease-and-desist order, and a temporary rented treatment unit that began around $28,000 per month. The district is working on rates, lender and state loan hurdles, and payment plans with unpaid vendors, and commissioners asked about those unpaid costs.
