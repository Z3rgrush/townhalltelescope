  topics:
  - Roads & traffic
  - Budget & taxes
  - Elections
- title: Rural Health Transformation Program grant for ambulance interfacility transports
  summary: Sterling Fire/EMS was approved for a federal Rural Health Transformation Program grant to advance EMS and handle interfacility transports. The contract needed county and city attorney review and a special meeting by Oct. 27-28. Concerns include missing wellness funding for paramedic positions and whether the county audit covers the federal funds.
