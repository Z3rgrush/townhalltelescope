- title: Summit Carbon Solutions pipeline and carbon sequestration resolution
  summary: Summit Carbon Solutions told the Board it hopes to build as much of its route as possible through voluntary landowner agreements, with surveys starting and construction not expected until mid- to late-term. The County has recently adopted new pipeline fees and setbacks, and the Board reviewed a revised carbon sequestration resolution 2026-32 in October.
