- title: Summit Carbon Solutions pipeline and carbon sequestration resolution
  summary: Summit Carbon Solutions told the Board it is in early stages, with surveys starting and construction not expected until mid- to late-period, and hopes to use voluntary landowner agreements. The county has just adopted new pipeline fees and setbacks, and a revised carbon sequestration resolution 2026-32 came up Oct. 6.
