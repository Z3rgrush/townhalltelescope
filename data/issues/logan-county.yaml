- title: Rural Health Transformation Program grant for Sterling Fire/EMS ($2.1 million)
  summary: Sterling Fire and the County are contracting for a federal Rural Health Transformation Program grant through the State, totaling $2,105,514, to advance EMS services including interfacility transports. The Board and staff reviewed the contract in October, noted that planned wellness funding for community paramedic and medical director positions was omitted, and raised audit and confidentiality questions. A special meeting was set for October 27 to sign it.
