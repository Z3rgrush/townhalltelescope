  topics:
  - Utilities
  - Environment & climate
  - Fees & rates
- title: Sterling splash pad proposed downtown
  summary: The Sterling Community Fund asked the Commissioners for advice and possible approval of a concrete splash pad downtown near an urban park, to draw foot traffic and build the tax base. A private donor has offered $100,000, and the fund would cover water, sewer and upkeep. Concerns raised include parking, aesthetics and restroom cleanup.
  where: Downtown Sterling, near Fourth Street
