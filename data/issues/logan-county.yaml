- title: Fire suppression water tank at CR 70 and CR 11
  summary: Centennial Soil Conservation District won a $30,000 state resiliency grant to bury a 10,000-gallon fire water tank in the northwest corner of the county, where tender hauls are long. The Board agreed to maintain the road, including snow removal, and help as possible.
