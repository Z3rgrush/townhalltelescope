- title: Sterling sales tax ballot question for road repair
  summary: Sterling officials asked the Board to support a ballot question raising the city sales tax from 3% to 4% for five years, dedicated to road maintenance in the city. A similar measure failed last year. The County Attorney will draft a resolution, since the Board can encourage votes but not spend public money.
  where: City of Sterling
