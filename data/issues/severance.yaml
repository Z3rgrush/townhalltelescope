- title: 2027 Capital Improvement Program
  summary: Council reviewed the final draft of the 10-year capital plan, of which only 2027 projects get funded in the 2027 budget. New or updated items include a 2036 Police Department addition, more money for water acquisition, and more for Town Park improvements including a restroom. A Town Projects & Budget session was also set for Oct. 13.
