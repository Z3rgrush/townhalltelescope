- title: 'Land use code amendments: oil and gas setbacks, setbacks in Town Core, and fast-track amendments'
  summary: The Planning Commission took up several code changes. One aligns oil and gas setbacks with Weld County regulations. Another corrects setbacks in the Town Core and Development Node zones. A third lets Town Council adopt time-sensitive code amendments without a prior Planning Commission recommendation. The Commission also approved procedures for suspending land use applications at an applicant's request and rules on electric service infrastructure for new development, and an early grading permit change followed.
