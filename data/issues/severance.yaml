- title: Land Use Code amendments before the Planning Commission
  summary: 'The Planning Commission took up several code changes: letting Town Council adopt time-sensitive Land Use Code amendments without a prior Commission recommendation, corrected setbacks in the Town Core and Development Node zones, oil and gas setbacks aligned with Weld County rules, and procedures for suspending land use applications at an applicant''s request. It also considered electric service infrastructure rules for new development and an early grading permit ordinance. Several items drew a ''no action'' vote, while the application suspension and electric service resolutions were approved.'
