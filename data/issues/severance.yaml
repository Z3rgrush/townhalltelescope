- title: 'Land use code changes: setbacks, time-sensitive amendments, suspended applications, early grading'
  summary: Planning Commission handled a package of code changes. These include fixing setbacks in Town Core and Development Node zones, letting Council adopt time-sensitive code amendments without prior Planning Commission recommendation, procedures for suspending applications at an applicant's request, and early grading permit rules. Council had the early grading ordinance (2026-13) and a setback ordinance (2026-15) on its Oct. 27 agenda.
