  summary: The Town Council scheduled public hearings on Ordinance 2026-11 (Bower North Metropolitan District consolidated service plan) and Ordinance 2026-12 (Northgate Lakes Metropolitan District consolidated service plan) for Sept. 22. The documents list the hearings but do not state the outcome.
