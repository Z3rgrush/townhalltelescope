- title: 2027 budget, property tax levy and fee schedule
  summary: On Nov. 10 the Town Council was scheduled to hold a public hearing on the Fiscal Year 2027 budget and to act on the 2027 property tax levy and appropriation. The same meeting covered the town fee schedule, water and wastewater rates, an amended Transportation Utility Fee, and a change to development impact fees.
