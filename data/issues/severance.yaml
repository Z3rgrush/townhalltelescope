- title: 2027 Capital Improvement Program and budget
  summary: Town Council reviewed the final draft of the 2027 Capital Improvement Program, a 10-year plan in which only 2027 projects get funded in the 2027 budget. New or increased items include a 2036 Police Department addition, more money for the water acquisition program, and a restroom added to the Town Park improvements. A 2027 Town Projects and Budget town hall is set for Oct. 13.
