- title: Historic Preservation Ordinance and Historic Register update
  summary: A public hearing at the Environmental Planning Commission on Aug 19 covered amendments to the zoning code on historic resources and a zoning map change updating the historic register. Council had the second reading to adopt both ordinances on Oct 13. Public comments were attached to the staff report.
