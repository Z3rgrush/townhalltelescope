- title: 'Affordable housing financing: 96 West El Camino Real and 334 San Antonio Road'
  summary: Council considered accepting $388,515 in state Permanent Local Housing Allocation funds, with money directed to the 96 West El Camino Real affordable project and a homeownership assistance pilot. It also considered tax-exempt bond financing for 96 West El Camino Real and for 334 San Antonio Road.
