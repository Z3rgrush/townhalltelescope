  summary: Staff presented the Rengstorff Complete Streets Study (bike lane gaps, road diets, sidewalk access) and the final Active Transportation Plan. The bike/ped committee recommended the plan 5-0 with added language on smaller-scale projects. It then went to the Council Transportation Committee for a recommendation on adoption.
