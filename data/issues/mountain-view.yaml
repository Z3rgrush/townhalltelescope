- title: Heritage tree removal appeals
  summary: The Urban Forestry Board denied the 961 Eichler Drive appeal and approved the appeal for a heritage tree at 777 San Carrizo Way, overturning staff. An appeal for 1473 Tyler Park Way is set for October 14. Commissioners asked for coordination on the Heritage Tree Ordinance update, which is also on the October 14 agenda. Other hearings involve tree removals at an affordable housing site and 26 trees at a mobile home park.
