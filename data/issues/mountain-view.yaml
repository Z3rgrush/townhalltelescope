- title: R3 Zoning District Update (R3/R4 rezoning and General Plan amendments)
  summary: The Environmental Planning Commission was set to consider on Oct 7 recommending adoption of the R3 Zoning District Update. It would certify an environmental review, amend the General Plan map, and rezone areas to R4 in 14 change areas and to new R3-A, R3-B and R3-C districts, implementing state housing laws.
  where: Citywide
