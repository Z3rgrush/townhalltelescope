  topics:
  - Zoning & development
  - Housing
- title: Rowhouse project at 924-940 San Rafael Avenue
  summary: A gatekeeper project would replace two industrial buildings with a 36-unit rowhouse development using state density bonus law. It needs a rezoning from MM (General Industrial) to R3-2, a General Plan amendment, a vesting tentative map and removal of two heritage trees on 1.80 acres.
  where: 924-940 San Rafael Avenue
