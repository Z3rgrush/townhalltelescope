- title: R3 and R4 zoning district update
  summary: The Environmental Planning Commission is set to consider recommending adoption of an R3/R4 zoning update on October 7, 2026. It includes general plan amendments, a zoning map change applying R4 in 14 change areas and new R3-A, R3-B and R3-C districts, and an environmental impact report certification.
  where: Citywide
  refs:
  - 35
  topics:
  - Zoning & development
  - Housing
- title: 36-unit rowhouse project at 924-940 San Rafael Avenue
  summary: The Environmental Planning Commission will hear a gatekeeper project on October 21, 2026. It would rezone two parcels from industrial (MM) to R3-2 and replace two industrial buildings with 36 rowhouses under state density bonus law. It also needs a general plan amendment, a vesting tentative map, and removal of two heritage trees.
  where: 924-940 San Rafael Avenue
