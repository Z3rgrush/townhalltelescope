- title: R3 and R4 Zoning District Update
  summary: The Environmental Planning Commission is set to consider recommending adoption of the R3 Zoning District Update. It would update R3 and R4 zoning, amend the General Plan land use map, and rezone areas into new R3-A, R3-B, R3-C and R4 districts, including 14 R4 change areas.
  where: Citywide
  refs:
