- title: R3 Zoning District Update (R3/R4 zoning, General Plan and map changes)
  summary: The Environmental Planning Commission is scheduled to hear the recommendation to adopt the R3 and R4 zoning amendments, precise plan and General Plan amendments, and a zoning map change on October 7. The map change would apply R4 in 14 change areas and new R3-A, R3-B and R3-C districts across the city, with an environmental impact report certification and statement of overriding considerations.
  where: Citywide
