- title: Rengstorff Complete Streets Study and Active Transportation Plan
  summary: The Bicycle/Pedestrian Advisory Committee heard the Rengstorff Complete Streets Study (Project 25-39) and voted 5-0 on August 18 to recommend the final Active Transportation Plan. It asked for added language on smaller-scale projects and for Los Altos schools on the maps. The Council Transportation Committee took up both items on August 31.
