  topics:
  - Zoning & development
  - Housing
- title: Rowhouse project at 924-940 San Rafael Avenue
  summary: The Environmental Planning Commission is to hear a gatekeeper project replacing two industrial buildings with a 36-unit rowhouse development using State Density Bonus Law. It needs a rezoning from MM (General Industrial) to R3-2, a General Plan amendment, a PUD permit, removal of two Heritage trees and a tentative map.
  where: 924-940 San Rafael Avenue
