- title: Rowhouse Gatekeeper Project at 924-940 San Rafael Avenue
  summary: The Environmental Planning Commission is set to hear a proposal to rezone 924-940 San Rafael Avenue from General Industrial to R3-2 and build a 36-unit rowhouse development using state density bonus law, replacing two industrial buildings. It includes a General Plan amendment, two heritage tree removals on the 1.80-acre site, and a vesting tentative map.
  where: 924-940 San Rafael Avenue
