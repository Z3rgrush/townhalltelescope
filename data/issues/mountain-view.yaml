  topics:
  - Housing
  - Zoning & development
- title: LinkedIn development agreement amendment
  summary: Council introduced an amendment to LinkedIn's development agreement on October 13, 2026, and an adoption was on the October 27 consent agenda. A $1.6 million public benefit fee would go to the Mountain View Affordable Housing Fund once the funds are received.
  where: 700-810 East Middlefield Road and 1100-1200 Maude Avenue
