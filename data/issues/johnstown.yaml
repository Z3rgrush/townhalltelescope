- title: FY 2027 budget and mill levy
  summary: Council held a preliminary FY 2027 budget work session on Sept. 28. Staff recommended keeping the full 23.947-mill levy because property tax revenue keeps declining, and the budget also covers sewer and water revenue bond debt. On Oct. 5 Council took up a resolution acknowledging receipt of the preliminary budget, and a FY 2026 budget amendment was also on the Sept. 9 agenda.
