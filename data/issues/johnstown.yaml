- title: Stormwater rate study and master plan
  summary: The Stormwater Utility fee has stayed at $5 per equivalent residential unit, with a $1,100/acre development charge, since the enterprise was set up in 2004. A consultant's master plan and rate study proposes rate increases to pay for a tiered list of capital projects.
