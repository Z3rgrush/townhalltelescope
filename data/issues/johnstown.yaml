- title: Property tax mill levy cut of 8 mills and the FY 2027 budget
  summary: Staff's preliminary FY 2027 budget keeps the full 23.947-mill levy, citing falling property tax revenue. Council then took up Ordinance 2026-299, which would permanently cut the levy by 8.000 mills in four annual steps of 2.000 mills, with any later increase needing voter approval. The 2027 proposed budget was on the Nov. 2 agenda, and a resident asked for trees at Clearview Park in it.
