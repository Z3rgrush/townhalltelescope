- title: Housing needs assessment and comprehensive plan updates (SB 24-174)
  summary: Staff presented a draft Housing Needs Assessment by ECOnorthwest plus new Strategic Growth and Water Supply elements of the comprehensive plan, required by state law. Planning and Zoning is to consider them November 18 and Council adoption is slated for December 2. A Housing Action Plan follows in mid-2027.
