- title: Water supply, water rates and NISP
  summary: Council discussed the Northern Integrated Supply Project and later considered the Twenty-Second Interim Agreement for NISP participation. It also considered a Water System Master Plan update with J-U-B Engineers (up to $326,400), a Raw Water Transmission Project services agreement with Connell Resources, and the purchase of 15 CBT units. A resident commented on water usage at town facilities and on water rates.
