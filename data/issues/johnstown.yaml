- title: Permanent property tax mill levy cut of 8 mills
  summary: Ordinance 2026-299 would permanently reduce the town's mill levy by 8.000 mills in four annual steps of 2.000 mills. Any increase above the reduced levy would need new voter approval, and staff would handle the General Fund impact without restoring mills. This came to a public hearing on Oct. 19.
