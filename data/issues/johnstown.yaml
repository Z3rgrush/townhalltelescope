- title: I-25 East Frontage Road transfer from CDOT
  summary: Council held a public hearing on Ordinance 2026-297 on Aug. 17. It would accept a portion of the I-25 East Frontage Road between mile markers 253.2 and 257.1 and approve an intergovernmental agreement with CDOT to devolve the road to the town. The ordinance was back on the Sept. 9 agenda.
