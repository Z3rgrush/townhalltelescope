- title: Permanent 8-mill property tax cut and FY 2027 budget
  summary: Council reviewed the FY 2027 preliminary budget, which recommended keeping the 23.947-mill levy, and then took up Ordinance 2026-299 to permanently cut the mill levy by 8.000 mills in four annual 2-mill steps. Any later increase would need new voter approval. The 2027 proposed budget came up for public hearing in November, and a resident asked for trees at Clearview Park.
