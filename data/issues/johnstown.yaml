- title: Stormwater rate study and fee increase
  summary: Council heard a Stormwater Master Plan rate study on Aug. 10. The stormwater fee of $5 per equivalent residential unit per month and the $1,100 per acre development charge have not been adjusted since the enterprise was set up in 2004. Staff proposed rate adjustments to pay for a tiered list of capital projects.
