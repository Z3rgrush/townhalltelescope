  summary: To comply with state Senate Bill 24-174, consultant ECOnorthwest drafted a housing needs assessment plus strategic growth and water supply elements for the comprehensive plan. Council held a work session Oct. 26. Planning and Zoning is to consider the drafts Nov. 18 and Council is to consider adoption Dec. 2, with a Housing Action Plan to follow in mid-2027.
