- title: Permanent property tax mill levy cut of 8 mills (Ordinance 2026-299)
  summary: Council considered an ordinance permanently reducing the town's property tax mill levy by 8.000 mills in four annual steps of 2.000 mills. Any future increase would need new voter approval, and staff are directed to handle general fund impacts without restoring mills. It follows the FY2027 budget work, where staff recommended keeping the 23.947-mill levy because property tax revenue has declined.
