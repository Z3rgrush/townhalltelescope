- title: Proposed 2027 town budget and Main Street funding request
  summary: The Board of Trustees took up the proposed 2027 budget in October and held a second presentation on Nov. 10. The Water and Wastewater Authority also had its own 2027 budget presented on Nov. 10, and Kiowa Main Street made a 2027 funding request to the town.
