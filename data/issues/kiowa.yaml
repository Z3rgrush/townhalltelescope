- title: New 2026 Zoning Code replacing Chapter 16
  summary: The Planning Commission was asked on July 15 to approve the 2026 Zoning Code Update as the town's official zoning ordinance. On Oct. 13 the Board of Trustees held a public hearing on Ordinance 2026-08, which would repeal and replace Chapter 16 and adopt a new zoning code.
