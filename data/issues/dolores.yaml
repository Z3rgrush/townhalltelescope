- title: 2026 fee schedule, business license fees and Ordinance 591
  summary: The Board reworked town fees. Ordinance 591 sets procedures for license renewal, late fees and enforcement and lets fees be set by resolution. It passed on second reading Aug. 10. On July 27 the Board set the business license fee at $30 with a $50 late fee. Short-term rental permit fees were questioned, and a business owner objected to a late fee.
