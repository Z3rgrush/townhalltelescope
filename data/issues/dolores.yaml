- title: Town Attorney resignation and new legal services
  summary: Town Attorney Ethan Sumrall resigned, and the Board accepted his resignation on Oct. 12 (Resolution 723). It approved a legal services agreement with Holligan Westendorff, PLLC. The Board also agreed to hire a water law attorney for river water rights.
