- title: Fee schedule update and Ordinance 591
  summary: The town rewrote its fee schedule and adopted Ordinance 591, which lets fees be set by resolution and sets renewal, late-fee and enforcement procedures. The board set the business license fee at $30 with a $50 late fee, and short-term rental permit fees were questioned. A business owner contested her late fee.
