- title: Phase 2 Water Project funding and water main replacement
  summary: The town is funding Phase 2 of its water project through a DWRF loan agreement (Resolutions 700 and 719) and about $700,000 in DOLA funding. Phase 2 construction is expected to start in spring 2027, and the water main replacement continues. Water rates were also on the agenda.
