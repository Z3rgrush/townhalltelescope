- title: Broc's Development PUD and rezoning of 206 and 207 South Third Street
  summary: KKV Development's Broc's Development concept plan drew neighbor concerns about density, three-story buildings, parking, infrastructure and spot zoning. The Board reviewed the concept in May. Ordinance 592, rezoning 206 and 207 South Third Street from Downtown Mixed Use, had a first reading in August and was moved for approval on second reading on September 14.
