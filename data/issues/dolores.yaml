- title: Phase 2 water project and water main replacement funding
  summary: The town is funding Phase 2 of its water infrastructure project, with about $700,000 from DOLA and a DWRF loan agreement (Resolutions 700 and 719). Construction is expected to start in spring 2027, and the water main replacement continues. Staff also got consensus to hire a water law attorney on town water rights and to meter Riverside Park.
