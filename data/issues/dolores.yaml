- title: Special events, parks and Flanders Park projects
  summary: The Board discussed rules for large events and special event liquor permits. A softball tournament organizer asked for a park fee waiver. The Galloping Goose Historical Society asked to add a structure in Flanders Park. The Board also took up a GOCO project, dry parks and a scoreboard.
