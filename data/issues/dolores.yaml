- title: Fire hazards, fire bans and wildfire code
  summary: The town adopted county fire restrictions in April and hired tree cutting along the escarpment to reduce fire risk. Residents thanked the Board for not adopting the Colorado Wildfire Resiliency Code. Ordinance 594 adopting the 2024 International Codes had its first reading in October.
