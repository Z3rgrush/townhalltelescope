- title: 2026 fee schedule, business license fees and Ordinance 591
  summary: Staff proposed a fee schedule overhaul and Ordinance 591, which lets fees be set by resolution and sets renewal, late-fee and enforcement procedures. Trustees debated business license and short-term rental permit fees. The Board agreed on a $30 business license fee with a $50 late fee, and Ordinance 591 passed on second reading August 10. A business owner later protested a late fee.
