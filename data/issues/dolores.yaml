- title: Rezoning of 206 and 207 South Third Street (Ordinance 592)
  summary: Applicant Broc Smith asked to rezone 206 and 207 South Third Street from Downtown Mixed Use. Neighbors raised concerns about traffic, lost business opportunities and spot zoning. The Board held a first reading on Aug. 10 and approved Ordinance 592 on second reading in September.
