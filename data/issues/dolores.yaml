- title: Town Attorney resignation and new legal services
  summary: Town Attorney Ethan Sumrall announced his resignation, and the Board accepted it by Resolution 723 on Oct. 12. It approved a legal services agreement with Holligan Westendorff, PLLC. In July the Board also agreed to hire a water law attorney for town water rights.
