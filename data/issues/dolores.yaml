- title: 2024 International Codes adoption
  summary: Ordinance 594 adopts the 2024 International Codes. It passed first reading October 12 and had a hearing and second reading November 9. A resident asked about triple-pane windows and was told they would not be required. Residents also thanked the Board for not adopting the Colorado Wildfire Resiliency Code.
