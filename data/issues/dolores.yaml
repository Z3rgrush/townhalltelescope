- title: 2026 fee schedule, business license fees and Ordinance 591
  summary: The Board reworked town fees, including the business license, short-term rental permits, parks and building fees. Ordinance 591 gives authority to set fees by resolution and sets renewal, late fee and enforcement procedures; it passed on second reading Aug. 10. On July 27 the Board set the business license fee at $30 with a $50 late fee, and a business owner later objected to a late fee she was charged.
