- title: Phase 2 water project and main line replacement funding
  summary: The town is funding water main replacement and the Phase 2 water project through a DOLA award of about $700,000 and Drinking Water Revolving Fund loan agreements (Resolutions 700 and 719). Phase II construction is expected to start in spring 2027.
