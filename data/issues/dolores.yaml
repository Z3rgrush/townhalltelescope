- title: Broc's Development PUD and rezoning of 206 and 207 South Third Street
  summary: The board reviewed a PUD concept plan from KKV Development/Broc Smith in May, with neighbors raising concerns about parking, three-story buildings, infrastructure and density. Ordinance 592, rezoning 206 and 207 S. Third Street from Downtown Mixed Use, had its first reading in August and was moved for approval on second reading on Sept. 14.
