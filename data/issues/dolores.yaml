- title: Broc's Development PUD and rezoning of 206 and 207 South Third Street
  summary: Broc Smith's (KKV Development) project on 3rd Street/Riverside Avenue went through a PUD concept review in May 2026, with residents raising concerns about parking, three-story height, infrastructure and density. The Board then took up Ordinance 592 rezoning 206 and 207 South Third Street from Downtown Mixed Use. It had a first reading in August, with speakers calling it possible spot zoning and asking for a traffic study, and was approved on second reading on Sept. 14.
