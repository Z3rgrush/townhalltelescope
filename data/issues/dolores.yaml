- title: Broc's Development PUD and rezoning of 206 and 207 South Third Street
  summary: Neighbors raised concerns about density, three-story buildings, parking, roads, lighting and infrastructure at the KKV/Broc Smith project on South Third Street. The Board approved the PUD concept plan on May 11, held hearings on Ordinance 592 rezoning the parcels from Downtown Mixed Use in August, and approved it on second reading on Sept. 14. Residents also raised spot-zoning and traffic study concerns.
