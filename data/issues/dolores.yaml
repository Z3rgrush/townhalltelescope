- title: Phase 2 water project and main line replacement funding
  summary: The Town is funding the Phase 2 water infrastructure project and the water main replacement through a DWRF loan (Resolutions 700 and 719) and about $700,000 in DOLA funding. Phase 2 construction is expected to start in spring 2027. The Town manager also got Board consensus to hire a water law attorney on river water rights.
