- title: Wildfire mitigation grants and fire restrictions
  summary: The county committed $51,000 over three years to the Clear Creek Watershed & Forest Health Partnership's grant application for forest restoration and wildfire risk mitigation. It also coordinated a Community Wildfire Defense Grant and supported fuels reduction projects. Stage 2 fire restrictions were lowered to Stage 1 on Sept. 8, and Resolution 26-099 removed the remaining restrictions in late October.
