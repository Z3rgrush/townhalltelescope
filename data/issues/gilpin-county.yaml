- title: Wildfire mitigation, restrictions and grants
  summary: The county reduced Stage 2 fire restrictions to Stage 1 on Sept. 8 and removed restrictions on Oct. 26. It also committed $51,000 over three years to the Clear Creek Watershed & Forest Health Partnership's wildfire grant application, and discussed wildfire defense grant coordination, the Community Wildfire Protection Plan and a letter of support for the Dove Creek Ranch fuels reduction project.
