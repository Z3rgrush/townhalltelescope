- title: Rollinsville area fire-protection cistern projects
  summary: The commissioners considered Resolution 26-085 to develop and jointly procure fire-protection cisterns near Rollinsville, choosing between the East/Gold Dirt and West/Public Works sites. On Sept. 8 the resolution was reworded to cover coordinated procurement of both projects.
