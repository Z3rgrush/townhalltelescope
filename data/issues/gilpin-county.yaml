- title: Rollinsville area fire-protection cistern projects
  summary: The county considered Resolution 26-085 to develop a fire-protection cistern for the Rollinsville area, choosing between the East/Gold Dirt and West/Public Works sites. By Sept. 8 the resolution covered coordinated procurement of both cistern projects.
