- title: Rollinsville area fire-protection cisterns
  summary: The commissioners took up Resolution 26-085 to develop a community cistern for fire protection in the Rollinsville area, choosing between the East/Gold Dirt and West/Public Works cistern projects. By Sept. 8 the resolution covered coordinated procurement of both projects.
