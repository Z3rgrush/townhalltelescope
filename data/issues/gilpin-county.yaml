- title: Rollinsville area fire-protection cisterns
  summary: The commissioners considered Resolution 26-085 to develop and jointly procure fire-protection cisterns in the Rollinsville area, choosing between the East/Gold Dirt and West/Public Works sites. By Sept. 8 the resolution covered both projects.
