- title: Rollinsville Plan grant extension
  summary: The county requested a nine-month extension of DOLA EIAF Grant No. 9953 for the Rollinsville plan and infrastructure feasibility study. It cited staff turnover in 2025 and problems with the consultant's work, including scope and water-use assumptions. The scope and grant amount are unchanged.
