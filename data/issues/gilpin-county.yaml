- title: Clear Creek watershed forest health and wildfire mitigation
  summary: The county discussed a Forest Improvement District in the Clear Creek Watershed. It also took up Resolution 26-094, committing a $51,000 match over three years to the Clear Creek Watershed & Forest Health Partnership's grant application for forest restoration and wildfire risk mitigation. Related items include a Community Wildfire Defense Grant coordination, letters of support for fuels reduction projects, and Dove Creek Ranch.
