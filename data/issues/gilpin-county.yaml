- title: Wildfire restrictions, forest health and wildfire planning
  summary: The county lowered Stage 2 fire restrictions to Stage 1 on Sept. 8, then removed restrictions in late October. It committed $51,000 over three years as a match for the Clear Creek Watershed & Forest Health Partnership's wildfire mitigation grant. Staff also coordinated wildfire defense grants and updated wildfire and hazard mitigation plans.
