- title: 'Lake County E911 Authority: dispatch restructuring, 2027 budget and PUC surcharge application'
  summary: The E911 Authority spent August to October on reorganizing dispatch, a revised 2027 budget, and an application to the Colorado PUC for an increase in the emergency telephone charge (Resolution 26-01), citing the dispatch facility, NG911 GIS and radio recording needs. Resolution 26-02 would adopt the 2027 budget. The board also took up hiring standards and a CentralSquare software agreement that replaces the current Motorola/Flex contract.
