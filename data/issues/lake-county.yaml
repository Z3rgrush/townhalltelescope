- title: Leadville–Lake County fire IGA and firefighter pay
  summary: A new intergovernmental agreement between the City of Leadville and the County for Leadville-Lake County Fire Rescue was considered Oct. 20 and later noted as approved by City Council and the commissioners. At the Fire Management Board, the union president said firefighters earn about 25% less than sheriff deputies and proposed raising pay to 90% of deputy pay. Highway 91 safety concerns were also raised.
  where: Leadville fire stations, 816 Harrison Ave and 141 County Road 10
