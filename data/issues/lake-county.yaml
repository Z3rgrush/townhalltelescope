- title: Leadville-Lake County Fire Rescue IGA with the City of Leadville
  summary: The Fire Management Board reviewed a draft intergovernmental agreement under which the City of Leadville runs the fire department for the city and unincorporated county. It covers two stations (816 Harrison Ave and 141 County Road 10), annual cost-sharing and fallback funding. Commissioners were to consider the IGA on Oct. 20 alongside a discussion of shared services with the City.
  where: 816 Harrison Avenue and 141 County Road 10, Leadville
