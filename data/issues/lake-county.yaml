- title: Affordable housing, Prop 123 IGA and Housing Authority
  summary: The Regional Housing Authority gave its semi-annual report to commissioners on its strategic plan, housing pipeline and 2027 budget. Commissioners also considered a first amendment to the Prop 123 IGA on affordable housing commitments, which calls for a cumulative 9 percent increase in affordable housing inventory and expedited review.
