- title: Lake County E911 Authority restructuring, PUC rate application and 2027 budget
  summary: The E911 Authority is discussing a restructuring of Lake County 911 dispatch operations, a hiring and professional standards resolution, and a draft proposal on Public Utilities Commission complications. On Oct. 2 it was to consider Resolution 26-01 (PUC application seeking an emergency telephone charge increase) and Resolution 26-02 (2027 budget). The commissioners also looked at options for an offsite E911 dispatch office.
