- title: Leadville-Lake County fire rescue IGA and fire funding
  summary: The Fire Management Board reviewed a draft intergovernmental agreement between Leadville and Lake County on fire protection, covering two stations (816 Harrison Ave and 141 County Road 10), cost sharing and fallback funding, plus preliminary fire budget figures. The commissioners were set to consider the IGA on Oct 20 along with shared services with the City.
