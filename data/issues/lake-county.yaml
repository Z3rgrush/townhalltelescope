- title: Colorado Mountain College housing project
  summary: The Planning Commission held a hearing and moved to approve a CMC housing project on its existing campus, with 48 parking spaces, access from existing roads and wildfire-resiliency compliance. Staff said it is not subject to zoning review under state statute, and commissioners voiced support, citing Leadville's tight housing market.
  where: Colorado Mountain College campus, Leadville
