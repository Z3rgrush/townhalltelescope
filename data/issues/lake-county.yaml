- title: 'Affordable housing: Proposition 123 IGA amendment and Housing Authority work'
  summary: The Board was to consider a first amendment to the Proposition 123 IGA with Lake County covering affordable housing commitments, including a 9 percent increase in affordable housing inventory and expedited review. The Leadville/Lake County Regional Housing Authority gave a semi-annual report on its 2026-2028 strategic plan, project pipeline and 2027 budget.
