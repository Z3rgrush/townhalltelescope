- title: Rural Lodging and Camping moratorium and Land Development Code amendments
  summary: The Planning Commission held a public hearing on 26-17 on Oct. 12 on new rules for rural lodging, campgrounds and accessory special events, meant to protect Backcountry zoning. Standards cover water, access, parking, lighting, noise and event management plans. The commissioners were scheduled to consider Resolution 2026-35 amending the code on Oct. 20, lifting the moratorium imposed by Resolution 2026-06.
  where: Unincorporated Lake County (Backcountry zoning)
