- title: Leadville–Lake County fire rescue IGA and shared services with the City
  summary: The Fire Management Board reviewed fire budget figures and a draft intergovernmental agreement with the City of Leadville on funding and operating the fire department, including stations at 816 Harrison Ave and 141 County Road 10. The commissioners were to consider the IGA on Oct. 20, and the County and City held joint sessions on shared services and a possible joint task force.
