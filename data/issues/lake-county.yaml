- title: Rural lodging and camping moratorium and new land code rules
  summary: 'After the Willow fire extended the timeline, the Planning Commission worked through rules for rural lodging, campgrounds and events: site selection, water, parking, emergency plans, conditional use permits and amendments. A public hearing on the moratorium rules was held Oct. 12 with resident questions, and the commissioners were to consider Resolution 2026-35 amending the Land Development Code on Oct. 20.'
  where: Unincorporated Lake County (Backcountry zoning)
