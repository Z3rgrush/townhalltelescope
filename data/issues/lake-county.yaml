- title: Moratorium work session and Land Development Code rules for rural lodging and outdoor recreation
  summary: The Planning Commission reviewed draft rules for campgrounds, event sites and rural lodging that would replace the moratorium imposed by Resolution 2026-06, extended to October because of the Willow fire. Draft rules cover site selection, water, septic, parking, emergency plans and conditional use permits. Commissioners considered Resolution 2026-35 to amend the code on Oct 20.
