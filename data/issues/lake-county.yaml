- title: CMC student and workforce housing project near Leadville
  summary: The Planning Commission held a public hearing on Colorado Mountain College's housing proposal on its existing campus, with 48 parking spaces and wildfire-resilience compliance. Staff said it is not subject to zoning review under state statute. Commissioners expressed support and a motion to approve was made.
