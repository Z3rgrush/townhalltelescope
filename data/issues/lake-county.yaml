- title: E911 Authority budget, restructuring and PUC surcharge application
  summary: The E911 Authority worked through its 2027 budget (Resolutions 26-02 and 2026-03), a dispatch reorganization, and an application to the Colorado PUC to raise the emergency telephone charge. It also weighed a CentralSquare software proposal against the current Motorola/Flex contract and exit costs. The county also discussed an offsite dispatch office.
