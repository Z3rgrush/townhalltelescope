- title: CMC employee housing project and affordable housing commitments
  summary: The Planning Commission held a hearing on a Colorado Mountain College housing project near existing roads and utilities, with 48 parking spaces. The statute exempts it from zoning review and members expressed support. Separately, the commissioners were to consider an amendment to the Proposition 123 affordable housing IGA and hear the Regional Housing Authority's semi-annual report.
