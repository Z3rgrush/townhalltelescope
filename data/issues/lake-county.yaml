- title: E911 Authority restructuring, 2027 budget and PUC surcharge application
  summary: The E911 Authority has been working on a dispatch reorganization, hiring standards, a CentralSquare software agreement replacing the Motorola/Flex contract, and its 2027 budget. It also prepared an application to the Colorado PUC to raise the emergency telephone charge, with Resolutions 26-01 and 26-02 on the Oct. 2 agenda. The commissioners also looked at an offsite dispatch office.
