- title: 2026 budget and mill levy cut
  summary: After a public hearing, the board adopted the 2026 budget and a 2025 supplemental sewer fund budget, which raised sewer spending from $116,940 to $229,440 for wastewater permit costs. The mill levy was certified at 14.509, down from 25.948, to stay under the property tax revenue limit.
