- title: Pine Street drainage and speeding on College and Lincoln Avenues
  summary: Resident Beverly Langley reported rainwater from Pine Street flooding her house, and the board agreed to a ditch on the west side of Pine Street. Residents also raised truck speeding, and the board discussed speed bumps on College Ave and Lincoln Ave, plus a missing stop sign at Grant and Lincoln.
