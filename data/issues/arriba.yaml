- title: Mandatory trash service ordinance and Rob's Trash contract
  summary: The board adopted an ordinance requiring every occupied residential household to have trash service and approved a contract with Rob's Trash Service, renegotiable at end of 2026. Residents may use their own approved 3-yard dumpster for $45. Surveys of customers are planned for review in December.
