- title: July 4 Time Capsule event and park improvements
  summary: The town held a Time Capsule event on July 4, 2026 with a beer garden on the park basketball court, funded partly by a $7,500 grant and a $2,500 tourism grant. Afterward the town planned a park sprinkler system using a $2,500 donation from Big Ben's RV Park and Conservation Trust funds.
