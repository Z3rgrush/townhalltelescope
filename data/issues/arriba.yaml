- title: Sales tax ballot question for 2026
  summary: The board placed a question on the 2026 ballot asking voters to let the Town keep 2025 sales tax revenue above its estimate. The Town had estimated $14,000 but projected about $30,000. The 2026 election will be by mail ballot.
