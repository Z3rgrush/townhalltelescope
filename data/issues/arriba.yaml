- title: Wastewater permit compliance and facility problems
  summary: Arriba is studying its wastewater facility under new state permit rules, with GMS Inc. preparing an engineering report that found an infiltration problem. The facility has had repeated BOD and ammonia violations and flooding. In July the board approved paying $19,250 in GMS invoices, half from a DOLA grant. In September GMS said the state let the town revert to its old permit compliance; the permit expires in 2027.
  where: Town wastewater ponds and sewer lines
