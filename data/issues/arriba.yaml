- title: Time capsule event and park improvements
  summary: The Town held a July 4, 2026 time capsule event funded by a $7,500 grant and a $2,500 tourism grant, with a beer garden on the park basketball court. Volunteers painted the park building. A $2,500 donation from Big Ben's RV Park and Conservation Trust funds are earmarked for a park sprinkler system that staff and volunteers plan to install.
