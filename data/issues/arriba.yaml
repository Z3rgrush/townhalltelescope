- title: Wastewater permit compliance and facility study
  summary: Arriba is working with GMS Inc on an engineering study of its wastewater facility under new state permit rules, with half the costs covered by DOLA grants (a $16,428.06 reimbursement; $19,250 in invoices paid in July 2026). The facility has had BOD and ammonia violations, flooding and infiltration problems, and board members are looking at cheaper alternatives to evaporative ponds. In September 2026 CDPHE let the Town revert to its old permit compliance; the permit expires in 2027.
  where: Town wastewater facility and sewer lines
