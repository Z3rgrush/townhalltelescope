- title: Wildfire Resiliency Code adoption (Ordinance 159)
  summary: The board delayed adopting the state wildfire code for months over concerns about enforcement by the town clerk. After discussing insurance impacts and that Flagler had adopted it, the board adopted Ordinance 159 in July 2026.
