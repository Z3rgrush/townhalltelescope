- title: Water and RV park sewer rates
  summary: Resident Beverly Langley repeatedly asked that Big Ben's RV park and RV hookups pay more for water and sewer. The board raised the monthly RV sewer rate by $2 from $5 in January. In July it raised the base water rate by $5.50 to $55 effective Aug 1, 2026 to stay in compliance with the drinking water loan covenant.
