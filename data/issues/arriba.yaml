- title: 2026 budget, mill levy cut and sales tax ballot question
  summary: The board adopted the 2026 budget and a 2025 supplemental sewer budget raising expenditures from $116,940 to $229,440. It certified a mill levy cut from 25.948 to 14.509 and put a sales tax question on the 2026 ballot to keep revenue above estimates ($30,000 vs. $14,000 estimated). A mail ballot election was also set.
