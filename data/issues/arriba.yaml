- title: Wildfire Resiliency Code adoption (Ordinance 159)
  summary: The state-required wildfire code was tabled for months over concerns about enforcement, with the Town Clerk as code official. In July 2026 the board adopted Ordinance 159 adopting the 2025 Wildfire Resiliency Code, after discussing its effect on residents' insurance rates and a state affidavit requirement.
