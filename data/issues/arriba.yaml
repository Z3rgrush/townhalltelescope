- title: Mandatory trash service ordinance and Rob's Trash Service contract
  summary: The board negotiated a contract with Rob's Trash Service and adopted an ordinance requiring every occupied residential household to have trash service, with an option for residents to use their own approved 3-yard dumpster emptied monthly for $45. The contract can be renegotiated at the end of 2026.
