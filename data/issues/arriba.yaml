- title: 2027 budget and water meter replacement
  summary: The board reviewed the proposed 2027 budget, including cost-of-living raises and higher insurance. It discussed replacing old water meters and charging new customers a non-refundable meter fee. A budget hearing is set for Dec. 1, 2026 at 6 p.m.
