- title: RV park sewer and water rates
  summary: Residents, notably Beverly Langley, have complained that campgrounds like Big Ben's RV Park use more water and sewer than they pay for. In January 2026 the board raised the monthly RV sewer rate per hookup (a $2 increase from $5 was moved after a $10 motion failed for lack of a second), and the RV park's heavy use has affected BOD levels at the wastewater pond. Residents asked again in August and September 2026 for a rate review.
  where: Big Ben's RV Park / Townwide
