- title: Extending the pause on data center development
  summary: The county commission considered a third extension of its interim development controls on data centers while planners work on rules. A resident thanked commissioners for taking time to "get this data center thing right" and asked how the planning commission's suggested categories and regulations would work.
  refs: [20, 21]
  tags: [data-center]
  public_comment: true
- title: Solar farms southwest of Wichita
  summary: Two conditional use requests for major solar energy systems on rural land, one near South 119th Street West and West 47th Street and one between West 71st and 87th streets South, drew TED Renewables, Clearwater's mayor and a council member, the Climate + Energy Project and nearby residents to the commission.
  refs: [4, 6]
  public_comment: true
- title: 2027 budget above the revenue-neutral rate
  summary: Sedgwick County's recommended 2027 operating budget is about $624 million with a $218 million property tax levy, roughly 26.8 mills. At the first hearing a resident questioned undefined "core services," poll worker pay and appraisal practices, and the county mailed more than 242,000 revenue-neutral rate notices before hearings on exceeding that rate and adopting the budget. Fire District 1 held its own hearings on exceeding its 15.576-mill revenue-neutral rate.
  refs: [0, 2, 8, 17, 18]
  public_comment: true
- title: Kellogg and 119th power center rezoning
  summary: The commission took up a planned unit development to rezone land at the southwest corner of Kellogg and 119th Street West for future residential, commercial or industrial use as the Kellogg 119th Power Center.
  where: W Kellogg & S 119th St W
  refs: [21]
- title: Tag office wait times and new satellite offices
  summary: The county treasurer described efforts to shorten tag office waits with more satellite workstations, appointment changes and a parking lot purchase at the Douglas tag office, and the board set a $9.50 transaction fee.
  refs: [4, 21, 22, 25]
- title: Accessory apartments in the zoning code
  summary: The county considered amending the Wichita–Sedgwick County unified zoning code's rules on accessory apartments.
  refs: [25]
- title: Leaving the joint Access Advisory Board
  summary: The commission took up a resolution ending the county's role in the Wichita/Sedgwick County Access Advisory Board, while Wichita separately took up an ordinance to reestablish the board.
  refs: [31]
- title: Juvenile corrections funding cuts
  summary: Commissioners discussed state juvenile corrections funding reductions and a letter to the Juvenile Justice Oversight Committee, after moving three corrections jobs to general funding when state grant money fell short.
  refs: [25, 32]
- title: Mental health and behavioral health services
  summary: The county renewed its state community mental health center agreement, applied for a behavioral health clinic improvement grant and added positions at COMCARE.
  refs: [6, 22, 23]
- title: Drought and burn ban
  summary: Fire District 1 and several cities put an indefinite burn ban in place because of drought, and the county pointed residents to federal drought disaster loans.
  refs: [20, 22]
- title: Roads, bridges and the 63rd Street pathway
  summary: The county acquired easements and KDOT agreements for 135th Street West reconstruction, a MacArthur Road bridge replacement, East Kellogg construction, a 63rd Street South pathway to the Butler County line and the North Junction interchange.
  refs: [6, 25, 30, 31, 32]
- title: Zoning in rural areas
  summary: The board handled a rural rezoning to general commercial at West 55th Street South and 375th Street West, outdoor recreation and church permits and a review of Goddard's unilateral annexation plan.
  refs: [10, 25]
