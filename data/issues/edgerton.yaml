- title: Data center at Logistics Park Kansas City
  summary: Residents from Edgerton and nearby towns filled public comment at meeting after meeting over a data center allowed by right in the logistics park, raising water use, chemical contamination, fuel tanks, power, conflicts of interest and the lack of a public hearing when data centers were added to the zoning code; others defended its economic benefits.
  where: Logistics Park Kansas City (31800 W 196th St area)
  refs: [0, 3, 5, 7, 8, 11]
  public_comment: true
- title: Edgerton Project plat and rock crushing at 196th Street
  summary: The planning commission and council handled a final plat with land dedication for the "Edgerton Project" at 31800 W 196th Street and a temporary rock crushing permit for construction, after a revised site plan was withdrawn.
  where: 31800 W 196th St
  refs: [0, 1, 4, 5, 7]
- title: Public comment rules, microphones and a lawsuit
  summary: Residents criticized limits on public comment time, asked for microphones so people can hear meetings, and questioned the mayor's role and attorney fees in litigation.
  refs: [2, 6, 11]
  public_comment: true
- title: Pavement condition and street maintenance targets
  summary: Consultants and staff presented a pavement management plan rating Edgerton streets at about 86 out of 100 and asked the council to pick a target condition to guide street budgets.
  refs: [3, 7, 8]
- title: Truck container yard at 32612 W 191st Street
  summary: The council rezoned about 21 acres to logistics park and approved a cargo container storage and maintenance facility for DeLong Trucking.
  where: 32612 W 191st St
  refs: [0, 2, 5]
- title: 2027 budget, senior tax rebates and rising taxes
  summary: The council adopted a 2027 budget at the same mill rate as 2026 and considered raising its senior property tax rebate budget, while residents urged more frugal spending.
  refs: [3, 6, 8, 9]
  public_comment: true
- title: Dwyer Farms workforce housing
  summary: The Dwyer Farms housing development, which will grow Edgerton's housing by about 45%, got a concept report and a regional economic development award.
  where: Dwyer Farms
  refs: [3, 6]
- title: Railroad quiet zone, K-33 waterline and 2027-2031 capital plan
  summary: The council ratified quiet zone rules and awarded construction for the quiet zone project, created a K-33 waterline relocation project and took up the 2027-2031 capital program.
  where: K-33 / BNSF crossings
  refs: [10, 11]
