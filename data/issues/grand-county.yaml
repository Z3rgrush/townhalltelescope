- title: Devil's Thumb Ranch High Lonesome Lodge subdivision
  summary: The Planning Commission unanimously recommended approval, with 14 conditions, of an outright exemption to split a 44.33-acre parcel into an 8.82-acre lot with the existing lodge and a 32.60-acre lot for a possible future single-family home. No public notice was required for this type of application.
  where: Devil's Thumb Ranch High Lonesome Lodge, unincorporated Grand County (Forestry and Open zone)
