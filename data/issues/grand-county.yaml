- title: 2027 Grand County budget hearings
  summary: County Commissioners scheduled budget hearings for October 5-9, 2026, going department by department. These cover Road and Bridge, the Housing Authority (Cliffview Assisted Living, Silver Spruce and Black Bear apartments), Economic Development, the County Manager's budgets, and a 5-year budget projection, followed by budget deliberations.
