- title: 2027 county budget hearings and final budget approval
  summary: Commissioners held departmental budget hearings Oct. 5-9, with a five-year projection and rebuttals on Nov. 4. A final budget determination and approval was scheduled for Nov. 10. The Middle Park Fair and Rodeo board also scheduled its own 2027 budget approval for Nov. 9.
