- title: Historic Preservation Board seeks to restore Certified Local Government status
  summary: The newly organized board named restoring the county's Certified Local Government status as its top priority, and the chair will contact History Colorado about requirements. It also discussed historic surveys, landmark designations and a countywide preservation plan. A resident asked what resources can qualify for designation.
