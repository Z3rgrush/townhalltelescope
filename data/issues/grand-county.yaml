  topics:
  - Land & property
  - Zoning & development
- title: Good to Go portable toilet storage special use permit
  summary: The Planning Commission considered a special use permit to store up to 200 clean, empty portable toilets on land in the Forestry and Open zone, on the former Bergquist Outright Exemption property. Staff recommended conditional approval.
  where: Forestry and Open zone, outside the Growth Boundary (Bergquist Outright Exemption property)
