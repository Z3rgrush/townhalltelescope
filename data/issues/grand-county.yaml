- title: Devil's Thumb Ranch High Lonesome Lodge lot split
  summary: 'The Planning Commission unanimously recommended approval of an outright exemption splitting a 44.33-acre parcel into two lots: an 8.82-acre lot for the existing lodge and a 32.60-acre lot for a possible future single-family home. Staff set 14 conditions, and no public notice was required.'
  where: Devil's Thumb Ranch, High Lonesome Lodge, unincorporated Grand County
