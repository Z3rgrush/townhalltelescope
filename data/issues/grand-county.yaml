- title: Ridge Point Townhomes sketch plan near Winter Park
  summary: The Planning Commission reviewed a request to turn an earlier 8-unit approval into a 6-unit townhome subdivision on Lot 27, Winter Park Ranch Second Filing Replat, with access from County Road 834. Staff recommended approval with eight conditions, including a landscape plan, radon mitigation and paved, engineered roads. Separately, commissioners were to consider a partial release of funds for Ridgeview Townhomes.
  where: Lot 27, Block 1, Winter Park Ranch Second Filing Replat, off County Road 834
