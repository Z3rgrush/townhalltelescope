- title: Axon drone-as-first-responder and license plate reader program
  summary: Police are proposing to join the Axon Countywide Drone as First Responder and License Plate Reader programs, which would raise the Axon contract by about $175,000 a year. Council discussed transparency, accountability and video retention. A resident also asked the Town to remove Flock cameras around Parker.
