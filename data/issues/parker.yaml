- title: Parker Road and Mainstreet intersection redesign
  summary: Town staff and consultant Kimley-Horn identified a Dual Quadrant Roadway as the preferred alternative for the Parker Road (CO-83) and Mainstreet intersection. They asked Council for direction to keep advancing the 10% conceptual design, which aims to improve traffic flow, pedestrian safety and downtown redevelopment while limiting impacts to O'Brien Park.
