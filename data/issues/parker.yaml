- title: 2027 Town budget and property tax levy
  summary: Council held a budget workshop on Oct. 2 and a study session on Oct. 26 on the 2027 Proposed Budget, published Oct. 13. First readings of the 2026 property tax levy and revised 2026 budget came Nov. 2, with adoption set for Nov. 16. New special funds for risk management and the My Mainstreet GID were also introduced, and staff proposed redesigning the Town's property and liability insurance.
