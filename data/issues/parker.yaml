- title: Nine-month moratorium on drone dispatch and delivery facilities
  summary: Council passed an emergency ordinance on July 20, 2026 pausing applications for land use approvals or building permits for commercial drone dispatch and delivery facilities for nine months. Council affirmed it with first reading on Aug 3 and second reading on Aug 17; no public comment was received on second reading.
