- title: 2027 Town budget, property tax levy and special funds
  summary: Staff presented the proposed 2027 budget at an October 2 workshop and published it on October 13, with adoption set for November 16. Ordinances introduced November 2 would levy 2026 property taxes, revise the 2026 budget and create special funds for risk management and the My Mainstreet General Improvement District. Staff are also redesigning property and liability insurance with a reserve.
