  summary: Council approved a site plan amendment for Phase 2 of the 91-acre Salisbury Regional Park, adding tennis, pickleball and basketball courts, an inclusive playground and spray ground, a bike park, fitness area and parking. A water pipeline easement for the Parker Water and Sanitation District was also approved. One resident asked about parking.
