- title: Nine-month moratorium on drone delivery facilities
  summary: Council passed an emergency ordinance on July 20, 2026 pausing applications for land use approvals or building permits for commercial drone dispatch and delivery facilities for nine months. On August 17 it affirmed the pause on second reading, with no public comment.
