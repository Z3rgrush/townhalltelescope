- title: Salisbury Regional Park Phase 2 expansion
  summary: The Planning Commission and Council approved a site plan amendment for Phase 2 of the 91-acre park. It adds tennis, pickleball and basketball courts, an inclusive playground and spray ground, a bike park and parking. Council also approved a water pipeline easement with Parker Water and Sanitation District. A resident asked about parking.
