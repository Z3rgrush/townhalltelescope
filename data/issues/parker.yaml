- title: Axon drone-as-first-responder and license plate reader program
  summary: The Police Department proposed joining Axon's countywide Drone as First Responder and License Plate Reader programs, which would raise the Axon contract by $175,000 a year. Council discussion centered on transparency, accountability and video retention. A resident separately asked the Town to remove Flock cameras around Parker.
