- title: Spring water project and potable water tank replacement
  summary: The spring project is substantially complete and came in under $400,000 of a $537,000 grant, with final reimbursement received by June 2026. Replacing the potable water tank awaits CDPHE approval of the final design, and bidding is expected around July. Crews logged about 150 overtime hours on the project, and council deferred a decision on comp time pending grant guidance.
