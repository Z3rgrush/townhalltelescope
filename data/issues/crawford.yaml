- title: 2026 budget, water/sewer increases and fee schedule
  summary: Council worked on the 2026 budget with a proposed $10/month water increase per meter, a sewer deficit of about $21,000 and a public hearing on Nov 24. Resolution 6-2025 updating the town fee schedule was discussed but deferred without final changes. Budget and fee-structure items, including address access and subdivision fees, returned on the fall 2026 agendas.
