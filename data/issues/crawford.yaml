- title: Spring water project, grant reimbursement and staff overtime
  summary: The spring water project was substantially complete, with costs under $400,000 of a $537,000 grant. Staff logged about 150 overtime hours, and council debated comp time versus pay pending reimbursement guidance. Final reimbursement was received by June 2026.
