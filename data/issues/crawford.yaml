- title: Water tank replacement and state review
  summary: The town is replacing its potable water tank; the site has been backfilled and the state health department (CDPHE) must approve the final design before bidding. CDPHE requires a full project review before bids can be split, and bidding was targeted for July. Grant reimbursements for the spring project and planning grant were being pursued.
