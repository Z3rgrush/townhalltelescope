- title: Town water and sewer rate overhaul
  summary: A Water Rate Committee formed in spring 2026 found current rates ($35–$41) far below sustainable levels, with the $3 reserve fee covering none of the required reserves. A consultant suggested about $125/month; the June work session modeled base rates, tiers, higher bulk water rates ($2–$3 per 100 gallons vs. $1.50) and a tap fee increase from $5,000 to roughly $11,230. Council authorized sewer rate analysis in June, and by October a notice that water rates change November 1 was discussed.
