- title: Crawford State Park water and sewer rate structure
  summary: The committee is reviewing how the state park is billed. The park has about 76-78 points of use, modeled as roughly 31 equivalent taps, and is billed as a rural commercial tap. Council questioned whether that still fits given the park's growth since the 1990s. The park rate was on the October 12 agenda.
