- title: Water storage tank replacement and system inspections
  summary: The tank replacement project awaits state health department (CDPHE) approval of the final design before bidding, which was targeted for July. CDPHE requires full project review before splitting the potable tank bids. Tanks and the system passed inspections, and lagoon liner deterioration needs long-term planning for the 2027 budget.
