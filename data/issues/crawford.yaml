- title: 2026 budget, fee schedule and sewer deficit
  summary: Council held the 2026 budget hearing on Nov. 24, 2025. The proposal included a $10/month water increase per meter and a $21,000 sewer deficit split between rate increases and reserves. It also budgeted $10,000 for new billing software and a wastewater jetter. Resolution 6-2025 would update the town fee schedule, but discussion was deferred. Lagoon liner deterioration needs planning for the 2027 budget.
