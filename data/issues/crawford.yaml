- title: Crawford State Park water rate structure
  summary: Council is working out how to bill the state park, which has roughly 76–78 points of use modeled as about 31 equivalent taps and is billed as a rural commercial tap. Staff found about a million gallons of use and a 2024 billing discrepancy; a park representative described budget impacts of higher costs. Options such as a separate customer class, virtual taps and guaranteed base revenue were discussed, but no rate was adopted.
