- title: Cemetery land plat and Grateful Flats Campground
  summary: A final plat and boundary adjustment would let the Cemetery District buy more land, with a historic cattle-drive easement found abandoned. It was scheduled for June 22, 2026. Council also conditionally approved opening the in-town part of Grateful Flats Campground after county septic inspection and a public works review.
