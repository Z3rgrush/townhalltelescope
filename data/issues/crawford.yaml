  summary: The Cemetery District plans to buy land from Ann Landreth, requiring a boundary adjustment and final plat. Survey and title work indicate the historic cattle-drive easement was abandoned decades ago. Town staff will process the amended plat, set for June 22, 2026. A separate A Street property closing was also noted in November 2025.
