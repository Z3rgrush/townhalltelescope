- title: Crawford State Park water and sewer rate structure
  summary: The committee is reviewing how the State Park is charged. It has about 76–78 points of use, modeled as roughly 31 equivalent taps, and is billed as a rural commercial tap. Council noted the park has grown a lot since the 1990s and the issue appeared on the October and November 2026 agendas.
