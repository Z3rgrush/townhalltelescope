- title: Water rate overhaul and Water Rate Committee
  summary: The town formed a committee to set a sustainable water rate structure. A consultant recommended about $125/month, and current rates of $35–$41 cover none of the required reserves. In June the committee presented a model with a fully funded operating need of $238,800, higher bulk water rates ($2–$3 per 100 gallons) and a higher tap fee. Sewer rate analysis was authorized in June, and water rates for the State Park and others were still on agendas in fall 2026.
