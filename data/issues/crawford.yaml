- title: Water and sewer rate overhaul
  summary: A Water Rate Committee, with consultant Rita Trick of RCAC, found current rates ($35–$41) far below what is needed to cover the $238,800 annual operating need and reserves. Options include a $125/month rate recommendation, bulk water at $2–$3 per 100 gallons, and a tap fee increase from $5,000 to about $11,230. Sewer rate work was authorized in June, and a single proposal is expected to go to public hearing.
