- title: Water rate overhaul and Water Rate Committee
  summary: A committee formed in spring 2026 is building a new water rate structure. Current rates of $35-$41 are well below sustainable levels, and the operating need is projected at $238,800 by 2027. Consultant Rita Trick (RCAC) recommended $125/month. Options include tiered overage rates, bulk water at $2-$3 per 100 gallons (now $1.50), a higher tap fee (now $5,000) and doubled conservation rates. A single proposal is headed to a public hearing, and sewer rate analysis was authorized on June 8.
