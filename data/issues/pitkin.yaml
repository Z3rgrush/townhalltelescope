- title: Western Slope Towers radio tower lease with Gunnison Met Rec
  summary: The Board has been negotiating a lease for the town's tower site, where Western Slope wants 18 months at no charge. The mayor thought the proposed amount was too low, and the lease lists 2,500 square feet at the site. Residents commented, and the Board wanted a clause requiring site cleanup if no tenant remains. The agreement was discussed again in February, and the contract came up again in April.
