- title: Wildfire resiliency, energy and building codes
  summary: The town held a work session on a Wildfire Resiliency Code in October and planned public hearings on the Zoning, Wildfire, Energy and Building codes starting in January 2026. A wildfire mitigation seminar was noted in April.
