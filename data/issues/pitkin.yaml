- title: Pond maintenance agreement with Colorado Parks and Wildlife
  summary: The board considered a five-year operations and maintenance cost-share agreement with CPW for a pond that CPW would keep stocking. The mayor reported concerns that the pond could be drained into the ditch. A resident commented.
