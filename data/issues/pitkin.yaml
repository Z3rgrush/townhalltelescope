- title: 2026 Zoning Code adoption and the RV park fight
  summary: The Board worked through a full Zoning Code rewrite from November 2025 through February 2026, with public hearings in January. Residents argued over an RV park provision and Planned Development "mixed uses" wording, and the board agreed to remove the RV Park section and strike the "mixed uses" wording. Some trustees and residents said the code was not ready to pass.
