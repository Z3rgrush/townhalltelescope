- title: Onsite wastewater (OWTS) regulations update
  summary: After a public hearing on Nov. 19, the Board adopted Ordinance 1 of 2025 updating on-site wastewater treatment system regulations, as required by state Regulation 43. Josh Ackerman was appointed the town's Environmental Health Agent.
