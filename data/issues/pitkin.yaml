- title: Pond operations agreement with Colorado Parks and Wildlife and ditch work
  summary: The Board considered a 5-year operations and maintenance agreement involving a pond that CPW would keep stocking. The mayor relayed concerns that the pond could be drained into the ditch. The Board also weighed an RFP for cleaning about 600 feet of fire and irrigation ditches.
