- title: Western Slope Towers radio tower lease with Gunnison Met Rec
  summary: The Board reviewed a lease for marketing tower services on the town's radio tower site. Western Slope wanted 18 months at no charge, and the mayor thought the payment was too low. Concerns included the 2,500 square foot site size and a site cleanup clause. By February the board discussed final terms and heard no public comments.
