- title: 2026 Zoning Code rewrite, RV parks and Planned Development
  summary: The Board went through the zoning code update page by page in November, held a public hearing in January, and took up adoption of the 2026 Zoning Code in February. Residents debated an RV park use and the Planned Development wording, and the Board agreed to strike the RV Park section and the "mixed uses" language. In April the Zoning Board was set to review more code wording on May 4.
