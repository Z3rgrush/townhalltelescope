- title: Wildfire Resiliency Code adoption
  summary: The state requires the town to adopt a Wildfire Resiliency Code by April 1, 2026, with enforcement starting July 1, 2026. The Board planned public hearings for early 2026, and a wildfire mitigation seminar was noted in April.
