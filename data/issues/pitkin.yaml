- title: 2025 budget amendment, 2026 budget and mill levy
  summary: The Board held a public hearing on the 2025 budget amendment (street maintenance raised by $7,000) and the 2026 budget, then waited on county mill levy figures. On Dec. 11 it adopted Resolution 7 (amended 2025 and 2026 budgets) and Resolution 8 (levying 2026 property taxes). April financials showed a large increase in sales tax.
