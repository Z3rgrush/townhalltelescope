- title: Pay for town officials and board members
  summary: Trustees discussed paying the Environmental Health Agent about $550 for classes, the Streets/Ditches Commissioner $300 a month, and Zoning Board members $50 per meeting (about $3,000 a year for a full board). Resolution 6 on coverage with CIRSA was also passed, and Ramon Reed was paid for his time as Trustee.
