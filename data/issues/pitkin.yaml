- title: 2025 budget amendment, 2026 budget and mill levy
  summary: The Board amended the 2025 street maintenance budget, which had been $15,000 but had already spent $20,261.40, and the amendment was later raised further. After public hearings it adopted the 2026 budget and the property tax levy by resolution on Dec. 11. Stipends for the Environmental Health Agent, the Streets/Ditches Commissioner and Zoning Board members were also discussed.
