- title: 2026 Zoning Code adoption, RV parks and planned developments
  summary: The Board held public hearings on adopting a new 2026 Zoning Code in January and February 2026. Residents raised concerns about the RV park section and the planned unit development language. The town attorney was to remove the RV Park section and the board agreed to strike "mixed uses" from the planned development section. A sign section was also discussed at a resident's request. The documents do not show the final adoption vote.
