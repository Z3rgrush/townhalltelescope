- title: On-site wastewater (OWTS) regulations update
  summary: After a public hearing on Nov. 19, 2025, the Board adopted Ordinance 1 of 2025 updating on-site wastewater treatment system regulations as required by state rules. The town also appointed Joshua Ackerman as its Environmental Health Agent.
