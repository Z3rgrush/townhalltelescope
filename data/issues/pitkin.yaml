- title: Fire/irrigation ditch cleaning and pond maintenance agreement with CPW
  summary: The Board took bids to clean and dig about 600 feet of fire and irrigation ditches. It also considered a 5-year operations and maintenance agreement with Colorado Parks and Wildlife for a pond. The mayor heard concerns that the pond could be drained into the ditch.
