- title: OWTS (septic) regulations update
  summary: The board held a public hearing on November 19, 2025 and adopted Ordinance No. 1 of 2025 updating on-site wastewater treatment system regulations to match the state's Regulation 43. A new Environmental Health Agent, Joshua Ackerman, was appointed in November. Four properties had been sent final certified-mail notices.
