- title: Two open Board seats and Zoning Board vacancy
  summary: Resolution 4 of 2026 declared two Board member positions open, and the Board posted an open Zoning Board seat since the mayor's term there expires at the end of April. Cory Nasso was named Mayor Pro Tem and the Town Clerk and Attorney were reappointed.
