- title: Western Slope Towers / Gunnison Met Rec radio tower lease
  summary: The Board considered a lease agreement with Gunnison Met Rec and Western Slope Towers to market tower services at the town's tower site. The mayor was concerned that the proposed 18 months at no charge and the rent amount were too low, and the 2,500 sq ft site description was questioned. Residents commented in January, and the site cleanup was to be added to the contract. In February the board reviewed the agreement again with no public comment, and the contract came up again in April.
