- title: 2025 budget amendment, 2026 budget and mill levy
  summary: After public hearings on November 17, 2025, the board adopted an amended 2025 budget and the 2026 budget by Resolution 7 on December 11. It also adopted Resolution 8 levying property taxes for 2026. The amendment included a $7,000 increase for street maintenance. In April the mayor noted a large increase in sales tax revenue and asked for more detailed financial reports.
