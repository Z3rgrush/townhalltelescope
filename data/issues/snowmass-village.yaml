- title: Highway 82 congestion fee proposal
  summary: A presentation outlined a plan to cut Highway 82 traffic using incentives, roadway improvements, enhanced transit and a phased congestion-reduction fee on up-valley trips. The fee would raise an estimated $10–20 million per year; it is described as an initial strategy open to feedback. The EOTC also held budget and workplan hearings and debated broadening use of transit tax funds.
  where: Highway 82 / Entrance to Aspen
