- title: Ritz Carlton (Viewline/Wildwood) redevelopment sketch plan
  summary: Elevate Snowmass LLC proposes a major redevelopment with 167 lodge units, about 125 workforce housing units in the Wildwood area, and a 252-space subgrade garage, requiring a PUD amendment and rezoning. The Planning Commission reviewed it in segments and on Oct. 7 adopted Resolution No. 4 with conditions recommending approval; Town Council takes it up starting Nov. 9 and 16, with a housing review set for Dec. 21 and a draft resolution Jan. 4, 2027. A resident, Alan May, raised concerns about height, massing, traffic, parking and deliveries on Fall Lane, and advisory boards worry about scale.
  where: Viewline/Wildwood area, Snowmass Mall
