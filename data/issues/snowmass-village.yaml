- title: Housing mitigation rate and nexus study update
  summary: After raising the employee housing mitigation rate from 60% to 100% (Ordinance 1, 2026), Council is reviewing updated employee generation rates and a fee-in-lieu based on a 750 sf unit, 1.75 employees per unit and $945/SF. Council asked for more information on residential operations and maintenance rates and added residential remodels as a mitigating activity.
