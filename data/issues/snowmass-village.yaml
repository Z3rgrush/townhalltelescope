- title: Ritz Carlton / Viewline redevelopment sketch plan
  summary: Elevate Snowmass's proposal would redevelop the Viewline/Wildwood area with a lodge (167 units in the mix discussed), about 125 workforce housing units and a 252-space subgrade parking garage. It needs a Major PUD amendment and rezoning. The Planning Commission reviewed it in segments from August and adopted Resolution No. 4 with conditions on Oct. 7, recommending approval. Town Council site visit and review run through Nov. 2026 to Jan. 2027. A resident raised height, massing, traffic and delivery concerns on Fall Lane, and advisory boards worried about scale.
  where: Viewline/Wildwood, Snowmass Mall and Fall Lane
