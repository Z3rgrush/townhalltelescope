- title: Ritz Carlton / Viewline sketch plan redevelopment
  summary: Elevate Snowmass, LLC's sketch plan would rebuild the Ritz Carlton/Viewline and Wildwood area with a lodge of about 167 units, roughly 125 workforce housing units and a 252-space subgrade garage. The Planning Commission has worked through lodge, housing and conference/commercial topics and was to discuss draft Resolution No. 4 on Oct 7. Part-time residents worry about scale and construction impacts, and a resident at the Sept 16 hearing raised height, traffic and Fall Lane concerns.
  where: Viewline/Wildwood area, Snowmass Mall
