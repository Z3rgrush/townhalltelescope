- title: Transit center / 'grand entrance' project at Snowmass Mall
  summary: A proposed transit center with RFTA improvements is estimated at $42M to $60M. The Part-Time Resident Advisory Board agreed some improvement is needed but questioned the scale, cost sharing and timing given the pending Ritz redevelopment. It prepared a letter calling for an alternative plan. A separate entryway roundabout project was also presented to an advisory board.
