- title: 2027 Town budget and tourism funding
  summary: Staff call the 2027 budget exceptionally tight after a low-snow 2026 season. The budget includes $107.96 million in capital projects. The Financial Advisory Board and Tourism Board reviewed it, with tourism revenue (marketing and lodging taxes) projected around $14.8 million. Council reviewed it in October, with adoption by resolution scheduled Nov. 4, along with a 2027 Road Maintenance Mill Levy hearing.
