- title: Employee housing mitigation rate and nexus study update
  summary: After raising the housing mitigation rate from 60% to 100% (Ordinance No. 1, 2026), Council is reviewing an EPS study of employee generation rates and fee-in-lieu. Council generally agreed to update rates, add residential remodels as an activity requiring mitigation, and use a fee based on $945/SF for a 750 sf unit at 1.75 employees per unit. It asked for more information on residential operations and maintenance employees. A housing mitigation ordinance first reading is on the horizon.
