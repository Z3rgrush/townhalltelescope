- title: Wildfire mitigation program and fire authority agreement
  summary: The town has launched a wildfire mitigation contractor bidding process and a $1,000 homeowner rebate program administered by the RFV Wildfire Collaborative. Council considered a Memorandum of Understanding with Roaring Fork Fire Rescue Authority, and a personal property fire mitigation discussion was held Aug 3.
