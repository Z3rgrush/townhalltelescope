- title: Housing mitigation nexus study and rate increase
  summary: After raising the housing mitigation rate from 60% to 100%, the Council is updating employee generation rates and fee-in-lieu with consultant EPS. Proposals include covering residential remodels and a fee based on $945/SF for a 750 sf unit at 1.75 employees per unit. Council asked for more data and continued discussion.
