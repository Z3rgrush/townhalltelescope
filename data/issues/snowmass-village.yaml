- title: Snowmass Mall transit center project
  summary: A new transit center at the Snowmass Mall with RFTA improvements is estimated at $42M to $60M depending on scope and parking. The Part-Time Resident Advisory Board agreed improvements are needed but worried about scale, funding and timing given the Ritz redevelopment, and suggested modest upgrades as an alternative.
