- title: 2027 Town budget
  summary: Staff presented a tight 2027 budget after a low-snow 2026 ski season, with $107.9 million in capital project expenditures. Council reviewed it Oct. 5, 12 and 19 with the Financial Advisory Board and tourism comments, and adoption by resolution was set for Nov. 4. A hearing on the 2027 Road Maintenance Mill Levy expenditures was also on the Nov. 4 agenda.
