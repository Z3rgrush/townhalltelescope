- title: 2027 town budget
  summary: Staff presented a proposed 2027 budget described as exceptionally tight after the low-snow 2026 ski season, with capital project funds depleted. Total spending includes $107.96 million in capital projects. Council reviews on Oct. 12 and 19, with adoption by resolution expected Nov. 4. The Financial Advisory Board and Tourism board weighed in, and Tourism projected $14.8 million in marketing and lodging tax revenue.
