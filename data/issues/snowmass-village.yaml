- title: Ritz Carlton (Viewline) redevelopment sketch plan
  summary: Elevate Snowmass, LLC's sketch plan would rebuild the Ritz Carlton lodge (about 167 units), redevelop the Wildwood area with about 125 workforce housing units, and add a 252-space subgrade parking garage. The Planning Commission has held several lodge, housing and conference/commercial discussions and a draft resolution is set for Oct. 7. Residents including Alan May raised concerns about height, massing, traffic, parking, deliveries and pedestrian safety on Fall Lane. The Part-Time Resident Advisory Board worried about overdevelopment like Base Village.
  where: Viewline/Wildwood area, Snowmass Mall
