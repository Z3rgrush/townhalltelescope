- title: Housing mitigation nexus study and employee housing requirements
  summary: The Town raised the developer employee-housing mitigation rate from 60% to 100% and hired EPS to update employee generation rates and fee-in-lieu calculations. Council generally agreed to update rates, add residential remodels as a mitigating activity, and use a fee based on $945/SF, and asked for more information on operations and maintenance rates.
