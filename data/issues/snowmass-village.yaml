- title: Transit Center project at Snowmass Mall
  summary: The Town is weighing a new transit center and RFTA improvements at the Snowmass Mall, with estimates of $42M to $60M. The Part-Time Resident Advisory Board agreed some improvement is needed but questioned the cost, timing given the Ritz redevelopment, and the distribution of funding, and drafted a letter opposing the proposed grand entrance and calling for an alternative.
