- title: 2027 Town budget
  summary: Staff describe the 2027 budget as exceptionally tight after a low-snow 2026 ski season, with capital funds depleted by completed projects. Total capital spending is about $108 million. Council budget meetings run Oct 5, 12 and 19, with adoption by resolution expected Nov 4. The Financial Advisory Board and Tourism commented.
