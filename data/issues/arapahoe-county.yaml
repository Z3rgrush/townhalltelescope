- title: 2027 county budget and 1A Resident Advisory Committee
  summary: The 2027 Recommended Budget was submitted Oct. 13 as structurally balanced, reviewed by the Executive Budget Committee on Oct. 20, and set for a public hearing Oct. 27. The 1A Resident Advisory Committee reviews it in line with Ballot Measure 1A. Earlier, the Q2 budget review covered supplemental requests with a Sept. 8 hearing.
