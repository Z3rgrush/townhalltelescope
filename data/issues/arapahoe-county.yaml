- title: Gun Club Road widening and transmission line relocation
  summary: Commissioners reviewed and approved a CORE transmission line relocation agreement tied to the C19-007 Gun Club Road widening, west of South Gun Club Road between the E-470 ramps and East Belleview Avenue. Right-of-way would grow from about 89 to 141 feet, with the county paying design and construction costs. A public use easement also came up.
