- title: Data center policy, tour and possible Land Development Code rules
  summary: Commissioners got a data center overview on Sept. 22 ahead of a Sept. 25 tour of facilities, covering water and cooling, incentives, and the 57 data centers in Colorado. A follow-up on environmental and regulatory issues and possible Land Development Code updates was scheduled for Oct. 19, and commissioners want legislative priorities on data center land use and environmental concerns.
