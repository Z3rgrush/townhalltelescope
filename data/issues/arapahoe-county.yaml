- title: Data center regulation and tour
  summary: Commissioners got a data center overview (57 in Colorado) on Sept. 22 ahead of a Sept. 25 tour, then on Oct. 19 voted 5-0 for option 3, having staff draft permitted and/or special-use rules. The Land Development Code does not currently define "data center"; noise, air quality and water use were discussed. Commissioners also asked about Xcel energy costs and want data center land-use language in the county's legislative priorities.
