- title: County Water Supply Element of the Comprehensive Plan
  summary: Staff are amending the 2018 Comprehensive Plan to add a water supply element required by state law (SB 24-174), building on the 2024 Water Supply Study. It went to the Planning Commission in September and is set for an Oct. 20 hearing, after commissioners reviewed it on Sept. 21.
