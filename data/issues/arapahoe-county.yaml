- title: Gun Club Road widening and CORE transmission line relocation
  summary: The Board considered a relocation agreement with Rippey Commercial, Copperleaf Metro District and CORE for moving the transmission line on the west side of South Gun Club Road between the E-470 ramps and East Belleview Avenue. Right-of-way would grow from about 89 feet to 141 feet, and the county would pay design and construction costs. The item continued in executive session and was on the Oct. 27 consent agenda.
