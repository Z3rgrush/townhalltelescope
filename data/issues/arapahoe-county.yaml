  summary: Commissioners reviewed a relocation agreement for the CORE transmission line for the C19-007 Gun Club Road widening between the E-470 ramps and East Belleview Avenue. Right-of-way would grow from about 89 to 141 feet, with the county paying design and construction costs. The item continued in executive session.
