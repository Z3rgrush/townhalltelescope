- title: Data center regulation and Land Development Code updates
  summary: Commissioners got an overview of data centers (types, water and cooling, 57 in Colorado) ahead of a Sept. 25 tour, then on Oct. 19 voted 5-0 for option 3, directing staff to establish a permitted and/or special use for data centers. The current code does not define "data center"; noise, air quality, water use and Xcel energy costs were raised.
