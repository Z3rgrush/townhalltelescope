- title: Water Supply Element of the Comprehensive Plan
  summary: Staff are adding a state-mandated water supply chapter to the 2018 Comprehensive Plan, based on the 2024 Water Supply Study and SB 24-174. It covers projected 2050 demand, groundwater protection and conservation. It went to the Planning Commission in September and a public hearing is scheduled Oct. 20.
