- title: Water Supply Element of the Comprehensive Plan
  summary: Staff are adding a water supply chapter to the 2018 Comprehensive Plan, as required by state law (SB24-174) and based on the 2024 Water Supply Study. It went to Planning Commission study session Sept. 15, a commissioners' study session Sept. 21, and a Planning Commission hearing Oct. 20. A Strategic Growth Element is also being drafted.
