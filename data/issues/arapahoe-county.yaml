- title: 2027 county budget and 2026 Q2 budget review
  summary: Staff reviewed the 2026 second-quarter budget and supplemental requests in August, with a public hearing set for Sept. 8. The 2027 Recommended Budget was submitted Oct. 13 as structurally balanced and was presented again to the Executive Budget Committee on Oct. 20. The Board of Health also took up its FY2027 budget.
