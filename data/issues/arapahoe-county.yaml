- title: Water Supply Element of the County Comprehensive Plan
  summary: Staff proposed a new Chapter V water supply element for the 2018 Comprehensive Plan, required by state law and based on the 2024 Water Supply Study. It covers growth scenarios to 2050, groundwater protection and conservation. It went to the Board in a study session and to the Planning Commission for hearing on Oct. 20.
