- title: 2027 county budget and 1A review
  summary: The 2027 Recommended Budget was submitted Oct. 13, presented as structurally balanced, and went to a public hearing on Oct. 27. The Executive Budget Committee and the 1A Resident Advisory Committee reviewed it, including whether it matches the intent of the 2024 Ballot Measure 1A. The Board of Health also took up its FY2027 budget in August.
