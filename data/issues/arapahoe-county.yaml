- title: County data center policy review and tour
  summary: Commissioners got a data center overview on Sept. 22 ahead of a Sept. 25 tour, covering water and cooling use, infrastructure, incentives and the 57 data centers in Colorado. A follow-up study session on possible Land Development Code updates and air quality permitting is set for Oct. 19, and commissioners want data center land use and environmental concerns added to the county's legislative priorities.
