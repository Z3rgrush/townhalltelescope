- title: Open space grants and High Line Canal leases
  summary: Staff recommended keeping the 2027 Open Space grant total at $5.5 million while raising the standard maximum award from $600,000 to $750,000. Commissioners also considered extending High Line Canal recreation leases with local government partners.
