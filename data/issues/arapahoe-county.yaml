- title: Data center regulation and Land Development Code updates
  summary: Commissioners got a data center overview on Sept. 22 ahead of a Sept. 25 tour, and a follow-up on Oct. 19 noted the county code does not define "data center." The board voted 5-0 for option 3, directing staff to set up a permitted and/or special use for data centers, with noise, air quality, water and Xcel energy costs among the concerns.
