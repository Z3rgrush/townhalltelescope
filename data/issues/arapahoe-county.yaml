- title: Gun Club Road widening and CORE transmission line relocation
  summary: The county is to approve a relocation agreement with Rippey Commercial and Copperleaf Metro District for the CORE transmission line on the west side of South Gun Club Road between the E-470 ramps and East Belleview Avenue. Existing right-of-way is about 89 feet and 141 feet is needed. The agreement dedicates 32 feet of right-of-way and a public use easement, and the county pays design and construction costs. It was on the Oct. 27 consent agenda.
