- title: Human services payment error rate costs
  summary: Staff warned commissioners that the state's SFY 2026-27 Payment Error Rate could cut county allocations, with the state covering 60% of the reduction and counties the rest. They discussed how Arapahoe County human services could lower its errors. The issue is also among the county's legislative priorities.
