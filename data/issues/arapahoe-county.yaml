- title: 'Affordable housing: Prop 123 commitment and private activity bonds'
  summary: The Board approved 5-0 submitting the county's 2027-2029 Proposition 123 commitment, which sets a target of 231 affordable units. It also reassigned $3 million of 2026 private activity bond authority after a prioritized project's financing changed, and applied to a Design Charrettes program for redevelopment of county-owned 4857 S. Broadway, Englewood.
