- title: Flock license plate cameras
  summary: Residents repeatedly asked the council not to renew the city's Flock camera contract, citing tracking of people's movements and misuse elsewhere; the police chief described the one stationary camera and policies.
  refs: [2, 3, 5]
  public_comment: true
- title: 2027 budget and exceeding the revenue-neutral rate
  summary: Gardner adopted a 17.814 mill levy above the 16.933 revenue-neutral rate after several residents objected to rising costs and utility bills; two councilmembers voted no.
  refs: [6, 7, 8]
  public_comment: true
- title: Project Velocity incentives
  summary: The council approved a non-binding agreement for Project Velocity, a development that includes a performing arts and education building and seeks a mix of tax incentives; a resident questioned the incentives and construction traffic near Walmart.
  refs: [3, 4, 5, 11]
  public_comment: true
- title: 215-acre development at I-35 and 175th Street
  summary: The council rezoned about 215 acres between the railroad and I-35 near 175th Street for roughly 2.5 million square feet of development tied to a new 175th Street interchange; nearby residents spoke at hearings.
  where: I-35 & 175th St
  refs: [9, 10, 11]
  public_comment: true
- title: Eminent domain for 167th, 175th and Grand Street projects
  summary: Gardner moved to condemn land for the 167th Street, 175th Street and Grand Street (Pine to Center) road projects after authorizing purchases.
  where: 167th St, 175th St, Grand St
  refs: [0, 3, 4, 6, 7]
- title: Fireworks complaints
  summary: Residents complained about loud fireworks outside allowed times and asked for fewer fireworks days, while others said rules were followed; council noted new signs helped.
  refs: [0, 2, 3]
  public_comment: true
- title: Electric utility costs, substations and $56 million in bonds
  summary: Tariffs raised the price of a Substation 4 transformer, a generator repair grew to $2.75 million, and the city scheduled about $56 million in bonds for electric work and the Hillsdale Lake water intake.
  refs: [0, 1, 2, 12, 13, 17]
- title: Kill Creek wastewater plant expansion
  summary: The council approved the next construction phase of the Kill Creek Water Resource Recovery Facility expansion and amended bond authorizations for sewer, water and electric work.
  refs: [9, 10]
- title: Short-term rental at 633 Colleen
  summary: A resident complained a home on Colleen was operating as an unpermitted Airbnb; the council later took up a conditional use permit for it.
