- title: Letter of support for Montelores Bridge restoration trail grant
  summary: The Dolores Ranger District asked the Town of Rico for a letter of support for its 2027 Colorado Parks and Wildlife Non-Motorized Trail Grant application, seeking about $80,000 to repair the Montelores Bridge. The Forest Service wants letters by September 15, 2026, and the Town's support would be limited to endorsing the project. The Council was set to consider approving the letter on September 2, 2026.
