- title: Flock license plate readers and the 2027 budget
  summary: Residents repeatedly objected to the city's Flock Safety license plate cameras and asked Council not to fund the contract. The 2027 budget came in two versions, one with and one without Flock funding (Resolutions 2026-24A/B, Ordinances 18A/B). Council also discussed a formal policy on automatic license plate readers and exempting surveillance contracts from administrative approval.
