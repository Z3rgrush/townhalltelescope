- title: Moratoria on data centers and advanced air mobility
  summary: Council considered potential moratoria on these land uses on Sept 15, then took up an 18-month moratorium on land use applications and building permits for data centers (Ordinance 21, second reading Oct 20). An emergency ordinance imposed a similar 18-month moratorium on advanced air mobility facilities.
