- title: Inclusionary housing and affordable housing policies
  summary: Council took up an expedited review policy for affordable housing projects (Resolution 2026-26) and received inclusionary housing and affordable housing impact fee recommendations. It also approved assigning the city's 2026 private activity bond allocation to the Boulder County Housing Authority.
