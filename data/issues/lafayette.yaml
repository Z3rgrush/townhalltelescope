- title: Flock license plate cameras and the 2027 budget
  summary: Residents repeatedly asked Council to end the Flock Safety license plate reader contract and to exempt surveillance contracts from administrative approval. Council considered two budget versions, 2026-24A and 2026-24B, the latter with no Flock funding, and a separate appropriation ordinance for the Flock contract. Council also discussed a formal policy on automatic license plate readers.
