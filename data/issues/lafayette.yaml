- title: Boulder Ranch annexation and development
  summary: Residents wrote in against the proposed Boulder Ranch, a high-density development of about 78 acres off Burlington between Emma and Baseline Roads. They cited traffic on Baseline Road, open space and an intergovernmental agreement not to annex between cities, and said over 2,000 people signed petitions. On Nov 2 Council considered finding the annexation petition in substantial compliance and setting a hearing on eligibility.
  where: Southeast of Baseline Road and Nyland Way
