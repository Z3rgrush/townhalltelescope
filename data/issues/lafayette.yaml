- title: New Land Use Code and citywide rezoning
  summary: Council passed the new Land Use Code and zoning map on first reading in August after a public hearing, then adopted it on second reading in September with amendments, after heavy testimony about housing diversity, parking, wildlife corridors and how the code follows the comprehensive plan.
  where: Citywide
  refs: [0, 1, 2, 3, 4, 11, 12]
  public_comment: true
- title: Old Town OTX-3 zoning and building heights on Public Road
  summary: Residents objected to the new OTX-3 zone allowing larger, taller buildings along Public Road south of Emma Street; a joint council and planning commission workshop agreed to shrink the maximum building footprint from 25,000 to 10,000 square feet and revisit height in a second ordinance.
  where: Public Road south of Emma St, Old Town
  refs: [3, 4, 9, 10, 12, 15]
  public_comment: true
- title: Data center and advanced air mobility moratoriums
  summary: After council asked how the new code regulates data centers, it adopted an 18-month moratorium on land use applications and building permits for data centers in October, alongside an emergency 18-month moratorium on advanced air mobility facilities.
  where: Citywide
  refs: [0, 11, 15, 16]
  tags: [data-center]
- title: Flock license plate reader cameras
  summary: Many residents urged council to end the Flock Safety license plate camera contract, and council weighed two versions of the 2027 budget, one with no Flock funding, and discussed a formal policy for automatic license plate readers.
  where: Citywide
  refs: [4, 8, 12, 15, 16]
  public_comment: true
- title: Naming the 701 S. Public Road pocket park for Rosebelle Lueras
  summary: Residents spoke at meeting after meeting asking that the new pocket park at 701 S. Public Road be named for Rosebelle Lueras, and council took up the naming in October.
  where: 701 S. Public Road
  refs: [2, 4, 8, 12, 16]
  public_comment: true
- title: Zoning for churches along Highway 287
  summary: Church members raised concerns about how the new code zones churches, and council directed that the church parcels at Highway 287 and South Boulder Road be zoned like Immaculate Conception.
  where: Highway 287 and South Boulder Rd
  refs: [2, 12]
  public_comment: true
- title: Boulder Ranch development off Baseline and Burlington
  summary: Residents wrote in opposing the proposed high-density Boulder Ranch development on 78 acres near Baseline Road and Burlington, citing traffic, open space and the buffer agreement with Boulder, with over 2,000 petition signatures.
  where: Baseline Rd and Burlington Ave
  refs: [7, 11]
  public_comment: true
- title: LaMont Does Park and water park tax extension
  summary: Council put the extension of an expiring property tax for LaMont Does Park and the Great Outdoors Water Park on the November ballot, with residents speaking for and against.
  where: LaMont Does Park
  refs: [1, 2, 13, 14]
  public_comment: true
- title: 2027 budget, fees and pay plan
  summary: Staff introduced a $128 million 2027 recommended budget, and council held a public hearing, adopted the budget and mill levy, amended fees and adopted the pay plan.
  where: Citywide
  refs: [5, 6, 15, 16]
- title: Capital bond projects and general obligation bonds
  summary: Council authorized general obligation bonds for the voter-approved recreation center, service center and civic center projects and toured capital projects including the water treatment plant and West Baseline Road safety improvements.
  where: Bob L. Burger Recreation Center, Service Center, West Baseline Rd
  refs: [7, 8, 11, 13, 14, 15]
- title: Douglass Elementary School closure concerns
  summary: Council directed staff to draft a letter asking the Boulder Valley School District to reconsider its process on Douglass Elementary's future after Lafayette families said they had no voice.
  where: Douglass Elementary
  refs: [12, 15]
  public_comment: true
- title: Human Rights Board renamed and rescoped
  summary: Council adopted an ordinance changing the name, scope and duties of the Human Rights Board.
  where: Citywide
  refs: [0, 1, 2, 3, 4]
- title: Expedited review for affordable housing
  summary: Council considered a resolution supporting an expedited review policy for affordable housing projects.
  where: Citywide
  refs: [16]
- title: Street racing on South Public Road
  summary: An Avalon Flatirons resident complained about street racers gathering in a church parking lot off South Public Road.
