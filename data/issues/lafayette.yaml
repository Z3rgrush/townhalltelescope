- title: Boulder Ranch annexation and housing proposal
  summary: Residents wrote in against the proposed Boulder Ranch development, about 78 acres near Baseline Road and Burlington. They cited density, traffic and bike safety on Baseline, loss of open space, and an agreement not to annex between cities, and said over 2,000 people signed petitions. On Nov. 2 Council considered a resolution finding the annexation petition in substantial compliance and setting an eligibility hearing.
