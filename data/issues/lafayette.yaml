- title: 2027 budget, mill levy and fee updates
  summary: Staff presented a 2027 recommended budget with $128 million in revenue and no General Fund balance use. Sales tax is budgeted up 3% to $26.2 million. Council held the budget public hearing on Oct 6 and took up the fee ordinance (Ordinance 19), the 2027 pay plan and human services grants on later dates.
