- title: Church zoning in the new Land Use Code
  summary: Speakers raised concerns about how proposed zoning affects churches. Council amended its August 18 direction so that church parcels at Highway 287 and South Boulder Road be zoned consistently with Immaculate Conception (NC), and staff are to bring back related work.
