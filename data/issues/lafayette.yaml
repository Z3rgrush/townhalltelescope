- title: 2027 budget, mill levy and fee changes
  summary: Staff introduced a 2027 recommended budget with $128 million in revenue, a 3% sales tax increase assumption to $26.2 million, and no General Fund balance use. Council adopted the budget and mill levy and the 2027 pay plan, and considered fee updates to Chapter 4 (Ordinance 19). Discussion included utility rates, the Urban Renewal Authority sunset and the Open Space Ranger position.
