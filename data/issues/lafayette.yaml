- title: New Land Use Code and Old Town OTX-3 zoning
  summary: Council took up Ordinance No. 15, a full rewrite of the Land Use Code and zoning map, with first reading Aug. 18 and second reading Sept. 15. Residents objected to the OTX-3 district along South Public Road south of Emma Street, citing building height and size. A joint Planning Commission/Council workshop on Sept. 9 reached general agreement on changes such as cutting the OTX-3 footprint cap from 25,000 to 10,000 sq. ft. and rezoning the 700 block to OTX-1, with height and other items left for a second ordinance.
  where: South Public Road, Old Town
