- title: 'Capital bond projects: recreation center, service center, civic center'
  summary: Voters approved $74 million in bonds in November 2025 for the Bob L. Burger Recreation Center, Service Center and Civic Center. Council held first and second readings of the General Obligation Bonds ordinance (No. 16), with the first tranche expected in October 2026, and approved a Service Center design-build guaranteed maximum price contract. A Sept. 22 bus tour covered related projects including LaMont Does Park and the water park.
