- title: New Land Use Code and Old Town OTX-3 zoning
  summary: Council took up Ordinance No. 15, a rewrite of Chapter 26 with a new zoning map. First reading was Aug 18, a joint Council/Planning Commission workshop on Sept 9 covered Old Town Mixed-Use zoning, and second reading was set for Sept 15. Residents objected to OTX-3 along South Public Road south of Emma Street, including its 25,000 sq. ft. building footprint limit and building heights. Council generally agreed to move some changes into the second reading and others into a later ordinance.
  where: South Public Road south of Emma Street, Old Town
