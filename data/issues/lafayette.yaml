- title: LaMont Does Park tax extension and capital bond projects
  summary: Council put a ballot measure on the November ballot to extend an expiring property tax for LaMont Does Park, drawing both opposition and support. A Sept 22 bus tour reviewed capital projects including the water park, water treatment, and Baseline Road safety improvements. The city expects to issue $74 million in voter-approved bonds for the Recreation Center, Service Center and Civic Center, with a first tranche in October 2026, and Council also considered Ordinance 16 for G.O. bonds.
