  - 1
  topics:
  - Roads & traffic
  - Zoning & development
- title: Proposed 2027 county budget
  summary: The commissioners scheduled public hearings on the proposed 2027 Fremont County budget for Oct. 27 and Nov. 10. Related items include the 2027 MotivHealth employee insurance proposal and a DHS building roof replacement bid.
