- title: Cañon Dolomite Quarry truck traffic permit amendment
  summary: Amrize asked the commissioners to amend Section K of Conditional Use Permit 11-001 for the Cañon Dolomite Quarry so the truck traffic limit uses "Annual Average Daily Traffic" wording, matching the original CDOT approval. The quarry operates only a day or two a month and wants room for sales surges on those days, not more operating days.
