- title: 152-lot Planned Unit Development at 1337 County Road 3A
  summary: A public hearing was scheduled for the Oct. 13 agenda on a Planned Unit Development proposing 152 lots at a minimum of 3 acres each, at 1337 County Road 3A near Cañon City. The documents do not state the outcome.
  where: 1337 County Road 3A, Cañon City
