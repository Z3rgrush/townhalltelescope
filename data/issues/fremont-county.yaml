- title: Extra review fees billed to a developer who requested an outside consultant
  summary: Planning & Zoning asked the board to bill an applicant for outside consultant review costs exceeding the application fee. The applicant had asked for the consultant after alleging staff bias, and Section 306 of the county resolution lets the board assess such fees.
  where: Countywide
