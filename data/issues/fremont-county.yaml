  summary: Public Health reported on the Aspen Acres Fire, which came close to the Bruce McCandless Veterans Community Living Center before firefighters controlled the north side. Staff have planned and practiced evacuation since the 24 Fire. Fire danger in the county remains extreme, and DOT stopped mowing to avoid sparks.
