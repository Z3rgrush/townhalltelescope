- title: Colorado River shortage and Lower Basin cuts
  summary: A commissioner reported on Colorado Counties Inc. discussions about the Colorado River. The federal government, acting through the Bureau of Reclamation, required the Lower Basin to cut water use by 1.25 million acre-feet after the states failed to agree.
  where: Countywide
  refs:
  - 0
  topics:
  - Water
- title: New liquor license and CDOT highway access for a restaurant/bar/mercantile
  summary: Commissioners considered a new malt, vinous and spirituous license for a restaurant, bar and mercantile in a building with 134-person occupancy. The business needs a new CDOT highway access permit because the old one allowed only 20 trips a day, and a CDOT traffic study delayed by construction is now complete.
  where: Grant Street, Fremont County
