- title: New liquor license for restaurant, bar and mercantile off Grant Street
  summary: Commissioners considered a new malt, vinous and spirits-style license for a 134-person restaurant, bar and mercantile. The applicant needs a CDOT highway access permit, since the old permit allowed only 20 trips a day, and CDOT has now completed a traffic analysis. Commissioner Grantham asked about the access complications and moved to approve.
