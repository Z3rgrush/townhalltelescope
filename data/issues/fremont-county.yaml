- title: Aspen Acres Fire and evacuation planning
  summary: Public Health reported that before firefighters gained control of the north side of the Aspen Acres Fire, the Bruce McCandless Veterans Community Living Center was in a very vulnerable position. Agencies have been planning and practicing for a potential evacuation since the 24 Fire. Fire danger remained extreme and DOT stopped mowing for fear of sparks.
  where: Aspen Acres / Bruce McCandless Veterans Community Living Center
