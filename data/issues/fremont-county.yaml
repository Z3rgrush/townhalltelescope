- title: Outside consultant review fees for RV roof business application
  summary: Planning & Zoning asked the commissioners to bill an applicant for outside consultant review costs that exceed the application fee. The applicant had requested an outside consultant after voicing a perceived staff bias, and Section 306 of the county resolution lets the board assess the extra fees. The project is a business that maintains and repairs RV roofs.
  where: Fremont County
