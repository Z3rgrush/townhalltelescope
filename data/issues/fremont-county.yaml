- title: Cañon Dolomite Quarry truck traffic permit amendment (CUP 11-001)
  summary: Amrize asked the county to amend the truck traffic condition (Section K) of the quarry's conditional use permit to use the "Annual Average Daily Traffic" wording from the original CDOT approval. The quarry operates only a day or two a month and wants room for sales surges on those days without adding operating days.
  where: Cañon Dolomite Quarry
