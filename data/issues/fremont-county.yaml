- title: Cañon Dolomite Quarry truck traffic permit amendment
  summary: Amrize asked to amend the truck traffic condition (Section K) of Conditional Use Permit 11-001 to use the "Annual Average Daily Traffic" wording from the original CDOT approval. The company says the quarry operates only a day or two per month and needs room for random sales surges, not more operating days.
  where: Cañon Dolomite Quarry
