- title: 'Parks projects: Centennial Park, Elephant Rock Pavilion, Glen Park weeds'
  summary: The Parks and Trails Commission decided against no-fishing zones at Centennial Park Lake. It held off Columbine Park plantings until spring because of water restrictions. It is working on poison hemlock control in Glen Park, Elephant Rock Pavilion renovation, pickleball court flooding and curbing, the playground inspection, a pocket park and motorized vehicles on trails. Creek Week cleanups run September 26 to October 4.
  where: Centennial Park, Glen Park, Elephant Rock
