- title: Water restrictions and stage one water emergency
  summary: The town remains under a stage one water emergency with an outdoor watering ban that cut demand by 25% and allowed a shift to the Denver well. Monument Creek is too low to be a production source and there is no firm end date to the water call. A resident criticized town communications about the restrictions, and Columbine Park plantings were put off until spring because of the restrictions.
