- title: 2026 amended budget and draft 2027 budget
  summary: Town Administrator Patrick Davidson froze non-essential spending and new capital projects while preparing 2027 projections. The Board held budget workshops and reviewed the amended 2026 budget (Resolution 45-2026) and draft 2027 budget (Resolution 44-2026), with a master fee schedule amendment (Resolution 34-2026) earlier. Possible consolidation of the Water, Roads and Parks departments was also raised.
