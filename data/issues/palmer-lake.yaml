- title: 2027 budget, spending freeze and department consolidation
  summary: Town Administrator Patrick Davidson began 2027 budget projections and froze non-essential spending and new capital projects. Budget workshops were scheduled in late September and October, and a draft 2027 budget and 2026 amended budget were on the October 22 agenda. A proposal would consolidate the Water, Road/Streets and Parks departments, and a possible ballot measure on fire protection services with Monument Fire is being researched.
