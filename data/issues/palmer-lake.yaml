- title: 2027 town budget and spending freeze
  summary: The Town Administrator started the 2027 budget projections and froze non-essential spending and new capital projects. Trustees held budget workshops and reviewed department budgets, the 2026 amended budget and the draft 2027 budget. The Parks Commission ranked its own budget requests. The Master Fee Schedule for 2026 was also amended by Resolution 34-2026.
