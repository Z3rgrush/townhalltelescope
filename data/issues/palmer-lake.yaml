- title: Parks and Trails projects and 2027 budget priorities
  summary: The Parks and Trails Commission ranked 2027 projects, favoring stable funding like the Conservation Trust Fund, and proposed a third Air Force Academy student-designed bridge. Other items include Elephant Rock pavilion renovation, Centennial Park pickleball court flooding and pump track, playground inspections, a community garden proposal, the Strip Park project and motorized vehicles on trails.
