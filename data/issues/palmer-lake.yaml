  summary: The Planning Commission discussed a mandatory town-wide bear-proof container requirement, certified receptacles, and CPW grants, and planned a workshop before making a recommendation. The Board's October 22 agenda includes Ordinance 6-2026 on bear mitigation and enforcement. A resident asked for strict enforcement.
