- title: Stage one water emergency and watering restrictions
  summary: The town remains under a stage one water emergency with an outdoor watering ban that cut demand by 25% and allowed a shift to the Denver well. Monument Creek is too low to serve as a production source and there is no firm end date to the water call. A resident criticized how the town communicated the restrictions.
