- title: 'Parks and Trails projects: Centennial Park, Elephant Rock pavilion, fences and weeds'
  summary: The commission discussed the Elephant Rock pavilion renovation, Centennial Park pickleball court flooding and curbing, dogs in the courts, and the Crawford memorial fence repair. It decided against no-fishing zones at Centennial Park Lake, and also covered poison hemlock and noxious weed control, wildlife-feeding signs, a playground inspection and Awake the Lake ideas.
