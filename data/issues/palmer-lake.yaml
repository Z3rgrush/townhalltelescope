- title: Water restrictions and stage one water emergency
  summary: The town remains under a stage one water emergency; an outdoor watering ban and seasonal changes cut demand by 25% and allowed a shift to the Denver well. A resident raised concern about how the town communicated the restrictions. Columbine Park plantings were put off until spring because of the restrictions, and a water main is being installed on the Shady Lane project.
