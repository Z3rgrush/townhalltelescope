- title: Water emergency and watering restrictions
  summary: The town remains under a stage one water emergency. An outdoor watering ban and seasonal changes cut demand by 25% and allowed a shift to the Denver well. Monument Creek is too low to be a production source and there is no firm end date for the water call. A resident criticized how the town communicated the restrictions. The Shady Lane water main project is under way.
