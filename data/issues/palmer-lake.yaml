- title: 2027 budget and budget workshops
  summary: The Town Administrator started 2027 budget projections, froze non-essential spending and new capital projects, and the Board held budget workshops. A draft 2027 budget and 2026 amended budget were up for review with a public hearing date to be set. The Parks Commission is ranking its own 2027 budget requests, and a consolidation of the Water, Roads and Parks departments was proposed.
