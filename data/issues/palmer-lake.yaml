- title: Fire protection ballot measure and department consolidation
  summary: The Town Administrator is researching a possible ballot measure on fire protection involving the Palmer Lake Fire Department and Monument Fire. Because it involves taxation, a special election may not be permitted. He also proposed consolidating the Water, Roads/Streets and Parks departments.
