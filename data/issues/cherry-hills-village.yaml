- title: Wireless infrastructure, cell coverage and Centennial Airport noise
  summary: Council discussed the limited scope of what the city can regulate for wireless infrastructure up to fifty feet. A resident proposed a municipal satellite resiliency plan for poor cell coverage. Councilor Heller is working to notify the public about a Centennial Airport noise plan rulemaking.
