- title: Parks, Trails & Recreation 2027 work plan, including trail safety and bike lanes
  summary: The commission is building its 2027 work plan, adding a Trail Passport Program, Parks & Trails Visioning with safety improvements, a Recreation Reimbursement Program, bike lane improvements on Colorado, Quincy and Mansfield, park signage, and e-bike/e-moto rules. Members raised concerns about crosswalks at the High Line Canal.
