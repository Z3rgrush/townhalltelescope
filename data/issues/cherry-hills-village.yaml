  topics:
  - Budget & taxes
- title: Home rule zoning Charter amendment (Ballot Question 2C)
  summary: Council passed Resolution 29 supporting Ballot Question 2C, a Charter amendment referred to voters on Nov. 3, 2026 that asserts local home rule authority over zoning and land use against state land use legislation. Council asked for stronger language affirming home rule authority, with the resolution approved subject to an added whereas clause.
