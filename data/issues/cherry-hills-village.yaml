- title: 2027 Sculpture-on-Loan project, Art Commission work plan and branding
  summary: The Art Commission is deciding whether to start a project brief for the 2027 Sculpture-on-Loan program, with about $4,687.50 available and $5,000 anticipated in the 2027 work plan. It is also considering a brighter cherry-red logo color, the Snow Plow Painting Program, and a revised meeting schedule.
