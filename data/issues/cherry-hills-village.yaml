- title: 'Planning Commission study sessions: rezoning, lot frontage and sustainability'
  summary: The Planning and Zoning Commission scheduled a study session on legislative rezoning and lot frontage. It also discussed Master Plan sustainability goals, such as electric police and public works vehicles, electronic permitting and stormwater drainage along roadside ditches, including South Holly Street. Land use discussion was deferred partly due to a lawsuit filed by Northglenn over state legislation.
  where: Citywide; South Holly Street
