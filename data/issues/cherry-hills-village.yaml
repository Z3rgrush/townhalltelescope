- title: Planning commission study sessions on rezoning, lot frontage, and Master Plan sustainability
  summary: The Planning and Zoning Commission scheduled a study session on legislative rezoning and lot frontage. It also discussed Master Plan sustainability and resiliency, including electric police and public works vehicles, electronic permitting, and stormwater drainage along roadside ditches and South Holly Street. The land use and zoning Master Plan discussion was deferred partly because of recent legal and legislative developments, including a lawsuit filed by Northglenn.
  where: Citywide; South Holly Street
