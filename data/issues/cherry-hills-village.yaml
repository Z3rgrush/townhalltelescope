- title: Council positions on November 2026 ballot measures (2C home rule zoning and 7A rail district tax)
  summary: Council approved Resolution 29 supporting Ballot Question 2C, a Charter amendment on home rule authority over zoning and land use, with added language on state land-use legislation. It also took up Resolution 30 opposing Ballot Issue 7A, a Front Range Passenger Rail District tax increase, over how the district was structured.
