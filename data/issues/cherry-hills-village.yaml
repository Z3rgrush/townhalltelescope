- title: 2027 Sculpture-on-Loan project and Art Commission work plan
  summary: The Art Commission is deciding whether to start a project brief for the 2027 Sculpture-on-Loan cycle, with about $5,000 anticipated in the 2027 work plan pending budget adoption. Staff will request a consultant estimate, and no project work would proceed without Commission approval of a budget. The Commission also discussed its 2027 work plan, logo color and the Snow Plow Painting Program.
