- title: Art Commission Day of the Dead exhibit and Oct. 24 family event
  summary: Council approved an art loan of eight calaveras and bases, not to exceed $10,000. The Art Commission planned a free family event on Oct. 24 from 2 to 4 p.m. with food, crafts, a guitarist and possibly an author or storyteller, within about $4,800 of remaining budget.
