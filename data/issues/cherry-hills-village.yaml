  - 5
  topics:
  - Zoning & development
  - Environment & climate
  - Roads & traffic
- title: Parks, Trails & Recreation 2027 work plan
  summary: The commission drafted its 2027 work plan, adding a Trail Passport Program, Parks & Trails Visioning with safety improvements, a Recreation Reimbursement Program, park signage, e-bike/e-moto rules and possible bike lane improvements on Colorado, Quincy and Mansfield. A member raised concerns about people being hit in crosswalks at the High Line Canal. Council also has potential expansion of municipal parks on its agenda.
  where: High Line Canal, Volunteer Park, Colorado/Quincy/Mansfield
