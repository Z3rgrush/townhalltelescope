- title: Legislative rezoning, lot frontage and Master Plan sustainability
  summary: The Planning and Zoning Commission scheduled a study session on legislative rezoning and lot frontage. It also discussed Master Plan sustainability goals such as electric police and public works vehicles, electronic permitting, and roadside drainage concerns on steeper streets such as South Holly Street. Land use discussions were deferred partly because of a lawsuit filed by Northglenn over state legislation.
  where: Citywide; South Holly Street drainage
