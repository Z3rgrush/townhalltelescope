- title: Día de los Muertos art exhibit and family event
  summary: Council approved a loan of eight calavera sculptures and bases for up to $10,000. The Art Commission is planning a free family event on Saturday, October 24, 2-4 p.m., and has worked through food, activities, a guitarist, and a children's author or storyteller. About $4,800 remains in the public art display budget after the loan.
