- title: 2027 budget and temporary property tax mill levy cut to zero
  summary: The draft 2027 budget temporarily cuts the Village property tax mill levy to 0 mills for 2027, with the levy able to return in 2028. This is expected to give about $8.5 million in relief, roughly $3,800 for the average homeowner, including about $4.5M that the General Fund would transfer to the Parks Fund. Council held a study session on October 20 and the budget ordinance public hearing is scheduled. The draft also assumes a 10% compensation placeholder and adds a Planner I position.
  where: Citywide
