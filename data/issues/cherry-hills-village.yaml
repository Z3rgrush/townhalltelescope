- title: Opposition to Ballot Issue 7A (Front Range Passenger Rail District tax)
  summary: Council considered Resolution 30 opposing Ballot Issue 7A, a Front Range Passenger Rail District tax increase on the November ballot. Council's objection focused on how the district was structured for taxing purposes, and it noted a planned stop near Santa Fe in unincorporated Jefferson County.
  where: Santa Fe corridor / rail district
