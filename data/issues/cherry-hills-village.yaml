- title: Día de Muertos art exhibit and family event, Oct. 24
  summary: The Art Commission is planning a free family event on Saturday, Oct. 24, 2-4 p.m., alongside a loan exhibit of eight calavera sculptures. Council approved the loan on Aug. 18 for up to $10,000, leaving about $4,800 for food, a guitarist, craft kits and an author or storyteller.
