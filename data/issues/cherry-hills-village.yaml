- title: Parks, Trails and Recreation 2027 work plan
  summary: The commission is shaping its 2027 work plan to include park signage, a Trail Passport Program, Parks & Trails Visioning with safety improvements, a Recreation Reimbursement Program, e-bike/e-moto rules, and possible bike lanes on Colorado, Quincy and Mansfield. Members raised crosswalk safety at the High Line Canal.
  where: High Line Canal; Colorado, Quincy and Mansfield streets
