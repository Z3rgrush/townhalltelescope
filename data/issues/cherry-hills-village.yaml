- title: Planning and Zoning Commission vacancies and 2027 work plan
  summary: Council reappointed two Planning and Zoning members to partial terms, both running unopposed for Council, and left a third seat vacant. Interviews are planned for December with new appointments on Jan. 5, 2027. Council also received the Commission's 2026 report and 2027 Work Plan on Nov. 3.
