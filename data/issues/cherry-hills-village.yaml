- title: 2027 budget and temporary 0-mill property tax holiday
  summary: The draft 2027 budget cuts the Village property tax mill levy to 0 for 2027, about $8.5 million in relief (roughly $4M General Fund and $4.5M Parks Fund), or about $3,800 for the average homeowner. The levy could be restored starting in 2028. Council held a study session on Oct. 20 and a public hearing and first reading of the budget ordinance is scheduled; the draft also adds a Planner I position and a placeholder 10% compensation increase.
  where: Citywide
  refs:
  - 13
  topics:
  - Budget & taxes
- title: Ballot Question 2C and home rule authority over zoning
  summary: Council approved Resolution 29 supporting Ballot Question 2C, a Charter amendment referred to voters on Nov. 3, 2026, affirming the city's home rule authority over zoning and land use. Council asked for stronger language challenging state land use legislation framed as a statewide concern, and approved the resolution subject to an added whereas clause.
