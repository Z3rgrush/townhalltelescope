- title: 2027 budget and temporary property tax mill levy reduction to 0 mills
  summary: The draft 2027 budget temporarily cuts the Village property tax mill levy to 0 mills for 2027, about $8.5 million in relief (roughly $3,800 for the average homeowner), with the adopted levy restorable from 2028. Council held a study session on Oct. 20 and a public hearing on the budget ordinance was to follow; the draft also adds a Planner I position and a 10% compensation placeholder.
