- title: Ebike enforcement and park, trail and safety work plan
  summary: Police increased enforcement of existing ebike rules at Council's direction, producing 26 written warnings and a lot of public feedback by phone and email. The Parks, Trails & Recreation Commission's 2027 Work Plan adds items like a Trail Passport Program, Parks & Trails Visioning with safety improvements, bike lane improvements on Colorado, Quincy and Mansfield, and a pilot trail map sign at John Meade Park. Safety at High Line Canal crosswalks was also raised.
