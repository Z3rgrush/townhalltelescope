- title: Council opposes Front Range Passenger Rail District Ballot Issue 7A
  summary: Council took up Resolution 30 opposing Ballot Issue 7A, a tax increase for Front Range Passenger Rail District voters on the November ballot. Discussion focused on how the district was structured for taxing purposes and on a planned stop near Santa Fe, across from the City in unincorporated Jefferson County.
  where: Citywide; planned rail stop near Santa Fe
