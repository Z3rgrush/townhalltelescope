- title: 2027 budget and temporary 0-mill property tax holiday
  summary: The draft 2027 budget cuts the Village property tax mill levy to 0 for 2027, about $8.5 million in relief ($4M General Fund, $4.5M Parks Fund), roughly $3,800 for the average homeowner. The levy could be restored from 2028. Council held a study session on Oct. 20 with placeholders such as a 10% compensation increase and a new Planner I position; the budget ordinance hearing is scheduled.
  where: Citywide
  refs:
