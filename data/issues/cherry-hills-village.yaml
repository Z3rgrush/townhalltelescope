- title: Opposition to Front Range Passenger Rail District tax (Ballot Issue 7A)
  summary: Council took up Resolution 30 opposing Ballot Issue 7A, a tax increase on rail District voters on the November ballot. The objection is mainly about how the District was structured and used for taxing, including a planned stop near Santa Fe, rather than passenger rail itself.
  where: Citywide; planned stop near Santa Fe
