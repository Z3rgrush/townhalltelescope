- title: Día de los Muertos family event and Art Commission programs
  summary: The Art Commission planned a family-oriented Día de los Muertos event on Oct. 24 with a food truck, crafts, an author reading and loaned sculptures. It also worked on the Art in Public Places Master Plan, the 2027 Sculpture-on-Loan cycle, a Snow Plow Painting program with local schools, and whether to brighten the logo's red.
