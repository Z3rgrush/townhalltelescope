- title: Institutional zoning designation and lot frontage rules
  summary: Staff told the Planning and Zoning Commission that Council plans to create an institutional zoning designation, mainly for schools and churches, and rezone those properties from residential. Staff are also drafting lot frontage requirements, including for private streets such as in Glenmoor and Sunset Drive, after recent subdivision applications raised questions.
