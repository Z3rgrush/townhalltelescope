  topics:
  - Budget & taxes
  - Government operations
- title: 'Ballot Question 2C: home rule charter amendment on zoning and land use'
  summary: Council passed Resolution 29 supporting Ballot Question 2C, a Charter amendment going to voters on November 3, 2026. It affirms the City's home rule authority over zoning and land use against state land use legislation. Council asked for stronger wording and approved the resolution subject to an added whereas clause.
