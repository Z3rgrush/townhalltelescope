- title: Eight townhomes proposed at 207 Granite Street
  summary: A sketch plan review for eight townhomes at 207 Granite Street. Staff urged a sidewalk on Granite Street, and the project needs waivers for dumpster access and access from 2nd Avenue, a collector street. Commissioners noted the CC zoning allows residential by right, limiting the town's leverage, and that the site should blend with the historic park across the street.
