- title: 2027 budget, mill levy and appropriations
  summary: Council discussed the 2027 budget September 8. It then took up Ordinance 26-22 (appropriations) and Ordinance 26-23 (setting the town mill levy) on first reading October 13 and second reading October 27, along with Resolution 26-24 adopting the 2027 budget and 2027-2031 plan. A 2026 investment review showed a portfolio market value of $21.2 million and a 3.96% weighted average yield.
