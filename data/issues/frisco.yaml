- title: 'Ballot measure support: Summit County Strong Future mill levy and school district 4A'
  summary: Council considered Resolution 26-19 supporting Summit County's referred question to continue the Strong Future mill levy in perpetuity; it is not a new or increased tax. On October 13 it considered Resolution 26-26 supporting Summit School District RE-1 Ballot Measure 4A, a mill levy override for teacher and staff pay, and heard a school district and teachers' association presentation.
