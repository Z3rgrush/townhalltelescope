- title: Short-term rental cap and income-restricted housing
  summary: Staff asked Council at the October 13 work session whether to change how the short-term rental license cap is calculated. Currently all residential units, including deed-restricted ones like The Scout, count toward the total. An ordinance amending the STR licensing code (Ordinance 26-14) was on the October 27 agenda for first reading.
