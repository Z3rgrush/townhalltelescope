- title: 2027 budget and mid-year financial outlook
  summary: Council reviewed 2026 finances in a mid-year work session. A difficult winter with low snow, reduced visitation and lower sales tax means 2027 budget planning will need care. The 2027 budget was discussed Sept. 8, and Ordinances 26-22 (appropriations) and 26-23 (mill levy) came up for first reading Oct. 13.
