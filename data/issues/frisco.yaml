- title: 'Ballot measures: Summit County Strong Future mill levy and school district 4A'
  summary: Council considered resolutions in support of Summit County's referred reauthorization of the Strong Future mill levy (not a new or increased tax) and of Summit School District Ballot Measure 4A, a mill levy override for teacher and staff pay. The Summit County Education Association presented on Oct. 13.
