- title: Sixth Degree Town Homes at 121 E Main Street
  summary: The Planning Commission conducted final review of a major site plan for a mixed-use building with six residential and two commercial units at 121 E Main Street. Commissioners asked about parking lifts, lighting compliance, and an unlocated water line and easement responsibility.
