  summary: The Planning Commission held a hearing on August 20, 2026 on a fast-tracked review process for affordable housing to meet Proposition 123 state requirements. Council took up Ordinance 26-18, adding Section 180-2.8 to the Unified Development Code, on first reading September 8 and second reading September 22.
