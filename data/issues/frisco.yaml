- title: 2027 budget, mill levy and tax code changes
  summary: Council discussed the 2027 budget Sept. 8, then took up the appropriation ordinance and mill levy ordinance in October and adopted-budget resolution Oct. 27 including a 2027-2031 plan. On Nov. 10 Council considered an ordinance revising town tax code, including eliminating the sales tax vendor's fee.
