- title: Council strategic planning retreat
  summary: On August 25 Council held a retreat at the Summit Fire & EMS building to set strategic direction. It reviewed the current plan, which covers infrastructure, public safety, finances, water rates, housing (90–100 more income-restricted units since 2023), the Arts and Culture plan and recreation. A strategic plan briefing followed on October 27.
