- title: Elevation Volleyball annexation and initial zoning
  summary: Council accepted an annexation petition in August, then took up Ordinance 2026-O-12 (annexing the Elevation Volleyball property) and 2026-O-11 (initial zoning from Arapahoe County mixed use). Planning and Zoning reviewed the zoning on Sept. 9, and public hearings were set for Oct. 6, 2026.
