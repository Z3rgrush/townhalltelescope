- title: Elevation Volleyball Annexation and initial zoning
  summary: 'Council took up annexation of the Elevation Volleyball property: first reading of the annexation and initial zoning ordinances (2026-O-11 and 2026-O-12) on Sept. 15, then a Planning Commission review of zoning from Arapahoe County mixed use, and public hearings with findings of fact set for Oct. 6. An annexation petition resolution (2026-R-23) was also on the Aug. 18 agenda.'
