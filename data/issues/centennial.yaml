- title: Rezoning of Business Park land to Employment Center districts
  summary: The city is rezoning property from Business Park (BP75, BP100) to Employment Center districts, including land south of E. Nichols Ave and east of S. Akron St and west of S. Chester St. Planning and Zoning reviewed the rezonings on Nov. 4. Council set first readings on Nov. 2, with hearings proposed for Nov. 17, and discussed legislative zoning opportunities. A Sept. 15 closed-door legal session covered regulation of industrial and business park uses.
