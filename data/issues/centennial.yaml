  summary: Ordinance 2026-O-14 would rezone land north of East Fremont Avenue and east of Potomac Street from PUD to Employment Center – Light Industry 50. Further rezonings south of East Nichols and east of South Akron, and west of South Chester, from Business Park to Employment Center were on first reading Nov 2. Council also held a legal-advice session on regulating industrial and business parks and discussed legislative zoning opportunities.
