- title: Pathway Project legal representation (Healy Law Office)
  summary: The Council discussed a change to the agreement with Healy Law Office, the Town's attorneys on the Pathway Project, after the attorney who handled it moved on. Splitting the work between two firms would mean two separate bills, so the Town wants a single agreement.
