- title: 2026 budget workshops and December budget hearing
  summary: The Council held a budget workshop on Oct. 27-28, with another set for Nov. 18 at 6 p.m. and the budget hearing on Dec. 16. A resident, Bill McClure, asked whether the full budget will be available at the hearing and asked for a five-year goal-setting plan on a future agenda.
