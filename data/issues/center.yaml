- title: 'Water fund loan from Light & Power: repay or extend'
  summary: The water fund borrowed from the Light & Power fund in 2021 when it was running negative, and the Board must decide whether to extend the loan or pay it back. The interest on it is about $25,000 for the water fund, and the Water Department is still in the same financial position. A resolution is needed.
