- title: Contract and license confusion with Colorado Post
  summary: Council discussed a contract the Town signed, which new information from Colorado Post may void in part. The Town asked for the contract and not the other party, and the Town is asking Post to let it keep the license. The Town feels it was in good standing, and the Board needs to resolve the confusion.
