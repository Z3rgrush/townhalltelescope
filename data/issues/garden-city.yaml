- title: New Police Department building construction
  summary: The Board repeatedly approved Mark Young Construction change orders and invoices for the Police Department project, including a $301,598.32 November 2025 invoice and a June 2026 invoice. The police chief also noted the PD floor will be entirely replaced and grants were submitted.
