- title: 2026 budget, tax levy and employee raises
  summary: The Board held a public hearing on the 2026 budget in November, then on December 9 considered a 4% cost-of-living raise, a larger health insurance stipend for employees, and resolutions adopting the budget, appropriating funds and levying the general property tax.
