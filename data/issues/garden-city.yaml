- title: 2026 budget, property tax levy and employee raises
  summary: After a public hearing, the Board in December 2025 considered adopting the 2026 budget, appropriating funds and setting the general property tax levy. It also considered a 4% cost-of-living raise and a larger health insurance stipend for employees.
