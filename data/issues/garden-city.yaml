- title: Town Administrator/Clerk transition and Cheryl Campbell's resignation
  summary: On July 21, 2026 the Board accepted Town Administrator Cheryl Campbell's resignation and discussed handing the position over once Linda Blackston starts. An employment agreement and an alternate town attorney option were also on the agenda.
  where: Town Hall, 621 27th Street Road
