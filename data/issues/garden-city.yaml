- title: Town Administrator/Clerk transition and Cheryl Campbell's resignation
  summary: In July 2026 the Board discussed the transition of the Town Administrator/Town Clerk position once Linda Blackston starts, approved Cheryl Campbell's resignation letter, and took up an employment agreement and a related resolution. The Board also considered alternate attorney options.
  where: Town Hall, 621 27th Street Road
