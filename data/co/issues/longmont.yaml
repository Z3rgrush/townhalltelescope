- title: Vance Brand Airport noise and future
  summary: The city held a town hall on what it can and cannot legally do about airport noise, and council held a vision session on the airport's future, governance and rebuilding trust with neighbors.
  where: Vance Brand Municipal Airport, 229 Airport Rd
  refs: [0, 14, 43]
  public_comment: true
- title: First and Main urban renewal and downtown tax increment deals
  summary: The urban renewal authority approved tax increment revenue agreements with the city, Boulder County, Northern Water, St. Vrain Valley Schools and the Downtown Development Authority for the 1st and Main redevelopment area, which also came up at a joint meeting with county commissioners.
  where: 1st Avenue and Main Street
  refs: [12, 28, 36]
- title: Trash, compost and sanitation rates
  summary: Council discussed lining up waste and compost rates with city policy goals and asked the Sustainability Advisory Board for feedback on the sanitation rate structure.
  where: Citywide
  refs: [6, 14, 30]
- title: Water supply, drought and Ralph Price Reservoir
  summary: The Water Board weighed a one-year water exchange with the St. Vrain and Left Hand Water Conservancy District, whose supply could run out by 2028 in continued drought, reviewed how Ralph Price Reservoir is managed, and heard about the Dry Creek Fire near Button Rock.
  where: Button Rock Preserve / Ralph Price Reservoir
  refs: [11, 38, 67]
- title: Affordable housing and the inclusionary housing fee
  summary: The housing board reviewed the inclusionary housing ordinance, which requires 12% affordable units or a fee instead, as part of a housing needs update, and housing funding and demand for for-sale homes came up with county commissioners and the school board.
  where: Citywide
  refs: [9, 36, 71]
- title: Human services funding hearings
  summary: The Housing and Human Service Advisory Board set a scoring threshold and held weekly hearings with nonprofits applying for city human services funding.
  where: Citywide
  refs: [9, 25, 33, 41, 44, 48, 54, 64, 74]
- title: Show cause hearing for 333 Main Street liquor license
  summary: The licensing authority scheduled a show cause hearing on a bar at 333 Main Street over rowdiness, noise, disturbances and open container violations.
  where: 333 Main St
  refs: [16, 49]
- title: Platte River Power and clean energy goals
  summary: Platte River Power Authority told the Sustainability Advisory Board it cannot reach 100% noncarbon power by 2030 and is starting a new resource plan, and the board began work on the 2027 sustainability tax.
  where: Citywide
  refs: [14, 69]
- title: City flag redesign
  summary: A selection panel and the Art in Public Places Commission worked through submissions for a new official Longmont flag.
  where: Citywide
  refs: [15, 17, 31, 62]
- title: Automated checkout workforce impact fee
  summary: Council members discussed a possible fee on stores that replace cashiers with automated checkout.
  where: Citywide
  refs: [22]
- title: New homes at 10930 Airport Road
  summary: A neighborhood meeting covered a proposal for new single-family homes at 10930 Airport Road that would need a comprehensive plan amendment, rezoning and subdivision.
  where: 10930 Airport Rd
  refs: [63]
- title: Front Range Passenger Rail
  summary: The urban renewal authority considered a letter of support for Front Range Passenger Rail.
  where: Citywide
  refs: [28]
- title: Property tax burden
  summary: At its legislative dinner, council raised the gap between the property taxes residents pay and what cities receive.
