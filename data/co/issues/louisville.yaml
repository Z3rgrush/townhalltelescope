- title: Golf course fees and the Coal Creek Golf Fund deficit
  summary: With the golf fund's costs projected to outrun green fees, the recreation board modeled fee increases, heard golfers worried about losing the course's community culture, and sent 2027 fee and pass recommendations to council.
