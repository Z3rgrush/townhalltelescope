- title: Twelve-month moratorium on data centers
  summary: The Board of Trustees adopted a twelve-month moratorium on data centers on August 31, and staff told the planning commission the town has not yet received any data center proposals.
  where: Townwide
  refs: [3, 12]
  tags: [data-center]
- title: Waterfront Filing No. 2 mixed-use development
  summary: The planning commission recommended conditional approval of the Waterfront Filing No. 2 preliminary plat, focusing on traffic capacity, road improvements and trail connections, and called for coordinating transportation across nearby developments.
  where: Waterfront development
  refs: [2, 16]
- title: 2027 budget and improvement district budgets
  summary: The 2027 proposed budget was presented to trustees, along with budgets and mill levies for the Highway 66 and I-25 and Elevation 25 improvement districts and the urban renewal authority.
  where: Townwide
  refs: [4, 6, 7, 8, 9, 11, 12]
  public_comment: true
- title: Urban renewal tax increment incentive policy
  summary: The Mead Urban Renewal Authority took up a formal policy for judging developer requests for tax increment reimbursement, based on financial need, projected tax revenue and extraordinary costs.
  where: Urban renewal plan areas
  refs: [4, 5]
- title: Annexations and public facilities zoning
  summary: The planning commission recommended zoning for the town-owned Valdez annexation and 1785 Weld County Road 32, public facilities zoning for other town land, and the Ariet's Grove Filing No. 1 preliminary plat.
  where: Valdez property, 1785 WCR 32, Ariet's Grove
  refs: [3, 15]
- title: I-25 sewer relocation and Safe Routes to School
  summary: Trustees awarded construction contracts for the I-25 sewer relocation and the Mead Safe Routes to School project.
  where: I-25, Mead schools
  refs: [11]
- title: High Plains Boulevard, new library and police facility
  summary: The town marked the near-finished High Plains Boulevard expansion between WCR 32 and 36, accepted improvements for the new High Plains Library District branch, and broke ground on a new police facility in Liberty Ranch.
  where: High Plains Blvd, Liberty Ranch, Chaparral St
  refs: [10, 11, 12, 13, 14]
