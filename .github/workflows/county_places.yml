name: county-places
on:
  workflow_dispatch:
    inputs:
      region: {description: "Region id (ks or co)", default: "ks"}
permissions:
  contents: write
jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyshp shapely pyyaml
      - run: python scripts/county_places.py --region "${{ github.event.inputs.region }}"
      - run: |
          git config user.name "townhalltelescope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update county overlay for ${{ github.event.inputs.region }}"
          git pull --rebase -q && git push
