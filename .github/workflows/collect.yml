name: collect
on:
  workflow_dispatch:
    inputs:
      days: {description: "Lookback in days", default: "90"}
      only: {description: "Comma-separated source ids (blank = all)", required: false}
      no_text: {description: "List documents only, skip downloads", type: boolean, default: false}
  schedule:
    - cron: "0 9 * * 1"  # Mondays, 3am Mountain
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - env:
          DAYS: ${{ github.event.inputs.days || '90' }}
          ONLY: ${{ github.event.inputs.only }}
          NO_TEXT: ${{ github.event.inputs.no_text }}
        run: python -m collector.collect --region co --days "$DAYS" --only "$ONLY" $([ "$NO_TEXT" = "true" ] && echo --no-text)
      # Issue extraction needs the TOWNHALL_SECRET repository secret (an Anthropic API key). Without it the new
      # meetings are still collected, and the map keeps its current issues.
      - name: Extract issues and rebuild the map
        env:
          ANTHROPIC_API_KEY: ${{ secrets.TOWNHALL_SECRET }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No TOWNHALL_SECRET secret; skipping extraction"; exit 0; fi
          python scripts/condense.py
          python scripts/extract_issues.py
          python scripts/tag_issues.py
          python scripts/gun_scan.py
          python scripts/build_map.py
      - name: Commit results
        run: |
          git config user.name "townhalltelescope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Collect meetings $(date -u +%F)"
          git pull --rebase -q && git push
