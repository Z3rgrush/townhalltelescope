name: county-shares
on:
  workflow_dispatch:
    inputs:
      region: {description: "Region id (ks or co)", default: "ks"}
      counties: {description: "Census county names, separated by commas", required: true}
permissions:
  contents: write
jobs:
  shares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyshp shapely pyyaml
      - env:
          COUNTIES: ${{ github.event.inputs.counties }}
          REGION: ${{ github.event.inputs.region }}
        run: |
          IFS=',' read -ra C <<< "$COUNTIES"
          python scripts/county_shares.py --region "$REGION" "${C[@]}"
      - run: |
          git config user.name "townhalltelescope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "County shares for ${{ github.event.inputs.counties }}"
          git pull --rebase -q && git push
