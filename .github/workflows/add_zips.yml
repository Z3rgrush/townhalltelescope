name: add-zips
on:
  workflow_dispatch:
    inputs:
      region: {description: "Region id (co)", default: "co"}
      cities: {description: "Census place names, separated by commas", required: true}
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyshp shapely pyyaml
      - env:
          CITIES: ${{ github.event.inputs.cities }}
          REGION: ${{ github.event.inputs.region }}
        run: |
          IFS=',' read -ra C <<< "$CITIES"
          python scripts/add_zips.py --region "$REGION" "${C[@]}"
          python scripts/zip_places.py --region "$REGION"
      - run: |
          git config user.name "townhalltelescope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add zips for ${{ github.event.inputs.cities }}"
          git pull --rebase -q && git push
