name: master-list
on:
  workflow_dispatch:
    inputs:
      only: {description: "Comma-separated government ids (blank = all)", required: false}
permissions:
  contents: write
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml pypdf
      - run: python scripts/master_list.py --only "${{ github.event.inputs.only }}"
      - run: |
          git config user.name "townhalltelescope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/governments.csv data/governments.md
          git diff --cached --quiet || git commit -m "Master list of Colorado governments"
          git pull --rebase -q && git push
