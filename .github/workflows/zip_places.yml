name: zip-places
on: workflow_dispatch
permissions:
  contents: write
jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyshp shapely
      - run: python scripts/zip_places.py
      - run: |
          git config user.name "townhalltelescope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/zip_places.csv
          git diff --cached --quiet || git commit -m "Update zip-to-city overlay"
          git pull --rebase -q && git push
