name: geography
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geography:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyshp shapely pyyaml
      - run: python scripts/geography.py
      - run: |
          git config user.name "townhalltelescope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Statewide geography"
          git pull --rebase -q && git push
