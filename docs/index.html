<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Town Hall Telescope</title>
<meta name="description" content="What local governments in Johnson and Wyandotte counties, Kansas, have been discussing, by zip code.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d232a; --muted: #5d6670; --line: #e2e0da;
  --accent: #1f6f8b; --accent-soft: #e3f0f4; --chip: #f1efe9; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --z0: #eef3f5; --z1: #cfe2ea; --z2: #9fc6d6; --z3: #5f9fb9; --z4: #1f6f8b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181c; --panel: #1c2227; --ink: #e8eaec; --muted: #9aa4ad; --line: #2e363d;
    --accent: #6fb6d0; --accent-soft: #1f3540; --chip: #262d33; --warn: #e2b55c; --warn-soft: #3a2f1a;
    --z0: #24313a; --z1: #2b4a5a; --z2: #33647a; --z3: #4a87a3; --z4: #6fb6d0;
  }
}
:root[data-theme="dark"] {
  --bg: #14181c; --panel: #1c2227; --ink: #e8eaec; --muted: #9aa4ad; --line: #2e363d;
  --accent: #6fb6d0; --accent-soft: #1f3540; --chip: #262d33; --warn: #e2b55c; --warn-soft: #3a2f1a;
  --z0: #24313a; --z1: #2b4a5a; --z2: #33647a; --z3: #4a87a3; --z4: #6fb6d0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
#map { height: 100%; background: var(--bg); }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 20px 20px 32px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
form { display: flex; gap: 8px; margin-bottom: 18px; }
input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
button { padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
:root[data-theme="dark"] button { color: #0d1418; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button { color: #0d1418; } }
.zip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 0 6px; }
.zip-head h2 { margin: 0; font-size: 26px; }
.govs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
.govs li { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.govs li.none { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.issue { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.issue h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.35; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.tag { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 7px; font-weight: 600; }
.tag.voice { background: var(--warn-soft); color: var(--warn); }
.where { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.issue p { margin: 0 0 8px; }
details { font-size: 13px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details ul { margin: 6px 0 0; padding-left: 18px; }
details a { color: var(--accent); }
.empty, .note { color: var(--muted); font-size: 14px; }
.note { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 12px; font-size: 12.5px; }
.legend { background: var(--panel); color: var(--ink); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; line-height: 1.6; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.leaflet-tooltip { font-weight: 600; }
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 48vh auto; height: auto; }
  #map { height: 48vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 16px 16px 28px; }
}
</style>
</head>
<body>
<div class="app">
  <div id="map" role="application" aria-label="Map of zip codes"></div>
  <aside>
    <h1>Town Hall Telescope</h1>
    <p class="lede">What city councils and county commissions in Johnson and Wyandotte counties, Kansas, have been talking about. Tap a zip code, or type one.</p>
    <form id="find"><input id="zip" inputmode="numeric" maxlength="5" placeholder="Zip code, e.g. 66205" aria-label="Zip code"><button>Show</button></form>
    <div id="detail"><p class="empty">Darker zips had more of their local issues come up at more meetings.</p></div>
    <p class="note" id="about"></p>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"});

Promise.all(["data/zips.geojson", "data/zips.json", "data/issues.json"].map(u => fetch(u).then(r => r.json())))
.then(([geo, zips, issues]) => {
  const dates = Object.values(issues).flatMap(i => i.sources.map(s => s.date)).sort();
  document.getElementById("about").innerHTML =
    `Built from public agendas and minutes dated ${fmtDate(dates[0])} to ${fmtDate(dates[dates.length - 1])}. ` +
    `Issue summaries were written by AI from those documents and can contain mistakes, so follow the source links before relying on one. ` +
    `Governments shown crossed out have no records collected yet. <a href="https://github.com/Z3rgrush/townhalltelescope">Source and data</a>.`;

  const heat = z => (zips[z]?.issues || []).reduce((n, id) => n + issues[id].meetings, 0);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const color = h => css(h >= 31 ? "--z4" : h >= 26 ? "--z3" : h >= 20 ? "--z2" : h >= 1 ? "--z1" : "--z0");

  const map = L.map("map", {zoomSnap: 0.25});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 16, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  let selected = null;
  const style = f => ({
    color: f.properties.zip === selected ? css("--ink") : css("--panel"),
    weight: f.properties.zip === selected ? 3 : 1,
    fillColor: color(heat(f.properties.zip)), fillOpacity: 0.72
  });
  const layers = {};
  const layer = L.geoJSON(geo, {
    style,
    onEachFeature: (f, l) => {
      layers[f.properties.zip] = l;
      l.bindTooltip(f.properties.zip, {sticky: true});
      l.on("click", () => show(f.properties.zip));
    }
  }).addTo(map);
  map.fitBounds(layer.getBounds(), {padding: [10, 10]});

  const legend = L.control({position: "bottomleft"});
  legend.onAdd = () => {
    const d = L.DomUtil.create("div", "legend");
    d.innerHTML = "<b>Meetings covering top issues</b><br>" +
      [["--z0", "no records yet"], ["--z1", "1–19"], ["--z2", "20–25"], ["--z3", "26–30"], ["--z4", "31+"]]
        .map(([v, t]) => `<i style="background:${css(v)}"></i>${t}`).join("<br>");
    return d;
  };
  legend.addTo(map);

  function show(z, pan) {
    const info = zips[z];
    const box = document.getElementById("detail");
    if (!info) { box.innerHTML = `<p class="empty">${esc(z)} isn't in this pilot yet. It covers zip codes in Johnson and Wyandotte counties.</p>`; return; }
    selected = z;
    layer.setStyle(style);
    layers[z].bringToFront();
    if (pan) map.fitBounds(layers[z].getBounds(), {maxZoom: 13});
    history.replaceState(null, "", "#" + z);
    const govs = info.governments.map(g =>
      `<li class="${g.has_records ? "" : "none"}" title="${Math.round(g.share * 100)}% of the zip's area${g.has_records ? "" : " · no records collected yet"}">${esc(g.name)}</li>`).join("");
    const cards = info.issues.map(id => {
      const it = issues[id];
      const src = it.sources.map(s =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${fmtDate(s.date)} · ${esc(s.body)} ${esc(s.kind)}</a></li>`).join("");
      return `<article class="issue">
        <h3>${esc(it.title)}</h3>
        <div class="meta"><span>${esc(it.government)}</span>
          <span class="tag">${it.meetings} meeting${it.meetings === 1 ? "" : "s"}</span>
          ${it.public_comment ? '<span class="tag voice">Residents spoke</span>' : ""}</div>
        ${it.where ? `<p class="where">📍 ${esc(it.where)}</p>` : ""}
        <p>${esc(it.summary)}</p>
        <details><summary>Source documents (${it.sources.length})</summary><ul>${src}</ul></details>
      </article>`;
    }).join("");
    box.innerHTML = `<div class="zip-head"><h2>${esc(z)}</h2></div>
      <ul class="govs" aria-label="Governments covering this zip">${govs}</ul>
      ${cards || '<p class="empty">No issues found yet for the governments covering this zip.</p>'}`;
  }

  document.getElementById("find").addEventListener("submit", e => {
    e.preventDefault();
    show(document.getElementById("zip").value.trim(), true);
  });
  const fromHash = location.hash.slice(1);
  if (zips[fromHash]) show(fromHash, true);
})
.catch(() => { document.getElementById("detail").innerHTML = '<p class="empty">The map data could not be loaded. Try refreshing.</p>'; });
</script>
</body>
</html>
