<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Town Hall Telescope</title>
<meta name="description" content="What local governments in the Denver and Boulder area of Colorado have been discussing, by zip code or county.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antic+Didone&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #eef0f3; --panel: #ffffff; --ink: #0c0f14; --muted: #555d68; --line: #d3d7de;
  --accent: #3346d3; --accent-soft: #e4e7fb; --chip: #e6e9ee; --warn: #7a5c00; --warn-soft: #f6efd2;
  --z0: #e8eaf6; --z1: #c3c9f2; --z2: #8f9ae6; --z3: #5a69d8; --z4: #3346d3;
  --hl: #f26b1d; --hl-soft: #f9c39f; --hl-ink: #b8470a; --hl-bg: #fdebdd; --off: #e2e5ea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c10; --panel: #11141a; --ink: #ffffff; --muted: #9ba3af; --line: #272c35;
    --accent: #8794ff; --accent-soft: #1b1f3d; --chip: #1b1f27; --warn: #e5c15a; --warn-soft: #2e2812;
    --z0: #171a26; --z1: #22295a; --z2: #33408f; --z3: #5062cc; --z4: #8794ff;
    --hl: #ff7a2e; --hl-soft: #7a3814; --hl-ink: #ff9a5c; --hl-bg: #2c1a0e; --off: #161920;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0c10; --panel: #11141a; --ink: #ffffff; --muted: #9ba3af; --line: #272c35;
  --accent: #8794ff; --accent-soft: #1b1f3d; --chip: #1b1f27; --warn: #e5c15a; --warn-soft: #2e2812;
  --z0: #171a26; --z1: #22295a; --z2: #33408f; --z3: #5062cc; --z4: #8794ff;
  --hl: #ff7a2e; --hl-soft: #7a3814; --hl-ink: #ff9a5c; --hl-bg: #2c1a0e; --off: #161920;
}
* { box-sizing: border-box; }
/* Square corners everywhere, including Leaflet's own controls, tooltips and popups. */
*, *::before, *::after { border-radius: 0 !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Antic Didone", Georgia, serif; }
.leaflet-container { font-family: inherit; }
.app { display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
#map { height: 100%; background: var(--bg); }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 20px 20px 32px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
form { display: flex; gap: 8px; margin-bottom: 18px; }
input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
button { padding: 9px 14px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
:root[data-theme="dark"] button:not(.toggle) { color: #0a0c10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.toggle) { color: #0a0c10; } }
.zip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 0 6px; }
.zip-head h2 { margin: 0; font-size: 26px; }
.govs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
.govs li { background: var(--chip); padding: 3px 10px; font-size: 13px; }
.govs li.none { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.issue { border: 1px solid var(--line); padding: 14px; margin-bottom: 12px; }
.issue h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.35; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.tag { background: var(--accent-soft); color: var(--accent); padding: 1px 7px; font-weight: 600; }
.tag.voice { background: var(--warn-soft); color: var(--warn); }
.where { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.issue p { margin: 0 0 8px; }
details { font-size: 13px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details ul { margin: 6px 0 0; padding-left: 18px; }
details a { color: var(--accent); }
.empty, .note { color: var(--muted); font-size: 14px; }
a { color: var(--accent); }
.note { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 12px; font-size: 12.5px; }
.legend { background: var(--panel); color: var(--ink); padding: 8px 10px; border: 1px solid var(--line); font-size: 12px; line-height: 1.6; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; }
.leaflet-tooltip { font-weight: 600; background: var(--panel); color: var(--ink); border-color: var(--line); box-shadow: none; }
.leaflet-tooltip-top::before { border-top-color: var(--panel); }
.leaflet-bar { border: 1px solid var(--line) !important; box-shadow: none !important; }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-container .leaflet-control-attribution { background: var(--panel); color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 8px; margin: -6px 0 18px; padding: 7px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 14px; }
.toggle::before { content: ""; width: 10px; height: 10px; background: var(--hl); }
.toggle[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); color: #fff; }
.toggle[aria-pressed="true"]::before { background: #fff; }
.tag.dc { background: var(--hl-bg); color: var(--hl-ink); }
.callout { background: var(--hl-bg); padding: 12px 12px 2px; margin-bottom: 16px; }
.callout h4 { margin: 0 0 4px; font-size: 14px; color: var(--hl-ink); }
.callout > p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.callout .issue { background: var(--panel); }
.unit { display: inline-flex; margin: 0 0 14px; border: 1px solid var(--line); }
.unit button { padding: 6px 14px; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 14px; }
.unit button[aria-pressed="true"] { background: var(--ink); color: var(--panel) !important; }
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 48vh auto; height: auto; }
  #map { height: 48vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 16px 16px 28px; }
}
</style>
</head>
<body>
<div class="app">
  <div id="map" role="application" aria-label="Map of zip codes"></div>
  <aside>
    <h1>Town Hall Telescope</h1>
    <p class="lede">What city and town councils and county commissions in the Denver and Boulder area of Colorado have been talking about. Tap the map, or type a zip code or county.</p>
    <form id="find"><input id="zip" placeholder="Zip or county, e.g. 80302 or Boulder" aria-label="Zip code or county name"><button>Show</button></form>
    <div class="unit" id="unit" role="group" aria-label="Show the map by"><button type="button" data-unit="zip" aria-pressed="true">Zip codes</button><button type="button" data-unit="county" aria-pressed="false">Counties</button></div>
    <button type="button" class="toggle" id="dc" aria-pressed="false">Highlight data center talk</button>
    <div id="detail"></div>
    <p class="note" id="about"></p>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// What differs between the region pages. The rest of this file is shared: keep co/index.html in step.
const PAGE = {area: "the Denver and Boulder area", bins: {zip: [25, 31, 41], county: [30, 45, 60]}};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"});
const slug = s => s.toLowerCase().replace(/[^a-z]+/g, "-");

Promise.all(["data/zips.geojson", "data/zips.json", "data/counties.geojson", "data/counties.json", "data/issues.json"]
  .map(u => fetch(u).then(r => r.json())))
.then(([zipGeo, zips, countyGeo, countyData, issues]) => {
  const dates = Object.values(issues).flatMap(i => i.sources.map(s => s.date)).sort();
  document.getElementById("about").innerHTML =
    `Built from public agendas and minutes dated ${fmtDate(dates[0])} to ${fmtDate(dates[dates.length - 1])}. ` +
    `Issue summaries were written by AI from those documents and can contain mistakes, so follow the source links before relying on one. ` +
    `Governments shown crossed out have no records collected yet. <a href="https://github.com/Z3rgrush/townhalltelescope">Source and data</a>.`;

  // The map can be drawn by zip code or by county. Each unit names its records, shapes and wording.
  const UNITS = {
    zip: {records: zips, geo: zipGeo, key: f => f.properties.zip, name: z => z, hash: z => z, plural: "zips",
          govsLabel: "Governments covering this zip", govTitle: g => `${Math.round(g.share * 100)}% of the zip's area`,
          siteHere: "A data center site discussed in public meetings is in this zip.",
          siteElsewhere: "The site is in a nearby zip, but a local government that covers this zip discussed it.",
          noSite: "A local government that covers this zip discussed data centers, though not a specific site.",
          empty: "Darker zips had more of their local issues come up at more meetings.", zoom: 13},
    county: {records: countyData.counties, geo: countyGeo, key: f => f.properties.county, name: c => c + " County", hash: slug, plural: "counties",
          govsLabel: "Governments in this county", govTitle: g => g.share < 1 ? `${Math.round(g.share * 100)}% of the city is in this county` : "",
          siteHere: "A data center site discussed in public meetings is in this county.",
          siteElsewhere: "The site is in another county, but a local government here discussed data centers.",
          noSite: "A local government here discussed data centers, though not a specific site.",
          empty: "Darker counties had more of their local issues come up at more meetings.", zoom: 11},
  };
  let unit = "zip", U = UNITS.zip;

  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const heat = k => (U.records[k]?.issues || []).reduce((n, id) => n + issues[id].meetings, 0);
  const color = h => { const [b2, b3, b4] = PAGE.bins[unit];
    return css(h >= b4 ? "--z4" : h >= b3 ? "--z3" : h >= b2 ? "--z2" : h >= 1 ? "--z1" : "--z0"); };

  const map = L.map("map", {zoomSnap: 0.25});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 16, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  let selected = null, highlight = false, layer = null, layers = {};
  const dc = k => U.records[k]?.tagged?.["data-center"];
  const siteCount = () => Object.values(U.records).filter(v => v.tagged?.["data-center"]?.site).length;
  const fill = k => !highlight ? color(heat(k)) : dc(k) ? css(dc(k).site ? "--hl" : "--hl-soft") : css("--off");
  const style = f => { const k = U.key(f); return {
    color: k === selected ? css("--ink") : css("--panel"),
    weight: k === selected ? 3 : unit === "zip" ? 1 : 1.5,
    fillColor: fill(k), fillOpacity: highlight && !dc(k) ? 0.45 : unit === "zip" ? 0.72 : 0.62
  }; };
  const draw = () => {
    if (layer) layer.remove();
    layers = {};
    layer = L.geoJSON(U.geo, {
      style,
      onEachFeature: (f, l) => {
        const k = U.key(f);
        layers[k] = l;
        l.bindTooltip(U.name(k), {sticky: true});
        l.on("click", () => show(k));
      }
    }).addTo(map);
  };

  const legend = L.control({position: "bottomleft"});
  let legendBox;
  const drawLegend = () => {
    const [b2, b3, b4] = PAGE.bins[unit], one = U.plural === "zips" ? "zip" : "county";
    legendBox.innerHTML = highlight
      ? "<b>Data center discussions</b><br>" + [["--hl", `site is in this ${one}`], ["--hl-soft", "a local government here discussed one"], ["--off", "none found"]]
          .filter(([v]) => v !== "--hl" || siteCount()).map(([v, t]) => `<i style="background:${css(v)}"></i>${t}`).join("<br>")
      : "<b>Meetings covering top issues</b><br>" + [["--z0", "no records yet"], ["--z1", `1–${b2 - 1}`], ["--z2", `${b2}–${b3 - 1}`], ["--z3", `${b3}–${b4 - 1}`], ["--z4", `${b4}+`]]
          .map(([v, t]) => `<i style="background:${css(v)}"></i>${t}`).join("<br>");
  };
  legend.onAdd = () => { legendBox = L.DomUtil.create("div", "legend"); drawLegend(); return legendBox; };
  legend.addTo(map);

  // A search is a zip code or a county name ("Johnson", "Johnson County"). Returns [unit, key].
  const find = q => {
    q = q.trim();
    if (/^\d{5}$/.test(q)) return unit === "county" && countyData.zips[q] ? ["county", countyData.zips[q]] : ["zip", q];
    const name = q.replace(/\s+county$/i, "").toLowerCase();
    const c = Object.keys(countyData.counties).find(c => c.toLowerCase() === name || slug(c) === name);
    return c ? ["county", c] : [unit, q];
  };

  function show(k, pan) {
    const info = U.records[k];
    const box = document.getElementById("detail");
    if (!info) { box.innerHTML = `<p class="empty">${esc(k)} isn't in this pilot yet. It covers ${PAGE.area}.</p>`; return; }
    selected = k;
    layer.setStyle(style);
    layers[k].bringToFront();
    if (pan) map.fitBounds(layers[k].getBounds(), {maxZoom: U.zoom});
    history.replaceState(null, "", "#" + U.hash(k) + (highlight ? "&datacenters" : ""));
    const govs = info.governments.map(g => {
      const title = [U.govTitle(g), g.has_records ? "" : "no records collected yet"].filter(Boolean).join(" · ");
      return `<li class="${g.has_records ? "" : "none"}"${title ? ` title="${esc(title)}"` : ""}>${esc(g.name)}</li>`;
    }).join("");
    const card = id => {
      const it = issues[id];
      const src = it.sources.map(s =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${fmtDate(s.date)} · ${esc(s.body)} ${esc(s.kind)}</a></li>`).join("");
      return `<article class="issue">
        <h3>${esc(it.title)}</h3>
        <div class="meta"><span>${esc(it.government)}</span>
          <span class="tag">${it.meetings} meeting${it.meetings === 1 ? "" : "s"}</span>
          ${it.public_comment ? '<span class="tag voice">Residents spoke</span>' : ""}
          ${it.tags.includes("data-center") ? '<span class="tag dc">Data center</span>' : ""}</div>
        ${it.where ? `<p class="where">📍 ${esc(it.where)}</p>` : ""}
        <p>${esc(it.summary)}</p>
        <details><summary>Source documents (${it.sources.length})</summary><ul>${src}</ul></details>
      </article>`;
    };
    const dcIds = dc(k)?.ids || [];
    const callout = highlight && dcIds.length ? `<section class="callout"><h4>Data center discussions</h4>
      <p>${dc(k).site ? U.siteHere : siteCount() ? U.siteElsewhere : U.noSite}</p>
      ${dcIds.map(card).join("")}</section>` : "";
    const cards = callout + info.issues.filter(id => !(callout && dcIds.includes(id))).map(card).join("");
    box.innerHTML = `<div class="zip-head"><h2>${esc(U.name(k))}</h2></div>
      <ul class="govs" aria-label="${U.govsLabel}">${govs}</ul>
      ${cards || '<p class="empty">No issues found yet for these governments.</p>'}`;
  }

  const idle = () => {
    const box = document.getElementById("detail");
    if (!highlight) { box.innerHTML = `<p class="empty">${U.empty}</p>`; return; }
    const n = siteCount(), any = Object.values(U.records).filter(v => v.tagged?.["data-center"]).length;
    box.innerHTML = `<p class="empty">${n ? `${n} ${U.plural} hold a data center site that came up in public meetings, and ` : "No specific data center site came up, but "}${any} ${U.plural} ${n ? "in all " : ""}have a local government that discussed ${n ? "one" : "data centers"}. Tap an orange one for details.</p>`;
  };

  const unitButtons = document.querySelectorAll("#unit button");
  const setUnit = (u, keepView) => {
    if (u === unit && layer) return;
    // Carry the selection across: a zip becomes its county, a county becomes nothing selected.
    const next = u === "county" && selected ? countyData.zips[selected] || null : null;
    unit = u; U = UNITS[u]; selected = null;
    unitButtons.forEach(b => b.setAttribute("aria-pressed", b.dataset.unit === u));
    document.getElementById("map").setAttribute("aria-label", `Map of ${U.plural}`);
    draw();
    if (!keepView) map.fitBounds(layer.getBounds(), {padding: [10, 10]});
    drawLegend();
    if (next) show(next); else { history.replaceState(null, "", highlight ? "#datacenters" : location.pathname); idle(); }
  };
  unitButtons.forEach(b => b.addEventListener("click", () => setUnit(b.dataset.unit, true)));

  const toggle = document.getElementById("dc");
  const setHighlight = on => {
    highlight = on;
    toggle.setAttribute("aria-pressed", on);
    layer.setStyle(style);
    drawLegend();
    if (selected) show(selected); else idle();
  };
  toggle.addEventListener("click", () => setHighlight(!highlight));

  document.getElementById("find").addEventListener("submit", e => {
    e.preventDefault();
    const [u, k] = find(document.getElementById("zip").value);
    setUnit(u, true);
    show(k, true);
  });

  const [fromHash, flag] = location.hash.slice(1).split("&");
  const [u, k] = fromHash && fromHash !== "datacenters" ? find(fromHash) : ["zip", null];
  setUnit(u);
  if (flag === "datacenters" || fromHash === "datacenters") setHighlight(true);
  if (k && U.records[k]) show(k, true);
})
.catch(() => { document.getElementById("detail").innerHTML = '<p class="empty">The map data could not be loaded. Try refreshing.</p>'; });
</script>
</body>
</html>
