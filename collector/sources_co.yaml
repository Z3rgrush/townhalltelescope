# Boulder/Denver region: Denver, Boulder and Broomfield counties (see data/co/zips.csv).
- id: denver
  name: Denver
  county: Denver
  adapter: legistar
  client: denver
- id: boulder
  name: Boulder
  county: Boulder
  adapter: primegov
  tenant: bouldercolorado
- id: longmont
  name: Longmont
  county: Boulder
  adapter: primegov
  tenant: longmont
- id: broomfield
  name: Broomfield
  county: Broomfield
  # Boards come from AgendaCenter. The council's AgendaLink portal is JavaScript-only, so council
  # meetings come from the city's Cablecast video archive, whose chapters list the agenda items.
  adapter: agendacenter
  base: https://broomfield.org
  also:
    - adapter: cablecast
      base: https://vod.broomfield.org
      search: council
      titles: City Council
- id: boulder-county
  name: Boulder County
  county: Boulder
  # eScribe files sit behind a bot check, which we leave alone. The county's events calendar
  # describes each commissioners' public meeting and hearing, which is what we read instead.
  adapter: wp_events
  base: https://www.bouldercounty.gov
  categories: county-commissioners
  titles: "^Public (Meeting|Hearing)|Town Hall|Work Session"
- id: louisville
  name: Louisville
  county: Boulder
  adapter: civicclerk
  tenant: louisvilleco
- id: superior
  name: Superior
  county: Boulder
  adapter: civicclerk
  tenant: superiorco
- id: erie
  name: Erie
  county: Boulder
  adapter: civicclerk
  tenant: erieco
- id: lafayette
  name: Lafayette
  county: Boulder
  adapter: linkscan
  # Archive.aspx builds its module links with JavaScript, but each module page is plain HTML.
  pages:
    - https://www.lafayetteco.gov/Archive.aspx?AMID=37
    - https://www.lafayetteco.gov/Archive.aspx?AMID=38
  follow: "Archive\\.aspx\\?ADID="
- id: glendale
  name: Glendale
  county: Arapahoe
  adapter: agendacenter
  base: https://www.glendale.co.us

# Neighbors that cover part of a pilot zip.
- id: aurora
  name: Aurora
  county: Arapahoe
  # AuroraTV's meeting video pages link each council agenda.
  adapter: linkscan
  pages:
    - https://www.auroratv.org/series/city-council-meetings
  follow: "/video/.*city-council"
- id: thornton
  name: Thornton
  county: Adams
  adapter: primegov
  tenant: thorntonco
- id: frederick
  name: Frederick
  county: Weld
  adapter: civicclerk
  tenant: frederickco
- id: firestone
  name: Firestone
  county: Weld
  adapter: civicclerk
  tenant: firestoneco
- id: mead
  name: Mead
  county: Weld
  adapter: civicclerk
  tenant: meadco
- id: commerce-city
  name: Commerce City
  county: Adams
  adapter: legistar
  client: commerce
- id: lyons
  name: Lyons
  county: Boulder
  adapter: agendacenter
  base: https://townoflyons.com
- id: nederland
  name: Nederland
  county: Boulder
  adapter: civicweb
  base: https://nederlandco.civicweb.net
  bodies: "Board|Trustee|Planning|Commission"
