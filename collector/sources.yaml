# Where each government posts agendas and minutes, and which scraper reads it.
# adapters: civicweb, civicclerk, agendacenter, linkscan (see collector/adapters.py)
# bodies: optional regex; only meetings whose body name matches are kept.

- id: overland-park
  name: Overland Park
  county: Johnson
  adapter: civicweb
  base: https://opkansas.civicweb.net
  bodies: "Council|Committee|Planning|Public Safety|Community Development|Finance"

- id: leawood
  name: Leawood
  county: Johnson
  adapter: civicweb
  base: https://leawood.civicweb.net
  bodies: "Governing Body|Planning|Committee|Zoning|Land Bank"

- id: shawnee
  name: Shawnee
  county: Johnson
  adapter: civicweb
  base: https://cityofshawnee.civicweb.net
  bodies: "Council|Planning"

