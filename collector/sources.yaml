- id: broomfield
  name: Broomfield
  county: Broomfield
  # Boards come from AgendaCenter. The council's AgendaLink portal is JavaScript-only, so council
  # meetings come from the city's Cablecast video archive, whose chapters list the agenda items.
  adapter: agendacenter
  base: https://broomfield.org
  also:
    - adapter: cablecast
      base: https://vod.broomfield.org
      search: council
      titles: City Council
- id: boulder-county
  name: Boulder County
  county: Boulder
  # eScribe files sit behind a bot check, which we leave alone; the portal's agenda and minutes pages
  # are plain public HTML, so we read those. The events calendar adds hearing and town hall blurbs.
  adapter: escribe
  base: https://pub-bouldercounty.escribemeetings.com
  html: true
  bodies: Commissioners|Planning Commission
  also:
    - adapter: wp_events
      base: https://www.bouldercounty.gov
      categories: county-commissioners
      titles: "^Public (Meeting|Hearing)|Town Hall|Work Session"
